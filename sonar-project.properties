# SonarCloud analysis for UiPath/skills, read by .pipelines/jobs/ci.quality.sonar.yml
# (SonarCloudPrepare in configMode 'file'; the organization `ui` is set by the template).
#
# Counted code: repo tooling (scripts/, hooks/, workflow helpers) and the scripts the
# skills ship. Skill Markdown is not code; flow examples are teaching material; the
# eval grader Python under tests/ is test code.

# Set as a (non-secret) variable on the ADO pipeline definition that runs
# .pipelines/quality.yml; ADO exposes pipeline variables to every step as
# environment variables.
sonar.projectKey=${env.SONAR_PROJECT_KEY}
sonar.projectName=UiPath Skills
sonar.sourceEncoding=UTF-8

sonar.sources=scripts,hooks,.github/workflows/scripts,skills
sonar.inclusions=**/*.py,**/*.mjs,**/*.js,**/*.cjs
sonar.exclusions=**/tests/**,**/*.test.mjs,skills/uipath-maestro-flow/examples/**,**/node_modules/**
# The coverage driver itself: it starts every suite, so no test can measure it.
sonar.coverage.exclusions=scripts/run-coverage.mjs

sonar.tests=tests,skills/uipath-coded-apps/assets/scripts/dashboards/tests
# Keep these path-scoped: Sonar also excludes test.inclusions matches from the
# sources, so a bare **/*.py here leaves no source files at all.
sonar.test.inclusions=tests/**/*.py,tests/**/*.mjs,tests/**/*.js,skills/**/tests/**/*.mjs

sonar.python.version=3.13
sonar.python.coverage.reportPaths=coverage/coverage.xml
sonar.javascript.lcov.reportPaths=coverage/lcov.info
