name: Sprint Release Cut

# Biweekly per-sprint release cut (skills side of the CLI↔skills lockstep,
# PILOT-5518). Runs Sunday 06:00 UTC — 6 hours BEFORE the CLI's own cut
# (12:00 UTC). Self-anchored and self-driven: it does NOT read the CLI
# version (skills lead, never follow).
#
# Model: `main` carries the line currently in development (M.N.0). On each
# release Sunday it:
#
#   1. cuts release/v<M.N> from main at the version ALREADY in main (M.N.0) —
#      the release branch matches main's current version, it is NOT bumped
#   2. dispatches publish.yml with channel=preview and waits for it: default
#      to npmjs and Studio Web to GitHub Packages when enabled. The bot's own
#      branch push can't trigger publish.yml (GITHUB_TOKEN recursion guard), so
#      the dispatch is explicit. No dev build: main already published dev for
#      this commit, and `dev` tracks main only (a dev build from the release
#      branch would move the tag back once main is bumped). Stable (`latest`)
#      is NOT published here — promote a line to stable MANUALLY (see
#      docs/RELEASE.md)
#   3. opens a PR bumping main to the NEXT line (M.(N+1).0). The PR is opened
#      even if step 2's publish failed — with a :warning: in the PR body — so
#      main can still advance; a maintainer reviews the warning before merging.
#      main is protected on a public repo, so the cut does NOT push to main or
#      use a bypass credential (see docs/RELEASE.md § Automating the bump)
#
# No cross-repo secret is required, gated to the CLI's 14-day cadence (anchor
# below). The cli-repo side cuts itself, in lockstep, from the same anchor.

on:
  schedule:
    - cron: '0 6 * * 0' # Sunday 06:00 UTC — 6 h before the CLI cut (12:00 UTC)
  workflow_dispatch:
    inputs:
      minor_override:
        description: 'Line to cut as MAJOR.MINOR (e.g. 1.198) — skips the cadence gate; cuts exactly this line'
        required: false
        default: ''
      dry_run:
        description: 'Print the computed plan without pushing, publishing, or opening a PR'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pull-requests: write
  # `gh workflow run publish.yml` (POST /actions/workflows/{id}/dispatches)
  # needs this. An explicit block sets every unlisted scope to `none`, so
  # omitting it 403s the dispatch and the cut publishes nothing.
  actions: write

# GitHub cron runs in UTC and cannot express "every two Sundays" — fire every
# Sunday, then gate on the 14-day cadence anchor (mirrors UiPath/cli).
env:
  RELEASE_CADENCE_ANCHOR: "2026-06-14"

# Serialize cuts so a scheduled run and a manual dispatch can't race.
concurrency:
  group: release-line-updates
  cancel-in-progress: false

jobs:
  cut:
    runs-on: uipath-ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22.x"

      - name: Cadence gate and resolve lines
        id: target
        env:
          MINOR_OVERRIDE: ${{ github.event.inputs.minor_override }}
        run: |
          set -euo pipefail
          # The line to cut is the version ALREADY in main (see header). main is
          # advanced to the next line by the bump PR in the last step.
          CURRENT_LINE=$(jq -r '.version | split(".") | "\(.[0]).\(.[1])"' package.json)
          echo "current_line=$CURRENT_LINE" >> "$GITHUB_OUTPUT"

          if [ -n "$MINOR_OVERRIDE" ]; then
            # Bash =~ matches the whole string. grep matches line by line, so it
            # passed a multi-line value whose first line was MAJOR.MINOR, and the
            # extra lines forged step outputs.
            if [[ ! "$MINOR_OVERRIDE" =~ ^[0-9]+\.[0-9]+$ ]]; then
              echo "::error::minor_override is not MAJOR.MINOR."
              exit 1
            fi
            CUT_LINE="$MINOR_OVERRIDE"
            # The branch is cut from main, and sync-version.mjs never lowers the
            # manifests, so a line below main's fails mid-cut. Refuse it up front.
            if [ "$(printf '%s\n%s\n' "$CUT_LINE" "$CURRENT_LINE" | sort -V | head -1)" != "$CURRENT_LINE" ]; then
              echo "::error::minor_override $CUT_LINE is below main's line $CURRENT_LINE. Cut an older line by hand from its own history."
              exit 1
            fi
            echo "Manual override -> cut $CUT_LINE (cadence gate skipped)."
          else
            # Biweekly cadence gate: act only on release Sundays (every 14 days
            # from the anchor). A manual run without an override also honors the
            # gate so a stray dispatch can't cut off-cadence.
            anchor_epoch=$(date -u -d "$RELEASE_CADENCE_ANCHOR" +%s)
            today_epoch=$(date -u -d "$(date -u +%Y-%m-%d)" +%s)
            days_since=$(( (today_epoch - anchor_epoch) / 86400 ))
            if [ "$days_since" -lt 0 ] || [ $(( days_since % 14 )) -ne 0 ]; then
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              {
                echo "## Skipped: off-cadence Sunday"
                echo ""
                echo "Release Sundays are every 14 days from \`$RELEASE_CADENCE_ANCHOR\`; today is +$days_since days. Use \`minor_override\` to cut anyway."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            # Cut main's CURRENT line — no +1 (that off-by-one skipped a line).
            CUT_LINE="$CURRENT_LINE"
          fi

          # The next line main advances to after the cut.
          CUT_MAJOR=$(echo "$CUT_LINE" | cut -d. -f1)
          CUT_MINOR=$(echo "$CUT_LINE" | cut -d. -f2)
          NEXT_LINE="$CUT_MAJOR.$((CUT_MINOR + 1))"

          echo "cut_line=$CUT_LINE" >> "$GITHUB_OUTPUT"
          echo "next_line=$NEXT_LINE" >> "$GITHUB_OUTPUT"
          echo "proceed=true" >> "$GITHUB_OUTPUT"
          # No CLI-drift warning here: the cut publishes a PREVIEW and stable is
          # promoted manually, so the preview line legitimately runs 1-2 minors
          # ahead of the CLI's published stable during the RC window. Line
          # alignment is a manual decision made at stable-promotion time.

      - name: Dry run — print plan
        if: steps.target.outputs.proceed == 'true' && github.event.inputs.dry_run == 'true'
        # Step outputs reach the shell through env, never through ${{ }} in the script.
        env:
          CURRENT_LINE: ${{ steps.target.outputs.current_line }}
          CUT_LINE: ${{ steps.target.outputs.cut_line }}
          NEXT_LINE: ${{ steps.target.outputs.next_line }}
        run: |
          {
            echo "## Dry run — planned sprint cut"
            echo ""
            echo "- current line (main): \`$CURRENT_LINE\`"
            echo "- cut line: \`$CUT_LINE\` — branch \`release/v$CUT_LINE\` @ \`$(git rev-parse --short HEAD)\` at version \`$CUT_LINE.0\`"
            echo "- would publish (and wait): PREVIEW default to npmjs; Studio Web PREVIEW to GitHub Packages when custom publishing is enabled (dispatch publish.yml channel=preview) — stable stays MANUAL"
            echo "- would open a bump PR: \`main\` -> \`$NEXT_LINE.0\` after the branch cut; a failed publish is carried as a warning for maintainer review"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cut release branch
        id: cutbranch
        if: steps.target.outputs.proceed == 'true' && github.event.inputs.dry_run != 'true'
        env:
          LINE: ${{ steps.target.outputs.cut_line }}
        run: |
          set -euo pipefail
          BRANCH="release/v$LINE"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            # Branch already exists — a prior run cut it, or main's bump didn't
            # land so a later cadence run re-targets the same line. It must
            # already carry this line (package.json == $LINE.P; a hotfix may
            # have moved it past $LINE.0) — resume idempotently. Another line
            # is a genuine conflict.
            git fetch origin "$BRANCH"
            git checkout --detach FETCH_HEAD
            EXISTING_VERSION=$(node -p "require('./package.json').version")
            if [ "${EXISTING_VERSION%.*}" != "$LINE" ]; then
              echo "::error::$BRANCH already exists at version $EXISTING_VERSION (expected $LINE.x) — resolve manually."
              exit 1
            fi
            echo "$BRANCH already cut, at $EXISTING_VERSION — resuming."
          else
            git checkout -b "$BRANCH"
            # main already carries $LINE.0 on the scheduled path, so this is
            # usually a no-op; an override targeting a different line sets it
            # here. Commit only if the version actually changed (no empty commit).
            npm version "$LINE.0" --no-git-tag-version --allow-same-version
            node scripts/sync-version.mjs
            # Stage exactly the file set sync-version.mjs owns, read back from
            # the script itself. A hardcoded list silently drops any channel
            # added later: that is how `.cursor-plugin/plugin.json` was left
            # out of the 1.201 cut, which failed publish.yml's `guard` job and
            # blocked every publish channel until #2767. Unquoted expansion is
            # intended -- the list is newline-separated and no path contains
            # whitespace.
            MANIFESTS="$(node scripts/sync-version.mjs --list-paths)"
            if [ -z "$MANIFESTS" ]; then
              echo "::error::sync-version.mjs --list-paths returned nothing; refusing to commit a partial version bump."
              exit 1
            fi
            git add $MANIFESTS
            if git diff --cached --quiet; then
              echo "release branch matches main at $LINE.0 — no version commit needed."
            else
              git commit -m "chore(release): cut $LINE line"
            fi
            git push origin "HEAD:$BRANCH"
          fi

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publish preview from the release branch (wait for success)
        id: publish
        if: steps.target.outputs.proceed == 'true' && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINE: ${{ steps.target.outputs.cut_line }}
          VERSION: ${{ steps.cutbranch.outputs.version }}
          REQUEST_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          BRANCH="release/v$LINE"

          # The bot pushed $BRANCH with GITHUB_TOKEN, which GitHub's recursion
          # guard stops from triggering publish.yml automatically — so dispatch
          # channel=preview explicitly and BLOCK on its result:
          #   default on npmjs (--provenance) + Studio Web on GitHub Packages
          #   when enabled.
          # No channel=dev: main already published dev for this commit, and a
          # dev build from the release branch would move `dev` back to this
          # line once main is bumped. Stable (`latest`) is intentionally NOT
          # published — promote a line to stable manually (see docs/RELEASE.md).
          #
          # `gh workflow run` doesn't return the run id. publish.yml ends its run
          # name with the request_id input, so find the run by that. "The newest
          # dispatch on the branch" could be a maintainer's manual run, and the
          # cut would then watch, and report the version of, the wrong one.
          echo "Dispatching publish.yml channel=preview on $BRANCH (request $REQUEST_ID)..."
          gh workflow run publish.yml --ref "$BRANCH" -f channel=preview -f request_id="$REQUEST_ID"
          run_id=""
          for _ in $(seq 1 40); do
            sleep 6
            run_id=$(gh run list --workflow publish.yml --branch "$BRANCH" --event workflow_dispatch \
              --limit 20 --json databaseId,displayTitle \
              --jq "map(select(.displayTitle == \"Publish preview from $BRANCH $REQUEST_ID\")) | .[0].databaseId // empty")
            [ -n "$run_id" ] && break
          done
          if [ -z "$run_id" ]; then
            echo "::error::Timed out finding the dispatched publish.yml run (request $REQUEST_ID)."
            exit 1
          fi
          echo "Watching publish.yml run $run_id..."
          gh run watch "$run_id" --exit-status --interval 15
          # publish.yml stamps the preview as <version>-preview.<run_number>; the
          # notification links the exact npmjs version, so surface it here.
          RUN_NUMBER=$(gh run view "$run_id" --json number --jq '.number')
          PREVIEW_VERSION="$VERSION-preview.$RUN_NUMBER"
          echo "preview_version=$PREVIEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Default preview publish succeeded ($PREVIEW_VERSION); Studio Web preview succeeded when custom publishing was enabled."

      - name: Open version-bump PR against main
        id: mainbump
        # Open the bump PR even if the publish step failed: gate on the branch
        # cut (always() + cutbranch success), NOT on publish. The bump is about
        # advancing main to the next line, which is independent of the publish;
        # a failed publish adds a :warning: to the PR body and a maintainer
        # decides whether to merge. (Publish failure still fails the job overall,
        # so the failure stays visible.)
        if: always() && steps.cutbranch.outcome == 'success' && steps.target.outputs.proceed == 'true' && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          CUT_LINE: ${{ steps.target.outputs.cut_line }}
          NEXT_LINE: ${{ steps.target.outputs.next_line }}
        run: |
          set -euo pipefail
          PR_BRANCH="auto/sprint-bump-$NEXT_LINE"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # main is protected (ruleset: PR + 1 approval + smoke-test checks) and
          # this is a public repo, so we do NOT push to main and do NOT add a
          # bypass credential. Open a PR; a maintainer approves + merges it to
          # advance main. NOTE: a PR opened by the built-in GITHUB_TOKEN does
          # not itself trigger the required check workflows, so a maintainer may
          # need to re-run/reopen them before merge. Fully hands-off would
          # require an App token (see docs/RELEASE.md § Automating the bump).
          EXISTING=$(gh pr list --state open --head "$PR_BRANCH" --json url --jq '.[0].url // empty')
          if [ -n "$EXISTING" ]; then
            echo "url=$EXISTING" >> "$GITHUB_OUTPUT"
            echo "Bump PR already open: $EXISTING"
            exit 0
          fi

          git fetch origin main
          git checkout -B "$PR_BRANCH" origin/main
          npm version "$NEXT_LINE.0" --no-git-tag-version --allow-same-version
          node scripts/sync-version.mjs
          # Stage exactly the file set sync-version.mjs owns, read back from
          # the script itself. A hardcoded list silently drops any channel
          # added later: that is how `.cursor-plugin/plugin.json` was left
          # out of the 1.201 cut, which failed publish.yml's `guard` job and
          # blocked every publish channel until #2767. Unquoted expansion is
          # intended -- the list is newline-separated and no path contains
          # whitespace.
          MANIFESTS="$(node scripts/sync-version.mjs --list-paths)"
          if [ -z "$MANIFESTS" ]; then
            echo "::error::sync-version.mjs --list-paths returned nothing; refusing to commit a partial version bump."
            exit 1
          fi
          git add $MANIFESTS
          if git diff --cached --quiet; then
            echo "main already at $NEXT_LINE.0 — no bump PR needed."
            exit 0
          fi
          BODY="Automated sprint cut: \`release/v$CUT_LINE\` was cut. Merge to advance \`main\` to \`$NEXT_LINE.0\` so development continues on the next line. Stable \`$CUT_LINE.0\` is promoted manually — see docs/RELEASE.md."
          if [ "${PUBLISH_OUTCOME:-}" = "success" ]; then
            BODY="$BODY"$'\n\n'":white_check_mark: default preview build published from \`release/v$CUT_LINE\`; the Studio Web preview was published when custom publishing was enabled."
          else
            BODY="$BODY"$'\n\n'":warning: The preview publish did **not** succeed (outcome: \`${PUBLISH_OUTCOME:-unknown}\`). This bump PR was opened anyway — verify the publish from the run logs before merging."
          fi

          git commit -m "chore(release): bump main to $NEXT_LINE.0 after cutting $CUT_LINE"
          # No open PR uses this branch (checked above). A copy left by a closed,
          # unmerged bump PR would reject a plain push, so replace it.
          git push --force origin "HEAD:refs/heads/$PR_BRANCH"
          URL=$(gh pr create --head "$PR_BRANCH" --base main \
            --title "chore(release): bump main to $NEXT_LINE.0 (sprint cut)" \
            --body "$BODY")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Opened bump PR: $URL — approve + merge to advance main to $NEXT_LINE.0."

      - name: Summary
        if: steps.target.outputs.proceed == 'true' && github.event.inputs.dry_run != 'true'
        env:
          CUT_LINE: ${{ steps.target.outputs.cut_line }}
          NEXT_LINE: ${{ steps.target.outputs.next_line }}
          SHORT_SHA: ${{ steps.cutbranch.outputs.short_sha }}
          PREVIEW_VERSION: ${{ steps.publish.outputs.preview_version }}
          BUMP_URL: ${{ steps.mainbump.outputs.url }}
        run: |
          {
            echo "## Sprint cut complete"
            echo ""
            echo "- cut line: \`$CUT_LINE\` (main was on this line)"
            echo "- \`release/v$CUT_LINE\` @ \`$SHORT_SHA\`"
            echo "- published (waited for success): default PREVIEW (npmjs) \`$PREVIEW_VERSION\`, plus Studio Web PREVIEW (GitHub Packages) when custom publishing was enabled (stable stays manual)"
            echo "- bump PR opened (-> \`$NEXT_LINE.0\`): $BUMP_URL — approve + merge to advance main"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Announce the cut on Slack (#team-coding-agents)
        # Post the announcement regardless of earlier failures (always()), but
        # only for a real cut (proceed, not dry_run). continue-on-error so a
        # Slack hiccup never turns a good cut into a failed job. The message
        # reports the real outcome of each step (branch / preview / bump PR)
        # with Studio-style emojis; SLACK_BOT_TOKEN must belong to a bot that
        # is a member of the channel.
        if: always() && steps.target.outputs.proceed == 'true' && github.event.inputs.dry_run != 'true'
        continue-on-error: true
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          CHANNEL_ID: 'C0A2T23NJ59'   # #team-coding-agents
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          CUT_LINE: ${{ steps.target.outputs.cut_line }}
          NEXT_LINE: ${{ steps.target.outputs.next_line }}
          CUT_OUTCOME: ${{ steps.cutbranch.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          PREVIEW_VERSION: ${{ steps.publish.outputs.preview_version }}
          BUMP_OUTCOME: ${{ steps.mainbump.outcome }}
          BUMP_URL: ${{ steps.mainbump.outputs.url }}
        run: node .github/workflows/scripts/slack-sprint-cut-notify.mjs
