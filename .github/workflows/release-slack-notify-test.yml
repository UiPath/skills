name: Release Slack Notify (TEST)

# Token check for the LiteLLM incident (SIR): posts one message to
# #tmp-skills-slack-bot-tests with the repo's SLACK_BOT_TOKEN and prints only
# Slack's `ok`/`error` fields. After the skills-buddy tokens are revoked this
# should print "ok":false and "error":"token_revoked" (or "invalid_auth").

on:
  push:
    branches:
      - 'test/slack-notify-**'

permissions:
  contents: read

jobs:
  check:
    runs-on: uipath-ubuntu-latest
    steps:
      - name: Try to post to #tmp-skills-slack-bot-tests
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          curl -s -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d '{"channel":"C0BHX329GNR","text":"Token check: if you can read this, the SLACK_BOT_TOKEN in UiPath/skills still works."}' \
            | grep -oE '"(ok|error)":("[^"]*"|true|false)'
