name: Publish skills package

# Publishing channels (registry follows channel — see docs/RELEASE.md):
#   - push to `main`                       -> `dev`     : GitHub Packages
#         Auto on every push (normally a merge). Version `<base>-dev.<run_number>` (never
#         committed). No provenance — GitHub Packages does not support it.
#   - push to `release/v*`                 -> `preview` : npmjs (pre-release)
#         Auto on every push to a release line, mirroring UiPath/cli. Version
#         `<base>-preview.<run_number>` (never committed), signed with
#         `--provenance` via OIDC trusted publishing.
#   - workflow_dispatch (channel: latest)  -> `latest`  : npmjs (stable)
#         Committed `package.json` version. Stable is manual-only — there is
#         no `release:` trigger; publishing a GitHub Release does not publish.
#         Once npmjs serves the version, announce-stable.yml posts it to
#         #team-coding-agents as Skills Buddy (see that workflow).
#   - workflow_dispatch (channel: preview) -> `preview` : npmjs (pre-release)
#   - workflow_dispatch (channel: dev)     -> `dev`     : GitHub Packages
#
# npmjs publishes (`latest`, `preview`) use OIDC trusted publishing +
# `--provenance`, and are gated on the Azure DevOps release gate
# (.pipelines/release-gate.yml), which runs the blocking per-release FOSSA
# scan. `dev` builds skip the gate: they publish on every push to main, and a
# gate run per merge buys nothing for a channel no end user installs. Package
# integrity is carried by the provenance attestation — the hooks are Node
# scripts (hooks/*.mjs), which have no interpreter-enforced signature format
# (Authenticode signing applied only to the retired PowerShell hooks; see
# scripts/run-release-gate.mjs). GitHub Packages publishes
# (`dev`) use the built-in GITHUB_TOKEN and carry no provenance. `npm install @uipath/skills` (no tag,
# from npmjs) always resolves the last stable release — `preview` and `dev`
# are pre-release versions under their own dist-tags, so no un-tagged install
# ever picks them. The version line tracks the CLI minor line so the CLI can
# pin a compatible skills package.

on:
  push:
    # main       -> `dev` build on GitHub Packages
    # release/v* -> `preview` build on npmjs (mirrors UiPath/cli)
    branches: [main, 'release/v*']
  workflow_dispatch:
    inputs:
      channel:
        description: "Manual publish channel"
        required: true
        default: preview
        type: choice
        options:
          - preview
          - dev
          - latest

# Serialize publishes by effective channel so equivalent automatic and manual
# runs cannot race on the same dist-tag. A main push and manual dev dispatch
# share `publish-dev`; a release push and manual preview dispatch share
# `publish-preview`; manual latest uses `publish-latest`. Never cancel an
# in-flight publish.
concurrency:
  group: publish-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.channel || (github.ref == 'refs/heads/main' && 'dev' || 'preview') }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guard:
    # Deliberately NOT `Validate version sync` — that is the name of the
    # required PR check produced by validate-version-sync.yml. This job runs on
    # `push` and can land a same-named check on the merge commit, which makes
    # the required context ambiguous about which run satisfied it. Same
    # assertion, distinct check name.
    name: Validate version sync (publish guard)
    runs-on: uipath-ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22.x"
      # Fails if version-manifest.json has drifted from package.json.
      - run: node scripts/sync-version.mjs --check

  publish-dev:
    name: Publish dev to GitHub Packages
    needs: [guard]
    # Auto on every push to main; also re-runnable via dispatch (channel=dev).
    # release/v* pushes route to preview on npmjs (publish-npmjs), not here.
    # The repo guard stops forks from attempting to publish on their own main.
    if: >-
      github.repository == 'UiPath/skills'
      && ((github.event_name == 'push' && github.ref == 'refs/heads/main')
          || (github.event_name == 'workflow_dispatch' && github.event.inputs.channel == 'dev'))
    runs-on: uipath-ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22.x"
          registry-url: "https://npm.pkg.github.com"
          scope: "@uipath"

      # Stamp a prerelease suffix: <base>-dev.<run_number>. Dot-separated so
      # semver orders the run number numerically. Never committed — only the
      # published tarball carries it. sync-version.mjs rewrites the derived
      # manifests and strips the suffix from the plugin manifests.
      - name: Stamp dev version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          BASE=$(node -p "require('./package.json').version")
          DEV="${BASE}-dev.${RUN_NUMBER}"
          npm version "$DEV" --no-git-tag-version --allow-same-version
          node scripts/sync-version.mjs
          echo "Publishing $DEV to dist-tag dev"

      # setup-node wrote `@uipath:registry=https://npm.pkg.github.com/` + auth;
      # the scoped registry routes this scoped package to GitHub Packages. The
      # built-in GITHUB_TOKEN suffices given the job's `packages: write`
      # permission above. No --provenance: GitHub Packages does not support it.
      - name: Publish
        run: npm publish --tag dev
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-gate:
    name: Release gate (Azure DevOps FOSSA)
    needs: [guard]
    # Exactly the npmjs gate below: every tarball that reaches npmjs is
    # gated, and no other channel pays for a gate run.
    if: >-
      github.repository == 'UiPath/skills'
      && ((github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/'))
          || (github.event_name == 'workflow_dispatch'
              && (github.event.inputs.channel == 'latest' || github.event.inputs.channel == 'preview')))
    runs-on: uipath-ubuntu-latest
    # Pins the OIDC subject to `repo:UiPath/skills:environment:release-gate`,
    # so one Entra federated credential covers every release line.
    environment: release-gate
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22.x"

      # Runs the gate (blocking FOSSA) against this ref and waits for its
      # verdict. A failure stops the publish -- there is no ungated fallback.
      # AZURE_SIGNING_CLIENT_ID keeps its historical name: it is the same
      # federated app registration the retired hook-signing gate used, and
      # renaming a repository variable is infra churn this workflow avoids.
      - name: Run the release gate in Azure DevOps
        env:
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_SIGNING_CLIENT_ID }}
          ADO_ORGANIZATION: ${{ vars.ADO_ORGANIZATION || 'uipath' }}
          ADO_PROJECT: ${{ vars.ADO_PROJECT || 'skills' }}
          ADO_PIPELINE_ID: ${{ vars.ADO_RELEASE_GATE_PIPELINE_ID }}
          GATE_CHANNEL: ${{ github.event.inputs.channel || 'preview' }}
          GATE_REF: ${{ github.ref }}
          GATE_COMMIT: ${{ github.sha }}
        run: node scripts/run-release-gate.mjs

  publish-npmjs:
    name: Publish to npmjs (latest / preview)
    needs: [guard, release-gate]
    # dispatch channel=latest              -> `latest`  (committed version).
    # release/v* push / dispatch preview   -> `preview` (stamped pre-release).
    if: >-
      github.repository == 'UiPath/skills'
      && ((github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/'))
          || (github.event_name == 'workflow_dispatch'
              && (github.event.inputs.channel == 'latest' || github.event.inputs.channel == 'preview')))
    runs-on: uipath-ubuntu-latest
    permissions:
      contents: read
      # OIDC trusted publishing — no NPM_TOKEN. The npmjs trusted publisher
      # for @uipath/skills must name this repo (UiPath/skills) and workflow
      # (publish.yml); it is not restricted to a single ref, so release/v*
      # pushes publish through the same OIDC exchange as tags on main.
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22.x"

      # Node 22 ships npm 10.x; OIDC trusted publishing needs npm >= 11.5.1.
      #
      # Pinned to a major, NOT `npm@latest`. This job is the only one that
      # upgrades npm, so it is the only one exposed to a new npm major the
      # moment it ships -- with no repo change to point at. npm 12 renamed the
      # `npm pack --json` payload from an array to an object keyed by package
      # name, which broke the nested pack inside our `prepack` hook and stalled
      # npmjs at 1.199.0 for two release lines. Minor/patch upgrades still flow;
      # moving majors is now a deliberate edit.
      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@12
          echo "npm $(npm --version) / node $(node --version)"

      # `preview` when: dispatch channel=preview, OR an auto push to a
      # release/v* branch (mirrors UiPath/cli). Stamps `<base>-preview.<run>`
      # (never committed). Otherwise `latest` (dispatch channel=latest)
      # publishes the committed version. An explicit
      # `--tag preview` on a pre-release version never moves `latest`, so
      # `npm install @uipath/skills` still resolves the last stable release.
      #
      # Which preview tag depends on the line: only the highest release line
      # owns the bare `preview`. See the guard in the step body.
      - name: Resolve dist-tag and stamp version
        id: dist
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUBLISH_REF: ${{ github.ref }}
          CHANNEL: ${{ github.event.inputs.channel }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$CHANNEL" = "preview" ] || { [ "$EVENT_NAME" = "push" ] && [[ "$PUBLISH_REF" == refs/heads/release/* ]]; }; then
            BASE=$(node -p "require('./package.json').version")
            PREVIEW="${BASE}-preview.${RUN_NUMBER}"
            npm version "$PREVIEW" --no-git-tag-version --allow-same-version
            node scripts/sync-version.mjs

            # Only the highest release line owns the bare `preview` tag.
            # `--tag preview` used to be unconditional, so whichever line
            # published LAST took it regardless of version: on 2026-09-06,
            # run 637 (release/v1.201) landed after run 635 (release/v1.202)
            # and pointed `preview` back at the older line. That gets worse
            # once a line goes stable while the next one previews -- every
            # 1.201.x hotfix push would take `preview` from 1.202. A lower
            # line publishes to `preview-v<M.N>` and leaves `preview` alone.
            #
            # Fails open: an unset tag or an unreachable registry keeps
            # `preview`, which is the behaviour this guard replaced.
            TAG=preview
            CURRENT=$(npm view "@uipath/skills@preview" version --@uipath:registry=https://registry.npmjs.org/ 2>/dev/null || true)
            if [ -n "$CURRENT" ]; then
              # Compare release lines only; strip the -preview.<run> suffix.
              HIGHEST=$({ echo "${CURRENT%%-*}"; echo "$BASE"; } | sort -V | tail -1)
              if [ "$HIGHEST" != "$BASE" ]; then
                TAG="preview-v${BASE%.*}"
              fi
            fi
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "Publishing $PREVIEW to dist-tag $TAG (preview is at ${CURRENT:-unset})"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "Publishing $(node -p "require('./package.json').version") to dist-tag latest"
          fi

      # Pack first and publish that exact tarball, so the bytes verified below
      # are the bytes published. `prepack`/`postpack` run here as they would
      # under a direct `npm publish`; publishing a tarball path does not re-run
      # them.
      - name: Pack the package
        id: pack
        run: |
          rm -f uipath-skills-*.tgz
          npm pack --pack-destination .
          TARBALL=$(ls uipath-skills-*.tgz)
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "Packed $TARBALL"

      # No auth token and no setup-node registry-url — a token would make npm
      # use token auth and bypass OIDC. We only pin the scoped package to
      # npmjs; credentials come from the OIDC exchange. `--provenance` attaches
      # a signed build attestation (allowed because the repo is public and the
      # job has id-token: write); package.json `repository.url` must match.
      - name: Publish to npmjs (OIDC trusted publishing)
        run: |
          npm config set @uipath:registry https://registry.npmjs.org/
          npm publish "${{ steps.pack.outputs.tarball }}" \
            --access public --provenance --tag ${{ steps.dist.outputs.tag }}

  announce-latest:
    # `npm publish` returns before npmjs serves the version; the called
    # workflow waits for availability (failing if it never comes), then posts
    # the stable-publish announcement as Skills Buddy. It reads the version
    # and skill list from this run's ref (the release branch).
    name: Announce stable publish
    needs: [publish-npmjs]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.channel == 'latest'
    uses: ./.github/workflows/announce-stable.yml
    secrets: inherit

  publish-studioweb-dev:
    name: Publish Studio Web dev to GitHub Packages
    needs: [guard]
    if: >-
      github.repository == 'UiPath/skills'
      && ((github.event_name == 'push' && github.ref == 'refs/heads/main')
          || (github.event_name == 'workflow_dispatch' && github.event.inputs.channel == 'dev'))
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-skill-flavor.yml
    with:
      flavor: studioweb
      channel: dev

  publish-studioweb-preview:
    name: Publish Studio Web preview to GitHub Packages
    needs: [guard]
    if: >-
      github.repository == 'UiPath/skills'
      && ((github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/'))
          || (github.event_name == 'workflow_dispatch' && github.event.inputs.channel == 'preview'))
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-skill-flavor.yml
    with:
      flavor: studioweb
      channel: preview
