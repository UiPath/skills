name: Test Helpers

on:
  pull_request:
    paths:
      - 'tests/tasks/uipath-maestro-flow/**'
      - 'tests/tasks/uipath-maestro-case/**'
      - 'tests/scripts/**'
      - 'tests/coded_action_preflight/**'
      - 'scripts/**'  # guarded scripts (e.g. build-uip-catalog.py) must trigger their tests
      - 'hooks/**'    # telemetry hook has a contract guard in tests/scripts/
      - 'tools/**'    # coded-action validator and contract deriver have guards in tests/
      - 'skills/uipath-ontology-coded-action-deploy/**'  # its scripts declare a contract tests check
      - '.github/workflows/test-helpers.yml'
  workflow_dispatch:

jobs:
  pytest-flow-check:
    runs-on: ubuntu-latest
    name: maestro-flow checker unit tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pytest
        run: pip install pytest

      - name: Run pytest
        run: pytest tests/tasks/uipath-maestro-flow/ -v

  pytest-case-check:
    runs-on: ubuntu-latest
    name: maestro-case checker unit tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pytest
        run: pip install pytest

      - name: Run pytest
        run: pytest tests/tasks/uipath-maestro-case/ -v

  coded-action-guards:
    runs-on: ubuntu-latest
    name: coded-action validator, deriver and script contracts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pytest
        run: pip install pytest

      # The deriver must reproduce, byte for byte, the entry-points manifests Studio Web itself
      # produced for two jobs that deployed and ran on a tenant. Those goldens are the only
      # evidence of what the platform accepts, and `uip functions pack` cannot produce them.
      - name: Contract deriver
        run: pytest tests/scripts/test_entry_points.py -v

      # Includes a whole-payload golden. Gate order and diagnostics ordering are part of what
      # callers see, and no per-gate assertion covers them.
      - name: Coded-action validator
        run: pytest tests/coded_action_preflight/ -v

      # Each deploy script declares its own contract via --describe; this fails if SKILL.md's
      # Scripts table drifts from it, or if a doc still names a script that no longer exists.
      - name: Deploy script contracts
        run: pytest tests/scripts/test_coded_action_scripts.py -v

  runtime-payload-casing-guard:
    runs-on: ubuntu-latest
    name: runtime-payload key-casing contract guard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pytest
        run: pip install pytest

      # Fails if any checker reads a runtime-only debug key (finalStatus /
      # elementExecutions) by a hard-coded lowercase .get() instead of the
      # case-insensitive _get_ci accessor — the CLI #2266 PascalCase break.
      - name: Run contract guard
        run: pytest tests/scripts/test_runtime_payload_key_casing.py -v

  catalog-build-guards:
    runs-on: ubuntu-latest
    name: catalog build integrity guards
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pytest
        run: pip install pytest

      # Guards the verb-count floor / max-drop logic that stops a broken
      # refresh from overwriting the catalog with a base-CLI-only snapshot
      # (see #1203).
      - name: Run catalog guard tests
        run: pytest tests/scripts/test_catalog_build_guards.py -v

  telemetry-hook-tests:
    runs-on: ubuntu-latest
    name: telemetry hook contract guard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pytest
        run: pip install pytest

      # Runs BOTH twins of each hook (.sh under bash, .ps1 under pwsh — both
      # preinstalled on ubuntu runners) against the same assertions, enforcing
      # the twin keep-in-sync rule: send-telemetry with a stubbed uip
      # (eventName mapping, lifecycle fields, drop paths) and set-session-env
      # against a temp CLAUDE_ENV_FILE (export line, host-wins, idempotence,
      # sanitization).
      - name: Run telemetry hook tests
        run: pytest tests/scripts/test_send_telemetry_hook.py tests/scripts/test_set_session_env_hook.py -v
