name: Skill Activation Gate

# When a SKILL.md frontmatter changes, run the activation eval restricted to
# that one skill's positives and fail if recall.yes drops more than DROP_PP
# (10pp — see tests/scripts/activation_gate.py) below the rounded 2026-06-17
# baseline. Cross-fire and negatives stay covered by the manual full run.

concurrency:
  group: activation-gate-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

on:
  # No paths: filter — see smoke-skills.yml for the required-check rationale.
  # ready_for_review is added so the gate fires the moment a PR exits draft;
  # the gate job itself is then skipped on drafts (see `if:` below) to keep
  # iteration-on-draft cheap.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

# Exempt the first-party `coder-eval` wheel from safe-chain's
# minimum-package-age suppression so a same-day pin in
# tests/.coder-eval-version still resolves — see smoke-skills.yml for the full
# rationale. Workflow-level so any job added later inherits it.
env:
  SAFE_CHAIN_MINIMUM_PACKAGE_AGE_EXCLUSIONS: coder-eval

jobs:
  detect:
    runs-on: uipath-ubuntu-latest
    outputs:
      skills: ${{ steps.detect.outputs.skills }}
      skip: ${{ steps.detect.outputs.skip }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with: { fetch-depth: 0 }

      - id: detect
        # base_ref is empty on workflow_dispatch — fall back to main so manual
        # re-runs against a feature branch still resolve a sane merge-base.
        # Block-style env: the inner `'main'` single quotes break flow-mapping
        # parsing in strict YAML readers.
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          set -euo pipefail
          BASE_SHA=$(git merge-base "origin/$BASE_REF" HEAD)
          extract_fm() { awk '/^---$/{c++;if(c==2)exit;next} c==1{print}'; }

          SKILLS=()
          for f in $(git diff --name-only "$BASE_SHA"...HEAD | grep -E '^skills/[^/]+/SKILL\.md$' || true); do
            # Skip deletions — the file is gone from HEAD; nothing to gate.
            [ -f "$f" ] || continue
            base_fm=$(git show "$BASE_SHA:$f" 2>/dev/null | extract_fm || true)
            head_fm=$(extract_fm < "$f" || true)
            [ "$base_fm" = "$head_fm" ] && continue
            SKILLS+=("$(echo "$f" | cut -d/ -f2)")
          done

          if [ ${#SKILLS[@]} -eq 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No frontmatter changes — gate not triggered."
            exit 0
          fi

          JSON=$(printf '%s\n' "${SKILLS[@]}" | jq -R . | jq -s -c .)
          echo "skills=$JSON" >> "$GITHUB_OUTPUT"
          echo "Will gate: ${SKILLS[*]}"

  gate:
    needs: detect
    # Skip drafts to keep iteration cheap; the gate fires on transition to
    # ready (via the ready_for_review event type above) and on every push to
    # a ready PR. workflow_dispatch has no draft flag → the != 'true' check
    # treats undefined as not-draft, so manual dispatch still runs the gate.
    if: needs.detect.outputs.skip != 'true' && github.event.pull_request.draft != true
    runs-on: uipath-ubuntu-latest
    name: ${{ matrix.skill }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        skill: ${{ fromJSON(needs.detect.outputs.skills) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      # Pin coder_eval to tests/.coder-eval-version so the activation gate runs
      # the same engine as the smoke, ad-hoc, and nightly paths.
      - name: Resolve coder_eval pin
        id: ceref
        run: echo "version=$(tr -d '[:space:]' < tests/.coder-eval-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with: { python-version: '3.13' }
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4.2.0

      # Host coder-eval CLI = pinned wheel (coder_eval feed + ml-packages for
      # deps). Activation runs under the tempdir driver -- no agent image.
      # httpx is pinned explicitly: coder-eval 0.10.x's llm_judge imports it
      # without declaring it, and it stopped arriving transitively when the
      # anthropic SDK moved to the httpx2 fork (coder-eval >=0.11.5 fixed the
      # import on main).
      - name: Install coder-eval
        run: uv pip install --system "coder-eval==${{ steps.ceref.outputs.version }}" httpx

      - name: Run activation gate
        env:
          # Pass matrix value via env (not direct ${{ }} interpolation in run:)
          # to avoid shell expansion of any special chars in the skill name.
          SKILL: ${{ matrix.skill }}
          SKILLS_REPO_PATH: ${{ github.workspace }}
          API_BACKEND: bedrock
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          BEDROCK_MODEL: ${{ secrets.BEDROCK_MODEL }}
          # The agent model the gate measures (activation_gate.py passes it as --model,
          # and exits non-zero when this is unset — no literal fallback). Its recall
          # baselines are model-specific, so re-baseline when this moves.
          AGENT_MODEL: ${{ vars.CLAUDE_CODE_MODEL }}
        run: python tests/scripts/activation_gate.py --skill "$SKILL"
