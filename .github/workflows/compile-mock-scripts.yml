name: Compile troubleshoot mock scripts

# Keeps the committed troubleshoot mock bytecode in sync with its sources.
#
# The mock dispatcher and sealer ship to test sandboxes ONLY as compiled
# bytecode (`tests/tasks/uipath-troubleshoot/_shared/mock_template/m/`
# `.uip.<ver>.bin` / `.seal.<ver>.bin`, one blob per supported CPython minor
# 3.10-3.14 — bytecode loads only on the minor that compiled it, and the
# sandbox resolves `python` from the host PATH) so no readable script in a
# sandbox documents the mock system; the editable sources live in
# `_shared/mock_src/`. Whenever a PR touches those sources, this workflow
# recompiles the full matrix (compile_mocks.py --all drives `uv run
# --python <ver>` per version) and pushes the regenerated artifacts back to
# the PR branch, so contributors never compile by hand.
#
# Compilation is deterministic (hash-based pyc invalidation): recompiling
# unchanged sources is byte-identical, so the bot's own commit re-triggers
# this workflow into a clean no-op — no push loop.

on:
  pull_request:
    paths:
      - "tests/tasks/uipath-troubleshoot/_shared/mock_src/**"
      - "tests/tasks/uipath-troubleshoot/_shared/scripts/compile_mocks.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the PR HEAD branch itself (not the merge ref) so the
          # regenerated artifacts can be committed back to it. PAT so the
          # push re-triggers the PR's status checks (the default GITHUB_TOKEN
          # suppresses downstream workflow runs) — same pattern as
          # automerge-catalog-refresh.yml.
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          token: ${{ secrets.GH_PAT }}

      - uses: astral-sh/setup-uv@v5

      - name: Recompile mock scripts for every supported interpreter
        run: python3 tests/tasks/uipath-troubleshoot/_shared/scripts/compile_mocks.py --all

      - name: Commit and push regenerated bytecode
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail

          if git diff --quiet -- tests/tasks/uipath-troubleshoot/_shared/mock_template/m/; then
            echo "Committed bytecode is in sync with mock_src/ — nothing to do."
            exit 0
          fi

          # Fork PRs cannot be pushed to; fail with the local recipe instead
          # of silently letting stale bytecode merge.
          if [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::Committed mock bytecode is stale and this PR comes from a fork."
            echo "::error::Run: python tests/tasks/uipath-troubleshoot/_shared/scripts/compile_mocks.py --all and commit the result."
            git diff --stat -- tests/tasks/uipath-troubleshoot/_shared/mock_template/m/
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/tasks/uipath-troubleshoot/_shared/mock_template/m/
          git commit -m "chore(tests): recompile troubleshoot mock dispatchers"
          git push origin "HEAD:$HEAD_REF"
