name: Validate Skill Status

on:
  # No `paths:` filter on purpose, for the same two reasons as
  # validate-version-sync.yml and validate-skills-sh.yml:
  #
  # 1. Required-check safety: this job is wired as a required status check. If
  #    `paths:` excluded a PR the workflow wouldn't run, no check would be
  #    reported, and merge would block forever. It is a checkout plus a ~8s
  #    dependency-free script, so just always run it.
  # 2. A path list is not a reliable trigger for this drift. The manifest is
  #    keyed on the set of `skills/<name>/` directories, so adding, renaming or
  #    deleting a skill desyncs it even when no file the old list named was
  #    touched — the same failure mode that kept validate-skills-sh.yml silent
  #    on #2252.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-status:
    runs-on: uipath-ubuntu-latest
    name: Validate skill status manifest & README
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.13'

      - name: Validate status manifest
        run: python3 scripts/check-skill-status.py

      - name: Check README status table is current
        run: python3 scripts/check-skill-status.py --check-readme
