name: Publish skill flavor package

on:
  workflow_call:
    inputs:
      flavor:
        description: Lowercase kebab-case skill flavor to publish
        required: true
        type: string
      channel:
        description: GitHub Packages dist-tag and prerelease label (dev, preview, or stable)
        required: true
        type: string
      commit:
        description: stable only. Full git sha to check out and build
        required: false
        type: string
        default: ""
      version:
        description: stable only. Exact version to publish, <base>-stable.<sprint>
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  publish:
    # Operator-controlled fail-closed switch. Enable only after an
    # administrator has bootstrapped every explicitly published flavor as an
    # Internal GitHub Package and granted this repository Actions write
    # access. This switch does not query live package visibility; an absent
    # variable evaluates false.
    if: ${{ vars.ENABLE_SKILL_FLAVOR_PUBLISH == 'true' }}
    name: Publish ${{ inputs.flavor }} ${{ inputs.channel }} to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Empty for dev/preview, which build the triggering ref as before.
          ref: ${{ inputs.commit }}
          # stable checks the commit is on main, which needs the history. Always
          # full: `cond && 0 || 1` would read 0 as false and give stable depth 1.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          registry-url: "https://npm.pkg.github.com"
          scope: "@uipath"

      - name: Validate inputs and stamp version and gitHead
        id: package_metadata
        shell: bash
        env:
          FLAVOR: ${{ inputs.flavor }}
          CHANNEL: ${{ inputs.channel }}
          COMMIT: ${{ inputs.commit }}
          STABLE_VERSION: ${{ inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [[ ! "$FLAVOR" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]] || [ "$FLAVOR" = "default" ]; then
            echo "Unsupported skill flavor: $FLAVOR" >&2
            exit 1
          fi
          if [ ! -d "skill-flavors/$FLAVOR" ] || [ -L "skill-flavors/$FLAVOR" ]; then
            echo "Skill flavor is not a real directory: $FLAVOR" >&2
            exit 1
          fi
          BASE=$(node -p "require('./package.json').version")
          case "$CHANNEL" in
            dev|preview)
              if [ -n "$COMMIT$STABLE_VERSION" ]; then
                echo "commit and version are accepted only for the stable channel" >&2
                exit 1
              fi
              VERSION="${BASE}-${CHANNEL}.${RUN_NUMBER}"
              ;;
            stable)
              if [[ ! "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || [ "$(git rev-parse HEAD)" != "$COMMIT" ]; then
                echo "stable needs commit to be the full sha that was checked out: $COMMIT" >&2
                exit 1
              fi
              if ! git merge-base --is-ancestor "$COMMIT" origin/main; then
                echo "stable commit is not on main: $COMMIT" >&2
                exit 1
              fi
              if [[ ! "$STABLE_VERSION" =~ ^${BASE//./\\.}-stable\.[0-9]+$ ]]; then
                echo "stable version must be ${BASE}-stable.<sprint> for this commit: $STABLE_VERSION" >&2
                exit 1
              fi
              VERSION="$STABLE_VERSION"
              ;;
            *) echo "Unsupported flavor package channel: $CHANNEL" >&2; exit 1 ;;
          esac

          PACKAGE_NAME=$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { packageName } from "./scripts/compose-skill-flavor.mjs";
            const manifest = JSON.parse(readFileSync("package.json", "utf8"));
            process.stdout.write(packageName(manifest.name, process.env.FLAVOR));
          ')
          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"

          npm version "$VERSION" --no-git-tag-version --allow-same-version
          # The composer copies the root manifest into the flavor package, so
          # this records the built commit. npm does not set gitHead itself
          # when publishing a tarball.
          npm pkg set gitHead="$(git rev-parse HEAD)"
          node scripts/sync-version.mjs
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing $PACKAGE_NAME@$VERSION to dist-tag $CHANNEL"

      - name: Build verified skill packages
        run: npm run skills:pack

      - name: Select and inspect the requested flavor tarball
        id: package
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.package_metadata.outputs.package_name }}
          FLAVOR: ${{ inputs.flavor }}
          VERSION: ${{ steps.package_metadata.outputs.version }}
        run: |
          TARBALL=$(node scripts/select-skill-package.mjs \
            --directory build/npm \
            --name "$PACKAGE_NAME" \
            --flavor "$FLAVOR" \
            --version "$VERSION")
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      # Same gate as publish.yml: scan the selected tarball's exact bytes.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.13'

      - name: Scan the flavor tarball for customer-blocked content
        env:
          TARBALL: ${{ steps.package.outputs.tarball }}
        run: python3 scripts/check-sensitive-content.py "$TARBALL"

      - name: Require the GitHub Packages registry
        run: |
          REGISTRY=$(npm config get @uipath:registry)
          if [ "$REGISTRY" != "https://npm.pkg.github.com/" ]; then
            echo "Unexpected flavor package registry: $REGISTRY" >&2
            exit 1
          fi

      - name: Publish only the selected flavor tarball
        env:
          TARBALL: ${{ steps.package.outputs.tarball }}
          CHANNEL: ${{ inputs.channel }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          npm publish "$TARBALL"
          --registry https://npm.pkg.github.com/
          --tag "$CHANNEL"
