name: Optimize skill

run-name: Optimize skill · ${{ inputs.skill }} · @${{ github.triggering_actor }}

# Self-serve token optimization for skill owners. Queues the skill-trimming optimizer's
# ADO pipeline (UiPath/skill-trimming-optimizer, .azure-pipelines/optimize-bundle.yml),
# which shortens the description, body and references, gates every cut on this repo's
# eval tasks (dev runs + a full-suite final verdict), and opens a DRAFT PR here with the
# report. The heavy run stays on ADO (a 16 vCPU / 64 GB BYOS agent — Linux, or Windows for
# skills with `windows`-tagged tasks, picked by the pipeline — multi-hour, Key Vault
# secrets); this workflow only checks who is asking and queues it.
#
# Who can run it: a CODEOWNER of skills/<skill>/ — a listed user, or an active member of a
# listed team — or one of OPTIMIZER_MAINTAINERS below. The check is the person who STARTED
# this run (github.triggering_actor), so a re-run is checked against whoever re-runs it.
# github.token cannot read team membership (GitHub answers 404 for "not a member" and for
# "may not look"), so team owners are verified with a short-lived token of the
# skill-trimming-optimizer GitHub App (the optimizer's PR bot, which also has the org
# permission Members: read), minted below from the `optimize-skill` environment's
# OPTIMIZER_TEAM_APP_PRIVATE_KEY secret and narrowed to `permission-members: read`. The key
# could mint broader tokens (the App can push branches here), which is why it lives only in
# the main-only environment. Without the secret the check falls back to github.token: listed
# users and maintainers still pass; team owners fail closed, naming whom to ask.
#
# Credential: the job runs in the `optimize-skill` environment (deployment branches: main
# only). Its GitHub OIDC token is exchanged for an Entra token of an app registration whose
# federated credential trusts ONLY that environment (subject
# repo:UiPath/skills:environment:optimize-skill), so no other job — on main or elsewhere —
# can redeem it; its service principal may only queue that one ADO pipeline. The tenant and
# client ids below are identifiers, not secrets. Changes that alter the OIDC subject break
# the exchange until the Entra federated credential is updated in step: renaming or removing
# the environment, moving the job into a reusable workflow, or changing the org's OIDC
# subject template. Moving the ADO pipeline changes ADO_PIPELINE_ID
# and the service principal's queue grant. To stop the workflow: gh workflow disable optimize-skill.yml
#
# Contract: the template parameters queued below (skill, effort, optimizeDescription,
# optimizeBody, optimizeReferences, finalGate, budgetUsd, openPR, requestedBy) and the
# final_gate choices are owned by optimize-bundle.yml in UiPath/skill-trimming-optimizer; a
# rename there needs the matching edit here (tests/scripts/optimize-skill-workflow.test.mjs
# pins this side).

on:
  workflow_dispatch:
    inputs:
      skill:
        description: 'Skill to optimize: the folder name under skills/ (e.g. uipath-api-workflow).'
        type: string
        required: true
      optimize_description:
        description: 'Shorten the description (activation-gated).'
        type: boolean
        default: true
      optimize_body:
        description: 'Relocate + compact the SKILL.md body.'
        type: boolean
        default: true
      optimize_references:
        description: 'Trim references (each gated on the tasks that load it).'
        type: boolean
        default: true
      final_gate:
        description: 'Final verdict: luna (always) · opus / terra add a 1-seed arm on that model (Linux only for now — skills with windows-tagged tasks need luna).'
        type: choice
        options: [luna, opus, terra, opus+terra]
        default: luna
      budget_usd:
        description: 'Stop once model spend reaches this many USD (0 = no cap).'
        type: string
        default: '100'

permissions: {}

env:
  ADO_ORG: uipath
  ADO_PROJECT: coder_eval
  ADO_PIPELINE_ID: '18884'           # skill-trimming-optimizer / optimize-bundle.yml
  # Fixed for self-serve runs: the point is a draft PR, at the standard effort. Smoke /
  # thorough runs and the other knobs stay on the ADO run form for the maintainers.
  EFFORT: standard
  OPEN_PR: 'true'
  AZURE_TENANT_ID: d8353d2a-b153-4d17-8827-902c51f72357   # Entra tenant of the app registration
  AZURE_CLIENT_ID: ca18c791-e99c-4ccd-9c40-760e849b78a3   # app registration skill-trimming-optimizer-github
  OPTIMIZER_APP_CLIENT_ID: Iv23liSOlyfwxe4g8sJO           # GitHub App skill-trimming-optimizer (an identifier, not a secret)
  # may run it for any skill (the optimizer's maintainers); space- or comma-separated handles, @ optional
  OPTIMIZER_MAINTAINERS: CarlesUIPath

jobs:
  queue:
    name: Queue the optimizer
    runs-on: uipath-ubuntu-latest
    timeout-minutes: 10
    # Pins the OIDC subject to repo:UiPath/skills:environment:optimize-skill, the only subject
    # the Entra federated credential trusts; the environment's branch policy admits main only.
    environment: optimize-skill
    env:
      HAS_TEAM_APP: ${{ secrets.OPTIMIZER_TEAM_APP_PRIVATE_KEY != '' }}
    # Serializes only this seconds-long queue job. Duplicate multi-hour runs are refused below
    # (an unfinished ADO run or an open optimizer PR for the skill), and the ADO run itself
    # refuses to start while a skillreducer-<skill> PR is open.
    concurrency:
      group: optimize-skill-${{ inputs.skill }}
      cancel-in-progress: false
    permissions:
      contents: read                 # CODEOWNERS + the skill folder
      pull-requests: read            # refuse while an optimizer PR for the skill is open
      id-token: write                # the OIDC token exchanged for the Entra token
    steps:
      # The federated credential only trusts main; refuse early with a clear message rather
      # than a token-exchange error (and never run a branch's edited copy of this workflow).
      - name: Run from main only
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run this workflow from the main branch (it was started from ${GITHUB_REF})."
          exit 1

      # Before anything uses inputs.skill (the checkout below puts it in a sparse pattern).
      - name: Validate the run form
        env:
          SKILL: ${{ inputs.skill }}
          BUDGET: ${{ inputs.budget_usd }}
          DESC: ${{ inputs.optimize_description }}
          BODY: ${{ inputs.optimize_body }}
          REFS: ${{ inputs.optimize_references }}
        run: |
          set -euo pipefail
          [[ "$SKILL" =~ ^[a-z0-9][a-z0-9-]*$ ]] || { echo "::error::'$SKILL' is not a skill folder name"; exit 1; }
          [[ "$BUDGET" =~ ^[0-9]+(\.[0-9]+)?$ ]] || { echo "::error::budget_usd must be a number, got '$BUDGET'"; exit 1; }
          [ "$DESC$BODY$REFS" != falsefalsefalse ] || { echo "::error::nothing to optimize: tick at least one of description / body / references"; exit 1; }

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          sparse-checkout: |
            CODEOWNERS
            .github/workflows/scripts/codeowners-check.mjs
            skills/${{ inputs.skill }}/SKILL.md
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Check the skill exists on main
        env:
          SKILL: ${{ inputs.skill }}
        run: '[ -f "skills/$SKILL/SKILL.md" ] || { echo "::error::no skills/$SKILL/SKILL.md on main"; exit 1; }'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22.x'

      # Read-only, org-members-only token so team owners can be verified; never used elsewhere.
      - name: Team-membership token
        id: team-app
        if: env.HAS_TEAM_APP == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          client-id: ${{ env.OPTIMIZER_APP_CLIENT_ID }}
          private-key: ${{ secrets.OPTIMIZER_TEAM_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-members: read

      - name: Check that you own the skill
        env:
          SKILL: ${{ inputs.skill }}
          ACTOR: ${{ github.triggering_actor }}
          GH_TOKEN: ${{ steps.team-app.outputs.token || github.token }}
          ALSO_ALLOWED: ${{ env.OPTIMIZER_MAINTAINERS }}
        run: node .github/workflows/scripts/codeowners-check.mjs CODEOWNERS "$SKILL" "$ACTOR"

      # The ADO run refuses too, but only hours later in its own log; say it here.
      - name: Refuse while an optimizer PR for the skill is open
        env:
          SKILL: ${{ inputs.skill }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # every page: the repo has more open PRs than one page of 100 holds
          open=""
          for page in $(seq 1 20); do
            resp=$(curl -sS -w '\n%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                     "https://api.github.com/repos/$REPO/pulls?state=open&per_page=100&page=$page")
            code=${resp##*$'\n'}; resp=${resp%$'\n'*}
            if [ "$code" != 200 ]; then
              echo "::warning::could not list open PRs (HTTP $code); the ADO run will still refuse if one is open"; exit 0
            fi
            open=$(jq -r --arg p "skillreducer-$SKILL" \
                     '[.[] | select(.head.ref == $p or (.head.ref | startswith($p + "-"))) | .html_url] | first // empty' <<<"$resp")
            [ -z "$open" ] && [ "$(jq length <<<"$resp")" = 100 ] || break
          done
          if [ -n "$open" ]; then
            echo "::error::an optimization PR for $SKILL is already open ($open) — merge or close it first"; exit 1
          fi

      - name: Queue the ADO pipeline
        id: queue
        env:
          TENANT_ID: ${{ env.AZURE_TENANT_ID }}
          CLIENT_ID: ${{ env.AZURE_CLIENT_ID }}
          SKILL: ${{ inputs.skill }}
          DESC: ${{ inputs.optimize_description }}
          BODY: ${{ inputs.optimize_body }}
          REFS: ${{ inputs.optimize_references }}
          FINAL_GATE: ${{ inputs.final_gate }}
          BUDGET: ${{ inputs.budget_usd }}
          ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          # one line of a failed response for the annotation: .message/.error_description, else the raw text
          detail(){ { jq -r '.message // .error_description // .error // tojson' <<<"$1" 2>/dev/null || printf '%s' "$1"; } | tr '\n' ' ' | head -c 400; }

          # 1. GitHub OIDC token for the Entra token exchange
          resp=$(curl -sS -w '\n%{http_code}' -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                   "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange")
          code=${resp##*$'\n'}; resp=${resp%$'\n'*}
          oidc=$(jq -er .value <<<"$resp" 2>/dev/null) && [ "$code" = 200 ] || {
            echo "::error::could not get the GitHub OIDC token (HTTP $code; is id-token: write granted?)"; exit 1; }
          echo "::add-mask::$oidc"

          # 2. Entra token for Azure DevOps (resource 499b84ac-…: the Azure DevOps app id)
          resp=$(curl -sS -w '\n%{http_code}' -X POST "https://login.microsoftonline.com/$TENANT_ID/oauth2/v2.0/token" \
                   -d client_id="$CLIENT_ID" -d grant_type=client_credentials \
                   -d client_assertion_type=urn:ietf:params:oauth:client-assertion-type:jwt-bearer \
                   --data-urlencode client_assertion="$oidc" \
                   --data-urlencode scope=499b84ac-1321-427f-aa17-267ca6975798/.default)
          code=${resp##*$'\n'}; resp=${resp%$'\n'*}
          ado=$(jq -er .access_token <<<"$resp" 2>/dev/null) && [ "$code" = 200 ] || {
            echo "::error::Entra token exchange failed (HTTP $code): $(detail "$resp")"; exit 1; }
          echo "::add-mask::$ado"
          api="https://dev.azure.com/$ADO_ORG/$ADO_PROJECT/_apis"

          # 3. refuse a duplicate: an unfinished run of this pipeline for the same skill. Reading
          #    the queue is best effort — the guard protects budget, not access.
          resp=$(curl -sS -w '\n%{http_code}' -H "Authorization: Bearer $ado" \
                   "$api/build/builds?definitions=$ADO_PIPELINE_ID&statusFilter=inProgress,notStarted&api-version=7.1")
          code=${resp##*$'\n'}; resp=${resp%$'\n'*}
          if [ "$code" = 200 ]; then
            dup=$(jq -r --arg s "$SKILL" \
                    '[.value[]? | select((.templateParameters.skill // "") == $s) | ._links.web.href] | first // empty' <<<"$resp" 2>/dev/null || true)
            if [ -n "$dup" ]; then
              echo "::error::an optimizer run for $SKILL is already queued or running: $dup"; exit 1
            fi
          else
            echo "::warning::could not read the ADO queue (HTTP $code); skipping the duplicate-run check"
          fi

          # 4. queue the run; every template parameter is a string
          body=$(jq -n --arg skill "$SKILL" --arg effort "$EFFORT" --arg desc "$DESC" --arg bodyp "$BODY" \
                   --arg refs "$REFS" --arg gate "$FINAL_GATE" --arg budget "$BUDGET" --arg pr "$OPEN_PR" \
                   --arg who "$ACTOR" \
            '{templateParameters: {skill: $skill, effort: $effort, optimizeDescription: $desc,
               optimizeBody: $bodyp, optimizeReferences: $refs, finalGate: $gate, budgetUsd: $budget,
               openPR: $pr, requestedBy: $who},
              resources: {repositories: {self: {refName: "refs/heads/main"}}}}')
          run=$(curl -sS -w '\n%{http_code}' -X POST -H "Authorization: Bearer $ado" -H "Content-Type: application/json" \
                  "$api/pipelines/$ADO_PIPELINE_ID/runs?api-version=7.1" -d "$body")
          code=${run##*$'\n'}; run=${run%$'\n'*}
          if [ "$code" != 200 ]; then
            echo "::error::ADO refused the run (HTTP $code): $(detail "$run")"; exit 1
          fi
          echo "url=$(jq -r '._links.web.href' <<<"$run")" >> "$GITHUB_OUTPUT"
          echo "id=$(jq -r '.id' <<<"$run")" >> "$GITHUB_OUTPUT"

      - name: Summary
        env:
          URL: ${{ steps.queue.outputs.url }}
          SKILL: ${{ inputs.skill }}
        run: |
          {
            echo "## Optimizer queued for \`$SKILL\`"
            echo
            echo "ADO run: $URL"
            echo
            echo "It runs for several hours; skills with \`windows\`-tagged tasks run on a Windows agent and can take up to a day. When every gate passes, a **draft PR** opens on this repo with the report, and you are requested as its reviewer."
            echo "No PR opens if the final verdict finds a regression, the budget cap is hit, or a HIGH faithfulness finding remains; the ADO run's summary says why."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Queued: $URL"
