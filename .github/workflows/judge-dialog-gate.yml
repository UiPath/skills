name: Judge Dialog Gate

# Fails the build if a troubleshoot task YAML touched by this PR has an
# `llm_judge` criterion that grades only the agent's LAST turn
# (`include_agent_output: true` without `include_dialog: true`) while running
# under `simulation.enabled: true`.
#
# The simulated user keeps talking after the diagnosis lands, so the final turn
# is usually a one-line acknowledgement ("Will do."). A judge handed only that
# turn scores a correct investigation 0.00 - six troubleshoot tasks failed this
# way in the 2026-07-28 nightly. See scripts/check-judge-dialog.py for the full
# rationale.
#
# Scoped to the task YAMLs the PR adds or modifies, so tasks predating the rule
# are not retroactively blocked. To cover other skills, widen the `-- ` pathspec
# in the "Collect changed task YAMLs" step below.
#
# No `paths:` filter so this can be wired as a required check - it exits 0 when
# the PR touches no troubleshoot task YAMLs.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: judge-dialog-gate-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    name: Simulated tasks grade the full dialog
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Collect changed task YAMLs
        id: changed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -z "$BASE_REF" ]; then
            # workflow_dispatch - no PR diff, scan the whole skill.
            echo "files=tests/tasks/uipath-troubleshoot" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --quiet origin "$BASE_REF"
          files=$(git diff --name-only --diff-filter=AM \
            "origin/$BASE_REF...HEAD" \
            -- 'tests/tasks/uipath-troubleshoot/**/task.yaml' | tr '\n' ' ')
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "Changed troubleshoot task YAMLs: ${files:-<none>}"

      - name: Check judge dialog inputs
        run: python3 scripts/check-judge-dialog.py ${{ steps.changed.outputs.files }}
