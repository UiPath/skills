name: Validate Skill Flavors

on:
  # No `paths:` filter on purpose, for the same two reasons as
  # validate-version-sync.yml and validate-skills-sh.yml:
  #
  # 1. Required-check safety: this job is wired as a required status check. If
  #    `paths:` excluded a PR the workflow wouldn't run, no check would be
  #    reported, and merge would block forever.
  # 2. A path list is not a reliable trigger for this drift. The 28-entry list
  #    this replaced had to name every input to the package build — every tree
  #    the composer reads, every script it calls, every root file that lands in
  #    a tarball — and it went stale each time one was added. The build is what
  #    ships to consumers; a silent skip is the one outcome worth paying ~50s
  #    per PR to rule out.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Build and inspect every skill package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22.x'

      - name: Test the flavor composer and contributor contracts
        run: npm run skills:test

      - name: Validate source contracts
        run: npm run skills:validate

      - name: Check every relative Markdown link resolves
        run: npm run skills:check-links

      - name: Build complete trees and real npm tarballs
        run: npm run skills:pack

      - name: Verify backward-compatible root default packaging
        run: |
          mkdir -p build/root-pack-check
          npm pack --json --pack-destination build/root-pack-check > build/root-pack-check/pack.json
          npm publish --dry-run --json --access public > build/root-pack-check/publish.json
          test "$(find build/root-pack-check -maxdepth 1 -name '*.tgz' | wc -l)" -eq 1

          VERSION=$(node -p "require('./package.json').version")
          GENERATED_DEFAULT=$(node scripts/select-skill-package.mjs \
            --directory build/npm \
            --name @uipath/skills \
            --flavor default \
            --version "$VERSION")
          GENERATED_STUDIOWEB=$(node scripts/select-skill-package.mjs \
            --directory build/npm \
            --name @uipath/skills-studioweb \
            --flavor studioweb \
            --version "$VERSION")
          ROOT_DEFAULT=$(find build/root-pack-check -maxdepth 1 -name '*.tgz' -print)
          test "$(sha512sum "$GENERATED_DEFAULT" | cut -d ' ' -f 1)" = \
            "$(sha512sum "$ROOT_DEFAULT" | cut -d ' ' -f 1)"
          echo "Verified marker-free artifacts: $GENERATED_DEFAULT and $GENERATED_STUDIOWEB"

          test ! -e build/.root-pack-transaction
          git diff --exit-code -- skills

      - name: Ensure build-only markers do not reach consumers
        run: |
          if rg -n 'skill-flavor[ \t]*:' build/skills build/packages; then
            echo 'Flavor marker leaked into a built tree or staged package.' >&2
            exit 1
          fi

      - name: Upload package tarballs for inspection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: skill-flavor-packages
          path: build/npm/*.tgz
          if-no-files-found: error
