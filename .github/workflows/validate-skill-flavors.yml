name: Validate Skill Flavors

on:
  pull_request:
    paths:
      - 'skills/**'
      - 'skill-flavors/**'
      - 'agents/**'
      - 'commands/**'
      - 'hooks/**'
      - 'assets/**'
      - '.claude-plugin/**'
      - 'scripts/compose-skill-flavor.py'
      - 'tests/scripts/test_skill_flavor_composer.py'
      - 'tests/scripts/test_manage_skill_flavors_skill.py'
      - '.claude/skills/manage-skill-flavors/**'
      - '.gitignore'
      - 'package.json'
      - 'version-manifest.json'
      - 'README.md'
      - 'LICENSE'
      - 'CODEOWNERS'
      - 'docs/RELEASE.md'
      - '.github/workflows/publish.yml'
      - '.github/workflows/validate-skill-flavors.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Build and inspect every skill package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install focused test dependencies
        run: python3 -m pip install pytest pyyaml

      - name: Test the flavor composer and contributor contracts
        run: >-
          python3 -m pytest -q
          tests/scripts/test_skill_flavor_composer.py
          tests/scripts/test_manage_skill_flavors_skill.py

      - name: Validate source contracts
        run: npm run skills:validate

      - name: Build complete trees and real npm tarballs
        run: npm run skills:pack

      - name: Ensure build-only markers do not reach consumers
        run: |
          if rg -n '<!-- skill-flavor:' build/skills build/packages; then
            echo 'Flavor marker leaked into a built tree or staged package.' >&2
            exit 1
          fi

      - name: Upload package tarballs for inspection
        uses: actions/upload-artifact@v4
        with:
          name: skill-flavor-packages
          path: build/npm/*.tgz
          if-no-files-found: error
