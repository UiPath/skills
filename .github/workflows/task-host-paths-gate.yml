name: Task Host-Path Gate

# Blocks new $TASK_DIR / $SKILLS_REPO_PATH host-path references added under
# tests/tasks/. #3271 migrated the task corpus off these two host-path escape
# hatches (sandbox drivers don't have a full host repo checkout — shared
# fixtures/scripts belong in sandbox.template_sources or are reached via
# $REFERENCE_DIR), but nothing stopped later commits from reintroducing them.
# See scripts/check-task-host-paths.py for the full rationale and the
# documented pre-existing exceptions this gate deliberately leaves alone.
#
# No `paths:` filter so this can run unconditionally — see
# validate-skills-sh.yml for why a path filter is unsafe for this class of gate.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: task-host-paths-gate-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event.action == 'synchronize' }}

permissions:
  contents: read

jobs:
  gate:
    runs-on: uipath-ubuntu-latest
    name: No new task TASK_DIR/SKILLS_REPO_PATH references
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          # On a pull_request event this checks out refs/pull/N/merge, whose
          # first parent (HEAD^1) is the base commit — see
          # validate-skills-sh.yml for why that beats the event payload's
          # pull_request.base.sha.
          fetch-depth: 2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with: { python-version: '3.13' }

      - name: Check for new $TASK_DIR/$SKILLS_REPO_PATH references
        env:
          IS_PR: ${{ github.event_name == 'pull_request' }}
        run: |
          if [ "$IS_PR" = "true" ]; then
            python3 scripts/check-task-host-paths.py --base-ref HEAD^1
          else
            python3 scripts/check-task-host-paths.py --full
          fi
