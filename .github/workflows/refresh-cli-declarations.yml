name: Refresh CLI declaration snapshots

# Skills restate things the `uip` CLI declares (the case task types today; the
# rule types per scope and the browser command list next). Each restatement is
# tested against a committed snapshot of the declaration, but the snapshot
# itself was refreshed by hand, and the test comparing it with the live CLI
# skips in CI because the checker jobs install no `uip`. This job closes that
# gap (MST-16782): nightly, it reads every declaration registered in
# scripts/refresh-cli-declarations.py from `@uipath/cli@dev`, and when the part
# a copy must match has moved, opens one PR that names what moved and which
# hand-kept copies now fail. A version-only bump opens nothing.
#
# Same shape and the same secret split as refresh-uip-catalog.yml; read that
# file's comments for why each piece is there. Unlike the catalog PR, this one
# is never auto-merged: automerge-catalog-refresh.yml selects only
# `auto/refresh-uip-catalog-*` branches, and a drift PR wants a reader.

on:
  schedule:
    - cron: '30 4 * * *' # daily at 04:30 UTC, after the catalog refresh
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: uipath-ubuntu-latest
    env:
      UIPATH_CLI_DISABLE_VERSION_SYNC: "1"
      # Tool plugins that carry a registered declaration, installed at the
      # CLI's own dist-tag. Add one here when a declaration lives in a tool
      # not listed yet.
      DECLARATION_TOOLS: "@uipath/maestro-tool"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Check for existing open refresh PR
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh pr list \
            --state open \
            --json number,url,headRefName \
            --jq '[.[] | select(.headRefName | startswith("auto/refresh-cli-declarations"))] | .[0] // empty')

          if [ -n "$EXISTING" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Existing refresh PR still open: #$(echo "$EXISTING" | jq -r '.number') — $(echo "$EXISTING" | jq -r '.url')"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        if: steps.check.outputs.exists != 'true'
        with:
          node-version: '20'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        if: steps.check.outputs.exists != 'true'
        with:
          python-version: '3.13'

      - name: Install uip CLI and declaration tools (GitHub Packages @dev)
        if: steps.check.outputs.exists != 'true'
        env:
          # Feed read only, never the repo-write PAT (see refresh-uip-catalog.yml).
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GH_PAT }}
        run: |
          npm config set @uipath:registry https://npm.pkg.github.com/
          npm config set //npm.pkg.github.com/:_authToken "$NODE_AUTH_TOKEN"
          # Tools must ride the CLI's train to load against a -dev CLI; raw npm,
          # not `uip tools install`, because `dev` is a dist-tag, not a channel.
          npm install -g @uipath/cli@dev $(for t in $DECLARATION_TOOLS; do printf '%s@dev ' "$t"; done)
          uip --version
          pip install pytest

      - name: Refresh declaration snapshots
        if: steps.check.outputs.exists != 'true'
        id: refresh
        # Exit 1 (a declaration could not be read) fails the job and opens no
        # PR: a missing command is a broken install or a removed command, and
        # either needs a person, not a snapshot edit.
        run: python3 scripts/refresh-cli-declarations.py --report "$RUNNER_TEMP/declarations-report.md"

      - name: Open PR with refreshed snapshots
        if: steps.check.outputs.exists != 'true' && steps.refresh.outputs.changed == 'true'
        # PAT, not GITHUB_TOKEN, so the PR triggers the `pull_request:` checks
        # that show which copies fail (see refresh-uip-catalog.yml).
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail

          RAW_VERSION=$(uip --version | tail -n 1 | awk '{print $NF}' | tr -d '\r\n')
          CLI_VERSION="${RAW_VERSION//[^a-zA-Z0-9._-]/_}"
          BRANCH="auto/refresh-cli-declarations-${CLI_VERSION}-$(date -u +%Y%m%d)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          # Tracked files only: the snapshots and whatever their generators rewrote.
          git add -u
          git commit -m "chore: refresh CLI declaration snapshots ($CLI_VERSION)"
          git push -u origin "$BRANCH"

          PR_CREATED=false
          cleanup_branch() {
            if [ "$PR_CREATED" != "true" ]; then
              echo "::warning::PR creation did not complete — deleting pushed branch $BRANCH"
              git push origin --delete "$BRANCH" || true
            fi
          }
          trap cleanup_branch EXIT

          gh label create automated \
            --color cccccc \
            --description "Bot-generated automated PR" \
            --force \
            || echo "::warning::gh label create failed — continuing to PR creation"

          gh pr create \
            --title "chore: refresh CLI declaration snapshots ($CLI_VERSION)" \
            --body-file "$RUNNER_TEMP/declarations-report.md" \
            --label "automated"

          PR_CREATED=true
