name: Run Coder Eval

# GH-hosted runner for coder-eval against the skills task tree. Use cases:
# single task ad-hoc, a folder, or (with explicit confirmation) the full
# suite that the VM cron runs nightly. Long-term replacement for the
# coder-eval-runner VM.
#
# Tasks are split by the `windows` tag (see tests/README.md#tag-taxonomy):
# windows-tagged tasks run on `windows-latest` (Helm/Studio is Windows-only,
# tempdir driver), everything else runs on `ubuntu-latest` (Docker driver
# + experiments/nightly.yaml). Both jobs receive the resolved file list
# from the `partition` job — never the raw glob.

on:
  workflow_dispatch:
    inputs:
      task_globs:
        description: 'REQUIRED. Space-separated globs under tests/. E.g. tasks/uipath-agents/**/*.yaml'
        type: string
        required: true
      # Host-level concurrency for the Linux job's `coder-eval -j`. Default 4:
      # ubuntu-latest is 4 vCPU, and j=20 oversubscribes ~5:1 — agents miss the
      # 1200s turn timeout and ERROR (false negatives, including a bindings
      # test) instead of failing on logic. Repro on a j=20 run:
      # https://github.com/UiPath/skills/actions/runs/26651052875
      parallelism:
        description: 'Parallel tasks for the Linux job (-j). Keep ≤4 on ubuntu-latest (4 vCPU).'
        type: string
        required: false
        default: '4'
      confirm_large_run:
        description: 'Allow >50 tasks (cost guardrail).'
        type: boolean
        default: false
      # Framework version. tests/.coder-eval-version is the single source of
      # truth for this repo — smoke-skills.yml, activation-gate.yml,
      # smoke-rpa-skills.yml and the nightly VM's daily.sh all read it — so an
      # ad-hoc run here executes the SAME framework version as the PR gates.
      # Do NOT drop this in favour of resolving through the coder_eval_uipath
      # plugin's own dependency range: that range is an open `0.9.x` and `uv pip
      # install <path>` ignores the plugin's lockfile, so this workflow would
      # drift onto any release in the range with nothing flagging it — and there
      # would be no way to pin or roll back a bad one. Blank = the pin; set an
      # exact version to dry-run a candidate release (daily.sh's
      # CODER_EVAL_VERSION override).
      coder_eval_version:
        description: 'coder-eval version (blank = tests/.coder-eval-version pin).'
        type: string
        default: ''
      # The coder_eval_uipath plugin (private repo UiPath/coder_eval_uipath)
      # registers the delegate-sdk agent and its pricing. Checked out and
      # installed for `agent: delegate-sdk` ONLY — the same gate daily.sh
      # applies — because its register() monkeypatches core apply_overrides and
      # mutates the pricing table: installing it unconditionally would put a
      # delegate-only code path on every claude/codex/antigravity run and make
      # those runs depend on this private checkout succeeding. Ignored for the
      # other agents.
      coder_eval_uipath_ref:
        description: 'coder_eval_uipath git ref (blank = main). delegate-sdk only.'
        type: string
        default: ''
      # Decouples the GHCR agent image from the wheel version, so an ad-hoc /
      # unreleased image (e.g. a codex-baked `sha-<commit>` build) can be tested
      # while the host CLI installs the pinned wheel.
      coder_eval_image_tag:
        description: 'Agent image tag (blank = pinned coder-eval version).'
        type: string
        default: ''
      cli_version:
        description: '@uipath/cli version.'
        type: string
        default: dev
      # delegate-sdk = UiPath Autopilot via @uipath/delegate-stdio, from the
      # coder_eval_uipath plugin. Linux runs it through the docker overlay image;
      # Windows runs it in-process on the host (tempdir driver) with its own
      # delegate-stdio install, ROPC user token, and shared interop — ports of
      # coder_eval_uipath's daily.sh / daily-windows.ps1 wiring.
      agent:
        description: 'Agent to run.'
        type: choice
        options:
          - claude
          - codex
          - antigravity
          - delegate-sdk
        default: claude
      # Overrides the model for ANY agent. Blank keeps that harness's own repo
      # variable (CLAUDE_CODE_MODEL / CODEX_MODEL / ANTIGRAVITY_MODEL).
      agent_model:
        description: 'Model override (blank = default).'
        type: string
        default: ''

# No concurrency group: this is a manual, on-demand workflow — allow any number
# of runs (e.g. the same task across claude / codex / antigravity) at once.

# Exempt the first-party `coder-eval` wheel from safe-chain's
# minimum-package-age suppression so a same-day release named in
# tests/.coder-eval-version still installs — see smoke-skills.yml
# for the full rationale. Workflow-level so both the Linux and Windows
# install steps, and any job added later, inherit it.
env:
  SAFE_CHAIN_MINIMUM_PACKAGE_AGE_EXCLUSIONS: coder-eval

jobs:
  partition:
    runs-on: uipath-ubuntu-latest
    name: Partition globs by `windows` tag
    outputs:
      linux_globs:    ${{ steps.split.outputs.linux_globs }}
      windows_globs:  ${{ steps.split.outputs.windows_globs }}
      linux_count:    ${{ steps.split.outputs.linux_count }}
      windows_count:  ${{ steps.split.outputs.windows_count }}
      coder_eval_version:    ${{ steps.ceref.outputs.version }}
      coder_eval_uipath_ref: ${{ steps.ceref.outputs.ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      # Two independent knobs, resolved once here so both run jobs install the
      # same thing: the framework wheel version (tests/.coder-eval-version — the
      # pin smoke-skills.yml / activation-gate.yml / smoke-rpa-skills.yml and
      # the nightly VM also read, overridable to dry-run a candidate release)
      # and the coder_eval_uipath plugin ref (delegate-sdk only). Mirrors the
      # version resolution in daily.sh.
      - name: Resolve coder-eval version + coder_eval_uipath ref
        id: ceref
        env:
          CE_VERSION_INPUT:    ${{ inputs.coder_eval_version }}
          CE_UIPATH_REF_INPUT: ${{ inputs.coder_eval_uipath_ref }}
        run: |
          set -euo pipefail
          version="$CE_VERSION_INPUT"
          if [ -z "$version" ]; then
            version="$(tr -d '[:space:]' < tests/.coder-eval-version || true)"
          fi
          if [ -z "$version" ]; then
            echo "::error::tests/.coder-eval-version is missing or empty and no coder_eval_version input was given"
            exit 1
          fi
          echo "coder-eval pinned to $version; coder_eval_uipath ref ${CE_UIPATH_REF_INPUT:-main}"
          echo "version=$version"                  >> "$GITHUB_OUTPUT"
          echo "ref=${CE_UIPATH_REF_INPUT:-main}"  >> "$GITHUB_OUTPUT"

      - name: Resolve globs, split by tag, enforce large-run gate
        id: split
        env:
          INPUT_GLOBS: ${{ inputs.task_globs }}
          CONFIRMED:   ${{ inputs.confirm_large_run }}
        run: |
          set -euo pipefail
          if [ -z "$INPUT_GLOBS" ]; then
            echo "::error::task_globs is required"
            exit 1
          fi
          shopt -s globstar nullglob
          cd tests
          LINUX=()
          WINDOWS=()
          for pat in $INPUT_GLOBS; do
            for f in $pat; do
              [ -f "$f" ] || continue
              # Tag is the literal token `windows` on the `tags:` line.
              # Word boundary keeps `feature:windows-foo` (hypothetical)
              # from matching.
              if grep -qE '^tags:.*\bwindows\b' "$f"; then
                WINDOWS+=("$f")
              else
                LINUX+=("$f")
              fi
            done
          done
          LCOUNT=${#LINUX[@]}
          WCOUNT=${#WINDOWS[@]}
          TOTAL=$((LCOUNT + WCOUNT))
          echo "Matched $TOTAL task file(s): $LCOUNT linux + $WCOUNT windows"
          if [ "$TOTAL" -eq 0 ]; then
            echo "::error::No task files matched the provided globs"
            exit 1
          fi
          if [ "$TOTAL" -gt 50 ] && [ "$CONFIRMED" != "true" ]; then
            echo "::error::Glob matches $TOTAL tasks (> 50). Tick confirm_large_run to authorize."
            exit 1
          fi
          # Space-separated; downstream jobs word-split on consumption.
          echo "linux_globs=${LINUX[*]:-}"     >> "$GITHUB_OUTPUT"
          echo "windows_globs=${WINDOWS[*]:-}" >> "$GITHUB_OUTPUT"
          echo "linux_count=$LCOUNT"            >> "$GITHUB_OUTPUT"
          echo "windows_count=$WCOUNT"          >> "$GITHUB_OUTPUT"

  run-linux:
    needs: partition
    if: needs.partition.outputs.linux_count != '0'
    # TODO: switch to `ubuntu-latest-16-cores` (16 vCPU / 64 GB RAM) once
    # the UiPath/skills repo is allowlisted for that runner group. Standard
    # ubuntu-latest (4 vCPU) handles ad-hoc single-task / small-folder runs at
    # the default `parallelism` (4); the larger tier is needed to raise -j for
    # the full nightly sweep to finish in ~30-45min instead of multi-hour.
    runs-on: uipath-ubuntu-latest
    # Full skills suite on the VM (~700 tasks, j=1) runs 3-4h. 330 min
    # covers worst-case stalls (one slow task pinning a slot, network
    # hiccups, etc.).
    timeout-minutes: 330
    name: Run coder-eval (Linux)
    # Disable uip CLI version-sync: a task's `uip login status` re-pins
    # ~/.uipath/config.json to a stale line and, via nightly.yaml's shared
    # ~/.uipath mount, downgrades the CLI for later tasks. Mirrors daily.sh.
    env:
      UIPATH_CLI_DISABLE_VERSION_SYNC: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      # The coder_eval_uipath plugin (private repo): registers the delegate-sdk
      # agent via the `coder_eval.plugins` entry point and carries the delegate
      # docker-overlay build context. delegate-sdk ONLY (same gate as daily.sh):
      # its register() monkeypatches core apply_overrides and mutates the pricing
      # table, and the other agents must not depend on this private checkout
      # succeeding. Needs a repo-read token — GH_PACKAGES_TOKEN is packages-only,
      # so this is the one step that requires GH_PAT. persist-credentials: false
      # keeps that PAT out of .git/config: this checkout doubles as the overlay
      # docker build context below.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        if: inputs.agent == 'delegate-sdk'
        with:
          repository: UiPath/coder_eval_uipath
          ref: ${{ needs.partition.outputs.coder_eval_uipath_ref }}
          token: ${{ secrets.GH_PAT }}
          path: coder_eval_uipath
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.13'

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4.2.0

      # Host coder-eval CLI at the version the partition job resolved, plus — for
      # delegate-sdk only — the coder_eval_uipath plugin from the checkout above.
      # ONE uv invocation so the `==` pin and the local plugin co-resolve: `uv pip
      # install <path>` ignores the plugin's lockfile and its dependency range is
      # an open `0.9.x`, so the pin is what keeps this run on the same framework
      # version as smoke-skills.yml and the nightly VM. Agent extras stay
      # unpinned — they ride the same resolve. The Linux docker driver still
      # imports the selected agent class on the host before dispatching work, so
      # the plugin and the extras must be installed here as well as in the
      # container image. The pinned version doubles as the default agent image
      # tag (a non-blank coder_eval_image_tag input overrides it for ad-hoc /
      # unreleased images).
      #
      # Coupling this creates, on purpose: the pin must sit INSIDE the plugin's
      # declared coder-eval range (currently `>=0.9.5,<0.10.0`). If a
      # tests/.coder-eval-version bump lands before coder_eval_uipath widens its
      # range, this step fails at resolve time with uv's "requirements are
      # unsatisfiable" — loudly, before any task runs, and only on delegate-sdk.
      # That is the point: the alternative (resolving through the plugin's open
      # range) silently drifts. Fix by widening the plugin's range, or pass an
      # in-range coder_eval_version for the delegate run.
      - name: Install coder-eval
        env:
          AGENT: ${{ inputs.agent }}
          CE_VERSION: ${{ needs.partition.outputs.coder_eval_version }}
          CE_IMAGE_TAG_INPUT: ${{ inputs.coder_eval_image_tag }}
        run: |
          set -euo pipefail
          case "$AGENT" in
            codex)        pkgs=("coder-eval[codex]==$CE_VERSION") ;;
            antigravity)  pkgs=("coder-eval[antigravity]==$CE_VERSION") ;;
            delegate-sdk) pkgs=("coder-eval==$CE_VERSION" ./coder_eval_uipath) ;;
            *)            pkgs=("coder-eval==$CE_VERSION") ;;
          esac
          uv pip install --system "${pkgs[@]}"
          python -c 'from importlib.metadata import version; print("coder-eval resolved to", version("coder-eval"))'
          echo "CE_IMAGE_TAG=${CE_IMAGE_TAG_INPUT:-$CE_VERSION}" >> "$GITHUB_ENV"

      # Pull the agent image from GHCR (never built from source); the skills
      # image extends it below. Tag defaults to the pinned coder-eval version
      # (CE_IMAGE_TAG from the install step) but can be overridden
      # (coder_eval_image_tag) for ad-hoc / unreleased images.
      # Needs read:packages only — GH_PACKAGES_TOKEN, never the repo-write PAT.
      # This workflow is `workflow_dispatch`-triggered, so it is not exposed to
      # the fork/branch-push reader that motivates the split in smoke-skills.yml
      # and smoke-rpa-skills.yml; the narrower token is least-privilege here.
      - name: Pull coder-eval-agent image
        run: |
          echo "${{ secrets.GH_PACKAGES_TOKEN || secrets.GH_PAT }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "ghcr.io/uipath/coder-eval-agent:${CE_IMAGE_TAG}"

      # Build the skills extension image (`@uipath/cli` + `@uipath/admin-tool`
      # on top of coder-eval-agent). Matches smoke-skills.yml + daily.sh.
      - name: Build skills Docker image
        env:
          DOCKER_BUILDKIT: "1"
          NPM_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GH_PAT }}
        run: |
          docker build \
            --build-arg CODER_EVAL_IMAGE="ghcr.io/uipath/coder-eval-agent:${CE_IMAGE_TAG}" \
            --secret id=npm_auth_token,env=NPM_AUTH_TOKEN \
            --build-arg CLI_VERSION="${{ inputs.cli_version }}" \
            -t skills-image:latest \
            -f tests/docker/Dockerfile \
            .

      # delegate-sdk under the docker driver: the orchestrator runs INSIDE the
      # container, so the coder_eval_uipath plugin (delegate-sdk registration)
      # and the @uipath/delegate-stdio Node host it shells out to must live in
      # the IMAGE — the host install above is invisible there. Overlay them onto
      # skills-image and re-tag, so nightly.yaml's `image: skills-image:latest`
      # reference picks them up unchanged; other agents keep the stock image.
      # The overlay also wraps the container entrypoint with a supervised shared
      # interop (see the Dockerfile for why). Mirrors daily.sh in coder_eval_uipath.
      - name: Overlay skills image for delegate-sdk
        if: inputs.agent == 'delegate-sdk'
        env:
          DOCKER_BUILDKIT: "1"
          GH_NPM_REGISTRY_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GH_PAT }}
        run: |
          docker build \
            --build-arg BASE_IMAGE=skills-image:latest \
            --build-arg DELEGATE_STDIO_VERSION=alpha \
            --secret id=gh_npm,env=GH_NPM_REGISTRY_TOKEN \
            -t skills-image:latest \
            -f coder_eval_uipath/eval_runner/scripts/ci/delegate-overlay.Dockerfile \
            coder_eval_uipath

      # Campaign-only preview arm. This temporary branch keeps checker paths on
      # the real checkout while pointing the Claude plugin at a staged copy in
      # which the three Maestro skills are replaced by their preview versions.
      - name: Stage preview Maestro plugin
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/maestro-preview-plugin"
          experiment="$RUNNER_TEMP/maestro-preview-nightly.yaml"
          mkdir -p "$stage"
          git archive HEAD | tar -x -C "$stage"
          for skill in uipath-maestro-flow uipath-maestro-case uipath-maestro-bpmn; do
            rm -rf "$stage/skills/$skill"
            cp -a "$stage/preview/$skill" "$stage/skills/$skill"
          done
          cp tests/experiments/nightly.yaml "$experiment"
          sed -i "s|path: \"\\\$SKILLS_REPO_PATH\"|path: \"$stage\"|" "$experiment"
          sed -i "/~\\/.uipath:\/.uipath:rw/a\\        - $GITHUB_WORKSPACE:/skills-repo:ro" "$experiment"
          sed -i "/~\\/.uipath:\/.uipath:rw/a\\        - $GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" "$experiment"
          grep -F "path: \"$stage\"" "$experiment"
          grep -F "$GITHUB_WORKSPACE:/skills-repo:ro" "$experiment"
          grep -F "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" "$experiment"
          echo "EVAL_EXPERIMENT=$experiment" >> "$GITHUB_ENV"

      # ROPC bot-user auth via this repo's vendored script (mirrors the VM
      # cron's ROPC flow). Required because `uip flow debug` needs a real user
      # `sub` claim — s2s/client_credentials tokens lack one. Writes
      # ~/.uipath/.auth which experiments/nightly.yaml mounts into each eval
      # container.
      - name: Mint UiPath bot token (ROPC)
        env:
          UIPATH_URL:               https://alpha.uipath.com
          UIPATH_ORGANIZATION_NAME: ${{ secrets.UIPATH_ORG_NAME }}
          UIPATH_ORGANIZATION_ID:   ${{ secrets.UIPATH_ORG_ID }}
          UIPATH_TENANT_NAME:       ${{ secrets.UIPATH_TENANT_NAME }}
          UIPATH_TENANT_ID:         ${{ secrets.UIPATH_TENANT_ID }}
          CLIENT_ID:                ${{ secrets.UIPATH_ROPC_CLIENT_ID }}
          CLIENT_SECRET:            ${{ secrets.UIPATH_ROPC_CLIENT_SECRET }}
          CE_USERNAME:              ${{ secrets.UIPATH_BOT_USERNAME }}
          CE_PASSWORD:              ${{ secrets.UIPATH_BOT_PASSWORD }}
        run: bash .github/scripts/refresh-auth.sh

      # TASK_GLOBS here is the partition-resolved list of *file paths* (not
      # globs). Word-splitting is intentional — do not quote.
      - name: Run coder-eval
        env:
          SKILLS_REPO_PATH:         /skills-repo
          API_BACKEND:              bedrock
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          AWS_REGION:               ${{ secrets.AWS_REGION }}
          BEDROCK_MODEL:            ${{ secrets.BEDROCK_MODEL }}
          ANTHROPIC_API_KEY:        ${{ secrets.ANTHROPIC_API_KEY }}
          E2E_PROCESS_KEY:          ${{ secrets.E2E_PROCESS_KEY }}
          E2E_LONG_PROCESS_KEY:     ${{ secrets.E2E_LONG_PROCESS_KEY }}
          TASK_GLOBS:               ${{ needs.partition.outputs.linux_globs }}
          TASK_COUNT:               ${{ needs.partition.outputs.linux_count }}
          TASK_PARALLELISM:         ${{ inputs.parallelism }}
          AGENT:                    ${{ inputs.agent }}
          AGENT_MODEL:              ${{ inputs.agent_model }}
          # The model when agent_model is blank: one repo variable per harness, named the
          # same as the nightly runner's, and no hardcoded fallback — an unset variable
          # fails the run (guard below) rather than evaluating a model nobody chose.
          CLAUDE_CODE_MODEL:        ${{ vars.CLAUDE_CODE_MODEL }}
          CODEX_MODEL:              ${{ vars.CODEX_MODEL }}
          ANTIGRAVITY_MODEL:        ${{ vars.ANTIGRAVITY_MODEL }}
          DELEGATE_MODEL:           ${{ vars.DELEGATE_MODEL }}
          CODEX_API_KEY:            ${{ secrets.CODEX_API_KEY }}
          CODEX_BASE_URL:           ${{ secrets.CODEX_BASE_URL }}
          GEMINI_API_KEY:           ${{ secrets.GEMINI_API_KEY }}
          # Delegate host debugging knobs, as repo variables rather than
          # workflow inputs (the dispatch input budget is nearly full and these
          # are operator escape hatches, not per-run choices):
          #   DELEGATE_STDIO_VERBOSE        1/true forces the host's stdio
          #                                 protocol trace on, 0/false forces it
          #                                 off; unset follows coder-eval's -v.
          #   DELEGATE_STDIO_LOG_MAX_CHARS  per-traced-value cap (host default
          #                                 50000).
          #   USE_LLM_GATEWAY_FOR_FIREWORKS flips Fireworks transport per
          #                                 request (X-UiPath-Use-Llm-Gateway-
          #                                 For-Fireworks, honoured by alpha).
          # Suffixed _VAR because an unset repo variable expands to the EMPTY
          # STRING, and an empty value is not the same as unset to the host — the
          # delegate branch below re-exports only the non-empty ones.
          DELEGATE_STDIO_VERBOSE_VAR:        ${{ vars.DELEGATE_STDIO_VERBOSE }}
          DELEGATE_STDIO_LOG_MAX_CHARS_VAR:  ${{ vars.DELEGATE_STDIO_LOG_MAX_CHARS }}
          USE_LLM_GATEWAY_FOR_FIREWORKS_VAR: ${{ vars.USE_LLM_GATEWAY_FOR_FIREWORKS }}
        working-directory: tests
        id: eval
        run: |
          # Guard the empty case (e.g. a future non-dispatch trigger): the
          # `parallelism` input default (4) only applies on workflow_dispatch.
          j="${TASK_PARALLELISM:-4}"
          # Agent selection. claude is the default; codex authenticates via
          # CODEX_API_KEY/CODEX_BASE_URL, antigravity via GEMINI_API_KEY (SDK baked into
          # the agent image), delegate-sdk via the ROPC user token minted above. The
          # model always comes from the harness's own variable above, with the
          # agent_model input overriding any of them for a one-off run. Passed
          # explicitly because the experiment YAML pins no model (it is shared by all
          # harnesses). Driver is unchanged (docker here).
          delegate_overrides=()
          if [ "$AGENT" = "codex" ]; then
            model="${AGENT_MODEL:-${CODEX_MODEL:?unset — set the CODEX_MODEL repo variable}}"
            agent_flags="--type codex --model $model"
          elif [ "$AGENT" = "antigravity" ]; then
            model="${AGENT_MODEL:-${ANTIGRAVITY_MODEL:?unset — set the ANTIGRAVITY_MODEL repo variable}}"
            agent_flags="--type antigravity --model $model"
          elif [ "$AGENT" = "delegate-sdk" ]; then
            # Default kimi-k2-7-code (hyphenated id — the delegate host converts
            # it to the backend's underscored form); the optional DELEGATE_MODEL
            # repo variable or the agent_model input overrides it. The inherited
            # claude default is rejected by the alpha Delegate backend, so a
            # model must always be passed.
            model="${AGENT_MODEL:-${DELEGATE_MODEL:-kimi-k2-7-code}}"
            agent_flags="--type delegate-sdk --model $model"
            # Alpha backend rate limits: the reference pipeline caps delegate-sdk
            # at -j 6 (eval_runner cli.py HARNESS_CONCURRENCY — at -j 20 retry
            # backoff blew task timeouts into TIMEOUT waves, build 12599458).
            # Clamp rather than fail so a large `parallelism` input still runs.
            # Per-task isolation needs no cap: each container spawns its own
            # supervised interop on its own network namespace (overlay entrypoint).
            if [ "$j" -gt 6 ]; then
              echo "::notice::delegate-sdk: clamping -j $j to 6 (alpha Delegate backend rate limits)"
              j=6
            fi
            # Cloud env slug for the Delegate backend + first-response stall
            # recovery budget (mirrors daily.sh in coder_eval_uipath).
            export DELEGATE_SDK_ENV="${DELEGATE_SDK_ENV:-alpha}"
            export DELEGATE_STALL_TIMEOUT_S="${DELEGATE_STALL_TIMEOUT_S:-240}"
            # Delegate auth: reuse the ROPC USER token refresh-auth.sh wrote —
            # the Delegate backend rejects client_credentials tokens. The host
            # reads auth + org/tenant identity (GUIDs AND slugs — slugs build the
            # env=alpha backend URL) from these env vars, lifted straight out of
            # ~/.uipath/.auth. Mirrors daily.sh in coder_eval_uipath.
            # Every value is validated, not just the token: an empty ORG_LOGICAL_NAME
            # or TENANT_NAME yields a malformed env=alpha backend URL and a 404 deep
            # inside the first turn instead of a clear failure here.
            AUTH_FILE="$HOME/.uipath/.auth"
            for pair in AUTH_TOKEN:UIPATH_ACCESS_TOKEN \
                        TENANT_ID:UIPATH_TENANT_ID \
                        ORG_ID:UIPATH_ORGANIZATION_ID \
                        ORG_LOGICAL_NAME:UIPATH_ORGANIZATION_NAME \
                        TENANT_NAME:UIPATH_TENANT_NAME; do
              out="${pair%%:*}"; key="${pair##*:}"
              val="$(sed -n "s/^$key=//p" "$AUTH_FILE")"
              if [ -z "$val" ]; then
                echo "::error::no $key in $AUTH_FILE — the ROPC login did not complete"
                exit 1
              fi
              export "$out=$val"
            done
            # Re-export the debugging knobs above only when the repo variable is
            # actually set, so a blank one leaves the host on its own default.
            for knob in DELEGATE_STDIO_VERBOSE DELEGATE_STDIO_LOG_MAX_CHARS \
                        USE_LLM_GATEWAY_FOR_FIREWORKS; do
              src="${knob}_VAR"
              if [ -n "${!src:-}" ]; then
                export "$knob=${!src}"
                echo "delegate knob: $knob=${!src}"
              fi
            done
            # Live token channel: nightly.yaml bind-mounts ~/.uipath -> /.uipath,
            # and the host re-reads the first READABLE path per turn — so the
            # frozen AUTH_TOKEN env copy stops mattering past the ~1h ROPC TTL,
            # PROVIDED the file stays fresh. This workflow mints the token once
            # (no refresher loop like the nightly's), so runs longer than ~1h can
            # still hit token expiry on late tasks.
            export DELEGATE_AUTH_TOKEN_FILE="/.uipath/.auth:$AUTH_FILE"
            # Docker forwards only an env allowlist into the container; append
            # the delegate auth/env vars to nightly.yaml's own list (MergeField
            # append-semantics). Same list as run.py in coder_eval_uipath:
            # USER_ID is included for parity — the delegate host reads it when
            # the environment provides one, and it is simply unset (harmless)
            # here. DELEGATE_STDIO_PATH is deliberately NOT forwarded: the
            # overlay image bakes its own, and the host path would not resolve
            # in-container. Built as an ARRAY and quoted at the call site: to bash
            # the `[...]` list is a glob character class, so an unquoted expansion
            # silently collapses the whole flag to `...extra=<char>` if a file of
            # that name ever exists in the tests/ cwd. Unlikely, but an array
            # costs nothing and removes the class of bug outright.

            delegate_env="AUTH_TOKEN,DELEGATE_AUTH_TOKEN_FILE,TENANT_ID,ORG_ID,USER_ID"
            delegate_env="$delegate_env,ORG_LOGICAL_NAME,TENANT_NAME,DELEGATE_SDK_ENV"
            delegate_env="$delegate_env,DELEGATE_STALL_TIMEOUT_S,USE_LLM_GATEWAY_FOR_FIREWORKS"
            delegate_env="$delegate_env,DELEGATE_STDIO_VERBOSE,DELEGATE_STDIO_LOG_MAX_CHARS"
            delegate_overrides=(-D "sandbox.docker.env_passthrough_extra=[$delegate_env]")
          else
            model="${AGENT_MODEL:-${CLAUDE_CODE_MODEL:?unset — set the CLAUDE_CODE_MODEL repo variable}}"
            agent_flags="--model $model"
          fi
          echo "Running: coder-eval run $TASK_GLOBS -e $EVAL_EXPERIMENT $agent_flags ${delegate_overrides[*]} -j $j ($TASK_COUNT task files)"
          coder-eval run $TASK_GLOBS \
            -e "$EVAL_EXPERIMENT" \
            $agent_flags \
            "${delegate_overrides[@]}" \
            -j "$j" -v \
            --run-dir /tmp/runs

      - name: Fix permissions on /tmp/runs
        if: always()
        run: sudo chown -R $(id -u):$(id -g) /tmp/runs && sudo chmod -R 755 /tmp/runs 2>/dev/null || true

      # Strip heavy task scratch dirs before upload to keep artifact size
      # manageable. Matches smoke-skills.yml.
      - name: Clean up artifacts (remove .venv and node_modules)
        if: always()
        run: |
          find /tmp/runs -type d \( -name .venv -o -name node_modules \) -path "*/artifacts/*" -exec rm -rf {} + || true

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: coder-eval-linux-${{ github.run_id }}
          # ** so the pattern matches the replicate-index segment that
          # coder_eval adds to per-task run dirs (/tmp/runs/<ts>/<variant>/<task>/<NN>/).
          path: |
            /tmp/runs/*/experiment.html
            /tmp/runs/*/experiment.md
            /tmp/runs/*/experiment.json
            /tmp/runs/*/experiment.log
            /tmp/runs/*/*/variant.html
            /tmp/runs/*/*/variant.md
            /tmp/runs/*/*/variant.json
            /tmp/runs/**/task.html
            /tmp/runs/**/task.json
            /tmp/runs/**/task.log
            /tmp/runs/**/artifacts
          if-no-files-found: warn
          retention-days: 14

      - name: Plaintext summary + verdict
        if: always()
        run: |
          set -uo pipefail
          run_dir=$(ls -td /tmp/runs/*/ 2>/dev/null | head -n 1 || true)
          if [ -z "$run_dir" ]; then
            echo "FAIL — no run directory produced" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          python - "$run_dir" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, pathlib, sys
          rows = [json.loads(p.read_text(encoding='utf-8')) for p in sorted(pathlib.Path(sys.argv[1]).rglob('task.json'))]
          for r in rows:
              print(f"{r.get('task_id','?')}: {r.get('final_status','?')}")
          ok = sum(1 for r in rows if r.get('final_status') == 'SUCCESS')
          print(f"\n{ok}/{len(rows)} PASS (linux)")
          sys.exit(0 if rows and ok == len(rows) else 1)
          PY

  run-windows:
    needs: partition
    if: needs.partition.outputs.windows_count != '0'
    runs-on: uipath-windows-latest
    # Windows RPA tasks spin up Helm on each `uip rpa` call (30–60s each)
    # and run j=1 (Helm state leaks between concurrent tasks). Budget
    # mirrors smoke-rpa-skills.yml plus headroom for ad-hoc / e2e runs.
    timeout-minutes: 240
    name: Run coder-eval (Windows)
    # Disable uip CLI version-sync: tempdir tasks share one host ~/.uipath /
    # global uip, so a `uip login status` re-pin downgrades later tasks.
    # Mirrors daily.sh.
    env:
      UIPATH_CLI_DISABLE_VERSION_SYNC: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      # The coder_eval_uipath plugin (private repo): registers the delegate-sdk
      # agent this job runs in-process under the tempdir driver. delegate-sdk
      # only — see the Linux job's checkout for the full rationale on the gate,
      # the token, and persist-credentials.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        if: inputs.agent == 'delegate-sdk'
        with:
          repository: UiPath/coder_eval_uipath
          ref: ${{ needs.partition.outputs.coder_eval_uipath_ref }}
          token: ${{ secrets.GH_PAT }}
          path: coder_eval_uipath
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.13'

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4.2.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '20'

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4.3.1
        with:
          dotnet-version: '8.0.x'

      # Host coder-eval CLI at the version the partition job resolved, plus — for
      # delegate-sdk only — the coder_eval_uipath plugin from the checkout above.
      # Same pin-plus-plugin scheme as the Linux job (see there for why the `==`
      # pin, not the plugin's open range, decides the version). Windows tasks run
      # under the tempdir driver — no agent image.
      - name: Install coder-eval
        shell: bash
        env:
          AGENT: ${{ inputs.agent }}
          CE_VERSION: ${{ needs.partition.outputs.coder_eval_version }}
        run: |
          set -euo pipefail
          # Windows runs the tempdir driver (agent on host), so the codex SDK
          # installed here is what the codex agent actually uses. openai-codex
          # 0.1.0b3 (verified against coder-eval 0.6.2) pulls a pre-release
          # cli-bin that spans both internal feeds, so allow pre-releases and
          # best-match across indexes. The antigravity SDK (google-antigravity,
          # via the unpinned [antigravity] extra) is needed here for the same
          # in-process reason — the docker path bakes it into the agent image.
          case "$AGENT" in
            codex)
              uv pip install --system "coder-eval==$CE_VERSION"
              uv pip install --system --prerelease=allow --index-strategy unsafe-best-match \
                "openai-codex==0.1.0b3"
              ;;
            antigravity)  uv pip install --system "coder-eval[antigravity]==$CE_VERSION" ;;
            delegate-sdk) uv pip install --system "coder-eval==$CE_VERSION" ./coder_eval_uipath ;;
            *)            uv pip install --system "coder-eval==$CE_VERSION" ;;
          esac
          python -c 'from importlib.metadata import version; print("coder-eval resolved to", version("coder-eval"))'

      - name: Configure NuGet feed for Helm packages
        shell: bash
        run: |
          dotnet nuget add source \
            "https://uipath.pkgs.visualstudio.com/Public.Feeds/_packaging/UiPath-Internal/nuget/v3/index.json" \
            --name UiPath-Internal \
            --username az \
            --password "${{ secrets.UV_INDEX_UIPATH_PASSWORD }}" \
            --store-password-in-clear-text

      # Single-feed install: `@uipath/cli` AND the RPA tool plugins come from the
      # internal GitHub Packages feed on the same prerelease train (default `dev`),
      # so the Helm/RPA host matches the Linux Docker image. A public-npm STABLE
      # rpa-tool fails to load against a `-dev` CLI (the `rpa` group never
      # registers), so both must ride the same train. See smoke-rpa-skills.yml.
      - name: Install uip CLI + RPA tools (GH Packages @dev)
        shell: bash
        env:
          CLI_VERSION:    ${{ inputs.cli_version }}
          NPM_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GH_PAT }}
        run: |
          set -e
          install_dir="$(mktemp -d)"
          cd "$install_dir"
          npm config get registry

          # Install the CLI at CLI_VERSION and the RPA tool plugins at the dist-tag
          # DERIVED from it, all from the SAME GitHub Packages feed. Use a scratch
          # NPM_CONFIG_USERCONFIG so the @uipath→npm.pkg.github.com mapping and
          # auth token don't leak into other steps. Mirrors tests/docker/Dockerfile.
          #
          # RPA from the @dev train (not public-npm stable): under `dev`, rpa-tool
          # ships a matching 1.199.x-dev build (cli PR #2650 aligned it), so it
          # version-matches the dev CLI. A public-npm STABLE rpa-tool fails to load
          # against a -dev CLI — the `rpa` group never appears. Raw npm, not `uip
          # tools install`: `dev` is a publish dist-tag, not a release channel, so
          # `uip tools install` resolves to `stable` and can't find a `-dev` tool.
          # npm resolves the tag directly; the CLI discovers the plugin on disk
          # under $(npm root -g)/@uipath/*.
          #
          # Pin contract: CLI_VERSION may be a dist-tag (`dev`) or an exact CLI pin
          # (`1.199.0-dev.<run>`). rpa-tool/rpa-legacy-tool publish on their own
          # date-stamped pipelines, so an exact CLI pin has no matching rpa build —
          # install the tools at the TRAIN's tag instead. A pin freezes the CLI
          # shell; the tools always ride the train's tag.
          case "$CLI_VERSION" in
            *-*)    TOOL_TAG="${CLI_VERSION#*-}"; TOOL_TAG="${TOOL_TAG%%.*}" ;;
            [0-9]*) TOOL_TAG="latest" ;;
            *)      TOOL_TAG="$CLI_VERSION" ;;
          esac
          echo "CLI_VERSION=$CLI_VERSION -> RPA tool dist-tag @$TOOL_TAG"
          tmp_npmrc="$(mktemp)"
          cat > "$tmp_npmrc" <<EOF
          @uipath:registry=https://npm.pkg.github.com/
          //npm.pkg.github.com/:_authToken=${NPM_AUTH_TOKEN}
          EOF
          NPM_CONFIG_USERCONFIG="$tmp_npmrc" npm install -g \
            "@uipath/cli@${CLI_VERSION}" \
            "@uipath/rpa-tool@${TOOL_TAG}" \
            "@uipath/rpa-legacy-tool@${TOOL_TAG}"
          rm -f "$tmp_npmrc"
          uip --version
          echo "--- Installed @uipath/* packages ---"
          npm ls -g --depth=0 2>/dev/null | grep '@uipath/' || true
          echo "--- uip tools list ---"
          uip tools list --output json

      # Pre-auth uip as a real licensed Studio user via Studio's e2e helper.
      # Required for Helm's HelmLicenseSkuFeatureSourceService gate, which
      # client_credentials principals don't clear. See smoke-rpa-skills.yml
      # for the full rationale.
      - name: Install Puppeteer (auth helper dep)
        shell: bash
        run: npm install --no-save puppeteer

      - name: Authenticate uip as licensed Studio user
        id: auth
        shell: bash
        env:
          AUTHORITY: https://alpha.uipath.com
          EMAIL:    ${{ secrets.UIPATH_EMAIL }}
          PASSWORD: ${{ secrets.UIPATH_PASSWORD }}
          TENANT:   ${{ secrets.UIPATH_TENANT }}
          ORG:      ${{ secrets.UIPATH_ORG }}
          AUTH_DEBUG_DIR: ${{ github.workspace }}/auth-debug
        run: |
          set -euo pipefail
          mkdir -p "$AUTH_DEBUG_DIR"
          for attempt in 1 2 3; do
            echo "--- Auth attempt $attempt ---"
            if node .github/scripts/uipath-oauth-login.mjs; then
              break
            fi
            if [ "$attempt" = "3" ]; then
              echo "::error::Auth failed after 3 attempts"
              exit 1
            fi
            sleep 5
          done
          uip login status --output json

      - name: Upload auth-debug artifacts
        if: always() && steps.auth.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: auth-debug-windows-${{ github.run_id }}
          path: ${{ github.workspace }}/auth-debug
          if-no-files-found: ignore
          retention-days: 7

      - name: Pre-warm Helm (download NuGet package before tests)
        shell: bash
        run: |
          mkdir -p /tmp/helm-warmup && cd /tmp/helm-warmup
          uip rpa list-instances --output json 2>&1 || true
          taskkill //F //IM UiPath.Studio.Helm.exe 2>/dev/null || true

      # Delegate auth: a fresh ROPC USER token (the Delegate backend rejects
      # client_credentials tokens), minted to a SEPARATE file so the uip CLI's
      # own browser-OAuth login above stays intact — the nightly's
      # daily-windows.ps1 keeps the two apart for the same reason. The file
      # doubles as DELEGATE_AUTH_TOKEN_FILE (same KEY=VALUE format the host
      # re-reads per turn on Linux).
      - name: Mint delegate user token (ROPC)
        if: inputs.agent == 'delegate-sdk'
        shell: bash
        env:
          AUTH_FILE:                 ${{ github.workspace }}/.delegate-sdk-auth
          UIPATH_URL:                https://alpha.uipath.com
          UIPATH_ORGANIZATION_NAME:  ${{ secrets.UIPATH_ORG_NAME }}
          UIPATH_ORGANIZATION_ID:    ${{ secrets.UIPATH_ORG_ID }}
          UIPATH_TENANT_NAME:        ${{ secrets.UIPATH_TENANT_NAME }}
          UIPATH_TENANT_ID:          ${{ secrets.UIPATH_TENANT_ID }}
          CLIENT_ID:                 ${{ secrets.UIPATH_ROPC_CLIENT_ID }}
          CLIENT_SECRET:             ${{ secrets.UIPATH_ROPC_CLIENT_SECRET }}
          CE_USERNAME:               ${{ secrets.UIPATH_BOT_USERNAME }}
          CE_PASSWORD:               ${{ secrets.UIPATH_BOT_PASSWORD }}
        run: bash .github/scripts/refresh-auth.sh

      # The @uipath/delegate-stdio Node host the delegate-sdk agent shells out
      # to. Windows runs the tempdir driver (agent in-process on this host), so
      # the bundle must be installed HERE, into a fixed dir pinned via
      # DELEGATE_STDIO_PATH (the agent's resolver probes only cwd/ancestors/HOME).
      # `alpha` dist-tag: the package publishes only prereleases, so a bare
      # install ETARGETs. The win32 interop runtime is an OPTIONAL npm dep that
      # can be skipped SILENTLY on resolution failure, so verify it and retry
      # explicitly at the version delegate-sdk pins. Mirrors daily-windows.ps1.
      - name: Install @uipath/delegate-stdio
        if: inputs.agent == 'delegate-sdk'
        shell: bash
        env:
          NPM_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GH_PAT }}
        run: |
          set -euo pipefail
          delegate_dir="$HOME/.delegate-stdio"
          mkdir -p "$delegate_dir"
          # Windows-form path (C:/Users/...) for everything a NATIVE process
          # touches: node -p can't resolve git-bash's MSYS form (/c/Users/...)
          # inside a require() string (MODULE_NOT_FOUND, run 32124577606), and
          # the GITHUB_ENV values below are consumed by native node/Python.
          # Mixed form (forward slashes) keeps bash's own tests working too.
          delegate_dir="$(cygpath -m "$delegate_dir")"
          tmp_npmrc="$(mktemp)"
          cat > "$tmp_npmrc" <<EOF
          @uipath:registry=https://npm.pkg.github.com/
          //npm.pkg.github.com/:_authToken=${NPM_AUTH_TOKEN}
          EOF
          ( cd "$delegate_dir" && NPM_CONFIG_USERCONFIG="$tmp_npmrc" \
              npm install "@uipath/delegate-stdio@alpha" )
          interop_exe="$delegate_dir/node_modules/@uipath/delegate-runtime-win32-x64/interop/UiPath.Aria.ComputerUse.Api.exe"
          if [ ! -f "$interop_exe" ]; then
            runtime_version="$(node -p "require('$delegate_dir/node_modules/@uipath/delegate-sdk/package.json').optionalDependencies['@uipath/delegate-runtime-win32-x64']")"
            for attempt in 1 2 3; do
              echo "delegate-runtime-win32-x64 missing after install; explicit retry of pinned $runtime_version (attempt $attempt/3)"
              ( cd "$delegate_dir" && NPM_CONFIG_USERCONFIG="$tmp_npmrc" \
                  npm install "@uipath/delegate-runtime-win32-x64@$runtime_version" --no-save ) || true
              [ -f "$interop_exe" ] && break
            done
            if [ ! -f "$interop_exe" ]; then
              echo "::error::shared interop binary still missing at $interop_exe after 3 explicit installs of @uipath/delegate-runtime-win32-x64@$runtime_version"
              exit 1
            fi
          fi
          rm -f "$tmp_npmrc"
          bundle="$delegate_dir/node_modules/@uipath/delegate-stdio/dist/delegate_stdio.mjs"
          if [ ! -f "$bundle" ]; then
            echo "::error::delegate-stdio bundle not found at $bundle after install"
            exit 1
          fi
          resolved="$(node -p "require('$delegate_dir/node_modules/@uipath/delegate-stdio/package.json').version")"
          echo "installed @uipath/delegate-stdio@$resolved — DELEGATE_STDIO_PATH=$bundle"
          echo "DELEGATE_STDIO_PATH=$bundle"   >> "$GITHUB_ENV"
          echo "DELEGATE_INTEROP_EXE=$interop_exe" >> "$GITHUB_ENV"

      # Run tasks one at a time on Windows: Helm state leaks between tasks
      # (stale Studio session, locked NuGet cache), so the loop kills Helm
      # between tasks. j=1 by construction.
      #
      # Uses experiments/smoke-windows.yaml (the only existing Windows
      # tempdir experiment); per-task `run_limits` in the YAML extend the
      # smoke budget where needed (e.g. legacy/refactor_with_retry_scope_e2e
      # sets max_turns: 50).
      - name: Run coder-eval (Windows)
        env:
          SKILLS_REPO_PATH:         ${{ github.workspace }}
          API_BACKEND:              bedrock
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          AWS_REGION:               ${{ secrets.AWS_REGION }}
          BEDROCK_MODEL:            ${{ secrets.BEDROCK_MODEL }}
          ANTHROPIC_API_KEY:        ${{ secrets.ANTHROPIC_API_KEY }}
          TASK_GLOBS:               ${{ needs.partition.outputs.windows_globs }}
          AGENT:                    ${{ inputs.agent }}
          AGENT_MODEL:              ${{ inputs.agent_model }}
          # The model when agent_model is blank: one repo variable per harness, named the
          # same as the nightly runner's, and no hardcoded fallback — an unset variable
          # fails the run (guard below) rather than evaluating a model nobody chose.
          CLAUDE_CODE_MODEL:        ${{ vars.CLAUDE_CODE_MODEL }}
          CODEX_MODEL:              ${{ vars.CODEX_MODEL }}
          ANTIGRAVITY_MODEL:        ${{ vars.ANTIGRAVITY_MODEL }}
          DELEGATE_MODEL:           ${{ vars.DELEGATE_MODEL }}
          CODEX_API_KEY:            ${{ secrets.CODEX_API_KEY }}
          CODEX_BASE_URL:           ${{ secrets.CODEX_BASE_URL }}
          GEMINI_API_KEY:           ${{ secrets.GEMINI_API_KEY }}
          DELEGATE_AUTH_FILE:       ${{ github.workspace }}/.delegate-sdk-auth
          # Delegate host debugging knobs — see the Linux job's run step for what
          # each does and why they are repo variables suffixed _VAR. The tempdir
          # driver runs the agent in-process, so no env allowlist is involved
          # here; the delegate branch below still re-exports only the non-empty
          # ones so a blank variable leaves the host on its own default.
          DELEGATE_STDIO_VERBOSE_VAR:        ${{ vars.DELEGATE_STDIO_VERBOSE }}
          DELEGATE_STDIO_LOG_MAX_CHARS_VAR:  ${{ vars.DELEGATE_STDIO_LOG_MAX_CHARS }}
          USE_LLM_GATEWAY_FOR_FIREWORKS_VAR: ${{ vars.USE_LLM_GATEWAY_FOR_FIREWORKS }}
          # Redirect the temp root off the default %TEMP%. On the GH-hosted
          # Windows runner %TEMP% resolves to its 8.3 short form
          # (C:\Users\RUNNER~1\AppData\Local\Temp). coder-eval creates each
          # agent sandbox under %TEMP%, so the sandbox path inherits the
          # `RUNNER~1` tilde segment — and Claude Code's permission layer
          # rejects writes to paths containing that 8.3 short-name pattern as
          # "suspicious", blocking the agent's own file edits until the 1200s
          # turn watchdog hard-kills it (false ERROR). `C:\cetmp` is ≤8 chars
          # with no spaces, so Windows generates no `~1` alias for it.
          TMP:  C:\cetmp
          TEMP: C:\cetmp
        working-directory: tests
        id: eval
        shell: bash
        run: |
          shopt -s globstar nullglob
          # Create the tilde-free temp root pinned via TMP/TEMP above.
          mkdir -p /c/cetmp
          # Agent selection (mirror of the Linux job): the model always comes from the
          # harness's own variable above, with the agent_model input overriding it for a
          # one-off run. Passed explicitly because the experiment YAML pins no model.
          # Driver is unchanged (tempdir here).
          interop_pid=""
          if [ "$AGENT" = "codex" ]; then
            model="${AGENT_MODEL:-${CODEX_MODEL:?unset — set the CODEX_MODEL repo variable}}"
            agent_flags="--type codex --model $model"
          elif [ "$AGENT" = "antigravity" ]; then
            model="${AGENT_MODEL:-${ANTIGRAVITY_MODEL:?unset — set the ANTIGRAVITY_MODEL repo variable}}"
            agent_flags="--type antigravity --model $model"
          elif [ "$AGENT" = "delegate-sdk" ]; then
            # Same model contract as the Linux job: kimi-k2-7-code default
            # (hyphenated id), DELEGATE_MODEL repo variable / agent_model input override.
            model="${AGENT_MODEL:-${DELEGATE_MODEL:-kimi-k2-7-code}}"
            agent_flags="--type delegate-sdk --model $model"
            export DELEGATE_SDK_ENV="${DELEGATE_SDK_ENV:-alpha}"
            export DELEGATE_STALL_TIMEOUT_S="${DELEGATE_STALL_TIMEOUT_S:-240}"
            # Auth + org/tenant identity from the mint step's file (NOT
            # ~/.uipath/.auth — that is the uip CLI's own browser-OAuth login).
            # The file doubles as the live token channel the host re-reads per
            # turn; minted once here, so runs longer than the ~1h ROPC TTL can
            # still hit token expiry on late tasks.
            # Every value is validated, not just the token (same reason as the
            # Linux job: an empty org/tenant SLUG yields a malformed env=alpha
            # backend URL and a 404 deep inside the first turn).
            for pair in AUTH_TOKEN:UIPATH_ACCESS_TOKEN \
                        TENANT_ID:UIPATH_TENANT_ID \
                        ORG_ID:UIPATH_ORGANIZATION_ID \
                        ORG_LOGICAL_NAME:UIPATH_ORGANIZATION_NAME \
                        TENANT_NAME:UIPATH_TENANT_NAME; do
              out="${pair%%:*}"; key="${pair##*:}"
              val="$(sed -n "s/^$key=//p" "$DELEGATE_AUTH_FILE")"
              if [ -z "$val" ]; then
                echo "::error::no $key in $DELEGATE_AUTH_FILE — the ROPC mint did not complete"
                exit 1
              fi
              export "$out=$val"
            done
            export DELEGATE_AUTH_TOKEN_FILE="$DELEGATE_AUTH_FILE"
            for knob in DELEGATE_STDIO_VERBOSE DELEGATE_STDIO_LOG_MAX_CHARS \
                        USE_LLM_GATEWAY_FOR_FIREWORKS; do
              src="${knob}_VAR"
              if [ -n "${!src:-}" ]; then
                export "$knob=${!src}"
                echo "delegate knob: $knob=${!src}"
              fi
            done
            # ONE shared interop for the whole run, so the SDK runs connect-only
            # instead of auto-spawning/killing a throwaway interop per task
            # (contention on ~/.delegate-sdk/interop.pid). Health-gated; on
            # failure warn and fall back to SDK auto-spawn — safe at the j=1
            # this loop runs. Mirrors daily-windows.ps1's Start-SharedInterop.
            interop_log="$RUNNER_TEMP/delegate-interop.log"
            ( cd "$(dirname "$DELEGATE_INTEROP_EXE")" && ASPNETCORE_ENVIRONMENT=Production \
                exec "$DELEGATE_INTEROP_EXE" --urls="http://localhost:5055" ) >"$interop_log" 2>&1 &
            interop_pid=$!
            deadline=$((SECONDS + 60))
            until curl -fsS -m 3 "http://localhost:5055/health" >/dev/null 2>&1; do
              if [ "$SECONDS" -ge "$deadline" ]; then break; fi
              sleep 1
            done
            if curl -fsS -m 3 "http://localhost:5055/health" >/dev/null 2>&1; then
              export INTEROP_URL="http://localhost:5055"
              echo "shared interop healthy; INTEROP_URL=$INTEROP_URL (log: $interop_log)"
            else
              echo "::warning::shared interop did not pass /health within 60s; tasks fall back to SDK auto-spawn (log: $interop_log)"
              kill "$interop_pid" 2>/dev/null || true
              interop_pid=""
            fi
          else
            model="${AGENT_MODEL:-${CLAUDE_CODE_MODEL:?unset — set the CLAUDE_CODE_MODEL repo variable}}"
            agent_flags="--model $model"
          fi
          overall_exit=0
          for task in $TASK_GLOBS; do
            echo "--- Killing leftover Helm/Studio processes ---"
            taskkill //F //IM UiPath.Studio.Helm.exe 2>/dev/null || true
            echo "--- Running: $task ---"
            for attempt in 1 2 3; do
              echo "--- $task attempt $attempt ---"
              if coder-eval run "$task" \
                  -e experiments/smoke-windows.yaml $agent_flags -j 1 -v; then
                break
              fi
              # Only retry on Bedrock content-filter ERRORs. Real task
              # failures are real signal — don't burn retries on them.
              latest_json="$(ls -t runs/*/default/*/00/task.json 2>/dev/null | head -n 1 || true)"
              if [ -n "$latest_json" ] && LATEST_JSON="$latest_json" python -c "import json,os,sys; d=json.load(open(os.environ['LATEST_JSON'])); det=d.get('error_details') or {}; msg=json.dumps(det)+(d.get('error_message') or ''); sys.exit(0 if d.get('final_status')=='ERROR' and 'content filter' in msg.lower() else 2)"; then
                echo "::warning::$task: content-filter error on attempt $attempt — retrying"
                if [ "$attempt" = "3" ]; then
                  overall_exit=1
                fi
                continue
              fi
              overall_exit=1
              break
            done
          done
          if [ -n "$interop_pid" ]; then
            kill "$interop_pid" 2>/dev/null || true
            taskkill //F //IM UiPath.Aria.ComputerUse.Api.exe 2>/dev/null || true
          fi
          exit $overall_exit

      # Safety net for the shared interop: the run step kills it by PID once the
      # task loop finishes, but a cancelled or timed-out step never reaches that
      # line and would leave the process holding port 5055 on the self-hosted
      # runner for the next job.
      #
      # The interop log is deliberately NOT echoed on success. It is the stdout of
      # a third-party .NET service whose logging we do not control, and the token
      # in play here is minted at runtime (see the mask below) — a build log is
      # the wrong place for either. daily-windows.ps1 dumps it on the health-gate
      # failure path only; this mirrors that, and the run step already prints the
      # path so the file can be inspected on the runner.
      - name: Stop shared delegate interop
        if: always() && inputs.agent == 'delegate-sdk'
        shell: bash
        run: |
          taskkill //F //IM UiPath.Aria.ComputerUse.Api.exe 2>/dev/null || true
          log="$RUNNER_TEMP/delegate-interop.log"
          if [ "${{ steps.eval.outcome }}" != "success" ] && [ -f "$log" ]; then
            echo "--- last 100 lines of $log (run did not succeed) ---"
            tail -n 100 "$log" || true
          fi

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: coder-eval-windows-${{ github.run_id }}
          path: |
            tests/runs/*/experiment.html
            tests/runs/*/experiment.md
            tests/runs/*/experiment.json
            tests/runs/*/experiment.log
            tests/runs/*/*/variant.html
            tests/runs/*/*/variant.md
            tests/runs/*/*/variant.json
            tests/runs/**/task.html
            tests/runs/**/task.json
            tests/runs/**/task.log
            tests/runs/**/artifacts
          if-no-files-found: warn
          retention-days: 14

      - name: Plaintext summary + verdict
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          run_dir=$(ls -td tests/runs/*/ 2>/dev/null | head -n 1 || true)
          if [ -z "$run_dir" ]; then
            echo "FAIL — no run directory produced" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          python - "$run_dir" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, pathlib, sys
          rows = [json.loads(p.read_text(encoding='utf-8')) for p in sorted(pathlib.Path(sys.argv[1]).rglob('task.json'))]
          for r in rows:
              print(f"{r.get('task_id','?')}: {r.get('final_status','?')}")
          ok = sum(1 for r in rows if r.get('final_status') == 'SUCCESS')
          print(f"\n{ok}/{len(rows)} PASS (windows)")
          sys.exit(0 if rows and ok == len(rows) else 1)
          PY
