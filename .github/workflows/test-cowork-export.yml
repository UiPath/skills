name: Test Copilot Cowork Export

on:
  pull_request:
    paths:
      - 'skills/**'
      - 'skill-flavors/**'
      - 'scripts/compose-skill-flavor.mjs'
      - 'scripts/pack-skill-packages.mjs'
      - 'scripts/export-cowork.py'
      - 'tests/scripts/test_export_cowork.py'
      - 'package.json'
      - '.gitignore'
      - '.github/workflows/publish.yml'
      - '.github/workflows/publish-skill-flavor.yml'
      - '.github/workflows/validate-skill-flavors.yml'
      - '.github/workflows/test-cowork-export.yml'
  workflow_dispatch:

jobs:
  pytest-cowork-export:
    runs-on: ubuntu-latest
    name: Copilot Cowork export contract
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22.x'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.13'

      - name: Install pytest
        run: pip install pytest

      - name: Run Cowork export tests
        run: pytest tests/scripts/test_export_cowork.py -v
