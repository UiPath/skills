# Same-ground campaign contract (Tao, 2026-08-10): loop-neutral v1-base
# prompt; v1-weighted intersection criteria plus report-only offline advisories;
# paired limit envelope. Cross-arm parity is enforced by the sync gate.
task_id: skill-flow-paginated-reference-lookup
description: >
  Build a Flow with a Slack `Send Message to Channel` node targeting the
  `simple` channel. The channel lives on a later page of the `is-sandboxes`
  curated_channels list, so resolving the Slack channel id forces the agent
  to paginate `uip is resources run list`. Triggered by the `resources.md`
  read-before-call rule added in #1059 (ENGCE-58198) — old behavior was to
  abandon pagination after page 1 and bail to AskUserQuestion.
tags:
  - uipath-maestro-flow
  - integration
  - e2e
  - mode:build
  - lifecycle:generate
  - shape:multi-node
  - connector
  - uipath-salesforce-slack
  - feature:records

run_limits:
  expected_turns: 30
  task_timeout: 1200
  max_turns: 80
  turn_timeout: 900

initial_prompt: |
  Create a new Flow project called "SlackPaginationTest" with a manual
  trigger. It should send a Slack message saying "hello from coder-eval"
  to the channel named `simple` using Slack's "Send Message to Channel"
  activity.
  For Slack, use the connection name `is-sandboxes`. If more than one
  connection matches that name, use any enabled one.
  Validate the flow when you're done.
  Do NOT ask for approval, confirmation, or feedback. Do NOT pause between
  planning and implementation. Build the complete flow end-to-end in a single pass.

success_criteria:
  - type: command_executed
    description: "Agent invoked `uip is resources run list ... curated_channels` more than once (pagination loop ran)"
    tool_name: "Bash"
    # Commands are recorded as the raw `bash -lc '...'`/`bash -lc "..."` wrapper. When the
    # command carries an --output-filter with an embedded single-quoted JMESPath
    # (items[?name=='simple']), the wrapper switches to double quotes and backslash-escapes the
    # inner quotes (\"uipath-salesforce-slack\"). Allow an optional escaping backslash before each
    # quote so both quoting styles match; otherwise paginated calls are silently uncounted.
    command_pattern: 'uip\s+is\s+resources\s+run\s+list\s+\\?"?uipath-salesforce-slack\\?"?\s+\\?"?curated_channels'
    min_count: 2
    weight: 3.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent used `nextPage=<token>` to advance pagination at least once"
    tool_name: "Bash"
    command_pattern: 'nextPage='
    min_count: 1
    weight: 3.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent ran `uip maestro flow validate` on the generated flow"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+(maestro\s+)?flow\s+validate'
    min_count: 1
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "Flow file exists (path-agnostic discovery)"
    command: "python3 $EXPERIMENT_TASKS_PATH/uipath-maestro-flow/_shared/flow_contains.py --flow-name SlackPaginationTest"
    timeout: 30
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "Flow wires the Slack send-message-to-channel node with the resolved Slack id for channel `simple` (C083AN4E61E)"
    command: "python3 $EXPERIMENT_TASKS_PATH/uipath-maestro-flow/_shared/flow_contains.py --flow-name SlackPaginationTest 'uipath.connector.uipath-salesforce-slack.send-message-to-channel' '\"C083AN4E61E\"'"
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
