<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="628" viewBox="0 0 760 628" font-size="13" role="img" aria-label="You take five turns and answer when asked; the agent does the rest"><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.bg{fill:#ffffff}
.ink{fill:#1f2328}.quiet{fill:#59636e}
.grid{stroke:#e7e5de;stroke-width:1}.axis{stroke:#b3b0a5;stroke-width:1}
.bar{fill:#c9c7bd}.you{fill:#2563eb}
.box-you{fill:rgba(37,99,235,.12);stroke:#2563eb;stroke-width:2}
.box-agent{fill:none;stroke:#b3b0a5;stroke-width:1.25}
.box-ask{fill:none;stroke:#b3b0a5;stroke-width:1.25;stroke-dasharray:4 4}
.connector path{fill:none;stroke:#b3b0a5;stroke-width:1.25}
.arrowhead{fill:#b3b0a5}
@media (prefers-color-scheme:dark){
.bg{fill:#1b1b19}.ink{fill:#ebe9e4}.quiet{fill:#a8a59e}
.grid{stroke:#33322e}.axis{stroke:#6c6a63}.bar{fill:#5e5c56}.you{fill:#6e9dff}
.box-you{fill:rgba(110,157,255,.16);stroke:#6e9dff}
.box-agent,.box-ask,.connector path{stroke:#6c6a63}.arrowhead{fill:#6c6a63}}
</style><rect class="bg" x="0" y="0" width="760" height="628" rx="10"/><defs><marker id="lanes-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker></defs><text x="24.0" y="34.0" class="ink" font-size="15" font-weight="600">You take five turns and answer when asked; the agent does the rest</text><text x="24.0" y="76.0" class="quiet" font-size="11.5">Step</text><text x="290.0" y="76.0" class="ink" text-anchor="middle" font-weight="600">You</text><text x="582.0" y="76.0" class="ink" text-anchor="middle" font-weight="600">The agent, on its own</text><line x1="24" x2="736" y1="92" y2="92" class="grid"/><text x="24.0" y="140.0" class="ink" font-size="11.5" font-weight="600">1 · Get a genome</text><text x="24.0" y="228.0" class="ink" font-size="11.5" font-weight="600">2 · Review it</text><text x="24.0" y="316.0" class="ink" font-size="11.5" font-weight="600">3 · Build</text><text x="24.0" y="404.0" class="ink" font-size="11.5" font-weight="600">4 · Check and run</text><text x="24.0" y="492.0" class="ink" font-size="11.5" font-weight="600">4 · Fix loop</text><text x="24.0" y="580.0" class="ink" font-size="11.5" font-weight="600">5 · Open items</text><g class="connector"><path d="M396.0 136H428.0" marker-end="url(#lanes-arrow)"/><path d="M396.0 224H428.0" marker-end="url(#lanes-arrow)"/><path d="M396.0 312H428.0" marker-end="url(#lanes-arrow)"/><path d="M396.0 400H428.0" marker-end="url(#lanes-arrow)"/><path d="M582 164.0V180H290V196.0" marker-end="url(#lanes-arrow)"/><path d="M582 252.0V268H290V284.0" marker-end="url(#lanes-arrow)"/><path d="M582 340.0V356H290V372.0" marker-end="url(#lanes-arrow)"/><path d="M582 428.0V460.0" marker-end="url(#lanes-arrow)"/><path d="M736.0 488H748V400H736.0" marker-end="url(#lanes-arrow)"/><path d="M582 516.0V548.0" marker-end="url(#lanes-arrow)"/><path d="M428.0 576H396.0" marker-end="url(#lanes-arrow)"/><path d="M428.0 488H396.0" stroke-dasharray="4 4" marker-start="url(#lanes-arrow)" marker-end="url(#lanes-arrow)"/></g><rect x="184.0" y="108.0" width="212" height="56" rx="8" class="box-you"/><text x="290.0" y="132.0" class="ink" text-anchor="middle" font-weight="600">Point at the source</text><text x="290.0" y="148.0" class="ink" text-anchor="middle" font-size="11.5">path, related documents</text><rect x="428.0" y="108.0" width="308" height="56" rx="8" class="box-agent"/><text x="582.0" y="132.0" class="ink" text-anchor="middle" font-weight="600">Reads it and writes the genome</text><text x="582.0" y="148.0" class="quiet" text-anchor="middle" font-size="11.5">every file read, source bugs verified</text><rect x="184.0" y="196.0" width="212" height="56" rx="8" class="box-you"/><text x="290.0" y="220.0" class="ink" text-anchor="middle" font-weight="600">Review and decide</text><text x="290.0" y="236.0" class="ink" text-anchor="middle" font-size="11.5">criteria, guesses, source bugs</text><rect x="428.0" y="196.0" width="308" height="56" rx="8" class="box-agent"/><text x="582.0" y="220.0" class="ink" text-anchor="middle" font-weight="600">Edits the genome</text><text x="582.0" y="236.0" class="quiet" text-anchor="middle" font-size="11.5">checks it again after every edit</text><rect x="184.0" y="284.0" width="212" height="56" rx="8" class="box-you"/><text x="290.0" y="308.0" class="ink" text-anchor="middle" font-weight="600">Answer the questions</text><text x="290.0" y="324.0" class="ink" text-anchor="middle" font-size="11.5">values, project, packages</text><rect x="428.0" y="284.0" width="308" height="56" rx="8" class="box-agent"/><text x="582.0" y="308.0" class="ink" text-anchor="middle" font-weight="600">Builds everything without asking</text><text x="582.0" y="324.0" class="quiet" text-anchor="middle" font-size="11.5">validates, builds, packs, reports</text><rect x="184.0" y="372.0" width="212" height="56" rx="8" class="box-you"/><text x="290.0" y="396.0" class="ink" text-anchor="middle" font-weight="600">Ask to check, then run</text><text x="290.0" y="412.0" class="ink" text-anchor="middle" font-size="11.5">signed in, unlocked, hands off</text><rect x="428.0" y="372.0" width="308" height="56" rx="8" class="box-agent"/><text x="582.0" y="396.0" class="ink" text-anchor="middle" font-weight="600">Drives the target app</text><text x="582.0" y="412.0" class="quiet" text-anchor="middle" font-size="11.5">checks every target, runs in debug mode</text><rect x="184.0" y="460.0" width="212" height="56" rx="8" class="box-ask"/><text x="290.0" y="484.0" class="ink" text-anchor="middle" font-weight="600">Only when asked</text><text x="290.0" y="500.0" class="quiet" text-anchor="middle" font-size="11.5">a decision, a value, an OK</text><rect x="428.0" y="460.0" width="308" height="56" rx="8" class="box-agent"/><text x="582.0" y="484.0" class="ink" text-anchor="middle" font-weight="600">Fixes and re-runs until clean</text><text x="582.0" y="500.0" class="quiet" text-anchor="middle" font-size="11.5">selector or workflow, fixed in place</text><rect x="184.0" y="548.0" width="212" height="56" rx="8" class="box-you"/><text x="290.0" y="572.0" class="ink" text-anchor="middle" font-weight="600">Close out</text><text x="290.0" y="588.0" class="ink" text-anchor="middle" font-size="11.5">decisions, fixes, hand-off</text><rect x="428.0" y="548.0" width="308" height="56" rx="8" class="box-agent"/><text x="582.0" y="572.0" class="ink" text-anchor="middle" font-weight="600">Writes open items and report</text><text x="582.0" y="588.0" class="quiet" text-anchor="middle" font-size="11.5">setup steps, criteria verdicts</text><text x="412.0" y="480.0" class="quiet" text-anchor="middle" font-size="11.5">asks</text></svg>
