<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Example hand-off report</title>
<!--
  HAND-OFF REPORT EXAMPLE: a standalone page with placeholder data, no data of any project.
  Open it in a browser to see it. Light and dark UiPath Apollo themes (System, the default, follows the
  operating system); diagrams use Mermaid from a public CDN, and without a network their text is shown.

  A generator fills in exactly three places and touches nothing else:
    1. the title element of the head (the browser tab title);
    2. h1#page-title (the accent-coloured part in a span) and p#page-subtitle (the header);
    3. the JSON block script#report-data (all report content). Inside the JSON, write < > & as
       \u003c \u003e \u0026, so a value can never close the script tag.

  The data block:
    { "notice": optional text above the tabs, "footer": optional text under the last report,
      "reports": [ { "title": tab name (required), "id": anchor (default: a slug of the title),
                     "intro": optional sentence, ...one of the bodies below } ] }
  Report bodies:
    columns + rows    a table with a filter. A column is a string or {name, wide}. A cell is a string,
                      a number or {text, tone: "warn"} (amber). One cell per column; the first column
                      is shown in the accent colour. "empty": text for a table with no rows.
    columns + groups  [{name, rows, empty}]: each group a sub-tab with its own count and filter.
    diagrams          [{title, mermaid}] side by side, with or without a table or groups after them;
                      "notes": [{title, items}], "legend": [text], "table_title": heading above the table.
    markdown          a page of Markdown: headings, paragraphs, lists, bold, italic, code, links
                      (http, https, mailto, #). Everything else, HTML included, shows as plain text.
                      No filter and no count; the same text is also written to a .md file beside the page.
  All text is escaped, so a cell cannot carry HTML; line breaks in a cell are kept. A tab's badge counts
  its rows (all groups added up), or its diagrams; a Markdown tab has none.

  The reports this example holds, in order (the preferences' Hand-off item says what each contains):
    Overview (Markdown, about 600 to 1000 words, no migration internals); Workflow map;
    Design decisions (Topic, Decision, Why, Applies to; no configuration answers or preferences);
    Defect register; TODO list; Deployment open items (groups Set-up, Packages, Queues, Entities,
    Triggers, Assets, Credential assets, Settings, Deployment notes; an Entities row ends with the
    entity's definition JSON; Used by names each process with at most three workflows, then +N more,
    or "(not used in any workflow)"); Structural deviations (groups Added, Removed (not migrated),
    Changed); Process components (an original and a migrated diagram of processes and queues only,
    then the groups Components and links, and Queues and data stores).
  The Excel file holds the seven data reports, one sheet each; the Overview, and the open items
  (Deployment open items and the TODO list by project), are also written as two .md files.
-->
<script>/* theme before first paint: System (default), Light or Dark, remembered in this browser */
(function(){var k='handoff-theme',t='auto',m=window.matchMedia?matchMedia('(prefers-color-scheme: dark)'):null;try{var v=localStorage.getItem(k);if(v=='light'||v=='dark')t=v}catch(e){}
function apply(){var d=t=='dark'||(t=='auto'&&!!m&&m.matches),r=document.documentElement;r.classList.toggle('dark',d);r.classList.toggle('light',!d)}
apply();window.handoffTheme={get:function(){return t},set:function(v){t=v;try{localStorage.setItem(k,v)}catch(e){}apply();document.dispatchEvent(new Event('themechange'))}};
if(m&&m.addEventListener)m.addEventListener('change',function(){if(t=='auto'){apply();document.dispatchEvent(new Event('themechange'))}})})();</script>
<style>

(function(){

function slug(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')||'report'}
var main=document.getElementById('report-main'),tabList=document.getElementById('tab-list'),data;
try{data=JSON.parse(document.getElementById('report-data').textContent)}catch(e){main.innerHTML='<div class="empty">The report data could not be read ('+esc(e.message)+').</div>';return}
var reports=(data&&data.reports)||[];
if(data.notice){var nt=document.getElementById('page-notice');nt.textContent=data.notice;nt.hidden=false}
/* ---- build the markup from the data ---- */
function colOf(c){return typeof c=='object'&&c?c:{name:c}}
function cellHtml(c,col){
  var t=c,cls=[];
  if(c&&typeof c=='object'){t=c.text;if(c.tone)cls.push(c.tone)}
  if(col&&col.wide)cls.push('wide');
  return '<td'+(cls.length?' class="'+cls.join(' ')+'"':'')+'>'+esc(t).replace(/\.(?=[A-Za-z_])/g,'.<wbr>')+'</td>'}
function panelHtml(cols,rows,emptyMsg){
  cols=cols.map(colOf);
  return '<div class="panel"><div class="wrap"><table><thead><tr>'+cols.map(function(c){return '<th>'+esc(c.name)+'</th>'}).join('')+'</tr></thead><tbody>'
    +rows.map(function(r){return '<tr>'+r.map(function(c,i){return cellHtml(c,cols[i])}).join('')+'</tr>'}).join('')
    +'</tbody></table><div class="empty" data-empty="'+esc(emptyMsg||'')+'" style="display:none"></div></div></div>'}
/* ---- Markdown report: a small renderer; the text is escaped first, so no HTML in it is ever taken as markup ---- */
function mdInline(s){
  var t=esc(String(s==null?'':s).replace(/\u0000/g,'')),codes=[];
  t=t.replace(/`([^`]+)`/g,function(m,c){codes.push(c);return '\u0000'+(codes.length-1)+'\u0000'});
  t=t.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,function(m,txt,url){return /^(https?:\/\/|mailto:|#)/i.test(url)?'<a href="'+url+'" target="_blank" rel="noopener noreferrer">'+txt+'</a>':txt+' ('+url+')'});
  t=t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  t=t.replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?![*\w])/g,'$1<em>$2</em>');
  t=t.replace(/(^|[^\w])_([^_\s][^_]*?)_(?!\w)/g,'$1<em>$2</em>');
  return t.replace(/\u0000(\d+)\u0000/g,function(m,i){return '<code>'+codes[i]+'</code>'})}
function mdHtml(src){
  var out=[],para=[],list=null;
  function endPara(){if(para.length){out.push('<p>'+mdInline(para.join(' '))+'</p>');para=[]}}
  function endList(){if(list){out.push('</'+list+'>');list=null}}
  String(src==null?'':src).replace(/\r\n?/g,'\n').split('\n').forEach(function(raw){
    var l=raw.replace(/\s+$/,''),m;
    if(!l.trim()){endPara();endList();return}
    if(/^\s*(-{3,}|\*{3,})\s*$/.test(l)){endPara();endList();out.push('<hr>');return}
    if((m=/^(#{1,4})\s+(.*)$/.exec(l))){endPara();endList();var n=m[1].length+1;out.push('<h'+n+'>'+mdInline(m[2])+'</h'+n+'>');return}
    if((m=/^\s*[-*+]\s+(.*)$/.exec(l))){endPara();if(list!='ul'){endList();out.push('<ul>');list='ul'}out.push('<li>'+mdInline(m[1])+'</li>');return}
    if((m=/^\s*\d+[.)]\s+(.*)$/.exec(l))){endPara();if(list!='ol'){endList();out.push('<ol>');list='ol'}out.push('<li>'+mdInline(m[1])+'</li>');return}
    if(list&&/^\s+\S/.test(l)){out[out.length-1]=out[out.length-1].replace(/<\/li>$/,' '+mdInline(l.trim())+'</li>');return}
    endList();para.push(l.trim())});
  endPara();endList();return out.join('')}
function diagramsHtml(r){
  var cards=r.diagrams.map(function(d,k){
    return '<div class="mm-col"><div class="mm-card"><div class="mm-head"><h2>'+esc(d.title)+'</h2>'
      +'<button data-z="fit" title="Fit to the column width">Fit</button><button data-z="-">&minus;</button><button data-z="+">+</button><button data-z="100" title="Natural size">100%</button><button data-z="src" title="Show or hide the diagram source">Source</button></div>'
      +'<div class="mm-err"></div><div class="mm-view" style="display:none"></div><pre class="mm-src">'+esc(d.mermaid)+'</pre></div></div>'}).join('');
  var h='<div class="mm-grid">'+cards+'</div>';
  (r.notes||[]).forEach(function(n){h+='<div class="mm-note"><h3>'+esc(n.title)+'</h3><ul>'+(n.items||[]).map(function(i){return '<li>'+esc(i)+'</li>'}).join('')+'</ul></div>'});
  (r.legend||[]).forEach(function(l){h+='<p class="mm-leg">'+esc(l)+'</p>'});
  return h}
var tabsHtml='',secsHtml='';
reports.forEach(function(r,i){
  var id=r.id||slug(r.title),groups=r.groups||null,count,body='';
  var isMd=typeof r.markdown=='string';
  count=isMd?null:groups?groups.reduce(function(n,g){return n+g.rows.length},0):r.rows?r.rows.length:(r.diagrams?r.diagrams.length:0);
  if(r.intro)body+='<p class="intro">'+esc(r.intro)+'</p>';
  if(isMd)body+='<article class="md">'+mdHtml(r.markdown)+'</article>';
  if(r.diagrams&&r.diagrams.length)body+=diagramsHtml(r);
  if(groups||r.columns){
    if(r.table_title)body+='<div class="mm-note"><h3>'+esc(r.table_title)+'</h3></div>';
    if(groups)body+='<div class="subs" role="tablist">'+groups.map(function(g){return '<button class="sub" role="tab" aria-selected="false">'+esc(g.name)+'<span class="badge">'+g.rows.length+'</span></button>'}).join('')+'</div>';
    body+='<div class="bar"><div class="find"><input type="search" placeholder="Filter '+esc(String(r.title).toLowerCase())+' (every word must match)" aria-label="Filter '+esc(String(r.title).toLowerCase())+'"></div><span class="count"></span><button class="clear" style="visibility:hidden">Clear</button></div>';
    if(groups)groups.forEach(function(g){body+=panelHtml(r.columns,g.rows,g.empty||r.empty)});
    else body+=panelHtml(r.columns,r.rows||[],r.empty)}
  tabsHtml+='<button class="tab" role="tab" id="tab'+i+'" aria-controls="'+esc(id)+'" aria-selected="false">'+esc(r.title)+(count==null?'':'<span class="badge">'+count+'</span>')+'</button>';
  secsHtml+='<section id="'+esc(id)+'" role="tabpanel" aria-labelledby="tab'+i+'">'+body+'</section>'});
tabList.innerHTML=tabsHtml;
main.innerHTML=secsHtml+(data.footer?'<p class="foot">'+esc(data.footer)+'</p>':'');
/* ---- behaviour ---- */
var tabs=[].slice.call(document.querySelectorAll('.tab')),secs=[].slice.call(document.querySelectorAll('main section'));
var mmCount=0;
function fitSvg(card,mode){var v=card.querySelector('.mm-view'),svg=v&&v.querySelector('svg');if(!svg)return;var w=card._w||1000;card._fit=(mode=='fit'||mode=='init');
  if(mode=='fit')card._z=Math.max(200,v.clientWidth-24);else if(mode=='init')card._z=Math.min(w,Math.max(200,v.clientWidth-24));else if(mode=='100')card._z=w;else if(mode=='+')card._z=(card._z||w)*1.25;else if(mode=='-')card._z=Math.max(150,(card._z||w)/1.25);
  svg.style.width=card._z+'px';svg.style.maxWidth='none';svg.removeAttribute('height')}
function renderMaps(sec){
  if(sec._mmDone)return;var cards=[].slice.call(sec.querySelectorAll('.mm-card'));
  if(!window.mermaid){cards.forEach(function(c){var e=c.querySelector('.mm-err');if(e)e.textContent='Mermaid could not be loaded (no network?): the diagram source is shown instead.'});return}
  sec._mmDone=true;
  try{var cs=getComputedStyle(document.documentElement),tv=function(n){return cs.getPropertyValue(n).trim()};mermaid.initialize({startOnLoad:false,theme:'base',themeVariables:{darkMode:document.documentElement.classList.contains('dark'),background:tv('--bg'),primaryColor:tv('--panel'),primaryBorderColor:tv('--line2'),primaryTextColor:tv('--fg'),secondaryColor:tv('--sel'),tertiaryColor:tv('--bg'),lineColor:tv('--fg2'),textColor:tv('--fg'),edgeLabelBackground:tv('--bg'),clusterBkg:tv('--panel'),clusterBorder:tv('--line2'),fontFamily:tv('--font')},securityLevel:'strict',flowchart:{htmlLabels:true,useMaxWidth:false,curve:'basis'}})}catch(e){}
  cards.forEach(function(c){
    var src=c.querySelector('.mm-src'),view=c.querySelector('.mm-view'),err=c.querySelector('.mm-err');
    if(!src.textContent.trim())return;
    Promise.resolve(mermaid.render('mmsvg'+(mmCount++),src.textContent)).then(function(r){
      view.innerHTML=r.svg;var svg=view.querySelector('svg'),vb=svg.viewBox&&svg.viewBox.baseVal;c._w=vb&&vb.width?vb.width:svg.getBoundingClientRect().width;
      view.style.display='block';src.style.display='none';err.textContent='';fitSvg(c,'init');
      if(!c._bound)[].forEach.call(c.querySelectorAll('[data-z]'),function(b){c._bound=true;b.addEventListener('click',function(){var z=b.getAttribute('data-z');if(z=='src'){var on=src.style.display=='none';src.style.display=on?'block':'none';view.style.display=on?'none':'block'}else fitSvg(c,z)})});
    }).catch(function(e){err.textContent='The diagram could not be rendered ('+(e&&e.message?e.message:e)+'): the source is shown instead.';src.style.display='block'});
  });
  if(!sec._rs){sec._rs=true;window.addEventListener('resize',function(){cards.forEach(function(c){if(c._z&&c._fit)fitSvg(c,'init')})})}
}
function show(i){tabs.forEach(function(t,k){t.setAttribute('aria-selected',k==i);t.tabIndex=k==i?0:-1});secs.forEach(function(s,k){s.classList.toggle('on',k==i)});try{history.replaceState(null,'','#'+secs[i].id)}catch(e){}if(secs[i].querySelector('.mm-card'))renderMaps(secs[i])}
tabs.forEach(function(t,k){t.addEventListener('click',function(){show(k)});t.addEventListener('keydown',function(e){var n=e.key=='ArrowRight'?k+1:e.key=='ArrowLeft'?k-1:-1;if(n>=0&&n<tabs.length){show(n);tabs[n].focus()}})});
var start=0;if(location.hash){secs.forEach(function(s,k){if('#'+s.id==location.hash)start=k})}
if(secs.length)show(start);
var pick=document.getElementById('theme-pick');if(pick&&window.handoffTheme){pick.value=handoffTheme.get();pick.addEventListener('change',function(){handoffTheme.set(pick.value)})}
document.addEventListener('themechange',function(){secs.forEach(function(s){if(s._mmDone){s._mmDone=false;if(s.classList.contains('on'))renderMaps(s)}})});
secs.forEach(function(sec){
  if(!sec.querySelector('input'))return;
  var inp=sec.querySelector('input'),cnt=sec.querySelector('.count'),clr=sec.querySelector('.clear'),subs=[].slice.call(sec.querySelectorAll('.sub')),panels=[].slice.call(sec.querySelectorAll('.panel'));
  var cache=panels.map(function(p){var rows=[].slice.call(p.querySelectorAll('tbody tr'));return {p:p,rows:rows,txt:rows.map(function(r){return r.textContent.toLowerCase()}),emp:p.querySelector('.empty')}});
  var cur=0,timer;
  function run(){var c=cache[cur],q=inp.value.trim().toLowerCase(),n=0,w=q.split(/\s+/).filter(Boolean);
    c.rows.forEach(function(r,i){var ok=w.every(function(x){return c.txt[i].indexOf(x)>=0});r.style.display=ok?'':'none';if(ok)n++});
    cnt.textContent=n==c.rows.length?c.rows.length+' rows':n+' of '+c.rows.length+' rows';
    c.emp.textContent=c.rows.length?'No row matches the filter.':(c.emp.getAttribute('data-empty')||'Nothing to list here.');
    c.emp.style.display=n?'none':'block';clr.style.visibility=q?'visible':'hidden'}
  function pick(k){cur=k;cache.forEach(function(c,i){c.p.classList.toggle('on',i==k)});subs.forEach(function(s,i){s.setAttribute('aria-selected',i==k)});run()}
  subs.forEach(function(s,k){s.addEventListener('click',function(){pick(k)})});
  inp.addEventListener('input',function(){clearTimeout(timer);timer=setTimeout(run,120)});
  clr.addEventListener('click',function(){inp.value='';run();inp.focus()});pick(0);
});
})();
</script></body></html>
