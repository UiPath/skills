task_id: skill-case-golden-rebuild-contract-execution
description: >
  GOLDEN REBUILD (live tenant), asked the way a Studio Web user would ask it:
  rebuild the ContractExecution contract review-and-execution case from the
  team's design document (fixtures/sdd.md), whose resource references are
  REAL: it pins the deployed solution folders, resource IDs, connection IDs
  and connector activity type IDs on the coder-eval tenant. Complements
  golden_rebuild/cm_golden_expense with a business-shaped lifecycle whose
  weight sits on the SLA and interruption surface: a 10-business-day case SLA,
  seven stage SLAs with at-risk/breach escalations, seven `sla-status-change`
  task triggers, an interrupting `return-to-origin` intervention lane, three
  secondary stages, two terminal non-completing case exits, a corrections loop
  that re-enters Stage 1, and two distinct HTTP Webhook connections.

  It also pins the field-name regression this case surfaced at runtime: the
  connector / api-workflow / agent schema sub-property names the document
  declares are lowerCamel (`request_body`, `unusualClauses`, `authorityLevel`,
  `deviationFlags`, `counterpartyProfile`, `riskFlags`) and every dotted access
  off a task-output object must be null-guarded; outputs the document does not
  declare are allowed.

  One harness-run `uip maestro case debug` must enter the case-entered stage,
  complete its required automated task (the ContractOperationsApi counterparty
  pull), open its required human task (the request check, where the run
  parks) and fail no required element; the grader then cancels the instance,
  and post_run cancels any other debug instance this task started. The
  agent's own test run is advisory.

  TENANT PRECONDITION: ContractOperationsApi, ContractAnalysisAgent,
  ContractObligationTracking, and ContractCaseActionApp must be deployed at
  the folders pinned in fixtures/sdd.md, and both HTTP Webhook connections
  must exist. A reinstall re-mints every ID - re-sweep fixtures/sdd.md (the
  ONE source both the agent and the bindings grader read; the grader parses
  its expectations from that file at grade time).
tags: [uipath-maestro-case, e2e, mode:build, lifecycle:generate, shape:multi-node, connector, resource, feature:approval-gate, feature:escalation, feature:api-workflow, path-to-ga, outcome-graded]

# Sized from the cm_golden_expense measurements: this case is larger (8 stages
# / 30 tasks vs 8 / 15), so a healthy full build runs longer, and a mid-stream
# API-limit death (32k output-token cap, context overflow) makes the harness
# retry with a FRESH session (no resume) - task_timeout must absorb one full
# cold restart. Launch with CLAUDE_CODE_MAX_OUTPUT_TOKENS=64000 so a
# caseplan-sized extended-thinking response is not fatal.
#
# turn_timeout MUST NOT be smaller than task_timeout here: one harness "turn"
# is the ENTIRE agent query stream, so turn_timeout caps the whole session and
# is the binding limit. A smaller value silently makes task_timeout dead config
# and kills a healthy long build with status=ERROR / score 0.0 regardless of
# work completed (observed 2026-08-21: killed at 9000s after 492 turns and 297
# commands, mid-caseplan, nothing graded). Measured healthy builds: 92-150 min.
run_limits:
  task_timeout: 18000
  max_turns: 700
  turn_timeout: 18000

# The case skill delegates heavy legs (reference reading, sibling-resource
# builds) to sub-agents; without Agent the whole build runs inline in one
# context and dies to "Prompt is too long". Extends the experiment's
# allowed_tools - keep the base list in sync with experiments/default.yaml.
agent:
  allowed_tools: ["Skill", "Bash", "Read", "Write", "Edit", "Glob", "Grep", "Agent"]

sandbox:
  template_sources:
    - type: template_dir
      path: ../../_setup
      mount_point: _setup
    - type: template_dir
      path: fixtures

# Rewrites the cloud-tenant IDs the fixtures pin to this tenant's IDs.
pre_run:
  - command: "python3 _setup/localize_tenant_ids.py"
    timeout: 300

# Graders live beside this file and import ../../_shared/case_check.py, so the
# reference root is the skill's task tree (never staged into the agent's sandbox).
reference:
  directory: ../..

initial_prompt: |
  You are a coding agent in an empty Case project. No user is present, and
  nobody will answer a question or grant approval, so do not ask, do not
  pause, and do not wait for input. Do not delete or overwrite anything this
  run did not create, except what the task asks you to change, and do not
  publish to a shared destination unless the task asks for it.

  Build our contract review-and-execution business process called
  "ContractExecution", following our design document `sdd.md` in this folder.
  In short: a business requester submits a contract request; Legal Operations
  checks it while the counterparty's records are pulled and the draft is
  screened for unusual clauses; counsel reviews it and can ask for corrections
  (which sends it back to checking), an outside opinion or a senior counsel
  review; the approved contract then goes out for e-signature and is filed,
  with obligation tracking opened as a child case; a request can also end up
  being rejected or withdrawn. Every stage has its own deadline, with warnings
  and a breach response, and the whole process has a ten-business-day
  deadline. Keep the stages, tasks, rules, deadlines and field names exactly
  as the document gives them.

  Everything the document names (folders, API workflow, agent, action app,
  child case and webhook connections) is already deployed on this tenant:
  connect each step to that real resource, not to a placeholder. Do not
  publish the solution.

  Build and test the automation.

success_criteria:
  - type: run_command
    description: "uip maestro case validate passes on the generated ContractExecution case plan"
    command: "p=$(python3 -c 'import sys; sys.path.insert(0, sys.argv[1]); from _shared.case_check import existing_caseplan, find_caseplan; print(existing_caseplan(sys.argv[2]) or find_caseplan())' \"$REFERENCE_DIR\" ContractExecution/ContractExecution/caseplan.json); uip maestro case validate \"$p\" --output json"
    timeout: 60
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "the case plan is complete against the design document under validate --strict --sdd — a plain-profile Valid does not close the golden"
    command: >-
      p=$(python3 -c 'import sys; sys.path.insert(0, sys.argv[1]); from _shared.case_check import existing_caseplan, find_caseplan; print(existing_caseplan(sys.argv[2]) or find_caseplan())' "$REFERENCE_DIR" ContractExecution/ContractExecution/caseplan.json);
      uip maestro case validate "$p" --strict --sdd ./sdd.md --output json
    timeout: 60
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "caseplan preserves the SDD topology: 8 stages (3 secondary), condition-derived transitions incl. the corrections loop, 3 case exits, 30 tasks across 5 types, run-once set, return-to-origin intervention lane, case + 7 stage SLAs with escalations (intsvcActivityConfig may be absent, as Studio Web leaves it)"
    command: "python3 $REFERENCE_DIR/golden_rebuild/contract_execution/check_contract_exec_case.py"
    timeout: 120
    expected_exit_code: 0
    weight: 4.0
    pass_threshold: 1.0

  - type: run_command
    description: "every resource task is resolved against the live tenant: expected name/folder binding keys in caseplan + bindings_v2, both webhook connection IDs, the activity type ID, connector service types, and the withdrawal stage-entry connector rule; no skeleton tasks"
    command: "python3 $REFERENCE_DIR/golden_rebuild/contract_execution/check_contract_exec_bindings.py"
    timeout: 120
    expected_exit_code: 0
    weight: 4.0
    pass_threshold: 1.0

  - type: run_command
    description: "caseplan semantically implements the SDD dataflow and gate logic (producer ownership, globally unique output IDs, decision/signature gate polarity, sla-status-change wiring, literal fidelity incl. action labels compared as a label list, Scenario E outcome outputs)"
    command: "python3 $REFERENCE_DIR/golden_rebuild/contract_execution/check_contract_exec_semantics.py"
    timeout: 120
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0

  - type: run_command
    description: "task-output sub-property names keep the SDD's exact casing (request_body / unusualClauses / authorityLevel / deviationFlags / counterpartyProfile / riskFlags) and every dotted access off a task-output object is null-guarded; outputs the document does not declare are allowed"
    command: "python3 $REFERENCE_DIR/golden_rebuild/contract_execution/check_contract_exec_fieldnames.py"
    timeout: 120
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent did not use mutating case-authoring CLI commands"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+case\s+(cases|stages|tasks|(?:case|stage|task)-(?:entry|exit)-conditions)\s+(add(?:-connector)?|update|remove)\b(?![^;&|\n]*\s(?:--help|-h)(?![\w-]))'
    weight: 3.0
    pass_threshold: 1.0

  # Advisory: Studio Web agents may test with the RunProject proxy tool instead,
  # which the eval testbench stubs.
  - type: command_executed
    description: "Advisory: the agent ran its own test run (uip maestro case debug), as the request asks"
    tool_name: "Bash"
    command_pattern: '(?:^|[;&|]\s*|\bthen\s+|\bdo\s+)(uip|\$UIP)\s+maestro\s+case\s+debug(?![-\w])(?!\s+--help)'
    min_count: 1
    weight: 1.0
    pass_threshold: 0.0

  # The run parks at the request check (a required human task), so it cannot
  # complete; the grader follows the instance until the opening path is
  # decided, then cancels it. timeout covers refresh (180 s) + 2 debug calls at
  # most (2 x 1500 s, retries share that cap) + retry sleep (15 s) + follow-up
  # (480 s) + cancel (180 s) + margin (445 s).
  - type: run_command
    description: "Effects: one harness-run uip maestro case debug enters the case-entered stage, completes its required ContractOperationsApi counterparty pull, opens its required request-check human task, and fails no required task or stage"
    command: "python3 $REFERENCE_DIR/golden_rebuild/contract_execution/check_contract_exec_run.py"
    timeout: 4300
    expected_exit_code: 0
    weight: 6.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent did not publish the solution, as the request asks"
    tool_name: "Bash"
    command_pattern: '(?:^|[;&|]\s*)(uip|\$UIP)\s+(maestro\s+case|solution)\s+publish\b(?![^;&|\n]*--help)'
    weight: 1.0
    pass_threshold: 1.0

post_run:
  - command: "python3 _setup/case_run.py --cancel-debug-instances"
    timeout: 300
  - command: "python3 _setup/cleanup_solutions.py"
    timeout: 120
