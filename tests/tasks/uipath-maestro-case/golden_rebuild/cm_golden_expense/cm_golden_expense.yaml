task_id: skill-case-golden-rebuild-cm-expense
description: >
  GOLDEN REBUILD (live tenant), asked the way a Studio Web user would ask it:
  rebuild the CM-Golden expense-reporting reference case from the team's design
  document (fixtures/sdd.md), whose resource references are REAL: it pins the
  deployed solution folder, resource IDs, connection IDs and connector activity
  type IDs of the CM-Golden solution on the coder-eval tenant. Graded by
  validate (plain and --strict --sdd against the same document), the golden
  topology (8 stages incl. a secondary rework lane, 15 tasks across all 9 task
  types, run-once timer, SLA escalation), resolved bindings, the dataflow and
  gate semantics, the Task 1.1 seed object, and one harness-run
  `uip maestro case debug`: the case-entered stage is entered, its required
  automated tasks (the agent, process orchestration and RPA job on the deployed
  CM-Golden resources) complete, the case moves on to the stage after it (the
  manager approval), and no required element fails. That run parks at the
  approval, so the grader cancels the instance; post_run cancels any other
  debug instance this task started. The agent's own test run is advisory.

  TENANT PRECONDITION: the CM-Golden golden solution must be deployed on the
  eval tenant at the folder/IDs pinned in fixtures/sdd.md, and its Stage 1
  agent, process and RPA must be runnable there. A golden solution reinstall
  re-mints every ID and renames the folder - re-sweep fixtures/sdd.md (the ONE
  source both the agent and the bindings grader read; the grader parses its
  expectations from that file at grade time).
tags: [uipath-maestro-case, e2e, mode:build, lifecycle:generate, shape:multi-node, connector, resource, feature:approval-gate, feature:escalation, path-to-ga, outcome-graded]

# Sized from measured runs: a healthy full build finishes in ~60 min, but a
# mid-stream API-limit death (32k output-token cap, context overflow) makes
# the harness retry with a FRESH session (no resume) - task_timeout must
# absorb one full cold restart. Launch with CLAUDE_CODE_MAX_OUTPUT_TOKENS=64000
# so a caseplan-sized extended-thinking response is not fatal (both failure
# modes observed 2026-07-10).
run_limits:
  task_timeout: 14400
  max_turns: 600
  turn_timeout: 9000

# The case skill delegates heavy legs (reference reading, sibling-resource
# builds) to sub-agents; without Agent the whole build runs inline in one
# context and dies to "Prompt is too long" (observed 2026-07-10). Extends the
# experiment's allowed_tools - keep the base list in sync with
# experiments/default.yaml.
agent:
  allowed_tools: ["Skill", "Bash", "Read", "Write", "Edit", "Glob", "Grep", "Agent"]

sandbox:
  template_sources:
    - type: template_dir
      path: ../../_setup
      mount_point: _setup
    - type: template_dir
      path: fixtures

# Rewrites the cloud-tenant IDs the fixtures pin to this tenant's IDs.
pre_run:
  - command: "python3 _setup/localize_tenant_ids.py"
    timeout: 300

reference:
  directory: ../..

initial_prompt: |
  You are a coding agent in an empty Case project. No user is present, and
  nobody will answer a question or grant approval, so do not ask, do not
  pause, and do not wait for input. Do not delete or overwrite anything this
  run did not create, except what the task asks you to change, and do not
  publish to a shared destination unless the task asks for it.

  Build our expense reporting case as a solution and case project both called
  "CMGoldenExpense", following our design document `sdd.md` in this folder.
  Keep the stages, tasks, rules, timers, SLA, and sample request exactly as
  the document specifies.

  Everything the document names (the solution folder, agent, process, robot,
  API workflow, child case, connections and connector activities) is already
  deployed on this tenant, so use the existing resource. Do not publish the
  solution yet.

  Build and test the automation.

success_criteria:
  - type: run_command
    description: "uip maestro case validate passes on the generated CMGoldenExpense case plan"
    command: "p=$(python3 -c 'import sys; sys.path.insert(0, sys.argv[1]); from _shared.case_check import existing_caseplan, find_caseplan; print(existing_caseplan(sys.argv[2]) or find_caseplan())' \"$REFERENCE_DIR\" CMGoldenExpense/CMGoldenExpense/caseplan.json); uip maestro case validate \"$p\" --output json"
    timeout: 60
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "the case plan is complete against the design document under validate --strict --sdd — a plain-profile Valid does not close the golden"
    command: >-
      p=$(python3 -c 'import sys; sys.path.insert(0, sys.argv[1]); from _shared.case_check import existing_caseplan, find_caseplan; print(existing_caseplan(sys.argv[2]) or find_caseplan())' "$REFERENCE_DIR" CMGoldenExpense/CMGoldenExpense/caseplan.json);
      uip maestro case validate "$p" --strict --sdd ./sdd.md --output json
    timeout: 60
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "the case plan preserves the golden topology: 8 stages, secondary rework lane, condition-derived transitions, case exits, 15 tasks across all 9 types, run-once timer, SLA escalation (intsvcActivityConfig may be absent, as Studio Web leaves it)"
    command: "python3 $REFERENCE_DIR/golden_rebuild/cm_golden_expense/check_cm_golden_topology.py"
    timeout: 120
    expected_exit_code: 0
    weight: 4.0
    pass_threshold: 1.0

  - type: run_command
    description: "every resource task and the Stage 5 connector entry rule are resolved: expected name/folder binding keys, connection/activity IDs, connector service types, and no skeleton tasks"
    command: "python3 $REFERENCE_DIR/_shared/check_cm_golden_bindings.py"
    timeout: 120
    expected_exit_code: 0
    weight: 4.0
    pass_threshold: 1.0

  - type: run_command
    description: "the case plan semantically implements the document's dataflow and gate logic (producer ownership, globally unique output IDs, gate polarity, condition equivalence)"
    command: "python3 $REFERENCE_DIR/_shared/check_cm_golden_semantics.py"
    timeout: 120
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0

  - type: run_command
    description: "Task 1.1 preserves the document's exact expenseRequest sample object (native object or JSON-encoded object)"
    command: "python3 $REFERENCE_DIR/_shared/check_cm_golden_seed.py"
    timeout: 120
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent did not use mutating case-authoring CLI commands"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+case\s+(cases|stages|tasks|(?:case|stage|task)-(?:entry|exit)-conditions)\s+(add(?:-connector)?|update|remove)\b(?![^;&|\n]*\s(?:--help|-h)(?![\w-]))'
    weight: 3.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent did not edit caseplan.json in place with a script (Rule 14: Write/Edit only; validator findings are repaired by hand, not perl -pi)"
    tool_name: "Bash"
    # Identical to the artifact_safety_guard Rule 14 guard, pinned with fixtures by _shared/test_rule14_guard_patterns.py.
    command_pattern: '((sed|perl|ruby)\s+(?:-\S+\s+(?:(?:''[^'']*''|"[^"]*")\s+)?){0,8}?(?:-(?!-)\S*i\S*|--in-place\S*)\s(?:''[^'']*''|"[^"]*"|[^;&|\n''"]){0,400}?(?:[''"][^''"\n]*?)?(?<![\w.-])(caseplan\.(json|case)|registry-resolved\.json|bindings_v2\.json|entry-points\.json)(?![\w.])|awk\b[^\n]*-i\s*inplace[^\n]*(?<![\w.-])(caseplan\.(json|case)|registry-resolved\.json|bindings_v2\.json|entry-points\.json)(?![\w.])|(open\s*\([^()\n]{0,300}?(?:[\w.]+\((?:[^()\n]|\([^()\n]{0,100}\)){0,200}?)?(?<![\w.-])(caseplan\.(json|case)|registry-resolved\.json|bindings_v2\.json|entry-points\.json)(?![\w.])[^()\n]{0,20}\)?[^()\n]{0,80}?,\s*(?:mode\s*=\s*)?[''"](?=[rwaxbt+]{1,4}[''"])[rbt]*[wax+][rwaxbt+]*[''"]|Path\s*\([^\n]{0,200}?(?<![\w.-])(caseplan\.(json|case)|registry-resolved\.json|bindings_v2\.json|entry-points\.json)(?![\w.])[''"]?\s*\)?\s*\)?\s*\.(?:write_(?:text|bytes)\s*\(|open\s*\(\s*(?:mode\s*=\s*)?[''"](?=[rwaxbt+]{1,4}[''"])[rbt]*[wax+][rwaxbt+]*[''"])|(shutil\.(copy\w*|move)|os\.(replace|rename))\s*\([^,)\n]{0,300},\s*[^)\n]{0,300}?(?<![\w.-])(caseplan\.(json|case)|registry-resolved\.json|bindings_v2\.json|entry-points\.json)(?![\w.]))|(fs\.|require\s*\(\s*[''"](node:)?fs[''"]\s*\)\s*\.)(promises\.)?((write|append|truncate|rm|unlink)\w*\s*\(\s*[''"`][^''"`\n]{0,300}?(?<![\w.-])(caseplan\.(json|case)|registry-resolved\.json|bindings_v2\.json|entry-points\.json)(?![\w.])|(rename|copyFile|cp)\w*\s*\([^,)\n]{0,300},\s*[^)\n]{0,300}?(?<![\w.-])(caseplan\.(json|case)|registry-resolved\.json|bindings_v2\.json|entry-points\.json)(?![\w.]))|File\.(write\s*\([^)\n,]{0,300}(?<![\w.-])(caseplan\.(json|case)|registry-resolved\.json|bindings_v2\.json|entry-points\.json)(?![\w.])|open\s*\([^)\n,]{0,300}(?<![\w.-])(caseplan\.(json|case)|registry-resolved\.json|bindings_v2\.json|entry-points\.json)(?![\w.])[^)\n,]{0,20},\s*[''"][wa])|\b(?P<v>[A-Za-z_]\w*)\s*=\s*[^\n;=]{0,160}?(?<![\w.-])(caseplan\.(json|case)|registry-resolved\.json|bindings_v2\.json|entry-points\.json)(?![\w.])[''"`)](?=[\s\S]{0,2000}?(?:open\s*\(\s*(?:(?<![\w.])(?P=v)|(?:str|os\.fspath|Path)\s*\(\s*(?<![\w.])(?P=v)\s*\))\s*,\s*(?:mode\s*=\s*)?[''"](?=[rwaxbt+]{1,4}[''"])[rbt]*[wax+][rwaxbt+]*[''"]|(?<![\w.])(?P=v)\s*\.\s*(?:write_(?:text|bytes)\s*\(|open\s*\(\s*(?:mode\s*=\s*)?[''"](?=[rwaxbt+]{1,4}[''"])[rbt]*[wax+][rwaxbt+]*[''"])|Path\s*\(\s*(?<![\w.])(?P=v)\s*\)\s*\.\s*(?:write_(?:text|bytes)\s*\(|open\s*\(\s*(?:mode\s*=\s*)?[''"](?=[rwaxbt+]{1,4}[''"])[rbt]*[wax+][rwaxbt+]*[''"])|(?:write|append)File(?:Sync)?\s*\(\s*(?<![\w.])(?P=v)\s*,|(?:shutil\.(?:copy\w*|move)|os\.(?:replace|rename)|(?:rename|copyFile)(?:Sync)?)\s*\([^,)\n]{0,300},\s*(?<![\w.])(?P=v)\s*(?:[,)]|$)))|\b(?P<s>[A-Za-z_]\w*)=[''"]?[^''"\s;&|]*(?<![\w.-])(caseplan\.(json|case)|registry-resolved\.json|bindings_v2\.json|entry-points\.json)(?![\w.])(?=[\s\S]{0,2000}?\b(?:sed|perl|ruby)\s+(?:-\S+\s+)*?-(?!-)\S*i\S*[^;&|\n]*\$\{?(?P=s)\b)|\b(?:mv|cp|install)\b(?![ \t]*=)[^;&|\n]{0,400}?\s[''"]?(?!(?:[^\s''";&|]*/)?(?:\.flow-sdk|backups?|bak|orig|original)/)[^\s''";&|]{0,300}?(?<![\w.-])(caseplan\.(json|case)|registry-resolved\.json|bindings_v2\.json|entry-points\.json)(?![\w.])[''"]?(?:\s+\d*[<>]&?\s*[^\s;&|]*)*\s*(?:$|[;&|\n)])|\b(?P<t>[A-Za-z_]\w*)=[''"]?[^''"\s;&|]*(?<![\w.-])(caseplan\.(json|case)|registry-resolved\.json|bindings_v2\.json|entry-points\.json)(?![\w.])(?=[\s\S]{0,2000}?\b(?:mv|cp|install|truncate)\b(?![ \t]*=)[^;&|\n]*\s[''"]?\$\{?(?P=t)\}?[''"]?(?:\s+\d*[<>]&?\s*[^\s;&|]*)*\s*(?:$|[;&|\n)]))|(sed|perl|ruby)\s+(?:-\S+\s+(?:(?:''[^'']*''|"[^"]*")\s+)?){0,8}?(?:-(?!-)\S*i\S*|--in-place\S*)\s(?:''[^'']*''|"[^"]*"|[^;&|\n''"]){0,400}?(?<![\w.])[''"]?[^\s;&|''"]*\*(?:\.(?:json|case))?[''"]?(?=\s|$|[;&|])|\bfind\b[^;&|\n]{0,300}?-i?name\s+[''"]?(?:(?:caseplan|registry-resolved|bindings_v2|entry-points)[^\s''"]*|\*\.(?:json|case))[''"]?(?=\s)[^;&|\n]{0,300}?-exec\s+(?:sed|perl|ruby)\s+(?:-\S+\s+){0,8}?-(?!-)\S*i)'
    weight: 2.0
    pass_threshold: 1.0

  # Advisory: Studio Web agents may test with the RunProject proxy tool instead,
  # which the eval testbench stubs.
  - type: command_executed
    description: "Advisory: the agent ran its own test run (uip maestro case debug), as the request asks"
    tool_name: "Bash"
    command_pattern: '(?:^|[;&|]\s*|\bthen\s+|\bdo\s+)(uip|\$UIP)\s+maestro\s+case\s+debug(?![-\w])(?!\s+--help)'
    min_count: 1
    weight: 1.0
    pass_threshold: 0.0

  # The run parks at the manager's approval, so it cannot complete; the grader
  # follows the instance until the opening path is decided, then cancels it.
  # timeout covers refresh (180 s) + 2 debug calls at most (2 x 1500 s, retries
  # share that cap) + retry sleep (15 s) + follow-up (480 s) + cancel (180 s) +
  # margin (445 s).
  - type: run_command
    description: "Effects: one harness-run uip maestro case debug enters the case-entered stage, completes its required agent, process and RPA tasks on the deployed CM-Golden resources, moves on to the stage after it (manager approval), and fails no required task or stage"
    command: "python3 $REFERENCE_DIR/golden_rebuild/cm_golden_expense/check_cm_golden_run.py"
    timeout: 4300
    expected_exit_code: 0
    weight: 6.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent did not publish the solution, as the request asks"
    tool_name: "Bash"
    command_pattern: '(?:^|[;&|]\s*)(uip|\$UIP)\s+(maestro\s+case|solution)\s+publish\b(?![^;&|\n]*--help)'
    weight: 1.0
    pass_threshold: 1.0

post_run:
  - command: "python3 _setup/case_run.py --cancel-debug-instances"
    timeout: 300
  - command: "python3 _setup/cleanup_solutions.py"
    timeout: 120
