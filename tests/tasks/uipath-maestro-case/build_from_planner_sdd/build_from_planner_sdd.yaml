task_id: skill-case-build-from-planner-sdd
description: >
  DIRECT SDD PREFLIGHT — a ready Planner-authored Case SDD is staged. The Case
  skill must consume it directly, run the deterministic preflight/inspection
  commands, preserve it byte-for-byte, and stop because this offline request is
  explicitly preflight-only. No intermediate plan or tenant work is allowed.
tags:
  - uipath-maestro-case
  - integration
  - lifecycle:validate
  - mode:build
  - shape:multi-node
  - guardrail

agent:
  type: claude-code
  permission_mode: acceptEdits
  allowed_tools: ["Skill", "Bash", "Read", "Glob", "Grep"]

run_limits:
  task_timeout: 900
  max_turns: 30
  turn_timeout: 600

sandbox:
  template_sources:
    - type: template_dir
      path: fixtures

initial_prompt: |
  The staged `sdd.md` is the approved, ready Planner contract for
  PlannerReturnedInvoiceCase. Run the uipath-maestro-case deterministic SDD
  preflight and inspection only. Report the normalized counts and ordered
  resource names, then stop. This machine is offline: do not query tenant
  resources and do not build a solution.

  Preserve `sdd.md` byte-for-byte. Do not create an implementation-plan file,
  numbered work-item list, caseplan, or solution scaffold.

success_criteria:
  - type: run_command
    description: "The production checker accepts the Planner-authored ready SDD"
    command: "python3 $SKILLS_REPO_PATH/skills/uipath-maestro-case/scripts/check_case_contract.py check-sdd --sdd sdd.md --output json"
    timeout: 30
    expected_exit_code: 0
    weight: 4.0
    pass_threshold: 1.0

  - type: run_command
    description: "Staged SDD remains byte-identical"
    command: "cmp -s sdd.md $TASK_DIR/fixtures/sdd.md"
    timeout: 10
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "No intermediate plan or numbered work-item artifact exists"
    command: "! find . -type f -name '*.md' ! -name 'sdd.md' | grep -q ."
    timeout: 10
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "Preflight-only request created no caseplan or solution scaffold"
    command: >-
      ! find . -type f \( -name caseplan.json -o -name '*.uipx' \) | grep -q .
    timeout: 10
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

simulation:
  enabled: true
  persona: |
    You are the developer verifying a settled Planner SDD on an offline machine.
  goal: |
    Get deterministic preflight evidence without changing or building anything.
  constraints:
    - "Do not change the SDD or propose another design."
    - "Do not allow tenant access or a build."
    - "If asked to create a plan artifact, decline; the SDD is the build contract."
    - "Keep replies short."
  max_turns: 5
