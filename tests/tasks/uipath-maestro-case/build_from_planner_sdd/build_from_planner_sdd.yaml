task_id: skill-case-build-from-planner-sdd
description: >
  RETURNED-SDD BUILD BOUNDARY — a planner-authored sdd.md (Case Definition
  Blueprint shape WITH the `## Planner Handoff` header, Status: ready, resource
  identities deliberately unresolved) is staged into the sandbox, and the run
  is told to stop before tenant work. Two regression targets: the Planner
  Handoff header must NOT re-route the request into planner Lane A (which would
  emit `planner-returned-invoice-case-tasks.md`), and the design-only stop must
  NOT produce a substitute plan file — SKILL.md Rule 1 and the Anti-patterns
  section forbid `tasks/tasks.md` or any other T-numbered restatement of the
  SDD. The staged SDD must never be rewritten, renamed, or regenerated.
  Its legacy `| Tasks file |` handoff row is deliberate bait for the Lane A
  hijack — do not modernize it to the template's `Build handoff` row.
  Offline — no tenant work is permitted or graded.
tags:
  - uipath-maestro-case
  - integration
  - lifecycle:generate
  - mode:build
  - shape:multi-node
  - resource

agent:
  type: claude-code
  permission_mode: acceptEdits
  allowed_tools: ["Skill", "Bash", "Read", "Write", "Edit", "Glob", "Grep", "AskUserQuestion", "TodoWrite"]

run_limits:
  task_timeout: 1800
  max_turns: 60
  turn_timeout: 1500

sandbox:
  template_sources:
    - type: template_dir
      path: fixtures

initial_prompt: |
  The `sdd.md` in this folder is the approved design for our
  PlannerReturnedInvoiceCase Maestro case — it came back from the solution
  designer with its handoff header already marked ready.

  Get the build ready from that SDD, then stop before any tenant work: do not
  query tenant registry, connections, schemas, or users, and do not create
  caseplan.json. Tell me in your reply what stays unresolved until the build
  machine is online.

  Work from the SDD exactly as written — do not redesign it, do not rewrite,
  rename, or regenerate the SDD file, and do not derive a cross-product task
  list from the handoff header.

success_criteria:
  - type: run_command
    description: "Staged sdd.md is byte-identical — never rewritten, regenerated, or normalized"
    command: "cmp -s sdd.md $TASK_DIR/fixtures/sdd.md"
    timeout: 10
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "Planner Handoff header did not hijack the run into Lane A task derivation (no <case>-tasks.md at the root)"
    command: "! ls ./*-tasks.md 2>/dev/null | grep -q ."
    timeout: 10
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "No substitute plan file — SKILL.md Rule 1 forbids tasks/tasks.md or any other T-numbered restatement of the SDD"
    command: "! test -f tasks/tasks.md && ! find . -name '*.md' -not -name sdd.md -not -path '*/.venv/*' -not -path '*/node_modules/*' -exec grep -lE '^## T[0-9]+' {} + 2>/dev/null | grep -q ."
    timeout: 10
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "No registry-derived audit files in the plan-only run (tenant lookup deferred)"
    command: "! test -f tasks/registry-resolved.json"
    timeout: 10
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "Stopped before the build — no solution scaffold, no caseplan.json"
    command: "! find . -name caseplan.json -not -path '*/.venv/*' | grep -q ."
    timeout: 10
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

simulation:
  enabled: true
  persona: |
    You are the automation developer who received the approved
    PlannerReturnedInvoiceCase SDD back from the solution designer. This
    machine is offline, so you only need to know what is left to do.
  goal: |
    Have the agent read the staged sdd.md exactly as written and report what
    remains, then stop before any caseplan or solution build.
  constraints:
    - "Do not change the SDD or provide alternate resource names."
    - "If the agent proposes to re-run the design, rewrite the SDD, or derive a cross-product plan from the handoff header, tell it the design is settled and the SDD is the plan."
    - "If asked about tenant resources, say identities resolve at build — this machine is offline."
    - "When the agent reports what is deferred, say that is sufficient and ask it to stop."
    - "Keep replies short — one sentence or a single option pick."
  max_turns: 10
