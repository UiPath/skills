task_id: skill-case-edit-bound-task-add-remove
description: >
  Edit mode — remove a resource-bound task (an api-workflow task bound to
  NameToAgeFixed) from the Review stage and add a wait-for-timer task to
  Decision. Removing a bound task must cascade the whole way out of the
  solution: caseplan task, its `bindings[]` pair, its `bindings_v2.json`
  resource entry, and the `resources/solution_folder/` declarations it produced.
  `uip solution resources refresh` is additive-only, so the last hop only
  happens if the agent also runs `uip solution resources remove` — everything
  else looks correct while the declarations linger and later break Studio Web
  provisioning. The prompt never mentions the resource inventory: the cleanup
  has to come from the skill. Local-only, no debug.
tags: [uipath-maestro-case, integration, mode:build, lifecycle:edit]
max_iterations: 1

run_limits:
  task_timeout: 1200
  max_turns: 60
  turn_timeout: 1200

sandbox:
  template_sources:
    - type: template_dir
      path: fixtures

initial_prompt: |
  The LinearThreeStages case solution already exists on disk under
  LinearThreeStages/. It chains three stages linearly: Intake → Review →
  Decision. The Review stage runs three tasks: "Hold For 1 Hour",
  "Notify Reviewer", and "Estimate Age".

  Make two edits:
    - Remove the "Estimate Age" task from the Review stage.
    - Add a wait-for-timer task named "Final Hold" to the Decision stage, with a
      10 second duration.

  Leave the solution consistent and ready to publish to Studio Web. Keep the
  three stages and the Intake → Review → Decision chain unchanged, and leave the
  other Review tasks alone.

  Do NOT run `uip maestro case debug`.
  Do NOT ask for approval, confirmation, or feedback. Make the edits end-to-end
  in a single pass and finish with `uip maestro case validate` passing.

  Before starting, load the uipath-maestro-case skill and follow its workflow.

success_criteria:
  - type: skill_triggered
    description: "Advisory: agent invoked the uipath-maestro-case skill"
    skill_name: "uipath-maestro-case"
    expected_skill: "uipath-maestro-case"
    weight: 1.0
    pass_threshold: 0.0

  - type: run_command
    description: "uip maestro case validate passes on the edited caseplan.json"
    command: "uip maestro case validate LinearThreeStages/LinearThreeStages/caseplan.json --output json"
    timeout: 60
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "Bound task removed end-to-end (caseplan + bindings + bindings_v2 + solution declarations), timer task added, case project declarations intact"
    command: "python3 $TASK_DIR/check_bound_task_add_remove.py"
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent pruned the orphaned solution resource with `uip solution resources remove` rather than deleting declaration files by hand"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+solution\s+resources\s+remove'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0
