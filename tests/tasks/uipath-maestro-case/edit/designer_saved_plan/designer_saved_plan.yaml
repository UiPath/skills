task_id: skill-case-edit-designer-saved-plan
description: >
  Brownfield edit of a case exactly as Studio Web's Case Designer saves it: the
  fixture is a real Designer pull (cm_golden_expense, MST-16423 retest, webhook
  path and mailbox ids redacted). Studio Web renamed the plan to caseplan.case
  with a caseplan.case.bpmn sidecar, wrote it compact, bumped the schema to
  32.0.4, added layout and the trigger's entryPointId, and upgraded both
  connector tasks to configuration v2. The agent must find the plan under
  Studio Web's name, make one targeted edit there, and leave everything the
  Designer wrote intact. Never a second plan file beside it (Studio Web reads
  only the newest name, so an edit in a new caseplan.json is silently ignored),
  never a lowered version, never a dropped layout or entryPointId (dropping the
  entryPointId makes the Designer re-mint the entry point, MST-16422). Local
  only; the prompt states the copy is current, so no pull. Asked the way a
  Studio Web user would ask it. Not run under debug: the edited stage is
  entered only by a user's choice after a human approval and a webhook, which
  a debug run never reaches, so the graded outcome is the plan file Studio Web
  will load. Needs a CLI that
  reads 32.0.4 (UiPath/cli#5001, in @dev since 1.205.0-dev.9162). Passes on the
  skill as it stands (2026-10-09, one run each with and without #3817's
  brownfield commit): the guard is against regressions in edits to Designer
  plans, not a test of that commit. The fixture stays in the workspace: the
  Studio Web harness opens its .uipx as the session's solution (projects under
  /solution/, where the in-page SDK compiles) and exports edits back, so the
  graders read the workspace copy. Moving it to /solution/ in pre_run left
  Studio Web on an empty solution (2026-11-18).
tags: [uipath-maestro-case, integration, mode:build, lifecycle:generate, shape:multi-node, path-to-ga]
max_iterations: 1

run_limits:
  task_timeout: 1200
  max_turns: 60
  turn_timeout: 900

sandbox:
  template_sources:
    - type: template_dir
      path: ../../_setup
      mount_point: _setup
    - type: template_dir
      path: fixtures

# Rewrites the cloud-tenant IDs the fixtures pin to this tenant's IDs.
pre_run:
  - command: "python3 _setup/localize_tenant_ids.py"
    timeout: 300

initial_prompt: |
  You are a coding agent in UiPath Studio Web in a Studio Web project that
  already contains the expense-reporting case (solution
  ExpenseDesignerSaved, case project CMGoldenExpense). No user is
  present, and nobody will answer a question or grant approval, so do not ask,
  do not pause, and do not wait for input.

  I just pulled the solution from Studio Web, so the copy here is current;
  don't pull it again.

  In the stage "Stage 7 - user select", add an optional timer task called
  "Final cool-off" that waits 10 minutes. It starts as soon as the stage is
  entered, and the stage doesn't wait for it to finish. Leave everything else
  in the case as it is. Don't run, upload or publish the case: I will test it
  from the Designer.

  Make the change and check that the case is valid.

success_criteria:
  - type: skill_triggered
    description: "Advisory: agent invoked the uipath-maestro-case skill"
    skill_name: "uipath-maestro-case"
    expected_skill: "uipath-maestro-case"
    weight: 1.0
    pass_threshold: 0.0

  - type: run_command
    description: "uip maestro case validate --strict passes on the Designer's plan file"
    command: "uip maestro case validate ExpenseDesignerSaved/CMGoldenExpense/caseplan.case --strict --output json"
    timeout: 90
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "No second plan file was created beside caseplan.case"
    command: "test ! -e ExpenseDesignerSaved/CMGoldenExpense/caseplan.json && test ! -e ExpenseDesignerSaved/CMGoldenExpense/case.stage.json && test ! -e ExpenseDesignerSaved/CMGoldenExpense/default.stage.json"
    timeout: 10
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "The edit landed in caseplan.case: Stage 7 gained exactly the new optional timer task, nothing else was added or removed"
    command: >
      python3 -c "import json,sys; d=json.load(open('ExpenseDesignerSaved/CMGoldenExpense/caseplan.case'));
      s7=[n for n in d['nodes'] if n['data'].get('label')=='Stage 7 - user select'][0];
      tasks=[t for ts in s7['data'].get('tasks',[]) for t in ts];
      cooloff=[t for t in tasks if t['displayName']=='Final cool-off' and t['type']=='wait-for-timer'];
      optional=[t for t in tasks if t['displayName']=='Final cool-off' and t.get('isRequired')==False];
      all_tasks=[t for n in d['nodes'] for ts in n['data'].get('tasks',[]) for t in ts];
      ok=len(cooloff)==1 and len(optional)==1 and len(all_tasks)==16;
      print(f'cooloff={len(cooloff)} optional={len(optional)} total={len(all_tasks)}');
      sys.exit(0 if ok else 1)
      "
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "What the Designer wrote survives: schema 32.0.4, layout, the trigger's entryPointId, both connector tasks at configuration v2"
    command: >
      python3 -c "import json,sys; d=json.load(open('ExpenseDesignerSaved/CMGoldenExpense/caseplan.case'));
      trigger=[n for n in d['nodes'] if n['id']=='trigger_1'][0];
      epid=trigger['data']['inputs'].get('entryPointId','');
      v2ctx=[c for n in d['nodes'] for ts in n['data'].get('tasks',[]) for t in ts for c in t.get('data',{}).get('context',[]) if c.get('name')=='activityConfigurationVersion' and c.get('value')=='v2'];
      ok=(d.get('version')=='32.0.4' and d.get('layout') is not None and epid=='aef0905a-379f-4881-bd5e-d78e4b816346' and len(v2ctx)==2);
      print(f'version={d.get(\"version\")} layout={d.get(\"layout\") is not None} epid={epid} v2count={len(v2ctx)}');
      sys.exit(0 if ok else 1)
      "
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Nothing uploaded, published, or debugged"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+(solution\s+(publish|upload|deploy)|maestro\s+case\s+debug)\b(?!\s+--help)'
    weight: 2.0
    pass_threshold: 1.0
