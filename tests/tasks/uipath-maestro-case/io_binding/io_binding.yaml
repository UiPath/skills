task_id: skill-case-io-binding-matrix
description: >
  Build a Case from an approved sdd.md whose eight sequential tasks call two
  existing tenant API workflows and pass values between them in the common
  task-level I/O binding forms (literal, case-variable, cross-task, expression,
  bare, renamed, nested, literal-assignment, variable-copy, computed, metadata,
  and two equal-name outputs that need collision-safe ids), asked the way a
  Studio Web user would ask it. The Golden Expense API workflow echoes its
  input, so every value is known in advance. The grader runs the case once
  under `uip maestro case debug` and reads the debug instance back
  (`uip maestro case instance variables-all`): the eight tasks completed in the
  SDD's order, each received the value its binding names (not the text of an
  unresolved reference), and the case variables the SDD names hold the
  expected values. Static checks keep what the SDD states (task names,
  resources, folders, run once, no inline API project) and accept any binding,
  id or output-row layout. That the agent ran its own test run is advisory.
tags: [uipath-maestro-case, e2e, mode:build, lifecycle:generate, shape:multi-node, resource, feature:registry, path-to-ga, outcome-graded]
run_limits:
  expected_turns: 220
  task_timeout: 4800
  max_turns: 280
  turn_timeout: 3600

sandbox:
  template_sources:
    - type: template_dir
      path: fixtures

    - type: template_dir
      path: ../_setup
      mount_point: _setup

# Rewrites the cloud-tenant IDs the fixtures pin to this tenant's IDs.
pre_run:
  - command: "python3 _setup/localize_tenant_ids.py"
    timeout: 300

reference:
  directory: ..

initial_prompt: |
  You are a coding agent in UiPath Studio Web in an empty Case project. No
  user is present, and nobody will answer a question or grant approval, so do
  not ask, do not pause, and do not wait for input.

  Build my business process "IoBindingCase" as defined and approved in the
  sdd.md in this folder. Follow it as written: don't rewrite, shorten or
  redesign it.

  <!-- helper:start -->
  Echo literal's APIOutput1 has no Outputs row in the design because it is the
  workflow's own result, which Echo prior output reads; don't add a row for it.
  <!-- helper:end -->

  Build and do a test run of the automation.

success_criteria:
  # The plan is found wherever the agent put it (any solution or project name).
  - type: run_command
    description: "uip maestro case validate passes on the case plan the agent built"
    command: "p=$(python3 -c 'import sys; sys.path.insert(0, sys.argv[1]); from _shared.case_check import find_caseplan; print(find_caseplan())' \"$REFERENCE_DIR\") && uip maestro case validate \"$p\" --output json"
    timeout: 90
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  # Advisory: Studio Web agents may test with the RunProject proxy tool instead,
  # which the eval testbench stubs.
  - type: command_executed
    description: "Advisory: the agent ran its own test run (uip maestro case debug), as the request asks"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+case\s+debug(?![-\w])(?!\s+--help)'
    min_count: 1
    weight: 1.0
    pass_threshold: 0.0

  - type: run_command
    description: "Effects: one debug run in which the eight SDD tasks completed in order, each received the value its binding names, and renamedResult, literalResult, copiedResult, computedResult, metadataResult and customReferenceCopy hold the expected values"
    command: "python3 $REFERENCE_DIR/io_binding/check_io_binding_run.py"
    timeout: 1200
    expected_exit_code: 0
    weight: 6.0
    pass_threshold: 1.0

post_run:
  - command: "python3 _setup/cleanup_solutions.py"
    timeout: 120
