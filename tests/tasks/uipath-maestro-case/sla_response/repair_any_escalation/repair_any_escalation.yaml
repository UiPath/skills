task_id: skill-case-sla-repair-any-escalation
description: >
  T4 of the SLA-response battery — diagnose mode. The Escalation Review lane must be
  entered when the case SLA breaches, but its staged entry rule carries the Case Designer's
  `escalationId: "any"`: the at-risk wildcard, which fires on every at-risk escalation of the
  SLA (here at 80%), not on the breach. `validate` accepts that rule, so a green validate
  proves nothing. The correct repair is to drop the key, because a breach rule references the
  SLA alone. Repointing the rule at a concrete escalation, or inventing one, also keeps
  validate green but leaves the lane at-risk, so the checker fails it explicitly.
tags: [uipath-maestro-case, smoke, mode:diagnose, lifecycle:generate, shape:multi-node, feature:sla, feature:escalation]
max_iterations: 1

run_limits:
  task_timeout: 1200
  max_turns: 60
  turn_timeout: 1200

sandbox:
  template_sources:
    - type: template_dir
      path: ./templates

reference:
  directory: ../..

initial_prompt: |
  Requirement: enter the Escalation Review lane when the case SLA breaches.

  In `SlaResponse/SlaResponse/caseplan.json`, that lane's `sla-status-change` entry rule was
  left over from the Case Designer with `escalationId: "any"`. Diagnose whether the rule meets
  the requirement and fix it. `uip maestro case validate` may already report the file Valid —
  that alone does not mean there is nothing to fix.

  The Escalation Review lane, its entry rule, and the case SLA it reacts to are all
  intentional — do not restructure the case, and do not delete the lane or its entry rule.

  Do NOT run `uip maestro case debug`, publish, or upload anything. Do NOT ask for
  approval, confirmation, or feedback — fix it end-to-end in a single pass and finish with
  `uip maestro case validate` passing.
  Before starting, load the uipath-maestro-case skill and follow its workflow.

success_criteria:
  - type: run_command
    description: "uip maestro case validate passes on the repaired caseplan.json"
    command: "p=$(ls SlaResponse/SlaResponse/caseplan.case SlaResponse/SlaResponse/caseplan.json 2>/dev/null | head -1); uip maestro case validate \"$p\" --output json"
    timeout: 120
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "The lane's entry is a plain breach rule (slaId, no escalationId, so no \"any\" wildcard); the lane and its single sla-status-change entry survive, and no escalation was added for the rule to point at"
    command: "python3 $REFERENCE_DIR/_shared/check_repair_any_escalation.py"
    timeout: 60
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
