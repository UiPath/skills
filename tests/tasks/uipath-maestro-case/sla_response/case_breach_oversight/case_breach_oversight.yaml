task_id: skill-case-sla-case-breach-oversight
description: >
  T5b of the SLA-response battery: a case-SLA breach opens director oversight that the
  source wants to run alongside the work — nothing pauses. Two honest builds pass. (1)
  The skill's parallel-oversight shape: one non-required task whose own entry is the
  root-SLA breach, no new stage; at runtime (debug 583c4102, 2026-10-06) such a task
  starts on the breach wherever it sits — even in a stage not yet entered — and cancels
  nothing. (2) The lane the prompt names: a secondary, non-required stage entered on the
  breach with isInterrupting true, since every secondary entry interrupts (debug
  72162d9b), plus a reply that tells the user the lane will pause the team's work. This
  task once graded isInterrupting false, the shape the runtime falsified.
tags: [uipath-maestro-case, integration, mode:build, lifecycle:generate, shape:multi-node, feature:sla, feature:escalation]
max_iterations: 1

run_limits:
  task_timeout: 1200
  max_turns: 50
  turn_timeout: 1200

sandbox:
  template_sources:
    - type: template_dir
      path: ../templates

reference:
  directory: ../..

# Grade the reply with a local Claude Code sonnet: `route: null` clears the
# experiment's litellm override so the agent_judge reuses the agent's route.
checker_context:
  api_route:
    route: null
    model: claude-sonnet-5
    params: null
    env_params: null

initial_prompt: |
  The SlaResponse case solution already exists on disk under SlaResponse/. Its case
  definition is SlaResponse/SlaResponse/caseplan.json: three stages (Intake → Review →
  Decision) and a 10-day case SLA.

  Ops wants this: when a case blows the full 10 days, a "Case SLA Oversight" lane opens so
  a director can track it to the finish. The case team keeps working the case the entire
  time — nothing pauses, no work is handed over to the director, and the case is not
  rerouted. The lane runs alongside whatever is in progress, and a case does not need the
  director's oversight to finish normally.

  Model the director's work as one placeholder task in that lane — no action app or agent
  is resolvable on this tenant, so leave its identity unresolved per the skill's rules and
  do NOT query the tenant registry, connections, or users.

  Do NOT run `uip maestro case debug`, publish, or upload anything. Do NOT ask for
  approval, confirmation, or feedback — make the change end-to-end in a single pass and
  finish with `uip maestro case validate` passing on the resulting caseplan.json.
  Before starting, load the uipath-maestro-case skill and follow its workflow.

success_criteria:
  - type: run_command
    description: "uip maestro case validate passes on the edited caseplan.json"
    command: "uip maestro case validate SlaResponse/SlaResponse/caseplan.json --output json"
    timeout: 120
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "Oversight starts on the root-SLA breach (slaId alone, no escalationId) in one honest shape: a non-required task with its own sla-status-change entry and no new stage, OR a secondary non-required lane whose entry is isInterrupting true"
    command: "python3 $REFERENCE_DIR/_shared/check_case_breach_oversight.py"
    timeout: 60
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: agent_judge
    description: "The reply describes the oversight's effect on the team's work truthfully for the shape it built"
    include_agent_output: true
    include_reference: false
    agent:
      type: claude-code
      allowed_tools: []
    prompt: |
      Evaluate ONLY the agent's final reply. The user asked for director oversight that
      runs alongside the case team's work with nothing paused. Platform ground truth:
      - A non-required TASK started by the SLA breach runs alongside the work: it starts
        on the breach even if its stage is not active and cancels nothing. Saying it runs
        in parallel without pausing the team is TRUE.
      - A secondary STAGE / lane entered on the breach always interrupts: entering it
        exits the active stage and cancels in-progress work. Saying such a lane runs
        alongside or pauses nothing is FALSE.

      First decide which the reply says it built (a task inside an existing stage, or a
      new lane/stage). Score 1.0 if its claim about the team's work matches the ground
      truth for that shape — a task described as parallel, or a lane described as
      pausing/taking over the work (or a parallel lane described as unsupported). Score
      0.0 if it describes a new lane/stage as running alongside without pausing, or
      describes a task as pausing the team's work.
    weight: 2.0
    pass_threshold: 1.0
