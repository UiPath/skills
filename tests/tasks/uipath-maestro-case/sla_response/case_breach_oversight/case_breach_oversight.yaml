task_id: skill-case-sla-case-breach-oversight
description: >
  T5b of the SLA-response battery: a case-SLA breach opens a "Case SLA Oversight" lane
  that the source wants to run alongside the work — nothing pauses. The product cannot
  run a secondary lane alongside: every secondary-stage entry interrupts, including an
  sla-status-change entry written isInterrupting false (compiled to cancelStagesAndTasks,
  and observed at runtime 2026-10-06, debug instance 72162d9b: the breach exited the
  active stage and cancelled its in-flight task). So the correct build is the lane with
  isInterrupting true, kept secondary and isRequired false, AND a reply that tells the
  user the lane will pause the team's work, which their requirement did not want. This
  task previously graded isInterrupting false, the shape the runtime falsified.
tags: [uipath-maestro-case, integration, mode:build, lifecycle:generate, shape:multi-node, feature:sla, feature:escalation]
max_iterations: 1

run_limits:
  task_timeout: 1200
  max_turns: 50
  turn_timeout: 1200

sandbox:
  template_sources:
    - type: template_dir
      path: ../templates

reference:
  directory: ../..

# Grade the reply with a local Claude Code sonnet: `route: null` clears the
# experiment's litellm override so the agent_judge reuses the agent's route.
checker_context:
  api_route:
    route: null
    model: claude-sonnet-5
    params: null
    env_params: null

initial_prompt: |
  The SlaResponse case solution already exists on disk under SlaResponse/. Its case
  definition is SlaResponse/SlaResponse/caseplan.json: three stages (Intake → Review →
  Decision) and a 10-day case SLA.

  Ops wants this: when a case blows the full 10 days, a "Case SLA Oversight" lane opens so
  a director can track it to the finish. The case team keeps working the case the entire
  time — nothing pauses, no work is handed over to the director, and the case is not
  rerouted. The lane runs alongside whatever is in progress, and a case does not need the
  director's oversight to finish normally.

  Model the director's work as one placeholder task in that lane — no action app or agent
  is resolvable on this tenant, so leave its identity unresolved per the skill's rules and
  do NOT query the tenant registry, connections, or users.

  Do NOT run `uip maestro case debug`, publish, or upload anything. Do NOT ask for
  approval, confirmation, or feedback — make the change end-to-end in a single pass and
  finish with `uip maestro case validate` passing on the resulting caseplan.json.
  Before starting, load the uipath-maestro-case skill and follow its workflow.

success_criteria:
  - type: run_command
    description: "uip maestro case validate passes on the edited caseplan.json"
    command: "uip maestro case validate SlaResponse/SlaResponse/caseplan.json --output json"
    timeout: 120
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "One sla-status-change entry on the oversight lane: slaId alone (no escalationId) on the root SLA, isInterrupting true (a secondary entry always interrupts), and the lane stays stageType secondary with isRequired false rather than being promoted to a regular stage; 4 stages total"
    command: "python3 $REFERENCE_DIR/_shared/check_case_breach_oversight.py"
    timeout: 60
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: agent_judge
    description: "The reply tells the user the oversight lane will pause the team's work, which they asked to avoid"
    include_agent_output: true
    include_reference: false
    agent:
      type: claude-code
      allowed_tools: []
    prompt: |
      Evaluate ONLY the agent's final reply. Ground truth: the user asked for an oversight
      lane that runs alongside the case team's work with nothing paused. On this platform a
      secondary lane cannot do that — entering it interrupts the active work — so a correct
      reply builds the lane and tells the user it will pause or take over the in-progress
      work when it opens (or that a parallel, non-interrupting lane is not possible).

      Score 1.0 if the reply says the lane will interrupt, pause, or take over the active
      work, or that a non-interrupting / parallel lane is not supported. Score 0.0 if it
      says or implies the lane runs alongside the work without pausing it.
    weight: 2.0
    pass_threshold: 1.0
