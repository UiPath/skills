task_id: skill-case-supplier-onboarding-build-only
description: >
  GREENFIELD BUILD FROM AN SDD, LIVE TENANT, BUILD-ONLY — build the SupplierOnboarding
  case from a 2083-line approved SDD whose twenty resource identities and Outlook
  connection are real, then assert five things the build can get wrong while
  `uip maestro case validate` still reports Valid. The withdrawal scope is the
  centrepiece: the source allows a supplier to withdraw during the three review phases
  and not once setup begins, and the ONLY thing encoding that is which stages carry a
  `wait-for-user` exit. Also covers guard literals taken from the deployed forms' own
  enums rather than invented business labels, four phase breaches that each start a
  task inside the breached stage, per-phase revised-date slots that must not cross, and
  connector wire paths whose casing is load-bearing at runtime. Stops at validate; no
  debug, no publish. This is the build-only variant of skill-case-supplier-onboarding:
  the seven EXECUTION criteria that drive the case through a live debug session are
  removed, so this task grades only what `sdd convert` + hand-authoring produce, in
  about a third of the wall time.
tags:
  - uipath-maestro-case
  - e2e
  - mode:build
  - lifecycle:generate
  - shape:multi-node
  - connector
  - resource
  - feature:escalation
  - feature:approval-gate
  - feature:registry
  - feature:connections
  - feature:api-workflow

# Sized from the two existing golden-rebuild tasks: cm_golden_expense (8 stages / 15
# tasks) measures ~60 min healthy, contract_execution (8 / 30) measures 92-150 min.
# This case is 8 / 32 with twenty resources to describe, so it sits at the upper end —
# confirmed directly: a hand-authored build with no sdd convert path available (run
# 35542776064, published CLI, no PR overlay) hit 5400s mid-build at 501 commands with
# no crash and no auth failure, the same "healthy long build killed" failure mode this
# comment already warned about. 9000s covers contract_execution's own measured upper
# bound with headroom.
#
# turn_timeout MUST NOT be smaller than task_timeout. One harness "turn" is the ENTIRE
# agent query stream, so turn_timeout caps the whole session and is the binding limit.
# A smaller value silently makes task_timeout dead config and kills a healthy long
# build with status=ERROR / score 0.0 regardless of work completed (observed by the
# contract_execution author 2026-08-21: killed at 9000s after 492 turns and 297
# commands, mid-caseplan, nothing graded). cm_golden_expense on main still carries
# that mismatch — do not copy its numbers.
#
# Launch with CLAUDE_CODE_MAX_OUTPUT_TOKENS=64000 so a caseplan-sized
# extended-thinking response is not fatal.
run_limits:
  task_timeout: 9000
  max_turns: 700
  turn_timeout: 9000

# The case skill delegates heavy legs (reference reading, per-resource schema pulls)
# to sub-agents; without Agent the whole build runs inline in one context and dies to
# "Prompt is too long". Extends the experiment's allowed_tools — keep the base list in
# sync with experiments/default.yaml.
agent:
  allowed_tools: ["Skill", "Bash", "Read", "Write", "Edit", "Glob", "Grep", "Agent"]

sandbox:
  template_sources:
    - type: template_dir
      path: fixtures

initial_prompt: |
  I have an approved SDD for our supplier-onboarding case-management solution — it is
  staged as `sdd.md` in this folder. Build a UiPath Case Management solution named
  "SupplierOnboarding" containing a project also named "SupplierOnboarding" from it.

  Use the staged `sdd.md` as the sole source of truth. Do not redo Phase 0, do not
  re-interview me, and do not redesign the process.

  The tenant is LIVE and already hosts every referenced resource: the folder paths,
  resource identities, connection ID, and connector activity type ID in the SDD are
  real. Resolve every task and connector rule against them — skeleton or placeholder
  bindings are NOT acceptable.

  Important:
  - The `uip` CLI is available and already authenticated against the target tenant.
    Resolve against a FRESH registry cache; a stale local cache is not acceptable.
  - Treat all hard stops after the SDD as pre-approved, including Phase 1 planning
    approval, Phase 2 publish-for-review, and Phase 5 publish. Choose the continue /
    skip-publish path and keep going.
  - Do NOT call AskUserQuestion — it is not available in this harness.
  - Do NOT edit `sdd.md`. It is the input, not a working file.
  - Do NOT publish the solution and do NOT run `uip maestro case debug` (this case
    suspends on fourteen human tasks and seven SLA clocks).
  - Persist each connector's `case spec` response before writing it into
    `caseplan.json` — never reconstruct it from memory.
  - Finish with
    `uip maestro case validate SupplierOnboarding/SupplierOnboarding/caseplan.json --output json`
    passing on the resulting caseplan.json.

success_criteria:
  - type: run_command
    description: "uip maestro case validate passes on the generated SupplierOnboarding caseplan.json"
    command: "uip maestro case validate SupplierOnboarding/SupplierOnboarding/caseplan.json --output json"
    timeout: 60
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: >
      sdd.md is byte-identical to the staged fixture — the SDD is the input, and a build
      that edits its own input has moved the goalposts rather than met them
    command: "test \"$(shasum -a 256 sdd.md | cut -d' ' -f1)\" = 9c1939b9d44dd3dd3a5f421cddbbbc37defbe8166dc8a658323cd9e89dc44fde"
    timeout: 15
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: >
      caseplan preserves the SDD lifecycle: 8 stages (5 primary / 3 secondary), a
      non-interrupting oversight lane, rejection guarded from three origins, the
      corrections loop back into the checks, the withdrawal picker in exactly the three
      review phases and not in setup, 3 case exits with one completion, and three
      terminal stages nothing re-enters
    command: "python3 $TASK_DIR/check_topology.py"
    timeout: 120
    expected_exit_code: 0
    weight: 4.0
    pass_threshold: 1.0

  - type: run_command
    description: >
      every routing guard compares against a value its deployed form can actually emit
      (approve / reject / sendback / verified, not an invented business label), the
      buyer's approving and diverting exits carry complementary literals, the 500000
      sign-off threshold is enforced case-side, every guard subject resolves, and every
      `=js:` expression in the plan parses as JavaScript (validate checks the variable
      names and stops there, so an unbalanced paren is reported Valid and throws on its
      first evaluation)
    command: "python3 $TASK_DIR/check_guards.py"
    timeout: 120
    expected_exit_code: 0
    weight: 4.0
    pass_threshold: 1.0

  - type: run_command
    description: >
      SLA responses survived: 120min case target at 75%, seven stage SLAs at 70%, four
      phase breaches each starting a task INSIDE the breached stage (a stage-entry rule
      instead re-runs the stage : validate accepts both), one non-interrupting oversight
      lane, three notify-only wrap-ups, and each phase's revised date confined to its
      own slot
    command: "python3 $TASK_DIR/check_sla.py"
    timeout: 120
    expected_exit_code: 0
    weight: 4.0
    pass_threshold: 1.0

  - type: run_command
    description: >
      32 tasks in their declared stages and classes, all 21 resource keys bound with no
      skeletons, every declared output written by the task the SDD assigns it to, the
      three expression recipients carrying the {Type,Value} object (validate does NOT
      check data.recipient), ten run-once tasks, a non-blocking child case, and four
      on-demand tasks each locked to its own stage
    command: "python3 $TASK_DIR/check_tasks_io.py"
    timeout: 120
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: >
      wire-level field names keep the casing runtime needs: all eight connector tasks
      read the lowercase `response.status` into lastEmailStatus, and every dotted
      dereference resolves to a variable the plan holds. Output display labels are
      deliberately NOT part of this contract
    command: "python3 $TASK_DIR/check_fieldnames.py"
    timeout: 120
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: >
      every case variable reaches the plan in the group its Category selects, keeps the
      SDD's declared type and Default, carries a string `default` where its category
      puts one, and every file slot defaults empty. A non-string default is dropped
      silently on the way to BPMN, so the slot starts undefined and the first route to
      read it faults
    command: "python3 $TASK_DIR/check_variables.py"
    timeout: 120
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: >
      the case shell carries the settings the SDD asks for: the case name, the constant
      `SUP` identifier prefix, the case app enabled, task outputs passed directly, and
      three exit conditions on the stages the SDD names of which only the onboarded one
      marks the case complete. A rejection that marks the case complete reports an
      onboarding that never happened
    command: "python3 $TASK_DIR/check_metadata.py"
    timeout: 120
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent did not use mutating case-authoring CLI commands : caseplan.json is authored directly per the skill's invariant"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+case\s+(cases|stages|tasks|(?:case|stage|task)-(?:entry|exit)-conditions)\s+(add(?:-connector)?|update|remove)\b'
    weight: 3.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: >
      Agent did not run the case itself. The harness starts every debug run and drives every
      gate; a case the agent ran leaves effects nothing can attribute, and an agent that drives
      its own gates can walk a build past a route its caseplan never wired.
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+case\s+debug\b'
    weight: 2.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent did not publish : the task stops at validate"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+solution\s+(publish|upload)\b'
    weight: 1.0
    pass_threshold: 1.0

  # ---- Anti-gaming ----

  - type: command_not_executed
    description: >
      Agent did not produce the case's effects by hand. No direct mutating connector calls:
      Read-only `is resources run list` stays allowed; the skill uses it to resolve reference
      fields such as mail folders.
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+is\s+resources\s+run\s+(create|update|replace|delete)\b'
    weight: 2.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: >
      Agent did not complete or assign the case's action tasks. Completing a task from the shell
      advances the case from outside the caseplan, which would carry an unwired build through
      gates it never encodes.
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+tasks\s+(complete|assign|reassign)\b'
    weight: 2.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: >
      Agent did not read this task's own directory. The whole repository is mounted read-only in
      the sandbox and that directory holds the expectations and the graders; reading it is not a
      build step.
    tool_name: "Bash"
    command_pattern: 'tests/tasks/uipath-maestro-case/supplier_onboarding'
    weight: 3.0
    pass_threshold: 1.0

post_run:
  # No debug run in this task, so no case instance and no child case ever exist. The
  # solution itself is never imported to the tenant either (the prompt stops at
  # `validate`, never `case debug`), so there is nothing on the tenant to clean up.
  - command: "true"
    timeout: 5
