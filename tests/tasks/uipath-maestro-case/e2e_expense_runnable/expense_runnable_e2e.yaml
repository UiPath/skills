task_id: skill-case-e2e-expense-runnable
description: >
  END-TO-END EXECUTION, asked the way a Studio Web user would ask it: build the
  "Employee Expense Reimbursement" case from the team's design document
  (fixtures/sdd.md, a fully automated 7-stage variant bound to generic deployed
  resources: WeatherAPI, CountLetters, ProcurementProcess, HelpDeskLookup and
  the Maestro Case child case). Graded by validate (plain and --strict --sdd
  against the same document), the structural expense topology, and one
  harness-run `uip maestro case debug` that must run until the Approved stage completes,
  having run Submission -> Manager Approval -> Finance Approval -> Payment ->
  Approved to Completed, with the Rejected and Withdrawn lanes not run and no
  element failed. The agent's own test run is advisory. Text between the
  helper markers is lower-tier guidance (experiments/use-case-tiers.yaml).
tags:
  - uipath-maestro-case
  - e2e
  - lifecycle:generate
  - mode:build
  - shape:multi-node
  - feature:stages
  - feature:conditions
  - feature:case-exit
  - feature:trigger
  - feature:registry
  - path-to-ga
  - outcome-graded

agent:
  type: claude-code
  permission_mode: acceptEdits
  allowed_tools: ["Skill", "Bash", "Read", "Write", "Edit", "Glob", "Grep", "TodoWrite"]

run_limits:
  task_timeout: 9240  # turn 4800 + criteria 4260 + margin 180
  max_turns: 500
  turn_timeout: 4800

sandbox:
  template_sources:
    - type: template_dir
      path: fixtures

    - type: template_dir
      path: ../_setup
      mount_point: _setup

# Rewrites the cloud-tenant IDs the fixtures pin to this tenant's IDs.
pre_run:
  - command: "python3 _setup/localize_tenant_ids.py"
    timeout: 300
  # Marks the task start for the post_run debug-instance cancel.
  - command: "python3 _setup/case_run.py --mark-task-start"
    timeout: 30

reference:
  directory: ..

initial_prompt: |
  You are a coding agent in an empty Case project. No user is present, and
  nobody will answer a question or grant approval, so do not ask, do not
  pause, and do not wait for input. Do not delete or overwrite anything this
  run did not create, except what the task asks you to change, and do not
  publish to a shared destination unless the task asks for it.

  Build our employee expense reimbursement case, named
  "ExpenseReimbursementRunnable". The design the team agreed on is in `sdd.md`
  in this folder: an expense goes from submission through manager approval and
  finance approval to payment, with a child route tracking the payment, if
  Approved; Rejected and Withdrawn are the other outcomes. Build it as the
  document describes, with the stages, tasks, rules and timings it lists, and
  connect each task to the resource it names. Those resources are already
  deployed on this tenant.

  <!-- helper:start -->
  The document calls the child case `CaseTest`; it is deployed as `Maestro Case`.
  Every other resource name in the document is its deployed name.
  <!-- helper:end -->

  Build and test the automation.

success_criteria:
  # Advisory: Studio Web agents may test with the RunProject proxy tool instead,
  # which the eval testbench stubs.
  - type: command_executed
    description: "Advisory: the agent ran its own test run (uip maestro case debug), as the request asks"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+case\s+debug(?![-\w])(?!\s+--help)'
    min_count: 1
    weight: 1.0
    pass_threshold: 0.0

  - type: run_command
    description: "uip maestro case validate passes on the generated case plan"
    command: "p=$(python3 -c 'import sys; sys.path.insert(0, sys.argv[1]); from _shared.case_check import existing_caseplan, find_caseplan; print(existing_caseplan(sys.argv[2]) or find_caseplan())' \"$REFERENCE_DIR\" ExpenseReimbursementRunnable/ExpenseReimbursementRunnable/caseplan.json); uip maestro case validate \"$p\" --output json"
    timeout: 60
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "the case plan is complete against the design document under validate --strict --sdd: every stage, task, type, condition row, SLA, trigger and variable it lists"
    command: >-
      p=$(python3 -c 'import sys; sys.path.insert(0, sys.argv[1]); from _shared.case_check import existing_caseplan, find_caseplan; print(existing_caseplan(sys.argv[2]) or find_caseplan())' "$REFERENCE_DIR" ExpenseReimbursementRunnable/ExpenseReimbursementRunnable/caseplan.json);
      uip maestro case validate "$p" --strict --sdd $(find . -name sdd.md -not -path '*/.venv/*' | head -1) --output json
    timeout: 60
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "the case plan encodes the 7-stage expense topology: Submission -> Manager Approval -> Finance Approval -> Payment -> Approved happy path, Rejected/Withdrawn terminal lanes, the automated task-type mix (api-workflow/agent/process/rpa/wait-for-timer), the Payment Tracking child case, and bindings to the deployed resource names"
    command: "python3 $REFERENCE_DIR/_shared/check_expense_runnable_structure.py"
    timeout: 120
    expected_exit_code: 0
    weight: 4.0
    pass_threshold: 1.0

  # Worst case: refresh (180 s), two debug calls (2 x 720 s) and the retry sleep
  # (15 s), then following the instance (900 s) plus one poll (20 s), one last
  # read of its executions (420 s), one of its status (420 s) and, when that
  # status shows the end, one more of its executions (420 s).
  - type: run_command
    description: "Effects: one harness-run uip maestro case debug is followed until the Approved stage completes or the instance ends, Submission, Manager Approval, Finance Approval, Payment and Approved each ran to Completed, the Rejected and Withdrawn lanes did not run, and no element failed"
    command: "python3 $REFERENCE_DIR/e2e_expense_runnable/check_expense_runnable_run.py"
    timeout: 4020
    expected_exit_code: 0
    weight: 6.0
    pass_threshold: 1.0

post_run:
  - command: "python3 _setup/case_run.py --cancel-debug-instances"
    timeout: 300
  - command: "python3 _setup/cleanup_solutions.py"
    timeout: 120
