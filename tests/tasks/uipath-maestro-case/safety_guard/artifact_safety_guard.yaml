task_id: skill-case-artifact-safety-guard
description: >
  Rule 14 negative guard: while building a two-stage case (HITL action →
  downstream process), the agent MUST assemble caseplan.json /
  registry-resolved.json with Read + Write/Edit only. It must NOT shell out to a script or
  interpreter to write, parse, or redirect into a skill artifact
  (`node -e ...fs`, `python ...open(...)`, `jq ... > caseplan.json`,
  `sed -i`, a `/tmp/build-caseplan.js` helper, etc.). The sanctioned
  `node -e "crypto.randomUUID()"` UUID subprocess (no `fs`, no redirection)
  stays allowed. Grades the build succeeding via the sanctioned path, not
  a self-report.
tags: [uipath-maestro-case, integration, mode:build, lifecycle:generate, shape:multi-node, node:hitl]
sandbox:
  template_sources:
    - type: template_dir
      path: ../_setup
      mount_point: _setup
initial_prompt: |
  Create a UiPath Case Management project named "InvoiceReviewCase" with a
  HITL action review whose decision is recorded by a downstream process
  task. Use the same name for the solution and the project so the case file
  lives in InvoiceReviewCase/InvoiceReviewCase/.

  Write this sdd.md to sdd.md first, then build from it:

  ```
  # SDD — InvoiceReviewCase

  Two-stage case where a HITL action task's decision is recorded by a
  downstream process task.

  ## Section 1: Case Definition

  ### 1.1 Case Metadata
  | Property | Value |
  |---|---|
  | Case Name | InvoiceReviewCase |
  | Case Description | Reviews an invoice and records the decision. |
  | Case Identifier | Prefix: IRC, Type: constant |
  | Case-Level SLA | - |
  | SLA Type | - |

  ### 1.3 Triggers
  | Trigger Type | Source | Configuration | Initial Variable Mapping |
  |---|---|---|---|
  | manual | User-initiated start of the case | - | - |

  ### 1.4 Case Completion Conditions
  | WHEN | IF | THEN | Marks Case Complete |
  |---|---|---|---|
  | required-stages-completed | - | Case marked complete | Yes |

  ### 1.5 Case Variables
  | Name | Category | Type | sourceTriggers | sourceFields | Default | Description |
  |---|---|---|---|---|---|---|
  | invoiceAmount | In | number | | | | Invoice amount supplied by the caller. |
  | vendorName | In | string | | | | Vendor name supplied by the caller. |
  | invoiceNumber | In | string | | | | Invoice number supplied by the caller. |
  | approved | Variable | boolean | | | | Reviewer decision; populated by Review Invoice. |
  | notes | Variable | string | | | | Reviewer notes; populated by Review Invoice. |

  ## Section 2: Stages & Tasks

  ### Stage 1: Review (`review`)
  **Type:** Stage
  **Description:** Finance manager reviews and approves the invoice.
  **Required for Case Completion:** Yes

  #### Stage Entry Conditions
  | WHEN | IF | Interrupting |
  |---|---|---|
  | case-entered | - | No |

  #### Stage Completion Conditions
  | WHEN | IF | Exit Type | Marks Stage Complete |
  |---|---|---|---|
  | required-tasks-completed | - | exit-only | Yes |

  #### Tasks
  | # | Task ID | Task Name | Type | Required | Run Only Once | Persona | SLA |
  |---|---------|-----------|------|----------|---------------|---------|-----|
  | 1 | `review.reviewInvoice` | Review Invoice | action | Yes | No | Finance Manager | — |

  ##### Task 1.1: Review Invoice (`review.reviewInvoice`)

  **Type:** action
  **Description:** Manager reviews the invoice and approves or rejects.

  **Entry Condition**

  | WHEN | IF |
  |---|---|
  | current-stage-entered | - |

  | Field | Value |
  |---|---|
  | Action App Reference | Name "Review Invoice", Folder "Shared" |
  | Component Type | ACTION_APP |

  **Inputs**
  | Variable | Type | Binding |
  |---|---|---|
  | invoiceAmount | number | =vars.invoiceAmount |
  | vendorName | string | =vars.vendorName |
  | invoiceNumber | string | =vars.invoiceNumber |

  **Outputs**
  | Variable | Type | Binding |
  |---|---|---|
  | approved | boolean | -> approved |
  | notes | string | -> notes |

  ### Stage 2: Record (`record`)
  **Type:** Stage
  **Description:** Records the decision for downstream consumers.
  **Required for Case Completion:** Yes

  #### Stage Entry Conditions
  | WHEN | IF | Interrupting |
  |---|---|---|
  | selected-stage-completed("Review") | - | No |

  #### Stage Completion Conditions
  | WHEN | IF | Exit Type | Marks Stage Complete |
  |---|---|---|---|
  | required-tasks-completed | - | exit-only | Yes |

  #### Tasks
  | # | Task ID | Task Name | Type | Required | Run Only Once | Persona | SLA |
  |---|---------|-----------|------|----------|---------------|---------|-----|
  | 1 | `record.logDecision` | Log Decision | process | Yes | No | system | — |

  ##### Task 2.1: Log Decision (`record.logDecision`)

  **Type:** process
  **Description:** Logs the reviewer decision and notes downstream.

  **Entry Condition**

  | WHEN | IF |
  |---|---|
  | current-stage-entered | - |

  **Inputs**
  | Variable | Type | Binding |
  |---|---|---|
  | approved | boolean | =vars.approved |
  | notes | string | =vars.notes |
  ```

  Important:
  - The `uip` CLI is already available.
  - Treat the Phase 1 and Phase 2→3 build gates as pre-approved — do not
    block on their HARD STOP / AskUserQuestion approval steps.
  - If a resource cannot be resolved from the registry, write a placeholder
    task per the skill's placeholder-tasks reference — do NOT fabricate a
    taskTypeId.
  - Do NOT run `uip maestro case debug`.
  - Do NOT publish to Studio Web or Orchestrator.

  The task is NOT complete until `uip maestro case validate` passes on the
  generated case plan.
success_criteria:
  - type: file_exists
    description: "caseplan.json was created at the conventional path"
    path: "InvoiceReviewCase/InvoiceReviewCase/caseplan.[cj][as][so][en]"
    weight: 1.5
    pass_threshold: 1.0

  - type: json_check
    description: "Caseplan contains both an action task and a process task"
    path: "InvoiceReviewCase/InvoiceReviewCase/caseplan.[cj][as][so][en]"
    assertions:
      - operator: regex
        expression: "join(',', nodes[].data.tasks[][].type)"
        expected: "\\baction\\b"
      - operator: regex
        expression: "join(',', nodes[].data.tasks[][].type)"
        expected: "\\bprocess\\b"
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "uip maestro case validate passes on the generated caseplan.json"
    command: "p=$(ls InvoiceReviewCase/InvoiceReviewCase/caseplan.case InvoiceReviewCase/InvoiceReviewCase/caseplan.json 2>/dev/null | head -1); uip maestro case validate \"$p\" --output json"
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  # --- Rule 14 guards: no interpreter/stream-editor/helper-script assembly of a skill artifact ---
  # crypto.randomUUID() UUID subprocess (no fs, no redirection) is NOT matched by either pattern.
  - type: command_not_executed
    description: "Rule 14: no inline interpreter or stream-editor writes to a skill artifact (read-only inspection is allowed)"
    tool_name: "Bash"
    # Quoted sed/perl scripts are consumed whole, so `s/a/b/; s/c/d/` and `&` back-references
    # do not end the command; only an unquoted ; & | does. Identical to the cm_golden_expense guard,
    # pinned with fixtures by _shared/test_rule14_guard_patterns.py.
    command_pattern: '((sed|perl|ruby)\s+(?:-\S+\s+(?:(?:''[^'']*''|"[^"]*")\s+)?){0,8}?(?:-(?!-)\S*i\S*|--in-place\S*)\s(?:''[^'']*''|"[^"]*"|[^;&|\n''"]){0,400}?(?:[''"][^''"\n]*?)?(?<![\w.-])(caseplan\.(json|case)|registry-resolved\.json|bindings_v2\.json|entry-points\.json)(?![\w.])|awk\b[^\n]*-i\s*inplace[^\n]*(?<![\w.-])(caseplan\.(json|case)|registry-resolved\.json|bindings_v2\.json|entry-points\.json)(?![\w.])|(open\s*\([^()\n]{0,300}?(?:[\w.]+\((?:[^()\n]|\([^()\n]{0,100}\)){0,200}?)?(?<![\w.-])(caseplan\.(json|case)|registry-resolved\.json|bindings_v2\.json|entry-points\.json)(?![\w.])[^()\n]{0,20}\)?[^()\n]{0,80}?,\s*(?:mode\s*=\s*)?[''"](?=[rwaxbt+]{1,4}[''"])[rbt]*[wax+][rwaxbt+]*[''"]|Path\s*\([^\n]{0,200}?(?<![\w.-])(caseplan\.(json|case)|registry-resolved\.json|bindings_v2\.json|entry-points\.json)(?![\w.])[''"]?\s*\)?\s*\)?\s*\.(?:write_(?:text|bytes)\s*\(|open\s*\(\s*(?:mode\s*=\s*)?[''"](?=[rwaxbt+]{1,4}[''"])[rbt]*[wax+][rwaxbt+]*[''"])|(shutil\.(copy\w*|move)|os\.(replace|rename))\s*\([^,)\n]{0,300},\s*[^)\n]{0,300}?(?<![\w.-])(caseplan\.(json|case)|registry-resolved\.json|bindings_v2\.json|entry-points\.json)(?![\w.]))|(fs\.|require\s*\(\s*[''"](node:)?fs[''"]\s*\)\s*\.)(promises\.)?((write|append|truncate|rm|unlink)\w*\s*\(\s*[''"`][^''"`\n]{0,300}?(?<![\w.-])(caseplan\.(json|case)|registry-resolved\.json|bindings_v2\.json|entry-points\.json)(?![\w.])|(rename|copyFile|cp)\w*\s*\([^,)\n]{0,300},\s*[^)\n]{0,300}?(?<![\w.-])(caseplan\.(json|case)|registry-resolved\.json|bindings_v2\.json|entry-points\.json)(?![\w.]))|File\.(write\s*\([^)\n,]{0,300}(?<![\w.-])(caseplan\.(json|case)|registry-resolved\.json|bindings_v2\.json|entry-points\.json)(?![\w.])|open\s*\([^)\n,]{0,300}(?<![\w.-])(caseplan\.(json|case)|registry-resolved\.json|bindings_v2\.json|entry-points\.json)(?![\w.])[^)\n,]{0,20},\s*[''"][wa])|\b(?P<v>[A-Za-z_]\w*)\s*=\s*[^\n;=]{0,160}?(?<![\w.-])(caseplan\.(json|case)|registry-resolved\.json|bindings_v2\.json|entry-points\.json)(?![\w.])[''"`)](?=[\s\S]{0,2000}?(?:open\s*\(\s*(?:(?<![\w.])(?P=v)|(?:str|os\.fspath|Path)\s*\(\s*(?<![\w.])(?P=v)\s*\))\s*,\s*(?:mode\s*=\s*)?[''"](?=[rwaxbt+]{1,4}[''"])[rbt]*[wax+][rwaxbt+]*[''"]|(?<![\w.])(?P=v)\s*\.\s*(?:write_(?:text|bytes)\s*\(|open\s*\(\s*(?:mode\s*=\s*)?[''"](?=[rwaxbt+]{1,4}[''"])[rbt]*[wax+][rwaxbt+]*[''"])|Path\s*\(\s*(?<![\w.])(?P=v)\s*\)\s*\.\s*(?:write_(?:text|bytes)\s*\(|open\s*\(\s*(?:mode\s*=\s*)?[''"](?=[rwaxbt+]{1,4}[''"])[rbt]*[wax+][rwaxbt+]*[''"])|(?:write|append)File(?:Sync)?\s*\(\s*(?<![\w.])(?P=v)\s*,|(?:shutil\.(?:copy\w*|move)|os\.(?:replace|rename)|(?:rename|copyFile)(?:Sync)?)\s*\([^,)\n]{0,300},\s*(?<![\w.])(?P=v)\s*(?:[,)]|$)))|\b(?P<s>[A-Za-z_]\w*)=[''"]?[^''"\s;&|]*(?<![\w.-])(caseplan\.(json|case)|registry-resolved\.json|bindings_v2\.json|entry-points\.json)(?![\w.])(?=[\s\S]{0,2000}?\b(?:sed|perl|ruby)\s+(?:-\S+\s+)*?-(?!-)\S*i\S*[^;&|\n]*\$\{?(?P=s)\b)|\b(?:mv|cp|install)\b(?![ \t]*=)[^;&|\n]{0,400}?\s[''"]?(?!(?:[^\s''";&|]*/)?(?:\.flow-sdk|backups?|bak|orig|original)/)[^\s''";&|]{0,300}?(?<![\w.-])(caseplan\.(json|case)|registry-resolved\.json|bindings_v2\.json|entry-points\.json)(?![\w.])[''"]?(?:\s+\d*[<>]&?\s*[^\s;&|]*)*\s*(?:$|[;&|\n)])|\b(?P<t>[A-Za-z_]\w*)=[''"]?[^''"\s;&|]*(?<![\w.-])(caseplan\.(json|case)|registry-resolved\.json|bindings_v2\.json|entry-points\.json)(?![\w.])(?=[\s\S]{0,2000}?\b(?:mv|cp|install|truncate)\b(?![ \t]*=)[^;&|\n]*\s[''"]?\$\{?(?P=t)\}?[''"]?(?:\s+\d*[<>]&?\s*[^\s;&|]*)*\s*(?:$|[;&|\n)]))|(sed|perl|ruby)\s+(?:-\S+\s+(?:(?:''[^'']*''|"[^"]*")\s+)?){0,8}?(?:-(?!-)\S*i\S*|--in-place\S*)\s(?:''[^'']*''|"[^"]*"|[^;&|\n''"]){0,400}?(?<![\w.])[''"]?[^\s;&|''"]*\*(?:\.(?:json|case))?[''"]?(?=\s|$|[;&|])|\bfind\b[^;&|\n]{0,300}?-i?name\s+[''"]?(?:(?:caseplan|registry-resolved|bindings_v2|entry-points)[^\s''"]*|\*\.(?:json|case))[''"]?(?=\s)[^;&|\n]{0,300}?-exec\s+(?:sed|perl|ruby)\s+(?:-\S+\s+){0,8}?-(?!-)\S*i)'
    weight: 2.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Rule 14: no shell redirection into a skill artifact and no helper-script build-assembler (`> caseplan.json`, `| tee registry-resolved.json`, `node build-caseplan.js`, `python gen.py`)"
    tool_name: "Bash"
    # The script path must be the token immediately after the interpreter: agents wrap every
    # command in `/bin/bash -lc '...'`, so `bash\s+[^\n]*\.sh` would match any command that merely
    # mentions a script path (e.g. `rg ... audit_caseplan.py`). The lookahead exempts the skill's
    # own read-only auditor, which implementation.md mandates as the Step 12 build gate.
    command_pattern: '([<>]{1,2}\s*\S*(caseplan\.(json|case)|registry-resolved\.json|bindings_v2\.json|entry-points\.json)|tee\b[^\n]*(caseplan\.(json|case)|registry-resolved\.json)|\b(node|nodejs|python[0-9]?|bash|sh)\s+(?!\S*uipath-maestro-case/scripts/)\S+\.(js|mjs|cjs|py|sh)\b)'
    weight: 2.0
    pass_threshold: 1.0

post_run:
  - command: "python3 _setup/cleanup_solutions.py"
    timeout: 120

run_limits:
  task_timeout: 900
  max_turns: 120
  turn_timeout: 900
