task_id: skill-case-external-workflow-smoke-task-placed
description: >
  Smoke test: agent builds a minimal Case Management project containing one
  `external-workflow` task (an Integration Service external automation).
  Verifies the task is written into caseplan.json with type "external-workflow"
  and that the serviceType invariant holds — a resolved task must carry an
  explicit data.serviceType, a placeholder must carry empty data. The external
  automation may be unresolvable on the test tenant; either outcome passes so
  long as the invariant holds.
tags: [uipath-maestro-case, smoke, mode:build, lifecycle:generate, shape:single-node, feature:registry]

initial_prompt: |
  Create a UiPath Case Management project named "OrderSyncCase" with a manual
  trigger and a single stage "Fulfilment" containing one external-workflow task
  that hands the order to the fulfilment system's own workflow.

  Use this sdd.md as the sole input — write it to sdd.md first, then build from
  it. Use the same name for the solution and the project so the case file lives
  at OrderSyncCase/OrderSyncCase/caseplan.json.

  ```
  # SDD — OrderSyncCase

  Single-stage case that invokes a workflow owned by an external system.

  ## Section 1: Case Definition

  ### 1.1 Case Metadata
  | Property | Value |
  |---|---|
  | Case Name | OrderSyncCase |
  | Case Description | Hands a confirmed order to the fulfilment system. |
  | Case Identifier | Prefix: OSC, Type: constant |
  | Case-Level SLA | - |
  | SLA Type | - |

  ### 1.3 Triggers
  | Trigger Type | Source | Configuration | Initial Variable Mapping |
  |---|---|---|---|
  | manual | User-initiated start of the case | - | - |

  ### 1.4 Case Completion Conditions
  | WHEN | IF | THEN | Marks Case Complete |
  |---|---|---|---|
  | required-stages-completed | - | Case marked complete | Yes |

  ## Section 2: Stages & Tasks

  ### Stage 1: Fulfilment (`fulfilment`)
  **Type:** Stage
  **Description:** Hands the order to the fulfilment system and continues.
  **Required for Case Completion:** Yes

  #### Stage Entry Conditions
  | WHEN | IF | Interrupting |
  |---|---|---|
  | case-entered | - | No |

  #### Stage Completion Conditions
  | WHEN | IF | Exit Type | Marks Stage Complete |
  |---|---|---|---|
  | required-tasks-completed | - | exit-only | Yes |

  #### Tasks
  | # | Task ID | Task Name | Type | Required | Run Only Once | Persona | SLA |
  |---|---------|-----------|------|----------|---------------|---------|-----|
  | 1 | `fulfilment.syncOrder` | Sync order to fulfilment system | external-workflow | Yes | No | system | — |

  ##### Task 1.1: Sync order to fulfilment system (`fulfilment.syncOrder`)

  **Type:** external-workflow
  **Description:** Invokes the fulfilment system's own workflow. The case does
  not wait for it to finish.

  **Entry Condition**

  | WHEN | IF |
  |---|---|
  | current-stage-entered | - |

  ###### External Workflow Task Detail

  **Resolved Resource:** OrderSyncFlow
  **Folder Path:** `<UNRESOLVED>`
  **Operation:** `<UNRESOLVED>`
  **Connection ID:** `<UNRESOLVED>`
  **Execution Mode:** async
  ```

  Important:
  - The `uip` CLI is already available in the environment.
  - Treat the generated plan as pre-approved — do not block on any HARD STOP
    / AskUserQuestion approval step (Phase 0, post-tasks.md, or Phase 2a→2b).
  - If the external automation cannot be resolved, write a placeholder task per
    the skill's placeholder-tasks reference (type "external-workflow", empty
    data) — do NOT fabricate an activity type id, connection id, or I/O
    contract.
  - Do NOT run `uip maestro case debug`.

  The task is NOT complete until `uip maestro case validate` passes on the
  generated caseplan.

success_criteria:
  - type: file_exists
    description: "caseplan.json was created at the conventional path"
    path: "OrderSyncCase/OrderSyncCase/caseplan.json"
    weight: 1.5
    pass_threshold: 1.0

  - type: json_check
    description: "Caseplan contains an external-workflow typed task"
    path: "OrderSyncCase/OrderSyncCase/caseplan.json"
    assertions:
      - expression: "length(nodes[].data.tasks[][] | [?type=='external-workflow'])"
        operator: gt
        expected: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: >
      serviceType invariant — every external-workflow task is either a
      placeholder (empty data) or carries an explicit data.serviceType. An
      omitted serviceType on a bound task silently inverts execution mode and
      validate does not catch it.
    command: >
      python3 -c "import json,sys; d=json.load(open('OrderSyncCase/OrderSyncCase/caseplan.json'));
      t=[x for n in d['nodes'] for lane in (n.get('data') or {}).get('tasks') or [] for x in lane
      if x.get('type')=='external-workflow'];
      sys.exit(0 if t and all((not (x.get('data') or {})) or 'serviceType' in x['data'] for x in t) else 1)"
    timeout: 15
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "uip maestro case validate passes on the generated caseplan"
    command: "uip maestro case validate OrderSyncCase/OrderSyncCase/caseplan.json --output json"
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: >
      No half-bound task — data is either exactly {} (placeholder) or carries
      the full trio serviceType + name + folderPath. A partially bound task is
      harder to upgrade than a bare one and passes validate either way.
    command: >
      python3 -c "import json,sys; d=json.load(open('OrderSyncCase/OrderSyncCase/caseplan.json'));
      t=[x for n in d['nodes'] for lane in (n.get('data') or {}).get('tasks') or [] for x in lane
      if x.get('type')=='external-workflow'];
      ok=lambda a: (not a) or all(k in a for k in ('serviceType','name','folderPath'));
      sys.exit(0 if t and all(ok(x.get('data') or {}) for x in t) else 1)"
    timeout: 15
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: >
      No Connection root bindings for this task type — an external-workflow
      carries its connection in data.context[], not in a ConnectionId /
      FolderKey binding pair (that is the connector-activity shape).
    command: >
      python3 -c "import json,sys; d=json.load(open('OrderSyncCase/OrderSyncCase/caseplan.json'));
      sys.exit(1 if [b for b in (d.get('bindings') or []) if b.get('resource')=='Connection'] else 0)"
    timeout: 15
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 1.0

  # Advisory — records convention adherence without docking a run that reaches
  # the same outcome another way (e.g. a correct placeholder on a tenant with
  # no external automation published).
  - type: command_executed
    description: "Agent consulted the external-automation catalog rather than the regular one"
    tool_name: "Bash"
    command_pattern: 'typecache-external-automation-activities|tasks\s+describe\s+.*external-workflow'
    min_count: 1
    weight: 1.0
    pass_threshold: 0

post_run:
  - command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-case/_shared/cleanup_solutions.py"
    timeout: 120

run_limits:
  expected_turns: 55
  task_timeout: 900
  max_turns: 120
  turn_timeout: 900
