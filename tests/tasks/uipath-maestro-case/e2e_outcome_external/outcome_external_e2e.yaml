task_id: skill-case-e2e-outcome-external
description: >
  OUTCOME-BASED E2E, asked the way a Studio Web user would ask it: build an
  expense-approval case that emails the approver and files a Jira audit issue,
  both carrying a per-run request reference that pre_run writes into
  `request.md` (with the two connection IDs). The harness runs the case once
  under debug, then reads Microsoft Graph and Atlassian (through the tenant's
  own Integration Service connections) to confirm the email was sent to the approver and
  the issue exists, each created after the harness started the
  run. Caseplan shape is not graded; validate passing is advisory, and
  reaching finalStatus=Completed weighs less than the effects, because a case
  can complete while notifying nobody (the Outlook send action saves a draft
  unless `saveAsDraft` is false). The agent's own test run is advisory; records
  it makes predate the harness run and are not counted. Text between the
  helper markers is lower-tier guidance (experiments/use-case-tiers.yaml).

  Tenant prerequisite: the shared sandbox Outlook 365 and Jira connections are
  healthy. pre_run pings both and ends the run as ERROR when either is not.
tags: [uipath-maestro-case, e2e, mode:build, lifecycle:setup, shape:multi-node, connector, feature:activities, feature:write-back, path-to-ga, outcome-graded]
sandbox:
  template_sources:
    - type: template_dir
      path: ../_setup
      mount_point: _setup
    - type: template_dir
      path: _setup
      mount_point: _setup
run_limits:
  task_timeout: 7200
  max_turns: 300
  turn_timeout: 1800

# The case skill delegates reference reading to sub-agents; without Agent the whole
# build runs inline in one context. Extends the experiment's allowed_tools — keep the
# base list in sync with experiments/default.yaml.
agent:
  allowed_tools: ["Skill", "Bash", "Read", "Write", "Edit", "Glob", "Grep", "Agent"]
# `..` so the graders can import the shared debug-failure helper from
# `_shared/case_check.py`; the grader commands below carry the task folder.
reference:
  directory: ..

pre_run:
  - command: "python3 _setup/localize_tenant_ids.py"
    timeout: 300
  - command: "python3 _setup/seed_outcome.py"
    timeout: 60

initial_prompt: |
  You are a coding agent in an empty Case project. No user is present, and
  nobody will answer a question or grant approval, so do not ask, do not
  pause, and do not wait for input. Do not delete or overwrite anything this
  run did not create, except what the task asks you to change, and do not
  publish to a shared destination unless the task asks for it.

  Build an expense approval case called "OutcomeExpenseApproval". When an
  expense request comes in, first the approver is emailed that the request is
  waiting for their decision, then a Jira issue has to be filled in our audit
  project as the audit record. The email subject and the issue summary must
  both carry the request's reference, so the auditors can match the
  notification to the audit record. The email has to really be sent: a saved
  draft notifies nobody.

  The request reference, the approver's address, the wording, the Jira project
  and issue type, and the Outlook and Jira connections to use are in
  `request.md` in this folder.

  The case has to send the email and file the issue itself when it runs. Do
  not send or file them by hand, and do not publish the solution.

  <!-- helper:start -->
  Outlook's send action saves a draft unless its `saveAsDraft` query parameter is false.
  Jira's create-issue metadata does not list `fields.summary` or `fields.description`, but the API accepts both.
  <!-- helper:end -->

  Build and test the automation.
success_criteria:
  - type: skill_triggered
    description: "Advisory: agent invoked the uipath-maestro-case skill"
    skill_name: "uipath-maestro-case"
    expected_skill: "uipath-maestro-case"
    weight: 1.0
    pass_threshold: 0.0

  # Advisory: convention adherence, not the objective. "Not if it validated" — a case
  # that validates while notifying nobody has not achieved anything.
  - type: run_command
    description: "ADVISORY — uip maestro case validate passes on the generated caseplan.json"
    command: "p=$(ls OutcomeExpenseApproval/OutcomeExpenseApproval/caseplan.case OutcomeExpenseApproval/OutcomeExpenseApproval/caseplan.json 2>/dev/null | head -1); uip maestro case validate \"$p\" --output json"
    timeout: 60
    weight: 1.0
    pass_threshold: 0

  # The execution vehicle. Deliberately lighter than the outcome probes below.
  # timeout must EXCEED the grader's own slow path (600 s CLI debug poll +
  # INSTANCE_WAIT_SECONDS 600 s), not equal it. At 1800 s they matched exactly and
  # coder_eval killed the grader at the wall: no result published, lock stranded,
  # and the next criterion started a SECOND debug run. Margin is the fix.
  - type: run_command
    description: "case executes: uip solution resources refresh then uip maestro case debug reaches finalStatus=Completed"
    command: "python3 $REFERENCE_DIR/e2e_outcome_external/check_case_ran.py"
    timeout: 2400
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  # THE OUTCOMES — measured in the third-party systems.
  - type: run_command
    description: "OUTCOME — the approver was notified: a sent, non-draft email to the approver carrying this run's reference is in the connection's Sent Items, as measured via Microsoft Graph"
    command: "python3 $REFERENCE_DIR/e2e_outcome_external/check_outcome_email.py"
    timeout: 1800
    expected_exit_code: 0
    weight: 4.0
    pass_threshold: 1.0

  - type: run_command
    description: "OUTCOME — the audit record was filed: a Jira issue carrying this run's reference exists in the audit project, as measured via the Atlassian REST API"
    command: "python3 $REFERENCE_DIR/e2e_outcome_external/check_outcome_jira.py"
    timeout: 1800
    expected_exit_code: 0
    weight: 4.0
    pass_threshold: 1.0

  # Anti-gaming: both outcomes above are reachable by calling the connectors straight
  # from the shell, with no case built at all. The CASE has to produce them, so direct
  # mutating connector calls are disqualifying. Read-only `run list` stays allowed — the
  # skill legitimately uses it to resolve reference fields (issue types, mail folders).
  - type: command_not_executed
    description: "Agent did not produce the external effects by hand — no direct mutating connector calls (uip is resources run create/update/replace/delete)"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+is\s+resources\s+run\s+(create|update|replace|delete)\b'
    weight: 2.0
    pass_threshold: 1.0

  # Advisory: the request asks for a test run. Records the agent's own run makes
  # predate the harness's debug start and are filtered out by the outcome probes
  # (outcome_probe._only_after), so testing cannot pass the outcome criteria.
  - type: command_executed
    description: "Advisory: the agent ran its own test run (uip maestro case debug), as the request asks"
    tool_name: "Bash"
    command_pattern: '(?:^|[;&|]\s*|\bthen\s+|\bdo\s+)(uip|\$UIP)\s+maestro\s+case\s+debug(?![-\w])(?!\s+--help)'
    min_count: 1
    weight: 1.0
    pass_threshold: 0.0

  - type: command_not_executed
    description: "Agent did not publish the solution, as the request asks"
    tool_name: "Bash"
    command_pattern: '(?:^|[;&|]\s*)(uip|\$UIP)\s+(maestro\s+case|solution)\s+publish\b(?![^;&|\n]*--help)'
    weight: 1.0
    pass_threshold: 1.0

post_run:
  - command: "python3 _setup/cleanup_outcomes.py"
    timeout: 180
  - command: "python3 _setup/cleanup_solutions.py"
    timeout: 120
