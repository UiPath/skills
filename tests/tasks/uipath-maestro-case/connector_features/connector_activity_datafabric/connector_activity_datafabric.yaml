task_id: skill-case-single-connector-activity-datafabric-picker
description: >
  The connector-activity task is a Data Fabric Create Entity Record whose
  folderEntityName input is a solution-resource picker, so `case spec
  --solution-folder` must resolve the entity into the solution.
  Exercises the connector-activity plugin: registry pull, activity-type-id
  lookup, connection resolution via `case spec --input-details`, and direct
  caseplan.case write of a resolved `type: "execute-connector-activity"` node
  (real `data.typeId` + `data.connectionId`, no fabricated IDs). Stops at
  validate + resolution assertions — NOT debug: executing a connector activity
  has real side effects (Rule 13), so this task verifies the BUILD, not runtime.
  Requires cloud auth + a healthy Integration Service connection for the named
  connector on the test tenant.
tags: [uipath-maestro-case, e2e, mode:build, lifecycle:generate, shape:single-node, connector, feature:connector-activity, "feature:entities", data-fabric]
max_iterations: 1

run_limits:
  task_timeout: 2100
  max_turns: 150
  turn_timeout: 2100

reference:
  directory: ../..

sandbox:
  template_sources:
    - type: template_dir
      path: ../../_setup
      mount_point: _setup
    - type: template_dir
      path: _setup
      mount_point: _setup

pre_run:
  - command: 'python3 "_setup/preflight_connections.py" uipath-uipath-dataservice'
    timeout: 120
  - command: 'python3 "_setup/ensure_folder_entity.py" "_setup/skill_picker_eval_entity.entity.json"'
    timeout: 120

initial_prompt: |
  Build a UiPath Case Management solution named "DfPickerCase"
  containing a project also named "DfPickerCase" from the sdd.md below.
  Write the sdd.md to disk first, then build from it.

  ```
  # SDD — DfPickerCase

  Single-stage, single-task case exercising the connector-activity task plugin.

  ## Section 1: Case Definition

  ### Case Metadata

  | Property | Value |
  |----------|-------|
  | Case Name | DfPickerCase |
  | Case Description | Single-node case that creates a Data Fabric entity record via a connector activity. |
  | Case Identifier | Type: constant. Prefix: DFP |
  | Case-Level SLA | — |
  | SLA Type | — |

  ### Case Triggers

  | T# | Trigger Type | Source | Configuration |
  |----|-------------|--------|---------------|
  | T01 | Manual | User-initiated start of the case | N/A |

  ### Case Exit Conditions

  | WHEN | IF | THEN | Marks Case Complete | Display Name |
  |------|-----|------|---------------------|--------------|
  | required-stages-completed | — | Case exited | Yes | Complete Rule 1 |

  ### Case Variables

  | Name | Category | Type | sourceTriggers | sourceFields | Default | Description |
  |------|----------|------|----------------|--------------|---------|-------------|

  ---

  ## Section 2: Stages & Tasks

  ### Stage 1: Notify

  **Type:** Stage
  **Required for Case Completion:** Yes

  #### Stage Entry Conditions

  | WHEN | IF | Interrupting | Display Name |
  |------|-----|-------------|--------------|
  | case-entered | — | No | Entry Rule 1 |

  #### Stage Exit Conditions

  | WHEN | IF | Exit Type | Marks Stage Complete | Display Name |
  |------|-----|-----------|---------------------|--------------|
  | required-tasks-completed | — | exit-only | Yes | Complete Rule 1 |

  #### Tasks

  | # | Task Name | Type | Required | Run Only Once | Persona | SLA |
  |---|-----------|------|----------|---------------|---------|-----|
  | 1 | Create entity record | execute-connector-activity | Yes | No | system | — |

  ---

  ##### Task 1.1: Create entity record

  **Type:** execute-connector-activity
  **Description:** Create a SkillPickerEvalEntity record via the Data Service connector.

  **Entry Condition:**

  | WHEN | IF | Display Name |
  |------|-----|--------------|
  | current-stage-entered | — | Entry Rule 1 |

  ###### Connector Task Detail (type: `execute-connector-activity`)

  **Connector:** Data Service
  **Connector Key:** uipath-uipath-dataservice
  **Activity:** Create Entity Record (Preview)
  **Type ID:** 11a59287-5a7a-3a74-b000-91d2c2b6428d
  **Connection ID:** the tenant's live Data Service connection
  **Inputs:** entityScope: "folder", folderEntityName: "SkillPickerEvalEntity" (the folder entity in the Shared folder)
  ```

  Resolve the connector activity against the Integration Service registry and the
  live Data Service connection on the tenant. Treat all build gates as
  pre-approved — do NOT block on the HARD STOP / AskUserQuestion approval steps.
  Do NOT run `uip maestro case debug` (a connector activity executes for real).
  Do NOT ask for approval, confirmation, or feedback. Build end-to-end in a
  single pass and finish with `uip maestro case validate` passing on the
  resulting caseplan.case.

  Before starting, load the uipath-maestro-case skill and follow its workflow.

success_criteria:
  - type: skill_triggered
    description: "Advisory: agent invoked the uipath-maestro-case skill"
    skill_name: "uipath-maestro-case"
    expected_skill: "uipath-maestro-case"
    weight: 1.0
    pass_threshold: 0.0

  - type: command_executed
    description: "Agent pulled the case registry before resolving the connector"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)"?\s+maestro\s+case\s+registry\s+pull'
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent fetched the connector definition to resolve typeId/connectionId (case spec, or the SDK connector library via maestro registry pull/prepare)"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)"?\s+maestro\s+(case\s+spec|registry\s+(pull|prepare))\b(?![^;&|\n]*\s(?:--help|-h)(?![\w-]))'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "uip maestro case validate passes on the generated caseplan.case"
    command: "uip maestro case validate DfPickerCase/DfPickerCase/caseplan.case --output json"
    timeout: 60
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "Caseplan has a RESOLVED execute-connector-activity task (real typeId + connectionId, not a skeleton)"
    command: "python3 $REFERENCE_DIR/connector_features/connector_activity_datafabric/check_df_picker.py"
    timeout: 60
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
