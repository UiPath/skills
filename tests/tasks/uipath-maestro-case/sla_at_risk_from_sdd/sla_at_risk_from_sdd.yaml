task_id: skill-case-sla-at-risk-from-sdd
description: >
  AT-RISK SLA RESPONSE — the sla_from_sdd WarrantyClaimTriage case with Intake's
  start-task moved from breach to at-risk: "Chase Missing Paperwork" enters on the
  template's 3-argument form sla-status-change("Intake","Intake SLA","Intake at
  risk"). No other eval fixture carries an at-risk rule (all 14 sla-status-change
  rows elsewhere are 2-argument breach rows). Graded on the built rule: Intake's
  SLA plus the escalationId of the "Intake at risk" at-risk escalation. A rule
  without escalationId compiles as a breach and fires only at the deadline.
  Connector-free and resource-unresolved; placeholders expected. Stops at validate.
tags:
  - uipath-maestro-case
  - integration
  - mode:build
  - lifecycle:generate
  - shape:multi-node
  - feature:escalation

# Inherits agent: and sandbox: from tests/experiments/default.yaml. A 5-stage build
# with SLAs on four targets runs longer than the default budget allows.
run_limits:
  task_timeout: 3600
  max_turns: 200
  # Measured: terra finishes in ~5 min, but claude-code composes the caseplan in a few
  # long turns and hit the experiment's 900s per-turn default on 2 of 3 replicates
  # (ERROR "Agent turn timed out after 900s"). task_timeout still bounds the run.
  turn_timeout: 1800

sandbox:
  template_sources:
    - type: template_dir
      path: fixtures

reference:
  directory: ..

initial_prompt: |
  Build the Case Management project described by sdd.md in this directory. It is the
  sole source of truth — trust it as written.

  No resources for this case exist on the tenant, so leave task identities unresolved
  and emit placeholders per the skill's rules. Do NOT query the tenant registry,
  connections, or users.

  Not complete until `uip maestro case validate` passes on the generated caseplan.json.
  Stop there — do not publish, upload, or run a debug session.

  Do NOT ask for approval, confirmation, or feedback. Do NOT pause between planning and
  implementation. Before starting, load the uipath-maestro-case skill and follow its
  workflow.

success_criteria:
  - type: run_command
    description: "a caseplan.json was generated"
    command: "find . -name caseplan.json -not -path '*/.venv/*' | grep -q ."
    timeout: 15
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "uip maestro case validate passes on the generated caseplan.json"
    command: "uip maestro case validate $(find . -name caseplan.json -not -path '*/.venv/*' | head -1) --output json"
    timeout: 60
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "The at-risk start-task rule names Intake's SLA and the 'Intake at risk' at-risk escalation (not a breach rule)"
    command: "python3 $REFERENCE_DIR/sla_at_risk_from_sdd/check_at_risk_rule.py"
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
