task_id: skill-case-single-business-rule
description: >
  Add a single-task Case to a staged solution that already holds the CreditRisk
  business rule as an in-solution sibling (decision RiskDecision,
  creditScore >= 700 -> LOW_RISK, else HIGH_RISK), asked the way a Studio Web
  user would ask it. No rule is deployed on the tenant, so the agent must find
  and bind the sibling. The grader runs the case once under
  `uip maestro case debug` and reads the debug instance back
  (`uip maestro case instance variables-all`): a business-rule task bound to
  CreditRisk completed with the default creditScore 742 as its input, and the
  case variable the prompt names, riskBand, is LOW_RISK. A riskBand in the
  task's own run outputs must be LOW_RISK; when the run shows none, the plan
  must set riskBand from the rule's result, not a literal or a default. That the agent ran its own test run is
  advisory. Text between the helper markers is lower-tier guidance
  (experiments/use-case-tiers.yaml) and is not graded.
tags: [uipath-maestro-case, e2e, mode:build, lifecycle:generate, shape:single-node, feature:registry, path-to-ga, outcome-graded]
max_iterations: 1
sandbox:
  template_sources:
    - type: template_dir
      path: fixtures
    - type: template_dir
      path: ../../_setup
      mount_point: _setup
run_limits:
  task_timeout: 4600  # turn 1500 + criteria 2950 + margin
  max_turns: 120
  turn_timeout: 1500

# Marks the task start for the post_run debug-instance cancel.
pre_run:
  - command: "python3 _setup/case_run.py --mark-task-start"
    timeout: 30

reference:
  directory: ../..

initial_prompt: |
  You are a coding agent in a project that already contains the business rule
  CreditRisk, in the solution ./BusinessRuleSingleCase. No user is present,
  and nobody will answer a question or grant approval, so do not ask, do not
  pause, and do not wait for input. Do not delete or overwrite anything this
  run did not create, except what the task asks you to change, and do not
  publish to a shared destination unless the task asks for it.

  Add a case called "BusinessRuleSingleCase" to that solution that scores a
  credit application with the CreditRisk rule.

  - Someone starts the case by hand with the applicant's credit score,
    creditScore. Use 742 when no score is given.
  - The case runs CreditRisk on that score and keeps the risk band the rule
    returns in a case variable called riskBand.

  <!-- helper:start -->
  CreditRisk is a business rule project in this solution and is not deployed on
  the tenant. Its decision RiskDecision takes creditScore (a number) and returns
  riskBand, either LOW_RISK or HIGH_RISK.
  <!-- helper:end -->

  Build and do a test run of the automation.
success_criteria:
  # The plan is found wherever the agent put it (any project name).
  - type: run_command
    description: "uip maestro case validate passes on the case plan the agent built"
    command: "p=$(python3 -c 'import sys; sys.path.insert(0, sys.argv[1]); from _shared.case_check import find_caseplan; print(find_caseplan())' \"$REFERENCE_DIR\") && uip maestro case validate \"$p\" --output json"
    timeout: 90
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "The case project sits in the staged solution beside the rule; no second solution was created"
    command: "test $(find . -name '*.uipx' -not -path '*/.venv/*' | wc -l) -eq 1 && test -f BusinessRuleSingleCase/CreditRisk/entry-points.json"
    timeout: 10
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  # Advisory: Studio Web agents may test with the RunProject proxy tool instead,
  # which the eval testbench stubs.
  - type: command_executed
    description: "Advisory: the agent ran its own test run (uip maestro case debug), as the request asks"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+case\s+debug(?![-\w])(?!\s+--help)'
    min_count: 1
    weight: 1.0
    pass_threshold: 0.0

  # run_debug's worst case: two debug starts (the retry after a Cancelled run),
  # each with one transient-fault retry (4 x 540 s), plus refresh (2 x 120 s),
  # the retry sleeps (3 x 15 s) and the instance list and variables-all reads
  # (2 x 180 s).
  - type: run_command
    description: "Effects: one debug run in which a business-rule task bound to CreditRisk completed with creditScore 742, riskBand comes from its result, and riskBand is LOW_RISK"
    command: "python3 $REFERENCE_DIR/single_node/business_rule/check_business_rule_run.py"
    timeout: 2850
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent did not use mutating case-authoring CLI commands"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+case\s+(cases|stages|tasks|(?:case|stage|task)-(?:entry|exit)-conditions)\s+(add(?:-connector)?|update|remove)\b(?![^;&|\n]*\s(?:--help|-h)(?![\w-]))'
    weight: 1.0
    pass_threshold: 1.0

post_run:
  - command: "python3 _setup/case_run.py --cancel-debug-instances"
    timeout: 300
  - command: "python3 _setup/cleanup_solutions.py"
    timeout: 120
