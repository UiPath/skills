task_id: skill-case-diagnose-custom-output-no-producer
description: >
  Diagnose mode. The staged case PASSES `uip maestro case validate` with zero
  findings. Review's connector task carries a custom output row that is the only
  output on that task missing both `id` and `target`, while every sibling row
  carries both. Its `source` reads `vars.response.status`, the sibling output
  slot's own name read back as a case variable rather than the connector's
  response, and its `elementId` is `root` rather than the stage and task that
  produce it. The validator polices none of this: with the row's `id` and the
  case-level declaration varied independently, all four combinations return
  Valid, including no declaration at all. Grades the repair as matching the
  sibling shape, and the traps: defaulting the variable, deleting or repointing
  the gate, or naming a variable the row does not write.
tags: [uipath-maestro-case, integration, mode:diagnose, lifecycle:edit, shape:multi-node, connector, feature:write-back, feature:conditions]
max_iterations: 1

run_limits:
  task_timeout: 1500
  max_turns: 60
  turn_timeout: 1200

sandbox:
  template_sources:
    - type: template_dir
      path: fixtures

initial_prompt: |
  The LinearThreeStages case under LinearThreeStages/ passes
  `uip maestro case validate` cleanly. Review's connector task is supposed to
  write its send status into the case variable Decision's gate reads, and that
  variable never changes from its declared default.

  Find out why and fix it. Keep the intended design: three stages,
  Intake to Review to Decision, and Decision must still gate on the email
  status the connector task produces.

  - A clean validate is NOT evidence the case is healthy here. The defect is
    something validate cannot see.
  - The connector task must keep writing its result into the case variable the
    gate reads.
  - Do NOT give the variable a default that opens the gate on its own.
  - Do NOT delete the gate, the stages, the tasks, or the trigger.
  - Do NOT retype the connector task.
  - Do NOT run `uip maestro case debug`.
  - Do NOT ask for approval. Work end-to-end and finish with validate passing.

  Scope: this is a targeted repair of one output row, not a build.

  - The defect and its fix are both inside
    LinearThreeStages/LinearThreeStages/caseplan.json. Nothing else changes.
  - Read the case definition and the skill's output binding rules only. You do
    NOT need to read the reference set exhaustively; the read-to-EOF rule is
    lifted for this repair.
  - If you are on your third edit, stop editing and re-read how an output row
    declares the variable it writes.

  Load the uipath-maestro-case skill and follow its validate to fix loop.

success_criteria:
  - type: skill_triggered
    description: "Advisory: agent invoked the uipath-maestro-case skill"
    skill_name: "uipath-maestro-case"
    expected_skill: "uipath-maestro-case"
    weight: 1.0
    pass_threshold: 0.0

  - type: run_command
    description: "uip maestro case validate still passes after the repair"
    command: "uip maestro case validate LinearThreeStages/LinearThreeStages/caseplan.json --output json"
    timeout: 60
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "The connector's custom output row matches its siblings on id and target, names lastEmailStatus, reads the connector response rather than itself, names its producing element, and the gate still reads it with no default opening it"
    command: "python3 $TASK_DIR/check_custom_output_no_producer.py"
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
