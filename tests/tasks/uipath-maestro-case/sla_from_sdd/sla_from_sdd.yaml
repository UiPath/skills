task_id: skill-case-sla-from-sdd
description: >
  GREENFIELD SLA RESPONSES — build the WarrantyClaimTriage case from a staged sdd.md
  that DECLARES its SLA behaviour, and assert the responses survive into
  caseplan.json. The existing sla_response/* family all start from a caseplan.json
  under templates/ and grade a brownfield edit; every other SDD fixture in this suite
  contains zero sla-status-change rows. So no task took an SLA-bearing SDD through
  Phase 1 to 4. This one does, on the two responses that are easiest to confuse:
  Intake's breach starts a follow-up task INSIDE the breached stage (task-entry rule),
  while Assessment's breach hands the claim to a separate interrupting lane that
  returns to origin (stage-entry rule). Also covers a condition-based SLA override,
  an adhoc optional task, and a terminal lane closing the case via a non-completing
  case exit. Connector-free and resource-unresolved so it builds offline — placeholders
  are expected. Stops at validate; no debug, no publish.
tags:
  - uipath-maestro-case
  - integration
  - mode:build
  - lifecycle:generate
  - shape:multi-node
  - feature:escalation

# Inherits agent: and sandbox: from tests/experiments/default.yaml. A 5-stage build
# with SLAs on four targets runs longer than the default budget allows.
run_limits:
  task_timeout: 3600
  max_turns: 200
  # Measured: terra finishes in ~5 min, but claude-code composes the caseplan in a few
  # long turns and hit the experiment's 900s per-turn default on 2 of 3 replicates
  # (ERROR "Agent turn timed out after 900s"). task_timeout still bounds the run.
  turn_timeout: 1800

sandbox:
  template_sources:
    - type: template_dir
      path: fixtures

initial_prompt: |
  Build the Case Management project described by sdd.md in this directory. It is the
  sole source of truth — trust it as written.

  No resources for this case exist on the tenant, so leave task identities unresolved
  and emit placeholders per the skill's rules. Do NOT query the tenant registry,
  connections, or users.

  Not complete until `uip maestro case validate` passes on the generated caseplan.json.
  Stop there — do not publish, upload, or run a debug session.

  Do NOT ask for approval, confirmation, or feedback. Do NOT pause between planning and
  implementation. Before starting, load the uipath-maestro-case skill and follow its
  workflow.

success_criteria:
  - type: run_command
    description: "a caseplan.json was generated"
    command: "find . -name caseplan.json -not -path '*/.venv/*' | grep -q ."
    timeout: 15
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "uip maestro case validate passes on the generated caseplan.json"
    command: "p=$(find . -name caseplan.json -not -path '*/.venv/*' | head -1); uip maestro case validate \"$p\" --output json"
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: >
      the SLA responses declared in sdd.md survived the build — case + 3 stage SLAs, a
      condition-based override on Assessment, start-task on the TASK entry inside Intake
      (not a stage-entry rule, which would re-run the stage), an interrupting enter-stage
      lane with return-to-origin, a non-completing case exit, and an adhoc optional task.
      validate accepts both start-task shapes, so validate passing is not evidence.
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-case/sla_from_sdd/check_sla_from_sdd.py"
    timeout: 60
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "no mutating case CLI verbs — caseplan.json is authored directly per the skill's invariant"
    tool_name: "Bash"
    command_pattern: 'uip\s+maestro\s+case\s+(cases|stages|tasks|[a-z-]*conditions)\s+(add|update|remove)'

  - type: command_not_executed
    description: "no debug run — this case is HITL- and SLA-driven and cannot run headless"
    tool_name: "Bash"
    command_pattern: 'uip\s+maestro\s+case\s+debug'

  - type: command_not_executed
    description: "no publish — the task stops at validate"
    tool_name: "Bash"
    command_pattern: 'uip\s+solution\s+(publish|upload)'
