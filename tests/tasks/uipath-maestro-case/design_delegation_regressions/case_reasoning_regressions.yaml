task_id: skill-case-phase-0-case-reasoning-regressions
description: >
  Design-only run for a case that combines the known task-sequencing
  regressions: parallel tasks after a predecessor, payment obligation racing,
  invalid selected adhoc dependencies, and deterministic rejection routing.
tags:
  - uipath-maestro-case
  - integration
  - lifecycle:generate
  - mode:build
  - shape:multi-node
  - feature:approval-gate
  - feature:conversational

run_limits:
  task_timeout: 3300
  max_turns: 150
  turn_timeout: 2700

initial_prompt: |
  Design a "CaseReasoningRegression" Maestro case and produce `sdd.md`. Stop
  after the SDD — do not create caseplan.json. This is a design-only exercise:
  do not query tenant registry, connections, schemas, or users. Use concrete
  intended resource and system names, leave identities unresolved, and defer
  authoritative tenant resolution to the later build run. Do not inspect plugin
  planning docs.

  Primary stages are Intake, Issuing Permit, and Close.

  Intake receives a permit application and reviews it. If the reviewer rejects
  the application, route deterministically to an Application Rejected terminal
  outcome. Do not make the worker choose the rejected stage manually.

  In Issuing Permit, Collect Fees runs first. After Collect Fees completes,
  Wait for Payment Confirmation listens for a Payment Gateway confirmation
  event while Payment Deadline tracks the payment obligation deadline. Those two
  are independent and must start in parallel after Collect Fees while payment is
  pending. Generate Permit starts only after payment confirmation succeeds. If
  the payment obligation breaches, route to a Deadline Intervention secondary
  stage.

  Internal Notes is optional worker-launched side work in Issuing Permit.
  Nothing required should depend on Internal Notes completing.

success_criteria:
  - type: run_command
    description: "The SDD was produced without building the case"
    command: "test -f sdd.md && test -z \"$(find . -name caseplan.json -print -quit)\""
    timeout: 10
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "Known case-reasoning invariants are represented in sdd.md"
    command: "python3 \"$SKILLS_REPO_PATH/tests/tasks/uipath-maestro-case/design_delegation_regressions/check_case_reasoning_regressions.py\""
    timeout: 10
    expected_exit_code: 0
    weight: 4.0
    pass_threshold: 1.0

  - type: llm_judge
    description: "The design reasons from case semantics instead of phrase-to-rule translation"
    files:
      - sdd.md
    max_file_chars: 180000
    include_agent_output: false
    prompt: |
      Review the CaseReasoningRegression SDD.

      Score 1.0 only when:
      - Payment Deadline and Wait for Payment Confirmation start while payment
        is pending after Collect Fees. They are represented as a parallel
        after-predecessor group, not as duplicate event-triggered tasks gated
        by selected-tasks-completed("Collect Fees").
      - Generate Permit depends on successful payment confirmation, not on the
        payment deadline branch completing.
      - selected-tasks-completed never selects the optional Internal Notes
        adhoc task.
      - Application Rejected is deterministic routing from the review decision,
        not a dangling user-selected-stage without a wait-for-user exit.

      Score 0.5 for one minor omission that does not break the case graph.
      Score 0.0 for duplicate immediate selected-task gates, dangling
      user-selected-stage, or a required dependency on Internal Notes.
    weight: 3.0
    pass_threshold: 0.8

simulation:
  enabled: true
  persona: |
    You are the operations owner who supplied the complete requirements in the
    opening message.
  goal: |
    Get an approved sdd.md, then stop before implementation.
  constraints:
    - "Answer concisely and accept reasonable defaults that do not change the stated stages, tasks, routes, or deadlines."
    - "When shown the design confirmation, approve it and ask the assistant to stop after writing sdd.md."
    - "Do not authorize creating caseplan.json, running, publishing, or deploying."
  max_turns: 35
