task_id: skill-case-phase-0-procurement-sla-interrupts
description: >
  Design handoff (uipath-planner Case Design Lane, in-conversation) through maestro-case planning for a supplier application with global withdrawn and
  SLA events, explicit sequential work, and design-rationale requirements.
  Verifies that global events enter interrupting secondary stages instead of
  being duplicated across every primary stage.
tags:
  - uipath-maestro-case
  - integration
  - lifecycle:generate
  - mode:build
  - shape:multi-node
  - feature:approval-gate
  - feature:conversational
  - feature:escalation
  - feature:trigger

# Inherit agent from the experiment; override only allowed_tools — the Rule 15
# design handoff loads the uipath-planner skill in the same conversation
# (Skill tool); Agent/Task stay allowed for the Rule 17 inline-create path.
agent:
  type: claude-code
  permission_mode: acceptEdits
  allowed_tools: ["Skill", "Bash", "Read", "Write", "Edit", "Glob", "Grep", "Agent", "Task", "TodoWrite"]

run_limits:
  task_timeout: 7200
  max_turns: 120
  # The design handoff runs in-conversation across normal turns; the generous
  # turn_timeout only guards long single-turn SDD/plan writes.
  turn_timeout: 5400

initial_prompt: |
  Design a "SupplierApplication" Maestro case and produce `sdd.md` plus the
  implementation plan at `tasks/tasks.md`. Stop before creating caseplan.json.
  This is a plan-only/no-build design exercise: do not query tenant registry,
  connections, schemas, or users. Use concrete intended resource and system
  names, mark identities `resolve at build`, and defer authoritative tenant
  resolution to the later build run. After approval, use the compact no-build
  planning shape for `tasks/tasks.md`; do not inspect plugin planning docs.

  The primary stages are Intake, Supplier Setup, Compliance Review, Decision,
  and Close. In Supplier Setup, Verify Supplier Identity, then Set Supplier
  Record, then Invite Supplier must run in that order.

  A supplier can withdraw through a supplier-portal event at any point. Treat
  this as one global interrupt into a terminal Withdrawn secondary stage.

  Every primary phase has an SLA target. At 70% elapsed, the people handling the
  application need an at-risk warning. On a phase breach, globally interrupt
  into an SLA Escalation secondary stage that automatically creates a
  Procurement Operations Lead task and sends the supplier an apology plus a new
  expected date, then returns to the interrupted work.

  The whole case has a 15-day SLA. If it breaches, globally interrupt into a
  Case SLA Review secondary stage and create a Procurement Director review task
  before the application can close.

  Preserve why each stage kind, task type, activation mode, sequencing choice,
  SLA behavior, and exception-routing choice was selected. Carry that rationale
  from the SDD into the implementation plan.

success_criteria:
  - type: run_command
    description: "SDD and implementation plan were produced without building the case"
    command: "test -f sdd.md && test -f tasks/tasks.md && test -z \"$(find . -name caseplan.json -print -quit)\""
    timeout: 10
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "Global-event, SLA-reference-closure, sequential-activation, and rationale contract is present"
    command: "python3 \"$SKILLS_REPO_PATH/tests/tasks/uipath-maestro-case/design_delegation_procurement/check_procurement_sla_interrupts.py\""
    timeout: 10
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: llm_judge
    description: "The design uses coherent global interrupt and escalation semantics"
    files:
      - sdd.md
      - tasks/tasks.md
    max_file_chars: 180000
    include_agent_output: false
    prompt: |
      Review the SupplierApplication SDD and implementation plan.

      Score 1.0 only when:
      - Withdrawn is one interrupting secondary stage entered by the global
        supplier-portal event, with no duplicated withdrawal task or exit rule
        on every primary stage.
      - The 70% at-risk warning is an SLA escalation notification. Phase/case
        breach work uses `sla-status-change` entry rules on interrupting
        secondary stages: the phase breach creates the Procurement Operations
        Lead task and sends the supplier the apology plus revised expected
        date; the 15-day case breach creates the Procurement Director review
        task.
      - The three Supplier Setup tasks are explicitly `runs-sequentially`.
        Their list order alone is not treated as execution semantics, and they
        are consecutive single-task data.tasks sets rather than one parallel
        inner array.
      - The SDD explains the stage-kind, task-type, activation, sequencing,
        SLA, and exception-routing choices, and tasks.md preserves those
        rationales for implementation.
      - Global events are not modeled as repeated per-primary-stage exit rules.

      Grade the supplier-facing breach action as the requirement words it —
      an apology plus a revised expected date. Any task/process that sends the
      supplier that content satisfies it; do not require a differently-named
      artifact (a "status note", a specific activity type) that the
      requirement never asks for.

      Grade routing SEMANTICS, not table presentation. The SLA Response Map is
      authoritative for breach routing: when it correctly routes a breach to
      the interrupting stage entry, do not deduct for how per-stage SLA table
      cells render that action (display names, notification wording). The
      consecutive-single-task-set requirement applies to the sequential
      Supplier Setup run only; tasks inside an interrupting secondary stage
      may legitimately run parallel in one shared task set.

      Score 1.0 when all five criteria hold; deviations that are purely
      presentation-level (display names, table rendering, plan formatting) do
      not reduce the score below 0.8. Score 0.5 for one semantic omission.
      Score 0.0 for duplicated per-stage routing, parallel Supplier Setup
      work, missing rationale, or SLA events represented only as
      notifications with no interrupting stage entry for the required
      escalation work.
    weight: 3.0
    pass_threshold: 0.8

simulation:
  enabled: true
  persona: |
    You are the procurement operations owner who supplied the complete
    requirements in the opening message.
  goal: |
    Get an approved sdd.md and tasks/tasks.md, then stop before implementation.
  constraints:
    - "Answer concisely and accept reasonable defaults that do not change the stated stages, tasks, owners, timing, or global-event behavior."
    - "When shown the design confirmation, approve it and ask the assistant to continue through implementation planning only."
    - "Do not authorize creating caseplan.json, running, publishing, or deploying."
  max_turns: 30
