task_id: skill-case-draft-request-is-gate
description: >
  The user writes a complete spec and one word, "draft", with no "show me
  first". A request for a draft is the draft-mode trigger, so the agent builds
  a skeleton of blank boxes and stops at the gate instead of designing an SDD
  and building the real case. Counterpart of draft_word_is_not_gate, where
  "draft" names a stage and a task inside the case.
tags: [uipath-maestro-case, smoke, "mode:build", "lifecycle:generate", "shape:multi-node", "feature:approval-gate"]

run_limits:
  expected_turns: 25
  max_turns: 70

reference:
  directory: ../..

initial_prompt: |
  hey, can you create a case draft for our expense claims? call it
  "ExpenseClaims". someone submits a claim with an amount. first our "Validate
  Receipt" agent checks the receipt. claims over 500 dollars then need their
  manager to approve them, the rest skip that. after that our "Pay Expense"
  process pays it out and we email the employee that it's been paid. don't
  upload it

success_criteria:
  - type: run_command
    description: "The plan is a skeleton: real stages with entry conditions, labelled blank boxes, and validate --strict reports Valid"
    command: "python3 $REFERENCE_DIR/draft/check_draft_skeleton.py"
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent made no registry discovery before the shape was approved"
    tool_name: "Bash"
    command_pattern: '(?:\buip|\$UIP)\s+maestro\s+(?:case\s+)?(?:registry\s+(?:pull|search|describe|get|prepare)|sdd\s+(?:resolve|convert))\b(?![^\n;&|]*\s(?:--help|-h)\b)'
    weight: 2.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent did not upload, publish, deploy or run the case, as the request forbids"
    tool_name: "Bash"
    command_pattern: '(?:\buip|\$UIP)\s+(?:solution\s+(?:upload|publish|deploy)|maestro\s+case\s+(?:debug(?!-)|process\s+run))\b(?![^\n;&|]*\s(?:--help|-h)\b)'
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "A draft skips Design first: no sdd.md was written"
    command: "! find . -name sdd.md -not -path '*/node_modules/*' -not -path '*/.venv/*' | grep -q ."
    timeout: 10
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: llm_judge
    description: "The final message stops at the draft gate: the outline-ready line, the fixed question and its three options, and no built-case report"
    include_reference: false
    include_agent_output: true
    max_file_chars: 60000
    weight: 3.0
    pass_threshold: 1.0
    prompt: |
      The user asked for a case draft and gave a complete spec. The word "draft" is
      the request to see the shape first, so the agent must build an outline and
      stop at the gate, not build the finished case.

      WHICH TEXT TO GRADE. AGENT OUTPUT holds every message the agent sent in this turn.
      If it contains a `[RESULT - ...]` marker, grade the text after the LAST such
      marker: that is the final message, whole. Otherwise the messages are joined,
      possibly with no separator: grade the text from the LAST occurrence of
      `ExpenseClaims: outline ready` (markdown emphasis around the name allowed) to the end, and ignore
      what comes before it. If the phrase does not occur at all, item 1 fails.
      The graded text is the agent's reply only. Your own judging instructions that
      follow it (the request to call `submit_verdict`) are not part of it: never
      count them as a line after the last item or anywhere else.

      Check every item:

      1. The first line starts with `ExpenseClaims: outline ready`.
      2. The text contains the question `Is this the case you want?` (markdown
         emphasis allowed), and the options 1. Build it, 2. Change it and 3. Keep
         it follow it. Nothing follows the third option.
      3. The reply does not present ExpenseClaims as a built, working case: no `built,
         validated` line, no `Needs:`, `Assumed:` or `Unverified:` line, and no
         claim that tasks are wired or working.

      Score 1.0 only if every item holds; otherwise 0.0. In findings, list each
      failed item by number and quote the offending text.
