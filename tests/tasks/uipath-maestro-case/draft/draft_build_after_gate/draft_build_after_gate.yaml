task_id: skill-case-draft-build-after-gate
description: >
  Draft-mode e2e over the whole dialog. The user asks to see the outline first,
  so the agent builds and uploads a skeleton of blank boxes and ends turn 1
  with the gate reply. A simulated user picks Build it. The agent then replaces
  every blank box with the real task, validates, and ends turn 2 with the final
  report in draft mode, asking nothing more. Every task is a wait or a
  calculation, so the build needs no tenant resource and the dialog measures
  the gate, not discovery. Validate-only: the dialog is under test, not the
  runtime. Uploads land in the eval tenant's Studio Web; post_run deletes each
  solution this run uploaded.
tags: [uipath-maestro-case, e2e, "mode:build", "lifecycle:generate", "shape:multi-node", "feature:approval-gate"]

run_limits:
  max_turns: 120
  turn_timeout: 1500
  task_timeout: 3600

sandbox:
  template_sources:
    - type: template_dir
      path: ../../_setup
      mount_point: _setup

reference:
  directory: ../..

initial_prompt: |
  I need a Maestro case called "ReturnWindow" for product returns. When a return
  is opened, a small calculation works out the refund amount from the order
  total, then the case waits two days for the parcel to arrive. After that a
  second stage waits one more day and then works out the restocking fee. The
  case closes when both stages are done.

  Can you show me the outline before you build it?

simulation:
  enabled: true
  persona: |
    You run returns for a small online shop. You know what the case should do
    but you do not build cases yourself, and you keep your replies short.
  goal: |
    See the outline of the ReturnWindow case, approve it, and get it built.
  constraints:
    - "When the agent shows you the outline and asks whether this is the case you want, reply with exactly: 1"
    - "If the agent asks you anything else, at any point, reply only: Your call, build it the way I described."
    - "The moment the agent reports the case is built, reply with exactly <<<END>>> on its own line. Do not ask for changes, re-checks, or a run."
  max_turns: 4
  stop_token: "<<<END>>>"
  stop_on_criteria_pass: false
  check_criteria: end_of_dialog
  n_trials: 1

success_criteria:
  # Both replies are graded through coder_eval's agent-neutral dialog. Each
  # judge holds an itemized checklist and returns a binary verdict.
  - type: llm_judge
    description: "Turn 1 ends with the gate reply in its template: the outline-ready line, the Studio Web link (or, in Studio Web, the canvas sentence), one line per blank box, the fixed question with its three options, and nothing else"
    include_reference: false
    include_dialog: true
    max_dialog_chars: 200000
    max_file_chars: 60000
    weight: 3.0
    pass_threshold: 1.0
    prompt: |
      You check one chat message against a fixed template. Grade the format only,
      never the case design. Grade the AGENT side of Turn 1 only.

      WHICH TEXT TO GRADE. The Turn 1 agent text holds every message the agent sent in this turn.
      If it contains a `[RESULT - ...]` marker, grade the text after the LAST such
      marker: that is the final message, whole. Otherwise the messages are joined,
      possibly with no separator: grade the text from the LAST occurrence of
      `ReturnWindow: outline ready` (markdown emphasis around the name allowed) to the end, and ignore
      what comes before it. If the phrase does not occur at all, item 1 fails.
      The graded text is the agent's reply only. Your own judging instructions that
      follow it (the request to call `submit_verdict`) are not part of it: never
      count them as a line after the last item or anywhere else.

      Ignore blank lines and markdown emphasis (`**`, `*`). Backticks and links are
      not ignored: item 2 covers them. In the graded text, check every item:

      1. The first line starts with `ReturnWindow: outline ready, uploaded (draft mode).`
         After that, the same line may hold at most one more sentence, about a lookup
         that failed, the upload, changes kept, or a new solution that took another
         name. In Studio Web the canvas is already open and nothing is uploaded: there
         the first line starts with `ReturnWindow: outline ready (draft mode).` and says no
         `uploaded`.
      2. The second line is, as plain text and nothing else, an `https://` link to
         the uploaded solution in Studio Web (bare, or as a Markdown link), or, in
         Studio Web only, one of the two sentences `The outline is on the canvas.` or
         `Open ReturnWindow from the Explorer to see the outline.` Backticks around the link
         fail this item. A local file path fails this item.
      3. Next come the box lines, each starting with `- `. The attached plan file's
         stage nodes hold the boxes: every task in a stage's `data.tasks` lanes is a box,
         the stage's `data.label` is its stage name, and the task's `displayName` is its
         label (with the bracketed kind and any trailing ` → <variable>`, which belongs
         to the label). Every box has exactly one line, stage by stage in the order the
         stages appear in the file's `nodes` list. Each line is `- ` + the stage name +
         ` / ` + the box label spelled exactly as the file spells it + `: ` + the box's
         status. The status is one of: `<resource> in <folder>`; `<A> in <folder> or <B>
         in <folder>, which one? Build it takes the first` (a row with no folder drops
         ` in <folder>`); `none yet, create it or name one`; `not checked`; `no resource
         needed`. A line with no status, a reworded or shortened label, a missing, extra
         or out-of-order box, or a line for a trigger, a stage on its own, a rule or the
         case's completion fails this item. Each line is one short clause under about
         200 characters, except that the which-of-two status written exactly as above is
         one status and may exceed that length. No file is attached: judge this item on the lines alone. Each line must name one task
         of the case, spelled with a bracketed kind, and the lines must not repeat a task.
      4. Next is exactly the line `Is this the case you want?`.
      5. Then exactly three numbered options, in this order: `1.` Build it, `2.`
         Change it, `3.` Keep it, each with any short description. Nothing follows
         the third option.
      6. No other line exists anywhere in the graded text, and nothing comes before
         item 1's line: when the graded text is a `[RESULT - ...]` block, its first
         non-blank line must be item 1's line. No status or progress sentence (for
         example "Valid", "Lookups complete", "Here is the outline"), no `---`
         separator, no heading, no code block or drawn diagram, no step log, no line
         explaining a stage's entry or exit rule or a variable, no table.

      Score 1.0 only if every item holds; otherwise 0.0. In findings, list each
      failed item by number and quote the offending line.

  - type: command_not_executed
    description: "Every resource lookup is filtered with --search or an --output-filter (contains() or a [? JMESPath filter)"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+(?:solution\s+resources\s+list|is\s+connections\s+list|df\s+entities\s+list|ixp\s+projects\s+list)\b(?!(?:\\\n|(?<= )\n|(?!\n|(?:^|[\s;&|(`])(?:uip|\$UIP)\s).)*(?:--search|contains\(|\[\?))'
    weight: 1.0
    pass_threshold: 1.0

  - type: llm_judge
    description: "Turn 2 answers Build it with the final report in draft mode, in its template, and asks the user nothing"
    include_reference: false
    include_dialog: true
    max_dialog_chars: 200000
    max_file_chars: 60000
    weight: 3.0
    pass_threshold: 1.0
    prompt: |
      You check the dialog after the user approved an outline with Build it. Grade
      format and conduct only, never the case design.

      First, Turn 2's USER message must pick the first option (`1` or "Build it"). If
      it does not, score 0.0 and say the simulated user did not approve.

      WHICH TEXT TO GRADE. The Turn 2 agent text holds every message the agent sent in this turn.
      If it contains a `[RESULT - ...]` marker, grade the text after the LAST such
      marker: that is the final message, whole. Otherwise the messages are joined,
      possibly with no separator: grade the text from the LAST occurrence of
      `ReturnWindow: built` (markdown emphasis around the name allowed) to the end, and ignore
      what comes before it. If the phrase does not occur at all, item 1 fails.
      The graded text is the agent's reply only. Your own judging instructions that
      follow it (the request to call `submit_verdict`) are not part of it: never
      count them as a line after the last item or anywhere else.

      Ignore blank lines and markdown emphasis (`**`, `*`). Check every item:

      1. The Turn 2 agent text ends with the report. Its first line starts with
         `ReturnWindow: built, validated` (or `ReturnWindow: built, not runnable yet` when a
         tenant resource is missing), then optionally `, uploaded` (never in Studio
         Web, where nothing is uploaded) and optionally `, run`, then `(draft
         mode).` The word `auto` never appears in the mode. After the mode, the same
         line may hold at most one more sentence.
      2. The second line is, as plain text and nothing else, an `https://` link or
         a path ending in `caseplan.case` or `caseplan.json` (in Studio Web, such as
         `/solution/<Project>/caseplan.case`). Backticks around the path, or a
         Markdown link around a local path, fail this item.
      3. Then at most five lines starting with `- `, each one short change in plain
         words. A sixth such line fails this item.
      4. Then optionally `Needs:`, `Assumed:` and `Unverified:` lines, in that order
         (each on its own line, or the last two on one line), and nothing after them.
      5. No other line exists anywhere in the graded text: no heading, no table, no
         numbered list, no code block, no `---` separator, no status or validation
         line (for example "Validation: passed"), no question to the user (no line
         ending in `?`), and no suggested next step (for example "Want me to upload
         it?"). The one sentence item 1 allows after the mode is part of that line,
         whatever it says: never fail item 5 for it.
      6. The agent asked the user nothing between their approval and this report:
         Turn 2 is the last turn, or every later turn's agent text asks nothing and
         the report was already complete in Turn 2.

      Score 1.0 only if every item holds; otherwise 0.0. In findings, list each
      failed item by number and quote the offending line.

  - type: run_command
    description: "The built case validates and holds built tasks"
    command: "python3 $REFERENCE_DIR/draft/check_draft_word_build.py"
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "Build it replaced every blank box with the real task and dropped the [Kind] suffix"
    command: "python3 $REFERENCE_DIR/_shared/check_no_blank_boxes.py"
    timeout: 60
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  # The upload command differs by harness (Studio Web has none), so this is advisory.
  - type: command_executed
    description: "Claude CLI harness only: the agent uploaded the outline to Studio Web"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+solution\s+upload\b'
    min_count: 1
    weight: 0
    pass_threshold: 0

post_run:
  - command: "python3 _setup/cleanup_solutions.py"
    timeout: 120
