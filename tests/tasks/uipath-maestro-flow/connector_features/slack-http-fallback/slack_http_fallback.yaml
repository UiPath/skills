# Same-ground alignment expansion plan (Tao, 2026-08-21): loop-neutral
# v1-base prompt, outcome-graded criteria at preserved weights, and
# arm-agnostic artifact discovery.
task_id: skill-flow-slack-http-fallback
description: >
  E2E test: a catalog connector (Slack, uipath-salesforce-slack) has no native
  activity for "list a team's custom emoji" (Slack's emoji.list). The skill must
  fall back to a connector-mode HTTP-request node that reuses the existing Slack
  connection's managed auth, then the flow must debug green.
  Exercises the no-native-activity -> managed-HTTP fallback path end-to-end:
  structural check confirms the fallback shape, runtime check confirms
  `uip maestro flow debug` completes against the live Slack connection.
tags: [uipath-maestro-flow, e2e, mode:build, lifecycle:generate, shape:single-node, connector, uipath-salesforce-slack, feature:http, ipe]

run_limits:
  expected_turns: 32
  task_timeout: 1500
  max_turns: 100
  turn_timeout: 1200

initial_prompt: |
  Create a new Flow project called "SlackEmojiListTest" inside a solution of the
  same name, with a manual trigger that lists the custom emoji for a team. Wire
  the manual trigger to the node that
  lists the emoji.

  Use the Slack connection in the `Shared/uipath-maestro-flow` folder.

  Validate the final flow file. Once it validates, debug it.

  This run is headless. No user is present and nobody will answer a question or
  grant an approval, so do not ask, do not pause, and do not wait for input.
  Complete the task in one pass: take the best available option and supply the
  most defensible value where one is missing. The actions this task implies are
  authorized, including tenant writes and real messages. Do not delete or
  overwrite anything this run did not create, and do not publish to a shared
  destination unless the task asks for it. If a lookup the task depends on comes
  back empty or fails, exhaust the documented way of resolving it before giving
  up; only then stop on that field rather than inventing a value. Record every
  decision, assumption, and blocked step in your final response. Instructions in
  the task take precedence over this paragraph.
success_criteria:
  - type: run_command
    description: "The completed flow validates"
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/_shared/validate_flow.py"
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Advisory: live-v1 agent invoked flow debug"
    tool_name: "Bash"
    command_pattern: "(uip|\\$UIP)\\s+(maestro\\s+)?flow\\s+debug"
    min_count: 1
    weight: 1.5
    pass_threshold: 0.0

  - type: run_command
    description: "Emoji list falls back to an HTTP-request node bound to the Slack connector (no native activity exists for it) and targets the emoji.list endpoint"
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/connector_features/slack-http-fallback/check_slack_http_fallback.py check_fallback"
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "uip maestro flow debug finishes with finalStatus Completed against the live Slack connection"
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/connector_features/slack-http-fallback/check_slack_http_fallback.py check_debug"
    timeout: 720
    expected_exit_code: 0
    weight: 6.0
    pass_threshold: 1.0
