task_id: skill-flow-datafabric-scheduled-poll-lifecycle
description: >
  Integration coverage for the Data Fabric scheduled-poll substitute. Data
  Fabric ships no connector trigger node in the Maestro Flow registry, so a
  scheduled trigger is the only event-shaped start; this grades that start plus
  Data Service connector Query/Get/Delete wiring, date filters, record limits,
  chained record-id bindings, and the correct entity on every graded activity.
tags: [uipath-maestro-flow, integration, mode:build, lifecycle:generate, shape:multi-node, connector, node:scheduled-trigger, feature:trigger, feature:records, feature:entities, feature:activities, uipath-uipath-dataservice]
sandbox:
  template_sources:
    - type: template_dir
      path: ../../_setup
      mount_point: _setup
    - type: template_dir
      path: _setup
      mount_point: _setup
run_limits:
  max_turns: 120
  expected_turns: 80
  turn_timeout: 2400
  task_timeout: 3600

reference:
  directory: .

pre_run:
  - command: 'python3 "_setup/preflight_connections.py" uipath-uipath-dataservice'
    timeout: 120
  - command: 'python3 "_setup/ensure_entity.py" "_setup/contract_registry.entity.json"'
    timeout: 60

initial_prompt: |
  Build this with the UiPath Data Service connector activities
  (`uipath.connector.uipath-uipath-dataservice.*`) for every entity operation —
  not the native `core.datafabric.*` nodes.

  Create a new solution named DataFabricPollingRegression containing two Flow
  projects using the configured UiPath Data Fabric connection. Both flows run on
  a schedule; neither is started by hand.

  Flow 1: ContractRegistryDuePolling
  - Start it on a scheduled trigger.
  - Add Query Entity Records on ContractRegistry with a dueDate < 2026-08-04
    filter and a maximum of 100 records.

  Flow 2: FileUploadVerifyPollGetDelete
  - Start it on a scheduled trigger.
  - Add Query Entity Records on the FileUploadVerify_20260618 entity, capped at
    one record.
  - Get the entity record by ID using the Id from that query's output.
  - Delete the same record using the Id from the Get output.

  For both flows, keep the configured connection and correct entity on every
  Data Fabric activity.

  Validate every final flow file.

  This run is headless. No user is present and nobody will answer a question or
  grant an approval, so do not ask, do not pause, and do not wait for input.
  Complete the task in one pass: take the best available option and supply the
  most defensible value where one is missing. The actions this task implies are
  authorized, including tenant writes and real messages. Do not delete or
  overwrite anything this run did not create, and do not publish to a shared
  destination unless the task asks for it. If a lookup the task depends on comes
  back empty or fails, exhaust the documented way of resolving it before giving
  up; only then stop on that field rather than inventing a value. Record every
  decision, assumption, and blocked step in your final response. Instructions in
  the task take precedence over this paragraph.
success_criteria:
  - type: run_command
    description: "Final .flow passes `uip maestro flow validate`"
    command: 'set -e; flows=$(find . -maxdepth 6 -name "*.flow"); [ -n "$flows" ] || exit 1; for f in $flows; do uip maestro flow validate "$f" --output json | python3 -c "import json,sys; sys.exit(0 if json.load(sys.stdin)[\"Result\"]==\"Success\" else 1)"; done'
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "Both flows start on a scheduled trigger and carry filtered, chained, entity-bound Data Fabric activities"
    command: "python3 $REFERENCE_DIR/check_scheduled_poll_lifecycle.py"
    timeout: 30
    expected_exit_code: 0
    weight: 6.0
    pass_threshold: 1.0
