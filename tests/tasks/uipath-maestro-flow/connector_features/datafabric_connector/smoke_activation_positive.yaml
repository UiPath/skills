task_id: skill-flow-datafabric-smoke-activation-positive
description: >
  Activation smoke: representative Data Fabric prompt routes to the
  uipath-maestro-flow skill.
tags: [uipath-maestro-flow, smoke, mode:build, lifecycle:discover]

sandbox:
  template_sources:
    - type: template_dir
      path: _setup
      mount_point: _setup
run_limits:
  max_turns: 25

reference:
  directory: .

# The prompt names a real entity, created idempotently here, so both arms
# resolve it. It used to name `ProductCatalog`, which the tenant does not have:
# one arm stopped blocked and the other built against the look-alike
# `ProductCatalogue`, and the pair's agent-time delta measured that choice.
pre_run:
  - command: 'python3 "_setup/ensure_entity.py" "_setup/flow_code_eval_entity.entity.json"'
    timeout: 60

initial_prompt: |
  I need to create a record in my DataFabric entity from a UiPath Flow.
  The entity is called FlowCodeEvalEntity — build the Flow that does it.

  This run is headless. No user is present and nobody will answer a question or
  grant an approval, so do not ask, do not pause, and do not wait for input.
  Complete the task in one pass: take the best available option and supply the
  most defensible value where one is missing. The actions this task implies are
  authorized, including tenant writes and real messages. Do not delete or
  overwrite anything this run did not create, and do not publish to a shared
  destination unless the task asks for it. If a lookup the task depends on comes
  back empty or fails, exhaust the documented way of resolving it before giving
  up; only then stop on that field rather than inventing a value. Record every
  decision, assumption, and blocked step in your final response. Instructions in
  the task take precedence over this paragraph.
success_criteria:
  - type: skill_triggered
    description: "Advisory: uipath-maestro-flow activates for a DataFabric-in-Flow prompt"
    skill_name: uipath-maestro-flow
    expected_skill: uipath-maestro-flow
    weight: 3.0
    pass_threshold: 0.0
    stop_early:
      on_pass: stop
