task_id: skill-flow-datafabric-smoke-create-all-types
description: >
  Smoke: DF Create node on FlowCodeEvalEntity binds all 8 supported field
  types (STRING, MULTILINE_TEXT, DECIMAL, INTEGER, BOOLEAN, DATE, DATETIME,
  UUID) with correct JSON literal shapes. Static-validate only; runtime
  `flow debug` skipped to avoid live tenant side effects. Full CRUD /
  negative-path coverage lives in e2e_contract_intake_pipeline.
tags: [uipath-maestro-flow, smoke, mode:build, lifecycle:generate, shape:single-node, connector, uipath-uipath-dataservice]

run_limits:
  max_turns: 100
  turn_timeout: 1800
  task_timeout: 3600

pre_run:
  - command: 'python3 "$SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/connector_features/datafabric_connector/ensure_entity.py" "$SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/connector_features/datafabric_connector/flow_code_eval_entity.entity.json"'
    timeout: 60

initial_prompt: |
  I'm adding a record to the FlowCodeEvalEntity entity from my UiPath Flow and
  want to fill in all the different field types we support. Build a Flow with
  a single Data Fabric Create node that creates a record with these values:

  * title: "AllTypesTest-Smoke" (STRING)
  * description: "A sci-fi smoke test record covering all supported field types. A must-watch film." (MULTILINE_TEXT)
  * score: 7.25 (DECIMAL)
  * viewCount: 350 (INTEGER)
  * active: true (BOOLEAN)
  * releaseDate: "2024-03-10" (DATE)
  * lastUpdated: "2024-03-10T09:00:00" (DATETIME)
  * externalId: "aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee" (UUID)

  The Flow is not complete until `uip maestro flow validate` passes.

  This run is headless. No user is present and nobody will answer a question or
  grant an approval, so do not ask, do not pause, and do not wait for input.
  Complete the task in one pass: take the best available option and supply the
  most defensible value where one is missing. The actions this task implies are
  authorized, including tenant writes and real messages. Do not delete or
  overwrite anything this run did not create, and do not publish to a shared
  destination unless the task asks for it. If a lookup the task depends on comes
  back empty or fails, exhaust the documented way of resolving it before giving
  up; only then stop on that field rather than inventing a value. Record every
  decision, assumption, and blocked step in your final response.
success_criteria:
  - type: run_command
    description: "Final .flow passes `uip maestro flow validate`"
    command: 'for f in $(find . -maxdepth 6 -name "*.flow"); do uip maestro flow validate "$f" --output json | python3 -c "import json,sys; sys.exit(0 if json.load(sys.stdin)[\"Result\"]==\"Success\" else 1)" && exit 0; done; exit 1'
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "Create body covers all 8 field types with correct JSON literal shapes (or =js: expression bindings)"
    command: "python3 $TASK_DIR/check_smoke_create_all_types.py"
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0
