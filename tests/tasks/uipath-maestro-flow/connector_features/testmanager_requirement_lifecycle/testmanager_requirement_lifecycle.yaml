# skip:true, tenant-gated. CONFIRMED available in Maestro Flow (2026-06-16):
# `uip maestro flow registry pull` then search returns the
# uipath.connector.uipath-uipath-testmanager.<op> nodes for this object group. A stale manifest
# returns 0 — the agent MUST run `registry pull` first. Same manifest backs
# Maestro BPMN. skip:true: agent-reliability-gated (multi-node build + debug flakes on turns/rate-limits). The codereval TM connection now exists.
task_id: skill-flow-testmanager-requirement-lifecycle
description: >
  Coverage (Maestro Flow connector): agent uses the uipath-maestro-flow skill to
  build a Flow that uses every UiPath Test Manager connector node for the
  Requirement group — adding one connector node per operation. Drives
  `registry pull` -> `registry search`/`get` -> `node add` -> `flow validate`.
  Graded on those commands plus the produced .flow referencing each
  uipath.connector.uipath-uipath-testmanager.* node type.
tags: [uipath-maestro-flow, e2e, mode:build, lifecycle:generate, shape:multi-node, connector]
skip: true

run_limits:
  task_timeout: 3000
  max_turns: 60
  turn_timeout: 1200

initial_prompt: |
  Build a Maestro Flow (inside a solution of the same name) that uses the UiPath Test Manager Integration Service connector to exercise the full operation set — perform each of these:

  - Create a requirement
  - Get the requirement
  - Update the requirement
  - Delete the requirement
  - Assign test cases to the requirement
  - List the test cases assigned to the requirement

  The task is not complete until validation passed for the flow.

  This run is headless. No user is present and nobody will answer a question or
  grant an approval, so do not ask, do not pause, and do not wait for input.
  Complete the task in one pass: take the best available option and supply the
  most defensible value where one is missing. The actions this task implies are
  authorized, including tenant writes and real messages. Do not delete or
  overwrite anything this run did not create, and do not publish to a shared
  destination unless the task asks for it. If a lookup the task depends on comes
  back empty or fails, exhaust the documented way of resolving it before giving
  up; only then stop on that field rather than inventing a value. Record every
  decision, assumption, and blocked step in your final response.
success_criteria:
  - type: command_executed
    description: "Agent refreshed the node manifest (`uip maestro flow registry pull`) before searching"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+flow\s+registry\s+pull'
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent added connector nodes to the flow (`uip maestro flow node add`)"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+flow\s+node\s+add'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent validated the flow (`uip maestro flow validate`)"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+flow\s+validate'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "Produced .flow references every Requirement connector node type (6 nodes)"
    command: 'for n in create-requirement get-requirement update-requirement delete-requirement assign-test-cases-to-requirement get-assigned-test-cases-for-req; do grep -rqsF "uipath-uipath-testmanager.$n" --include="*.flow" . || { echo "missing node $n"; exit 1; }; done'
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
