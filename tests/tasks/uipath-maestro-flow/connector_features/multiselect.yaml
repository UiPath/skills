# Same-ground alignment expansion plan (Tao, 2026-08-21): loop-neutral
# v1-base prompt, outcome-graded criteria at preserved weights, and
# arm-agnostic artifact discovery.
task_id: skill-flow-ipe-multiselect
description: >
  Tests the multiselect IS feature — configures a Slack group direct message
  node whose members field takes multiple values, using an existing tenant
  connection.
tags: [uipath-maestro-flow, integration, lifecycle:generate, shape:single-node, connector, ipe, mode:build, uipath-salesforce-slack]

run_limits:
  expected_turns: 37
  task_timeout: 1500
  max_turns: 120
  turn_timeout: 1200

reference:
  directory: ..

# Each recipient must match exactly ONE Slack user, exact case, on the
# connection the prompt names (Shared/uipath-maestro-flow = connection
# 849e85d8-1aa9-4d52-8bbd-20041c8f05d8), or the 3-entry check below cannot
# pass. The match is exact and case-sensitive: `prepare --resolve` does not
# match "E2E-testing" to "E2E-Testing".
#
# Verified 2026-09-23 on that connection: curated_users holds 48 users
# (HasMore false), and each name below matches exactly one of them:
#   "Coder Evals"             profile.real_name  -> U0BAW1WQT0F
#   IS-sandboxes@uipath.com   profile.email      -> U02EBQA5AD9
#   "E2E-Testing"             profile.real_name  -> U0A1U64L5EG
# IS-sandboxes@uipath.com has real_name "wxpadzgv Sandboxes", so it resolves
# by e-mail only.
#
# Do not take names from another Slack connection. #3393's evidence (5989
# users, "Coder Eval Test", "E2E Nightly Summary") came from 2bbc2253, the
# tenant's default connection in folder Shared, which is a different
# workspace. Neither name exists on 849e85d8.
#
# 849e85d8 is a bring-your-own-account connection. If it is re-pointed to
# another workspace, these names break again. Re-verify before changing a
# name, or after the connection changes (read-only):
#   uip is resources run list uipath-salesforce-slack curated_users \
#     --connection-id 849e85d8-1aa9-4d52-8bbd-20041c8f05d8 --output json
initial_prompt: |
  Create a flow file to create a Slack group direct message between
  Coder Evals, IS-sandboxes@uipath.com and E2E-Testing.
  Do NOT use any activity or node marked 'beta'. Use the non-beta Slack activity.
  Use the connection present in Shared/uipath-maestro-flow.

  This run is headless. No user is present and nobody will answer a question or
  grant an approval, so do not ask, do not pause, and do not wait for input.
  Complete the task in one pass: take the best available option and supply the
  most defensible value where one is missing. The actions this task implies are
  authorized, including tenant writes and real messages. Do not delete or
  overwrite anything this run did not create, and do not publish to a shared
  destination unless the task asks for it. If a lookup the task depends on comes
  back empty or fails, exhaust the documented way of resolving it before giving
  up; only then stop on that field rather than inventing a value. Record every
  decision, assumption, and blocked step in your final response. Instructions in
  the task take precedence over this paragraph.
success_criteria:
  # Name-agnostic: the prompt doesn't fix a project name.
  - type: run_command
    description: "A .flow file exists and is valid JSON with nodes and edges"
    command: "python3 $REFERENCE_DIR/_shared/flow_contains.py '\"nodes\"' '\"edges\"'"
    timeout: 10
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 1.0

  # Core check: Slack connector node present and the users multiselect
  # field has exactly 3 entries (the three group-DM recipients).
  - type: run_command
    description: "Slack group-DM node present with 3 entries in the users multiselect"
    command: "python3 $REFERENCE_DIR/connector_features/check_multiselect_flow.py"
    timeout: 15
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "The completed flow validates"
    command: "python3 $REFERENCE_DIR/_shared/validate_flow.py"
    timeout: 180
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0
