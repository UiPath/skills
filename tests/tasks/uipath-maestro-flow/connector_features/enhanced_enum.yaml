# Same-ground alignment expansion plan (Tao, 2026-08-21): loop-neutral
# v1-base prompt, outcome-graded criteria at preserved weights, and
# arm-agnostic artifact discovery.
# See workspaces/docs/flow-sdk/2026-08-21-maestro-flow-alignment-expansion-plan.md.
task_id: skill-flow-ipe-enhanced-enum
description: >
  Tests the enhanced enum IS feature — configures a connector node with an
  enhanced enum field with display labels on the WooCommerce connector.
tags: [uipath-maestro-flow, integration, lifecycle:generate, shape:multi-node, connector, uipath-automaticc-woocommerce, ipe, mode:build]

run_limits:
  expected_turns: 35
  task_timeout: 1500
  max_turns: 120
  turn_timeout: 1200

initial_prompt: |
  Create a new Flow project called "EnhancedEnumTest" with a manual trigger. 
  Build a flow that retrieves WooCommerce product reviews and lets the caller 
  choose whether they come back oldest-first or newest-first, picking from friendly 
  labels rather than raw codes. Discover the get-product-reviews operation and set 
  its sort-order field. Compile the final flow file.
  If the WooCommerce operation exists in the registry but the tenant has no
  live connection, keep the real WooCommerce operation node with its inputs left unset
  and stop there. Do not fabricate a tenant connection merely to make product
  validation pass; the connector shape is the deliverable in this offline task.

success_criteria:
  - type: run_command
    description: "Flow file exists and is valid JSON"
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/_shared/flow_contains.py --flow-name EnhancedEnumTest '\"nodes\"' '\"edges\"'"
    timeout: 10
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "Flow has a connector node referencing uipath-automattic-woocommerce"
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/_shared/flow_contains.py --flow-name EnhancedEnumTest 'uipath-automattic-woocommerce'"
    timeout: 10
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
