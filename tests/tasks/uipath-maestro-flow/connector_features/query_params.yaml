# Same-ground alignment expansion plan (Tao, 2026-08-21): loop-neutral
# v1-base prompt, outcome-graded criteria at preserved weights, and
# arm-agnostic artifact discovery.
task_id: skill-flow-ipe-query-params
description: >
  Tests the query parameters IS feature — configures a connector node with a
  query parameter on the Google Tasks connector.
tags: [uipath-maestro-flow, integration, lifecycle:generate, shape:multi-node, connector, uipath-google-tasks, ipe, mode:build]

run_limits:
  expected_turns: 43
  task_timeout: 1500
  max_turns: 120
  turn_timeout: 1200

initial_prompt: |
  Create a new Flow project called "QueryParamsTest" with a manual trigger.
  You need a flow that lists all Google Tasks including hidden ones. Discover
  the right Google Tasks list operation and set its "show hidden" query
  parameter so hidden tasks are returned.
  Validate the final flow file.
  If the Google Tasks connector operation is not present in the registry, use
  a managed HTTP fallback through the generic `uipath-uipath-http` connector
  for the same REST call and finish after validation.
  Do not keep searching for a connector node that the registry does not expose.

success_criteria:
  - type: run_command
    description: "Flow file exists and is valid JSON"
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/_shared/flow_contains.py --flow-name QueryParamsTest '\"nodes\"' '\"edges\"'"
    timeout: 10
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "Flow uses Google Tasks connector or task-specific managed HTTP fallback"
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/connector_features/check_managed_http_fallback.py '**/QueryParamsTest*.flow' uipath-google-tasks query_params"
    timeout: 10
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "The completed flow validates"
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/_shared/validate_flow.py"
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0
