# Same-ground alignment expansion plan (Tao, 2026-08-21): loop-neutral
# v1-base prompt, outcome-graded criteria at preserved weights, and
# arm-agnostic artifact discovery.
# See workspaces/docs/flow-sdk/2026-08-21-maestro-flow-alignment-expansion-plan.md.
task_id: skill-flow-ipe-dtl-load-by-default-true
description: >
  Tests the DTL loadByDefault=true IS feature — configures a Jira Get Issue
  connector node whose Project and Issue Type dropdowns are pre-populated
  (loadByDefault=true), requiring the agent to resolve and pre-select the first
  available project and issue type into customFieldsRequestDetails.
tags: [uipath-maestro-flow, integration, lifecycle:generate, shape:multi-node, connector, uipath-atlassian-jira, ipe, mode:build]

run_limits:
  expected_turns: 40
  task_timeout: 1500
  max_turns: 120
  turn_timeout: 1200

initial_prompt: |
  Create a new Flow project called "DTLLoadByDefaultTrueTest" with a manual trigger.
  You need a flow that fetches Jira ticket ENGCE-00000. Select the first project and issue type available.
  Validate the final flow file.
  Use the connection present in Shared/uipath-maestro-flow.

success_criteria:
  - type: run_command
    description: "Flow file exists and is valid JSON"
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/_shared/flow_contains.py --flow-name DTLLoadByDefaultTrueTest '\"nodes\"' '\"edges\"'"
    timeout: 10
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "Flow has a Jira Get Issue connector node referencing uipath-atlassian-jira"
    command: "python3 -c \"import json,glob; flows=glob.glob('**/DTLLoadByDefaultTrueTest*.flow',recursive=True); assert flows; content=open(flows[0]).read(); assert 'uipath-atlassian-jira' in content, 'Jira connector key not found'; f=json.load(open(flows[0])); assert any(n.get('type','').startswith('uipath.connector.uipath-atlassian-jira.get-issue') for n in f['nodes']), 'No Jira Get Issue node'; print('OK: Jira get-issue node present')\""
    timeout: 10
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "DTL loadByDefault feature: issue key set and first project + issue type pre-selected in queryParameters AND customFieldsRequestDetails (matching values)"
    command: "python3 $TASK_DIR/check_dtl_load_by_default.py"
    timeout: 10
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "The completed flow validates"
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/_shared/validate_flow.py"
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0
