task_id: skill-flow-ipe-generate-schema
description: >
  Tests the GenerateSchema IS feature — configures the Atlassian Jira
  "Create Issue" connector node so that customFieldsRequestDetails captures
  the parent values (project key + issue type id) that drive the schema
  fetch, and bodyParameters carries the required fields.summary value.
tags: [uipath-platform, integration, lifecycle:generate, shape:multi-node, connector, uipath-atlassian-jira, ipe, mode:build]

run_limits:
  expected_turns: 39
  task_timeout: 1500
  max_turns: 120
  turn_timeout: 1200

initial_prompt: |
  Create a new Flow project called "GenerateSchemaTest" with a manual trigger
  that runs the Atlassian Jira "Create Issue" connector activity
  Pick any Jira project + issue type combination and set a static summary
  string.
  Validate the final flow file.
  Use the connection present in Shared/uipath-maestro-flow.
  If the Atlassian Jira connector isn't available in your registry, 
  stop rather than falling back to a generic HTTP request.

  This run is headless. No user is present and nobody will answer a question or
  grant an approval, so do not ask, do not pause, and do not wait for input.
  Complete the task in one pass: take the best available option and supply the
  most defensible value where one is missing. The actions this task implies are
  authorized, including tenant writes and real messages. Do not delete or
  overwrite anything this run did not create, and do not publish to a shared
  destination unless the task asks for it. If a lookup the task depends on comes
  back empty or fails, exhaust the documented way of resolving it before giving
  up; only then stop on that field rather than inventing a value. Record every
  decision, assumption, and blocked step in your final response. Instructions in
  the task take precedence over this paragraph.
success_criteria:
  - type: run_command
    description: "Flow is valid JSON with Jira Create Issue node, customFieldsRequestDetails has both parent-field tuples under GenerateSchema, and bodyParameters carries a non-empty fields.summary"
    command: "python3 $TASK_DIR/check_generate_schema.py"
    timeout: 30
    expected_exit_code: 0
    weight: 10.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Parent-field-driven describe (Step 3a) was called to fetch GenerateSchema custom fields"
    tool_name: "Bash"
    command_pattern: "(uip|\\$UIP)\\s+is\\s+resources\\s+describe.+(-f|--field)[=\\s]+[\"']?fields\\.project\\.key"
    min_count: 1
    weight: 3.0
    pass_threshold: 0.0  # advisory: the SDK persists the same schema without this CLI command

  - type: run_command
    description: "Persisted Flow artifact passes CLI validation"
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/_shared/validate_flow.py"
    timeout: 60
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0
