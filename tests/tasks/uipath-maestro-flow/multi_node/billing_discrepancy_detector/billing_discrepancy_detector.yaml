task_id: skill-flow-devcon-billing-discrepancy-detector
description: |
  E2E greenfield (DevCon BillingDisputeResolution scenario): build a Flow that
  queries the BillingDisputeERP and BillingDisputeCRM entities in parallel and
  computes an invoice overcharge, asked the way a Studio Web user would ask it.
  The grader runs the flow once under debug against seeded tenant data and
  checks what the run did: the ERP and CRM queries and their merge each
  completed, and the four named outputs carry the live values. It also checks
  that the agent ran its own test run, as the request asks. Text between the
  helper markers is lower-tier guidance (experiments/use-case-tiers.yaml) and
  is not graded.
tags:
  - uipath-maestro-flow
  - e2e
  - mode:build
  - lifecycle:execute
  - shape:multi-node
  - connector
  - path-to-ga
  - outcome-graded
sandbox:
  template_sources:
    - type: template_dir
      path: ../../_setup
      mount_point: _setup
run_limits:
  max_turns: 120
  turn_timeout: 2400
  task_timeout: 3600
reference:
  directory: ../..

post_run:
  - command: python3 _setup/cleanup_solutions.py
    timeout: 90
initial_prompt: |
  You are a coding agent in UiPath Studio Web in an empty Flow project. No user
  is present, and nobody will answer a question or grant approval, so do not
  ask, do not pause, and do not wait for input.

  Build an automation called "BillingDiscrepancyDetector" that checks a
  disputed invoice line against the contracted amount and pulls the customer's
  account tier.

  - Inputs are the trigger variables: invoiceNumber, accountNumber,
    disputedLineNumber, disputedUnitPrice, disputedQuantity.
  - Invoice and customer information can be found in Data Services:
    - BillingDisputeERP has records for each invoice number; each with line
      number and contracted amount.
    - BillingDisputeCRM holds rows for account numbers, and it has the account
      tier. You should query the two databases in parallel.

  How to compute the disputed amount: invoiced = `disputedUnitPrice` x
  `disputedQuantity`; contracted = the `amount` of the ERP row whose
  `lineNumber` equals `disputedLineNumber`; `totalOvercharge` = invoiced minus
  contracted when positive, otherwise 0; `discrepancyCount` = 1 when overcharge
  is positive, else 0.

  - Outputs: totalOvercharge, discrepancyCount, matchedInvoiceNumber,
    accountTier

  <!-- helper:start -->
  disputedLineNumber, disputedUnitPrice and disputedQuantity are numbers.
  <!-- helper:end -->

  Build and do a test run of the automation.
pre_run:
  - command: 'python3 "_setup/preflight_connections.py" uipath-uipath-dataservice'
    timeout: 120

success_criteria:
  - type: run_command
    description: uip maestro flow validate passes on the flow file
    command: python3 $REFERENCE_DIR/_shared/validate_flow.py
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
  # Advisory: Studio Web agents may test with the RunProject proxy tool instead,
  # which the eval testbench stubs, and its CLI debug cannot attach a file input.
  - type: command_executed
    description: 'Advisory: the agent ran its own test run (uip maestro flow debug), as the request asks'
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+flow\s+debug(?!-instances)(?!\s+--help)'
    min_count: 1
    weight: 1.0
    pass_threshold: 0.0
  - type: run_command
    description: 'Effects: one debug run in which the ERP query, the CRM query and their merge each completed, and the named outputs are totalOvercharge=1610, discrepancyCount=1, matchedInvoiceNumber=MCS-2026-04872, accountTier=Enterprise'
    command: python3 $REFERENCE_DIR/multi_node/billing_discrepancy_detector/check_billing_discrepancy_detector.py
    timeout: 600
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0
  - type: run_command
    description: 'Advisory: generated bindings exist and carry no stub UUIDs'
    command: python3 $REFERENCE_DIR/_shared/check_bindings_no_stubs.py
    timeout: 30
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 0.0
  - type: run_command
    description: 'Advisory: STRUCTURAL (covering): two DS queries (ERP + CRM) on MUTUALLY UNREACHABLE branches from the trigger, converging on one bpmn:ParallelGateway merge that continues downstream; each filter computed from its own input; no answer literals; each output read from its own side'
    command: python3 $REFERENCE_DIR/_shared/advisory_billing_discrepancy_detector.py
    timeout: 30
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 0.0
