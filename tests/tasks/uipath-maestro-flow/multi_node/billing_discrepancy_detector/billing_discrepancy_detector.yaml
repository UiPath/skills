# Same-ground campaign contract (Tao, 2026-08-10): loop-neutral v1-base
# prompt; v1-weighted intersection criteria plus report-only offline advisories;
# paired limit envelope. Cross-arm parity is enforced by the sync gate.
task_id: skill-flow-devcon-billing-discrepancy-detector
description: |
  E2E greenfield (DevCon BillingDisputeResolution scenario): build a Flow that queries the BillingDisputeERP and BillingDisputeCRM entities as parallel branches joined by a merge, then computes an invoice overcharge; graded by validate plus one flow debug run against seeded tenant data.
tags:
- uipath-maestro-flow
- e2e
- mode:build
- lifecycle:execute
- shape:multi-node
- connector
- path-to-ga
run_limits:
  max_turns: 120
  turn_timeout: 2400
  task_timeout: 3600
post_run:
- command: python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/_shared/cleanup_solutions.py
  timeout: 90
initial_prompt: |
  Build a Maestro Flow "BillingDiscrepancyDetector" (in a solution of the same
  name) that checks a disputed invoice line against the contracted amount and
  pulls the customer's account tier.

  - Inputs: trigger variables `invoiceNumber` (string), `accountNumber`
    (string), `disputedLineNumber` (number), `disputedUnitPrice` (number),
    `disputedQuantity` (number).
  - Look up two existing Data Service entities:
      - `BillingDisputeERP` — rows for `invoiceNumber`; each has a `lineNumber`
        and contracted `amount`.
      - `BillingDisputeCRM` — the account row for `accountNumber`; it has an
        `accountTier`.
  - The two lookups are independent. Run them as parallel branches that fan out
    from the trigger and rejoin at a merge before the End node computes the
    result — do not chain them one after the other.
  - Compute: invoiced = `disputedUnitPrice` x `disputedQuantity`; contracted =
    the `amount` of the ERP row whose `lineNumber` equals `disputedLineNumber`;
    `totalOvercharge` = invoiced minus contracted when positive, else 0;
    `discrepancyCount` = 1 when overcharge is positive, else 0.
  - Outputs: `totalOvercharge` (number), `discrepancyCount` (number),
    `matchedInvoiceNumber` (string, first ERP row), `accountTier` (string, from
    CRM).

  Validate the final flow file — the task is not complete until `uip maestro
  flow validate` passes. Grading then runs the flow under debug against live
  tenant data, so build it to actually run, not merely validate.

  Build the complete flow
  without stopping to ask me.
success_criteria:
- type: run_command
  description: uip maestro flow validate passes on the flow file
  command: python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/_shared/validate_flow.py
  timeout: 30
  expected_exit_code: 0
  weight: 3.0
  pass_threshold: 1.0
- type: run_command
  description: Check requires a merge node (parallel branches) and debugs once; flow computed overcharge=1610, count=1, invoice MCS-2026-04872, tier Enterprise
  command: python3 $TASK_DIR/check_billing_discrepancy_detector.py
  timeout: 300
  expected_exit_code: 0
  weight: 5.0
  pass_threshold: 1.0
- type: run_command
  description: 'Advisory: bindings.json exists and carries no stub UUIDs'
  command: |
    python3 -c "
    import json, re
    b = json.load(open('bindings.json'))
    def is_stub(v):
        s = str(v or '').strip()
        return (not s) or bool(re.match(r'^0{8}-0{4}-0{4}-0{4}-', s)) or (s.startswith('<') and s.endswith('>'))
    entries = b.get('bindings') or []
    assert entries, 'bindings.json declares no bindings at all'
    stubs = [e for e in entries if is_stub(e.get('resourceKey')) and is_stub(e.get('default'))]
    assert not stubs, f'stub or empty bindings: {[e.get(\"id\") for e in stubs]}'
    print(f'{len(entries)} bindings, all populated with non-stub UUIDs')
    "
  timeout: 30
  expected_exit_code: 0
  weight: 1.0
  pass_threshold: 0.0
- type: run_command
  description: 'Advisory: STRUCTURAL (covering): two DS queries (ERP + CRM) on MUTUALLY UNREACHABLE branches from the trigger, converging on one bpmn:ParallelGateway merge that continues downstream; each filter computed from its own input; no answer literals; each output read from its own side'
  command: |
    FLOW="$(find . -name BillingDiscrepancyDetector.flow -not -path '*/_outputs/*' -not -path '*/.v1stage*/*' -not -path '*/v1stage/*')"
    test -f "$FLOW"
    python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/_shared/advisory_billing_discrepancy_detector.py "$FLOW"
  timeout: 30
  expected_exit_code: 0
  weight: 1.0
  pass_threshold: 0.0
