task_id: skill-flow-devcon-billing-discrepancy-detector
description: |
  E2E greenfield (DevCon BillingDisputeResolution scenario): build a Flow that
  reads BillingDisputeERP and BillingDisputeCRM and computes an invoice
  overcharge and the customer's tier, asked the way a business user asks it
  (it names no variables). The graders map the seeded
  values onto the flow's declared inputs by meaning and read the results among
  its declared outputs by value. Three debug runs on live data: a real
  overcharge (both reads complete; 1610, 1, MCS-2026-04872, Enterprise), an
  invoice line that does not exist and a customer that does not exist (both
  complete and return 0, 0 and empty text, each output set, not left unset).
tags:
  - uipath-maestro-flow
  - e2e
  - mode:build
  - lifecycle:execute
  - shape:multi-node
  - connector
  - path-to-ga
  - outcome-graded
sandbox:
  template_sources:
    - type: template_dir
      path: ../../_setup
      mount_point: _setup
run_limits:
  max_turns: 120
  turn_timeout: 2400
  task_timeout: 5100
reference:
  directory: ../..

post_run:
  - command: python3 _setup/cleanup_solutions.py
    timeout: 90
initial_prompt: |
  You are a coding agent in an empty Flow project. No user is present, and
  nobody will answer a question or grant approval, so do not ask, do not
  pause, and do not wait for input. Do not delete or overwrite anything this
  run did not create, except what the task asks you to change, and do not
  publish to a shared destination unless the task asks for it.

  Build an automation called "BillingDiscrepancyDetector" that checks whether
  a customer was overcharged on a disputed invoice line, and tells me the
  customer's account tier.

  Each time it runs, it receives the invoice number, the customer's account
  number, which line of the invoice is disputed, and the unit price and
  quantity the customer was billed for that line. Contract details for every
  invoice line are in BillingDisputeERP, and customer details, including the
  account tier, are in BillingDisputeCRM. Both are in Data Fabric.

  The overcharge is what the customer was billed for the line (unit price
  times quantity) minus the contracted amount for that line, or zero if they
  weren't billed more than the contract. Give me back four results:
  - the overcharge as a plain number in USD, for example 250, or 0 when there
    is none
  - the number of discrepancies as 1 or 0
  - the invoice number exactly as it appears in our records, for example
    "MCS-2026-00001"
  - the account tier as written in our customer records, for example
    "Standard"

  If the invoice line or the customer can't be found, don't fail. Return 0 for
  the overcharge and the discrepancies, and empty text for the invoice number
  and the tier.

  <!-- helper:start -->
  Inputs: invoiceNumber (string), accountNumber (string), lineNumber (number),
  unitPrice (number), quantity (number).
  Outputs: overcharge (number), discrepancyCount (number), matchedInvoiceNumber
  (string), accountTier (string).
  BillingDisputeERP and BillingDisputeCRM are existing Data Fabric entities. Use
  the Data Service connection in the Shared folder, even though it is a personal
  one.
  <!-- helper:end -->

  Build and do a test run of the automation.

success_criteria:
  - type: run_command
    description: uip maestro flow validate passes on the flow file
    command: python3 $REFERENCE_DIR/_shared/validate_flow.py
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
  # Advisory: Studio Web agents may test with the RunProject proxy tool instead,
  # which the eval testbench stubs.
  - type: command_executed
    description: 'Advisory: the agent ran its own test run (uip maestro flow debug), as the request asks'
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+flow\s+debug(?!-instances)(?!\s+--help)'
    min_count: 1
    weight: 1.0
    pass_threshold: 0.0
  - type: run_command
    description: 'Effects, overcharge (MCS-2026-04872 line 5 for ACCT-98201-NE, billed 300 x 14 against a contracted 2,590): the ERP and CRM reads each complete, and the declared outputs carry 1610, 1, "MCS-2026-04872" and "Enterprise"'
    command: python3 $REFERENCE_DIR/multi_node/billing_discrepancy_detector/check_billing_discrepancy_detector.py overcharge
    timeout: 800
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0
  - type: run_command
    description: 'Effects, unknown line (line 99 of MCS-2026-04872, which has 8): the run completes and returns 0, 0 and empty text for the invoice number and the tier'
    command: python3 $REFERENCE_DIR/multi_node/billing_discrepancy_detector/check_billing_discrepancy_detector.py unknown-line
    timeout: 800
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0
  - type: run_command
    description: 'Effects, unknown customer (account ACCT-00000-ZZ, which has no CRM row): the run completes and returns 0, 0 and empty text for the invoice number and the tier'
    command: python3 $REFERENCE_DIR/multi_node/billing_discrepancy_detector/check_billing_discrepancy_detector.py unknown-customer
    timeout: 800
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0
  - type: run_command
    description: 'Advisory: generated bindings exist and carry no stub UUIDs'
    command: python3 $REFERENCE_DIR/_shared/check_bindings_no_stubs.py
    timeout: 30
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 0.0
