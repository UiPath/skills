# Same-ground campaign contract (Tao, 2026-08-10): loop-neutral v1-base
# prompt; v1-weighted intersection criteria plus report-only offline advisories;
# paired limit envelope. Cross-arm parity is enforced by the sync gate.
task_id: skill-flow-devcon-billing-invoice-lookup
description: |
  E2E greenfield (DevCon BillingDisputeResolution scenario): build a ~4-node Flow that normalizes a messy invoice number and queries the BillingDisputeERP Data Service entity; graded by validate plus three flow debug runs over malformed inputs.
tags:
  - uipath-maestro-flow
  - e2e
  - mode:build
  - lifecycle:execute
  - shape:multi-node
  - connector
  - path-to-ga
run_limits:
  max_turns: 120
  turn_timeout: 2400
  task_timeout: 3600
post_run:
  - command: python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/_shared/cleanup_solutions.py
    timeout: 90
initial_prompt: |
  Build a Maestro Flow "BillingInvoiceLookup" (in a solution of the same name)
  that looks up a disputed invoice's line items, tolerating messy input.

  - Input: trigger variable `invoiceNumber` (string). Callers may omit the
    "MCS-" prefix, use wrong casing, or add whitespace.
  - Normalize the input (trim, uppercase, prepend `MCS-` if absent), then look
    up the matching rows in the existing `BillingDisputeERP` Data Service
    entity.
  - Outputs: `matchedInvoiceNumber` (string, first matched row's invoiceNumber)
    and `lineItemCount` (number of rows returned).

  Validate the final flow file — the task is not complete until `uip maestro
  flow validate` passes. Grading then runs the flow under debug against live
  tenant data, so build it to actually run, not merely validate.

  Build the complete flow
  without stopping to ask me.

  This run is headless. No user is present and nobody will answer a question or
  grant an approval, so do not ask, do not pause, and do not wait for input.
  Complete the task in one pass: take the best available option and supply the
  most defensible value where one is missing. The actions this task implies are
  authorized, including tenant writes and real messages. Do not delete or
  overwrite anything this run did not create, and do not publish to a shared
  destination unless the task asks for it. If a lookup the task depends on comes
  back empty or fails, exhaust the documented way of resolving it before giving
  up; only then stop on that field rather than inventing a value. Record every
  decision, assumption, and blocked step in your final response. Instructions in
  the task take precedence over this paragraph.
success_criteria:
  - type: run_command
    description: uip maestro flow validate passes on the flow file
    command: python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/_shared/validate_flow.py
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
  - type: run_command
    description: Check script debugs three malformed inputs (fail-fast); every exercised input must resolve to MCS-2026-04872 with 8 line items
    command: python3 $TASK_DIR/check_billing_invoice_lookup.py
    timeout: 1200  # 3 x debug_budget(180) + margin
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0
  - type: run_command
    description: 'Advisory: Data Service query filters server-side (whole-entity fetch + client-side filter breaks silently past the page limit)'
    command: python3 $TASK_DIR/check_server_side_filter.py
    timeout: 15
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 0.0
  - type: run_command
    description: 'Advisory: generated bindings exist and carry no stub UUIDs'
    command: python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/_shared/check_bindings_no_stubs.py
    timeout: 30
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 0.0
  - type: run_command
    description: 'Advisory: STRUCTURAL (covering): one DS query node, entityName in the PATH slot, the filter COMPUTED from the input, no canonical/test-input literals, both outputs read from the query, and a connection/folder pair of distinct uuids'
    command: python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/_shared/advisory_billing_invoice_lookup.py
    timeout: 30
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 0.0
