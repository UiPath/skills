task_id: skill-flow-devcon-billing-invoice-lookup
description: |
  E2E greenfield (DevCon BillingDisputeResolution scenario): build a Flow that
  cleans up a messy invoice number and looks up that invoice's line items in
  the BillingDisputeERP Data Service entity, asked the way a Studio Web user
  would ask it. The grader debugs the flow three times against the live entity,
  over two real invoices with different line-item counts, and checks that an
  entity query completed in each run and that the named outputs carry the
  cleaned-up invoice number and that invoice's live line-item count. Text
  between the helper markers is lower-tier guidance
  (experiments/use-case-tiers.yaml) and is not graded.
tags:
  - uipath-maestro-flow
  - e2e
  - mode:build
  - lifecycle:execute
  - shape:multi-node
  - connector
  - path-to-ga
  - outcome-graded
sandbox:
  template_sources:
    - type: template_dir
      path: ../../_setup
      mount_point: _setup
run_limits:
  max_turns: 120
  turn_timeout: 2400
  task_timeout: 3600
reference:
  directory: ../..

post_run:
  - command: python3 _setup/cleanup_solutions.py
    timeout: 90
initial_prompt: |
  You are a coding agent in UiPath Studio Web in an empty Flow project. No user
  is present, and nobody will answer a question or grant approval, so do not
  ask, do not pause, and do not wait for input.

  Build an automation called "BillingInvoiceLookup" that looks up the line
  items of a disputed invoice in BillingDisputeERP. It takes an invoiceNumber.
  People type invoice numbers carelessly: they leave off the "MCS-" prefix, use
  lowercase, or add spaces. Clean the number up first (trim it, uppercase it,
  and add "MCS-" if it is missing), then find that invoice's rows.

  Return matchedInvoiceNumber (the invoice number of the first matching row)
  and lineItemCount (how many line items the invoice has).

  <!-- helper:start -->
  BillingDisputeERP is a Data Service entity with one row per invoice line
  item; its invoiceNumber field holds values like "MCS-2026-04872".
  <!-- helper:end -->

  Build and test the automation.
pre_run:
  - command: 'python3 "_setup/preflight_connections.py" uipath-uipath-dataservice'
    timeout: 120

success_criteria:
  - type: run_command
    description: uip maestro flow validate passes on the flow file
    command: python3 $REFERENCE_DIR/_shared/validate_flow.py
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
  # Advisory: Studio Web agents may test with the RunProject proxy tool instead,
  # which the eval testbench stubs.
  - type: command_executed
    description: 'Advisory: the agent ran its own test run (uip maestro flow debug), as the request asks'
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+flow\s+debug(?!-instances)(?!\s+--help)'
    min_count: 1
    weight: 1.0
    pass_threshold: 0.0
  - type: run_command
    description: 'Effects: three debug runs on messy input ("2026-04872", "mcs-2026-04903", "  MCS-2026-04872 "); in each an entity query completes and the named outputs are matchedInvoiceNumber = the cleaned-up number and lineItemCount = its live count (8 for MCS-2026-04872, 4 for MCS-2026-04903)'
    command: python3 $REFERENCE_DIR/multi_node/billing_invoice_lookup/check_billing_invoice_lookup.py
    timeout: 1200  # 3 x debug_budget(180) + margin
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0
  - type: run_command
    description: 'Advisory: Data Service query filters server-side (whole-entity fetch + client-side filter breaks silently past the page limit)'
    command: python3 $REFERENCE_DIR/multi_node/billing_invoice_lookup/check_server_side_filter.py
    timeout: 15
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 0.0
  - type: run_command
    description: 'Advisory: generated bindings exist and carry no stub UUIDs'
    command: python3 $REFERENCE_DIR/_shared/check_bindings_no_stubs.py
    timeout: 30
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 0.0
  - type: run_command
    description: 'Advisory: STRUCTURAL (covering): one DS query node, entityName in the PATH slot, the filter COMPUTED from the input, no canonical/test-input literals, both outputs read from the query, and a connection/folder pair of distinct uuids'
    command: python3 $REFERENCE_DIR/_shared/advisory_billing_invoice_lookup.py
    timeout: 30
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 0.0
