task_id: skill-flow-devcon-billing-invoice-lookup
description: |
  E2E greenfield (DevCon BillingDisputeResolution scenario): build a Flow that
  cleans up a carelessly typed invoice number and looks up that invoice's lines
  in BillingDisputeERP, asked the way a business user asks it (it names
  no variables). The graders map the raw number onto the
  flow's declared input by meaning and read the results among its declared
  outputs by value. Four debug runs on live data: three messy forms of three
  real invoices (an entity read completes; the number exactly as the records
  hold it and that invoice's live line count) and one invoice that does not
  exist (a read completes; empty text and 0).
tags:
  - uipath-maestro-flow
  - e2e
  - mode:build
  - lifecycle:execute
  - shape:multi-node
  - connector
  - path-to-ga
  - outcome-graded
sandbox:
  template_sources:
    - type: template_dir
      path: ../../_setup
      mount_point: _setup
run_limits:
  max_turns: 120
  turn_timeout: 2400
  task_timeout: 5100  # turn 2400 + criteria 2625 + margin
reference:
  directory: ../..

post_run:
  - command: python3 _setup/cleanup_solutions.py
    timeout: 90
initial_prompt: |
  You are a coding agent in an empty Flow project. No user is present, and
  nobody will answer a question or grant approval, so do not ask, do not
  pause, and do not wait for input. Do not delete or overwrite anything this
  run did not create, except what the task asks you to change, and do not
  publish to a shared destination unless the task asks for it.

  Build an automation called "BillingInvoiceLookup" that helps users search
  for the lines of a disputed invoice in BillingDisputeERP in Data Fabric.
  People often type the invoice number carelessly: extra spaces, lowercase, or
  without the "MCS-" prefix. Clean it up before looking it up.

  Return the invoice number exactly as it appears in our records, for example
  "MCS-2026-04872", and the number of lines as a whole number. If the invoice
  doesn't exist, don't fail: return empty text and 0.

  <!-- helper:start -->
  Inputs: invoiceNumber (string).
  Outputs: matchedInvoiceNumber (string), lineItemCount (number).
  BillingDisputeERP is an existing Data Fabric entity, and its invoiceNumber
  field holds values like "MCS-2026-04872". Use the Data Service connection in
  the Shared folder, even though it is a personal one.
  <!-- helper:end -->

  Build and test the automation.

success_criteria:
  - type: run_command
    description: uip maestro flow validate passes on the flow file
    command: python3 $REFERENCE_DIR/_shared/validate_flow.py
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
  # Advisory: Studio Web agents may test with the RunProject proxy tool instead,
  # which the eval testbench stubs.
  - type: command_executed
    description: 'Advisory: the agent ran its own test run (uip maestro flow debug), as the request asks'
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+flow\s+debug(?!-instances)(?!\s+--help)'
    min_count: 1
    weight: 1.0
    pass_threshold: 0.0
  - type: run_command
    description: 'Effects, found: three debug runs on messy input ("2026-04872", "mcs-2026-04903", "  mcs-2026-05128 "); in each an entity read completes and the declared outputs carry the number exactly as the records hold it and its live line count (8, 4 and 5)'
    command: python3 $REFERENCE_DIR/multi_node/billing_invoice_lookup/check_billing_invoice_lookup.py found
    timeout: 1200  # 3 x debug_budget(180) + margin
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0
  - type: run_command
    description: 'Effects, not found ("mcs-2026-99999"): the run completes, an entity read completes, and the declared outputs carry empty text and 0'
    command: python3 $REFERENCE_DIR/multi_node/billing_invoice_lookup/check_billing_invoice_lookup.py not-found
    timeout: 1200  # priced on the worst arm of the script (found)
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0
  - type: run_command
    description: 'Advisory: the Data Fabric read filters server-side (whole-entity fetch + client-side filter breaks silently past the page limit)'
    command: python3 $REFERENCE_DIR/multi_node/billing_invoice_lookup/check_server_side_filter.py
    timeout: 15
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 0.0
  - type: run_command
    description: 'Advisory: generated bindings exist and carry no stub UUIDs'
    command: python3 $REFERENCE_DIR/_shared/check_bindings_no_stubs.py
    timeout: 30
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 0.0
