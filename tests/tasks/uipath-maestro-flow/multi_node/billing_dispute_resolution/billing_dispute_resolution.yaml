task_id: skill-flow-devcon-billing-dispute-resolution
description: |
  E2E (DevCon BillingDisputeResolution scenario): build the end-to-end
  billing-dispute flow (IxP extraction, parallel ERP/CRM lookups, an
  SOP-grounded analyst agent, FinancialPostingFunction, a writer agent), asked
  the way a Studio Web user would ask it. The structural check accepts any
  routing that auto-approves manager review instead of pinning the reference's
  switch + decision layout. Two graded debug runs check what the flow did: a
  valid overcharge (a real rate error on the tenant) is posted through
  FinancialPostingFunction, whose live reply must cite the invoice, and returns
  the SOP's credit plus an email draft citing the invoice and that credit; a
  line billed exactly at contract is neither posted nor drafted. Text
  between the helper markers is lower-tier guidance
  (experiments/use-case-tiers.yaml) and is not graded.
tags:
  - uipath-maestro-flow
  - e2e
  - mode:build
  - lifecycle:execute
  - shape:multi-node
  - node:inline-agent
  - node:ixp
  - connector
  - path-to-ga
  - outcome-graded
sandbox:
  template_sources:
    - type: template_dir
      path: ../../_setup
      mount_point: _setup
run_limits:
  max_turns: 200
  turn_timeout: 3600
  task_timeout: 7200
reference:
  directory: ../..

post_run:
  - command: python3 _setup/cleanup_solutions.py
    timeout: 90
initial_prompt: |
  You are a coding agent in UiPath Studio Web in an empty Flow project. No user
  is present, and nobody will answer a question or grant approval, so do not
  ask, do not pause, and do not wait for input.

  Build an automation called "BillingDisputeResolution" that takes an invoice
  PDF and a customer's dispute submission, checks the disputed charges against
  their contract, and determines how to resolve the dispute.
  Use the existing invoice extraction model in
  Shared/uipath-maestro-flow/BillingDispute. Customer information is in
  BillingDisputeCRM and contract details are in BillingDisputeERP; look these
  up in parallel.
  Have an agent assess any pricing differences using the "Billing Dispute SOP
  Index" and recommend a credit, rejection or manager review. For now,
  automatically approve anything requiring manager review.
  For approved disputes, call the existing FinancialPostingFunction workflow,
  then have a second agent draft a customer email explaining the resolution,
  including the invoice number and credit amount. Don't send the email.
  Return the decision, recommended action, credit amount, explanation and email
  draft. For rejected disputes, explain the rejection without drafting an
  email.

  <!-- helper:start -->
  BillingDisputeCRM and BillingDisputeERP are Data Service entities.
  The dispute submission is one object input shaped like
  `{customer: {accountNumber}, invoice: {invoiceNumber}, dispute:
  {disputedLineItems: [{lineNumber, quantity, unitPrice, amount,
  description}]}}`; the invoice PDF is a file input.
  <!-- helper:end -->

  Build and test the automation.
pre_run:
  - command: 'python3 "_setup/preflight_connections.py" uipath-uipath-dataservice'
    timeout: 120

success_criteria:
  - type: run_command
    description: uip maestro flow validate passes on the flow file
    command: python3 $REFERENCE_DIR/_shared/validate_flow.py
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
  # Advisory: Studio Web agents may test with the RunProject proxy tool instead,
  # which the eval testbench stubs, and its CLI debug cannot attach a file input.
  - type: command_executed
    description: 'Advisory: the agent ran its own test run (uip maestro flow debug), as the request asks'
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+flow\s+debug(?!-instances)(?!\s+--help)'
    min_count: 1
    weight: 1.0
    pass_threshold: 0.0
  - type: run_command
    description: 'Structure: trigger→IxP→ERP/CRM→analyst (SOP index attached)→FinancialPostingFunction→writer→end, a rejection path that skips posting, no HITL node, no send-email node, ≥2 out variables'
    command: python3 $REFERENCE_DIR/multi_node/billing_dispute_resolution/check_structure_billing_dispute_resolution.py
    timeout: 90
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0
  - type: run_command
    description: 'The grounding is LIVE, not just wired: the context-index node resolves to a resource.json in the inline agent project, which is where the runtime reads it from'
    command: python3 $REFERENCE_DIR/_shared/check_agent_resource_sidecars.py BillingDisputeResolution.flow
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0
  - type: run_command
    description: 'Effects, valid overcharge (invoice MCS-2026-04903 line 2, 90 h billed at $290 vs contracted $235): IxP and both lookups complete, FinancialPostingFunction completes and its live reply cites MCS-2026-04903, the writer completes, and the flow returns a credit of 4950 and a draft citing MCS-2026-04903 and that credit'
    command: python3 $REFERENCE_DIR/multi_node/billing_dispute_resolution/check_e2e_billing_dispute_resolution.py overcharge
    timeout: 1800
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0
  - type: run_command
    description: 'Effects, no discrepancy (invoice MCS-2026-04872 line 5, billed at the ERP contractedRate of $185): the run completes without running FinancialPostingFunction or the writer, and returns an explanation'
    command: python3 $REFERENCE_DIR/multi_node/billing_dispute_resolution/check_e2e_billing_dispute_resolution.py no-discrepancy
    timeout: 1800
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
