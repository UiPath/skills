task_id: skill-flow-devcon-billing-dispute-resolution
description: |
  E2E (DevCon BillingDisputeResolution scenario): build the end-to-end
  billing-dispute flow (IxP extraction, parallel ERP/CRM lookups, an
  SOP-grounded analyst agent, FinancialPostingFunction, a writer agent), asked
  the way a business user asks it (it names no variables and
  leaves the dispute submission's shape to the agent). The graders build the
  submission from the paths the flow reads off its input over a synonym-rich
  fallback, with the invoice number typed in messy spacing and case, attach
  the matching invoice PDF, and read the results among the declared outputs by
  value. Two debug runs on live data: a real rate error (MCS-2026-04903 line 2)
  is posted through FinancialPostingFunction, whose live reply must cite the
  cleaned-up invoice, and returns "Approved", 4950, an SOP-citing explanation
  and a plain-text draft citing the invoice and credit; a line billed at
  contract (MCS-2026-04872 line 5) is neither posted nor drafted and returns
  "Rejected", "reject", 0 and "No resolution email drafted". Layout is
  advisory.
tags:
  - uipath-maestro-flow
  - e2e
  - mode:build
  - lifecycle:execute
  - shape:multi-node
  - node:inline-agent
  - node:ixp
  - connector
  - path-to-ga
  - outcome-graded
sandbox:
  template_sources:
    - type: template_dir
      path: ../../_setup
      mount_point: _setup
run_limits:
  max_turns: 200
  turn_timeout: 3600
  task_timeout: 9300  # turn 3600 + criteria 5470 + margin
reference:
  directory: ../..

post_run:
  - command: python3 _setup/cleanup_solutions.py
    timeout: 90
initial_prompt: |
  You are a coding agent in UiPath Studio Web in an empty Flow project. No
  user is present, and nobody will answer a question or grant approval, so do
  not ask, do not pause, and do not wait for input.

  Build an automation called "BillingDisputeResolution" that resolves a
  customer's billing dispute.

  It receives the disputed invoice as a PDF together with the customer's
  dispute submission. The submission has the customer's account number, the
  invoice number, and the invoice lines they dispute, with the quantity and
  price they were charged. Customers sometimes type the invoice number with
  extra spaces, in lowercase or without the "MCS-" prefix.

  Read the invoice with our existing invoice extraction model in
  Shared/uipath-maestro-flow/BillingDispute. Customer details are in
  BillingDisputeCRM and contract details are in BillingDisputeERP, both in
  Data Fabric. Look them up and compare each disputed line with the contract
  line that has the same line number.

  Have an agent assess the pricing differences using the "Billing Dispute SOP
  Index" and recommend a credit, a rejection or a manager review. For now,
  automatically approve anything that needs manager review.

  For approved disputes, post the credit through the existing
  FinancialPostingFunction workflow. Then have a second agent draft an email
  to the customer explaining the resolution, mentioning the invoice number and
  the credit amount in USD. Don't send the email.

  At the end, return five results:
  - the decision, as "Approved" or "Rejected"
  - the recommended action, as "credit", "reject" or "manager_review"
  - the credit amount as a plain number in USD, 0 when rejected
  - a short explanation of two or three sentences that names the SOP rule
    applied
  - the full email draft as plain text

  Rejected disputes get no email. Return "No resolution email drafted"
  instead, and explain the rejection in the explanation.

  <!-- helper:start -->
  Build a Flow in this Flow project, not an agent project.
  Inputs: invoicePdf (file) and disputeSubmission (object) with accountNumber
  (string), invoiceNumber (string) and disputedLineItems (array of objects with
  lineNumber (number), quantity (number), unitPrice (number)).
  Outputs: decision (string), recommendedAction (string), creditAmount (number),
  explanation (string), emailDraft (string).
  decision is "Approved" or "Rejected". recommendedAction is "credit", "reject"
  or "manager_review". Name the SOP rule in explanation by its section number
  in the SOP.
  BillingDisputeERP and BillingDisputeCRM are existing Data Fabric entities. Use
  the Data Service connection in the Shared folder, even though it is a personal
  one.
  Post the cleaned invoice number to FinancialPostingFunction, as the records
  hold it, like "MCS-YYYY-NNNNN".
  <!-- helper:end -->

  Build and test the automation.

success_criteria:
  - type: run_command
    description: uip maestro flow validate passes on the flow file
    command: python3 $REFERENCE_DIR/_shared/validate_flow.py
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
  # Advisory: Studio Web agents may test with the RunProject proxy tool instead,
  # which the eval testbench stubs, and its CLI debug cannot attach a file input.
  - type: command_executed
    description: 'Advisory: the agent ran its own test run (uip maestro flow debug), as the request asks'
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+flow\s+debug(?!-instances)(?!\s+--help)'
    min_count: 1
    weight: 1.0
    pass_threshold: 0.0
  - type: run_command
    description: 'Advisory: structure: trigger→IxP→ERP/CRM→analyst (SOP index attached)→FinancialPostingFunction→writer→end, a rejection path that skips posting, no HITL node, no send-email node, ≥2 out variables'
    command: python3 $REFERENCE_DIR/multi_node/billing_dispute_resolution/check_structure_billing_dispute_resolution.py
    timeout: 90
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 0.0
  - type: run_command
    description: 'The grounding is LIVE, not just wired: the context-index node resolves to a resource.json in the inline agent project, which is where the runtime reads it from'
    command: python3 $REFERENCE_DIR/_shared/check_agent_resource_sidecars.py BillingDisputeResolution.flow
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0
  - type: run_command
    description: 'Effects, overcharge (invoice " mcs-2026-04903 " line 2 for ACCT-71044-AT, 90 h billed at $290 vs a contracted $235): IxP and both lookups complete, FinancialPostingFunction completes and its live reply cites MCS-2026-04903, the writer completes, and the declared outputs carry "Approved", "manager_review" or "credit", 4950, an explanation naming an SOP rule (by § or section number, or its title) and a plain-text draft citing MCS-2026-04903 and that credit'
    command: python3 $REFERENCE_DIR/multi_node/billing_dispute_resolution/check_e2e_billing_dispute_resolution.py overcharge
    timeout: 2585
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0
  - type: run_command
    description: 'Effects, reject (invoice "  Mcs-2026-04872 " line 5 for ACCT-98201-NE, billed at the ERP contractedRate of $185): the BillingDisputeERP lookup and the analyst agent complete, and the run completes without running FinancialPostingFunction or the writer, and the declared outputs carry "Rejected", "reject", 0, an explanation naming an SOP rule (by § or section number, or its title) and "No resolution email drafted"'
    command: python3 $REFERENCE_DIR/multi_node/billing_dispute_resolution/check_e2e_billing_dispute_resolution.py reject
    timeout: 2585
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
