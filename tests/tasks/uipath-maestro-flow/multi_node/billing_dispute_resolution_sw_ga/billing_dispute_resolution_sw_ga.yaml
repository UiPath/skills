task_id: skill-flow-devcon-billing-dispute-resolution-sw-ga
description: |
  Studio Web GA prompt for the DevCon BillingDisputeResolution scenario: the
  same end-to-end build as `billing_dispute_resolution` (IxP extraction,
  parallel ERP/CRM lookups, an SOP-grounded analyst agent, FinancialPostingFunction,
  a writer agent), asked the way a Studio Web user would ask it. The structural
  check accepts any routing that auto-approves manager review, instead of the
  reference's switch + decision layout. Two graded debug runs check what the
  flow did: a valid overcharge is posted through FinancialPostingFunction and
  gets an email draft citing the invoice and the returned credit; a line billed
  exactly at contract is neither posted nor drafted. Text between the helper
  markers is lower-tier guidance (experiments/use-case-tiers.yaml) and is not
  graded.
tags:
  - uipath-maestro-flow
  - e2e
  - mode:build
  - lifecycle:execute
  - shape:multi-node
  - node:inline-agent
  - node:ixp
  - connector
  - autopilot-sw-ga
  - outcome-graded
sandbox:
  template_sources:
    - type: template_dir
      path: ../../_setup
      mount_point: _setup
run_limits:
  max_turns: 200
  turn_timeout: 3600
  task_timeout: 7200
reference:
  directory: ../..

post_run:
  - command: python3 _setup/cleanup_solutions.py
    timeout: 90
initial_prompt: |
  You are a coding agent in UiPath Studio Web in an empty Flow project. No user
  is present, and nobody will answer a question or grant approval, so do not
  ask, do not pause, and do not wait for input.

  Build an automation called "BillingDisputeResolution" that takes an invoice
  PDF and a customer's dispute submission, checks the disputed charges against
  their contract, and determines how to resolve the dispute.
  Use the existing invoice extraction model in
  Shared/uipath-maestro-flow/BillingDispute. Customer information is in
  BillingDisputeCRM and contract details are in BillingDisputeERP; look these
  up in parallel.
  Have an agent assess any pricing differences using the "Billing Dispute SOP
  Index" and recommend a credit, rejection or manager review. For now,
  automatically approve anything requiring manager review.
  For approved disputes, call the existing FinancialPostingFunction workflow,
  then have a second agent draft a customer email explaining the resolution,
  including the invoice number and credit amount. Don't send the email.
  Return the decision, recommended action, credit amount, explanation and email
  draft. For rejected disputes, explain the rejection without drafting an
  email.

  <!-- helper:start -->
  The dispute submission is one object input shaped like
  `{customer: {accountNumber}, invoice: {invoiceNumber}, dispute:
  {disputedLineItems: [{lineNumber, quantity, unitPrice, amount,
  description}]}}`; the invoice PDF is a file input.
  <!-- helper:end -->

  Build and test the automation.
pre_run:
  - command: 'python3 "_setup/preflight_connections.py" uipath-uipath-dataservice'
    timeout: 120

success_criteria:
  - type: run_command
    description: uip maestro flow validate passes on the flow file
    command: python3 $REFERENCE_DIR/_shared/validate_flow.py
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
  - type: command_executed
    description: The agent ran its own test run (uip maestro flow debug), as the request asks
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+flow\s+debug(?!-instances)(?!\s+--help)'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0
  - type: run_command
    description: 'Structure: trigger→IxP→ERP/CRM→analyst (SOP index attached)→FinancialPostingFunction→writer→end, a rejection path that skips posting, no HITL node, no send-email node, ≥2 out variables'
    command: python3 $REFERENCE_DIR/multi_node/billing_dispute_resolution_sw_ga/check_structure_billing_dispute_resolution_sw_ga.py
    timeout: 90
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0
  - type: run_command
    description: 'The grounding is LIVE, not just wired: the context-index node resolves to a resource.json in the inline agent project, which is where the runtime reads it from'
    command: python3 $REFERENCE_DIR/_shared/check_agent_resource_sidecars.py BillingDisputeResolution.flow
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0
  - type: run_command
    description: 'Effects, valid overcharge (line 5, 300 vs contracted 185 per hour): IxP and both lookups complete, FinancialPostingFunction completes, the writer completes, and a returned draft cites MCS-2026-04872 and the returned credit amount'
    command: python3 $REFERENCE_DIR/multi_node/billing_dispute_resolution_sw_ga/check_effects_billing_dispute_resolution_sw_ga.py overcharge
    timeout: 1800
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0
  - type: run_command
    description: 'Effects, no discrepancy (line 4 billed exactly at contract): the run completes without running FinancialPostingFunction or the writer, and returns an explanation'
    command: python3 $REFERENCE_DIR/multi_node/billing_dispute_resolution_sw_ga/check_effects_billing_dispute_resolution_sw_ga.py no-discrepancy
    timeout: 1800
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
