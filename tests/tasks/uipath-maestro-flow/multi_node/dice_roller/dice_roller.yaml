# Same-ground alignment expansion plan (Tao, 2026-08-21): loop-neutral
# v1-base prompt, outcome-graded criteria at preserved weights, and
# arm-agnostic artifact discovery.
# See workspaces/docs/flow-sdk/2026-08-21-maestro-flow-alignment-expansion-plan.md.
task_id: skill-flow-dice-roller
description: >
  Create a UiPath Flow from scratch that simulates rolling a fair six-sided die.
  The agent must use the CLI to scaffold the project, discover available node
  types via the registry, edit the flow JSON to add dice-rolling logic using a
  Script node, and validate the flow.
tags: [uipath-maestro-flow, e2e, lifecycle:generate, shape:multi-node]

run_limits:
  expected_turns: 21
  turn_timeout: 1200

initial_prompt: |
  Build the flow inside a solution of the same name.

  Create a UiPath Flow project named "DiceRoller" that simulates rolling a six-sided
  die and outputs the result.

  Validate the flow.
  Do NOT ask for approval, confirmation, or feedback. Do NOT pause between planning and implementation. Build the complete flow end-to-end in a single pass.

success_criteria:
  # ── Flow file validity ─────────────────────────────────────────────────
  - type: run_command
    description: "uip maestro flow validate passes on the flow file"
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/_shared/validate_flow.py"
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  # ── Execution checks ────────────────────────────────────────────────────
  - type: run_command
    description: "Flow debug runs and a Script node produces a value in [1, 6]"
    command: "python3 $TASK_DIR/check_dice_runs.py"
    timeout: 600
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0

post_run:
  - command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/_shared/cleanup_solutions.py"
    timeout: 120
