task_id: skill-flow-devcon-billing-dispute-analyst
description: |
  E2E (DevCon BillingDisputeResolution scenario): build a Flow whose agent,
  grounded on the existing "Billing Dispute SOP Index", reviews a billing
  dispute and recommends what to do, asked the way a Studio Web user would ask
  it. Two graded debug runs check what the agent decided on real ERP lines: a
  $55/h rate error over 90 h must come back as a $4,950 credit routed to manager
  review (the SOP's $500-$5,000 band, which the prompt never states), and a line
  billed at its contracted rate as a rejection with no credit. The grounding
  must also be live (a resource.json in the inline agent project). Text between
  the helper markers is lower-tier guidance (experiments/use-case-tiers.yaml)
  and is not graded.
tags:
  - uipath-maestro-flow
  - e2e
  - mode:build
  - lifecycle:execute
  - shape:multi-node
  - node:inline-agent
  - path-to-ga
  - outcome-graded
sandbox:
  template_sources:
    - type: template_dir
      path: ../../_setup
      mount_point: _setup
run_limits:
  max_turns: 120
  turn_timeout: 1200
  task_timeout: 4200
reference:
  directory: ../..

post_run:
  - command: python3 _setup/cleanup_solutions.py
    timeout: 90
initial_prompt: |
  You are a coding agent in UiPath Studio Web in an empty Flow project. No user
  is present, and nobody will answer a question or grant approval, so do not
  ask, do not pause, and do not wait for input.

  Build an automation called "BillingDisputeAnalyst" in which an agent reviews
  a customer's billing dispute and recommends how to resolve it. Build the
  agent as part of this automation. It takes the invoiceNumber and a
  disputeDescription (the customer's complaint, with the billed and contracted
  figures). The agent must follow our "Billing Dispute SOP Index" to decide
  whether the dispute is valid, work out any credit owed, and pick the
  resolution the SOP calls for.

  Return determination, recommendedAction (one of auto_resolve,
  manager_review or reject), creditAmount (0 when nothing is owed) and
  rationale.

  <!-- helper:start -->
  "Billing Dispute SOP Index" is an existing context index in the tenant.
  invoiceNumber and disputeDescription are strings.
  <!-- helper:end -->

  Build and test the automation.
success_criteria:
  - type: run_command
    description: uip maestro flow validate passes on the flow file
    command: python3 $REFERENCE_DIR/_shared/validate_flow.py
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
  # Advisory: Studio Web agents may test with the RunProject proxy tool instead,
  # which the eval testbench stubs.
  - type: command_executed
    description: 'Advisory: the agent ran its own test run (uip maestro flow debug), as the request asks'
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+flow\s+debug(?!-instances)(?!\s+--help)'
    min_count: 1
    weight: 1.0
    pass_threshold: 0.0
  - type: run_command
    description: 'Effects, rate error (invoice MCS-2026-04903 line 2, 90 h billed at $290 vs a contracted $235): the inline agent completes and returns recommendedAction = manager review and creditAmount = 4950, plus a rationale'
    command: python3 $REFERENCE_DIR/multi_node/billing_dispute_analyst/check_billing_dispute_analyst.py overcharge
    timeout: 1200
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0
  - type: run_command
    description: 'Effects, no rate error (invoice MCS-2026-04872 line 5, billed at the contracted $185): the inline agent completes and returns recommendedAction = reject and no positive creditAmount, plus a rationale'
    command: python3 $REFERENCE_DIR/multi_node/billing_dispute_analyst/check_billing_dispute_analyst.py reject
    timeout: 1200
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
  - type: run_command
    description: 'Advisory: AGENT SIDECAR: the emitted agent.json carries a real model, a real system prompt, and typed outputs (not the scaffold defaults)'
    command: python3 $REFERENCE_DIR/_shared/check_inline_agent.py '**/agent.json'
    timeout: 30
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 0.0
  - type: run_command
    description: 'Advisory: STRUCTURAL (covering): the grounding is WIRED — one inline agent, one context-index resource carrying a real non-stub index uuid and validator-required source, joined by an edge from the agent''s `context` port to the resource''s `input` port, both inputs reaching the agent, both outputs read from it'
    command: python3 $REFERENCE_DIR/_shared/advisory_billing_dispute_analyst.py
    timeout: 30
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 0.0
  - type: run_command
    description: 'The grounding is LIVE, not just wired: the context-index node resolves to a resource.json in the inline agent project, which is where the runtime reads it from'
    command: python3 $REFERENCE_DIR/_shared/check_agent_resource_sidecars.py BillingDisputeAnalyst.flow
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0
