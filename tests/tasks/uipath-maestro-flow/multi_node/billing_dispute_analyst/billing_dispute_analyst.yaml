# Same-ground campaign contract (Tao, 2026-08-10): loop-neutral v1-base
# prompt; v1-weighted intersection criteria plus report-only offline advisories;
# paired limit envelope. Cross-arm parity is enforced by the sync gate.
task_id: skill-flow-devcon-billing-dispute-analyst
description: |
  Build a Maestro Flow whose single work node is an inline low-code agent (uipath.agent.autonomous) grounded on the existing "Billing Dispute SOP Index" semantic index via its context handle (a uipath.agent.resource.context.index node). Graded by flow validate plus one flow debug run: both nodes must be present and the agent must return a non-empty determination.
tags:
  - uipath-maestro-flow
  - e2e
  - mode:build
  - lifecycle:execute
  - shape:multi-node
  - node:inline-agent
  - path-to-ga
run_limits:
  max_turns: 120
  turn_timeout: 1200
  task_timeout: 3300
post_run:
  - command: python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/_shared/cleanup_solutions.py
    timeout: 90
initial_prompt: |
  Build a Maestro Flow "BillingDisputeAnalyst" (in a solution of the same name)
  whose single work node is an inline low-code agent embedded in the flow
  project that analyzes a billing dispute, grounded on tenant knowledge.

  - Trigger inputs: `disputeDescription` (string), `invoiceNumber` (string).
  - The inline agent must ground its analysis on the existing semantic index
    named "Billing Dispute SOP Index" already deployed in the tenant (indexes
    live outside the solution). Use the real folder and index name from the
    tenant — do not hard-code or guess them.
  - The agent returns two strings: `determination` and `rationale`. Map them to
    flow outputs of the same names.
  - The agent must be embedded in the flow project (inline), not a separate
    published agent, and its context handle must be wired to the index.

  Validate the final flow file — the task is not complete until `uip maestro
  flow validate` passes. Grading then runs the flow under debug, so build it to
  actually run, not merely validate.

  This run is headless. No user is present and nobody will answer a question or
  grant an approval, so do not ask, do not pause, and do not wait for input.
  Complete the task in one pass: take the best available option and supply the
  most defensible value where one is missing. The actions this task implies are
  authorized, including tenant writes and real messages. Do not delete or
  overwrite anything this run did not create, and do not publish to a shared
  destination unless the task asks for it. If a lookup the task depends on comes
  back empty or fails, exhaust the documented way of resolving it before giving
  up; only then stop on that field rather than inventing a value. Record every
  decision, assumption, and blocked step in your final response. Instructions in
  the task take precedence over this paragraph.
success_criteria:
  - type: run_command
    description: uip maestro flow validate passes on the flow file
    command: python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/_shared/validate_flow.py
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
  - type: run_command
    description: 'Check debugs the flow: an inline uipath.agent.autonomous node is wired to a context.index node, the flow completes, and the agent returns a non-empty determination'
    command: python3 $TASK_DIR/check_billing_dispute_analyst.py
    timeout: 1200
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0
  - type: run_command
    description: 'Advisory: AGENT SIDECAR: the emitted agent.json carries a real model, a real system prompt, and typed outputs (not the scaffold defaults)'
    command: python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/_shared/check_inline_agent.py '**/agent.json'
    timeout: 30
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 0.0
  - type: run_command
    description: 'Advisory: STRUCTURAL (covering): the grounding is WIRED — one inline agent, one context-index resource carrying a real non-stub index uuid and validator-required source, joined by an edge from the agent''s `context` port to the resource''s `input` port, both inputs reaching the agent, both outputs read from it'
    command: python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/_shared/advisory_billing_dispute_analyst.py
    timeout: 30
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 0.0
