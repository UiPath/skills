task_id: skill-flow-devcon-billing-dispute-analyst
description: |
  E2E (DevCon BillingDisputeResolution scenario): build a Flow whose agent,
  grounded on the existing "Billing Dispute SOP Index", reviews a billing
  dispute and decides how to handle it, asked the way a business user asks it
  (it names no variables). The graders map the seeded
  values onto the flow's declared inputs by meaning and read the decision and
  reasoning among its declared outputs by value. Three debug runs on real ERP
  lines: a $55/h rate error over 90 h must come back as "manager_review" or
  "credit" (the SOP's $500-$5,000 band decides, which the prompt never
  states), a line billed at its
  contracted rate as "reject", and a description too thin to check as
  "manager_review"; each with reasoning that names an SOP rule. The grounding
  must also be live (a resource.json in the inline agent project).
tags:
  - uipath-maestro-flow
  - e2e
  - mode:build
  - lifecycle:execute
  - shape:multi-node
  - node:inline-agent
  - path-to-ga
  - outcome-graded
sandbox:
  template_sources:
    - type: template_dir
      path: ../../_setup
      mount_point: _setup
run_limits:
  max_turns: 120
  turn_timeout: 1200
  task_timeout: 5400
reference:
  directory: ../..

post_run:
  - command: python3 _setup/cleanup_solutions.py
    timeout: 90
initial_prompt: |
  You are a coding agent in an empty Flow project. No user is present, and
  nobody will answer a question or grant approval, so do not ask, do not
  pause, and do not wait for input. Do not delete or overwrite anything this
  run did not create, except what the task asks you to change, and do not
  publish to a shared destination unless the task asks for it.

  Build an automation called "BillingDisputeAnalyst" where an agent reviews a
  customer's billing dispute and decides how to handle it, based on our
  "Billing Dispute SOP Index". The agent gets the customer's description of the
  problem and the invoice number.

  The possible outcomes are a credit, a rejection or a manager review. If the
  description doesn't give enough detail to check the charges, the dispute
  should go to manager review. Return the decision as one of "credit",
  "reject" or "manager_review", and the reasoning as two or three plain
  sentences that name the SOP rule applied.

  <!-- helper:start -->
  Build a Flow in this Flow project, not an agent project.
  Inputs: invoiceNumber (string), disputeDescription (string).
  Outputs: decision (string), reasoning (string). decision is "credit", "reject"
  or "manager_review".
  Name the SOP rule in reasoning by its section number in the SOP.
  <!-- helper:end -->

  Build and test the automation.

success_criteria:
  - type: run_command
    description: uip maestro flow validate passes on the flow file
    command: python3 $REFERENCE_DIR/_shared/validate_flow.py
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
  # Advisory: Studio Web agents may test with the RunProject proxy tool instead,
  # which the eval testbench stubs.
  - type: command_executed
    description: 'Advisory: the agent ran its own test run (uip maestro flow debug), as the request asks'
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+flow\s+debug(?!-instances)(?!\s+--help)'
    min_count: 1
    weight: 1.0
    pass_threshold: 0.0
  - type: run_command
    description: 'Effects, rate error (invoice MCS-2026-04903 line 2, 90 h billed at $290 vs a contracted $235, a $4,950 credit): the agent completes and a declared output is "manager_review" or "credit" (the SOP says the dispute is valid), with reasoning that names an SOP rule (by § or section number, or its title)'
    command: python3 $REFERENCE_DIR/multi_node/billing_dispute_analyst/check_billing_dispute_analyst.py overcharge
    timeout: 1200
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0
  # Advisory: whether a valid $4,950 credit goes to manager review or straight to
  # credit turns on the SOP's confidence rule, a judgment call that flips between
  # runs and models; it is scored, not gating. Reads the decision the run above
  # recorded, so it costs no second debug.
  - type: run_command
    description: 'Advisory: the rate error routes to "manager_review" (the $4,950 credit sits in the SOP''s $500-$5,000 band)'
    command: python3 $REFERENCE_DIR/multi_node/billing_dispute_analyst/check_analyst_band.py
    timeout: 30
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 0.0
  - type: run_command
    description: 'Effects, no rate error (invoice MCS-2026-04872 line 5, billed at the contracted $185): the agent completes and a declared output is exactly "reject", with reasoning that names an SOP rule (by § or section number, or its title)'
    command: python3 $REFERENCE_DIR/multi_node/billing_dispute_analyst/check_billing_dispute_analyst.py reject
    timeout: 1200
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
  - type: run_command
    description: 'Effects, thin description (no line, quantity or rates): the agent completes and a declared output is exactly "manager_review", as the prompt asks, with reasoning that names an SOP rule (by § or section number, or its title)'
    command: python3 $REFERENCE_DIR/multi_node/billing_dispute_analyst/check_billing_dispute_analyst.py thin
    timeout: 1200
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0
  - type: run_command
    description: 'The grounding is LIVE, not just wired: the flow carries a context-index node and it resolves to a resource.json in the inline agent project, which is where the runtime reads it from'
    command: python3 $REFERENCE_DIR/_shared/check_agent_resource_sidecars.py BillingDisputeAnalyst.flow --require context.index
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0
  - type: run_command
    description: 'Advisory: AGENT SIDECAR: the emitted agent.json carries a real model, a real system prompt, and typed outputs (not the scaffold defaults)'
    command: python3 $REFERENCE_DIR/_shared/check_inline_agent.py '**/agent.json'
    timeout: 30
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 0.0
