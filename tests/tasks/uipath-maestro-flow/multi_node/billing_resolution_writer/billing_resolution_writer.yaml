task_id: skill-flow-devcon-billing-resolution-writer
description: |
  E2E (DevCon BillingDisputeResolution scenario): build a Flow whose agent writes a
  customer-facing billing-dispute resolution email and posts it to Slack,
  asked the way a business user asks it (it names no variables; an
  agent writes the email). The grader maps the seeded
  values onto the flow's declared inputs by meaning and reads the results among
  its declared outputs by value. One debug run: the returned body mentions the
  invoice and "USD 1,610.00" and is signed "Billing Support Team"; the subject
  is one line; the per-run case reference comes back unchanged; and the
  returned Slack ts is the response of an executed send to
  #coding-agent-testing whose message starts with the case reference and
  carries the body. The body must come from the executed agent's own output.
  The sender identity is not graded.
tags:
  - uipath-maestro-flow
  - e2e
  - mode:build
  - lifecycle:execute
  - shape:multi-node
  - node:inline-agent
  - connector
  - path-to-ga
  - outcome-graded
sandbox:
  template_sources:
    - type: template_dir
      path: ../../_setup
      mount_point: _setup
run_limits:
  max_turns: 120
  turn_timeout: 1200
  task_timeout: 3300
reference:
  directory: ../..

post_run:
  - command: python3 _setup/cleanup_solutions.py
    timeout: 90
  - command: python3 _setup/teardown_slack_posts.py
    timeout: 300
initial_prompt: |
  You are a coding agent in an empty Flow project. No user is present, and
  nobody will answer a question or grant approval, so do not ask, do not
  pause, and do not wait for input. Do not delete or overwrite anything this
  run did not create, except what the task asks you to change, and do not
  publish to a shared destination unless the task asks for it.

  Build an automation called "BillingResolutionWriter" that writes the
  resolution email for a billing dispute we've approved and sends it in the
  #coding-agent-testing Slack channel. Use an agent to write the email.

  The email should be signed by "Billing Support Team", and the body must
  mention the invoice number and the credit amount, written like "USD
  1,610.00". Start the email with the case reference ID.

  The automation receives the customer's name, the invoice number, the
  approved credit in USD and a case reference ID.

  When it finishes, return:
  - the email subject, as a single line
  - the email body as plain text: a greeting, two or three short paragraphs,
    and the signature
  - the case reference ID, unchanged
  - the ID of the Slack message that was sent

  <!-- helper:start -->
  Build a Flow in this Flow project, not an agent project.
  Inputs: customerName (string), invoiceNumber (string), approvedCredit
  (number), caseReference (string).
  Outputs: emailSubject (string), emailBody (string), caseKey (string),
  slackMessageId (string).
  The credit is written like "USD 1,610.00" and the body ends with the signature
  "Billing Support Team". The Slack message holds the whole email body and
  starts with the caseReference.
  The "is-sandboxes" Slack connection is in the Shared/uipath-maestro-flow
  folder. The channel coding-agent-testing has the id C0B2FDZD1M3.
  <!-- helper:end -->

  Build and test the automation.

success_criteria:
  - type: run_command
    description: uip maestro flow validate passes on the flow file
    command: python3 $REFERENCE_DIR/_shared/validate_flow.py
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
  # Advisory: Studio Web agents may test with the RunProject proxy tool instead,
  # which the eval testbench stubs.
  - type: command_executed
    description: 'Advisory: the agent ran its own test run (uip maestro flow debug), as the request asks'
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+flow\s+debug(?!-instances)(?!\s+--help)'
    min_count: 1
    weight: 1.0
    pass_threshold: 0.0
  - type: run_command
    description: 'Effects: one debug run in which the agent completes and its own output is the returned body, which mentions MCS-2026-04872 and "USD 1,610.00" and is signed "Billing Support Team"; the output named for the subject holds a one-line subject; the per-run case reference comes back unchanged; and the returned Slack ts is the response of an executed send to #coding-agent-testing whose message starts with the case reference and carries the invoice and the body'
    command: python3 $REFERENCE_DIR/multi_node/billing_resolution_writer/check_billing_resolution_writer.py
    timeout: 1200
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0
  - type: run_command
    description: 'Advisory: AGENT SIDECAR: the emitted agent.json carries a real model, a real system prompt, and typed outputs (not the scaffold defaults)'
    command: python3 $REFERENCE_DIR/_shared/check_inline_agent.py '**/agent.json'
    timeout: 30
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 0.0
