task_id: skill-flow-devcon-billing-resolution-writer
description: |
  E2E (DevCon BillingDisputeResolution scenario): build a Flow whose agent
  drafts a customer-facing billing-dispute resolution email and posts it to
  Slack, asked the way a Studio Web user would ask it. One graded debug run
  checks what the flow did: the agent node completed and its own output is the
  returned email body, which cites the invoice and the approved credit; caseKey
  echoes the per-run correlationId; and the Slack message was really posted
  (its ts, read off the executed send node, carries the correlationId, the
  invoice and the drafted body). Text between the helper markers is lower-tier
  guidance (experiments/use-case-tiers.yaml) and is not graded.
tags:
  - uipath-maestro-flow
  - e2e
  - mode:build
  - lifecycle:execute
  - shape:multi-node
  - node:inline-agent
  - connector
  - path-to-ga
  - outcome-graded
sandbox:
  template_sources:
    - type: template_dir
      path: ../../_setup
      mount_point: _setup
run_limits:
  max_turns: 120
  turn_timeout: 1200
  task_timeout: 3300
reference:
  directory: ../..

post_run:
  - command: python3 _setup/cleanup_solutions.py
    timeout: 90
initial_prompt: |
  You are a coding agent in UiPath Studio Web in an empty Flow project. No user
  is present, and nobody will answer a question or grant approval, so do not
  ask, do not pause, and do not wait for input.

  Build an automation called "BillingResolutionWriter" that writes the
  customer email for an approved billing-dispute credit and shares it with the
  team on Slack. It takes customerName, invoiceNumber, creditAmount and
  correlationId. Have an agent, built as part of this automation, draft the
  email's subject and body; the body must state the invoice number and the
  approved credit amount.

  Then post the drafted body, word for word and prefixed with the
  correlationId, to the Slack channel "coding-agent-testing" through our
  "is-sandboxes" Slack connection, sent as the user rather than the bot.

  Return emailSubject, emailBody, caseKey (the correlationId) and
  slackMessageId (the id of the posted Slack message).

  <!-- helper:start -->
  creditAmount is a number; the other inputs are strings.
  <!-- helper:end -->

  Build and test the automation.
success_criteria:
  - type: run_command
    description: uip maestro flow validate passes on the flow file
    command: python3 $REFERENCE_DIR/_shared/validate_flow.py
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
  # Advisory: Studio Web agents may test with the RunProject proxy tool instead,
  # which the eval testbench stubs.
  - type: command_executed
    description: 'Advisory: the agent ran its own test run (uip maestro flow debug), as the request asks'
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+flow\s+debug(?!-instances)(?!\s+--help)'
    min_count: 1
    weight: 1.0
    pass_threshold: 0.0
  - type: run_command
    description: 'Effects: one debug run in which the inline agent completed and its own output is emailBody, which cites MCS-2026-04872 and the 1610 credit; emailSubject is set; caseKey echoes the per-run correlationId; and the Slack send to coding-agent-testing (sent as user) really posted: slackMessageId is the ts of a message carrying the correlationId, the invoice and the drafted body'
    command: python3 $REFERENCE_DIR/multi_node/billing_resolution_writer/check_billing_resolution_writer.py
    timeout: 1200
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0
  - type: run_command
    description: 'Advisory: AGENT SIDECAR: the emitted agent.json carries a real model, a real system prompt, and typed outputs (not the scaffold defaults)'
    command: python3 $REFERENCE_DIR/_shared/check_inline_agent.py '**/agent.json'
    timeout: 30
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 0.0
  - type: run_command
    description: 'Advisory: STRUCTURAL (covering): exactly one INLINE agent (no published agent, no script stand-in), fed all three inputs through bindings or Flow/sidecar prompt references, both fields declared in returns, both outputs read from the agent, no email literals; plus the Slack contract — correlationId in-global, caseKey/slackMessageId out-globals, exactly one Slack send-message-to-channel node sending as user, the posted message depending on the agent, caseKey routing the correlationId and slackMessageId from the executed send'
    command: python3 $REFERENCE_DIR/_shared/advisory_billing_resolution_writer.py
    timeout: 30
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 0.0
