task_id: skill-flow-devcon-billing-resolution-writer
description: |
  E2E (DevCon BillingDisputeResolution scenario): build a Flow whose agent
  drafts a customer-facing billing-dispute resolution email and posts it to
  Slack, asked the way a business user asks it (Ioana's v3 prompt; it names no
  variables, with the eval tenant's Slack channel). The grader maps the seeded
  values onto the flow's declared inputs by meaning and reads the results among
  its declared outputs by value. One debug run: the agent completes and its own
  output is the returned body, which mentions the invoice and "USD 1,610.00"
  and is signed "Billing Support Team"; the subject is one line; the per-run
  case reference comes back unchanged; and the returned Slack ts is the
  response of an executed send to #coding-agent-testing whose message starts
  with the case reference and carries the body. The sender identity is not
  graded.
tags:
  - uipath-maestro-flow
  - e2e
  - mode:build
  - lifecycle:execute
  - shape:multi-node
  - node:inline-agent
  - connector
  - path-to-ga
  - outcome-graded
sandbox:
  template_sources:
    - type: template_dir
      path: ../../_setup
      mount_point: _setup
run_limits:
  max_turns: 120
  turn_timeout: 1200
  task_timeout: 3300
reference:
  directory: ../..

post_run:
  - command: python3 _setup/cleanup_solutions.py
    timeout: 90
initial_prompt: |
  You are a coding agent in UiPath Studio Web in an empty Flow project. No user
  is present, and nobody will answer a question or grant approval, so do not
  ask, do not pause, and do not wait for input.

  Build an automation called "BillingResolutionWriter" that writes the
  resolution email for a billing dispute we've approved and sends it in the
  #coding-agent-testing Slack channel. It receives the customer's name, the
  invoice number, the approved credit in USD and a case reference.

  Have an agent draft the email, with a subject and a body, signed
  "Billing Support Team". The email must mention the invoice number and the
  credit amount, written like "USD 1,610.00". Post the email body in the
  #coding-agent-testing Slack channel, starting with the case reference.

  When it finishes, return:
  - the email subject, as a single line
  - the email body as plain text: a greeting, two or three short paragraphs,
    and the signature
  - the case reference, unchanged
  - the ID of the Slack message that was sent

  Build and test the automation.

success_criteria:
  - type: run_command
    description: uip maestro flow validate passes on the flow file
    command: python3 $REFERENCE_DIR/_shared/validate_flow.py
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
  # Advisory: Studio Web agents may test with the RunProject proxy tool instead,
  # which the eval testbench stubs.
  - type: command_executed
    description: 'Advisory: the agent ran its own test run (uip maestro flow debug), as the request asks'
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+flow\s+debug(?!-instances)(?!\s+--help)'
    min_count: 1
    weight: 1.0
    pass_threshold: 0.0
  - type: run_command
    description: 'Effects: one debug run in which the agent completes and its own output is the returned body, which mentions MCS-2026-04872 and "USD 1,610.00" and is signed "Billing Support Team"; a one-line subject is returned; the per-run case reference comes back unchanged; and the returned Slack ts is the response of an executed send to #coding-agent-testing whose message starts with the case reference and carries the invoice and the body'
    command: python3 $REFERENCE_DIR/multi_node/billing_resolution_writer/check_billing_resolution_writer.py
    timeout: 1200
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0
  - type: run_command
    description: 'Advisory: AGENT SIDECAR: the emitted agent.json carries a real model, a real system prompt, and typed outputs (not the scaffold defaults)'
    command: python3 $REFERENCE_DIR/_shared/check_inline_agent.py '**/agent.json'
    timeout: 30
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 0.0
