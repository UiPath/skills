# Same-ground alignment expansion plan (Tao, 2026-08-21): loop-neutral
# v1-base prompt, outcome-graded criteria at preserved weights, and
# arm-agnostic artifact discovery.
task_id: skill-flow-ipe-jira-create-issue
description: >
  E2E live Jira coverage — builds a Flow with a manual trigger and an
  Atlassian Jira "Create Issue" connector node, then grades by executing the
  flow against a real Jira sandbox connection (`flow debug`) and re-reading the
  tenant. The project/issue-type/summary come from `seed.json` (unique per run),
  so the check verifies a real issue was created with the seeded summary, not a
  fabricated output. The created issue is cleaned up in post_run.

  Tenant prerequisite: a `uipath-atlassian-jira` connection in folder
  `Shared/uipath-maestro-flow` (currently the single Jira connection there),
  reaching the `CE` / "Coder Eval" project (issue type Task). Targets live in
  the task's `jira_is.py`.
tags: [uipath-maestro-flow, integration, lifecycle:generate, shape:single-node, connector, e2e, uipath-atlassian-jira, ipe, mode:build]

run_limits:
  expected_turns: 40
  task_timeout: 1800
  max_turns: 120
  turn_timeout: 900

pre_run:
  - command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/e2e/jira_create_issue/seed_jira.py"
    timeout: 60

post_run:
  - command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/e2e/jira_create_issue/teardown_jira.py"
    timeout: 120

initial_prompt: |
  Create a new Flow project called "JiraCreateIssue" with a manual trigger,
  inside a solution of the same name.
  It should create a Jira issue using the Atlassian Jira "Create Issue"
  connector activity, and expose the new issue's key as a flow output.

  Read `seed.json` in the current directory for the issue details: use the
  `project_key`, `issuetype_id`, `summary`, and `reporter_id` exactly as
  given (pass the summary verbatim; use `reporter_id` for the issue's
  reporter field). Do not stop to ask for missing values.

  Use the Atlassian Jira connection available in the `Shared/uipath-maestro-flow`
  folder. If the Atlassian Jira connector isn't available in your registry,
  stop rather than falling back to a generic HTTP request.

  Validate the final flow file.

  This run is headless. No user is present and nobody will answer a question or
  grant an approval, so do not ask, do not pause, and do not wait for input.
  Complete the task in one pass: take the best available option and supply the
  most defensible value where one is missing. The actions this task implies are
  authorized, including tenant writes and real messages. Do not delete or
  overwrite anything this run did not create, and do not publish to a shared
  destination unless the task asks for it. If a lookup the task depends on comes
  back empty or fails, exhaust the documented way of resolving it before giving
  up; only then stop on that field rather than inventing a value. Record every
  decision, assumption, and blocked step in your final response. Instructions in
  the task take precedence over this paragraph.
success_criteria:
  - type: run_command
    description: "Flow validates successfully"
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/_shared/validate_flow.py"
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "JiraCreateIssue checks: valid flow with Jira Create-Issue node, debug creates a real issue, and the tenant carries the seeded summary"
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/e2e/jira_create_issue/check_jira_create_issue.py"
    timeout: 1080
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0
