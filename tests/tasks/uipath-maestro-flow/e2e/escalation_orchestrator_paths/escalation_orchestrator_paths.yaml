task_id: skill-flow-e2e-escalation-orchestrator-paths
description: >
  End-to-end, outcome-based test of the customer-escalation orchestration,
  asked the way a Studio Web user would ask it and driven down each branch by
  seeded inputs. The agent builds a manually started automation whose routing
  depends only on its inputs, so the grader can steer any path with
  `uip maestro flow debug --inputs`. The grader runs seven seeded cases
  (Sev1/Sev2/Sev3 escalations and the four triage reasons missing_domain,
  unknown_customer, multiple_matches and duplicate) and for each checks what
  the run did: the named outputs escalationPath, severity, engineeringNeeded,
  responseMode and caseKey; exactly one Slack send completed (the alert or the
  notice, never both); and slackMessageId is the ts of the message that send
  posted to #coding-agent-testing, carrying the correlation id and the path.
  No layout is pinned. Salesforce is not called (match status is an input).
  The Outlook email-received trigger is not reliably debug-testable (see
  outlook_trigger_inbox), hence the manual start. Text between the helper
  markers is lower-tier guidance (experiments/use-case-tiers.yaml).
tags: [uipath-maestro-flow, e2e, mode:build, lifecycle:generate, shape:multi-node, node:decision, connector, feature:escalation, path-to-ga, outcome-graded]
sandbox:
  template_sources:
    - type: template_dir
      path: ../../_setup
      mount_point: _setup
    - type: template_dir
      path: _setup
      mount_point: _setup
run_limits:
  expected_turns: 80
  max_turns: 200
  task_timeout: 5400
  turn_timeout: 1800

pre_run:
  - command: "python3 _setup/seed.py"
    timeout: 30

reference:
  directory: ../..

post_run:
  - command: "python3 _setup/cleanup_solutions.py"
    timeout: 120

initial_prompt: |
  You are a coding agent in UiPath Studio Web in an empty Flow project. No user
  is present, and nobody will answer a question or grant approval, so do not
  ask, do not pause, and do not wait for input.

  Build an automation called "CustomerEscalationOrchestrator" that triages an
  incoming customer escalation and tells our team in Slack. It is started
  manually, and an upstream step has already matched the sender to our
  customers, so everything it needs arrives as inputs.

  - Inputs: senderEmail, senderDomain, subject, body, customerTier,
    productionDown, workaroundAvailable, hasAttachments, customerMatchStatus,
    isDuplicate, correlationId.
  - Decide the escalation path, checking in this order: "missing_domain" when
    senderDomain is empty; "unknown_customer" when customerMatchStatus is
    "none"; "multiple_matches" when it is "multiple"; "duplicate" when
    isDuplicate is true; otherwise "escalation".
  - Severity, for the escalation path only: Sev1 when production is down and
    there is no workaround, Sev2 when production is down and a workaround is
    available, Sev3 when production is not down. Every other path gets severity
    "informational". Engineering is needed for Sev1 and Sev2 only.
  - Response mode is "Draft" on the escalation path and "None" otherwise.
  - On the escalation path post an escalation alert in Slack; on any other path
    post a triage notice instead. Both go to the channel "coding-agent-testing"
    through our Slack connection "is-sandboxes", sent as the user rather than
    the bot, and each message includes the escalation path and the correlation
    id.
  - Outputs: escalationPath, severity, engineeringNeeded, responseMode, caseKey
    (the correlation id) and slackMessageId (the id of the Slack message that
    was posted).

  <!-- helper:start -->
  productionDown, workaroundAvailable, hasAttachments and isDuplicate are
  booleans; customerMatchStatus is "single", "none" or "multiple".
  <!-- helper:end -->

  Build and test the automation.
success_criteria:
  - type: command_executed
    description: "Agent validated the generated Flow"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP|\$\{?UIP\}?)\s+(maestro\s+)?flow\s+validate'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  # ── The delivered flow validates ────────────────────────────────────────
  # Discovered, not hardcoded: the SDK loop scaffolds `<Name>Sol/<Name>/<Name>.flow`
  # (its SKILL.md says `uip solution init <Name>Sol`), so a fixed
  # `<Name>/<Name>/<Name>.flow` path failed "File not found" on flows that were
  # otherwise green (adhoc 2026-08-31 22:43 v2: seeded paths passed, validate 0.0).
  - type: run_command
    description: "Generated CustomerEscalationOrchestrator Flow validates without errors, independent of solution layout"
    command: "python3 $REFERENCE_DIR/_shared/validate_flow.py"
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "The project holds one .flow, with the flow built in it"
    command: "python3 $REFERENCE_DIR/_shared/check_single_flow.py"
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  # Advisory: Studio Web agents may test with the RunProject proxy tool instead,
  # which the eval testbench stubs.
  - type: command_executed
    description: 'Advisory: the agent ran its own test run (uip maestro flow debug), as the request asks'
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+flow\s+debug(?!-instances)(?!\s+--help)'
    min_count: 1
    weight: 1.0
    pass_threshold: 0.0

  - type: run_command
    description: "Effects: for each of the seven seeded cases, the debug run returns the expected escalationPath, severity, engineeringNeeded, responseMode and caseKey, exactly one Slack send completed, and slackMessageId is the ts of the message it posted to #coding-agent-testing carrying the correlation id and path"
    command: "python3 $REFERENCE_DIR/e2e/escalation_orchestrator_paths/check_escalation_orchestrator_paths.py"
    timeout: 3000  # budget-guard: manual x7. 7 x debug_budget(300, retries=1) = 2100 + margin
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0
