task_id: skill-flow-e2e-escalation-orchestrator-paths
description: >
  End-to-end, outcome-based test of the customer-escalation orchestration,
  asked the way a Studio Web user would ask it (a business prompt
  with the eval tenant's Slack channel) and driven down each path by seeded
  inputs. The prompt names no variables, so the grader maps seven seeded
  cases onto the inputs the agent declared, by meaning (the customer-match
  input in the vocabulary the flow compares against), and runs each under
  `uip maestro flow debug --inputs`: Sev1/Sev2/Sev3 escalations whose
  severity ignores the tier, and the four triage paths, each triage case also
  meeting every later condition so the prompt's order decides the path. For
  each it finds among the declared outputs, by value, the path, the severity
  ("informational" off the escalation path), whether engineering is needed,
  the response mode ("Draft" or "None"; either for Sev3, which the prompt
  leaves open) and the case reference unchanged; checks that exactly one
  Slack message was posted (the alert or the notice, never both, no send run
  twice); and that a
  returned Slack ts is the one that send got back, in #coding-agent-testing,
  with the case reference and the path in the message. The same output must
  hold each result in every case. No layout is pinned. The "if Slack fails,
  still finish" rule is not exercised, since failing the shared connection is
  not safe. The Outlook email-received trigger is not reliably
  debug-testable (see outlook_trigger_inbox), hence the manual start.
tags: [uipath-maestro-flow, e2e, mode:build, lifecycle:generate, shape:multi-node, node:decision, connector, feature:escalation, path-to-ga, outcome-graded]
sandbox:
  template_sources:
    - type: template_dir
      path: ../../_setup
      mount_point: _setup
    - type: template_dir
      path: _setup
      mount_point: _setup
run_limits:
  expected_turns: 80
  max_turns: 200
  task_timeout: 5400
  turn_timeout: 1800

pre_run:
  - command: "python3 _setup/seed.py"
    timeout: 30

reference:
  directory: ../..

post_run:
  - command: "python3 _setup/cleanup_solutions.py"
    timeout: 120
  - command: "python3 _setup/teardown_slack_posts.py"
    timeout: 300

initial_prompt: |
  You are a coding agent in an empty Flow project. No user is present, and
  nobody will answer a question or grant approval, so do not ask, do not
  pause, and do not wait for input. Do not delete or overwrite anything this
  run did not create, except what the task asks you to change, and do not
  publish to a shared destination unless the task asks for it.

  Build an automation called "CustomerEscalationOrchestrator" that decides
  whether an incoming customer email is a real escalation or needs triage, and
  notifies the team in the #coding-agent-testing Slack channel either way.

  For each email, it must receive:
  - the sender's email address and domain
  - the subject and body
  - the customer's tier
  - whether production is down, and whether there's a workaround
  - whether there are attachments
  - whether the sender matched one customer, none or several
  - whether it's a duplicate
  - a case reference ID

  There are multiple paths to assert, in this order:
  - no sender domain → "missing_domain"
  - no matching customer → "unknown_customer"
  - several matching customers → "multiple_matches"
  - a duplicate → "duplicate"
  - otherwise → "escalation"

  For escalations, the severity is Sev1 when production is down with no
  workaround, Sev2 when production is down but there's a workaround, and Sev3
  when production isn't down. Engineering is needed for Sev1 and Sev2, and
  we'll draft a response. Anything that isn't an escalation is
  "informational": no engineering and no response.

  Post an escalation alert or a triage notice in the #coding-agent-testing
  Slack channel, including the path and the case reference ID.

  When it finishes, return:
  - the path, as one of the five values above
  - the severity, as "Sev1", "Sev2", "Sev3" or "informational"
  - whether engineering is needed, as true or false
  - the response mode, as "Draft" or "None"
  - the case reference, unchanged
  - the ID of the Slack message

  <!-- helper:start -->
  Inputs: senderEmail (string), senderDomain (string), subject (string), body
  (string), customerTier (string), productionDown (boolean),
  workaroundAvailable (boolean), hasAttachments (boolean), customerMatchStatus
  (string), isDuplicate (boolean), caseReference (string).
  Outputs: escalationPath (string), severity (string), engineeringNeeded
  (boolean), responseMode (string), caseKey (string), slackMessageId (string).
  escalationPath is "escalation", "duplicate", "unknown_customer",
  "missing_domain" or "multiple_matches". severity is "Sev1", "Sev2", "Sev3" or
  "informational". responseMode is "Draft" or "None". customerMatchStatus is
  "one", "none" or "several".
  Post one message per run. It includes the caseReference and the escalationPath.
  The "is-sandboxes" Slack connection is in the Shared/uipath-maestro-flow
  folder. The channel coding-agent-testing has the id C0B2FDZD1M3.
  <!-- helper:end -->

  Build and test the automation.
success_criteria:
  # ── Advisory: the agent validated the flow (CLI commands are not graded) ─
  - type: command_executed
    description: "Advisory: the agent validated the generated Flow"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP|\$\{?UIP\}?)\s+(maestro\s+)?flow\s+validate'
    min_count: 1
    weight: 1.0
    pass_threshold: 0.0

  # ── The delivered flow validates ────────────────────────────────────────
  # Discovered, not hardcoded: the SDK loop scaffolds `<Name>Sol/<Name>/<Name>.flow`
  # (its SKILL.md says `uip solution init <Name>Sol`), so a fixed
  # `<Name>/<Name>/<Name>.flow` path fails "File not found" on flows that are
  # otherwise green.
  - type: run_command
    description: "Generated CustomerEscalationOrchestrator Flow validates without errors, independent of solution layout"
    command: "python3 $REFERENCE_DIR/_shared/validate_flow.py"
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  # Advisory: structure is not graded. The effects check below also fails when
  # more than one .flow makes the graded flow ambiguous.
  - type: run_command
    description: "Advisory: the project holds one .flow, with the flow built in it"
    command: "python3 $REFERENCE_DIR/_shared/check_single_flow.py"
    timeout: 30
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 0.0

  # Advisory: Studio Web agents may test with the RunProject proxy tool instead,
  # which the eval testbench stubs.
  - type: command_executed
    description: 'Advisory: the agent ran its own test run (uip maestro flow debug), as the request asks'
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+flow\s+debug(?!-instances)(?!\s+--help)'
    min_count: 1
    weight: 1.0
    pass_threshold: 0.0

  - type: run_command
    description: "Effects: for each of the seven seeded cases, fed to the agent's inputs by meaning, the debug run returns among its declared outputs the path in the prompt's order, the severity (tier ignored; informational off the escalation path), whether engineering is needed, the response mode and the case reference unchanged, the same outputs in every case; exactly one Slack message was posted (counted by completed sends and by distinct ts), and a returned Slack ts is the one it got back, in #coding-agent-testing, with the case reference and the path in the message"
    command: "python3 $REFERENCE_DIR/e2e/escalation_orchestrator_paths/check_escalation_orchestrator_paths.py"
    timeout: 3000  # budget-guard: manual x7. 7 x debug_budget(300, retries=1) = 2100 + margin
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0
