task_id: skill-flow-e2e-escalation-slack-alert
description: >
  End-to-end, outcome-based slice of the customer-escalation orchestration,
  asked the way a Studio Web user would ask it. The agent builds an automation
  that classifies an escalation's severity and posts a Slack alert. The grader
  runs it under `uip maestro flow debug --inputs` for two seeded cases (an
  Enterprise outage that is Sev1 and a Standard-tier outage that is Sev3) and
  checks what each run did: the named outputs severity, engineeringNeeded,
  nextSteps and caseKey, and a Slack message that was really posted
  (slackMessageId is the ts returned by the Slack send that completed in that
  run, in #coding-agent-testing, carrying the correlation id, severity and next
  steps). A manual trigger is used because the Outlook email-received trigger
  cannot be reliably debug-tested (see outlook_trigger_inbox). Text between the
  helper markers is lower-tier guidance (experiments/use-case-tiers.yaml).
tags: [uipath-maestro-flow, e2e, mode:build, lifecycle:generate, shape:multi-node, connector, feature:escalation, path-to-ga, outcome-graded]
sandbox:
  template_sources:
    - type: template_dir
      path: ../../_setup
      mount_point: _setup
    - type: template_dir
      path: _setup
      mount_point: _setup
run_limits:
  expected_turns: 55
  max_turns: 120
  task_timeout: 2400
  turn_timeout: 1200

pre_run:
  - command: "python3 _setup/seed.py"
    timeout: 30

reference:
  directory: ../..

post_run:
  - command: "python3 _setup/cleanup_solutions.py"
    timeout: 120

initial_prompt: |
  You are a coding agent in UiPath Studio Web in an empty Flow project. No user
  is present, and nobody will answer a question or grant approval, so do not
  ask, do not pause, and do not wait for input.

  Build an automation called "EscalationSlackAlert" that triages a customer
  escalation and alerts our team in Slack. It is started manually.

  - Inputs: senderEmail, subject, body, customerTier, productionDown,
    workaroundAvailable, correlationId.
  - Severity: Sev1 when the customer tier is "Enterprise", production is down
    and there is no workaround; Sev2 when production is down and a workaround
    is available; Sev3 for everything else. Engineering is needed for Sev1 and
    Sev2, not for Sev3. Also write a short next-steps note for the team.
  - Post the alert to the Slack channel "coding-agent-testing" through our
    Slack connection "is-sandboxes", sent as the user rather than the bot. The
    message must include the severity, the correlation id and the next steps.
  - Outputs: severity, engineeringNeeded, nextSteps, caseKey (the correlation
    id) and slackMessageId (the id of the Slack message that was posted).

  <!-- helper:start -->
  productionDown and workaroundAvailable are booleans.
  <!-- helper:end -->

  Build and test the automation.
success_criteria:
  # ── The agent validated the flow (convention adherence) ─────────────────
  - type: command_executed
    description: "Agent validated the generated Flow"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP|\$\{?UIP\}?)\s+(maestro\s+)?flow\s+validate'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  # ── The delivered flow validates ────────────────────────────────────────
  - type: run_command
    description: "Generated EscalationSlackAlert Flow validates without errors, independent of solution layout"
    command: "python3 $REFERENCE_DIR/_shared/validate_flow.py"
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  # Advisory: Studio Web agents may test with the RunProject proxy tool instead,
  # which the eval testbench stubs.
  - type: command_executed
    description: 'Advisory: the agent ran its own test run (uip maestro flow debug), as the request asks'
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+flow\s+debug(?!-instances)(?!\s+--help)'
    min_count: 1
    weight: 1.0
    pass_threshold: 0.0

  # ── OUTCOME: each seeded case posts to Slack and returns the right outputs ─
  - type: run_command
    description: "Effects: for a Sev1 and a Sev3 seeded case, the debug run returns the expected severity, engineeringNeeded and caseKey plus a nextSteps note, and slackMessageId is the ts of a Slack message that run posted to #coding-agent-testing carrying the correlation id, severity and next steps"
    command: "python3 $REFERENCE_DIR/e2e/escalation_slack_alert/check_escalation_slack_alert.py"
    timeout: 1000  # budget-guard: manual x2. 2 x debug_budget(300, retries=1) = 600 + margin
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0
