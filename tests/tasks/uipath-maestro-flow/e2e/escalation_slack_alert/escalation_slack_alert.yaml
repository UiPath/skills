task_id: skill-flow-e2e-escalation-slack-alert
description: >
  End-to-end, outcome-based slice of the customer-escalation orchestration,
  asked the way a Studio Web user would ask it (a business prompt
  with the eval tenant's Slack channel). The prompt names no variables, so the
  grader maps three seeded cases (an Enterprise outage with no workaround that
  is Sev1, a Standard-tier outage with no workaround that is Sev3, and a
  Standard-tier outage with a workaround that is Sev2) onto the inputs the
  agent declared, by meaning, and runs each under
  `uip maestro flow debug --inputs`. It then finds the results among the
  declared outputs by value: the severity, whether engineering is needed, the
  case reference unchanged, and a Slack message ts. That ts must come from a
  Slack send that completed in the run, in #coding-agent-testing, whose
  message has the severity and case reference on its first line and two or
  three bulleted next steps. The same output must hold each result in every
  case.
tags: [uipath-maestro-flow, e2e, mode:build, lifecycle:generate, shape:multi-node, connector, feature:escalation, path-to-ga, outcome-graded]
sandbox:
  template_sources:
    - type: template_dir
      path: ../../_setup
      mount_point: _setup
    - type: template_dir
      path: _setup
      mount_point: _setup
run_limits:
  expected_turns: 55
  max_turns: 120
  task_timeout: 2700
  turn_timeout: 1200

pre_run:
  - command: "python3 _setup/seed.py"
    timeout: 30

reference:
  directory: ../..

post_run:
  - command: "python3 _setup/cleanup_solutions.py"
    timeout: 120
  - command: "python3 _setup/teardown_slack_posts.py"
    timeout: 300

initial_prompt: |
  You are a coding agent in an empty Flow project. No user is present, and
  nobody will answer a question or grant approval, so do not ask, do not
  pause, and do not wait for input. Do not delete or overwrite anything this
  run did not create, except what the task asks you to change, and do not
  publish to a shared destination unless the task asks for it.

  Build an automation called "EscalationSlackAlert" that triages a customer
  escalation and alerts me in the #coding-agent-testing Slack channel. For
  each escalation it receives the sender's email, the subject and body of the
  email, the customer's tier, whether their production is down, whether they
  have a workaround, and a case reference.

  Classify the severity:
  - Sev1: an Enterprise customer's production is down with no workaround.
  - Sev2: production is down but there is a workaround.
  - Sev3: everything else, including non-Enterprise customers who are down
    without a workaround.

  Engineering needs to be involved for Sev1 and Sev2. Also suggest two or
  three short next steps.

  Post the alert in the #coding-agent-testing Slack channel. Put the severity
  and the case reference on the first line, then the next steps as a short
  bulleted list.

  When it finishes, return:
  - the severity, as "Sev1", "Sev2" or "Sev3"
  - whether engineering is needed: YES/no
  - the case reference
  - the ID of the Slack message that was sent

  <!-- helper:start -->
  Inputs: senderEmail (string), subject (string), body (string), customerTier
  (string), productionDown (boolean), workaroundAvailable (boolean),
  caseReference (string).
  Outputs: severity (string), engineeringNeeded (boolean), caseKey (string),
  slackMessageId (string). severity is "Sev1", "Sev2" or "Sev3".
  Post one message per run. Its first line has the severity and the
  caseReference, followed by 2 or 3 bullet lines.
  The "is-sandboxes" Slack connection is in the Shared/uipath-maestro-flow
  folder. The channel coding-agent-testing has the id C0B2FDZD1M3.
  <!-- helper:end -->

  Build and test the automation.
success_criteria:
  # ── Advisory: the agent validated the flow (CLI commands are not graded) ─
  - type: command_executed
    description: "Advisory: the agent validated the generated Flow"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP|\$\{?UIP\}?)\s+(maestro\s+)?flow\s+validate'
    min_count: 1
    weight: 1.0
    pass_threshold: 0.0

  # ── The delivered flow validates ────────────────────────────────────────
  - type: run_command
    description: "Generated EscalationSlackAlert Flow validates without errors, independent of solution layout"
    command: "python3 $REFERENCE_DIR/_shared/validate_flow.py"
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  # Advisory: Studio Web agents may test with the RunProject proxy tool instead,
  # which the eval testbench stubs.
  - type: command_executed
    description: 'Advisory: the agent ran its own test run (uip maestro flow debug), as the request asks'
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+flow\s+debug(?!-instances)(?!\s+--help)'
    min_count: 1
    weight: 1.0
    pass_threshold: 0.0

  # ── OUTCOME: each seeded case posts to Slack and returns the right results ─
  - type: run_command
    description: "Effects: for three seeded cases (Enterprise down without a workaround = Sev1, Standard down without a workaround = Sev3, Standard down with a workaround = Sev2), fed to the agent's inputs by meaning, the debug run returns among its declared outputs the severity, whether engineering is needed (true, false, true) and the case reference unchanged, the same outputs in every case; and a returned Slack ts is that of a send that completed in the run, in #coding-agent-testing, whose message has the severity and the case reference on its first line and two or three bulleted next steps"
    command: "python3 $REFERENCE_DIR/e2e/escalation_slack_alert/check_escalation_slack_alert.py"
    timeout: 1000  # budget-guard: manual x3. 3 x debug_budget(300, retries=1) = 900 + margin
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0
