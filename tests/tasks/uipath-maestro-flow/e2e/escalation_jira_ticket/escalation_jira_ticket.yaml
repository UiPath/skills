task_id: skill-flow-e2e-escalation-jira-ticket
description: >
  E2E live Jira coverage for the escalation flow, asked the way a Studio Web
  user would ask it: the agent builds a manually started automation that
  classifies an escalation's severity and opens a Jira ticket for it. The
  grader seeds a Sev1 case with a unique correlationId, runs
  `uip maestro flow debug --inputs` once, and checks what the run did: a Jira
  Create Issue step completed, its returned key is the jiraIssueKey output,
  reading that key back from Jira returns an issue whose summary carries the
  seeded correlationId (so the ticket is real and is this run's), and the named
  outputs severity, engineeringNeeded and caseKey are right. The created issue
  is deleted in post_run. Text between the helper markers is lower-tier
  guidance (experiments/use-case-tiers.yaml).

  Tenant prerequisite: a `uipath-atlassian-jira` connection in folder
  `Shared/uipath-maestro-flow` reaching the `CE` / "Coder Eval" project (issue
  type Task). pre_run resolves both and ends the run as ERROR when it cannot.
tags: [uipath-maestro-flow, e2e, mode:build, lifecycle:generate, shape:multi-node, connector, feature:escalation, path-to-ga, outcome-graded]
sandbox:
  template_sources:
    - type: template_dir
      path: ../../_setup
      mount_point: _setup
    - type: template_dir
      path: _setup
      mount_point: _setup
run_limits:
  expected_turns: 55
  max_turns: 120
  task_timeout: 2400
  turn_timeout: 1200

pre_run:
  - command: "python3 _setup/seed.py"
    timeout: 60

reference:
  directory: ../..

post_run:
  - command: "python3 _setup/teardown_jira.py"
    timeout: 120
  - command: "python3 _setup/cleanup_solutions.py"
    timeout: 120

initial_prompt: |
  You are a coding agent in UiPath Studio Web in an empty Flow project. No user
  is present, and nobody will answer a question or grant approval, so do not
  ask, do not pause, and do not wait for input.

  Build an automation called "EscalationJiraTicket" that triages a customer
  escalation and opens a Jira ticket for it. It is started manually.

  - Inputs: senderEmail, subject, body, customerTier, productionDown,
    workaroundAvailable, correlationId.
  - Severity: Sev1 when the customer tier is "Enterprise", production is down
    and there is no workaround; Sev2 when production is down and a workaround
    is available; Sev3 otherwise. Engineering is needed for Sev1 and Sev2.
  - Create the ticket as a Task in our Jira project CE ("Coder Eval") through
    the Jira connection in the Shared/uipath-maestro-flow folder. Put the
    correlation id in the ticket summary, word for word.
  - Outputs: severity, engineeringNeeded, caseKey (the correlation id) and
    jiraIssueKey (the key of the ticket that was created).

  <!-- helper:start -->
  productionDown and workaroundAvailable are booleans.
  <!-- helper:end -->

  Build and test the automation.
success_criteria:
  - type: command_executed
    description: "Agent validated the generated Flow"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP|\$\{?UIP\}?)\s+(maestro\s+)?flow\s+validate'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  # Discover the flow file — the prompt names only the FLOW, never the enclosing
  # solution, so a hardcoded `<Name>/<Name>/<Name>.flow` would grade the solution
  # directory's name (an unstated requirement) and score 0.0 on a valid flow built
  # at e.g. `EscalationJiraTicketSolution/EscalationJiraTicket/`.
  - type: run_command
    description: "Generated EscalationJiraTicket Flow validates without errors"
    command: "python3 $REFERENCE_DIR/_shared/validate_flow.py"
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  # Advisory: Studio Web agents may test with the RunProject proxy tool instead,
  # which the eval testbench stubs.
  - type: command_executed
    description: 'Advisory: the agent ran its own test run (uip maestro flow debug), as the request asks'
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+flow\s+debug(?!-instances)(?!\s+--help)'
    min_count: 1
    weight: 1.0
    pass_threshold: 0.0

  - type: run_command
    description: "Effects: one seeded Sev1 debug run in which a Jira Create Issue step completed, jiraIssueKey is the key it returned, reading that key back from Jira returns an issue whose summary carries the seeded correlationId, and severity=Sev1, engineeringNeeded=true, caseKey=the correlationId"
    command: "python3 $REFERENCE_DIR/e2e/escalation_jira_ticket/check_escalation_jira_ticket.py"
    timeout: 1600
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0
