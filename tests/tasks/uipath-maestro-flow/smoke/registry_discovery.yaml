# Same-ground alignment expansion plan (Tao, 2026-08-21): loop-neutral
# v1-base prompt, outcome-graded criteria at preserved weights, and
# arm-agnostic artifact discovery.
task_id: skill-flow-registry-discovery
description: >
  Skill-guided evaluation: agent uses the uipath-maestro-flow skill to explore
  available Flow node types via the registry. Tests whether the skill teaches
  the correct registry workflow (pull, list/search, get).
tags: [uipath-maestro-flow, smoke, lifecycle:discover, feature:registry]

run_limits:
  expected_turns: 9
  max_turns: 28

initial_prompt: |
  Explore the available Flow authoring capabilities for a flow that makes an
  HTTP request and processes the response with a script. Identify the exact
  HTTP and Script node types and inspect their input and output schemas.
  Do not build the flow; report what you find.

  This run is headless. No user is present and nobody will answer a question or
  grant an approval, so do not ask, do not pause, and do not wait for input.
  Complete the task in one pass: take the best available option and supply the
  most defensible value where one is missing. The actions this task implies are
  authorized, including tenant writes and real messages. Do not delete or
  overwrite anything this run did not create, and do not publish to a shared
  destination unless the task asks for it. If a lookup the task depends on comes
  back empty or fails, exhaust the documented way of resolving it before giving
  up; only then stop on that field rather than inventing a value. Record every
  decision, assumption, and blocked step in your final response. Instructions in
  the task take precedence over this paragraph.
success_criteria:
  # This task deliberately produces no artifact. Under ratified ruling D-2,
  # v1-only registry telemetry remains report-only rather than gating the SDK arm.
  - type: command_executed
    description: "Advisory: live-v1 agent refreshed registry data"
    tool_name: "Bash"
    command_pattern: 'uip\s+(maestro\s+)?flow\s+registry\s+pull'
    min_count: 1
    weight: 1.0
    pass_threshold: 0.0

  - type: command_executed
    description: "Advisory: live-v1 agent listed or searched registry nodes"
    tool_name: "Bash"
    command_pattern: 'uip\s+(maestro\s+)?flow\s+registry\s+(list|search)'
    min_count: 1
    weight: 1.5
    pass_threshold: 0.0

  - type: command_executed
    description: "Advisory: live-v1 agent retrieved details on the HTTP node type"
    tool_name: "Bash"
    command_pattern: 'uip\s+(maestro\s+)?flow\s+registry\s+get\s+.*core\.action\.http'
    min_count: 1
    weight: 1.5
    pass_threshold: 0.0

  - type: command_executed
    description: "Advisory: live-v1 agent retrieved details on the Script node type"
    tool_name: "Bash"
    command_pattern: 'uip\s+(maestro\s+)?flow\s+registry\s+get\s+.*core\.action\.script'
    min_count: 1
    weight: 1.5
    pass_threshold: 0.0
