# Same-ground alignment expansion plan (Tao, 2026-08-21): loop-neutral
# v1-base prompt, outcome-graded criteria at preserved weights, and
# arm-agnostic artifact discovery.
task_id: skill-flow-init-validate
description: >
  Skill-guided evaluation: agent creates a new UiPath Flow project and
  validates it. Tests whether the skill produces a valid Flow artifact.
tags: [uipath-maestro-flow, smoke, lifecycle:generate]

run_limits:
  expected_turns: 9

initial_prompt: |
  Create a new UiPath Flow project called "WeatherAlert" and make sure it
  validates successfully.

  This run is headless. No user is present and nobody will answer a question or
  grant an approval, so do not ask, do not pause, and do not wait for input.
  Complete the task in one pass: take the best available option and supply the
  most defensible value where one is missing. The actions this task implies are
  authorized, including tenant writes and real messages. Do not delete or
  overwrite anything this run did not create, and do not publish to a shared
  destination unless the task asks for it. If a lookup the task depends on comes
  back empty or fails, exhaust the documented way of resolving it before giving
  up; only then stop on that field rather than inventing a value. Record every
  decision, assumption, and blocked step in your final response. Instructions in
  the task take precedence over this paragraph.
success_criteria:
  - type: command_executed
    description: "Advisory: live-v1 agent created a solution"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+solution\s+(init|new)'
    min_count: 1
    weight: 1.5
    pass_threshold: 0.0  # advisory: init auto-scaffolds the parent solution (CLI #2470)

  - type: run_command
    description: "Initialized flow has the default manual trigger"
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/_shared/flow_contains.py --flow-name WeatherAlert 'core.trigger.manual'"
    timeout: 30
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent validated the .flow file"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+(maestro\s+)?flow\s+validate'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  # Solution registration is a live-v1 layout detail. Keep it visible without
  # gating the SDK arm, whose native output is a root-level .flow artifact.
  - type: json_check
    description: "Advisory: live-v1 Flow project is registered in the parent solution .uipx"
    path: "WeatherAlert/WeatherAlert.uipx"
    assertions:
      - expression: "length(Projects)"
        operator: "gte"
        expected: 1
      - expression: "length(Projects[?Type=='Flow'])"
        operator: "gte"
        expected: 1
    weight: 1.0
    pass_threshold: 0.0

  - type: run_command
    description: "Flow file was created in a supported authoring layout"
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/_shared/flow_contains.py --flow-name WeatherAlert"
    timeout: 30
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 1.0
