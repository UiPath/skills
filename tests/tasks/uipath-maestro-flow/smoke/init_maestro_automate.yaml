task_id: skill-flow-init-maestro-automate
description: >
  Skill-guided evaluation: asked for a Maestro Automate project, the agent
  passes --automate to `uip maestro flow init` rather than creating a plain
  Flow. The words in the request are the only signal; nothing else about the
  build changes.
tags: [uipath-maestro-flow, smoke, mode:build, lifecycle:generate]

run_limits:
  expected_turns: 9

reference:
  directory: ..

initial_prompt: |
  Create a new UiPath Maestro Automate project called "InvoiceIntake".

  This run is headless. No user is present and nobody will answer a question or
  grant an approval, so do not ask, do not pause, and do not wait for input.
  Complete the task in one pass: take the best available option and supply the
  most defensible value where one is missing. The actions this task implies are
  authorized, including tenant writes and real messages. Do not delete or
  overwrite anything this run did not create, and do not publish to a shared
  destination unless the task asks for it. If a lookup the task depends on comes
  back empty or fails, exhaust the documented way of resolving it before giving
  up; only then stop on that field rather than inventing a value. Record every
  decision, assumption, and blocked step in your final response. Instructions in
  the task take precedence over this paragraph.
success_criteria:
  # Advisory: command grammar is v1-arm-specific — the SDK arm produces the
  # same project without running `uip` at all. The gating criteria below are
  # the outcome: a project that IS Maestro Automate, however it got made.
  - type: command_executed
    description: "Advisory: v1 agent passed --automate to flow init"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+(maestro\s+)?flow\s+init\b(?=(?:(?!\n|&&|\|\||;|\||\s(?:uip|\$UIP)\s).)*--automate)'
    min_count: 1
    weight: 0
    pass_threshold: 0.0

  # Scoped to the project the task asked for. A sandbox-wide search passes
  # when any unrelated scaffold carries the marker, which proves nothing about
  # InvoiceIntake.
  - type: run_command
    description: "InvoiceIntake is a Maestro Automate project — marker and Lite profile"
    command: >
      python3 $REFERENCE_DIR/_shared/project_profile.py --flow-name InvoiceIntake
      --expect-profile Lite --expect-sentinel
    timeout: 30
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0

  # Maestro Automate is a Flow project under a restricted profile, not a
  # separate project type — a .flow is still the artifact that gets authored.
  - type: run_command
    description: "Flow file was created in a supported authoring layout"
    command: "python3 $REFERENCE_DIR/_shared/flow_contains.py --flow-name InvoiceIntake"
    timeout: 30
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 1.0
