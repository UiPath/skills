task_id: skill-flow-inline-agent-robust
description: >
  Skill-guided evaluation: agent uses the uipath-maestro-flow skill to build a
  Flow with an inline (uipath.agent.autonomous) agent defined DIRECTLY in the
  flow file and configured to a production bar — full embedded inputs (string
  prompts, UUID source), a current model instead of a stale default, a
  non-placeholder system prompt, and typed agentOutputVariables. Guards
  against shipping a toy agent or falling back to the legacy sidecar pattern.
tags: [uipath-maestro-flow, smoke, mode:build, lifecycle:generate, node:inline-agent, shape:single-node]

run_limits:
  expected_turns: 32
  max_turns: 90

initial_prompt: |
  Create a new UiPath Flow project called "EmailTriage" (inside a solution) and
  add an inline agent node that classifies an inbound support email into a
  category and priority.

  A Flow project MUST be created inside a solution, so the flow file lands at:
    EmailTriage/EmailTriage/EmailTriage.flow

  Configure the inline agent to a production standard, not a scaffold default:
  - Pick an appropriate current model (do not keep any stale default).
  - Write a real system prompt for the classification task (no placeholder).
  - Declare typed output variables (e.g. category, priority) — not a bare
    `content` string.

  The task is NOT complete until `uip maestro flow validate` passes for
  EmailTriage/EmailTriage/EmailTriage.flow.

  Important:
  - The `uip` CLI is already available in the environment.
  - Validate locally with `uip maestro flow validate`.

success_criteria:
  - type: command_executed
    description: "Agent discovered available models with uip agent model list (advisory — convention, not outcome)"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+agent\s+model\s+list'
    min_count: 1
    weight: 1.0
    pass_threshold: 0.0

  - type: file_exists
    description: "Flow file was created inside the solution"
    path: "EmailTriage/EmailTriage/EmailTriage.flow"
    weight: 1.5
    pass_threshold: 1.0

  - type: file_contains
    description: "Flow contains the inline agent node type"
    path: "EmailTriage/EmailTriage/EmailTriage.flow"
    includes:
      - '"uipath.agent.autonomous"'
    weight: 2.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "No legacy inline-agent lifecycle commands (definition lives in the .flow)"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+agent\s+(init|refresh|validate)\s+.*--inline-in-flow'
    weight: 1.0
    pass_threshold: 1.0

  # The graded artifact is the .flow file: the shared checker asserts the
  # agent node is self-contained (string prompts = embed trigger, UUID
  # source, no never-author artifacts) and meets the production bar the
  # skill teaches: model overridden, real (non-placeholder) system prompt,
  # and typed agentOutputVariables beyond bare `content`. $TASK_DIR is this
  # YAML's dir; _shared is its sibling.
  - type: run_command
    description: "Embedded inline agent: model overridden, real system prompt, typed output variables"
    command: 'python3 "$TASK_DIR/../_shared/check_inline_agent.py" "EmailTriage/EmailTriage/EmailTriage.flow"'
    timeout: 15
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  # Outcome-graded: re-runs validate at grading time so a failing validation
  # can't earn the weight (the prompt's success bar is "validate passes").
  - type: run_command
    description: "uip maestro flow validate passes on the authored flow"
    command: 'python3 "$TASK_DIR/../_shared/validate_flow.py"'
    timeout: 120
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 1.0
