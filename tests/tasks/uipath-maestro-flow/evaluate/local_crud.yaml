# Same-ground alignment expansion plan (Tao, 2026-08-21): loop-neutral
# v1-base prompt, outcome-graded criteria at preserved weights, and
# arm-agnostic artifact discovery.
task_id: skill-flow-eval-local-crud
description: >
  Skill-guided evaluation: agent uses the uipath-maestro-flow skill's evaluate
  capability to scaffold a Flow project and exercise local eval CRUD —
  an exact-match evaluator, an eval set, and a data point. No authentication,
  upload, or evaluation run. Tests whether the skill teaches the correct
  local-CRUD workflow and persists the expected artifacts.
tags: [uipath-maestro-flow, mode:build, lifecycle:generate, feature:eval]

run_limits:
  expected_turns: 20
  max_turns: 60

reference:
  directory: ..

initial_prompt: |
  Scaffold a UiPath Flow project called "SmokeEval" inside a solution of the
  same name, then build the eval scaffolding for it — purely local, no Studio
  Web round-trip.

  Create the solution and the Flow project, keeping the Flow inside a solution
  of the same name; the flow file is `SmokeEval.flow`.

  Declare a string input variable named `name` before adding data points. The
  eval data point below uses `{"name":"Alice"}`, so its input must be declared
  in the flow.

  Add an evaluator named `greeting-match` of type `exact-match`.

  Create an eval set named `Smoke Set` in the same project and let it use the
  project's default entry point and current evaluators.

  Add one data point named `hello` to that eval set with inputs
  `{"name":"Alice"}` and expected `{"greeting":"Hello, Alice!"}`.

  Inspect the local evaluator and eval-set artifacts to confirm they were
  created. Keep all work local: do not authenticate, upload the solution, or
  start an evaluation run.

  This run is headless. No user is present and nobody will answer a question or
  grant an approval, so do not ask, do not pause, and do not wait for input.
  Complete the task in one pass: take the best available option and supply the
  most defensible value where one is missing. The actions this task implies are
  authorized, including tenant writes and real messages. Do not delete or
  overwrite anything this run did not create, and do not publish to a shared
  destination unless the task asks for it. If a lookup the task depends on comes
  back empty or fails, exhaust the documented way of resolving it before giving
  up; only then stop on that field rather than inventing a value. Record every
  decision, assumption, and blocked step in your final response. Instructions in
  the task take precedence over this paragraph.
success_criteria:
  - type: run_command
    description: "A solution manifest (.uipx) exists in the workspace"
    command: |-
      python3 -c "import glob, sys; sys.exit(0 if glob.glob('**/*.uipx', recursive=True) else 1)"
    timeout: 10
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 0.0

  - type: run_command
    description: "A solution manifest (.uipx) in the workspace lists a Flow project"
    command: |-
      python3 -c "import glob, json, sys; sys.exit(0 if any(p.get('Type') == 'Flow' for f in glob.glob('**/*.uipx', recursive=True) for p in json.load(open(f)).get('Projects', [])) else 1)"
    timeout: 10
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 0.0

  - type: run_command
    description: "SmokeEval Flow artifact exists"
    command: "python3 $REFERENCE_DIR/_shared/flow_contains.py --flow-name SmokeEval"
    timeout: 30
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "Exact-match evaluator artifact exists"
    command: "python3 $REFERENCE_DIR/evaluate/check_local_crud.py --check evaluator"
    timeout: 10
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "Smoke Set eval-set artifact exists"
    command: "python3 $REFERENCE_DIR/evaluate/check_local_crud.py --check eval-set"
    timeout: 10
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "Smoke Set contains the hello data point with inputs and expected output"
    command: "python3 $REFERENCE_DIR/evaluate/check_local_crud.py --check data-point"
    timeout: 10
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Local-list telemetry (report only; persisted artifacts are graded directly)"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+flow\s+eval\s+(evaluator\s+list|set\s+list)'
    min_count: 1
    weight: 1.0
    pass_threshold: 0.0

  - type: run_command
    description: "Evaluator + eval-set JSON files exist on disk with correct shape"
    command: "python3 $REFERENCE_DIR/evaluate/check_local_crud.py"
    timeout: 10
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
