task_id: skill-flow-summarize
description: >
  Create a UiPath Flow that runs a Summarize pattern node (`uipath.pattern.deep-rag`)
  over a single document attachment to produce a synthesized text response with
  per-claim citations enabled. Exercises Summarize node discovery, the
  `returnCitations` boolean input, and wiring of the `attachment` input from a
  flow-level input variable. A `flow debug` step is intentionally omitted —
  Summarize requires a pre-uploaded Orchestrator attachment and the ECS.DeepRag
  service backend, neither of which the test sandbox can provision deterministically.
tags: [uipath-maestro-flow, integration, lifecycle:generate, shape:single-node, node:summarize, context-grounding, mode:build]

run_limits:
  expected_turns: 47
  turn_timeout: 1200

initial_prompt: |
  Create a UiPath Flow project named "SummarizeDemo" that uses a Summarize
  pattern node to synthesize a response over an attached document. The flow
  takes one `in` variable of `type: "file"` named `documentFile`, bound to
  the trigger via `triggerNodeId: "<triggerId>"`. The variable's runtime
  payload is a full Flow Attachment object (`{ FullName, Id, Metadata, MimeType }`).
  The Summarize node must:

    - have its `attachment` input wired to the trigger output, NOT the bare
      variable: `=js:$vars.<triggerId>.output.documentFile`. Do not use
      `=js:$vars.documentFile`, `.Id`, `.FullName`, or any other subfield —
      the runtime engine wants the WHOLE Attachment object resolved through
      the trigger output binding.
    - use this prompt: `Write a 5-bullet executive summary covering scope, term, SLAs, penalties, and termination.`
    - set `returnCitations` to `true`

  The node's instance JSON must NOT contain a `model` block, and `typeVersion`
  must be exactly `"1.0"`. The instance `outputs.output` must use
  `source: "=response"` (NOT `=deepRagResult`). The output schema's nested
  fields are PascalCase: `content.Text` and `content.Citations[]` (each with
  `Ordinal`, `PageNumber`, `Source`, `Reference`).

  Wire the Summarize node's `output` port through to an End node and surface
  the synthesized text + citations as flow output variables `summary` and
  `citations`, mapped via:
    - `outputs.summary.source:   "=js:$vars.<dr-node-id>.output.content.Text"`
    - `outputs.citations.source: "=js:$vars.<dr-node-id>.output.content.Citations"`
  Note the PascalCase nested field names — lowercase `text`/`citations` would
  resolve to `undefined` at runtime.

  Do NOT run flow debug — just validate the flow.
  Before starting, follow the documented workflow steps exactly — in particular, note that the wire-level node type is
  `uipath.pattern.deep-rag` even though the canvas display name is "Summarize".

  This run is headless. No user is present and nobody will answer a question or
  grant an approval, so do not ask, do not pause, and do not wait for input.
  Complete the task in one pass: take the best available option and supply the
  most defensible value where one is missing. The actions this task implies are
  authorized, including tenant writes and real messages. Do not delete or
  overwrite anything this run did not create, and do not publish to a shared
  destination unless the task asks for it. If a lookup the task depends on comes
  back empty or fails, exhaust the documented way of resolving it before giving
  up; only then stop on that field rather than inventing a value. Record every
  decision, assumption, and blocked step in your final response.
success_criteria:
  # ── Flow file validity ─────────────────────────────────────────────────
  - type: run_command
    description: "uip maestro flow validate passes on the flow file"
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/_shared/validate_flow.py"
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  # ── Structural checks (node type, inputs, returnCitations boolean) ─────
  - type: run_command
    description: "Flow has a Summarize (deep-rag) node with prompt, attachment wired, and returnCitations=true"
    command: "python3 $TASK_DIR/check_summarize_flow.py"
    timeout: 30
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0
