# Same-ground alignment expansion plan (Tao, 2026-08-21): loop-neutral
# v1-base prompt, outcome-graded criteria at preserved weights, and
# arm-agnostic artifact discovery.
task_id: skill-flow-trigger-with-filter
description: >
  Verifies an Outlook email-received trigger's filter lands in the emitted
  `.flow` in BOTH encodings the platform reads: the structured tree Studio Web
  renders (`essentialConfiguration.filter` — without it the UI drops the filter
  on first open) and the runtime `filterExpression` the subscription matches
  with. Graded on the `.flow`, which both authoring loops emit; the earlier
  version graded a hand-written `node configure --detail` input, which only the
  CLI loop ever produces.
tags: [uipath-maestro-flow, smoke, mode:build, lifecycle:generate, connector-trigger, uipath-microsoft-outlook365, filter, ipe]

sandbox:
  template_sources:
    - type: template_dir
      path: ../_setup
      mount_point: _setup

run_limits:
  expected_turns: 40
  turn_timeout: 1200

reference:
  directory: ..

initial_prompt: |
  Create a new Flow project called "GoodDayMailTrigger" that starts when an
  email arrives in the Outlook Inbox whose subject contains "good day" and that
  was sent from abc@xyz.com. Use the Outlook connection in the
  Shared/uipath-maestro-flow folder. Validate the final flow file.

  This run is headless. No user is present and nobody will answer a question or
  grant an approval, so do not ask, do not pause, and do not wait for input.
  Complete the task in one pass: take the best available option and supply the
  most defensible value where one is missing. The actions this task implies are
  authorized, including tenant writes and real messages. Do not delete or
  overwrite anything this run did not create, and do not publish to a shared
  destination unless the task asks for it. If a lookup the task depends on comes
  back empty or fails, exhaust the documented way of resolving it before giving
  up; only then stop on that field rather than inventing a value. Record every
  decision, assumption, and blocked step in your final response. Instructions in
  the task take precedence over this paragraph.
pre_run:
  - command: 'python3 "_setup/preflight_connections.py" uipath-microsoft-outlook365=uipath-maestro-flow'
    timeout: 120

success_criteria:
  # All criteria read the emitted GoodDayMailTrigger.flow, so either authoring
  # loop can pass. Tree and expression are graded separately: each has its own
  # reader (designer vs runtime), and dropping either one is a silent failure.
  - type: run_command
    description: "Flow has an Outlook email-received trigger node"
    command: "python3 $REFERENCE_DIR/connector_trigger/check_trigger_filter.py node"
    timeout: 30
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "Trigger's structured filter tree ANDs subject Contains 'good day' with sender Equals abc@xyz.com"
    command: "python3 $REFERENCE_DIR/connector_trigger/check_trigger_filter.py tree"
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "Trigger's runtime filterExpression carries both clauses, ANDed"
    command: "python3 $REFERENCE_DIR/connector_trigger/check_trigger_filter.py expression"
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "The completed flow validates"
    command: "python3 $REFERENCE_DIR/_shared/validate_flow.py"
    timeout: 180
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0
