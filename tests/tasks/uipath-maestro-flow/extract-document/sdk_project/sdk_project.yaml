task_id: skill-flow-extract-document-sdk-project
description: >
  Integration: the user's flow is built from TypeScript source (`.flow-sdk/`)
  and they ask for an Extract document step. The agent adds it to the source
  with `dynamicExtract()` (no model) and compiles: compile gives the node its
  IDP processor key and writes the processor's resource file into the
  solution, so the flow validates with no CLI step afterwards. The rest of the
  flow is kept, apart from the edge the new step splits and the `end` node,
  which may gain the flow output that returns the extraction (step 6 of the
  skill's Extract document loop).

  No `flow debug`: extraction needs the IDP service.

tags: [uipath-maestro-flow, integration, mode:build, lifecycle:generate, shape:single-node, node:extract-document, studio-web-unsupported, studio-web-unsupported:sdk-source-project]

sandbox:
  template_sources:
    - type: template_dir
      path: ../_fixtures/PermitDesk
      mount_point: PermitDesk
reference:
  directory: ../..

initial_prompt: |
  My PermitDesk flow takes a permit document. Add an Extract document step
  that pulls out the permit number, the holder's name and the expiry date.
  Make sure what you build validates.

  This run is headless. No user is present and nobody will answer a question or
  grant an approval, so do not ask, do not pause, and do not wait for input.
  Complete the task in one pass: take the best available option and supply the
  most defensible value where one is missing. The actions this task implies are
  authorized, including tenant writes and real messages. Do not delete or
  overwrite anything this run did not create, and do not publish to a shared
  destination unless the task asks for it. Edit the flow the task names in place:
  that is the asked-for change, not an overwrite. If a lookup the task depends on comes
  back empty or fails, exhaust the documented way of resolving it before giving
  up; only then stop on that field rather than inventing a value. Record every
  decision, assumption, and blocked step in your final response. Instructions in
  the task take precedence over this paragraph.
success_criteria:
  - type: run_command
    description: "The source calls dynamicExtract() with no model; the compiled node reads the permit input, extracts permit number, holder name and expiry date, and has a processorKey whose idpProcessor resource file is in the solution"
    command: python3 $REFERENCE_DIR/extract-document/sdk_project/sdk_project_helper.py
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "The rest of PermitDesk is kept: every original node, variable and binding survives, only the one edge the new step splits may go, and only the end node may change (the flow output that returns the extraction)"
    command: >-
      for edge in 'start:output>logReceipt:input' 'logReceipt:success>end:input'; do
      python3 $REFERENCE_DIR/_shared/check_brownfield_preserved.py --original $REFERENCE_DIR/extract-document/_fixtures/PermitDesk/PermitDesk --project PermitDesk/PermitDesk --removed-edge "$edge" --changed-node end && exit 0;
      done; exit 1
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "PermitDesk.flow validates with no warnings"
    command: python3 $REFERENCE_DIR/_shared/validate_flow.py --no-warnings PermitDesk/PermitDesk/PermitDesk.flow
    timeout: 180
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

run_limits:
  expected_turns: 30
  max_turns: 60
  task_timeout: 1200
