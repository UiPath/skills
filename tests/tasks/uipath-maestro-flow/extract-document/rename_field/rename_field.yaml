task_id: skill-flow-extract-document-rename-field
description: >
  Smoke: the user renames a field in an existing Extract document taxonomy.
  Tests that the agent writes the whole taxonomy back with the field's stable
  id kept, and that nothing else in the taxonomy or the flow changes. The
  seeded flow fixes every id, so each check compares against a known value.

tags: [uipath-maestro-flow, smoke, mode:build, lifecycle:generate, shape:single-node, node:extract-document]

sandbox:
  template_sources:
    - type: template_dir
      path: ../_fixtures/InvoiceReader
      mount_point: InvoiceReader
    - type: template_dir
      path: ../../_setup/extraction_check_mock
  mock_path_dirs:
    - mocks
reference:
  directory: ../..

initial_prompt: |
  In my InvoiceReader flow, rename the Total field of the Extract document
  node's taxonomy to "Total Amount". Make sure the flow validates.

  This run is headless. No user is present and nobody will answer a question or
  grant an approval, so do not ask, do not pause, and do not wait for input.
  Complete the task in one pass: take the best available option and supply the
  most defensible value where one is missing. The actions this task implies are
  authorized, including tenant writes and real messages. Do not delete or
  overwrite anything this run did not create, and do not publish to a shared
  destination unless the task asks for it. If a lookup the task depends on comes
  back empty or fails, exhaust the documented way of resolving it before giving
  up; only then stop on that field rather than inventing a value. Record every
  decision, assumption, and blocked step in your final response. Instructions in
  the task take precedence over this paragraph.
success_criteria:
  - type: run_command
    description: "The renamed field \"Total Amount\" kept the id Total had"
    command: >-
      python3 $REFERENCE_DIR/_shared/check_extract_document.py --flow-name InvoiceReader fields
      '[{"name": "Total Amount", "id": "059158da-1564-4680-a208-ce02de660518"}]'
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "Apart from the rename, the taxonomy equals the seeded one: prompt, config, group, every field's type, instructions and id, $defs"
    command: >-
      python3 $REFERENCE_DIR/_shared/check_extract_document.py --flow-name InvoiceReader unchanged
      $REFERENCE_DIR/extract-document/_fixtures/InvoiceReader/InvoiceReader/InvoiceReader.flow
      'Total=Total Amount'
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "The other three fields kept their names and ids"
    command: >-
      python3 $REFERENCE_DIR/_shared/check_extract_document.py --flow-name InvoiceReader fields
      '[{"name": "Invoice Number", "id": "9fbb50a5-5b7a-442b-bc48-4d528c82e200"},
      {"name": "Invoice Date", "id": "9ad17b9e-17ce-4410-a4d8-2d19bec3f25d"},
      {"name": "Vendor Name", "id": "d246a961-e9bc-452a-9ff5-f86178bb535c"}]'
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "No field was added or dropped, and none is still named Total"
    command: >-
      python3 $REFERENCE_DIR/_shared/check_extract_document.py --flow-name InvoiceReader fields --only
      '[{"name": "Total Amount"}, {"name": "Invoice Number"}, {"name": "Invoice Date"}, {"name": "Vendor Name"}]'
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "The overall prompt and every group's and field's instructions survived the write"
    command: python3 $REFERENCE_DIR/_shared/check_extract_document.py --flow-name InvoiceReader has-instructions
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "$defs still holds the six built-in field types and nothing else"
    command: python3 $REFERENCE_DIR/_shared/check_extract_document.py --flow-name InvoiceReader defs --only
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "Every node but the Extract document node, and every edge, variable and definition, is unchanged"
    command: "python3 $REFERENCE_DIR/_shared/check_brownfield_preserved.py --original $REFERENCE_DIR/extract-document/_fixtures/InvoiceReader/InvoiceReader --project InvoiceReader/InvoiceReader --changed-node extractInvoice1"
    timeout: 30
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "uip maestro flow validate passes on InvoiceReader.flow with no warnings"
    command: python3 $REFERENCE_DIR/_shared/validate_flow.py --no-warnings
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

run_limits:
  expected_turns: 12
  max_turns: 30
  task_timeout: 900
