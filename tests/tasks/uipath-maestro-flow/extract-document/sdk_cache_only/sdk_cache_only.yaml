task_id: skill-flow-extract-document-sdk-cache-only
description: >
  Integration: the PermitDesk flow's `.flow-sdk/` holds only `bindings.json`,
  the SDK's cache, and no `PermitDesk.flow.ts`. Nothing compiles over the
  `.flow`, so the agent adds the Extract document node to PermitDesk itself
  rather than redirecting to a separate project the way `sdk_project` does.
  The node's wiring and taxonomy are graded by `explicit_node` and the taxonomy
  tasks.

  pre_run deletes the source the shared PermitDesk fixture ships, so the
  project starts with the cache alone.

tags: [uipath-maestro-flow, integration, mode:build, lifecycle:generate, shape:single-node, node:extract-document]

sandbox:
  template_sources:
    - type: template_dir
      path: ../_fixtures/PermitDesk
      mount_point: PermitDesk
    - type: template_dir
      path: flow-sdk-cache
      mount_point: PermitDesk/PermitDesk/.flow-sdk
reference:
  directory: ../..

pre_run:
  - command: 'rm PermitDesk/PermitDesk/.flow-sdk/PermitDesk.flow.ts'
    timeout: 30

initial_prompt: |
  My PermitDesk flow takes a permit document. Add an Extract document step
  that pulls out the permit number, the holder's name and the expiry date.
  Make sure what you build validates.

  This run is headless. No user is present and nobody will answer a question or
  grant an approval, so do not ask, do not pause, and do not wait for input.
  Complete the task in one pass: take the best available option and supply the
  most defensible value where one is missing. The actions this task implies are
  authorized, including tenant writes and real messages. Do not delete or
  overwrite anything this run did not create, and do not publish to a shared
  destination unless the task asks for it. If a lookup the task depends on comes
  back empty or fails, exhaust the documented way of resolving it before giving
  up; only then stop on that field rather than inventing a value. Record every
  decision, assumption, and blocked step in your final response. Instructions in
  the task take precedence over this paragraph.
success_criteria:
  - type: run_command
    description: "PermitDesk.flow itself holds an Extract document node and validates"
    command: >-
      grep -q '"type": *"uipath[.]ixp[.]extract-document-builder"' PermitDesk/PermitDesk/PermitDesk.flow &&
      python3 $REFERENCE_DIR/_shared/validate_flow.py --no-warnings PermitDesk/PermitDesk/PermitDesk.flow
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "No separate project was built for the node: no other Flow project holds an Extract document node"
    command: test -z "$(python3 $REFERENCE_DIR/extract-document/sdk_project/sdk_project_helper.py PermitDesk/PermitDesk)"
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "The node in PermitDesk reads its file from a flow input"
    command: python3 $REFERENCE_DIR/_shared/check_extract_document.py --flow-name PermitDesk file-ref
    timeout: 30
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 1.0

run_limits:
  expected_turns: 30
  max_turns: 60
  task_timeout: 1200
