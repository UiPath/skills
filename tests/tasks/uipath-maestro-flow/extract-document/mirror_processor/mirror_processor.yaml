task_id: skill-flow-extract-document-mirror-processor
description: >
  The user wants Extract Credit Note to run Extract Invoice's processor rather
  than define one of its own. Tests that the agent makes the node a read-only
  mirror: Extract Invoice's `processorKey` together with
  `inputs.processorReadOnly: true`. Either half alone fails validate: the key
  without the flag makes a second author of the same processor, and the flag
  without the key names nothing to run. No CLI command sets these inputs on an
  existing node, so the edit goes to the `.flow` itself.

  Extract Invoice and everything else in the flow stay as seeded, and Extract
  Credit Note keeps reading the credit note.

tags: [uipath-maestro-flow, integration, mode:build, lifecycle:generate, shape:single-node, node:extract-document]

sandbox:
  template_sources:
    - type: template_dir
      path: ../_fixtures/BillingDocs
      mount_point: BillingDocs
reference:
  directory: ../..

initial_prompt: |
  In my BillingDocs flow, make the Extract Credit Note node run Extract
  Invoice's processor instead of one of its own. Make sure the flow validates.

  This run is headless. No user is present and nobody will answer a question or
  grant an approval, so do not ask, do not pause, and do not wait for input.
  Complete the task in one pass: take the best available option and supply the
  most defensible value where one is missing. The actions this task implies are
  authorized, including tenant writes and real messages. Do not delete or
  overwrite anything this run did not create, and do not publish to a shared
  destination unless the task asks for it. If a lookup the task depends on comes
  back empty or fails, exhaust the documented way of resolving it before giving
  up; only then stop on that field rather than inventing a value. Record every
  decision, assumption, and blocked step in your final response. Instructions in
  the task take precedence over this paragraph.
success_criteria:
  - type: json_check
    description: "Extract Credit Note mirrors Extract Invoice's processor: the same processorKey, marked read-only"
    path: "BillingDocs/BillingDocs/BillingDocs.flow"
    assertions:
      # The source node's key in _fixtures/BillingDocs/BillingDocs/BillingDocs.flow.
      - expression: "nodes[?id=='extractCreditNote1'] | [0].inputs.processorKey"
        operator: equals
        expected: "3f6b2a9e-8c41-4d7a-9b25-61e0c4d8f713"
      - expression: "nodes[?id=='extractCreditNote1'] | [0].inputs.processorReadOnly"
        operator: equals
        expected: true
    weight: 3.0
    pass_threshold: 1.0

  - type: json_check
    description: "Extract Credit Note keeps reading the credit note file input"
    path: "BillingDocs/BillingDocs/BillingDocs.flow"
    assertions:
      - expression: "nodes[?id=='extractCreditNote1'] | [0].inputs.fileRef"
        operator: equals
        expected: "=js:$vars.start.output.creditNote"
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "Every node but Extract Credit Note, Extract Invoice included, and every edge, variable and definition, is unchanged"
    command: "python3 $REFERENCE_DIR/_shared/check_brownfield_preserved.py --original $REFERENCE_DIR/extract-document/_fixtures/BillingDocs/BillingDocs --project BillingDocs/BillingDocs --changed-node extractCreditNote1"
    timeout: 30
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "uip maestro flow validate passes with no warnings: no second author of Extract Invoice's processor, and no read-only node without a key"
    command: python3 $REFERENCE_DIR/_shared/validate_flow.py --no-warnings
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

run_limits:
  expected_turns: 10
  max_turns: 25
  task_timeout: 900
