task_id: skill-flow-extract-document-check-unknown
description: >
  Smoke: the user names the Extract document node and the tenant check answers
  `Unknown`. The skill counts `Unknown` as no answer: in a headless run it adds
  the node anyway and reports that the check settled nothing. Tests that the
  agent runs `uip maestro flow extraction check`, does not stop as it would on
  `FeatureDisabled`, and leaves a flow with
  `uipath.ixp.extract-document-builder` that validates.

  The `uip` mock in `mock_template/mocks/` answers `extraction check` with
  `Unknown` and passes every other call to the real CLI.

tags: [uipath-maestro-flow, smoke, mode:build, lifecycle:generate, shape:single-node, node:extract-document]

sandbox:
  template_sources:
    - type: template_dir
      path: mock_template
  mock_path_dirs:
    - mocks

reference:
  directory: ../..

initial_prompt: |
  Build a UiPath Flow called "LeaseReader" that takes a signed lease agreement
  PDF as input and uses the Extract document node to pull out the tenant's
  name, the lease start date and the monthly rent. Make sure the flow validates.

  This run is headless. No user is present and nobody will answer a question or
  grant an approval, so do not ask, do not pause, and do not wait for input.
  Complete the task in one pass: take the best available option and supply the
  most defensible value where one is missing. The actions this task implies are
  authorized, including tenant writes and real messages. Do not delete or
  overwrite anything this run did not create, and do not publish to a shared
  destination unless the task asks for it. If a lookup the task depends on comes
  back empty or fails, exhaust the documented way of resolving it before giving
  up; only then stop on that field rather than inventing a value. Record every
  decision, assumption, and blocked step in your final response. Instructions in
  the task take precedence over this paragraph.
success_criteria:
  - type: skill_triggered
    skill_name: "uipath-maestro-flow"
    expected_skill: "uipath-maestro-flow"
    description: "Agent invoked the uipath-maestro-flow skill"
    weight: 1.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent ran uip maestro flow extraction check"
    tool_name: "Bash"
    command_pattern: 'uip\s+maestro\s+flow\s+extraction\s+check\b'
    min_count: 1
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "LeaseReader.flow holds an Extract document node"
    command: "python3 $REFERENCE_DIR/_shared/flow_contains.py --flow-name LeaseReader '\"uipath.ixp.extract-document-builder\"'"
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "No other uipath.ixp.* node (published model, processor or a second Extract document node)"
    command: python3 $REFERENCE_DIR/_shared/check_extract_document.py --flow-name LeaseReader no-other-ixp
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "uip maestro flow validate passes on LeaseReader.flow with no warnings"
    command: python3 $REFERENCE_DIR/_shared/validate_flow.py --no-warnings
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

run_limits:
  expected_turns: 20
  max_turns: 40
  turn_timeout: 900
  task_timeout: 900
