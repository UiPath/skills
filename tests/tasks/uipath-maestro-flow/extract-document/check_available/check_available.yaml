task_id: skill-flow-extract-document-check-available
description: >
  Smoke: the user names the Extract document node and the tenant check answers
  `Available`. Tests that the agent runs `uip maestro flow extraction check`
  before it creates the node, then adds `uipath.ixp.extract-document-builder`
  and leaves a flow that validates.

  The verdict is faked: the `uip` mock (`_setup/extraction_check_mock`)
  answers `extraction check` with the status pre_run writes and passes every
  other call to the real CLI, logging each call to `mocks/calls.log`. That
  keeps the grade off the CI tenant's configuration and off the CLI release
  that ships the command. The node's file input, edges and taxonomy are graded
  by explicit_node and the taxonomy tasks.

tags: [uipath-maestro-flow, smoke, mode:build, lifecycle:generate, shape:single-node, node:extract-document]

sandbox:
  template_sources:
    - type: template_dir
      path: ../../_setup/extraction_check_mock
  mock_path_dirs:
    - mocks

reference:
  directory: ../..

pre_run:
  - command: "printf Available > mocks/extraction-status"
    timeout: 10

initial_prompt: |
  Build a UiPath Flow called "PermitReader" that takes a building permit PDF as
  input and uses the Extract document node to pull out the permit number, the
  issue date and the permit holder's name. Make sure the flow validates.

  This run is headless. No user is present and nobody will answer a question or
  grant an approval, so do not ask, do not pause, and do not wait for input.
  Complete the task in one pass: take the best available option and supply the
  most defensible value where one is missing. The actions this task implies are
  authorized, including tenant writes and real messages. Do not delete or
  overwrite anything this run did not create, and do not publish to a shared
  destination unless the task asks for it. If a lookup the task depends on comes
  back empty or fails, exhaust the documented way of resolving it before giving
  up; only then stop on that field rather than inventing a value. Record every
  decision, assumption, and blocked step in your final response. Instructions in
  the task take precedence over this paragraph.
success_criteria:
  - type: skill_triggered
    skill_name: "uipath-maestro-flow"
    expected_skill: "uipath-maestro-flow"
    description: "Advisory: agent invoked the uipath-maestro-flow skill"
    weight: 1.0
    pass_threshold: 0.0

  - type: file_matches_regex
    description: "uip maestro flow extraction check ran before the Extract document node was created"
    path: "mocks/calls.log"
    pattern: >-
      (?ms)^uip maestro flow extraction check\b.*^uip maestro flow nodes (?:create|add)\b[^\n]*uipath\.ixp\.extract-document-builder
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "PermitReader.flow holds an Extract document node"
    command: "python3 $REFERENCE_DIR/_shared/flow_contains.py --flow-name PermitReader '\"uipath.ixp.extract-document-builder\"'"
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "No other uipath.ixp.* node (published model, processor or a second Extract document node)"
    command: python3 $REFERENCE_DIR/_shared/check_extract_document.py --flow-name PermitReader no-other-ixp
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "uip maestro flow validate passes on PermitReader.flow with no warnings"
    command: python3 $REFERENCE_DIR/_shared/validate_flow.py --no-warnings
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

run_limits:
  expected_turns: 20
  max_turns: 40
  turn_timeout: 900
  task_timeout: 900
