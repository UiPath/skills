task_id: skill-flow-extract-document-fix-rejected-taxonomy
description: >
  Integration: the user supplies a taxonomy file that `nodes schema set`
  refuses with exit 3. It has a nested group whose parent is missing, a `$ref`
  to a field type it never defines, and a field name over 64 characters, all
  listed in `Data.Issues`. Tests that the agent fixes what the write rejects
  and keeps the user's design: their fields, types, nesting, prompt and
  instructions, with only the built-in field types.

  No `flow debug`: a CLI-authored Extract document node extracts nothing
  until the flow is saved once in Studio Web.

tags: [uipath-maestro-flow, integration, mode:build, lifecycle:generate, shape:single-node, node:extract-document]

sandbox:
  template_sources:
    - type: template_dir
      path: ../_fixtures/LicenceReader
      mount_point: LicenceReader
    - type: template_dir
      path: ../_fixtures/licence_taxonomy
reference:
  directory: ../..

initial_prompt: |
  Apply the taxonomy I wrote in ./licence_taxonomy.json to the Extract document
  node in my LicenceReader flow. Make sure the flow validates.

  This run is headless. No user is present and nobody will answer a question or
  grant an approval, so do not ask, do not pause, and do not wait for input.
  Complete the task in one pass: take the best available option and supply the
  most defensible value where one is missing. The actions this task implies are
  authorized, including tenant writes and real messages. Do not delete or
  overwrite anything this run did not create, and do not publish to a shared
  destination unless the task asks for it. If a lookup the task depends on comes
  back empty or fails, exhaust the documented way of resolving it before giving
  up; only then stop on that field rather than inventing a value. Record every
  decision, assumption, and blocked step in your final response. Instructions in
  the task take precedence over this paragraph.
success_criteria:
  - type: run_command
    description: "The node holds the user's seven fields and no others, each with the user's type and instructions; the over-long year-of-hatch field is kept under a shorter name, its instructions starting with the user's and free to carry the words cut from the name"
    command: >-
      python3 $REFERENCE_DIR/_shared/check_extract_document.py --flow-name LicenceReader fields --only
      '[{"name": "Licence Number", "type": "ft-exact-text", "instructions": "The licence number exactly as printed in the licence number box."},
      {"name": "Licence Expiry", "type": "ft-date", "instructions": "The date the licence expires, not the date it was issued."},
      {"name": "Falconer", "instructions": "The name of the licence holder."},
      {"name": "Licence Status", "type": "ft-inferred-text", "instructions": "The status printed on the licence, such as ACTIVE."},
      {"name": "Ring Number", "type": "ft-exact-text", "instructions": "The ring number fitted to the bird."},
      {"name": "Species", "type": "ft-inferred-text", "instructions": "The species of the bird, as printed."},
      {"name_matches": "hatch", "type": "ft-number", "instructions_matches": "^The year the bird hatched"}]'
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "The bird's fields sit in a group nested by name under the group that holds the licence fields (the parent renamed to Licence, or the child to Licence Details > ...)"
    command: >-
      python3 $REFERENCE_DIR/_shared/check_extract_document.py --flow-name LicenceReader fields
      '[{"name": "Licence Number", "group": "Licence"}, {"name": "Ring Number", "group_matches": "^Licence > "},
      {"name": "Species", "group_matches": "^Licence > "}, {"name_matches": "hatch", "group_matches": "^Licence > "}]' ||
      python3 $REFERENCE_DIR/_shared/check_extract_document.py --flow-name LicenceReader fields
      '[{"name": "Licence Number", "group": "Licence Details"}, {"name": "Ring Number", "group_matches": "^Licence Details > "},
      {"name": "Species", "group_matches": "^Licence Details > "}, {"name_matches": "hatch", "group_matches": "^Licence Details > "}]'
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 1.0

  - type: json_check
    description: "The user's overall prompt and both group instructions were carried over, not rewritten"
    path: "LicenceReader/LicenceReader/LicenceReader.flow"
    assertions:
      - expression: "nodes[?id=='extractLicence1'] | [0].inputs.schemaDocument.prompt"
        operator: equals
        expected: "Extract the licence details as printed on the form."
      - expression: "contains(values(nodes[?id=='extractLicence1'] | [0].inputs.schemaDocument.outputSchema.properties)[].description, 'The licence form, which appears once per document.')"
        operator: equals
        expected: true
      - expression: "contains(values(nodes[?id=='extractLicence1'] | [0].inputs.schemaDocument.outputSchema.properties)[].description, 'The bird the licence covers.')"
        operator: equals
        expected: true
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "The undefined type was replaced by a built-in one: $defs holds the six built-in field types and nothing else"
    command: python3 $REFERENCE_DIR/_shared/check_extract_document.py --flow-name LicenceReader defs --only
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "Every node but the Extract document node, and every edge, variable and definition, is unchanged"
    command: "python3 $REFERENCE_DIR/_shared/check_brownfield_preserved.py --original $REFERENCE_DIR/extract-document/_fixtures/LicenceReader/LicenceReader --project LicenceReader/LicenceReader --changed-node extractLicence1"
    timeout: 30
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "uip maestro flow validate passes with no warnings: the fixed taxonomy went through nodes schema set (a hand edit leaves the fields without ids)"
    command: python3 $REFERENCE_DIR/_shared/validate_flow.py --no-warnings
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

run_limits:
  expected_turns: 15
  max_turns: 40
  task_timeout: 900
