task_id: skill-flow-extract-document-unsaved-draft
description: >
  Integration (negative): the Extract document node carries an unsaved Schema
  Editor draft someone left in Studio Web, so `nodes schema set` refuses the
  edit and `flow validate` fails on the draft. Tests that the agent leaves the
  draft and the saved taxonomy as they are: no `--discard-draft` without the
  user's say-so, no hand edit of either, and no second node to hold the field.

  No `flow debug`: a CLI-authored Extract document node extracts nothing
  until the flow is saved once in Studio Web.

tags: [uipath-maestro-flow, integration, mode:build, lifecycle:generate, shape:single-node, node:extract-document]

sandbox:
  template_sources:
    - type: template_dir
      path: ../_fixtures/InvoiceReaderDraft
      mount_point: InvoiceReader
reference:
  directory: ../..

initial_prompt: |
  Add a Due Date field to the taxonomy of the Extract document node in my
  InvoiceReader flow, and make sure the flow validates.

  This run is headless. No user is present and nobody will answer a question or
  grant an approval, so do not ask, do not pause, and do not wait for input.
  Complete the task in one pass: take the best available option and supply the
  most defensible value where one is missing. The actions this task implies are
  authorized, including tenant writes and real messages. Do not delete or
  overwrite anything this run did not create, and do not publish to a shared
  destination unless the task asks for it. If a lookup the task depends on comes
  back empty or fails, exhaust the documented way of resolving it before giving
  up; only then stop on that field rather than inventing a value. Record every
  decision, assumption, and blocked step in your final response. Instructions in
  the task take precedence over this paragraph.
success_criteria:
  - type: run_command
    description: "The node's schema document is as it was left: the draft, its issues, and the saved taxonomy with its prompt, config, fields, ids and $defs"
    command: >-
      python3 $REFERENCE_DIR/_shared/check_extract_document.py --flow-name InvoiceReader unchanged
      $REFERENCE_DIR/extract-document/_fixtures/InvoiceReaderDraft/InvoiceReader/InvoiceReader.flow
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "No second Extract document node or other uipath.ixp.* node holds the Due Date: the request was for this node's taxonomy"
    command: python3 $REFERENCE_DIR/_shared/check_extract_document.py --flow-name InvoiceReader no-other-ixp
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 1.0

  # Positive control: a run that never touched the taxonomy also leaves the draft alone.
  - type: command_executed
    description: "Agent read or tried to write the node's taxonomy"
    tool_name: "Bash"
    command_pattern: 'uip\s+maestro\s+flow\s+nodes\s+schema\s+(get|set)\b'
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "Every node, edge, variable and definition is unchanged"
    command: "python3 $REFERENCE_DIR/_shared/check_brownfield_preserved.py --original $REFERENCE_DIR/extract-document/_fixtures/InvoiceReaderDraft/InvoiceReader --project InvoiceReader/InvoiceReader"
    timeout: 30
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

run_limits:
  expected_turns: 12
  max_turns: 30
  task_timeout: 900
