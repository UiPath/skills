task_id: skill-flow-extract-document-taxonomy-from-request
description: >
  Smoke: the user names the Extract document node, the fields, and one rule
  about one field. Tests that the agent writes the taxonomy with `nodes schema
  set`: the fields with fitting types, instructions throughout, and the user's
  rule in the field's instructions, and `flow validate` passing on the
  result. Only the taxonomy is graded: the node and its wiring are graded by
  `explicit_node`.

tags: [uipath-maestro-flow, smoke, mode:build, lifecycle:generate, shape:single-node, node:extract-document]

sandbox:
  template_sources:
    - type: template_dir
      path: ../../_setup/extraction_check_mock
  mock_path_dirs:
    - mocks

reference:
  directory: ../..

initial_prompt: |
  Build a UiPath Flow called "InvoiceFields" that takes an invoice document as
  input and uses the Extract document node to pull out the vendor name, invoice
  number, invoice date and total amount. Our invoice numbers are printed with a
  "No." prefix that is not part of the number. Make sure the flow validates.

  This run is headless. No user is present and nobody will answer a question or
  grant an approval, so do not ask, do not pause, and do not wait for input.
  Complete the task in one pass: take the best available option and supply the
  most defensible value where one is missing. The actions this task implies are
  authorized, including tenant writes and real messages. Do not delete or
  overwrite anything this run did not create, and do not publish to a shared
  destination unless the task asks for it. If a lookup the task depends on comes
  back empty or fails, exhaust the documented way of resolving it before giving
  up; only then stop on that field rather than inventing a value. Record every
  decision, assumption, and blocked step in your final response. Instructions in
  the task take precedence over this paragraph.
success_criteria:
  - type: command_executed
    description: "Agent wrote the taxonomy with nodes schema set"
    tool_name: "Bash"
    command_pattern: 'uip\s+maestro\s+flow\s+nodes\s+schema\s+set\b'
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "The taxonomy has fields for the vendor name, invoice number, invoice date and total"
    command: >-
      python3 $REFERENCE_DIR/_shared/check_extract_document.py --flow-name InvoiceFields fields
      '[{"name_matches": "vendor|supplier|seller"}, {"name_matches": "number|(^|[^a-z])(no|id)([^a-z]|$)|#"},
      {"name_matches": "date"}, {"name_matches": "total|amount"}]'
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "The invoice date is typed as a date and the total as a monetary quantity"
    command: >-
      python3 $REFERENCE_DIR/_shared/check_extract_document.py --flow-name InvoiceFields fields
      '[{"name_matches": "date", "type": "ft-date"}, {"name_matches": "total|amount", "type": "ft-monetary-quantity"}]'
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "The user's rule about the No. prefix is in the invoice number's instructions"
    command: >-
      python3 $REFERENCE_DIR/_shared/check_extract_document.py --flow-name InvoiceFields fields
      '[{"name_matches": "number|(^|[^a-z])(no|id)([^a-z]|$)|#", "instructions_matches": "No[.]|prefix"}]'
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "The overall prompt, every group and every field carry instructions"
    command: python3 $REFERENCE_DIR/_shared/check_extract_document.py --flow-name InvoiceFields has-instructions
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "The taxonomy on disk is well formed: uip maestro flow validate passes on InvoiceFields.flow with no warnings (a rejected last set or a hand edit fails here)"
    command: python3 $REFERENCE_DIR/_shared/validate_flow.py --no-warnings
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

run_limits:
  expected_turns: 25
  max_turns: 40
  task_timeout: 1200
