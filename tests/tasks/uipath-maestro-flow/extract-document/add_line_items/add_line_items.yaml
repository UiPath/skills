task_id: skill-flow-extract-document-add-line-items
description: >
  Integration: the user extends an existing Extract document taxonomy with a
  table and a header field. Tests that the agent models the line items as a
  repeating (array) group nested under the header group by name, adds the
  header field, and sends the whole document back: every existing group,
  field, id, instruction and built-in field type survives the write.

  No `flow debug`: a CLI-authored Extract document node extracts nothing
  until the flow is saved once in Studio Web.

tags: [uipath-maestro-flow, integration, mode:build, lifecycle:generate, shape:single-node, node:extract-document]

sandbox:
  template_sources:
    - type: template_dir
      path: ../_fixtures/InvoiceReader
      mount_point: InvoiceReader
    - type: template_dir
      path: ../../_setup/extraction_check_mock
  mock_path_dirs:
    - mocks
reference:
  directory: ../..

# The skill runs `uip maestro flow extraction check` before it authors this node.
# The mock answers it with Available, so the grade does not depend on the
# tenant's configuration or on the CLI release that ships the command.
pre_run:
  - command: "printf Available > mocks/extraction-status"
    timeout: 10

initial_prompt: |
  Extend the Extract document node in my InvoiceReader flow so it also
  extracts every line item on the invoice (its description, quantity and line
  amount) and the PO number from the invoice header. Make sure the flow
  validates.

  This run is headless. No user is present and nobody will answer a question or
  grant an approval, so do not ask, do not pause, and do not wait for input.
  Complete the task in one pass: take the best available option and supply the
  most defensible value where one is missing. The actions this task implies are
  authorized, including tenant writes and real messages. Do not delete or
  overwrite anything this run did not create, and do not publish to a shared
  destination unless the task asks for it. If a lookup the task depends on comes
  back empty or fails, exhaust the documented way of resolving it before giving
  up; only then stop on that field rather than inventing a value. Record every
  decision, assumption, and blocked step in your final response. Instructions in
  the task take precedence over this paragraph.
success_criteria:
  - type: run_command
    description: "A repeating (array) group holds the line-item quantity, amount and description"
    command: >-
      python3 $REFERENCE_DIR/_shared/check_extract_document.py --flow-name InvoiceReader fields
      '[{"name_matches": "quant|qty|units", "repeats": true}, {"name_matches": "amount|total|price", "repeats": true},
      {"name_matches": "desc|item|product", "repeats": true}]'
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "The line items are nested under the Invoice group by name (\"Invoice > ...\")"
    command: >-
      python3 $REFERENCE_DIR/_shared/check_extract_document.py --flow-name InvoiceReader fields
      '[{"name_matches": "quant|qty|units", "group_matches": "^Invoice > "},
      {"name_matches": "amount|total|price", "group_matches": "^Invoice > "},
      {"name_matches": "desc|item|product", "group_matches": "^Invoice > "}]'
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "A PO number field was added to the Invoice group"
    command: >-
      python3 $REFERENCE_DIR/_shared/check_extract_document.py --flow-name InvoiceReader fields
      '[{"name_matches": "(^|[^a-z])p[.]?o([^a-z]|$)|purchase order", "group": "Invoice"}]'
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "Nothing seeded was lost or changed: groups, fields, ids, types, instructions, config and $defs; only new groups and fields were added (the overall prompt may be broadened)"
    command: "python3 $REFERENCE_DIR/_shared/check_extract_document.py --flow-name InvoiceReader extends $REFERENCE_DIR/extract-document/_fixtures/InvoiceReader/InvoiceReader/InvoiceReader.flow"
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "The overall prompt, and every group and field, old and new, carries instructions"
    command: python3 $REFERENCE_DIR/_shared/check_extract_document.py --flow-name InvoiceReader has-instructions
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "Every node but the Extract document node, and every edge, variable and definition, is unchanged"
    command: "python3 $REFERENCE_DIR/_shared/check_brownfield_preserved.py --original $REFERENCE_DIR/extract-document/_fixtures/InvoiceReader/InvoiceReader --project InvoiceReader/InvoiceReader --changed-node extractInvoice1"
    timeout: 30
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "uip maestro flow validate passes with no warnings: the taxonomy went through nodes schema set (a hand edit leaves the new fields without ids)"
    command: python3 $REFERENCE_DIR/_shared/validate_flow.py --no-warnings
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

run_limits:
  expected_turns: 15
  max_turns: 40
  task_timeout: 900
