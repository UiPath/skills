task_id: skill-flow-voice-outbound-call
description: >
  Outbound voice topology whose prompt reads flow data — the full outbound
  build (create-outgoing-call -> uipath.agent.voice -> end-call, `callContext`
  into both, an inline conversational agent whose agent.json carries
  settings.voice) plus the input contract on top. The trigger's customer name
  and amount must both reach the voice agent's system prompt, which needs four
  pieces aligned: node `agentInputVariables[]` (delivery), agent.json
  `inputSchema.properties` (contract), `{{input.<key>}}` in `messages[].content`
  (resolution), and the trigger-associated globals the bindings resolve against.
  Delivery is the piece only `flow pack` reads: omit it and `flow debug`
  back-fills from `inputSchema`, so a published call is the first place the
  inputs go missing. Also catches a bare `$vars.…` left in prompt text, which
  nothing rewrites and the model receives literally. Fully offline — init /
  author / validate need no login.
tags: [uipath-maestro-flow, smoke, mode:build, lifecycle:generate, shape:multi-node, feature:conversational]

run_limits:
  expected_turns: 34
  max_turns: 80
  # turn_timeout is the real budget: a single-shot task runs the whole agent
  # loop in one communicate() call, so raising task_timeout above it does
  # nothing (the orchestrator warns when you try). 900 is what both
  # default.yaml and smoke.yaml set, and it clears this build with room —
  # the verified run took 535s for the longest voice topology plus the
  # four-piece input contract.
  turn_timeout: 900

initial_prompt: |
  Build a UiPath Flow project named "PaymentReminderPersonalized" that places an
  outbound phone call, has an AI agent hold the conversation, and hangs up when
  it is over.

  The agent must greet the person by name and state the amount owed, both taken
  from the flow's inputs rather than hardcoded in the prompt: the flow is started
  with a customer name and an outstanding amount, and the agent's system prompt
  has to read those two values.

  This sandbox has no UiPath tenant and is not logged in, so:
  - Use placeholder E.164 numbers for the calling and destination numbers —
    do not look up or provision real ones.
  - Do NOT run anything that needs a live connection, and do NOT pack, deploy,
    or place a real call. In particular, do not run `uip maestro flow debug`.

  The task is NOT complete until `uip maestro flow validate` passes on the
  generated flow.

# Every criterion discovers the project dynamically: `flow init` wraps it in a
# `<Name>Solution/` the prompt does not pin, so a hardcoded `path:` would score
# 0.0 on a valid build (#2213).
success_criteria:
  - type: run_command
    description: "uip maestro flow validate passes on the generated flow"
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/_shared/validate_flow.py"
    timeout: 60
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  # --min-inputs 2 because the prompt supplies BOTH a name and an amount. The
  # four-piece contract is satisfiable with one wired input, so without the
  # count the second value ships ungraded.
  - type: run_command
    description: "Both prompt inputs are wired end to end: node binding -> inputSchema -> {{input.<key>}} -> declared global"
    command: "python3 $TASK_DIR/check_voice_flow.py prompt-inputs --min-inputs 2"
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "Flow contains the three outbound voice node types"
    command: >-
      python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/_shared/flow_contains.py
      '"uipath.conversational.voice.create-outgoing-call"'
      '"uipath.agent.voice"'
      '"uipath.conversational.voice.end-call"'
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "callContext from the create-outgoing-call node is bound into BOTH the voice agent and the end-call node"
    command: "python3 $TASK_DIR/check_voice_flow.py call-context"
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "Inline agent.json carries settings.voice and stays conversational"
    command: "python3 $TASK_DIR/check_voice_flow.py agent-voice"
    timeout: 30
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 1.0

  # Advisory (pass_threshold: 0) — record convention adherence without docking
  # an agent that reaches the same graded outcome another way.
  - type: command_executed
    description: "Advisory: agent scaffolded the voice agent with uip agent init --inline-in-flow --conversational"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+agent\s+init\s+.*--conversational'
    min_count: 1
    weight: 1.0
    pass_threshold: 0

  - type: command_executed
    description: "Advisory: agent rebuilt contentTokens with uip agent refresh --inline-in-flow"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+agent\s+refresh\s+.*--inline-in-flow'
    min_count: 1
    weight: 1.0
    pass_threshold: 0

  - type: command_executed
    description: "Advisory: agent used --output json on uip commands"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+.*--output\s+json'
    min_count: 1
    weight: 1.0
    pass_threshold: 0
