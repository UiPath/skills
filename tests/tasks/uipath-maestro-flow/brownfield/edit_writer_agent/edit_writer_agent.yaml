task_id: skill-flow-brownfield-edit-writer-agent
description: >
  Brownfield edit of a Flow the product wrote, not the SDK: the DevCon
  BillingDisputeResolution solution exactly as the classic Flow skill built it
  on the 2026-09-29 nightly. The agent changes one inline agent's instructions,
  which live in its `agent.json` sidecar, while the other agent and its context
  index `resource.json` must come through untouched. Graded offline on purpose:
  validate, the new instruction plus the old ones, and that every other node,
  edge, binding, variable, agent sidecar and canvas position is unchanged. No
  flow debug, because what is under test is what the edit did to the files; a
  debug run would spend IxP, agent and API workflow calls without grading that.
tags: [uipath-maestro-flow, integration, mode:build, lifecycle:edit, shape:multi-node, node:inline-agent]

run_limits:
  turn_timeout: 2400
  task_timeout: 2400

sandbox:
  template_sources:
    - type: template_dir
      path: ../fixture

reference:
  directory: ../..

initial_prompt: |
  BillingDisputeResolution/ is an existing solution with one Flow project of
  the same name. The flow is in use, so change only what is asked and leave
  everything else as it is, including the other agent, connections and canvas
  layout.

  Update the Resolution Writer Agent's instructions: the email must also tell
  the customer that the credit will appear on their next statement within 5
  business days. Keep its other instructions as they are.

  The change is done when `uip maestro flow validate` passes on
  BillingDisputeResolution/BillingDisputeResolution/BillingDisputeResolution.flow.
  The flow does not need a run against the tenant.

  This run is headless. No user is present and nobody will answer a question or
  grant an approval, so do not ask, do not pause, and do not wait for input.
  Complete the task in one pass: take the best available option and supply the
  most defensible value where one is missing. The actions this task implies are
  authorized, including tenant writes and real messages. Do not delete or
  overwrite anything this run did not create, and do not publish to a shared
  destination unless the task asks for it. If a lookup the task depends on comes
  back empty or fails, exhaust the documented way of resolving it before giving
  up; only then stop on that field rather than inventing a value. Record every
  decision, assumption, and blocked step in your final response. Instructions in
  the task take precedence over this paragraph.
success_criteria:
  - type: run_command
    description: "uip maestro flow validate passes on the edited flow"
    command: "python3 $REFERENCE_DIR/_shared/validate_flow.py BillingDisputeResolution/BillingDisputeResolution/BillingDisputeResolution.flow"
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "The writer agent's system prompt adds the next-statement, 5-business-day line, keeps every existing line in both prompt copies, and nothing else in its agent.json changes"
    command: "python3 $REFERENCE_DIR/brownfield/check_brownfield_edit.py writer-prompt --original $REFERENCE_DIR/brownfield/fixture/BillingDisputeResolution/BillingDisputeResolution --project BillingDisputeResolution/BillingDisputeResolution"
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "The .flow, the analyst agent and its context index resource are unchanged"
    command: "python3 $REFERENCE_DIR/_shared/check_brownfield_preserved.py --original $REFERENCE_DIR/brownfield/fixture/BillingDisputeResolution/BillingDisputeResolution --project BillingDisputeResolution/BillingDisputeResolution --changed-agent e6360c37-75b3-4315-b63e-afe9815dd65c"
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "No original node moves: the edit adds none"
    command: "python3 $REFERENCE_DIR/_shared/check_brownfield_preserved.py --aspect layout --original $REFERENCE_DIR/brownfield/fixture/BillingDisputeResolution/BillingDisputeResolution --project BillingDisputeResolution/BillingDisputeResolution"
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0
