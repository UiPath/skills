task_id: skill-flow-brownfield-swap-connection
description: >
  Brownfield connection swap (UV-18367). TicketTriage is a Jira search flow
  whose .flow has no top-level bindings[], so validate starts with two
  UNRESOLVED_BINDING warnings, as in the reported session. The agent moves the
  Jira step to the connection in Shared/uipath-maestro-flow. Graded on the
  swapped node and its bindings[] rows, a warning-free validate, the
  decompile/merge loop, an unchanged canvas, and a Bash-call budget: the
  reported session spent ~20 calls on a three-command change. No flow debug:
  what is under test is the file the swap writes, and the grader checks the
  connection against the tenant. Unlike bindings/reconfigure_different_connection
  (two configures of a new node), this edits an existing .flow that lacks bindings[].
tags: [uipath-maestro-flow, integration, mode:build, lifecycle:generate, shape:multi-node, connector]

run_limits:
  max_turns: 40
  turn_timeout: 1200
  task_timeout: 1200

sandbox:
  template_sources:
    - type: template_dir
      path: ../fixture_ticket_triage
    - type: template_dir
      path: ../../_setup
      mount_point: _setup

reference:
  directory: ../..

pre_run:
  - command: 'python3 "_setup/preflight_connections.py" uipath-atlassian-jira=uipath-maestro-flow'
    timeout: 120

initial_prompt: |
  TicketTriageSolution/ is an existing solution with one Flow project,
  TicketTriage. Switch the flow's Jira connection to the Jira connection in the
  Shared/uipath-maestro-flow folder. Change nothing else.

  The change is done when `uip maestro flow validate` passes on
  TicketTriageSolution/TicketTriage/TicketTriage.flow. The flow does not need
  a run against the tenant.

  This run is headless. No user is present and nobody will answer a question or
  grant an approval, so do not ask, do not pause, and do not wait for input.
  Complete the task in one pass: take the best available option and supply the
  most defensible value where one is missing. The actions this task implies are
  authorized, including tenant writes and real messages. Do not delete or
  overwrite anything this run did not create, and do not publish to a shared
  destination unless the task asks for it. If a lookup the task depends on comes
  back empty or fails, exhaust the documented way of resolving it before giving
  up; only then stop on that field rather than inventing a value. Record every
  decision, assumption, and blocked step in your final response. Instructions in
  the task take precedence over this paragraph.
success_criteria:
  - type: run_command
    description: "uip maestro flow validate passes with no warnings (no UNRESOLVED_BINDING left)"
    command: "python3 $REFERENCE_DIR/_shared/validate_flow.py --no-warnings TicketTriageSolution/TicketTriage/TicketTriage.flow"
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "fetchTickets and its bindings[] rows use the Jira connection in Shared/uipath-maestro-flow; the old ids are gone"
    command: "python3 $REFERENCE_DIR/brownfield/check_brownfield_edit.py connection-swap --original $REFERENCE_DIR/brownfield/fixture_ticket_triage/TicketTriageSolution/TicketTriage --project TicketTriageSolution/TicketTriage"
    timeout: 150
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "The .flow was written by uip maestro flow merge, not edited by hand"
    command: "python3 $REFERENCE_DIR/_shared/check_brownfield_preserved.py --aspect merged --original $REFERENCE_DIR/brownfield/fixture_ticket_triage/TicketTriageSolution/TicketTriage --project TicketTriageSolution/TicketTriage"
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "No node moved on the canvas"
    command: "python3 $REFERENCE_DIR/_shared/check_brownfield_preserved.py --aspect layout --original $REFERENCE_DIR/brownfield/fixture_ticket_triage/TicketTriageSolution/TicketTriage --project TicketTriageSolution/TicketTriage"
    timeout: 30
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "The swap takes at most 12 Bash calls"
    tool_name: "Bash"
    command_pattern: '.'
    max_count: 12
    weight: 2.0
    pass_threshold: 1.0
