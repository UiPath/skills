task_id: skill-flow-ixp-e2e-build-mechanics
description: >
  E2E (Flow → IXP build mechanics, RE-13543): the second half of the handoff
  chain. The user asks for a flow over supplied documents AND says outright
  that no extractor exists yet, so the agent must create the project from those
  documents, deploy a trained version to an Orchestrator folder (what puts it
  in the Maestro flow registry — `projects publish` is not required), then
  resume the flow and wire the resulting node.

  Naming the extractor as missing is the point, not a shortcut. The DECISION —
  noticing the prerequisite from a request that never mentions it — belongs to
  e2e_03_project_creation_handoff.yaml, which needs its fixture domain to stay
  uncovered. Saying it outright here removes that precondition from THIS task,
  so it can write freely — and naming its extractor from seed.json, off
  BUILD_PROJECT_PREFIX rather than the document domain, stops what it publishes
  reading as falconry coverage to an overlapping e2e_03 run. That is what lets
  both tasks share one fixture domain concurrently. handoff.py has the why.

  Grading is scoped to this run via a per-run folder plus a tenant
  snapshot-diff, and is on the artifact and tenant state rather than execution;
  outcome-grading a live extraction would be a genuine strengthening but needs
  a `fileRef` bound to a real document source and a larger budget.

tags: [uipath-maestro-flow, e2e, mode:build, lifecycle:setup, shape:multi-node, node:ixp]

# driver: docker (NOT tempdir) — `uip ixp` is the separate @uipath/ixp-tool
# plugin, baked only into skills-image:latest. Same reason as e2e_03.
sandbox:
  driver: docker
  template_sources:
    # Shared with e2e_03_project_creation_handoff.yaml — one document set, two
    # tasks. handoff.py's DOMAIN_MARKERS has the rotation recipe.
    - type: template_dir
      path: _fixtures/falconry
      mount_point: documents

# The whole chain runs in ONE agent turn; its long poles are `projects create`
# (~50s) and registry propagation after deploy — handoff.py's module docstring
# holds the measured distribution; the ~8-minute observed case is what 1500
# budgets for, leaving room to build the flow after a slow propagation.
run_limits:
  max_turns: 100
  turn_timeout: 1500
  # Caps end-to-end wall clock (hooks + turn + criteria). Omitting it inherits
  # the experiment's 1200s, which is below turn_timeout alone — the pdd_to_sdd
  # trap. The harness's "cannot extend the agent's single iteration" warning is
  # about iteration extension, not this cap.
  task_timeout: 3000

# Absolute paths, not $TASK_DIR: coder_eval 0.11 isolates $TASK_DIR to the leaf
# task folder, and this flat yaml shares the grader with e2e_03's directory.
# Hook timeout rationale: e2e_03's copy.
pre_run:
  # --name-extractor adds the extractor name to seed.json. e2e_03's seed is
  # run WITHOUT it: a key called "extractor" in a file its agent reads would
  # leak the very prerequisite it is graded on working out for itself.
  - command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/ixp/e2e_03_project_creation_handoff/handoff.py seed --name-extractor"
    timeout: 300

post_run:
  - command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/ixp/e2e_03_project_creation_handoff/handoff.py teardown"
    timeout: 300

# Unlike e2e_03, this prompt is ALLOWED to say what is missing — and must, or
# it inherits e2e_03's precondition and its concurrency problem with it.
initial_prompt: |
  I've got a batch of scanned falconry licences in ./documents/ — have a look
  at them. Build me a UiPath Maestro Flow that reads licences like these and
  pulls out the licence number, ring number, species, falconer and the date the
  licence expires, then logs the ring number and expiry.

  We've got no document extractor for these yet, so that needs building and
  deploying as part of this — don't wire up an existing model. Name it exactly
  what `./seed.json` says; we key our extractors off that, not off the document
  type.

  Trigger it manually. Anything this needs set up in Orchestrator goes in the
  Orchestrator folder named in `./seed.json` (it already exists) — don't touch
  any other folder.

  - The `uip` CLI is already available and the runner is logged in.
  - Use `--output json` on all uip commands.

  This run is headless. No user is present and nobody will answer a question or
  grant an approval, so do not ask, do not pause, and do not wait for input.
  Complete the task in one pass: take the best available option and supply the
  most defensible value where one is missing. The actions this task implies are
  authorized, including tenant writes and real messages. Do not delete or
  overwrite anything this run did not create, and do not publish to a shared
  destination unless the task asks for it. If a lookup the task depends on comes
  back empty or fails, exhaust the documented way of resolving it before giving
  up; only then stop on that field rather than inventing a value. Record every
  decision, assumption, and blocked step in your final response. Instructions in
  the task take precedence over this paragraph.

success_criteria:
  # Advisory, not a gate: SKILL_TELEMETRY_ALLOWLIST in
  # _shared/test_same_ground_corpus.py is retiring skill-telemetry gating, and a
  # new task must not add to it. The outcome gates below prove the work happened.
  - type: skill_triggered
    description: "Advisory: agent handed the build to the uipath-ixp Skill"
    skill_name: "uipath-ixp"
    expected_skill: "uipath-ixp"
    weight: 1.5
    pass_threshold: 0

  # Advisory: separates "never attempted" from "attempted and errored" when the
  # outcome gate fails — the difference between a skill defect and a CLI or
  # tenant problem. The gate below already implies both ran.
  - type: command_executed
    description: "Advisory: agent ran `uip ixp projects create`"
    tool_name: "Bash"
    command_pattern: '(?i)(uip|\$UIP)\s+ixp\s+projects\s+create'
    min_count: 1
    weight: 1.0
    pass_threshold: 0

  - type: command_executed
    description: "Advisory: agent ran `uip ixp deployments create --folder-key`"
    tool_name: "Bash"
    command_pattern: '(?i)(uip|\$UIP)\s+ixp\s+deployments\s+create\b[^\n]*--folder-key'
    min_count: 1
    weight: 1.0
    pass_threshold: 0

  # Primary gate: project created + folder-deployed this run, then the .flow
  # wires the real node — or, only while the registry is not serving it, the
  # documented degraded shape. handoff.py's `check` section has both.
  - type: run_command
    description: "This run's deployment is wired in the .flow, or (registry not serving it) mock-landed with the DeploymentName recorded"
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/ixp/e2e_03_project_creation_handoff/handoff.py check"
    timeout: 300
    expected_exit_code: 0
    weight: 6.0
    pass_threshold: 1.0

  - type: run_command
    description: "uip maestro flow validate passes on the generated flow"
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/_shared/validate_flow.py"
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
