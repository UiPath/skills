# Same-ground alignment expansion plan (Tao, 2026-08-21): loop-neutral
# v1-base prompt, outcome-graded criteria at preserved weights, and
# arm-agnostic artifact discovery.
# See workspaces/docs/flow-sdk/2026-08-21-maestro-flow-alignment-expansion-plan.md.
task_id: skill-flow-ixp-routing-negative
description: >
  Negative IxP routing — verifies the agent does NOT add a uipath.ixp.*
  node when the user asks for a Maestro flow with no document-extraction
  scope. Parent uipath-maestro-flow Skill must still fire (this is in-skill
  plugin-routing coverage; "should not fire maestro-flow at all" is upstream
  in coder_eval/tasks/uipath_flow/triggering/triggering.jsonl).

  Each row carries a flow-shaped prompt that does not mention documents,
  PDFs, invoices, receipts, contracts, forms, or field extraction. The IxP
  plugin index / planning copy / SKILL.md must be tight enough that the
  agent does not over-trigger.

  Failure here means routing copy is too broad — tighten the trigger
  signals, do NOT relax assertions.

tags: [uipath-maestro-flow, integration, mode:build, lifecycle:generate, node:ixp]

dataset:
  rows:

    - id: stripe-http
      prompt: >-
        Create a flow with a manual trigger and an HTTP node that calls
        api.stripe.com, then a script node that logs the response.
    - id: slack-summary
      prompt: >-
        Create a flow with a scheduled trigger that posts a daily summary
        message to Slack.
    - id: sf-update
      prompt: >-
        Build a flow that reads open Salesforce opportunities and updates the
        stage field on each one.
    - id: http-webhook
      prompt: >-
        Create a flow with an HTTP trigger that validates a JSON payload in a
        script node and returns a status code.
    - id: gsheet-loop
      prompt: >-
        Build a flow that loops over rows in a Google Sheet and sends each row
        to an HTTP endpoint.
    - id: queue-write
      prompt: >-
        Create a flow with a manual trigger that writes a record to an
        Orchestrator queue.
    - id: teams-decision
      prompt: >-
        Build a flow that branches on an input variable and notifies Teams in
        the matching branch.
    - id: delay-email
      prompt: >-
        Create a flow with a timer trigger that waits 10 minutes, then sends an
        Outlook email.

initial_prompt: |
  ${row.prompt}

  Scope: this is a routing check, not a build-to-run task. A skeleton whose
  nodes cover the steps of the request is enough — leave a node unconfigured
  rather than leaving a step out or stopping to ask. Do NOT ask for approval,
  confirmation, or missing details; pick a sensible default and state it in
  your final report. Do not iterate to make the flow runnable — a broken
  skeleton is acceptable.

success_criteria:
  # Inverted twin of the positive routing.yaml artifact check.
  - type: run_command
    description: "No uipath.ixp.* node landed in any .flow file (negative IxP routing)"
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/_shared/flow_contains.py --absent-regex '\"type\"\\s*:\\s*\"uipath\\.ixp'"
    expected_exit_code: 0
    suite_thresholds: {mean: 0.85}

run_limits:
  max_turns: 25
  turn_timeout: 600
  task_timeout: 600
