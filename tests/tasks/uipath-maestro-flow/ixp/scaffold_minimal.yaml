# Same-ground alignment expansion plan (Tao, 2026-08-21): loop-neutral
# v1-base prompt, outcome-graded criteria at preserved weights, and
# arm-agnostic artifact discovery.
task_id: skill-flow-ixp-scaffold-minimal
description: >
  Integration: minimal scaffold — manual trigger → IxP extract → script (logs "ok")
  → validate. Tests that the agent picks the IxP plugin, authors a single
  extraction node via Direct JSON, and produces a flow that passes
  `uip maestro flow validate`.

  Validate-only: no `uip maestro flow debug`. IxP runtime requires a tenant
  deployment which CI does not have; this verifies offline structural
  correctness only.

  The prompt names the document domain, not a model: resolving the domain to a
  published model via `registry search` is the behaviour under test (same as
  e2e_02_project_selection.yaml). Naming an unpublished model instead makes the
  agent stop and ask which to bind — correct behaviour, but it builds nothing.

tags: [uipath-maestro-flow, integration, mode:build, lifecycle:generate, shape:single-node, node:ixp]
initial_prompt: |
  Create a new Maestro Flow project called "Smoke" with a manual trigger, an
  extract node, and a script node that just logs "ok". Wire the extracted
  handle to the script and validate the flow.

  Document: a PDF vendor invoice, supplied to the extract node as the flow's
  document input.
  Script node: contains a JavaScript that logs OK when it receives the
  extraction result.

  Validate the completed flow.

  This run is headless. No user is present and nobody will answer a question or
  grant an approval, so do not ask, do not pause, and do not wait for input.
  Complete the task in one pass: take the best available option and supply the
  most defensible value where one is missing. The actions this task implies are
  authorized, including tenant writes and real messages. Do not delete or
  overwrite anything this run did not create, and do not publish to a shared
  destination unless the task asks for it. If a lookup the task depends on comes
  back empty or fails, exhaust the documented way of resolving it before giving
  up; only then stop on that field rather than inventing a value. Record every
  decision, assumption, and blocked step in your final response. Instructions in
  the task take precedence over this paragraph.
success_criteria:
  - type: skill_triggered
    skill_name: "uipath-maestro-flow"
    expected_skill: "uipath-maestro-flow"
    description: "Advisory: agent invoked the uipath-maestro-flow skill"
    weight: 2.0
    pass_threshold: 0.0

  # IxP registry-search check — see routing.yaml for the pattern breakdown.
  - type: command_executed
    description: "Advisory: live-v1 agent searched the registry for IxP node types"
    tool_name: "Bash"
    command_pattern: '(?i)uip\s+maestro\s+flow\s+registry\s+(list\b|(search|list|get)\b[^\n]*\b(ixp|document|extract))'
    min_count: 1
    weight: 2.0
    pass_threshold: 0.0

  - type: command_executed
    description: "Advisory: live-v1 agent invoked flow validation"
    tool_name: "Bash"
    command_pattern: 'uip\s+(maestro\s+)?flow\s+validate'
    min_count: 1
    weight: 1.5
    pass_threshold: 0.0

  - type: run_command
    description: "uip maestro flow validate passes on Smoke.flow"
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/_shared/validate_flow.py"
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "Generated flow contains an IxP extraction node or core.logic.mock fallback (per references/plugins/ixp/impl.md)"
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/_shared/flow_contains.py --regex '\"type\"\\s*:\\s*\"(uipath\\.ixp|core\\.logic\\.mock)'"
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  # Locate the .flow rather than hardcoding `Smoke/Smoke/Smoke.flow` — see
  # integration_handle_routing.yaml for the `<Name>Solution/` wrapper rationale.
  - type: run_command
    description: "Script node consumes the extraction output via $vars expression"
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/_shared/flow_contains.py '$vars.'"
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 1.0

run_limits:
  expected_turns: 27
  max_turns: 40
  turn_timeout: 900
  task_timeout: 900
