# Same-ground alignment expansion plan (Tao, 2026-08-21): loop-neutral
# v1-base prompt, outcome-graded criteria at preserved weights, and
# arm-agnostic artifact discovery.
# See workspaces/docs/flow-sdk/2026-08-21-maestro-flow-alignment-expansion-plan.md.
task_id: skill-flow-ixp-routing
description: >
  IxP routing (positive) — document-extraction build prompts fanned out via
  `dataset.rows`. Each row carries a distinct user prompt; success criteria are
  identical across all rows.

  Scope: did the agent route to the IxP plugin, not did the flow work.
  The gating assertion verifies that the artifact contains a uipath.ixp.* or
  core.logic.mock node. Registry-search telemetry remains report-only because
  the two authoring loops use different commands.

  Failure here is signal about SKILL.md or the IxP Plugin Index entry —
  do NOT relax assertions; feed findings back in.

  Rows are phrased as greenfield builds because the sandbox seeds no `.flow`.
  A prompt claiming "I have a UiPath Flow" makes the agent rightly decline to
  attach a node to a project that does not exist.

tags: [uipath-maestro-flow, integration, mode:build, lifecycle:generate, node:ixp]
dataset:
  rows:
    - id: explicit
      prompt: >-
        Build a UiPath Flow with an IXP node that reads PDF invoices from a
        SharePoint folder and extracts the structured fields so the next step
        can post them to SAP.

    - id: invoice-extraction
      prompt: >-
        Build a UiPath Flow that pulls vendor name, invoice number, invoice
        date, total amount, and line items out of PDF invoices saved in a
        SharePoint folder, then posts the result to our accounting system.

    - id: receipts
      prompt: >-
        Add a document-extraction step to my flow that reads receipt images
        from a folder and pulls out merchant, date, and total.

    - id: contracts
      prompt: >-
        Build a flow that extracts party names, effective date, and the
        termination clause from PDF contracts, then routes them to an approval
        step.

    - id: forms-classify
      prompt: >-
        Build a Maestro flow with an IxP node that classifies incoming PDF
        forms and extracts their fields before the next step.

initial_prompt: |
  ${row.prompt}

  Scope: this is a routing check, not a build-to-run task. The deliverable is
  the flow artifact itself — the `.flow` file. A skeleton whose nodes cover the
  steps of the request is enough: leave a node unconfigured rather than
  leaving a step out or stopping to ask. Do NOT ask for approval,
  confirmation, or missing details; pick a sensible default and state it in
  your final report. Do not iterate on validation errors to make the flow
  runnable — a broken skeleton is acceptable, as long as the `.flow` file has
  been produced.

success_criteria:
  # What this checks: did the agent search the registry for IxP nodes?
  # Passes (case-insensitive) when the agent ran either:
  #   • `registry list`                   — list all nodes, or
  #   • `registry search|list|get <term>` — <term> contains ixp / document / extract
  #                                         (prefix match, so extract → extraction)
  # routing_listing.yaml drops `get` (read-only). Keep in sync with
  # scaffold_minimal.yaml, scaffold_multinode.yaml, routing_listing.yaml.
  - type: command_executed
    description: "Advisory: live-v1 agent searched the registry for IxP node types"
    tool_name: "Bash"
    command_pattern: '(?i)uip\s+maestro\s+flow\s+registry\s+(list\b|(search|list|get)\b[^\n]*\b(ixp|document|extract))'
    min_count: 1
    pass_threshold: 0.0
    # Armed latch-only (kept from main #2881): the sentinel below defers its
    # pass-stop until this criterion has live-passed, so a live-v1 run is cut
    # only after it has searched the registry AND written the node. Fail-stop is
    # unreachable for a min_count. Advisory (pass_threshold 0.0) under the
    # same-ground regime: the SDK loop never runs this command, so it must not
    # gate — on an SDK-loop run the sentinel simply never fires and the run
    # completes and grades exactly as before.
    stop_early: {}

  # Inspect the actual .flow artifact rather than the command stream. Per
  # references/plugins/ixp/impl.md, the agent must land either an
  # `uipath.ixp.*` node or a `core.logic.mock` placeholder.
  - type: run_command
    description: "Agent added an IxP or core.logic.mock placeholder node to a .flow file (per references/plugins/ixp/impl.md)"
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/_shared/flow_contains.py --regex '\"type\"\\s*:\\s*\"(uipath\\.ixp|core\\.logic\\.mock)'"
    expected_exit_code: 0
    suite_thresholds: {mean: 0.85}

  # Sentinel — ends the run early, never grades it. This suite fails on the
  # clock, not the criteria: the node lands early, then ungraded wiring grinds
  # into the turn ceiling (902-1203s deaths whose artifacts grade 1.0). Latches
  # when a tool call writes the node literal (raw or JSON-escaped); the cut
  # defers until the armed registry criterion above has live-passed.
  # pass_threshold 0: a run that never latches (large writes exceed the checker's
  # 2000-char window) completes and grades exactly as before. Keep the default
  # weight — a zero-weight armed criterion collapses the pass-stop floor and
  # would cut at the registry search, before the flow exists.
  - type: command_executed
    description: "sentinel: IxP/mock node literal written — ends the run early; never gates"
    command_pattern: '\\?"type\\?"\s*:\s*\\?"(uipath\.ixp|core\.logic\.mock)'
    min_count: 1
    pass_threshold: 0
    stop_early:
      on_pass: stop

run_limits:
  max_turns: 80
  turn_timeout: 1200
  task_timeout: 1200
