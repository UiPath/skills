# Same-ground alignment expansion plan (Tao, 2026-08-21): loop-neutral
# v1-base prompt, outcome-graded criteria at preserved weights, and
# arm-agnostic artifact discovery.
task_id: skill-flow-ixp-routing-listing
description: >
  IxP listing routing — user asks what IxP models / runtime projects are
  available from a Maestro flow. Read-only Q&A, not a build task.

  Observes the live-v1 registry-search command as report-only telemetry (per
  references/plugins/ixp/impl.md — Listing Published Models). The gating check
  asserts that the agent did NOT take the build path: no .flow file should be
  created for a listing question.

  Failure here is signal about the IxP plugin's Listing Published Models /
  Listing Available Models sections — do NOT relax assertions, tighten the
  copy.

tags: [uipath-maestro-flow, integration, mode:operate, lifecycle:discover, node:ixp]

dataset:
  rows:
    - id: r01
      prompt: "What IxP models can I access in maestro?"
    - id: r02
      prompt: "What document extractors can I add to this flow?"
    - id: r03
      prompt: "List the published IxP extractors available to my .flow"
    - id: r04
      prompt: "Which IxP runtime projects can I wire into a Maestro flow node?"
    - id: r05
      prompt: "What extraction models are available to my Maestro flow?"
    - id: r06
      prompt: "Show me the IxP document-understanding models I can use in maestro"
    - id: r07
      prompt: "Which document-extraction models can this flow call?"
    - id: r08
      prompt: "What are my options for IxP nodes in a Maestro flow?"
    - id: r09
      prompt: "Can you list the IxP models I can add to my flow?"
    - id: r10
      prompt: "What published IxP extractors can a flow node reference?"

initial_prompt: |
  ${row.prompt}
  Answer the question without creating a flow.

  This run is headless. No user is present and nobody will answer a question or
  grant an approval, so do not ask, do not pause, and do not wait for input.
  Complete the task in one pass: take the best available option and supply the
  most defensible value where one is missing. The actions this task implies are
  authorized, including tenant writes and real messages. Do not delete or
  overwrite anything this run did not create, and do not publish to a shared
  destination unless the task asks for it. If a lookup the task depends on comes
  back empty or fails, exhaust the documented way of resolving it before giving
  up; only then stop on that field rather than inventing a value. Record every
  decision, assumption, and blocked step in your final response. Instructions in
  the task take precedence over this paragraph.
success_criteria:
  # IxP registry-search check (omits `get`) — see routing.yaml for the pattern breakdown.
  - type: command_executed
    description: "Advisory: live-v1 agent searched the registry for IxP node types"
    tool_name: "Bash"
    command_pattern: '(?i)uip\s+maestro\s+flow\s+registry\s+(list\b|(search|list)\b[^\n]*\b(ixp|document|extract))'
    min_count: 1
    pass_threshold: 0.0

  # A listing/Q&A task should not create a Flow artifact.
  - type: run_command
    description: "No .flow file was created (listing is read-only Q&A, not a build task)"
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/_shared/flow_contains.py --expect-none"
    expected_exit_code: 0
    suite_thresholds: {mean: 0.85}

run_limits:
  max_turns: 20
  turn_timeout: 300
  task_timeout: 300
