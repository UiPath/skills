task_id: skill-flow-inline-agent-base
description: >
  End-to-end test: given a goal-only prompt to build a flow that uses
  a low-code agent, the agent must derive from the skill that the
  right architecture is an inline agent defined DIRECTLY in the flow
  file — full definition embedded in the `uipath.agent.autonomous`
  node's `inputs` (string prompts = embed trigger, author-minted UUID
  `source`, typed `agentOutputVariables`, verbatim registry
  definition) — wired with input/success edges, with NO `uip agent`
  lifecycle commands and no hand-authored sidecar. Validate-only by
  design: `uip maestro flow debug` cannot yet run flow-only inline
  agents (no sidecar synthesis — known CLI gap pinned at roadmap M0),
  so `flow validate` is the grading ceiling for inline-agent tasks.
tags: [uipath-maestro-flow, e2e, mode:build, lifecycle:generate, node:inline-agent, shape:single-node]

run_limits:
  expected_turns: 31
  turn_timeout: 1200

initial_prompt: |
  Create a UiPath Flow project "GreetingFlow" that uses a single low-code agent
  embedded inside the flow to generate a greeting from a person's name. The
  solution should be named "GreetingSol". The flow takes a string input
  `personName` and returns the agent's greeting as a typed output variable
  named `greeting`.

  The task is NOT complete until `uip maestro flow validate` passes for the
  flow file.

  Do NOT publish, upload, or deploy. Do NOT ask for approval,
  confirmation, or feedback. Do NOT pause between planning and
  implementation. Complete the entire task end-to-end in a single pass.

success_criteria:
  - type: command_executed
    description: "Agent created the solution with uip solution init"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+solution\s+init'
    min_count: 1
    weight: 1.0
    pass_threshold: 0.0  # advisory: init auto-scaffolds the parent solution (CLI #2470)

  # Outcome-based check (auto-registration via `uip <kind> init` OR explicit
  # `uip solution project add` both populate Projects[] in the .uipx).
  - type: json_check
    description: "Project is registered in the parent solution .uipx"
    path: "GreetingSol/GreetingSol.uipx"
    assertions:
      - expression: "length(Projects)"
        operator: "gte"
        expected: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: file_exists
    description: "Flow file was created"
    path: "GreetingSol/GreetingFlow/GreetingFlow.flow"
    weight: 1.5
    pass_threshold: 1.0

  - type: file_exists
    description: "Flow project descriptor was created"
    path: "GreetingSol/GreetingFlow/project.uiproj"
    weight: 1.0
    pass_threshold: 1.0

  - type: file_contains
    description: "Flow contains the inline agent node type"
    path: "GreetingSol/GreetingFlow/GreetingFlow.flow"
    includes:
      - '"uipath.agent.autonomous"'
    weight: 1.5
    pass_threshold: 1.0

  - type: command_not_executed
    description: "No legacy inline-agent lifecycle commands (definition lives in the .flow)"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+agent\s+(init|refresh|validate)\s+.*--inline-in-flow'
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "Embedded inline agent: self-contained inputs, typed outputs, definition present, input/success edges"
    command: 'python3 "$TASK_DIR/check_inline_agent_base.py"'
    timeout: 30
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0

  - type: run_command
    description: "uip maestro flow validate passes on the authored flow"
    command: 'python3 "$TASK_DIR/../../_shared/validate_flow.py"'
    timeout: 120
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
