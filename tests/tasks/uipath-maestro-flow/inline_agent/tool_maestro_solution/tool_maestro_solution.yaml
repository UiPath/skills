task_id: skill-flow-inline-tool-maestro-solution
description: >
  Add an inline-agent Maestro tool inside an existing solution
  (brownfield), flow-file-first. The fixture ships an
  `OnboardingFlowSol` solution that already contains a registered
  `EmployeeOnboarding` process orchestration project. The agent must
  add a NEW `OnboardingFlow` Flow project whose inline low-code agent
  (full definition embedded in the `uipath.agent.autonomous` node's
  `inputs`) delegates to the pre-existing `EmployeeOnboarding` as a
  tool — reusing it, NOT re-creating it and NOT re-initializing the
  solution. Verifies a
  `uipath.agent.resource.tool.processorchestration.<key>` node carries
  the tool config in its `inputs` (UUID `source`,
  `properties.processName: "EmployeeOnboarding"`,
  `properties.folderPath: "solution_folder"`), is wired to the agent's
  `tool` handle with its registry definition present, and the flow
  validates. No sidecar authored, no `uip agent` lifecycle commands.
  Validate-only by design: `uip maestro flow debug` cannot yet run
  flow-only inline agents (no sidecar synthesis — known CLI gap
  pinned at roadmap M0), so `flow validate` is the grading ceiling.
tags: [uipath-maestro-flow, e2e, mode:build, lifecycle:generate, node:inline-agent, shape:multi-node]

run_limits:
  expected_turns: 80
  turn_timeout: 1200

pre_run:
  - command: "cp -r $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/inline_agent/tool_maestro_solution/_fixtures/OnboardingFlowSol ."
    timeout: 10

initial_prompt: |
  Create a new UiPath Flow project named "OnboardingFlow" inside the existing
  "OnboardingFlowSol" solution (in the current directory). Its inline low-code
  agent should carry out onboarding by handing off to the existing
  "EmployeeOnboarding" agentic process that's already in the solution, rather
  than doing it itself.

  The task is NOT complete until `uip maestro flow validate` passes for the
  flow file.

  Do NOT publish, upload, or deploy. Do NOT ask for approval,
  confirmation, or feedback. Do NOT pause between planning and
  implementation. Complete the entire task end-to-end in a single pass.

success_criteria:
  # Brownfield: the solution already exists in the fixture.
  - type: command_not_executed
    description: "Agent did NOT re-initialize the pre-existing solution"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+solution\s+init'
    exclude_pattern: '--help'
    weight: 1.0
    pass_threshold: 1.0

  # Brownfield: EmployeeOnboarding ships in the fixture. The agent must
  # reuse it, not scaffold a fresh copy over it.
  - type: command_not_executed
    description: "Agent did NOT re-create the existing EmployeeOnboarding project"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+flow\s+init\s+["'']?EmployeeOnboarding'
    weight: 1.5
    pass_threshold: 1.0

  # Global transform (roadmap §7): the sidecar lifecycle verbs must not run —
  # the definition lives in the .flow.
  - type: command_not_executed
    description: "No legacy inline-agent lifecycle commands (definition lives in the .flow)"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+agent\s+(init|refresh|validate)\s+.*--inline-in-flow'
    weight: 1.0
    pass_threshold: 1.0

  # Informational discovery criteria: the agent may use file reads instead of
  # CLI discovery. pass_threshold:0 means these never block the run.
  - type: command_executed
    description: "Agent discovered the existing EmployeeOnboarding via solution resources list (informational)"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+solution\s+resources?\s+list\b.*--source\s+local'
    min_count: 1
    weight: 0.5
    pass_threshold: 0.0

  - type: command_executed
    description: "Agent fetched the EmployeeOnboarding configuration with uip solution resources get (informational)"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+solution\s+resources?\s+get\b'
    min_count: 1
    weight: 0.5
    pass_threshold: 0.0

  # Local-registry discovery: informational. The agent may discover node types
  # via file reads or resources list output instead of registry search/list.
  - type: command_executed
    description: "Agent searched or listed the local flow registry for the Maestro tool manifest (informational)"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+flow\s+registry\s+(search|list)\b.*--local'
    min_count: 1
    weight: 0.5
    pass_threshold: 0.0

  # Outcome-based check: the fixture .uipx starts with EmployeeOnboarding
  # registered; auto-registration of the new Flow project must bring
  # Projects[] to 2.
  - type: json_check
    description: "OnboardingFlow is registered alongside EmployeeOnboarding in the parent solution .uipx"
    path: "OnboardingFlowSol/OnboardingFlowSol.uipx"
    assertions:
      - expression: "length(Projects)"
        operator: "gte"
        expected: 2
    weight: 1.5
    pass_threshold: 1.0

  - type: file_exists
    description: "Flow file was created"
    path: "OnboardingFlowSol/OnboardingFlow/OnboardingFlow.flow"
    weight: 1.5
    pass_threshold: 1.0

  - type: file_contains
    description: "Flow embeds the inline agent and the Maestro tool node types"
    path: "OnboardingFlowSol/OnboardingFlow/OnboardingFlow.flow"
    includes:
      - '"uipath.agent.autonomous"'
      - 'uipath.agent.resource.tool.processorchestration.'
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "Inline solution Maestro tool: embedded agent + tool node inputs (processName/folderPath) + tool-handle edge + definitions"
    command: 'python3 "$TASK_DIR/check_tool_maestro_solution.py"'
    timeout: 30
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0

  - type: run_command
    description: "uip maestro flow validate passes on the authored flow"
    command: 'python3 "$TASK_DIR/../../_shared/validate_flow.py"'
    timeout: 120
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
