task_id: skill-agent-inline-is-connector-tool
description: >
  Integration Service (IS) tools for flow inline agents. End-to-end
  test: scaffold a flow project containing an inline low-code agent
  that exposes an IS connector activity as a tool. The agent under
  test must discover the connector via `uip is`, author a
  `type: "integration"` resource.json inside the inline agent's UUID
  subdirectory, bind the connection in `bindings_v2.json`, and wire a
  `uipath.agent.resource.tool.connector` flow node to the
  `uipath.agent.autonomous` node's `tool` handle. Verifies design-time
  artifacts only (no runtime connector invocation). Cloud auth
  required — depends on the staging tenant having the
  `uipath-uipath-airdk` (GenAI Activities) connector available.
tags: [uipath-maestro-flow, e2e, mode:build, lifecycle:generate, low-code, inline-flow, resource]

run_limits:
  expected_turns: 56
  turn_timeout: 1200

reference:
  directory: ../..

initial_prompt: |
  Create a UiPath Flow project "ResearchFlow" that runs an inline low-code
  agent which can look things up. Give the agent an Integration Service GenAI
  tool so it can research questions on demand, and wire it into the flow. The
  solution should be named "ResearchFlowSol".

  Do NOT publish, upload, or deploy.

  This run is headless. No user is present and nobody will answer a question or
  grant an approval, so do not ask, do not pause, and do not wait for input.
  Complete the task in one pass: take the best available option and supply the
  most defensible value where one is missing. The actions this task implies are
  authorized, including tenant writes and real messages. Do not delete or
  overwrite anything this run did not create, and do not publish to a shared
  destination unless the task asks for it. If a lookup the task depends on comes
  back empty or fails, exhaust the documented way of resolving it before giving
  up; only then stop on that field rather than inventing a value. Record every
  decision, assumption, and blocked step in your final response. Instructions in
  the task take precedence over this paragraph.

success_criteria:
  - type: command_executed
    description: "Agent discovered connectors via `uip is`"
    tool_name: "Bash"
    command_pattern: 'uip\s+is\s+'
    min_count: 1
    weight: 0.0
    pass_threshold: 0.0  # route telemetry only: the SDK route resolves the connection with `uip maestro registry prepare`

  - type: command_executed
    description: "Agent created the solution with uip solution init"
    tool_name: "Bash"
    command_pattern: 'uip\s+solution\s+init'
    min_count: 1
    weight: 1.0
    pass_threshold: 0.0  # advisory: init auto-scaffolds the parent solution (CLI #2470)

  # Outcome-based check (auto-registration via `uip <kind> init` OR explicit
  # `uip solution project add` both populate Projects[] in the .uipx).
  - type: json_check
    description: "Project is registered in the parent solution .uipx"
    path: "ResearchFlowSol/ResearchFlowSol.uipx"
    assertions:
      - expression: "length(Projects)"
        operator: "gte"
        expected: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent refreshed solution resources"
    tool_name: "Bash"
    command_pattern: 'uip\s+solution\s+resources\s+refresh'
    min_count: 1
    weight: 2.0
    pass_threshold: 0.0  # advisory: the SDK route may sync solution resources differently; the contract checker grades the outcome

  - type: file_exists
    description: "Flow file was created"
    path: "ResearchFlowSol/ResearchFlow/ResearchFlow.flow"
    weight: 1.5
    pass_threshold: 1.0

  # Outcome gate for the authored flow. Path-neutral: it holds whether the
  # agent compiled a builder-SDK `.flow.ts` or edited the `.flow` JSON, so it
  # replaces the `uip agent init/refresh/validate --inline-in-flow` and
  # `uip maestro flow registry` trajectory gates the v1 recipe required.
  - type: run_command
    description: "uip maestro flow validate passes on the flow file"
    command: "python3 $REFERENCE_DIR/_shared/validate_flow.py ResearchFlowSol/ResearchFlow/ResearchFlow.flow"
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "Inline agent IS tool resource, bindings_v2.json connection binding, and flow wiring (tool.connector node + edge to agent's tool handle)"
    command: "python3 $REFERENCE_DIR/inline_agent/_shared/check_inline_is_connector_tool.py"
    timeout: 30
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0
