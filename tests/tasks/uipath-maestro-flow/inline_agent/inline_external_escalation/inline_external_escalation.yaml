task_id: skill-agent-inline-external-escalation-tool
description: >
  Escalation app tools (external resource) for flow inline agents.
  End-to-end test: scaffold a flow project with an inline low-code
  agent that escalates uncertain cases to an EXTERNAL ActionCenter app
  already deployed to Orchestrator (not inside this solution).
  Verifies the escalation resource.json under the inline agent's UUID
  subdirectory has an actionCenter channel bound to the deployed
  "ExpenseReviewApp" Workflow Action app (appName, folderName, UUID
  resourceKey), and that a
  `uipath.agent.resource.escalation` flow node is wired to the
  autonomous agent node's `escalation` handle.
tags: [uipath-maestro-flow, e2e, mode:build, lifecycle:generate, low-code, inline-flow, resource]

run_limits:
  expected_turns: 66
  turn_timeout: 1200

# An agent left to itself often models "escalate to a human" as a human-in-the-loop
# flow node — fine in general, but this task specifically exercises the agent
# Escalation capability, so the prompt asks for it explicitly.
reference:
  directory: ../..

initial_prompt: |
  Create a UiPath Flow project "ExpenseFlow" that runs an inline low-code agent
  which triages employee expense claims and, when it isn't confident a claim
  follows policy, escalates the claim to a human reviewer through our existing
  "ExpenseReviewApp" Action Center app — it's already running in Orchestrator,
  not part of this solution. Set this up using the agent's Escalation
  capability, wired into the flow — not a standalone human-in-the-loop node. The
  solution should be named "ExpenseFlowSol".

  Do NOT publish, upload, or deploy.

  This run is headless. No user is present and nobody will answer a question or
  grant an approval, so do not ask, do not pause, and do not wait for input.
  Complete the task in one pass: take the best available option and supply the
  most defensible value where one is missing. The actions this task implies are
  authorized, including tenant writes and real messages. Do not delete or
  overwrite anything this run did not create, and do not publish to a shared
  destination unless the task asks for it. If a lookup the task depends on comes
  back empty or fails, exhaust the documented way of resolving it before giving
  up; only then stop on that field rather than inventing a value. Record every
  decision, assumption, and blocked step in your final response. Instructions in
  the task take precedence over this paragraph.

success_criteria:
  - type: command_executed
    description: "Agent created the solution with uip solution init"
    tool_name: "Bash"
    command_pattern: 'uip\s+solution\s+init'
    min_count: 1
    weight: 1.5
    pass_threshold: 0.0  # advisory: init auto-scaffolds the parent solution (CLI #2470)

  - type: command_executed
    description: "Agent discovered the ExpenseReviewApp app identity with uip solution resources list --kind App"
    tool_name: "Bash"
    command_pattern: 'uip\s+solution\s+resources\s+list\b.*--kind\s+App'
    min_count: 1
    weight: 1.5
    pass_threshold: 0.0  # advisory: discovery route is not graded; the contract checker grades the escalation resource
  - type: command_executed
    description: "Agent fetched the app action schema with uip solution resources get"
    tool_name: "Bash"
    command_pattern: 'uip\s+solution\s+resources?\s+get\b'
    min_count: 1
    weight: 1.5
    pass_threshold: 0.0  # advisory: discovery route is not graded; the contract checker grades the escalation resource
  # Outcome-based check (auto-registration via `uip <kind> init` OR explicit
  # `uip solution project add` both populate Projects[] in the .uipx).
  - type: json_check
    description: "Project is registered in the parent solution .uipx"
    path: "ExpenseFlowSol/ExpenseFlowSol.uipx"
    assertions:
      - expression: "length(Projects)"
        operator: "gte"
        expected: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: file_exists
    description: "Flow file was created"
    path: "ExpenseFlowSol/ExpenseFlow/ExpenseFlow.flow"
    weight: 1.5
    pass_threshold: 1.0

  # Outcome gate: the authored flow validates, whichever route wrote it.
  - type: run_command
    description: "uip maestro flow validate passes on the flow file"
    command: "python3 $REFERENCE_DIR/_shared/validate_flow.py ExpenseFlowSol/ExpenseFlow/ExpenseFlow.flow"
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "Inline external escalation: resource.json shape (actionCenter channel, appName, folderName, resourceKey) + escalation flow node + escalation-handle edge"
    command: "python3 $REFERENCE_DIR/inline_agent/_shared/check_inline_external_escalation.py"
    timeout: 30
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0
