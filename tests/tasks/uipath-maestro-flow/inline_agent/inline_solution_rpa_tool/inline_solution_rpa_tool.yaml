task_id: skill-agent-inline-solution-rpa-tool
description: >
  Add an inline-agent RPA tool inside an existing solution (brownfield).
  The fixture ships a `PayrollFlowSol` solution that already contains a
  registered `CalculatePay` RPA process project. The agent must add a
  NEW `PayrollFlow` Flow project whose inline low-code agent delegates
  to the pre-existing `CalculatePay` as a tool — reusing it, NOT
  re-creating it and NOT re-initializing the solution. Verifies the tool
  resource.json under the inline agent's UUID subdirectory uses
  `type: "process"`, `location: "solution"`,
  `folderPath` "" or "solution_folder" (flow-builder-sdk#922), and that a
  `uipath.agent.resource.tool.process.<uuid>` flow node is wired to the
  autonomous agent node's `tool` handle.
tags: [uipath-maestro-flow, e2e, mode:build, lifecycle:generate, low-code, inline-flow, resource]

run_limits:
  expected_turns: 63
  turn_timeout: 1200

sandbox:
  template_sources:
    - type: template_dir
      path: _fixtures/PayrollFlowSol
      mount_point: PayrollFlowSol

reference:
  directory: ../..

initial_prompt: |
  Create a new UiPath Flow project named "PayrollFlow" inside the existing
  "PayrollFlowSol" solution (in the current directory). Its inline low-code
  agent should compute pay using the existing "CalculatePay" RPA process that's
  already in the solution, rather than working it out itself.

  Do NOT publish, upload, or deploy.

  This run is headless. No user is present and nobody will answer a question or
  grant an approval, so do not ask, do not pause, and do not wait for input.
  Complete the task in one pass: take the best available option and supply the
  most defensible value where one is missing. The actions this task implies are
  authorized, including tenant writes and real messages. Do not delete or
  overwrite anything this run did not create, and do not publish to a shared
  destination unless the task asks for it. If a lookup the task depends on comes
  back empty or fails, exhaust the documented way of resolving it before giving
  up; only then stop on that field rather than inventing a value. Record every
  decision, assumption, and blocked step in your final response. Instructions in
  the task take precedence over this paragraph.

success_criteria:
  # Brownfield: the solution already exists in the fixture.
  - type: command_not_executed
    description: "Agent did NOT re-initialize the pre-existing solution"
    tool_name: "Bash"
    command_pattern: 'uip\s+solution\s+init'
    exclude_pattern: '--help'
    weight: 1.0
    pass_threshold: 1.0

  # Informational discovery criteria: the agent may use file reads instead of
  # CLI discovery. pass_threshold:0 means these never block the run.
  - type: command_executed
    description: "Agent discovered the existing CalculatePay via solution resources list (informational)"
    tool_name: "Bash"
    command_pattern: 'uip\s+solution\s+resources?\s+list\b.*--source\s+local'
    min_count: 1
    weight: 0.5
    pass_threshold: 0.0

  # Informational, NOT enforced: pass_threshold:0 means score (0 when the
  # agent skips `resources get`) always clears the bar. The `resources list`
  # discovery above is the enforced signal; `get` is an acceptable-but-optional
  # follow-up.
  - type: command_executed
    description: "Agent fetched the CalculatePay configuration with uip solution resources get (informational)"
    tool_name: "Bash"
    command_pattern: 'uip\s+solution\s+resources?\s+get\b'
    min_count: 1
    weight: 0.5
    pass_threshold: 0.0

  # Outcome-based check: the fixture .uipx starts with CalculatePay
  # registered; auto-registration of the new Flow project must bring
  # Projects[] to 2.
  - type: json_check
    description: "PayrollFlow is registered alongside CalculatePay in the parent solution .uipx"
    path: "PayrollFlowSol/PayrollFlowSol.uipx"
    assertions:
      - expression: "length(Projects)"
        operator: "gte"
        expected: 2
    weight: 1.5
    pass_threshold: 1.0

  - type: file_exists
    description: "Flow file was created"
    path: "PayrollFlowSol/PayrollFlow/PayrollFlow.flow"
    weight: 1.5
    pass_threshold: 1.0

  # Outcome gate: the authored flow validates, whichever route wrote it.
  - type: run_command
    description: "uip maestro flow validate passes on the flow file"
    command: "python3 $REFERENCE_DIR/_shared/validate_flow.py PayrollFlowSol/PayrollFlow/PayrollFlow.flow"
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  # Outcome gate: the agent tool's own contract for the inline agent's
  # directory (schema version, definition, bindings_v2.json drift). Builder-SDK
  # output passes it since UiPath/builder-sdk#962 (SDK 6.16.16).
  - type: run_command
    description: "uip agent validate --inline-in-flow passes on every inline agent"
    command: "python3 $REFERENCE_DIR/inline_agent/_shared/validate_inline_agent.py PayrollFlowSol/PayrollFlow/PayrollFlow.flow"
    timeout: 120
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "Inline solution RPA tool: resource.json shape + flow node + tool-handle edge"
    command: "python3 $REFERENCE_DIR/inline_agent/_shared/check_inline_solution_rpa_tool.py"
    timeout: 30
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0
