task_id: skill-flow-inline-tool-maestro-external
description: >
  Add Maestro tool (inline agent, external resource) — flow-file-first.
  End-to-end test: scaffold a flow project whose inline low-code agent
  (full definition embedded in the `uipath.agent.autonomous` node's
  `inputs`) calls an EXTERNAL Maestro agentic process deployed to
  Orchestrator. Verifies a
  `uipath.agent.resource.tool.processorchestration.<key>` node carries
  the tool config in its `inputs` (UUID `source`,
  `properties.processName: "ProcurementProcess"`, the real deployed
  `folderPath`), is wired to the agent's `tool` handle with its
  registry definition present, flow data is wired into the cluster,
  the agent declares the typed `status` output, and the flow
  validates. No sidecar authored, no `uip agent` lifecycle commands.
  Validate-only by design: `uip maestro flow debug` cannot yet run
  flow-only inline agents (no sidecar synthesis — known CLI gap
  pinned at roadmap M0), so `flow validate` is the grading ceiling.
tags: [uipath-maestro-flow, e2e, mode:build, lifecycle:generate, node:inline-agent, shape:multi-node]

run_limits:
  expected_turns: 69
  turn_timeout: 1200

initial_prompt: |
  Create a UiPath Flow project "ProcurementFlow" that runs an inline low-code
  agent which takes a required `productId` (number) and returns a boolean
  `status`. The agent shouldn't decide the status itself — it should come from
  our existing "ProcurementProcess" agentic process, which is already deployed
  in our tenant. Wire it into the flow. The solution should be named
  "ProcurementFlowSol".

  The task is NOT complete until `uip maestro flow validate` passes for the
  flow file.

  Do NOT publish, upload, or deploy. Do NOT ask for approval,
  confirmation, or feedback. Do NOT pause between planning and
  implementation. Complete the entire task end-to-end in a single pass.

success_criteria:
  - type: command_executed
    description: "Agent created the solution with uip solution init"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+solution\s+init'
    min_count: 1
    weight: 1.5
    pass_threshold: 0.0  # advisory: init auto-scaffolds the parent solution (CLI #2470)

  # Global transform (roadmap §7): the sidecar lifecycle verbs must not run —
  # the definition lives in the .flow.
  - type: command_not_executed
    description: "No legacy inline-agent lifecycle commands (definition lives in the .flow)"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+agent\s+(init|refresh|validate)\s+.*--inline-in-flow'
    weight: 1.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent discovered the Maestro process identity with uip solution resources list (informational)"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+solution\s+resources\s+list\b'
    min_count: 1
    weight: 0.5
    pass_threshold: 0.0  # advisory: the registry manifest carries name+folder (bindings defaults), so resources list is outcome-invisible for external targets

  - type: command_executed
    description: "Agent fetched the Maestro process configuration with uip solution resources get (informational)"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+solution\s+resources\s+get\b'
    min_count: 1
    weight: 0.5
    pass_threshold: 0.0

  - type: command_executed
    description: "Agent searched the flow registry for the external Maestro tool manifest"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+flow\s+registry\s+search\b'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent fetched the external Maestro tool node manifest from the flow registry"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+flow\s+registry\s+get\s+.*uipath\.agent\.resource\.tool\.processorchestration\.'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent fetched the inline autonomous agent node manifest from the flow registry"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+flow\s+registry\s+get\s+.*uipath\.agent\.autonomous'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  # Outcome-based check (auto-registration via `uip <kind> init` OR explicit
  # `uip solution project add` both populate Projects[] in the .uipx).
  - type: json_check
    description: "Project is registered in the parent solution .uipx"
    path: "ProcurementFlowSol/ProcurementFlowSol.uipx"
    assertions:
      - expression: "length(Projects)"
        operator: "gte"
        expected: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: file_exists
    description: "Flow file was created"
    path: "ProcurementFlowSol/ProcurementFlow/ProcurementFlow.flow"
    weight: 1.5
    pass_threshold: 1.0

  - type: file_contains
    description: "Flow embeds the inline agent and the Maestro tool node types"
    path: "ProcurementFlowSol/ProcurementFlow/ProcurementFlow.flow"
    includes:
      - '"uipath.agent.autonomous"'
      - 'uipath.agent.resource.tool.processorchestration.'
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "Inline external Maestro tool: embedded agent + tool node inputs (processName/real folderPath) + tool-handle edge + definitions + typed output"
    command: 'python3 "$TASK_DIR/check_tool_maestro_external.py"'
    timeout: 30
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0

  - type: run_command
    description: "uip maestro flow validate passes on the authored flow"
    command: 'python3 "$TASK_DIR/../../_shared/validate_flow.py"'
    timeout: 120
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
