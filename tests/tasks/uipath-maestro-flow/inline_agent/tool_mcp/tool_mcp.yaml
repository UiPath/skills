task_id: skill-flow-inline-tool-mcp
description: >
  Add MCP server tool (inline agent) — flow-file-first. End-to-end test:
  scaffold a flow project whose inline low-code agent (full definition
  embedded in the `uipath.agent.autonomous` node's `inputs`) exposes an
  AgentHub-registered MCP server ("GitHubMcp") as a tool. Verifies a
  `uipath.agent.resource.tool.mcp.<name>.<key>` node wired to the agent's
  `tool` handle (no `mcp` handle exists on any autonomous manifest) with
  its registry definition present and the flat flow-form inputs: slug ==
  serverUrl (canonical server slug), literal external folderPath,
  referenceKey == node-type suffix key (the cloud server UUID), curated
  `selectedTools` with parsed-object inputSchemas, and none of the
  derived resource.json fields. No sidecar authored, no `uip agent`
  lifecycle commands.
  Validate-only by design (same posture as the sibling inline_agent
  tasks): `uip maestro flow debug` cannot yet run flow-only inline
  agents (no sidecar synthesis — known CLI gap pinned at roadmap M0),
  so `flow validate` is the grading ceiling.
tags: [uipath-maestro-flow, e2e, mode:build, lifecycle:generate, node:inline-agent, shape:multi-node, resource, path-to-ga]
skip: true
# Skipped — blocked by the MCP registry gap pinned at roadmap M7 (2026-08-05):
# `uip maestro flow registry search/get` mint NO `uipath.agent.resource.tool.mcp.*`
# manifests, even with MCP servers registered in AgentHub (MCP node manifests
# are minted by the canvas studio layer, not the server registry the CLI
# reads). Without a manifest the definitions-or-nothing law cannot be
# satisfied, so `flow validate` cannot pass on a flow-only MCP tool.
# Re-enable when the registry surfaces MCP manifests (re-probe:
# `uip maestro flow registry search mcp --output json` from a solution dir).

run_limits:
  expected_turns: 65
  turn_timeout: 1200

initial_prompt: |
  Create a UiPath Flow project "DevToolsFlow" that runs an inline low-code agent
  connected to our "GitHubMcp" MCP server so it can use that server's GitHub
  tools. Wire it into the flow. The solution should be named "DevToolsFlowSol".

  The task is NOT complete until `uip maestro flow validate` passes for the
  flow file.

  Do NOT publish, upload, or deploy. Do NOT ask for approval,
  confirmation, or feedback. Do NOT pause between planning and
  implementation. Complete the entire task end-to-end in a single pass.

success_criteria:
  - type: command_executed
    description: "Agent created the solution with uip solution init"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+solution\s+init'
    min_count: 1
    weight: 1.0
    pass_threshold: 0.0  # advisory: init auto-scaffolds the parent solution (CLI #2470)

  # Global transform (roadmap §7): the sidecar lifecycle verbs must not run —
  # the definition lives in the .flow.
  - type: command_not_executed
    description: "No legacy inline-agent lifecycle commands (definition lives in the .flow)"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+agent\s+(init|refresh|validate)\s+.*--inline-in-flow'
    weight: 1.0
    pass_threshold: 1.0

  # Enforced: the server's slug/Key/Folder exist ONLY on the tenant — no
  # manifest fixture carries them, so discovery is outcome-necessary.
  - type: command_executed
    description: "Agent discovered the MCP server with uip solution resources list --kind mcpServer"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+solution\s+resources\s+list\s+.*mcpServer'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  # Enforced: the server's full tool list (Spec.Tools, escaped JSON schemas)
  # is tenant-only — resources get is how selectedTools entries are built.
  - type: command_executed
    description: "Agent fetched the MCP server spec (tool list) with uip solution resources get"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+solution\s+resources\s+get\b'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  # Enforced: MCP tool node types are DYNAMIC (one per registered server) —
  # search is how the exact type string is found (M4 posture), and it is the
  # documented gap gate.
  - type: command_executed
    description: "Agent searched the flow registry for the MCP tool node type"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+flow\s+registry\s+search\b'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent fetched the MCP tool node manifest from the flow registry"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+flow\s+registry\s+get\s+.*uipath\.agent\.resource\.tool\.mcp\.'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent fetched the inline autonomous agent node manifest from the flow registry"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+flow\s+registry\s+get\s+.*uipath\.agent\.autonomous'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  # Outcome-based check (auto-registration via `uip <kind> init` OR explicit
  # `uip solution project add` both populate Projects[] in the .uipx).
  - type: json_check
    description: "Project is registered in the parent solution .uipx"
    path: "DevToolsFlowSol/DevToolsFlowSol.uipx"
    assertions:
      - expression: "length(Projects)"
        operator: "gte"
        expected: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: file_exists
    description: "Flow file was created"
    path: "DevToolsFlowSol/DevToolsFlow/DevToolsFlow.flow"
    weight: 1.5
    pass_threshold: 1.0

  - type: file_contains
    description: "Flow embeds the inline agent and the MCP tool node types"
    path: "DevToolsFlowSol/DevToolsFlow/DevToolsFlow.flow"
    includes:
      - '"uipath.agent.autonomous"'
      - 'uipath.agent.resource.tool.mcp.'
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "Inline MCP tool: embedded agent + tool-handle edge + definitions + flat flow-form inputs (slug/serverUrl, referenceKey, parsed selectedTools) + no derived resource.json fields"
    command: 'python3 "$TASK_DIR/check_tool_mcp.py"'
    timeout: 30
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0

  - type: run_command
    description: "uip maestro flow validate passes on the authored flow"
    command: 'python3 "$TASK_DIR/../../_shared/validate_flow.py"'
    timeout: 120
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
