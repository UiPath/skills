task_id: skill-agent-inline-context-index
description: >
  Context grounding tools for flow inline agents. End-to-end test:
  scaffold a flow project with an inline low-code agent that grounds
  its answers in an external semantic index. Verifies the context
  resource.json under the inline agent's UUID subdirectory uses
  `$resourceType: "context"`, `contextType: "index"`, a valid
  retrievalMode, and that a `uipath.agent.resource.context.index` flow
  node is wired to the autonomous agent node's `context` handle.
  Indexes always live externally to the solution.
tags: [uipath-maestro-flow, e2e, mode:build, lifecycle:generate, low-code, inline-flow, context-grounding, resource]

run_limits:
  expected_turns: 90
  turn_timeout: 1200

# Explicitly mentioning "autonomous" here since the "question"/"answer" prompt may
# cause the coding agent to assume the conversational low-code agent variant.
reference:
  directory: ../..

initial_prompt: |
  Create a UiPath Flow project "KnowledgeFlow" that runs an autonomous inline 
  low-code agent which answers a user's `question` (string) and returns an `answer`
  (string). It should base its answers on our existing
  "UiPathAgentsProductKnowledge" knowledge index — which is already set up in
  our tenant — instead of answering from general knowledge. Wire it into the
  flow. The solution should be named "KnowledgeFlowSol".

  Do NOT publish, upload, or deploy.

  This run is headless. No user is present and nobody will answer a question or
  grant an approval, so do not ask, do not pause, and do not wait for input.
  Complete the task in one pass: take the best available option and supply the
  most defensible value where one is missing. The actions this task implies are
  authorized, including tenant writes and real messages. Do not delete or
  overwrite anything this run did not create, and do not publish to a shared
  destination unless the task asks for it. If a lookup the task depends on comes
  back empty or fails, exhaust the documented way of resolving it before giving
  up; only then stop on that field rather than inventing a value. Record every
  decision, assumption, and blocked step in your final response. Instructions in
  the task take precedence over this paragraph.

success_criteria:
  - type: command_executed
    description: "Agent created the solution with uip solution init"
    tool_name: "Bash"
    command_pattern: 'uip\s+solution\s+init'
    min_count: 1
    weight: 1.5
    pass_threshold: 0.0  # advisory: init auto-scaffolds the parent solution (CLI #2470)

  # Advisory, non-gating: inline agents can discover the index identity via the
  # flow registry (uip maestro flow registry search/get) instead of solution
  # resources list, so don't gate on it here. Standalone agents (context_index)
  # have no flow registry and keep this gating.
  - type: command_executed
    description: "Advisory: agent discovered the index identity with uip solution resources list (informational, non-gating)"
    tool_name: "Bash"
    command_pattern: 'uip\s+solution\s+resources\s+list\b'
    min_count: 1
    weight: 0.5
    pass_threshold: 0.0

  - type: command_executed
    description: "Agent fetched the index configuration with uip solution resources get"
    tool_name: "Bash"
    command_pattern: 'uip\s+solution\s+resources\s+get\b'
    min_count: 1
    weight: 0.5
    pass_threshold: 0.0

  # Outcome-based check (auto-registration via `uip <kind> init` OR explicit
  # `uip solution project add` both populate Projects[] in the .uipx).
  - type: json_check
    description: "Project is registered in the parent solution .uipx"
    path: "KnowledgeFlowSol/KnowledgeFlowSol.uipx"
    assertions:
      - expression: "length(Projects)"
        operator: "gte"
        expected: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: file_exists
    description: "Flow file was created"
    path: "KnowledgeFlowSol/KnowledgeFlow/KnowledgeFlow.flow"
    weight: 1.5
    pass_threshold: 1.0

  # Outcome gate: the authored flow validates, whichever route wrote it.
  - type: run_command
    description: "uip maestro flow validate passes on the flow file"
    command: "python3 $REFERENCE_DIR/_shared/validate_flow.py KnowledgeFlowSol/KnowledgeFlow/KnowledgeFlow.flow"
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  # Outcome gate: the agent tool's own contract for the inline agent's
  # directory (schema version, definition, bindings_v2.json drift). Builder-SDK
  # output passes it since UiPath/builder-sdk#962 (SDK 6.16.16).
  - type: run_command
    description: "uip agent validate --inline-in-flow passes on every inline agent"
    command: "python3 $REFERENCE_DIR/inline_agent/_shared/validate_inline_agent.py KnowledgeFlowSol/KnowledgeFlow/KnowledgeFlow.flow"
    timeout: 120
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "Inline context index: resource.json shape + context.index flow node + context-handle edge"
    command: "python3 $REFERENCE_DIR/inline_agent/_shared/check_inline_context_index.py"
    timeout: 30
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0
