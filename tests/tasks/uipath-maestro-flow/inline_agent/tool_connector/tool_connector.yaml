task_id: skill-flow-inline-tool-connector
description: >
  Add Integration Service connector tool (inline agent) — flow-file-first.
  End-to-end test: scaffold a flow project whose inline low-code agent
  (full definition embedded in the `uipath.agent.autonomous` node's
  `inputs`) exposes an IS connector activity (web search via the
  `uipath-uipath-airdk` GenAI connector) as a tool. Verifies a
  `uipath.agent.resource.tool.connector.<key>.<activity>` node wired to
  the agent's `tool` handle with its registry definition present, the
  CLI-populated `inputs.detail` (connection identity, endpoint/method,
  `essentialConfiguration`) written by `uip maestro flow node configure`,
  both connection `bindings[]` rows, and the configure-generated
  solution-side artifacts (`bindings_v2.json`, connection resource).
  No sidecar authored, no `uip agent` lifecycle commands. Cloud auth
  required — depends on the tenant exposing the `uipath-uipath-airdk`
  connector with an existing connection (in a non-default folder, so
  discovery needs `--all-folders`).
  Validate-only by design: `uip maestro flow debug` cannot yet run
  flow-only inline agents (no sidecar synthesis — known CLI gap pinned
  at roadmap M0), so `flow validate` is the grading ceiling; validate
  also checks nothing on connector nodes beyond `inputs.source`, so the
  content checker is the primary gate.
tags: [uipath-maestro-flow, e2e, mode:build, lifecycle:generate, node:inline-agent, shape:multi-node, connector]

run_limits:
  expected_turns: 65
  turn_timeout: 1200

initial_prompt: |
  Create a UiPath Flow project "ResearchFlow" that runs an inline low-code
  agent which can look things up on the web. Give the agent a tool so it can
  run web searches on demand, and wire it into the flow. The solution should be
  named "ResearchFlowSol".

  The task is NOT complete until `uip maestro flow validate` passes for the
  flow file.

  Do NOT publish, upload, or deploy. Do NOT ask for approval,
  confirmation, or feedback. Do NOT pause between planning and
  implementation. Complete the entire task end-to-end in a single pass.

success_criteria:
  - type: command_executed
    description: "Agent created the solution with uip solution init"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+solution\s+init'
    min_count: 1
    weight: 1.0
    pass_threshold: 0.0  # advisory: init auto-scaffolds the parent solution (CLI #2470)

  # Global transform (roadmap §7): the sidecar lifecycle verbs must not run —
  # the definition lives in the .flow.
  - type: command_not_executed
    description: "No legacy inline-agent lifecycle commands (definition lives in the .flow)"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+agent\s+(init|refresh|validate)\s+.*--inline-in-flow'
    weight: 1.0
    pass_threshold: 1.0

  # Enforced: the connection Id/FolderKey exist ONLY on the tenant — no
  # manifest or fixture carries them, so discovery is outcome-necessary.
  - type: command_executed
    description: "Agent discovered the IS connection with uip is connections list"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+is\s+connections\s+list\b'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  # Enforced: connector tool node types are DYNAMIC (one per connector
  # activity) — search is how the exact type string is found (M4 posture).
  - type: command_executed
    description: "Agent searched the flow registry for the connector tool node type"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+flow\s+registry\s+search\b'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent fetched the connector tool node manifest from the flow registry"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+flow\s+registry\s+get\s+.*uipath\.agent\.resource\.tool\.connector\.'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent fetched the inline autonomous agent node manifest from the flow registry"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+flow\s+registry\s+get\s+.*uipath\.agent\.autonomous'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  # Enforced: node configure is the only writer of a runtime-correct
  # inputs.detail (essentialConfiguration + uiPathActivityTypeId are not
  # hand-constructible) and of the solution-side connection artifacts.
  - type: command_executed
    description: "Agent populated the connector config with uip maestro flow node configure"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+flow\s+node\s+configure\b'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  # Outcome-based check (auto-registration via `uip <kind> init` OR explicit
  # `uip solution project add` both populate Projects[] in the .uipx).
  - type: json_check
    description: "Project is registered in the parent solution .uipx"
    path: "ResearchFlowSol/ResearchFlowSol.uipx"
    assertions:
      - expression: "length(Projects)"
        operator: "gte"
        expected: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: file_exists
    description: "Flow file was created"
    path: "ResearchFlowSol/ResearchFlow/ResearchFlow.flow"
    weight: 1.5
    pass_threshold: 1.0

  - type: file_contains
    description: "Flow embeds the inline agent and the connector tool node types"
    path: "ResearchFlowSol/ResearchFlow/ResearchFlow.flow"
    includes:
      - '"uipath.agent.autonomous"'
      - 'uipath.agent.resource.tool.connector.'
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "Inline IS connector tool: embedded agent + tool-handle edge + definitions + CLI-populated inputs.detail + connection bindings[] rows + configure-generated bindings_v2.json and solution connection resource"
    command: 'python3 "$TASK_DIR/check_tool_connector.py"'
    timeout: 30
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0

  - type: run_command
    description: "uip maestro flow validate passes on the authored flow"
    command: 'python3 "$TASK_DIR/../../_shared/validate_flow.py"'
    timeout: 120
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
