task_id: skill-agent-inline-mcp-server-tool
description: >
  MCP server tools for flow inline agents, asked the way a Studio Web user
  would ask it: build a Flow whose inline agent answers a question about a
  GitHub repository with the tools of the tenant's "GitHubMcp" MCP server.
  Graded offline on the wiring the runtime reads (an agent.tool ->
  `uipath.agent.resource.mcp.*` edge plus the inline agent's `$resourceType:
  "mcp"` resource.json for GitHubMcp, in any project layout), then by one debug
  run in which the inline agent completes and the named output `answer` gives
  octocat/Hello-World's default branch. Text between the helper markers is
  lower-tier guidance (experiments/use-case-tiers.yaml); the names it fixes (inputs
  repository and question, output answer) and GitHubMcp are what the criteria
  read.
tags: [uipath-maestro-flow, e2e-blocked, mode:build, lifecycle:generate, low-code, inline-flow, path-to-ga, outcome-graded, resource]
skip: true
# Skipped for now: wiring an inline MCP server tool into the flow is not yet
# reliable on the run tenant, and the run criterion needs an MCP server named
# "GitHubMcp" that can read public GitHub repositories to exist on that tenant.
# No recent run shows one there; provision it before re-enabling.

sandbox:
  template_sources:
    - type: template_dir
      path: ../../_setup
      mount_point: _setup
run_limits:
  expected_turns: 77
  turn_timeout: 1200
  task_timeout: 2700

reference:
  directory: ../..

post_run:
  - command: python3 _setup/cleanup_solutions.py
    timeout: 90
initial_prompt: |
  You are a coding agent in an empty Flow project. No user is present, and
  nobody will answer a question or grant approval, so do not ask, do not
  pause, and do not wait for input. Do not delete or overwrite anything this
  run did not create, except what the task asks you to change, and do not
  publish to a shared destination unless the task asks for it.

  Build an automation called "DevToolsFlow" in which an agent answers a
  developer's question about a GitHub repository. The automation should
  connect to our "GitHubMcp" MCP server so that the agent can look the
  repository up with that server's GitHub tools instead of guessing.

  It takes repository (owner/name, for example "octocat/Hello-World") and
  question, and returns the agent's reply as answer. Don't publish the
  automation yet.

  <!-- helper:start -->
  Build a Flow in this Flow project with an inline agent, not an agent project.
  GitHubMcp is an existing MCP server in the tenant.
  Inputs: repository (string), question (string). Outputs: answer (string).
  <!-- helper:end -->

  Build and test the automation.

success_criteria:
  - type: run_command
    description: "uip maestro flow validate passes on the flow file"
    command: "python3 $REFERENCE_DIR/_shared/validate_flow.py"
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  # Advisory: Studio Web agents may test with the RunProject proxy tool instead,
  # which the eval testbench stubs.
  - type: command_executed
    description: 'Advisory: the agent ran its own test run (uip maestro flow debug), as the request asks'
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+flow\s+debug(?!-instances)(?!\s+--help)'
    min_count: 1
    weight: 1.0
    pass_threshold: 0.0

  - type: run_command
    description: "The MCP tool is live, not just drawn: an inline agent's tool handle reaches a uipath.agent.resource.mcp.* node, and the agent project carries an enabled $resourceType=mcp resource.json for GitHubMcp"
    command: "python3 $REFERENCE_DIR/inline_agent/inline_mcp_server_tool/check_inline_mcp_server_tool.py wiring"
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "Effects: one debug run (repository octocat/Hello-World, asking for its default branch) in which the inline agent completed and the named output answer says master"
    command: "python3 $REFERENCE_DIR/inline_agent/inline_mcp_server_tool/check_inline_mcp_server_tool.py run"
    timeout: 1200
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0
