task_id: skill-agent-inline-mcp-server-tool
description: >
  MCP server tools for flow inline agents. End-to-end test: scaffold
  a flow project with an inline low-code agent that declares an MCP
  (Model Context Protocol) server as a resource. Verifies the
  resource.json under the inline agent's UUID subdirectory uses
  `$resourceType: "mcp"` (distinct from `$resourceType: "tool"`) with
  the documented sparse shape, and that a `uipath.agent.resource.mcp.*`
  flow node is wired to the autonomous agent node's `tool` handle.
tags: [uipath-maestro-flow, e2e-blocked, mode:build, lifecycle:generate, low-code, inline-flow, path-to-ga, resource]
skip: true
# Skipped for now — wiring an inline MCP server tool into the flow is not yet
# reliable on the run tenant. Re-enable once the inline MCP flow-node path works.

run_limits:
  expected_turns: 77
  turn_timeout: 1200

reference:
  directory: ../..

initial_prompt: |
  Create a UiPath Flow project "DevToolsFlow" that runs an inline low-code agent
  connected to our "GitHubMcp" MCP server so it can use that server's GitHub
  tools. Wire it into the flow. The solution should be named "DevToolsFlowSol".

  Do NOT publish, upload, or deploy.

  This run is headless. No user is present and nobody will answer a question or
  grant an approval, so do not ask, do not pause, and do not wait for input.
  Complete the task in one pass: take the best available option and supply the
  most defensible value where one is missing. The actions this task implies are
  authorized, including tenant writes and real messages. Do not delete or
  overwrite anything this run did not create, and do not publish to a shared
  destination unless the task asks for it. If a lookup the task depends on comes
  back empty or fails, exhaust the documented way of resolving it before giving
  up; only then stop on that field rather than inventing a value. Record every
  decision, assumption, and blocked step in your final response. Instructions in
  the task take precedence over this paragraph.

success_criteria:
  - type: command_executed
    description: "Agent created the solution with uip solution init"
    tool_name: "Bash"
    command_pattern: 'uip\s+solution\s+init'
    min_count: 1
    weight: 1.0
    pass_threshold: 0.0  # advisory: init auto-scaffolds the parent solution (CLI #2470)

  # Outcome-based check (auto-registration via `uip <kind> init` OR explicit
  # `uip solution project add` both populate Projects[] in the .uipx).
  - type: json_check
    description: "Project is registered in the parent solution .uipx"
    path: "DevToolsFlowSol/DevToolsFlowSol.uipx"
    assertions:
      - expression: "length(Projects)"
        operator: "gte"
        expected: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: file_exists
    description: "Flow file was created"
    path: "DevToolsFlowSol/DevToolsFlow/DevToolsFlow.flow"
    weight: 1.5
    pass_threshold: 1.0

  # Outcome gate for the authored flow. Path-neutral: it holds whether the
  # agent compiled a builder-SDK `.flow.ts` or edited the `.flow` JSON, so it
  # replaces the `uip agent init/refresh/validate --inline-in-flow` and
  # `uip maestro flow registry` trajectory gates the v1 recipe required.
  - type: run_command
    description: "uip maestro flow validate passes on the flow file"
    command: "python3 $REFERENCE_DIR/_shared/validate_flow.py DevToolsFlowSol/DevToolsFlow/DevToolsFlow.flow"
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "Inline MCP server: resource.json shape ($resourceType=mcp) + mcp flow node + tool-handle edge"
    command: "python3 $REFERENCE_DIR/inline_agent/_shared/check_inline_mcp_server_tool.py"
    timeout: 30
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0
