# Same-ground alignment expansion plan (Tao, 2026-08-21): loop-neutral
# v1-base prompt, outcome-graded criteria at preserved weights, and
# arm-agnostic artifact discovery.
task_id: skill-flow-rpa
description: >
  Create a UiPath Flow that uses the HelpDeskLookup RPA workflow to retrieve
  the title for ticket 123. Exercises RPA resource node discovery, registry
  get, and node wiring.
tags: [uipath-maestro-flow, e2e, lifecycle:generate, shape:single-node, resource]

run_limits:
  expected_turns: 26
  turn_timeout: 1200
  task_timeout: 2700  # 1380s grading + a turn; inherited 1200 could not fit grading

initial_prompt: |
  Build the flow inside a solution of the same name.

  Create a UiPath Flow project named "HelpDeskTicketTitle" that uses the
  HelpDeskLookup RPA workflow to retrieve the title for ticket 123 and
  return it as an output.

  Validate the flow.
  Do NOT ask for approval, confirmation, or feedback. Do NOT pause between planning and implementation. Build the complete flow end-to-end in a single pass.

success_criteria:
  # ── Flow file validity ─────────────────────────────────────────────────
  - type: run_command
    description: "uip maestro flow validate passes on the flow file"
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/_shared/validate_flow.py"
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  # ── Execution checks ──────────────────────────────────────────────────
  - type: run_command
    description: "Flow has an RPA node and debug returns the ticket title"
    command: "python3 $TASK_DIR/check_rpa_flow.py"
    timeout: 1200
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0

post_run:
  - command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/_shared/cleanup_solutions.py"
    timeout: 120
