task_id: skill-flow-subflow
description: >
  Create a UiPath Flow that uses a Subflow node to encapsulate string-reversal
  logic. The main flow takes a string input, passes it into a Subflow node that
  reverses the string, and returns the reversed result. Exercises Subflow node
  discovery, embedded subprocess construction, and variable passing between
  the parent flow and subflow.
tags: [uipath-maestro-flow, e2e, lifecycle:generate, shape:single-node, node:subflow]

run_limits:
  expected_turns: 24
  turn_timeout: 1200

initial_prompt: |
  Create a UiPath Flow project named "SubflowDemo" that takes a string input
  called "text" and reverses it. The string reversal logic should be
  encapsulated inside a subflow rather than done directly in the main flow.
  Return the reversed string as an output.

  Validate the flow.

  This run is headless. No user is present and nobody will answer a question or
  grant an approval, so do not ask, do not pause, and do not wait for input.
  Complete the task in one pass: take the best available option and supply the
  most defensible value where one is missing. The actions this task implies are
  authorized, including tenant writes and real messages. Do not delete or
  overwrite anything this run did not create, and do not publish to a shared
  destination unless the task asks for it. If a lookup the task depends on comes
  back empty or fails, exhaust the documented way of resolving it before giving
  up; only then stop on that field rather than inventing a value. Record every
  decision, assumption, and blocked step in your final response. Instructions in
  the task take precedence over this paragraph.
success_criteria:
  # -- Flow file validity --
  - type: run_command
    description: "uip maestro flow validate passes on the flow file"
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/_shared/validate_flow.py"
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  # -- Structural and execution checks --
  - type: run_command
    description: "Flow has correct subflow structure and debug reverses 'hello' to 'olleh'"
    command: "python3 $TASK_DIR/check_subflow_flow.py"
    # >= debug_budget(240) + margin, so a retry finishes inside the criterion
    # instead of being killed opaquely (exit -1, empty output).
    timeout: 600
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0

post_run:
  - command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/_shared/cleanup_solutions.py"
    timeout: 120
