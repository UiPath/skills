# Same-ground alignment expansion plan (Tao, 2026-08-21): loop-neutral
# v1-base prompt, outcome-graded criteria at preserved weights, and
# arm-agnostic artifact discovery.
task_id: skill-flow-lowcode-agent
description: >
  Create a UiPath Flow that wires in the existing CountLetters low-code agent
  (published to the tenant) to count the number of r's in 'arrow' and return
  the answer. The agent already exists, so the skill must DISCOVER it via the
  registry and wire it as a published agent resource node
  (uipath.core.agent.{key}) — NOT scaffold a new inline agent
  (uipath.agent.autonomous). Exercises published agent resource node discovery
  and wiring. A correct answer from an inline agent does not satisfy the test:
  the node-type check below requires the published-resource node.
tags: [uipath-maestro-flow, e2e, lifecycle:generate, shape:single-node, resource]

run_limits:
  expected_turns: 30
  turn_timeout: 1200

initial_prompt: |
  Build the flow inside a solution of the same name.

  Create a UiPath Flow project named "CountLettersLowCode" that uses the
  existing CountLetters low-code agent to count the number of r's in 'arrow'
  and return the answer. The agent already exists — discover it and wire it
  in rather than creating a new one.

  Validate the flow.

  This run is headless. No user is present and nobody will answer a question or
  grant an approval, so do not ask, do not pause, and do not wait for input.
  Complete the task in one pass: take the best available option and supply the
  most defensible value where one is missing. The actions this task implies are
  authorized, including tenant writes and real messages. Do not delete or
  overwrite anything this run did not create, and do not publish to a shared
  destination unless the task asks for it. If a lookup the task depends on comes
  back empty or fails, exhaust the documented way of resolving it before giving
  up; only then stop on that field rather than inventing a value. Record every
  decision, assumption, and blocked step in your final response. Instructions in
  the task take precedence over this paragraph.
success_criteria:
  # ── Flow file validity ─────────────────────────────────────────────────
  - type: run_command
    description: "uip maestro flow validate passes on the flow file"
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/_shared/validate_flow.py"
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  # ── Execution checks ──────────────────────────────────────────────────
  - type: run_command
    description: "Flow has an agent node and debug returns the letter count"
    command: "python3 $TASK_DIR/check_lowcode_agent_flow.py"
    timeout: 600
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0

post_run:
  - command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/_shared/cleanup_solutions.py"
    timeout: 120
