# Same-ground alignment expansion plan (Tao, 2026-08-21): loop-neutral
# v1-base prompt, outcome-graded criteria at preserved weights, and
# arm-agnostic artifact discovery.
task_id: skill-flow-file-attachment-debug
description: >
  Build a Flow whose trigger exposes a file-typed input variable, read the
  uploaded attachment's name, and surface it as flow output. Any node shape the
  skill sanctions is acceptable — a Script node body or the End node's
  `outputs.<varId>.source` `=js:` binding both resolve `.FullName`. Then verify
  the operate path: `uip maestro flow debug --attachment <varId>=<localPath>`
  uploads the local file, the runtime resolves it to a Flow Attachment object
  ({ID, FullName, MimeType, Metadata}), and the flow completes. The checker binds
  a randomly-named local file the agent never saw and asserts that name appears
  in the output — proving the attachment actually flowed through, not a
  hardcoded literal.
tags: [uipath-maestro-flow, e2e, mode:operate, lifecycle:generate, shape:single-node]

agent:
  type: claude-code
  permission_mode: acceptEdits
  allowed_tools: ["Skill", "Bash", "Read", "Write", "Edit", "Glob", "Grep"]

run_limits:
  turn_timeout: 1200

initial_prompt: |
  Build the flow inside a solution of the same name.

  Create a UiPath Flow project named "AttachmentEcho" that accepts a file as
  input and echoes the uploaded file's name back as a flow output. Use a
  file-typed input variable named `inputDoc` and surface the name as an output
  variable named `fileName`.

  Validate the flow, then run it with a local file bound to the input. The
  task is not complete until the run reports
  `finalStatus: "Completed"` and the output reflects the attached file's name.

  Before starting, follow the documented
  workflow steps exactly — in particular the file-attachment binding pre-flight
  and the requirement to run `solution resources refresh` before debug.

  This run is headless. No user is present and nobody will answer a question or
  grant an approval, so do not ask, do not pause, and do not wait for input.
  Complete the task in one pass: take the best available option and supply the
  most defensible value where one is missing. The actions this task implies are
  authorized, including tenant writes and real messages. Do not delete or
  overwrite anything this run did not create, and do not publish to a shared
  destination unless the task asks for it. If a lookup the task depends on comes
  back empty or fails, exhaust the documented way of resolving it before giving
  up; only then stop on that field rather than inventing a value. Record every
  decision, assumption, and blocked step in your final response. Instructions in
  the task take precedence over this paragraph.
success_criteria:
  # ── Flow file validity ─────────────────────────────────────────────────
  - type: run_command
    description: "uip maestro flow validate passes on the flow file"
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/_shared/validate_flow.py"
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  # ── Agent invoked debug with an --attachment binding ───────────────────
  - type: command_executed
    description: "Agent ran flow debug with an --attachment binding"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP|\$\{?UIP\}?)\s+(maestro\s+)?flow\s+debug.*--attachment\s+\S+=\S+'
    min_count: 1
    weight: 2.0
    pass_threshold: 1.0

  # ── Execution: attachment uploads, binds, and the file name round-trips ─
  - type: run_command
    description: "Debug with --attachment completes and the uploaded file name appears in the output"
    command: "python3 $TASK_DIR/check_file_attachment_flow.py"
    timeout: 600  # >= debug_budget(240) + margin
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0

post_run:
  - command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/_shared/cleanup_solutions.py"
    timeout: 120
