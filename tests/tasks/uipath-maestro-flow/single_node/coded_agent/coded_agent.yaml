task_id: skill-flow-coded-agent
description: |
  Build a Flow that uses a coded agent named ApproverCount to count, from a
  free-text sentence describing each reviewer's stance, how many people
  approved a proposal, asked the way a Studio Web user would ask it. The
  sentence is withheld from the prompt and passed only at debug time, so the
  answer cannot be hardcoded or regexed from known text. The graded debug run
  checks what the flow did: its agent node (uipath.core.agent, the node a coded
  Agent project gets; a coded Function is uipath.core.function) completed and
  the named output approvedCount is 3. Coded agents are not available in
  Studio Web (studio-web-unsupported), so this runs on the CLI harnesses only.
tags:
  - uipath-maestro-flow
  - e2e
  - mode:build
  - lifecycle:generate
  - shape:single-node
  - resource
  - path-to-ga
  - outcome-graded
  - studio-web-unsupported
  - studio-web-unsupported:coded-agent
sandbox:
  template_sources:
    - type: template_dir
      path: ../../_setup
      mount_point: _setup
run_limits:
  expected_turns: 35
  max_turns: 200
  turn_timeout: 1200
  task_timeout: 2400
reference:
  directory: ../..

initial_prompt: |
  You are a coding agent in an empty Flow project. No user is present, and
  nobody will answer a question or grant approval, so do not ask, do not
  pause, and do not wait for input. Do not delete or overwrite anything this
  run did not create, except what the task asks you to change, and do not
  publish to a shared destination unless the task asks for it.

  Build an automation called "ApproverCountAgent" that reads a text describing
  the outcome of a new proposal review round within our company and tells me
  how many people approved. Use a coded agent named "ApproverCount" for the
  analysis: it must find each person mentioned and decide whether they
  approved, requested changes, or recused themselves.

  The automation takes the text as an input and returns the number of
  approvers as approvedCount.

  <!-- helper:start -->
  Build a Flow in this Flow project that calls the coded agent.
  Input: text (string). Output: approvedCount (number).
  <!-- helper:end -->

  Build and test the automation.
success_criteria:
  - type: run_command
    description: uip maestro flow validate passes on the flow file
    command: python3 $REFERENCE_DIR/_shared/validate_flow.py
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
  - type: command_executed
    description: 'Advisory: the agent ran its own test run (uip maestro flow debug), as the request asks'
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+flow\s+debug(?!-instances)(?!\s+--help)'
    min_count: 1
    weight: 1.0
    pass_threshold: 0.0
  - type: run_command
    description: 'Effects: one debug run on a sentence the prompt never shows (Dana, Priya and Sam signed off; Marco asked for changes; Lena recused herself) in which the uipath.core.agent node completed and approvedCount = 3'
    command: python3 $REFERENCE_DIR/single_node/coded_agent/check_coded_agent.py
    timeout: 720
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0
  - type: skill_triggered
    description: "Advisory: agent engaged the uipath-maestro-flow skill"
    skill_name: "uipath-maestro-flow"
    expected_skill: "uipath-maestro-flow"
    weight: 0.0
    pass_threshold: 0.0
post_run:
  - command: python3 _setup/cleanup_solutions.py
    timeout: 120
