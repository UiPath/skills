# Same-ground alignment expansion plan (Tao, 2026-08-21): loop-neutral
# v1-base prompt, outcome-graded criteria at preserved weights, and
# arm-agnostic artifact discovery.
task_id: skill-flow-hitl-smoke-completed-port
description: >
  Smoke test: agent wires a per-outcome output port for each of the HITL
  node's two named outcomes (Approve, Reject) — not the generic
  `outcome-completed` placeholder, which only exists on a schema with zero
  outcomes. Verifies correct edge structure in a small approval flow with
  both outcome branches wired.
tags: [uipath-maestro-flow, uipath-human-in-the-loop, smoke, mode:build, lifecycle:generate, shape:multi-node, node:hitl]

run_limits:
  expected_turns: 24
  max_turns: 105
  # 600s was too tight for this multi-node HITL build on Bedrock: one
  # over-exploring turn hit 604s (commands ~38s; the rest was model latency)
  # and ERRORed before criteria ran. 900 matches sibling
  # smoke_03_multi_outcome_routing and the experiment default.
  turn_timeout: 900

initial_prompt: |
  Build a UiPath Flow named "PurchaseApproval" with this structure:
    Manual Trigger -> HITL (manager approves purchase) ->
      Approve: Script (log approval) -> End
      Reject: End

  The reviewer's form should be inline — rendered by Action Center.
  The HITL node shows the reviewer: purchase amount and vendor name.
  Outcomes: Approve and Reject.

  Wire both outcomes: Approve goes to the Script node, Reject goes straight
  to End. Every outcome needs its own wired edge — none left dangling.
  The Script node logs: "Approval recorded."

  Validate the flow after building.

  This run is headless. No user is present and nobody will answer a question or
  grant an approval, so do not ask, do not pause, and do not wait for input.
  Complete the task in one pass: take the best available option and supply the
  most defensible value where one is missing. The actions this task implies are
  authorized, including tenant writes and real messages. Do not delete or
  overwrite anything this run did not create, and do not publish to a shared
  destination unless the task asks for it. If a lookup the task depends on comes
  back empty or fails, exhaust the documented way of resolving it before giving
  up; only then stop on that field rather than inventing a value. Record every
  decision, assumption, and blocked step in your final response. Instructions in
  the task take precedence over this paragraph.
success_criteria:
  - type: run_command
    description: "Flow file was created"
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/_shared/flow_contains.py"
    timeout: 30
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "Flow wires a distinct outcome-<id> port for both Approve and Reject — not the generic outcome-completed placeholder"
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/_shared/flow_contains.py --regex '\"sourcePort\":\\s*\"outcome-approve\"' --regex '\"sourcePort\":\\s*\"outcome-reject\"' --absent-regex '\"sourcePort\":\\s*\"(outcome-)?completed\"'"
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  # outcome-completed is the zero-outcome placeholder only (confirmed against
  # flow-workbench source, 2026-09-10) — it disappears the instant the schema
  # has any real outcome. This node's schema has two (Approve, Reject), so the
  # correct wiring is one edge per outcome id, never a shared completed port.
  # The skill's own worked example for this exact "Approve/Reject" business
  # description assigns ids "approve"/"reject" (hitl-node-quickform.md
  # Example 1), so those literals are pinned rather than guessed.

  - type: run_command
    description: "uip maestro flow validate passes"
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/_shared/validate_flow.py"
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
