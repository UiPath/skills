task_id: skill-flow-hitl-smoke-multi-outcome-routing
description: >
  Smoke test: agent builds a flow where a Decision node reads the HITL
  reviewer's boolean field and routes to two separate downstream branches.
  Verifies both true and false edges of the Decision node are wired.
tags: [uipath-maestro-flow, uipath-human-in-the-loop, smoke, lifecycle:generate, shape:multi-node, node:hitl]

run_limits:
  expected_turns: 31
  max_turns: 80
  turn_timeout: 900

initial_prompt: |
  Build a UiPath Flow named "LeaveRequest" with this structure:

  1. Manual trigger
  2. HITL node — manager reviews leave request:
       - Reviewer sees (read-only): employee name, number of days
       - Reviewer fills in: approved (boolean)
       - Outcomes: Approve (primary), Reject
  3. Decision node — branches on the reviewer's approved field from the HITL output
  4. true branch  → Script node that logs "Leave approved" → End
  5. false branch → Script node that logs "Leave rejected" → End

  Use the inline quickform HITL node (uipath.human-in-the-loop.quick-form).
  Wire: Trigger → HITL →|completed| Decision → both branches → Script → End

  The Decision node condition must reference the HITL output using the
  correct runtime variable path ($vars.<nodeId>.output.<fieldName>).

  Validate the flow after building.

  This run is headless. No user is present and nobody will answer a question or
  grant an approval, so do not ask, do not pause, and do not wait for input.
  Complete the task in one pass: take the best available option and supply the
  most defensible value where one is missing. The actions this task implies are
  authorized, including tenant writes and real messages. Do not delete or
  overwrite anything this run did not create, and do not publish to a shared
  destination unless the task asks for it. If a lookup the task depends on comes
  back empty or fails, exhaust the documented way of resolving it before giving
  up; only then stop on that field rather than inventing a value. Record every
  decision, assumption, and blocked step in your final response.
success_criteria:
  - type: run_command
    description: "uip maestro flow validate passes"
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/_shared/validate_flow.py"
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "Flow contains inline HITL node"
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/_shared/flow_contains.py '\"uipath.human-in-the-loop.quick-form\"'"
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "Flow contains a Decision node"
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/_shared/flow_contains.py '\"core.logic.decision\"'"
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "Decision node references HITL output variable"
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/_shared/flow_contains.py '$vars.' '.output'"
    timeout: 30
    expected_exit_code: 0
    weight: 2.5
    pass_threshold: 1.0

  - type: run_command
    description: "Both Decision branches are wired (true and false handles present)"
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/_shared/flow_contains.py '\"true\"' '\"false\"'"
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

