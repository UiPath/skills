# Same-ground alignment expansion plan (Tao, 2026-08-21): loop-neutral
# v1-base prompt, outcome-graded criteria at preserved weights, and
# arm-agnostic artifact discovery.
# See workspaces/docs/flow-sdk/2026-08-21-maestro-flow-alignment-expansion-plan.md.
task_id: skill-flow-hitl-quality-result-downstream
description: >
  Quality test: agent correctly references the HITL node's output via
  $vars.<nodeId>.output in a downstream node. Tests that the agent knows
  the output variable path and wires it into a decision or script node.
tags: [uipath-maestro-flow, uipath-human-in-the-loop, integration, lifecycle:generate, shape:multi-node, node:hitl]

run_limits:
  expected_turns: 30
  max_turns: 65
initial_prompt: |
  Build a UiPath Flow named "ExpenseApproval" that:

  1. Manual trigger starts the flow
  2. HITL node — expense review:
       - Reviewer sees: expense amount, requester name, category (all read-only)
       - Reviewer fills in: approved (boolean), comments (text, optional)
       - Outcomes: Approve (primary), Reject
  3. Script node — reads the reviewer's decision from the HITL output and
     logs: "Decision: <approved value>, Comments: <comments value>"
     The script must reference the HITL output via $vars.<nodeId>.output —
     e.g. $vars.<nodeId>.output.approved and $vars.<nodeId>.output.comments,
     where <nodeId> is the HITL node's id.
  4. End node

  Wire: Trigger -> HITL ->|completed| Script -> End

  Use the inline quickform node (uipath.human-in-the-loop.quick-form).
  Validate the flow after building.

success_criteria:
  - type: run_command
    description: "uip flow validate passes"
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/_shared/validate_flow.py"
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "Flow contains inline HITL node"
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/_shared/check_simulated_hitl.py quick-form"
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "Flow references the HITL output variable"
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/_shared/flow_contains.py --flow-name ExpenseApproval '$vars.' '.output'"
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "Flow has a boolean output field for approved"
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/_shared/flow_contains.py --flow-name ExpenseApproval '\"boolean\"'"
    timeout: 30
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 1.0
