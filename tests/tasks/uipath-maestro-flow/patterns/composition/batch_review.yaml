task_id: skill-flow-pattern-composition-batch-review
description: >
  A batch of claims, each decided by an agent with human review below a
  confidence bar. Grades two patterns composed: the decision, gate, review and
  one shared apply step all inside the loop body, with failures and rejections
  moving on to the next item. The prompt never names either pattern.
  Validate-only by design: the per-item review suspends a headless debug run on
  the first low-confidence claim.
tags: [uipath-maestro-flow, integration, mode:build, lifecycle:generate, shape:multi-node, node:loop, node:decision, node:hitl]

run_limits:
  expected_turns: 30
  max_turns: 80
  turn_timeout: 900

reference:
  directory: ../..

initial_prompt: |
  Build a UiPath Flow project named "ClaimBatchReview". The flow takes a list of
  claims as input (`claims`). For each claim, an AI agent decides approve or deny
  and says how sure it is. Confident decisions are applied straight away. When
  the agent is less than 80% sure, a person reviews the decision first: if they
  approve it, it is applied the same way; if they reject it, that claim is
  skipped. One claim failing must not stop the others. Applying a decision is not
  built yet, so leave a clearly marked placeholder for it. Return the per-claim
  results as the output `results`.

  Registry reads are fine, but do NOT pack, deploy, or upload. The task is NOT
  complete until `uip maestro flow validate` passes on the generated flow.

  This run is headless. No user is present and nobody will answer a question or
  grant an approval, so do not ask, do not pause, and do not wait for input.
  Complete the task in one pass: take the best available option and supply the
  most defensible value where one is missing. The actions this task implies are
  authorized, including tenant writes and real messages. Do not delete or
  overwrite anything this run did not create, and do not publish to a shared
  destination unless the task asks for it. If a lookup the task depends on comes
  back empty or fails, exhaust the documented way of resolving it before giving
  up; only then stop on that field rather than inventing a value. Record every
  decision, assumption, and blocked step in your final response. Instructions in
  the task take precedence over this paragraph.

success_criteria:
  - type: run_command
    description: "uip maestro flow validate passes on the generated flow"
    command: "python3 $REFERENCE_DIR/_shared/validate_flow.py"
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "Inside one loop body: agent, gate, review and one shared apply step; failures and rejections continue the loop"
    command: "python3 $REFERENCE_DIR/patterns/composition/check_batch_review.py"
    timeout: 30
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0
