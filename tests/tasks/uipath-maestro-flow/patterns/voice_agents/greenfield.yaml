task_id: skill-flow-pattern-voice-agents
description: >
  A bank phone line: a triage voice agent hands the live call to the right
  specialist. Grades routing on the triage session's end reason, one call
  context across every voice agent, and one end-call the specialists converge
  on. The prompt never names the pattern.
  Validate-only by design: nothing local places a call (the voice trigger and
  call steps are not available on the tenant), so a run cannot exercise the
  handoff.
tags: [uipath-maestro-flow, integration, mode:build, lifecycle:generate, shape:multi-node, node:switch, feature:conversational, feature:trigger]

run_limits:
  expected_turns: 30
  max_turns: 80
  turn_timeout: 900

reference:
  directory: ../..

initial_prompt: |
  Build a UiPath Flow project named "BankPhoneLine". The flow answers incoming
  phone calls. A voice agent greets the caller and finds out whether they need
  help with cards or with loans. The call then goes, on the same line, to a voice
  agent that specializes in that topic; anything else goes to a general voice
  agent. The call ends when the specialist is done.

  Registry reads are fine, but do NOT pack, deploy, or upload. The task is NOT
  complete until `uip maestro flow validate` passes on the generated flow.

  This run is headless. No user is present and nobody will answer a question or
  grant an approval, so do not ask, do not pause, and do not wait for input.
  Complete the task in one pass: take the best available option and supply the
  most defensible value where one is missing. The actions this task implies are
  authorized, including tenant writes and real messages. Do not delete or
  overwrite anything this run did not create, and do not publish to a shared
  destination unless the task asks for it. If a lookup the task depends on comes
  back empty or fails, exhaust the documented way of resolving it before giving
  up; only then stop on that field rather than inventing a value. Record every
  decision, assumption, and blocked step in your final response. Instructions in
  the task take precedence over this paragraph.

success_criteria:
  - type: run_command
    description: "uip maestro flow validate passes on the generated flow"
    command: "python3 $REFERENCE_DIR/_shared/validate_flow.py"
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "A route on the triage agent's session reason to specialists that share one call context and converge on one end-call"
    command: "python3 $REFERENCE_DIR/patterns/voice_agents/check_greenfield.py"
    timeout: 30
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0
