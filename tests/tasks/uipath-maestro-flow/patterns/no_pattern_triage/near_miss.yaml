task_id: skill-flow-pattern-no-pattern-triage
description: >
  A near miss for routing-triage: an AI agent classifies support email and the
  flow routes it by category, but the request names no person. Verifies the
  router's gate holds: the agent builds classify-and-route without the
  pattern's human fallback or a review it was not asked for.
  Validate-only by design: the grade is what the agent did not add, which a
  run cannot show.
tags: [uipath-maestro-flow, integration, mode:build, lifecycle:generate, shape:multi-node, node:switch]

run_limits:
  expected_turns: 30
  max_turns: 80
  turn_timeout: 900

reference:
  directory: ../..

initial_prompt: |
  Build a UiPath Flow project named "TicketSorter". The flow takes a support
  email as input (`subject`, `body`). An AI agent sorts it into billing,
  technical or account. Each category ends the flow at its own end, which
  returns the category as the output `routedTo`.

  Registry reads are fine, but do NOT pack, deploy, or upload. The task is NOT
  complete until `uip maestro flow validate` passes on the generated flow.

  This run is headless. No user is present and nobody will answer a question or
  grant an approval, so do not ask, do not pause, and do not wait for input.
  Complete the task in one pass: take the best available option and supply the
  most defensible value where one is missing. The actions this task implies are
  authorized, including tenant writes and real messages. Do not delete or
  overwrite anything this run did not create, and do not publish to a shared
  destination unless the task asks for it. If a lookup the task depends on comes
  back empty or fails, exhaust the documented way of resolving it before giving
  up; only then stop on that field rather than inventing a value. Record every
  decision, assumption, and blocked step in your final response. Instructions in
  the task take precedence over this paragraph.

success_criteria:
  - type: run_command
    description: "uip maestro flow validate passes on the generated flow"
    command: "python3 $REFERENCE_DIR/_shared/validate_flow.py"
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "An agent classifies and the flow routes to one end per category, with no human task"
    command: "python3 $REFERENCE_DIR/patterns/no_pattern_triage/check_near_miss.py"
    timeout: 30
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0
