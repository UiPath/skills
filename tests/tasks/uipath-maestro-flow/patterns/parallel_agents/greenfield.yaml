task_id: skill-flow-pattern-parallel-agents
description: >
  A contract reviewed by three independent agents at once, then merged by one.
  Grades independent arms joined on a merge and a synthesis agent that reads
  every reviewer. The prompt never names the pattern.
  Validate-only by design: independence and the single join are graph
  properties; a run adds four agent calls and grades answer quality, not
  topology.
tags: [uipath-maestro-flow, integration, mode:build, lifecycle:generate, shape:multi-node, node:merge]

run_limits:
  expected_turns: 30
  max_turns: 80
  turn_timeout: 900

reference:
  directory: ../..

initial_prompt: |
  Build a UiPath Flow project named "ContractReview". The flow takes a contract
  as input (`contractText`). Three AI reviewers look at it at the same time,
  each from its own angle: legal exposure, financial terms, and operational risk.
  Then one AI agent combines their reviews into a single recommendation and calls
  out where the reviewers disagree. Return `recommendation` and `disagreements`.

  Registry reads are fine, but do NOT pack, deploy, or upload. The task is NOT
  complete until `uip maestro flow validate` passes on the generated flow.

  This run is headless. No user is present and nobody will answer a question or
  grant an approval, so do not ask, do not pause, and do not wait for input.
  Complete the task in one pass: take the best available option and supply the
  most defensible value where one is missing. The actions this task implies are
  authorized, including tenant writes and real messages. Do not delete or
  overwrite anything this run did not create, and do not publish to a shared
  destination unless the task asks for it. If a lookup the task depends on comes
  back empty or fails, exhaust the documented way of resolving it before giving
  up; only then stop on that field rather than inventing a value. Record every
  decision, assumption, and blocked step in your final response. Instructions in
  the task take precedence over this paragraph.

success_criteria:
  - type: run_command
    description: "uip maestro flow validate passes on the generated flow"
    command: "python3 $REFERENCE_DIR/_shared/validate_flow.py"
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "Three independent reviewers join on one merge, and one agent after it reads every reviewer"
    command: "python3 $REFERENCE_DIR/patterns/parallel_agents/check_greenfield.py"
    timeout: 30
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0
