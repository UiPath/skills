task_id: skill-flow-pattern-conversational-intake
description: >
  An equipment request gathered over chat, then submitted and confirmed in the
  same conversation. Grades the turn loop, an exit from it, and the report back
  after the exit. Needs a login: conversational agents resolve only for an
  authenticated client. The prompt never names the pattern.
  Validate-only by design: nothing local starts a conversation (the
  conversational nodes are not available on the tenant), so a run cannot
  exercise the turn loop.
tags: [uipath-maestro-flow, integration, mode:build, lifecycle:generate, shape:multi-node, node:decision, feature:conversational]

run_limits:
  expected_turns: 30
  max_turns: 80
  turn_timeout: 900

reference:
  directory: ../..

initial_prompt: |
  Build a UiPath Flow project named "EquipmentRequestChat". Employees request
  equipment in a chat. The flow starts when a conversation begins. An AI agent
  chats with the employee, one question at a time, until it knows the item, the
  quantity and the reason, and confirms them before finishing. Then the flow
  submits the request; the submission system is not built yet, so leave a
  clearly marked placeholder for it. Finally the flow tells the employee in the
  same chat that the request was submitted.

  Registry reads are fine, but do NOT pack, deploy, or upload. The task is NOT
  complete until `uip maestro flow validate` passes on the generated flow.

  This run is headless. No user is present and nobody will answer a question or
  grant an approval, so do not ask, do not pause, and do not wait for input.
  Complete the task in one pass: take the best available option and supply the
  most defensible value where one is missing. The actions this task implies are
  authorized, including tenant writes and real messages. Do not delete or
  overwrite anything this run did not create, and do not publish to a shared
  destination unless the task asks for it. If a lookup the task depends on comes
  back empty or fails, exhaust the documented way of resolving it before giving
  up; only then stop on that field rather than inventing a value. Record every
  decision, assumption, and blocked step in your final response. Instructions in
  the task take precedence over this paragraph.

success_criteria:
  - type: run_command
    description: "uip maestro flow validate passes on the generated flow"
    command: "python3 $REFERENCE_DIR/_shared/validate_flow.py"
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "A turn loop through wait-for-message and a conversational agent, an exit from it, and a message sent after the exit"
    command: "python3 $REFERENCE_DIR/patterns/conversational_intake/check_greenfield.py"
    timeout: 30
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0
