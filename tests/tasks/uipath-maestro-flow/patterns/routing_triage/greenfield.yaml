task_id: skill-flow-pattern-routing-triage
description: >
  Support email is classified and handled per category. Grades the confidence
  floor with a human fallback that reaches the same category handling as the
  confident route, rather than a second dispatch path. The prompt never names
  the pattern.
  Validate-only by design: the human fallback suspends a headless debug run
  before the routing under test is reached.
tags: [uipath-maestro-flow, integration, mode:build, lifecycle:generate, shape:multi-node, node:decision, node:switch, node:hitl]

run_limits:
  expected_turns: 30
  max_turns: 80
  turn_timeout: 900

reference:
  directory: ../..

initial_prompt: |
  Build a UiPath Flow project named "SupportTriage". The flow takes a support
  email as input (`subject`, `body`). An AI agent classifies it into one of
  Billing, Technical, or Account, and reports how sure it is. Confident items go
  straight to the handling for their category. Anything under the confidence bar
  goes to a person who picks the category, and it is then handled exactly as if
  the classifier had been confident. Each category ends the flow at its own
  end, which returns the category as the output `routedTo`.

  Registry reads are fine, but do NOT pack, deploy, or upload. The task is NOT
  complete until `uip maestro flow validate` passes on the generated flow.

  This run is headless. No user is present and nobody will answer a question or
  grant an approval, so do not ask, do not pause, and do not wait for input.
  Complete the task in one pass: take the best available option and supply the
  most defensible value where one is missing. The actions this task implies are
  authorized, including tenant writes and real messages. Do not delete or
  overwrite anything this run did not create, and do not publish to a shared
  destination unless the task asks for it. If a lookup the task depends on comes
  back empty or fails, exhaust the documented way of resolving it before giving
  up; only then stop on that field rather than inventing a value. Record every
  decision, assumption, and blocked step in your final response. Instructions in
  the task take precedence over this paragraph.

success_criteria:
  - type: run_command
    description: "uip maestro flow validate passes on the generated flow"
    command: "python3 $REFERENCE_DIR/_shared/validate_flow.py"
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "The human fallback shares the confident route's category handling"
    command: "python3 $REFERENCE_DIR/patterns/routing_triage/check_greenfield.py"
    timeout: 30
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0
