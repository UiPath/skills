task_id: skill-flow-datafabric-native-integration-read-create
description: >
  Integration test for the NATIVE Data Fabric entity nodes in Maestro Flow.
  Covers a `core.datafabric.read` -> `core.datafabric.create` chain on
  FlowCodeEvalEntity, authored with Edit/Write rather than `node add`, with
  `definitions[]` sourced from `registry get`. Static-validate only; runtime
  `flow debug` skipped to avoid live tenant side effects.

  Counterpart to connector_features/datafabric_connector/, whose tasks all pin
  themselves to the `uipath-uipath-dataservice` activities. Record CRUD defaults
  to the native node (planning-arch.md — Selecting External Service Nodes), so
  without this task nothing grades the default path.
tags: [uipath-maestro-flow, integration, mode:build, lifecycle:generate, shape:multi-node, feature:records, feature:entities, feature:registry]

run_limits:
  expected_turns: 30
  task_timeout: 1500
  max_turns: 100
  turn_timeout: 1200

pre_run:
  - command: 'python3 "$SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/node_features/datafabric_native/preflight_native_nodes.py" core.datafabric.read core.datafabric.create'
    timeout: 120
  - command: 'python3 "$SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/connector_features/datafabric_connector/ensure_entity.py" "$SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/connector_features/datafabric_connector/flow_code_eval_entity.entity.json"'
    timeout: 60

initial_prompt: |
  Build a UiPath Flow named NativeEntityReadCreate with a manual trigger that
  works against the FlowCodeEvalEntity Data Fabric entity:

  1. Read the record whose title is 'NativeReadSeed', returning a single record.
  2. Create a new record that carries values derived from that read:
       * title: 'NativeCreateFromRead'
       * description: reference the read record's description
       * score: 8.5
       * viewCount: reference the read record's viewCount
       * active: true

  Wire the Create node's inputs to the Read node's output so the second step
  actually consumes the first — do not restate the read values as literals where
  the prompt says to reference them.

  The Flow is not complete until `uip maestro flow validate` passes.

  This run is headless. No user is present and nobody will answer a question or
  grant an approval, so do not ask, do not pause, and do not wait for input.
  Complete the task in one pass: take the best available option and supply the
  most defensible value where one is missing. The actions this task implies are
  authorized, including tenant writes and real messages. Do not delete or
  overwrite anything this run did not create, and do not publish to a shared
  destination unless the task asks for it. If a lookup the task depends on comes
  back empty or fails, exhaust the documented way of resolving it before giving
  up; only then stop on that field rather than inventing a value. Record every
  decision, assumption, and blocked step in your final response. Instructions in
  the task take precedence over this paragraph.
success_criteria:
  - type: command_executed
    description: "Advisory: agent sourced the native definitions with `registry get`, not by hand"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+flow\s+registry\s+get\s+"?core\.datafabric\.'
    min_count: 1
    weight: 2.0
    pass_threshold: 0.0

  - type: command_executed
    description: "Flow file was validated"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+flow\s+validate'
    min_count: 1
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "Flow uses native core.datafabric.read + create on FlowCodeEvalEntity with registry-shaped definitions"
    command: "python3 $TASK_DIR/check_native_read_create.py"
    timeout: 30
    expected_exit_code: 0
    weight: 4.0
    pass_threshold: 1.0
