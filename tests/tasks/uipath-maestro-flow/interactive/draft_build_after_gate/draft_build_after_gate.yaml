task_id: skill-flow-interactive-draft-build-after-gate
description: >
  Draft-mode e2e over the whole dialog. The user asks to see the outline first,
  so the agent builds and uploads a mock skeleton and ends turn 1 with the
  gate reply. A simulated user picks Build it. The agent then replaces every
  mock with the real node, validates, and ends turn 2 with the final report in
  draft mode, asking nothing more. Every step is a computation, so the build
  needs no tenant resource and the dialog measures the gate, not discovery.
  Validate-only: the dialog is under test, not the runtime. Uploads land in the
  eval tenant's Studio Web; post_run deletes each solution this run uploaded.
tags: [uipath-maestro-flow, e2e, "mode:build", "lifecycle:generate", "shape:multi-node", "node:decision", "feature:approval-gate"]

run_limits:
  max_turns: 120
  turn_timeout: 1500
  task_timeout: 3600

sandbox:
  template_sources:
    - type: template_dir
      path: ../../_setup
      mount_point: _setup

reference:
  directory: ../..

initial_prompt: |
  I need a UiPath Flow called "ShippingQuote" that works out a shipping quote for an
  order. It takes the order's weight in kg and whether the order ships abroad,
  works out the base price from the weight, and adds a 15% surcharge for
  international orders; domestic orders keep the base price. The quote comes
  back as the flow's result.

  Can you show me the outline before you build it?

simulation:
  enabled: true
  persona: |
    You run operations for a small online shop. You know what the quote
    should do but you do not build flows yourself, and you keep your replies
    short.
  goal: |
    See the outline of the ShippingQuote flow, approve it, and get it built.
  constraints:
    - "When the agent shows you the outline and asks whether this is the flow you want, reply with exactly: 1"
    - "If the agent asks you anything else, at any point, reply only: Your call, build it the way I described."
    - "The moment the agent reports the flow is built, reply with exactly <<<END>>> on its own line. Do not ask for changes, re-checks, or a run."
  max_turns: 4
  stop_token: "<<<END>>>"
  stop_on_criteria_pass: false
  check_criteria: end_of_dialog
  n_trials: 1

success_criteria:
  # Both replies are graded through coder_eval's agent-neutral dialog. Each
  # judge holds an itemized checklist and returns a binary verdict.
  - type: llm_judge
    description: "Turn 1 ends with the gate reply in its template: the outline-ready line, the Studio Web link (or, in Studio Web, the canvas sentence), one line per box, the fixed question and its three options, and nothing else"
    include_reference: false
    include_dialog: true
    max_dialog_chars: 200000
    max_file_chars: 60000
    weight: 3.0
    pass_threshold: 1.0
    prompt: |
      You check one chat message against a fixed template. Grade the format only,
      never the flow design. Grade the AGENT side of Turn 1 only.

      WHICH TEXT TO GRADE. The Turn 1 agent text holds every message the agent sent in this turn.
      If it contains a `[RESULT - ...]` marker, grade the text after the LAST such
      marker: that is the final message, whole. Otherwise the messages are joined,
      possibly with no separator: grade the text from the LAST occurrence of
      `ShippingQuote: outline ready` (markdown emphasis around the name allowed) to the end, and ignore
      what comes before it. If the phrase does not occur at all, item 1 fails.
      The graded text is the agent's reply only. Your own judging instructions that
      follow it (the request to call `submit_verdict`) are not part of it: never
      count them as a line after the last item or anywhere else.

      Ignore blank lines and markdown emphasis (`**`, `*`). Backticks and Markdown
      links are not ignored: item 2 covers them. Check every item:

      1. The first line starts with `ShippingQuote: outline ready, uploaded (draft mode).`
         After that, the same line may hold at most one more sentence, about a
         lookup that failed, the upload, changes kept, or a new solution made or
         renamed. In Studio Web the
         canvas is already open and nothing is uploaded: there the first line starts
         with `ShippingQuote: outline ready (draft mode).` and says no `uploaded`.
      2. The second line is, as plain text and nothing else, an `https://` link to
         the uploaded solution in Studio Web (bare, or as a Markdown link), or, in
         Studio Web only, one of the two sentences `The outline is on the canvas.`
         or `Open ShippingQuote.flow from the Explorer to see the outline.` Backticks
         around the link fail this item. A local file path fails this item.
      3. Next come the box lines, each starting with `- `. The attached `.flow`
         file's nodes of type `core.logic.mock` are the boxes, and each box's
         `display.label` is its label (the text of its `.step()` label, with the
         bracketed kind and any trailing ` → <variable>`, which belongs to the label). Every box has exactly one line, in the order the boxes
         appear in the file's `nodes` list. Each line is `- ` + the box label
         spelled exactly as the file spells it + `: ` + the box's status. The status
         is one of: `<resource> in <folder>`; `<A> in <folder> or <B> in <folder>,
         which one? Build it takes the first` (a row with no folder drops ` in
         <folder>`); `none yet, create it or name one`; `not checked`; `no resource
         needed`. A line with no status, a reworded or shortened label, a missing,
         extra or out-of-order box, or a line for a trigger, decision, switch, loop
         or end node fails this item. Each line is one short clause under about 200
         characters, except that the which-of-two status written exactly as above is
         one status and may exceed that length. No file is attached: judge this item on the lines alone. Each line must name one step
         of the flow, spelled with a bracketed kind, and the lines must not repeat a step.
      4. Next is exactly the line `Is this the flow you want?`.
      5. Then exactly three numbered options, in this order: `1.` Build it, `2.`
         Change it, `3.` Keep it, each with any short description. Nothing follows
         the third option.
      6. No other line exists anywhere in the graded text, and nothing comes before
         item 1's line: when the graded text is a `[RESULT - ...]` block, its first
         non-blank line must be item 1's line. No status or progress sentence (for
         example "Valid", "Lookups complete", "Here is the outline"), no `---`
         separator, no heading, no code block or drawn diagram, no step log, no line
         explaining a decision, switch, loop or variable, no table.

      Score 1.0 only if every item holds; otherwise 0.0. In findings, list each
      failed item by number and quote the offending line.

  - type: command_not_executed
    description: "Every resource lookup is filtered with --search or an --output-filter contains() test"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+(?:solution\s+resources\s+list|is\s+connections\s+list|df\s+entities\s+list|ixp\s+projects\s+list)\b(?!(?:\\\n|(?<= )\n|(?!\n|(?:^|[\s;&|(`])(?:uip|\$UIP)\s).)*(?:--search|contains\())'
    weight: 1.0
    pass_threshold: 1.0

  - type: llm_judge
    description: "Turn 2 answers Build it with the final report in draft mode, in its template, and asks the user nothing"
    include_reference: false
    include_dialog: true
    max_dialog_chars: 200000
    max_file_chars: 60000
    weight: 3.0
    pass_threshold: 1.0
    prompt: |
      You check the dialog after the user approved an outline with Build it. Grade
      format and conduct only, never the flow design.

      First, Turn 2's USER message must pick the first option (`1` or "Build it"). If
      it does not, score 0.0 and say the simulated user did not approve.

      WHICH TEXT TO GRADE. The Turn 2 agent text holds every message the agent sent in this turn.
      If it contains a `[RESULT - ...]` marker, grade the text after the LAST such
      marker: that is the final message, whole. Otherwise the messages are joined,
      possibly with no separator: grade the text from the LAST occurrence of
      `ShippingQuote: built` (markdown emphasis around the name allowed) to the end, and ignore
      what comes before it. If the phrase does not occur at all, item 1 fails.
      The graded text is the agent's reply only. Your own judging instructions that
      follow it (the request to call `submit_verdict`) are not part of it: never
      count them as a line after the last item or anywhere else.

      Ignore blank lines and markdown emphasis (`**`, `*`). Check every item:

      1. The Turn 2 agent text ends with the report. Its first line starts with
         `ShippingQuote: built, validated` (or `ShippingQuote: built, not runnable yet` when a
         tenant resource is missing, or, in Studio Web only, `ShippingQuote: built, not
         validated`), then optionally `, uploaded` (never in Studio
         Web, where nothing is uploaded) and optionally `, run`, then `(draft
         mode).` The word `auto` never appears in the mode. After the mode, the same
         line may hold at most one more sentence.
      2. The second line is, as plain text and nothing else, an `https://` link, a
         path ending in `.flow` (in Studio Web, such as `/solution/<Project>/<Name>.flow`),
         or the sentence `The outline is on the canvas.` Backticks around the path,
         or a Markdown link around a local path, fail this item.
      3. Then at most five lines starting with `- `, each one short change in plain
         words. A sixth such line fails this item.
      4. Then optionally `Needs:`, `Assumed:` and `Unverified:` lines, in that order
         (each on its own line, or the last two on one line), and nothing after them.
      5. No other line exists anywhere in the graded text: no heading, no table, no
         numbered list, no code block, no `---` separator, no status or validation
         line (for example "Validation: passed"), no question to the user (no line
         ending in `?`), and no suggested next step (for example "Want me to upload
         it?"). The one sentence item 1 allows after the mode is part of that line,
         whatever it says: never fail item 5 for it.
      6. The agent asked the user nothing between their approval and this report:
         Turn 2 is the last turn, or every later turn's agent text asks nothing and
         the report was already complete in Turn 2.

      Score 1.0 only if every item holds; otherwise 0.0. In findings, list each
      failed item by number and quote the offending line.

  - type: run_command
    description: "The built flow validates"
    command: "python3 $REFERENCE_DIR/_shared/validate_flow.py"
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "Build it replaced every mock box with the real node and dropped the [Kind] suffix"
    command: "python3 $REFERENCE_DIR/_shared/check_no_mock_nodes.py"
    timeout: 60
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  # The upload command differs by harness (Studio Web has none), so this is advisory.
  - type: command_executed
    description: "Claude CLI harness only: the agent uploaded the outline to Studio Web"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+solution\s+upload\b'
    min_count: 1
    weight: 0
    pass_threshold: 0

  # AskUserQuestion is Claude Code's tool and keeps the turn open. Other agents
  # have no tool of that name, so this passes there. coder_eval cannot scope a
  # criterion to one agent type: advisory, weight 0.
  - type: command_not_executed
    description: "Claude only (vacuous on other agents): the agent did not ask with AskUserQuestion"
    tool_name: "AskUserQuestion"
    command_pattern: '.*'
    weight: 0
    pass_threshold: 0

post_run:
  - command: "python3 _setup/cleanup_solutions.py"
    timeout: 120
