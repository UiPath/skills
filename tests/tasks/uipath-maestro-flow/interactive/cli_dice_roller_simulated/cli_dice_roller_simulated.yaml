task_id: skill-flow-cli-dice-roller-simulated
description: >
  Dice-roller flow via CLI mode, but driven by a simulated non-technical user
  who withholds requirements until asked. Tests the agent's ability to
  clarify ambiguous asks before building.
tags: [uipath-maestro-flow, e2e, mode:build, lifecycle:generate, shape:multi-node, simulation]
run_limits:
  # Ceiling on agent turns across the whole dialog, with generous headroom so a
  # long build is never truncated mid-flow. The dialog length itself is bounded
  # by simulation.max_turns below.
  max_turns: 60
  task_timeout: 2400
  turn_timeout: 1200

agent:
  # Override only the system prompt; type, permission_mode, allowed_tools,
  # plugins, and sandbox all inherit from the experiment (tests/README.md —
  # don't duplicate the full agent block).
  system_prompt: |
    If you're unsure of anything, ask for more information.

# No initial_prompt — the simulator generates turn 1 from its persona + goal.

simulation:
  enabled: true

  persona: |
    You are a non-technical operations analyst. You have heard of UiPath but
    have never built a flow yourself. You speak in plain English, never in code.
    You are friendly but impatient: if the agent dithers, prod it to just build
    something. You cannot read or write code — if the agent shows you code, say
    "I trust you, just make it work."

  goal: |
    You ultimately want a UiPath Flow project that rolls a single six-sided die
    and prints the result (a random integer 1-6). You also want the project
    built via the uip CLI (uip maestro flow node add / edge add), not by hand-editing
    JSON, and you want it validated with uip maestro flow validate before you accept it.

    OPENING MESSAGE: open by stating, in plain English, (a) the outcome you
    want in one or two sentences, (b) that you need a UiPath Maestro Flow
    specifically — not an API workflow, not a script, and (c) that you want it
    validated before you sign off. Say nothing beyond that: every detail listed
    below stays withheld until the agent asks for it.

    CRITICAL: do NOT volunteer these details up front. Reveal each fact ONLY if
    the agent explicitly asks about it:
      - The project name should be "DiceRoller".
      - It should roll a SIX-sided die (1-6), just one die.
      - It should print / output the rolled number.
      - You want it built with the uip CLI commands, not by writing JSON.
      - You want "uip maestro flow validate" to pass before you sign off.
      - You do not require the project to execute before signing off.

    If the agent asks a clarifying question that covers several of these at
    once, answer only what they asked — do not pre-empt the rest.

  constraints:
    - "Never paste or read code. If shown code, say 'I trust you, just make it work.'"
    - "Do not mention 'CLI', 'uip', 'node', or 'edge' unless the agent brings them up first."
    - "Do not reveal the die has six sides unless asked about the number of sides or range."
    - "Do not reveal the project name 'DiceRoller' unless asked what to name it."
    - "You expect a UiPath Maestro Flow — i.e. a `.flow` file in the workspace. If the agent builds anything else (e.g. an API workflow), tell it you specifically want a Maestro Flow and are not satisfied until there is a `.flow` file."
    - "When the agent reports the flow is built and validated, do not accept it yet — first check the withheld list above. If any of those facts has not been communicated yet, ask the single question that surfaces the most important outstanding one. Once every withheld fact has been communicated AND the agent again reports the flow built and validated, reply with exactly <<<END>>> on its own line. Never ask for polish, re-checks, alternative designs, or improvements beyond that list — the grader verifies the result."

  max_turns: 8
  stop_token: "<<<END>>>"
  stop_on_criteria_pass: false
  check_criteria: end_of_dialog
  n_trials: 1

success_criteria:
  # Name-agnostic: any .flow the agent built must validate. The exact project
  # name is scored separately below so a working-but-misnamed flow still earns
  # most of the credit. (`**` skips dot-dirs, so .uipath/.skills flows are ignored.)
  - type: run_command
    description: "uip flow validate passes (any .flow)"
    command: "python3 -c \"import glob,subprocess,sys; flows=glob.glob('**/*.flow',recursive=True); sys.exit('no .flow file found') if not flows else sys.exit(subprocess.run(['uip','maestro','flow','validate',flows[0],'--output','json']).returncode)\""
    timeout: 60
    expected_exit_code: 0
    weight: 4.0
    pass_threshold: 1.0

  # Runtime check (mirrors the retired non-simulated original, check_dice_runs.py):
  # a Script node executes and the output is an integer in [1, 6]. Supersedes a
  # static grep for "random", which a flow that never executes would still pass.
  - type: run_command
    description: "Flow debug runs; Script node executed and output is an integer in [1,6]"
    command: "python3 $TASK_DIR/check_dice_runs.py"
    timeout: 300
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  # The project name is a WITHHELD, COSMETIC requirement (persona reveals it only
  # if asked what to name it) — the flow behaves identically whatever it's called.
  # Non-gating: reports whether the agent elicited the exact name (score 1/0), but
  # pass_threshold 0 keeps a cosmetic miss from failing the task and the low weight
  # keeps it from dominating the score.
  - type: run_command
    description: "Project/flow is named DiceRoller (elicited from the user)"
    command: "python3 -c \"import glob,sys; sys.exit(0 if glob.glob('**/DiceRoller.flow',recursive=True) else 'expected a flow named DiceRoller.flow')\""
    timeout: 15
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 0
