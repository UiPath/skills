# Same-ground alignment expansion plan (Tao, 2026-08-21): loop-neutral
# v1-base prompt, outcome-graded criteria at preserved weights, and
# arm-agnostic artifact discovery.
task_id: skill-flow-hitl-schema-design-simulated
description: >
  Purchase-order review flow with an inline HITL quickform (trigger → script →
  HITL → decision → approve/reject), driven by a simulated procurement officer.
  The opener states the read-only vs fill-in fields, the outcomes and the High
  priority; the project name, data source and trigger are withheld until asked.
  Tests whether the agent turns that description into the right quickform
  schema and carries the stated priority onto the review task.
  Validate-only — inline HITL nodes block on human review and can't be flow-debugged.
tags: [uipath-maestro-flow, uipath-human-in-the-loop, integration, mode:build, lifecycle:generate, shape:multi-node, node:hitl, simulation]

run_limits:
  # Ceiling on agent turns across the whole dialog, with generous headroom so a
  # long build is never truncated mid-flow. The dialog length itself is bounded
  # by simulation.max_turns below.
  max_turns: 80
  task_timeout: 2400
  turn_timeout: 1200

# No initial_prompt — the simulator generates turn 1 from its persona + goal.

reference:
  directory: ../..

simulation:
  enabled: true

  persona: |
    You are a non-technical procurement officer. You review purchase orders every
    day and know exactly what you need to see and decide, but you have never
    built a flow and you speak in plain English, never in code. You are friendly
    but impatient: if the agent dithers, prod it to just build something. You
    cannot read or write code — if the agent shows you code, say "I trust you,
    just make it work."

  goal: |
    You want a UiPath Flow that presents a purchase order to you for review
    and routes it based on your decision.

    OPENING MESSAGE: open the way you would to a colleague — a short paragraph
    covering the outcome you want plus the details that matter to you: the
    review is time-sensitive (use the exact priority sentence from the
    constraints); you need to see the PO number, the vendor name and the total
    amount, and you must not be able to change any of them; what you fill in
    is your decision, Approve or Reject, plus optional notes, with Approve as
    the main button; if you approve, a step logs "PO approved", and if you
    reject, the flow just ends. Say that it has to be built as a UiPath
    Maestro Flow — not an API workflow, not a standalone script — and that you
    want it validated before you sign off. Do not name files or paths and do
    not use technical wording. Close by inviting the agent to ask you anything
    it needs before it starts building. Keep the withheld items below to
    yourself until it asks.

    WITHHELD — reveal each of these ONLY if the agent asks about it:
      - The project name should be "VendorPOReview".
      - Where the PO data comes from: nowhere real yet — mock it, just set some
        values.
      - The flow should start manually.

  constraints:
    # Graded below: the priority must reach the agent verbatim every run.
    # Paraphrase drifted onto the build request or dropped it.
    - "Your opening message must contain this sentence word for word: 'The review is time-sensitive, so the review task itself must be marked High priority.' Word the rest of the message however you like."
    - "Never paste or read code. If shown code, say 'I trust you, just make it work.'"
    - "Do not mention 'HITL', 'quickform', 'schema', 'field', 'direction', 'outcome', or 'node' unless the agent brings them up first."
    - "If the agent describes its plan BEFORE building and has not treated the review as High priority, remind it then — but never after it has built."
    - "Do not reveal the project name 'VendorPOReview' unless asked what to name it."
    - "The one thing worth pushing back on: if the agent reports it built something that is not a Maestro Flow at all (e.g. an API workflow), tell it you specifically want a Maestro Flow — i.e. a `.flow` file in the workspace — and are not satisfied until there is one."
    - "If the agent asks you anything before it starts building, answer every outstanding question in ONE message — include any withheld fact it asked about, stated plainly — and then let it build."
    - "The moment the agent reports it has built the flow, the conversation is over: reply with exactly <<<END>>> on its own line. Do not ask for a rebuild, polish, re-checks, or alternative designs, and do not raise a requirement you have not mentioned yet — the grader verifies the result from here."
  max_turns: 8
  stop_token: "<<<END>>>"
  stop_on_criteria_pass: false
  check_criteria: end_of_dialog
  n_trials: 1

success_criteria:
  # Name-agnostic: any unambiguous generated .flow must validate. The exact
  # project name is scored separately below.
  - type: run_command
    description: "uip flow validate passes (any .flow)"
    command: "python3 $REFERENCE_DIR/_shared/validate_flow.py"
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  # Mirrors the skills-repo quality_01_schema_design checks (file_contains):
  # an inline HITL node with input-direction (read-only) AND output/inOut
  # (fill-in) fields and Approve+Reject outcomes. Priority is graded separately
  # below so a missing priority does not zero out an otherwise-correct schema.
  - type: run_command
    description: "HITL quickform has input + output fields and Approve/Reject outcomes"
    command: "python3 $REFERENCE_DIR/_shared/check_simulated_hitl.py schema"
    timeout: 15
    expected_exit_code: 0
    weight: 4.0
    pass_threshold: 1.0

  # Priority is a BEHAVIORAL (not cosmetic) requirement — High priority changes
  # the review's urgency/SLA. The opener states it word for word (see the
  # constraints), so this grades whether the agent applies a stated requirement,
  # not whether it elicits one. Split out of the schema check above so a missed
  # priority dings only its own weight, but still gating.
  - type: run_command
    description: "HITL review priority is set to High (stated in the opener)"
    command: "python3 $REFERENCE_DIR/_shared/check_simulated_hitl.py priority"
    timeout: 15
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 1.0

  # The project name is a WITHHELD, COSMETIC requirement (persona reveals it only
  # if asked what to name it) — the flow behaves identically whatever it's called.
  # Non-gating: reports whether the agent elicited the exact name (score 1/0), but
  # pass_threshold 0 keeps a cosmetic miss from failing the task and the low weight
  # keeps it from dominating the score.
  - type: run_command
    description: "Project/flow is named VendorPOReview (elicited from the user)"
    command: "python3 $REFERENCE_DIR/_shared/flow_contains.py --flow-name VendorPOReview"
    timeout: 15
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 0

  # Advisory (weight 0, pass_threshold 0): confirms the simulator kept the fixed
  # priority sentence in its opener. A 0 here means a priority miss above
  # measured the simulator, not the agent.
  - type: llm_judge
    description: "Advisory: the simulated user's opening message contains the fixed priority sentence"
    weight: 0
    pass_threshold: 0
    include_reference: false
    include_dialog: true
    prompt: |
      Look only at the USER message of Turn 1 in the dialog. Score 1.0 if it
      contains this sentence word for word (ignore case, surrounding quotes and
      trailing whitespace): "The review is time-sensitive, so the review task
      itself must be marked High priority." Score 0.0 if the sentence is
      missing, split, reworded, or attached to something other than the review
      task. Ignore every other turn and the agent's messages.
