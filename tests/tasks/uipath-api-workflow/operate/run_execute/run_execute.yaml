task_id: skill-api-workflow-operate-run-execute
description: >
  Operate (execute) a pre-seeded, already-valid API workflow — the score->grade
  evaluator in ./Workflow.json — for two inputs and report the grade each returns.
  mode:operate: the artifact is correct; the graded behavior is running it via
  `uip api-workflow run` and getting the right output, NOT authoring or repairing.
  Complements the build-mode authoring tasks and the diagnose-mode repair tasks
  with the third scorecard mode (running live). Graded on side effects: each
  run's raw output was saved to its own file (run_85.json grades PASS,
  run_40.json grades FAIL). Behavioral credit thus depends on real CLI output
  the agent captured — the valid seed cannot earn it, and the answer cannot be
  satisfied by transcribing a grade from the prompt.
tags: [uipath-api-workflow, integration, mode:operate, lifecycle:discover]

sandbox:
  python: {}

pre_run:
  - command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-api-workflow/operate/run_execute/seed_valid_workflow.py"
    timeout: 30

initial_prompt: |
  The API workflow in ./Workflow.json is a score->grade evaluator: it takes a
  numeric `score` input and returns a `grade` of "PASS" (score >= 60) or "FAIL".
  It is already valid — do not rewrite it.

  Execute it locally twice and save each run's full output to its own file:
    - score 85 -> save the run output to ./run_85.json
    - score 40 -> save the run output to ./run_40.json

  Do NOT ask for approval or confirmation.

success_criteria:
  # One criterion per input, each anchored on its score inside the SAME command
  # segment (the lookahead stops at newline / && / || / ; / | / the next uip), so
  # two runs chained in one Bash call still count once each, and a hand-written
  # run_40.json cannot stand in for the score-40 run (CONTRIBUTING.md: do not
  # score self-reports). A single pattern with min_count: 2 was a false negative
  # for && chaining (2026-09-01); min_count: 1 was a false positive for
  # one-real-run-plus-fabrication.
  - type: command_executed
    description: "Agent ran the workflow with the local runner for score 85"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+api-workflow\s+run(?=(?:(?!\n|&&|\|\||;|\||\s(?:uip|\$UIP)\s).)*(?<![A-Za-z0-9])85(?![0-9]))'
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent ran the workflow with the local runner for score 40"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+api-workflow\s+run(?=(?:(?!\n|&&|\|\||;|\||\s(?:uip|\$UIP)\s).)*(?<![A-Za-z0-9])40(?![0-9]))'
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0

  - type: file_exists
    description: "Agent captured the score-85 run output (proves it ran, did not just report)"
    path: "run_85.json"
    weight: 0.5
    pass_threshold: 1.0

  - type: file_exists
    description: "Agent captured the score-40 run output"
    path: "run_40.json"
    weight: 0.5
    pass_threshold: 1.0

  # Envelope checks, not bare greps: a fabricated file containing the string
  # "PASS" must not pass — the file has to be a real runner envelope
  # ({"Result": "Success", "Data": {...grade...}}).
  - type: run_command
    description: "Behavioral: the captured score-85 output is a real run envelope grading PASS"
    command: >-
      python3 -c "import json,sys; d=json.load(open('run_85.json'));
      sys.exit(0 if d.get('Result')=='Success' and 'PASS' in json.dumps(d.get('Data')) else 1)"
    timeout: 10
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "Behavioral: the captured score-40 output is a real run envelope grading FAIL"
    command: >-
      python3 -c "import json,sys; d=json.load(open('run_40.json'));
      sys.exit(0 if d.get('Result')=='Success' and 'FAIL' in json.dumps(d.get('Data')) else 1)"
    timeout: 10
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 1.0

  # Advisory sanity anchor: the seed itself must run correctly. Weight 0 so it
  # never awards score for grader-side execution the agent didn't perform.
  - type: run_command
    description: "Sanity: seeded workflow routes correctly (not an agent signal)"
    command: 'uip api-workflow run ./Workflow.json --no-auth --input-arguments ''{"score":85}'' --output json | grep -q ''"PASS"'''
    timeout: 60
    expected_exit_code: 0
    weight: 0
    pass_threshold: 0

run_limits:
  expected_turns: 6
  max_turns: 20
