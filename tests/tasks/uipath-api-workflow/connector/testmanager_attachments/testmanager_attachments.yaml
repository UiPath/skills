# skip:true, tenant-gated. CONFIRMED available in API Workflow (2026-06-15).
# Covers all 4 attachment activities. skip:true: agent-reliability-gated (multi-activity build + run flakes
# on turns/rate-limits). The codereval TM connection now exists.
task_id: skill-api-workflow-testmanager-attachments
description: >
  Coverage (API Workflow connector): agent authors an API Workflow using every
  UiPath Test Manager connector attachment activity — Upload Attachment, Get
  Attachments, Download Attachment, Delete Attachment. Drives registry resolve →
  connection ping → stub per activity → validate for `uipath-uipath-testmanager`.
tags: [uipath-api-workflow, e2e, mode:build, lifecycle:generate, connector]
skip: true

run_limits:
  task_timeout: 2400
  max_turns: 60
  turn_timeout: 1200

initial_prompt: |
  Build a UiPath API Workflow — in a project named `TMAttachments` (its workflow file will be `TMAttachments/Workflow.json`) — that uses the UiPath Test Manager Integration Service connector to exercise the full operation set — perform each of these:

  - Upload an attachment
  - Get attachments
  - Download an attachment
  - Delete an attachment

  The task is not complete until validation passed for the workflow.

  Do NOT ask for approval, confirmation, or feedback.
  Do NOT pause between planning and implementation.

success_criteria:
  - type: skill_triggered
    description: "Agent loaded the uipath-api-workflow skill"
    skill_name: "uipath-api-workflow"
    expected_skill: "uipath-api-workflow"
    weight: 1.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Discovered connector activities via the registry"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+api-workflow\s+registry\s+resolve\s'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Listed or pinged the testmanager connection"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+is\s+connections\s+(list[\s\S]{0,200}?uipath-uipath-testmanager|ping)'
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0

  # Gate on "the stub flow ran with a real connection", NOT on 4 separate calls:
  # min_count counts matching TOOL CALLS, so an agent that batches its 4 stub
  # commands into one Bash call scores 1/4 and fails despite correct work. The
  # per-activity count is graded behaviorally below, which is strictly stronger --
  # invoking stub 4 times proves nothing if the output was never wired in.
  - type: command_executed
    description: "Stubbed attachment activities via the registry with a real connection id"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+api-workflow\s+registry\s+stub[\s\S]+?--connection-id'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "Behavioral: workflow wires all 4 attachment activities as IntSvc connector calls"
    command: 'WF=$(find . -name Workflow.json -not -path "./Workflow.json" -not -path "*/node_modules/*" | head -1); test -n "$WF" && [ "$(grep -o ''"call"[[:space:]]*:[[:space:]]*"UiPath.IntSvc"'' "$WF" | wc -l)" -ge 4 ]'
    timeout: 10
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  # Advisory: records the one-stub-call-per-activity convention without docking
  # agents that batch. Weight 0 so it never moves the score.
  - type: command_executed
    description: "Convention: one stub invocation per activity (4) (advisory, batching not penalized)"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+api-workflow\s+registry\s+stub[\s\S]+?--connection-id'
    min_count: 4
    weight: 0
    pass_threshold: 0

  - type: command_executed
    description: "Validated the workflow"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+api-workflow\s+validate'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "A Workflow.json exists inside a project folder (not a bare root file)"
    command: 'WF=$(find . -name Workflow.json -not -path "./Workflow.json" -not -path "*/node_modules/*" | head -1); test -n "$WF"'
    timeout: 10
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "Workflow uses the testmanager IntSvc connector"
    command: 'WF=$(find . -name Workflow.json -not -path "./Workflow.json" -not -path "*/node_modules/*" | head -1); grep -q "uipath-uipath-testmanager" "$WF" && grep -q "UiPath.IntSvc" "$WF" && ! grep -q "<REPLACE_WITH_" "$WF"'
    timeout: 10
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0
