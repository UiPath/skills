task_id: skill-api-workflow-http-request-retry
description: >
  Build (brown-field): give one existing HTTP Request its own retry policy. The
  seeded `OrderSync` project holds a registry-shaped `UiPath.Http` GET. The agent
  must wrap it in an `HttpRequest_1#Retry` wrapper without `catch.do`, whose
  `catch.retry` has 4 retries, 1500 ms, exponential backoff, and a `when` filter
  on exactly 429 and 503 written exactly as
  `${ [<codes>].includes($<as>.status) }`. That is the regex Studio Web's
  `parseStatusCondition` reads, so spacing variants and `===` / `||` chains are
  graded wrong. A Try/Catch fails: Studio Web's Try/Catch has no status filter
  and drops a hand-written `when` on its next save.

  The call's `call`, `with`, `export` and non-display `metadata` must equal the
  seed. `activityType` / `displayName` / `fullName` may stay on the call (a stub
  wrapped as-is) or move to the wrapper, as Studio Web writes it; the wrapper
  must carry `activityType: Connector`. With the wrapper unwrapped, the rest of
  the workflow must equal the seed, and no workflow-level `httpRetryConfig` may
  be added.

  The validate criterion passes on Valid, or when every error is the documented
  validator gap of `uip` releases without UiPath/cli#5785: the three
  `catch/retry/when` schema errors and the wrapper's `must contain 'call'`. The
  skill gives agents the same rule, so the task scores the same before and after
  that CLI release.

  Offline: the call is never sent and no registry lookup is needed.
tags: [uipath-api-workflow, integration, mode:build, lifecycle:generate, shape:multi-node, feature:http]

sandbox:
  python: {}
  template_sources:
    - type: template_dir
      path: _setup
      mount_point: _setup

reference:
  directory: ..

pre_run:
  - command: "python3 _setup/seed.py"
    timeout: 60

run_limits:
  expected_turns: 12
  max_turns: 30

initial_prompt: |
  The HTTP Request in the `OrderSync` API workflow project fails now and then with
  429 and 503. Give that one activity a retry policy: up to 4 retries on exactly
  those two status codes, 1.5 seconds base delay, exponential backoff. Leave the
  rest of the workflow as it is.

  Validate. Do not run.

success_criteria:
  - type: run_command
    description: "HttpRequest_1 is unchanged and sits in a try whose catch.retry is 4 / 1500 ms / exponential, filtered on 429 and 503; no httpRetryConfig"
    command: "python3 $REFERENCE_DIR/check_activity_retry.py http"
    timeout: 20
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "uip api-workflow validate returns Valid"
    command: "python3 $REFERENCE_DIR/check_activity_retry.py validation"
    timeout: 60
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent ran the API Workflow static validator"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+api-workflow\s+validate'
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent respected the request not to execute the workflow"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+api-workflow\s+run'
    weight: 1.0
    pass_threshold: 1.0
