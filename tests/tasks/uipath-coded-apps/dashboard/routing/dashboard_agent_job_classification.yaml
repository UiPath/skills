task_id: uipath-coded-apps-dashboard-agent-job-classification
description: >
  Regression guard for the agent-job classification trap. An agent job is
  identified by the packageType/processType discriminator — NOT by sourceType,
  which is the trigger origin (an agent job can be triggered manually, and a
  manual job can have sourceType 'Agent'). Filtering on sourceType is wrong in
  both directions, and referencing a mapped field name like processName inside
  an OData filter throws. The skill teaches this in sdk/orchestrator.md.

  Field SPELLING is deliberately not graded: the SDK rewrites SDK names to raw
  API names inside filter/orderby/select/expand (packageType -> processType),
  so the skill states that either spelling works. Requiring one literal
  capitalisation failed agents that had followed the skill exactly.
tags: [uipath-coded-apps, integration, dashboard, mode:build, lifecycle:generate]

sandbox:
  node: {}

# Reclaim the build's node_modules before artifact preservation. The build
# installs a full ~200MB node_modules; the experiment-default prune (30s) can
# time out on it, bloating the preserved artifact. This task-level prune runs
# FIRST (post_run is cleanup-last: task commands, then experiment defaults) with
# a generous timeout so the heavy tree is gone before the sandbox is preserved.
post_run:
  - command: 'find . -maxdepth 5 -type d \( -name node_modules -o -name .npm-prefix \) -prune -exec rm -rf {} +'
    timeout: 180

initial_prompt: |
  Build a dashboard showing the error trend for my AI agents over the last
  week, derived from their Orchestrator job runs.

  This is a non-interactive automated test — there is NO user to approve the plan.
  Treat the plan as pre-approved and complete the whole build in this same turn. Do NOT end your turn at the plan, do
  NOT wait for confirmation, and do NOT ask any question.

success_criteria:
  - type: skill_triggered
    description: "Agent invoked the uipath-coded-apps skill"
    skill_name: "uipath-coded-apps"
    expected_skill: "uipath-coded-apps"
    weight: 1.0
    pass_threshold: 1.0

  # Correct agent-job classification: any spelling of the discriminator, never sourceType.
  - type: run_command
    description: "Metric module discriminates agent jobs on the packageType/processType field and never on sourceType"
    command: >
      python3 $SKILLS_REPO_PATH/tests/tasks/uipath-coded-apps/dashboard/_shared/check_dashboard.py
      --min-metrics 1 --require-substr "eq 'Agent'" --forbid-substr "sourceType"
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  # An OData filter string must never reference the mapped field processName
  # (mapped fields are read-only client-side; filtering on them throws).
  - type: run_command
    description: "No metric module references the mapped field processName on a line that also builds an OData filter"
    command: "sh -c '! grep -rn processName src 2>/dev/null | grep -q filter'"
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0
