task_id: skill-coded-apps-integration-sdk-imports-scopes
description: >
  Integration test (mode:build): agent writes a multi-service SDK module
  for a Coded Web App and the matching `uipath.json` (the skill's single
  SDK config source — no `.env`). Verifies three
  intersecting rules in one test:
  (1) Anti-pattern #1 — subpath imports only (`@uipath/uipath-typescript/<service>`),
  never the package root.
  (2) Anti-pattern #2 — constructor DI (`new Assets(sdk)`), never the deprecated
  dot-chain (`sdk.assets.getAll()`).
  (3) Rule #16 — the `scope` key in `uipath.json` covers every SDK method the
  agent calls; drift causes silent 401/403 on first invocation.
  Also Rule #8 — `baseUrl` is the API host for the stated portal. The prompt
  names the target environment (UiPath cloud) so the expected base URL does
  not depend on where the eval itself runs (cloud vs Automation Suite).
tags: [uipath-coded-apps, integration, mode:build, lifecycle:generate]
run_limits:
  expected_turns: 10

# Skill refs defer SDK signatures/scopes to the npm package — preinstall so the agent reads them locally.
sandbox:
  node:
    env_packages:
      - "@uipath/uipath-typescript"

initial_prompt: |
  Inside a UiPath Coded Web App, build `src/api.ts` and `uipath.json`.

  The app targets UiPath cloud: users sign in at the portal
  `https://cloud.uipath.com`, organization `acme`, tenant `Production`.
  It runs locally at `http://localhost:5173`.

  The app needs to call THREE SDK services at runtime:
    - Orchestrator Assets — read a single asset by name
    - Orchestrator Queues — list queues in the current folder
    - Action Center Tasks — list pending tasks assigned to the current user

  Write:

  1. `src/api.ts` — construct the `@uipath/uipath-typescript` SDK once and
     export three functions (`getAssetByName`, `listQueues`,
     `listPendingTasks`) that call the appropriate service classes.
     Follow the skill's documented import patterns and SDK construction
     conventions.

  2. `uipath.json` — the SDK config for the environment above, with every
     key the SDK reads. Use `00000000-0000-0000-0000-000000000000` as the
     client ID; every other value must be the real one for this
     environment, not a placeholder. The `scope` value must cover all
     three services above (read-level is fine for assets/queues; tasks
     needs whatever scope the skill documents for listing).

  Construct the SDK and every service instance INSIDE the module —
  exported functions take ONLY the data arguments shown above; do NOT
  accept service instances as parameters.

  Do NOT run `uip` or `npm` commands — this environment is not authenticated.

success_criteria:
  - type: file_exists
    description: "src/api.ts was created"
    path: "src/api.ts"
    weight: 1.0
    pass_threshold: 1.0

  - type: file_exists
    description: "uipath.json was created"
    path: "uipath.json"
    weight: 1.0
    pass_threshold: 1.0

  - type: file_contains
    description: "src/api.ts uses subpath imports for each service class (Anti-pattern #1 — never import service classes from the package root)"
    path: "src/api.ts"
    includes:
      - "@uipath/uipath-typescript/assets"
      - "@uipath/uipath-typescript/queues"
      - "@uipath/uipath-typescript/tasks"
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "src/api.ts does NOT import SERVICE CLASSES from the package root (Anti-pattern #1: `from '@uipath/uipath-typescript'` with no subpath). Root-level `{ UiPath }` / `import type { UiPath }` is allowed — the SDK class itself lives at the package root; only service classes are subpath-only."
    command: "sed 's|//.*||' src/api.ts | grep -v -E '^\\s*(/\\*|\\*/|\\*)' | grep -E \"from\\s+['\\\"]@uipath/uipath-typescript['\\\"]\" | grep -vE '\\bUiPath\\b'"
    timeout: 10
    expected_exit_code: 1
    weight: 2.5
    pass_threshold: 1.0

  - type: run_command
    description: "src/api.ts uses constructor DI: `new Assets(sdk)` rather than the deprecated dot-chain (Anti-pattern #2)"
    command: "grep -E \"new\\s+(Assets|Queues|Tasks)\\(\" src/api.ts"
    timeout: 10
    expected_exit_code: 0
    weight: 2.5
    pass_threshold: 1.0

  - type: run_command
    description: "src/api.ts does NOT use the deprecated dot-chain `sdk.assets.<method>()` form (Anti-pattern #2). Strips // line comments AND /* */ block-comment lines first — agents legitimately mention the dot-chain in JSDoc headers when documenting that they avoided it."
    command: "sed 's|//.*||' src/api.ts | grep -v -E '^\\s*(/\\*|\\*/|\\*)' | grep -E \"\\bsdk\\.(assets|queues|tasks)\\.\""
    timeout: 10
    expected_exit_code: 1
    weight: 2.0
    pass_threshold: 1.0

  - type: json_check
    description: "uipath.json is valid JSON and sets the five core SDK config keys — clientId, orgName and tenantName to the exact values the prompt gives (no placeholders), scope and baseUrl non-empty (their content is graded below)"
    path: "uipath.json"
    assertions:
      - expression: "clientId"
        operator: regex
        expected: "^0{8}-0{4}-0{4}-0{4}-0{12}$"
      - expression: "scope"
        operator: regex
        expected: "\\S"
      - expression: "orgName"
        operator: regex
        expected: "^acme$"
      - expression: "tenantName"
        operator: regex
        expected: "^Production$"
      - expression: "baseUrl"
        operator: regex
        expected: "\\S"
    weight: 2.0
    pass_threshold: 1.0

  - type: json_check
    description: "uipath.json scope includes a read-capable Assets scope token (`OR.Assets` or `OR.Assets.Read`; write-only does not cover the read call) (Rule #16 — missing scopes fail silently with 401/403)"
    path: "uipath.json"
    assertions:
      - expression: "scope"
        operator: regex
        expected: "(^|\\s)OR\\.Assets(\\.Read)?(\\s|$)"
    weight: 1.0
    pass_threshold: 1.0

  - type: json_check
    description: "uipath.json scope includes a read-capable Queues scope token (`OR.Queues` or `OR.Queues.Read`; write-only does not cover the read call) (Rule #16)"
    path: "uipath.json"
    assertions:
      - expression: "scope"
        operator: regex
        expected: "(^|\\s)OR\\.Queues(\\.Read)?(\\s|$)"
    weight: 1.0
    pass_threshold: 1.0

  - type: json_check
    description: "uipath.json scope includes a read-capable Tasks scope token (`OR.Tasks` or `OR.Tasks.Read`; write-only does not cover the read call) (Rule #16)"
    path: "uipath.json"
    assertions:
      - expression: "scope"
        operator: regex
        expected: "(^|\\s)OR\\.Tasks(\\.Read)?(\\s|$)"
    weight: 0.5
    pass_threshold: 1.0

  - type: json_check
    description: "uipath.json baseUrl is the API host for the stated cloud portal (Rule #8 — https://api.uipath.com, not https://cloud.uipath.com)"
    path: "uipath.json"
    assertions:
      - expression: "baseUrl"
        operator: regex
        expected: "^https://api\\.uipath\\.com/?$"
    weight: 1.5
    pass_threshold: 1.0
