prefixes:
  ont: https://ontology.uipath.com/demo#
mappings:
  Order:
    sources: [{table: Orders}]
    s: ont:Order/$(id)
    po:
      - [a, ont:Order]
      - [ont:Order.customerId, $(customerId)]
      - p: ont:customerId
        o:
          mapping: Customer
          condition: {function: equal}
