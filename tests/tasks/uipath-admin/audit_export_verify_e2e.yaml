task_id: skill-admin-audit-export-verify-e2e
description: >
  End-to-end test (artifact verification tier): agent drives the default
  `uip admin audit tenant export` (json) to produce a real folder of day-wise
  JSON files, then the harness verifies the artifact — a single CLI-generated
  `audit_<from>_<to>_<generatedAt>` folder under the requested base directory,
  every per-day file a JSON array, and every event carrying the LTS-schema keys.

  Fully outcome-graded: the leading `command_executed` regex is gone, so the
  grade rests entirely on what the export produced against the test tenant
  (authenticated via the workflow's ROPC bot-user auth). Scope is graded from the
  records themselves — tenant-scope events populate `TenantId` — which a command
  regex could not check.

  Whole-day granularity note: `uip admin audit ... export` issues one HTTP call
  per UTC day inside [--from-date, --to-date] and writes one <YYYY-MM-DD>.json
  file per day into the generated folder.

  The requested "past week" is graded from the CLI-generated output name, which
  carries the window bounds — so a single-day export cannot satisfy it even when
  the long-term store returns no rows for the window.

  LTS lag note: the export reads from the long-term store, which lags the live
  `events` endpoint by up to ~48h. The customer-style "past week" prompt
  therefore includes trailing days that may come back empty; the assertions are
  structural and tolerate an empty window — the CLI-generated output is itself
  the evidence the export ran, so no minimum event or file count is asserted.

  Blocker: this task requires the base-directory + generated-name export
  behavior in the published `@uipath/cli` (UiPath/cli#2585 must ship +
  publish, on top of #2534 (json folder) + #1372 (adds `uip admin audit`)).
  Until then `--output-path` is treated as the exact output folder (no
  generated subfolder) and the verifier reports no generated export found.
tags: [uipath-admin, e2e, mode:operate, lifecycle:discover, audit, export, real-artifact]

initial_prompt: |
  Can you export the past week's tenant audit events as JSON files? Save
  them in a folder called audit-window.

  Do NOT prompt the user for confirmation — this is an automated test.

  Run the export in the foreground and wait for it to finish before you reply —
  do not run it as a background task.

success_criteria:
  - type: run_command
    description: "./audit-window holds exactly one CLI-generated day-wise JSON export whose events carry the LTS schema and are tenant-scope"
    command: 'AUDIT_BASE_DIR=audit-window AUDIT_FORMAT=json AUDIT_DEEP=1 AUDIT_MIN_DAYS=5 AUDIT_EXPECT_SCOPE=tenant python3 -c "import os,runpy;runpy.run_path(os.path.join(os.environ[''SKILLS_REPO_PATH''],''tests'',''tasks'',''uipath-admin'',''verify_audit_export.py''))"'
    timeout: 90
    expected_exit_code: 0
    weight: 4.0
    pass_threshold: 1.0

run_limits:
  expected_turns: 10
  max_turns: 40
  turn_timeout: 600
