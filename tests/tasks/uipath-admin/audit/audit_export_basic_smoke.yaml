task_id: skill-admin-audit-export-basic-smoke
description: >
  Smoke test (outcome-graded): agent exports a single day of tenant audit events
  as JSON into the folder the user named. Graded on the artifact that landed on
  disk — the destination exists, holds a CLI-generated day-wise json export, and
  every per-day file is a JSON array — not on the command string.

  The old pair of regexes checked that `--from-date`/`--to-date`/`--output-path`
  appeared and that the path mentioned the requested folder. What actually
  matters to the user is that their events are in the folder they asked for, in
  the shape they asked for. The CLI-generated `audit_<from>_<to>_<generatedAt>`
  name is required, because it is the only evidence in this tier that a real
  export ran — nothing here re-queries the tenant, so accepting a freely-named
  layout would let a hand-written file pass.

  Deep record-schema assertions belong to the artifact-verify tier
  (audit_export_verify_e2e.yaml); this tier grades destination + shape only, so
  the two are not redundant.

  An empty export is a legitimate outcome: the long-term store lags the live
  `events` endpoint by up to ~48h, so yesterday may genuinely hold no rows. All
  assertions are structural.
tags: [uipath-admin, smoke, mode:operate, lifecycle:discover, audit, export]

run_limits:
  expected_turns: 5

initial_prompt: |
  Can you export all of yesterday's tenant audit events as JSON files so
  I can archive them? Save them in a folder called audit-yesterday.

  Do NOT prompt the user for confirmation — this is an automated test.

  Run the export in the foreground and wait for it to finish before you reply —
  do not run it as a background task.

success_criteria:
  - type: run_command
    description: "./audit-yesterday holds a CLI-generated day-wise JSON export of tenant-scope events"
    command: 'AUDIT_BASE_DIR=audit-yesterday AUDIT_FORMAT=json AUDIT_MIN_DAYS=1 AUDIT_EXPECT_SCOPE=tenant python3 -c "import os,runpy;runpy.run_path(os.path.join(os.environ[''SKILLS_REPO_PATH''],''tests'',''tasks'',''uipath-admin'',''audit'',''verify_audit_export.py''))"'
    timeout: 60
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
