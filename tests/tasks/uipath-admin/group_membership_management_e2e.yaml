task_id: skill-admin-identity-group-membership
description: >
  End-to-end test: agent manages group membership. Creates a custom
  group, discovers users, adds members, verifies membership, then
  removes a member. Tests full group lifecycle and the critical rule
  about using user IDs (not usernames) for membership operations.
tags: [uipath-admin, e2e, mode:build, lifecycle:setup]

run_limits:
  max_turns: 40
  turn_timeout: 600

initial_prompt: |
  Set up a new "Invoice Processing Team" group containing the first
  two users in the org, verify membership, then remove the second user.
  After removing, list members again to confirm only one remains.

  If a group with this name already exists, delete it first,
  then create the new one.

  Do NOT prompt the user for confirmation — this is an automated test.

success_criteria:
  - type: command_executed
    description: "Agent created the group with positional name"
    tool_name: "Bash"
    command_pattern: 'uip\s+admin\s+groups\s+create\s+"?Invoice\s+Processing\s+Team'
    min_count: 1
    weight: 2.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent listed users to resolve IDs"
    tool_name: "Bash"
    command_pattern: 'uip\s+admin\s+users\s+list'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent added members with --user-ids"
    tool_name: "Bash"
    command_pattern: 'uip\s+admin\s+groups\s+members\s+add\s+.*--user-ids'
    min_count: 1
    weight: 2.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent removed a member with members revoke"
    tool_name: "Bash"
    command_pattern: 'uip\s+admin\s+groups\s+members\s+revoke\s+.*--user-ids'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  # Outcome gate: read the group's final membership back from the tenant and
  # require exactly one member — the task's stated goal ("confirm only one
  # remains") after add-two / revoke-one. Replaces the old `members list` >=2
  # command-count check, which graded how many times the agent TYPED the verify
  # command rather than whether the end state was correct.
  - type: run_command
    description: "Group ends with exactly one member (first user retained, second revoked), read back from the tenant"
    command: 'GROUP_NAME="Invoice Processing Team" EXPECT_MEMBERS=1 python3 -c "import os,runpy;runpy.run_path(os.path.join(os.environ[''SKILLS_REPO_PATH''],''tests'',''tasks'',''uipath-admin'',''verify_group_member.py''))"'
    timeout: 90
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  # Advisory (pass_threshold 0): report that the agent self-verified via
  # `members list`, without gating on how many times it was typed — the outcome
  # gate above is the real verification.
  - type: command_executed
    description: "Agent self-verified membership via members list (advisory, non-gating)"
    tool_name: "Bash"
    command_pattern: 'uip\s+admin\s+groups\s+members\s+list'
    min_count: 1
    weight: 1.0
    pass_threshold: 0

post_run:
  - command: 'python3 -c "import os,runpy;runpy.run_path(os.path.join(os.environ[''SKILLS_REPO_PATH''],''tests'',''tasks'',''uipath-admin'',''cleanup_group.py''))"'
    timeout: 30
