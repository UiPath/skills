task_id: skill-admin-authz-check-access-folder-smoke
description: >
  Smoke test: agent answers a folder-level access question with
  `check-access` at **Folder** scope — `--scope Folder` plus `--folder-id`,
  the flag pair that replaced the older `--scope-id` / `--parent-folder-id`
  form. Two negative guards cover the replaced pair and the scope vocab
  limit from Rule 15 (`check-access --scope` accepts only Tenant or
  Folder, never Organization or Project).

  Complements authz_check_access_smoke, which covers only the default
  Tenant-scope form and the positional-identity contract; the Folder-scope
  flag pair is untested elsewhere. The `--file` request-body variant
  remains uncovered.

  Platform note: runs without an authenticated tenant — commands will fail
  with auth errors. That is acceptable; what matters is correct command
  construction, not a successful PDP response.
tags: [uipath-admin, smoke, mode:diagnose, lifecycle:discover, authz, check-access]

run_limits:
  expected_turns: 5

initial_prompt: |
  Sam Carter (sam.carter@example.com) says the Finance folder looks empty
  to him — its folder id is 7c1b9e40-3f52-4c8a-9b61-2d4e8f0a5c33. What
  access does he actually have inside that folder right now?

  Important:
  - The `uip` CLI is available but the `admin` subcommand may not be
    installed and/or the CLI is not connected to a live tenant.
    Commands WILL fail — that is expected and acceptable.
    Run each command exactly once regardless of errors.
    Do NOT retry, do NOT attempt to login, do NOT try to install tools,
    do NOT troubleshoot errors.
  - Do NOT prompt the user for confirmation — this is an automated test.

success_criteria:
  - type: skill_triggered
    description: "Agent activated the uipath-admin skill"
    skill_name: "uipath-admin"
    expected_skill: "uipath-admin"
    weight: 1.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent scoped check-access to the folder with `--scope Folder` and `--folder-id`"
    tool_name: "Bash"
    command_pattern: 'uip\s+admin\s+authorization\s+check-access(?=[\s\S]*--scope\s+Folder\b)(?=[\s\S]*--folder-id\s)[\s\S]*'
    min_count: 1
    weight: 3.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent passed the folder id from the request as `--folder-id`"
    tool_name: "Bash"
    command_pattern: 'uip\s+admin\s+authorization\s+check-access[\s\S]*--folder-id\s+\S*7c1b9e40-3f52-4c8a-9b61-2d4e8f0a5c33'
    min_count: 1
    weight: 2.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent passed the principal as the positional identity argument (no --identity-id flag exists)"
    tool_name: "Bash"
    command_pattern: 'uip\s+admin\s+authorization\s+check-access\s+(?!-)\S+'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent must NOT use the replaced `--scope-id` / `--parent-folder-id` pair (superseded by --folder-id)"
    tool_name: "Bash"
    command_pattern: 'uip\s+admin\s+authorization\s+check-access[\s\S]*--(?:scope-id|parent-folder-id)\b'
    weight: 2.0

  - type: command_not_executed
    description: "Rule 15: `check-access --scope` accepts only Tenant or Folder — never Organization or Project"
    tool_name: "Bash"
    command_pattern: 'uip\s+admin\s+authorization\s+check-access[\s\S]*--scope\s+(?:Organization|Project)\b'
    weight: 1.5
