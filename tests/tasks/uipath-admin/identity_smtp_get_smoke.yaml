task_id: skill-admin-identity-smtp-get-smoke
description: >
  Smoke test (outcome-graded): agent uses the uipath-admin skill to retrieve the
  organization's SMTP email settings and persist the JSON result. Graded on the
  settings object read back from the live tenant, NOT on the command string —
  agent-agnostic across Claude/codex. Converted from a command_executed check
  per PLT-107839.
tags: [uipath-admin, smoke, mode:operate, get]

run_limits:
  expected_turns: 6

initial_prompt: |
  Show me the current SMTP email settings for my UiPath organization. Save the
  complete JSON result to ./smtp.json so it can be reviewed.

  Do NOT prompt the user for confirmation — this is an automated test.

success_criteria:
  - type: run_command
    description: "smtp.json holds the SMTP settings object retrieved from the tenant"
    command: |
      python3 -c "
      import json
      d = json.load(open('smtp.json', encoding='utf-8-sig'))
      assert isinstance(d, dict) and 'Data' in d, f'not the uip success envelope; top-level={list(d) if isinstance(d, dict) else type(d).__name__}'
      data = d['Data']
      assert isinstance(data, dict) and len(data) >= 1, f'expected an SMTP settings object; got {type(data).__name__}'
      print(f'OK: SMTP settings retrieved; keys={list(data)[:10]}')
      "
    timeout: 15
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
