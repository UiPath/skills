task_id: skill-admin-oms-service-enable-disable-e2e
description: >
  End-to-end test of the tenant-service enable/disable surface:
  `tenants services disable`, `tenants services enable`, and the org-level
  catalog read `organizations services list-available`.

  Exercises the Rule 22 pinned-service branch deliberately. The disable
  target is Insights, one of the services (`connections`, `dataservice`,
  `insights`) that accepts the call and reports Success while the
  server-side status never flips. The prompt's success bar is therefore the
  real post-state, not the return code — graded via the mandatory re-list
  (`tenants services list` / `tenants get`) after each mutation.

  The pinned-service pre-flight offers the user "skip" or "continue
  anyway"; this request already elects continue-anyway (it asks for the
  real end state) and the automated-test guard bars a confirmation prompt,
  so the disable call is expected to run rather than be skipped.

  Also guards two surfaces that do not exist: there is no top-level
  `uip admin services ...` (service verbs are namespaced under `tenants`
  or `organizations`), and the org service surface is read-only — no
  `organizations services add|enable|disable|remove`.

  Distinct from oms_tenant_service_remove_e2e (add → remove) and
  oms_service_provisioning_smoke (list-available → add): the enable /
  disable pair, the pinned no-op branch, and the org-level catalog read are
  untested elsewhere.

  Command-construction only — no live tenant. Every graded mutation is
  either a documented server-side no-op (Insights disable) or idempotent
  (Test Manager enable), so a live nightly run cannot damage tenant state.
tags: [uipath-admin, e2e, mode:operate, lifecycle:setup, oms, service-provisioning]

run_limits:
  expected_turns: 12
  max_turns: 40
  turn_timeout: 600

initial_prompt: |
  Two things on our "Development" tenant. Insights should be switched off
  there — do that, and then tell me from the platform's own state whether
  it is genuinely off afterwards, not just whether the call came back
  successful. Separately, Test Manager is showing as disabled on that
  tenant and needs to be running again, so switch it back on and confirm
  that too. While you are in there, give me the organization-level service
  catalog so I know what else we could provision.

  Important:
  - The `uip` CLI is available but is not connected to a live tenant.
    Commands WILL fail with auth errors — that is expected and acceptable.
    Run each command exactly once regardless of errors. If a lookup gives
    you no tenant id, use a placeholder id and keep going so every step is
    exercised.
    Do NOT retry, do NOT attempt to login, do NOT troubleshoot errors.
  - Do NOT prompt the user for confirmation — this is an automated test.

success_criteria:
  - type: skill_triggered
    description: "Agent activated the uipath-admin skill"
    skill_name: "uipath-admin"
    expected_skill: "uipath-admin"
    weight: 1.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent resolved the named tenant via `tenants list` (advisory — codex may skip)"
    tool_name: "Bash"
    command_pattern: 'uip\s+admin\s+tenants\s+list\b'
    min_count: 1
    weight: 1.0
    pass_threshold: 0

  - type: command_executed
    description: "Agent read the org-level service catalog via `organizations services list-available`"
    tool_name: "Bash"
    command_pattern: 'uip\s+admin\s+organizations\s+services\s+list-available\b'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent disabled the pinned service via `tenants services disable --service insights`"
    tool_name: "Bash"
    command_pattern: 'uip\s+admin\s+tenants\s+services\s+disable[\s\S]*--service\s+insights\b'
    min_count: 1
    weight: 3.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent passed an explicit --tenant-id on the disable instead of falling through to the login tenant"
    tool_name: "Bash"
    command_pattern: 'uip\s+admin\s+tenants\s+services\s+disable[\s\S]*--tenant-id\s'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent re-enabled Test Manager via `tenants services enable --service testmanager`"
    tool_name: "Bash"
    command_pattern: 'uip\s+admin\s+tenants\s+services\s+enable[\s\S]*--service\s+testmanager\b'
    min_count: 1
    weight: 2.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Rule 22: agent verified real post-state after mutating (`tenants services list` or `tenants get`)"
    tool_name: "Bash"
    command_pattern: 'uip\s+admin\s+tenants\s+(?:services\s+list(?![-\w])|get)\b'
    min_count: 1
    weight: 2.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent verified post-state after BOTH mutations, not just once (advisory)"
    tool_name: "Bash"
    command_pattern: 'uip\s+admin\s+tenants\s+(?:services\s+list(?![-\w])|get)\b'
    min_count: 2
    weight: 1.0
    pass_threshold: 0

  - type: command_not_executed
    description: "Service verbs are namespaced — there is no top-level `uip admin services ...`"
    tool_name: "Bash"
    command_pattern: 'uip\s+admin\s+services\s'
    weight: 1.5

  - type: command_not_executed
    description: "Org service surface is read-only — no `organizations services add|enable|disable|remove`"
    tool_name: "Bash"
    command_pattern: 'uip\s+admin\s+organizations\s+services\s+(?:add|enable|disable|remove)\b'
    weight: 1.5
