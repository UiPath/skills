task_id: skill-admin-identity-list-pats-smoke
description: >
  Smoke test: agent retrieves the authenticated user's personal access tokens
  and saves the JSON. Graded on the PAT records read back from the live tenant,
  not the command string.
tags: [uipath-admin, smoke, mode:operate, lifecycle:discover, identity]

initial_prompt: |
  List all my personal access tokens in UiPath. Save the complete JSON result
  to ./pats.json so it can be reviewed.

  Do NOT prompt the user for confirmation — this is an automated test.

success_criteria:
  - type: run_command
    description: "pats.json holds real PAT records retrieved from the tenant"
    command: |
      python3 -c "
      import json
      d = json.load(open('pats.json', encoding='utf-8-sig'))
      res = d.get('Result') if isinstance(d, dict) else None
      assert res in (None, 'Success'), f'retrieval not successful: Result={res}'
      data = d['Data'] if isinstance(d, dict) and 'Data' in d else d
      def lists(o):
          if isinstance(o, list):
              yield o
              for v in o: yield from lists(v)
          elif isinstance(o, dict):
              for v in o.values(): yield from lists(v)
      coll = data if isinstance(data, list) else next((L for L in lists(data)), None)
      assert coll is not None, f'no PAT collection found; saved type={type(d).__name__}'
      # A given user may legitimately have zero PATs; when present they carry Id/Name.
      if coll:
          r = coll[0]
          assert isinstance(r, dict) and ('Id' in r or 'Name' in r), f'PAT record missing Id/Name; keys={list(r)[:10]}'
      print(f'OK: PAT collection retrieved; count={len(coll)}')
      "
    timeout: 15
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
