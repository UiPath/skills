task_id: skill-admin-identity-list-pats-smoke
description: >
  Smoke test: agent retrieves the authenticated user's personal access tokens
  and saves the JSON. Graded on the PAT records read back from the live tenant,
  not the command string.
tags: [uipath-admin, smoke, mode:operate, lifecycle:discover]

run_limits:
  expected_turns: 6

initial_prompt: |
  List all my personal access tokens in UiPath. Save the complete JSON result
  to ./pats.json so it can be reviewed.

  Do NOT prompt the user for confirmation — this is an automated test.

success_criteria:
  - type: run_command
    description: "pats.json holds real PAT records retrieved from the tenant"
    command: |
      python3 -c "
      import json
      d = json.load(open('pats.json', encoding='utf-8-sig'))
      assert isinstance(d, dict) and d.get('Result') == 'Success' and 'Data' in d, f'not a successful uip retrieval; top-level={list(d) if isinstance(d, dict) else type(d).__name__}'
      rows = d['Data']
      assert isinstance(rows, list) and len(rows) >= 1, f'expected a list of PATs; got {type(rows).__name__} len={len(rows) if isinstance(rows, list) else None}'
      r = rows[0]
      assert 'Id' in r or 'Name' in r, f'PAT record missing Id/Name; keys={list(r)[:10]}'
      print(f'OK: {len(rows)} PATs retrieved; sample keys={list(r)[:8]}')
      "
    timeout: 15
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
