task_id: skill-admin-identity-troubleshoot-login-failure-smoke
description: >
  Diagnose smoke: agent investigates failed logins for a user by querying
  ORG-scoped audit (login events are org-scoped, not tenant). Graded on the org
  audit events read back from the tenant plus a guard that tenant-scoped audit
  was NOT used — not the command string.
tags: [uipath-admin, smoke, mode:diagnose, lifecycle:discover, audit, troubleshoot, login-history]

run_limits:
  expected_turns: 12

initial_prompt: |
  We suspect bob@contoso.com's account may be compromised — there have been
  multiple failed login attempts over the past week. Investigate the login
  history and save the retrieved audit events to ./login-events.json.

  Do NOT use the uipath-troubleshoot skill.

  Do NOT prompt the user for confirmation — this is an automated test.

success_criteria:
  - type: run_command
    description: "login-events.json holds an audit-events collection retrieved from the tenant"
    command: |
      python3 -c "
      import json
      d = json.load(open('login-events.json', encoding='utf-8-sig'))
      # Tolerate how the agent saved it: full {Result,Code,Data} envelope, the
      # unwrapped Data, or a bare events array.
      data = d['Data'] if isinstance(d, dict) and 'Data' in d else d
      def lists(o):
          if isinstance(o, list):
              yield o
              for v in o: yield from lists(v)
          elif isinstance(o, dict):
              for v in o.values(): yield from lists(v)
      res = d.get('Result') if isinstance(d, dict) else None
      assert res in (None, 'Success'), f'audit retrieval not successful: Result={res}'
      events = data if isinstance(data, list) else next((L for L in lists(data)), None)
      assert events is not None, f'no audit events list found; saved type={type(d).__name__}'
      assert all(isinstance(e, dict) for e in events), 'audit events are not record objects'
      print(f'OK: org audit events retrieved; events={len(events)}')
      "
    timeout: 15
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent must NOT query tenant-scoped audit for login events (login is org-scoped)"
    tool_name: "Bash"
    command_pattern: 'uip\s+admin\s+audit\s+tenant\s+events\b'
    weight: 2.0
