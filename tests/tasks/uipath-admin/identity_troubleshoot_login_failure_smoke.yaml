task_id: skill-admin-identity-troubleshoot-login-failure-smoke
description: >
  Diagnose smoke: agent investigates failed logins for a user by querying
  ORG-scoped audit (login events are org-scoped, not tenant). Graded on the org
  audit events read back from the tenant plus a guard that tenant-scoped audit
  was NOT used — not the command string.
tags: [uipath-admin, smoke, mode:diagnose, lifecycle:discover, audit, troubleshoot, login-history]

run_limits:
  expected_turns: 12

initial_prompt: |
  We suspect bob@contoso.com's account may be compromised — there have been
  multiple failed login attempts over the past week. Investigate the login
  history and save the retrieved audit events to ./login-events.json.

  Login events are recorded at the ORGANIZATION scope, not the tenant scope.
  Do NOT use the uipath-troubleshoot skill.

  Do NOT prompt the user for confirmation — this is an automated test.

success_criteria:
  - type: run_command
    description: "login-events.json holds an audit-events collection retrieved from the tenant"
    command: |
      python3 -c "
      import json
      d = json.load(open('login-events.json', encoding='utf-8-sig'))
      assert isinstance(d, dict) and d.get('Result') == 'Success' and 'Data' in d, f'not a successful uip retrieval; top-level={list(d) if isinstance(d, dict) else type(d).__name__}'
      data = d['Data']
      assert isinstance(data, list), f'audit events not a list; got {type(data).__name__}'
      print(f'OK: org audit events retrieved; count={len(data)}')
      "
    timeout: 15
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent must NOT query tenant-scoped audit for login events (login is org-scoped)"
    tool_name: "Bash"
    command_pattern: 'uip\s+admin\s+audit\s+tenant\s+events\b'
    weight: 2.0
