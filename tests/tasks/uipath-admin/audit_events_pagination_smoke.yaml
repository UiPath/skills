task_id: skill-admin-audit-events-pagination-smoke
description: >
  Smoke test (outcome-graded): agent requests more events than a single server
  page can return (>200), exercising the CLI's internal pagination. Graded on the
  events read back from the live tenant, not the command string.

  The old criterion matched `--limit <n>` with n>200 in the command text. What
  actually matters is that the retrieval crossed the server's 200-record page cap
  — which is only possible if pagination happened, whether the CLI did it
  internally (correct) or the agent looped cursors itself. The count assertion is
  self-calibrating: the harness issues the same request and lowers the bar to the
  volume the tenant actually holds, so the test grades the agent rather than the
  org's activity level, and the pagination assertion only applies when the tenant
  really can return more than one page.
tags: [uipath-admin, smoke, mode:diagnose, lifecycle:discover, audit, pagination]

initial_prompt: |
  I'm doing a compliance review — I need the 500 most recent audit events from
  this tenant's audit trail over the last 30 days, across all event sources
  (don't narrow to any one source). Save the complete JSON result to
  ./events.json so I can review it.

  Save the raw JSON exactly as the command returns it — do not filter, reshape, or
  summarize it.

  Do NOT prompt the user for confirmation — this is an automated test.

success_criteria:
  - type: run_command
    description: "events.json holds real tenant events inside the 30d window, capped at 500, and reaching the volume the tenant actually returns (crossing the 200-record page cap when available)"
    command: 'AUDIT_FILE=events.json AUDIT_SCOPE=tenant AUDIT_WINDOW_DAYS=30 AUDIT_MAX_COUNT=500 AUDIT_MIN_COUNT=500 python3 -c "import os,runpy;runpy.run_path(os.path.join(os.environ[''SKILLS_REPO_PATH''],''tests'',''tasks'',''uipath-admin'',''verify_audit_events.py''))"'
    timeout: 360
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
