task_id: skill-admin-identity-list-users-smoke
description: >
  Smoke test (outcome-graded): agent uses the uipath-admin skill to retrieve the
  organization's identity users and persist the JSON result. Graded on the data
  read back from the live tenant (a non-empty user array with id fields), NOT on
  the command string — agent-agnostic across Claude/codex. Converted from a
  command_executed check per PLT-107839.
tags: [uipath-admin, smoke, mode:operate, list]

run_limits:
  expected_turns: 4

initial_prompt: |
  List all users in my UiPath organization. Save the complete JSON result
  to ./users.json so it can be reviewed.

  Do NOT prompt the user for confirmation — this is an automated test.

success_criteria:
  - type: run_command
    description: "users.json holds real user records retrieved from the tenant (non-empty array with id fields)"
    command: |
      python3 -c "
      import json
      d = json.load(open('users.json', encoding='utf-8-sig'))
      assert isinstance(d, dict) and 'Data' in d, f'not the uip success envelope; top-level={list(d) if isinstance(d, dict) else type(d).__name__}'
      rows = d['Data']
      assert isinstance(rows, list) and len(rows) >= 5, f'expected a list of real users; got {type(rows).__name__} len={len(rows) if isinstance(rows, list) else None}'
      r = rows[0]
      assert 'Id' in r and 'Email' in r, f'user record missing Id/Email; keys={list(r)[:10]}'
      em = str(r.get('Email', ''))
      assert '@' in em, 'user Email not an address: ' + em
      print(f'OK: {len(rows)} users retrieved; sample keys={list(r)[:8]}')
      "
    timeout: 15
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
