task_id: skill-admin-identity-list-users-smoke
description: >
  Smoke test (outcome-graded): agent uses the uipath-admin skill to retrieve the
  organization's identity users and persist the JSON result. Graded on the data
  read back from the live tenant (a non-empty user array with id fields), NOT on
  the command string — agent-agnostic across Claude/codex. Converted from a
  command_executed check per PLT-107839.
tags: [uipath-admin, smoke, mode:operate, list]

run_limits:
  expected_turns: 4

initial_prompt: |
  List all users in my UiPath organization. Save the complete JSON result
  to ./users.json so it can be reviewed.

  Do NOT prompt the user for confirmation — this is an automated test.

success_criteria:
  - type: run_command
    description: "users.json holds real user records retrieved from the tenant (non-empty array with id fields)"
    command: |
      python3 -c "
      import json
      d = json.load(open('users.json', encoding='utf-8-sig'))
      def lists(o):
          if isinstance(o, list):
              yield o
              for v in o: yield from lists(v)
          elif isinstance(o, dict):
              for v in o.values(): yield from lists(v)
      top = list(d) if isinstance(d, dict) else type(d).__name__
      cands = [L for L in lists(d) if L and isinstance(L[0], dict)]
      assert cands, f'no non-empty list of user records found; top-level={top}'
      rows = max(cands, key=len)
      assert any(k.lower() in ('id','userid','key') for k in rows[0]), f'record missing id; keys={list(rows[0])[:10]}'
      print(f'OK: {len(rows)} user records; top-level={top}; keys={list(rows[0])[:10]}')
      "
    timeout: 15
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
