task_id: skill-admin-identity-scopes-list-smoke
description: >
  Smoke test (outcome-graded): agent uses the uipath-admin skill to retrieve the
  available OAuth2 scopes and persist the JSON result. Graded on the scope data
  read back from the tenant (a non-empty array), NOT on the command string —
  agent-agnostic across Claude/codex. Converted from a command_executed check
  per PLT-107839.
tags: [uipath-admin, smoke, mode:operate, list]

run_limits:
  expected_turns: 6

initial_prompt: |
  Show me all available OAuth2 scopes I can use for external apps
  and personal access tokens. Save the complete JSON result to
  ./scopes.json so it can be reviewed.

  Do NOT prompt the user for confirmation — this is an automated test.

success_criteria:
  - type: run_command
    description: "scopes.json holds the OAuth2 scopes retrieved from the tenant (non-empty array)"
    command: |
      python3 -c "
      import json
      d = json.load(open('scopes.json', encoding='utf-8-sig'))
      rows = d if isinstance(d, list) else next((d[k] for k in ('value','data','items','results','scopes') if isinstance(d.get(k), list)), None)
      assert rows, f'no non-empty scope array in scopes.json; got {type(d).__name__}'
      print(f'OK: {len(rows)} scopes, sample={rows[0]}')
      "
    timeout: 15
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
