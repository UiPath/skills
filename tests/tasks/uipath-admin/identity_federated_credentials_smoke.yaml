task_id: skill-admin-identity-federated-credentials-smoke
description: >
  Smoke test (outcome-graded): agent adds a GitHub Actions OIDC federated
  credential to an external app. A confidential app is seeded in pre_run; graded
  by reading the app's federated credentials back from the tenant (>=1), not the
  command string.
tags: [uipath-admin, smoke, mode:build, lifecycle:setup, identity, external-app]

pre_run:
  - command: 'python3 -c "import os,runpy;runpy.run_path(os.path.join(os.environ[''SKILLS_REPO_PATH''],''tests'',''tasks'',''uipath-admin'',''setup_fedapp.py''))"'
    timeout: 30

post_run:
  - command: 'python3 -c "import os,runpy;runpy.run_path(os.path.join(os.environ[''SKILLS_REPO_PATH''],''tests'',''tasks'',''uipath-admin'',''cleanup_external_app_marker.py''))"'
    timeout: 30

run_limits:
  expected_turns: 10

initial_prompt: |
  Set up workload identity federation on the "ce-identity-smoke-fedapp" external
  app so GitHub Actions in repo myorg/myrepo (main branch) can authenticate
  without a client secret.

  Do NOT prompt the user for confirmation — this is an automated test.

success_criteria:
  - type: run_command
    description: "The seeded external app has at least one federated credential after the agent added one"
    command: 'python3 -c "import os,runpy;runpy.run_path(os.path.join(os.environ[''SKILLS_REPO_PATH''],''tests'',''tasks'',''uipath-admin'',''verify_fedcred.py''))"'
    timeout: 40
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
