task_id: skill-admin-audit-events-basic-smoke
description: >
  Smoke test (outcome-graded): agent queries tenant audit events over a small
  bounded window with a small result cap. Graded on the events read back from the
  live tenant — every returned event falls inside the requested window, the
  returned volume respects the cap, and the records are corroborated as this
  tenant's (shared OrganizationId) and as tenant-scope (they carry a TenantId) —
  not on the command string.

  The provenance check needs an anchor: if the harness's own read returns no
  events at all it reports that provenance was NOT corroborated rather than
  claiming it was, and the remaining assertions still gate.

  This grades what the old `--from-date`/`--to-date`/`--limit` regexes were
  standing in for: that the query was actually time-bounded and actually capped,
  rather than that those flag names appeared somewhere in the command.
tags: [uipath-admin, smoke, mode:diagnose, lifecycle:discover, audit]

initial_prompt: |
  Can you pull the 25 most recent audit events from this tenant's audit trail,
  from the last 24 hours? I want them across all event sources — don't narrow to
  any one source. Save the complete JSON result to ./events.json so I can review it.

  Save the raw JSON exactly as the command returns it — do not filter, reshape, or
  summarize it.

  Do NOT prompt the user for confirmation — this is an automated test.

success_criteria:
  - type: run_command
    description: "events.json holds real tenant-scope events, all inside the 24h window and capped at 25"
    command: 'AUDIT_FILE=events.json AUDIT_SCOPE=tenant AUDIT_WINDOW_DAYS=1 AUDIT_MAX_COUNT=25 python3 -c "import os,runpy;runpy.run_path(os.path.join(os.environ[''SKILLS_REPO_PATH''],''tests'',''tasks'',''uipath-admin'',''verify_audit_events.py''))"'
    timeout: 320
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
