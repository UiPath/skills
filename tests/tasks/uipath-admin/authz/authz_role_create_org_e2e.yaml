task_id: skill-admin-authz-role-create-org-e2e
description: >
  End-to-end test (outcome-graded): single CLI scenario — create one custom role at
  Organization scope. Graded by retrieving the role back from the live organization and
  checking the shape the service stored: its Organization binding, the granted permission
  and the description. The scope is read off the stored record, never off the
  flag the agent typed.

  pre_run clears any leftover marker role so the check cannot pass on stale
  state, and post_run deletes whatever the run created.
tags: [uipath-admin, e2e, mode:build, lifecycle:setup, authz, role, scope:organization]

pre_run:
  - command: 'AUTHZ_CLEANUP_MARKER="ce-authz-create-org-role" python3 -c "import os,runpy;runpy.run_path(os.path.join(os.environ[''SKILLS_REPO_PATH''],''tests'',''tasks'',''uipath-admin'',''authz'',''cleanup_authz_marker.py''))"'
    timeout: 90
  - command: 'AUTHZ_SEED_KEY="role" AUTHZ_ROLE_BASE="ce-authz-create-org-role" AUTHZ_ROLE_PERMISSION="AUTHZ.CONDITIONALACCESSPOLICY.READ" AUTHZ_ROLE_SCOPE="Organization" AUTHZ_ROLE_PLAN_ONLY="1" python3 -c "import os,runpy;runpy.run_path(os.path.join(os.environ[''SKILLS_REPO_PATH''],''tests'',''tasks'',''uipath-admin'',''authz'',''setup_authz_role.py''))"'
    timeout: 90

post_run:
  - command: 'AUTHZ_CLEANUP_MARKER="ce-authz-create-org-role" python3 -c "import os,runpy;runpy.run_path(os.path.join(os.environ[''SKILLS_REPO_PATH''],''tests'',''tasks'',''uipath-admin'',''authz'',''cleanup_authz_marker.py''))"'
    timeout: 90

run_limits:
  expected_turns: 8

initial_prompt: |
  We need a new organization-wide role that lets its holders read the
  organization's Access Policies and nothing else. `seed.json` holds the name to
  use in its `role.name` field — several agents work on this organization at the
  same time, so take the name from there rather than inventing one. Describe the
  role exactly as:
  Access policy auditors

  Do NOT prompt the user for confirmation — this is an automated test.

success_criteria:
  - type: run_command
    description: "The role exists on the organization with the Organization shape, the granted permission and the description"
    command: 'AUTHZ_SEED_KEY="role" AUTHZ_EXPECT_SCOPE="Organization" AUTHZ_EXPECT_PERMISSION="AUTHZ.CONDITIONALACCESSPOLICY.READ" AUTHZ_EXPECT_DESCRIPTION="Access policy auditors" python3 -c "import os,runpy;runpy.run_path(os.path.join(os.environ[''SKILLS_REPO_PATH''],''tests'',''tasks'',''uipath-admin'',''authz'',''verify_authz_role_created.py''))"'
    timeout: 90
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
