task_id: skill-admin-authz-list-role-assignments-smoke
description: >
  Smoke test (outcome-graded): agent retrieves who holds which role in the
  organization and saves the JSON. Graded on the assignment records read back
  from the live tenant (RoleName + principal binding), not the command string.
tags: [uipath-admin, smoke, mode:diagnose, lifecycle:discover, list, authz]

run_limits:
  expected_turns: 5

initial_prompt: |
  Show me all role assignments at the organization level of my UiPath
  organization (who has what role). Save the complete JSON result to
  ./assignments.json so it can be reviewed.

  Do NOT prompt the user for confirmation — this is an automated test.

success_criteria:
  - type: run_command
    description: "assignments.json holds real assignment records from the tenant (RoleName bound to a principal)"
    command: |
      python3 -c "
      import json
      d = json.load(open('assignments.json', encoding='utf-8-sig'))
      res = d.get('Result') if isinstance(d, dict) else None
      assert res in (None, 'Success'), f'retrieval not successful: Result={res}'
      def dicts(o):
          if isinstance(o, dict):
              yield o
              for v in o.values(): yield from dicts(v)
          elif isinstance(o, list):
              for v in o: yield from dicts(v)
      # An assignment record binds a role to a principal; search anywhere so the
      # check tolerates how the agent saved the grouped envelope.
      rows = [x for x in dicts(d) if 'RoleName' in x and ('SecurityPrincipalId' in x or 'RoleId' in x)]
      assert rows, 'no role-assignment records (RoleName + principal) found in the saved JSON'
      r = rows[0]
      assert r.get('RoleName'), 'assignment record has an empty RoleName'
      assert r.get('Scope') or r.get('scope'), f'assignment record has no Scope; keys={list(r)[:10]}'
      print(f'OK: {len(rows)} role assignments retrieved; sample role=' + str(r.get('RoleName')))
      "
    timeout: 15
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
