task_id: skill-admin-authz-role-update-e2e
description: >
  End-to-end test (outcome-graded): single CLI scenario — change the description of an
  existing custom role. The role is seeded in pre_run, so the agent does not
  create it: reading the seeded role back with the new description proves a real
  update landed, and the check also confirms the granted permission survived
  (the update endpoint is a full replace, so a careless call silently drops it).
tags: [uipath-admin, e2e, mode:build, lifecycle:setup, authz, role]

pre_run:
  - command: 'AUTHZ_SEED_KEY="role" AUTHZ_ROLE_BASE="ce-authz-update-role" AUTHZ_ROLE_PERMISSION="AUTHZ.CONDITIONALACCESSPOLICY.READ" AUTHZ_ROLE_SCOPE="Organization" AUTHZ_ROLE_DESCRIPTION="Provisional - pending review" python3 -c "import os,runpy;runpy.run_path(os.path.join(os.environ[''SKILLS_REPO_PATH''],''tests'',''tasks'',''uipath-admin'',''authz'',''setup_authz_role.py''))"'
    timeout: 90

post_run:
  - command: 'AUTHZ_CLEANUP_MARKER="ce-authz-update-role" python3 -c "import os,runpy;runpy.run_path(os.path.join(os.environ[''SKILLS_REPO_PATH''],''tests'',''tasks'',''uipath-admin'',''authz'',''cleanup_authz_marker.py''))"'
    timeout: 90

run_limits:
  expected_turns: 8

initial_prompt: |
  One of our custom roles still carries a placeholder description — the role is
  named in `seed.json` (the `role.name` field). Change its description to exactly:
  Reviewed and approved by security
  Everything else about the role must stay as it is.

  Do NOT prompt the user for confirmation — this is an automated test.

success_criteria:
  - type: run_command
    description: "The seeded role now carries the new description and kept its granted permission"
    command: 'AUTHZ_SEED_KEY="role" AUTHZ_EXPECT_DESCRIPTION="Reviewed and approved by security" AUTHZ_EXPECT_PERMISSION="AUTHZ.CONDITIONALACCESSPOLICY.READ" python3 -c "import os,runpy;runpy.run_path(os.path.join(os.environ[''SKILLS_REPO_PATH''],''tests'',''tasks'',''uipath-admin'',''authz'',''verify_authz_role_updated.py''))"'
    timeout: 90
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
