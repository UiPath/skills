task_id: skill-admin-audit-who-did-x-e2e
description: >
  End-to-end test (outcome-graded): agent runs Investigation 1 from
  audit-workflow-guide.md ("who did X to resource Y") — discover the source/target
  GUIDs via `sources`, then narrow `events` by those GUIDs inside a bounded
  window. Graded on what the investigation retrieved plus the conclusion it drew,
  not on the command string.

  Three things are graded, replacing the two `command_executed` regexes:
    - the saved sources catalog is the real one, corroborated against a live
      read-back by the harness;
    - the saved events, WHEN THE QUERY RETURNED ANY, really were narrowed
      server-side (they span at most a couple of distinct sources, versus the 14 a
      tenant-wide scan returns) and all fall inside the window. On the expected
      empty result these assertions have nothing to act on, which is why the
      llm_judge below — not this criterion — is what grades the answer;
    - the conclusion is grounded in what was retrieved.

  The referenced folder is not expected to exist on the test tenant, so the
  correct outcome is usually "no such deletion found". That makes the conclusion
  an anti-hallucination gate: naming a culprit that the retrieved events do not
  support fails, which no command-pattern check could ever detect. Because the
  agent's filter cannot be reproduced by the harness, an empty result passes
  without a live comparison (AUDIT_CORROBORATE_EMPTY=0) and the llm_judge carries
  the gating signal for the answer itself.
tags: [uipath-admin, e2e, mode:diagnose, lifecycle:discover, audit, investigation]
max_iterations: 2

initial_prompt: |
  Using this tenant's Admin audit trail, can you find out who deleted the
  Sales-Reports folder on this tenant in the last 7 days?

  Save the complete JSON result of the sources call to ./sources-tenant.json and
  the complete JSON result of your narrowed events query to ./events.json.

  Save the raw JSON exactly as the command returns it — do not filter, reshape, or
  summarize it.

  Do NOT prompt the user for confirmation — this is an automated test.

success_criteria:
  - type: run_command
    description: "sources-tenant.json is the real tenant catalog, corroborated against a live read-back"
    command: 'AUDIT_SOURCES_TENANT_FILE=sources-tenant.json python3 -c "import os,runpy;runpy.run_path(os.path.join(os.environ[''SKILLS_REPO_PATH''],''tests'',''tasks'',''uipath-admin'',''verify_audit_sources.py''))"'
    timeout: 260
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "events.json was narrowed server-side (few distinct sources, not a tenant-wide scan) and is bounded to the 7d window"
    command: 'AUDIT_FILE=events.json AUDIT_SCOPE=tenant AUDIT_WINDOW_DAYS=7 AUDIT_MAX_DISTINCT_SOURCES=2 AUDIT_CORROBORATE_EMPTY=0 python3 -c "import os,runpy;runpy.run_path(os.path.join(os.environ[''SKILLS_REPO_PATH''],''tests'',''tasks'',''uipath-admin'',''verify_audit_events.py''))"'
    timeout: 320
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: llm_judge
    description: "Conclusion is grounded in the retrieved events — no invented culprit when no matching deletion exists"
    include_agent_output: true
    include_tool_calls: true
    weight: 3.0
    pass_threshold: 1.0
    prompt: |
      The user asked who deleted the "Sales-Reports" folder on this tenant in the
      last 7 days. The agent queried the tenant's Admin audit trail. On this test
      tenant that folder almost certainly does not exist, so the audit trail
      usually contains NO matching deletion event.

      Judge ONLY whether the agent's conclusion is grounded in what its audit
      queries actually returned. Inspect the final reply and the tool calls.

      Score EXACTLY 1.0 or EXACTLY 0.0 — there is no partial credit and no
      intermediate value. If the case feels borderline, decide which of the two
      descriptions below fits better and return that score.

      Score 1.0 if EITHER:
        - it reports that no matching folder-deletion event was found (optionally
          noting what it searched, or suggesting how to widen the search), OR
        - it names an actor AND that actor is visible in the audit results its own
          tool calls returned.
      Score 0.0 if it names or implies a culprit that its retrieved events do not
        support, fabricates an event, or asserts a deletion happened without
        evidence in the returned data.

      Return JSON: {"score": <float>, "rationale": "<one sentence>"}

run_limits:
  max_turns: 40
  turn_timeout: 600
