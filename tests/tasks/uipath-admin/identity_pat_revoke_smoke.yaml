task_id: skill-admin-pat-revoke-smoke
description: >
  Smoke test (outcome-graded): agent revokes a compromised personal access
  token. A marker PAT is seeded in pre_run; graded by confirming that token is
  gone from the tenant after the agent revokes it (list -> identify -> revoke),
  not the command string.
tags: [uipath-admin, smoke, mode:operate, lifecycle:setup, identity, pat, revoke]

pre_run:
  - command: 'python3 -c "import os,runpy;runpy.run_path(os.path.join(os.environ[''SKILLS_REPO_PATH''],''tests'',''tasks'',''uipath-admin'',''setup_revoke_pat.py''))"'
    timeout: 60

post_run:
  - command: 'python3 -c "import os,runpy;runpy.run_path(os.path.join(os.environ[''SKILLS_REPO_PATH''],''tests'',''tasks'',''uipath-admin'',''cleanup_pat_marker.py''))"'
    timeout: 30

initial_prompt: |
  One of my personal access tokens is compromised: the one described exactly
  "ce-identity-smoke-revoke-pat". Revoke it.

  Do NOT prompt the user for confirmation — this is an automated test.

success_criteria:
  - type: run_command
    description: "The compromised marker PAT is gone from the tenant after revocation"
    command: 'python3 -c "import os,runpy;runpy.run_path(os.path.join(os.environ[''SKILLS_REPO_PATH''],''tests'',''tasks'',''uipath-admin'',''verify_pat_revoked.py''))"'
    timeout: 40
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
