task_id: skill-admin-identity-federated-credentials-smoke
description: >
  Smoke test (outcome-graded): agent adds a GitHub Actions OIDC federated
  credential to an external app. Graded by reading the app's federated
  credentials back from the tenant (>=1), not the command string.

  Uses a PERSISTENT host app ("ce-identity-fedcred-host", created once and never
  deleted). Identity-service has a create->read cross-partition inconsistency
  (PLT-107839 investigation): a freshly-created app is not yet materialized in
  the org partition the federated-credentials endpoint queries, so fed-cred
  create 400s "Client not found in partition" on brand-new apps. A durable,
  already-materialized host resolves reliably, so the test churns only the
  credential on it. pre_run clears creds; post_run deletes only the credential.
tags: [uipath-admin, smoke, mode:build, lifecycle:setup, identity, external-app]

pre_run:
  - command: 'python3 -c "import os,runpy;runpy.run_path(os.path.join(os.environ[''SKILLS_REPO_PATH''],''tests'',''tasks'',''uipath-admin'',''identity'',''setup_fedcred_host.py''))"'
    timeout: 60

post_run:
  - command: 'python3 -c "import os,runpy;runpy.run_path(os.path.join(os.environ[''SKILLS_REPO_PATH''],''tests'',''tasks'',''uipath-admin'',''identity'',''cleanup_fedcreds_host.py''))"'
    timeout: 30

run_limits:
  expected_turns: 10

initial_prompt: |
  Set up workload identity federation on the existing "ce-identity-fedcred-host"
  external app so GitHub Actions in repo myorg/myrepo (main branch) can
  authenticate without a client secret.

  Do NOT prompt the user for confirmation — this is an automated test.

success_criteria:
  - type: run_command
    description: "The host external app has at least one federated credential after the agent added one"
    command: 'python3 -c "import os,runpy;runpy.run_path(os.path.join(os.environ[''SKILLS_REPO_PATH''],''tests'',''tasks'',''uipath-admin'',''identity'',''verify_fedcred.py''))"'
    timeout: 60
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
