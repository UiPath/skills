task_id: skill-admin-identity-user-lifecycle-e2e
description: >
  End-to-end test (outcome-graded): the marker user is pre-seeded (invited with
  surname "LifecycleUser") in pre_run; the agent UPDATES the surname to
  "UpdatedUser". Graded by reading the user back from the live tenant with the
  changed surname — which proves a real update ran (the agent cannot satisfy it by
  folding an invite, since it does not invite). invite (pre_run) and delete
  (post_run) are exercised via the harness as teardown/seed, not graded — a single
  read-back cannot grade both the updated state and a subsequent delete (the delete
  erases the evidence), so this e2e grades the update tail deterministically.
tags: [uipath-admin, e2e, mode:build, lifecycle:setup, identity, user-lifecycle]

pre_run:
  - command: 'python3 -c "import os,runpy;runpy.run_path(os.path.join(os.environ[''SKILLS_REPO_PATH''],''tests'',''tasks'',''uipath-admin'',''identity'',''setup_lifecycle_user.py''))"'
    timeout: 30

post_run:
  - command: 'python3 -c "import os,runpy;runpy.run_path(os.path.join(os.environ[''SKILLS_REPO_PATH''],''tests'',''tasks'',''uipath-admin'',''identity'',''cleanup_lifecycle_user.py''))"'
    timeout: 30

run_limits:
  expected_turns: 10
  max_turns: 40
  turn_timeout: 600

initial_prompt: |
  Update the existing user "ce-identity-lifecycle@example.com" in my UiPath
  organization: change their surname to "UpdatedUser".

  Do NOT prompt the user for confirmation — this is an automated test.

success_criteria:
  - type: run_command
    description: "The pre-seeded user's surname was changed to UpdatedUser on the tenant (proves a real update)"
    command: 'python3 -c "import os,runpy;runpy.run_path(os.path.join(os.environ[''SKILLS_REPO_PATH''],''tests'',''tasks'',''uipath-admin'',''identity'',''verify_user_updated.py''))"'
    timeout: 40
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0
