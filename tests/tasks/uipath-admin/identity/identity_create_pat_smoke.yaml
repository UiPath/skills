task_id: skill-admin-identity-create-pat-smoke
description: >
  Smoke test (outcome-graded): agent creates a personal access token with scopes
  and an expiration. Graded by reading the PAT back from the live tenant — a
  token with the marker description exists and carries scopes — not the command
  string. Also the mutation write-probe for the identity suite.
tags: [uipath-admin, smoke, mode:build, lifecycle:setup, identity, pat]

pre_run:
  - command: 'python3 -c "import os,runpy;runpy.run_path(os.path.join(os.environ[''SKILLS_REPO_PATH''],''tests'',''tasks'',''uipath-admin'',''identity'',''cleanup_pat_marker.py''))"'
    timeout: 30

post_run:
  - command: 'python3 -c "import os,runpy;runpy.run_path(os.path.join(os.environ[''SKILLS_REPO_PATH''],''tests'',''tasks'',''uipath-admin'',''identity'',''cleanup_pat_marker.py''))"'
    timeout: 30

run_limits:
  expected_turns: 6

initial_prompt: |
  Create a personal access token described exactly as "ce-identity-smoke-pat"
  for CI/CD, with read access to Folders and Jobs, expiring 6 months from today
  (the organization caps personal access token lifetime at 360 days).

  Do NOT prompt the user for confirmation — this is an automated test.

success_criteria:
  - type: run_command
    description: "A PAT with the marker description exists on the tenant, carrying the requested scopes"
    command: 'python3 -c "import os,runpy;runpy.run_path(os.path.join(os.environ[''SKILLS_REPO_PATH''],''tests'',''tasks'',''uipath-admin'',''identity'',''verify_pat_created.py''))"'
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
