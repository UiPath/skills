task_id: skill-admin-identity-create-robot-account-smoke
description: >
  Smoke test (outcome-graded): agent creates a robot account. Graded by reading
  the robot account back from the live tenant — a robot account with the marker
  name exists — not the command string.
tags: [uipath-admin, smoke, mode:build, lifecycle:setup, identity, robot-account]
sandbox:
  template_sources:
    - type: template_dir
      path: _setup
      mount_point: _setup
    - type: template_dir
      path: ../_setup
      mount_point: _setup
reference:
  directory: .

pre_run:
  - command: 'python3 _setup/cleanup_robot_marker.py'
    timeout: 30

post_run:
  - command: 'python3 _setup/cleanup_robot_marker.py'
    timeout: 30

run_limits:
  expected_turns: 8

initial_prompt: |
  Create a new robot account named "ce-identity-smoke-bot" with display name
  "CE Identity Smoke Bot" in my UiPath organization.

  Do NOT prompt the user for confirmation — this is an automated test.

success_criteria:
  - type: run_command
    description: "A robot account with the marker name exists on the tenant"
    command: 'python3 -c "import os,runpy;runpy.run_path(os.path.join(os.environ[''REFERENCE_DIR''],''verify_robot_created.py''))"'
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
