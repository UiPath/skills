task_id: skill-admin-external-app-secret-rotate-smoke
description: >
  Smoke test (outcome-graded): agent rotates an external app's client secret by
  generating a new one. A confidential app is seeded in pre_run; graded by
  reading the app back and finding the newly generated secret (marker
  description), not the command string.
tags: [uipath-admin, smoke, mode:operate, lifecycle:setup, identity, external-app, secret]

pre_run:
  - command: 'python3 -c "import os,runpy;runpy.run_path(os.path.join(os.environ[''SKILLS_REPO_PATH''],''tests'',''tasks'',''uipath-admin'',''identity'',''setup_rotateapp.py''))"'
    timeout: 30

post_run:
  - command: 'python3 -c "import os,runpy;runpy.run_path(os.path.join(os.environ[''SKILLS_REPO_PATH''],''tests'',''tasks'',''uipath-admin'',''identity'',''cleanup_ext_app_rotate.py''))"'
    timeout: 30

run_limits:
  expected_turns: 6

initial_prompt: |
  Rotate the client secret for the "ce-identity-smoke-rotateapp" external app —
  generate a new secret described exactly "ce-identity-smoke-rotated", expiring
  one year from today. The old secret has expired.

  Do NOT prompt the user for confirmation — this is an automated test.

success_criteria:
  - type: run_command
    description: "The seeded app carries the newly generated marker secret after rotation"
    command: 'python3 -c "import os,runpy;runpy.run_path(os.path.join(os.environ[''SKILLS_REPO_PATH''],''tests'',''tasks'',''uipath-admin'',''identity'',''verify_secret_rotated.py''))"'
    timeout: 60
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
