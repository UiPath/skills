task_id: skill-admin-identity-smtp-get-smoke
description: >
  Smoke test: agent retrieves the organization's SMTP email settings and saves
  the JSON. Graded on the settings object read back from the live tenant, not
  the command string.
tags: [uipath-admin, smoke, mode:operate, lifecycle:discover, identity]

run_limits:
  expected_turns: 6

initial_prompt: |
  Show me the current SMTP email settings for my UiPath organization. Save the
  complete JSON result to ./smtp.json so it can be reviewed.

  Do NOT prompt the user for confirmation — this is an automated test.

success_criteria:
  - type: run_command
    description: "smtp.json holds the SMTP settings object retrieved from the tenant"
    command: |
      python3 -c "
      import json
      d = json.load(open('smtp.json', encoding='utf-8-sig'))
      res = d.get('Result') if isinstance(d, dict) else None
      assert res in (None, 'Success'), f'SMTP retrieval not successful: Result={res}'
      def keys(o):
          if isinstance(o, dict):
              for k, v in o.items():
                  yield k
                  yield from keys(v)
          elif isinstance(o, list):
              for v in o: yield from keys(v)
      sig = ('fromaddress', 'fromdisplayname', 'host', 'port', 'enablessl', 'smtp')
      found = [k for k in keys(d) if any(s in k.lower().replace('_', '') for s in sig)]
      assert found, f'no SMTP settings fields found in response; keys seen={list(keys(d))[:15]}'
      print(f'OK: SMTP settings retrieved (found {found[0]})')
      "
    timeout: 15
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
