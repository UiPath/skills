task_id: skill-admin-audit-status-filter-smoke
description: >
  Smoke test (outcome-graded): agent filters the tenant audit trail to failures
  only over a bounded window. Graded on the events read back from the live tenant
  — EVERY returned event must carry failure status, and all must fall inside the
  window — not on the command string.

  This is a stronger gate than the old `--status Failure` regex: post-filtering
  in jq, an invented spelling, or dropping the filter all produce a result set
  that fails the purity assertion, while any spelling the server accepts passes.

  A tenant with no failures in the window is a real outcome, so an empty result
  is allowed — but only after the harness confirms the SAME filtered query
  returns nothing for it too. `AUDIT_LIVE_ARGS` makes the corroborating query
  ask the same question; without it an empty-but-correct result would be compared
  against an unfiltered read and fail.
tags: [uipath-admin, smoke, mode:diagnose, lifecycle:discover, audit, status]

initial_prompt: |
  Show me the failed events in this tenant's audit trail from the last 7 days,
  across all event sources (don't narrow to any one source). Save the complete JSON result to ./events.json so I can review it.

  Save the raw JSON exactly as the command returns it — do not filter, reshape, or
  summarize it.

  Do NOT prompt the user for confirmation — this is an automated test.

success_criteria:
  - type: run_command
    description: "Every event in events.json is a failure inside the 7d window (an empty result passes only if the same filtered query is empty for the harness too)"
    command: 'AUDIT_FILE=events.json AUDIT_SCOPE=tenant AUDIT_WINDOW_DAYS=7 AUDIT_STATUS=Failure AUDIT_LIVE_ARGS=--status=Failure python3 -c "import os,runpy;runpy.run_path(os.path.join(os.environ[''SKILLS_REPO_PATH''],''tests'',''tasks'',''uipath-admin'',''verify_audit_events.py''))"'
    timeout: 320
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
