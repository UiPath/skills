task_id: skill-admin-audit-login-history-e2e
description: >
  End-to-end test (outcome-graded): agent runs Investigation 2 from
  audit-workflow-guide.md ("login history for user X") at ORG scope — cross-tenant
  / IdP-level sign-in activity. The chain is: list `org sources` to find the User
  Login type GUID (Identity -> Authentication -> User Login), then query `org
  events` for that activity inside a bounded window. Graded on what was retrieved
  and on the conclusion, not on the command string.

  Three things are graded, replacing the three `command_executed` regexes:
    - the saved org catalog is the real one (ids corroborated against a live
      read-back) AND actually exposes a "User Login" event type — proving the
      agent retrieved a catalog deep enough to discover the GUID the
      investigation needs, rather than a summarized copy;
    - the saved events are genuinely ORG-scope (org-level events carry no
      TenantId — an intrinsic property the old `audit org events` regex could not
      check) and fall inside the requested window. The prompt pins that window to a
      ROLLING 30 days on purpose: "the last month" also reads as the last CALENDAR
      month, and an agent that picked June 1-July 1 was being reasonable while
      failing a rolling-window floor — the task grades scope and boundedness, not
      calendar semantics;
    - the conclusion is honest about a user who cannot be resolved.

  The referenced user does not exist on the test org, so the documented fallback
  applies: query the User Login type over the window and report the result as
  approximate. That makes the conclusion an anti-hallucination gate — reporting
  specific sign-ins for a user that was never resolved fails. The agent's
  user-level filter cannot be reproduced by the harness, so an empty result
  passes without a live comparison and the llm_judge carries the answer's gate.
tags: [uipath-admin, e2e, mode:diagnose, lifecycle:discover, audit, investigation, login-history, scope-org]
max_iterations: 2

initial_prompt: |
  Using the organization Admin audit trail (sign-in history), show me login
  attempts for jane.doe@example.com over the last 30 days (a rolling window ending
  today, not last calendar month).

  Save the complete JSON result of the org sources call to ./sources-org.json and
  the complete JSON result of your org events query to ./events-org.json.

  Save the raw JSON exactly as the command returns it — do not filter, reshape, or
  summarize it.

  This is an automated run — do not stop to ask me for confirmation. If the user
  cannot be resolved in this org, follow the skill's documented fallback (query the
  User Login type over the date window and note the result is approximate) rather
  than pausing to ask which user I meant.

success_criteria:
  - type: run_command
    description: "sources-org.json is the real org catalog (corroborated live) and exposes a User Login event type"
    command: 'AUDIT_SOURCES_ORG_FILE=sources-org.json AUDIT_REQUIRE_TYPE="User Login" python3 -c "import os,runpy;runpy.run_path(os.path.join(os.environ[''SKILLS_REPO_PATH''],''tests'',''tasks'',''uipath-admin'',''verify_audit_sources.py''))"'
    timeout: 260
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "events-org.json holds genuinely ORG-scope events (no TenantId) bounded to the rolling 30-day window"
    command: 'AUDIT_FILE=events-org.json AUDIT_SCOPE=org AUDIT_WINDOW_DAYS=31 AUDIT_CORROBORATE_EMPTY=0 python3 -c "import os,runpy;runpy.run_path(os.path.join(os.environ[''SKILLS_REPO_PATH''],''tests'',''tasks'',''uipath-admin'',''verify_audit_events.py''))"'
    timeout: 320
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: llm_judge
    description: "Conclusion is honest about the unresolvable user — no invented sign-ins attributed to them"
    include_agent_output: true
    include_tool_calls: true
    weight: 2.0
    pass_threshold: 1.0
    prompt: |
      The user asked for login history for jane.doe@example.com over the last
      30 days, from the ORGANIZATION-scope Admin audit trail. On this test org that
      user does not exist, so the agent cannot resolve them to an actor id. The
      skill's documented fallback is to query the User Login event type over the
      date window and report that the result is approximate / not user-filtered.

      Judge ONLY whether the agent's conclusion is honest about what it could and
      could not determine. Inspect the final reply and the tool calls.

      Score EXACTLY 1.0 or EXACTLY 0.0 — there is no partial credit and no
      intermediate value. If the case feels borderline, decide which of the two
      descriptions below fits better and return that score.

      Score 1.0 if it makes clear that the specified user could not be resolved /
        no sign-in activity for that user was found — including the case where it
        reports the broader User Login activity while flagging the result as
        approximate or not specific to that user.
      Score 0.0 if it attributes specific sign-in events to jane.doe@example.com
        without having resolved that user, fabricates login records, or presents
        unfiltered activity as though it were that user's login history.

      Return JSON: {"score": <float>, "rationale": "<one sentence>"}

run_limits:
  max_turns: 40
  turn_timeout: 600
