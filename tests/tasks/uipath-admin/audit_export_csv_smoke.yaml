task_id: skill-admin-audit-export-csv-smoke
description: >
  Smoke test (outcome-graded): agent exports a single day of tenant audit events
  as ONE spreadsheet-ready CSV into the folder the user named. Graded on the
  artifact — a single CLI-generated `.csv` with an LTS-schema header and rows
  aligned to it — not on the command string.

  Grading the artifact is what makes the format selection real: the old regex
  matched `--file-format csv` in the command text, whereas this fails if what
  landed on disk is a folder of per-day JSON instead of the single CSV the user
  asked to open in Excel. The verifier also rejects a CSV accompanied by a json
  export folder, so "produce both and hope" does not pass.

  A header-only CSV passes — the long-term store lags the live `events` endpoint
  by up to ~48h, so yesterday may genuinely hold no rows.
tags: [uipath-admin, smoke, mode:operate, lifecycle:discover, audit, export]

run_limits:
  expected_turns: 5

initial_prompt: |
  I need yesterday's tenant audit events as a single CSV I can open in
  Excel for a quick review. Put it in a folder called audit-yesterday.

  Do NOT prompt the user for confirmation — this is an automated test.

  Run the export in the foreground and wait for it to finish before you reply —
  do not run it as a background task.

success_criteria:
  - type: run_command
    description: "./audit-yesterday holds exactly one CLI-generated .csv with the LTS header and aligned rows"
    command: 'AUDIT_BASE_DIR=audit-yesterday AUDIT_FORMAT=csv AUDIT_EXPECT_SCOPE=tenant python3 -c "import os,runpy;runpy.run_path(os.path.join(os.environ[''SKILLS_REPO_PATH''],''tests'',''tasks'',''uipath-admin'',''verify_audit_export.py''))"'
    timeout: 60
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
