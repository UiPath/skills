task_id: skill-admin-identity-create-external-app-smoke
description: >
  Smoke test (outcome-graded): agent creates an external OAuth2 app with
  application scopes. Graded by reading the app back from the live tenant — an
  app with the marker name exists — not the command string.
tags: [uipath-admin, smoke, mode:build, lifecycle:setup, identity, external-app]

pre_run:
  - command: 'python3 -c "import os,runpy;runpy.run_path(os.path.join(os.environ[''SKILLS_REPO_PATH''],''tests'',''tasks'',''uipath-admin'',''cleanup_ext_app_create.py''))"'
    timeout: 30

post_run:
  - command: 'python3 -c "import os,runpy;runpy.run_path(os.path.join(os.environ[''SKILLS_REPO_PATH''],''tests'',''tasks'',''uipath-admin'',''cleanup_ext_app_create.py''))"'
    timeout: 30

initial_prompt: |
  Create a new external app named "ce-identity-smoke-app" with application
  scopes for Folders and Jobs access in my UiPath organization.

  Do NOT prompt the user for confirmation — this is an automated test.

success_criteria:
  - type: run_command
    description: "An external app with the marker name exists on the tenant"
    command: 'python3 -c "import os,runpy;runpy.run_path(os.path.join(os.environ[''SKILLS_REPO_PATH''],''tests'',''tasks'',''uipath-admin'',''verify_external_app_created.py''))"'
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
