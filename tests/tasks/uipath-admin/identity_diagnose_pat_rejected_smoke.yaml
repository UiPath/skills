task_id: skill-admin-pat-not-working-smoke
description: >
  Diagnose smoke: agent troubleshoots a PAT rejection (403) by retrieving the
  user's PATs and inspecting expiration and scope coverage. Graded on the PAT
  records read back from the tenant (Expiration + Scopes present), not the
  command string.
tags: [uipath-admin, smoke, mode:diagnose, lifecycle:discover, troubleshoot, identity, pat]

run_limits:
  expected_turns: 5

initial_prompt: |
  One of my personal access tokens might be expired or have the wrong scopes —
  it's getting 403 on Orchestrator folder listings. Retrieve my PATs so their
  expiration dates and scope coverage can be reviewed, and save the complete
  JSON result to ./pats.json.

  Do NOT prompt the user for confirmation — this is an automated test.

success_criteria:
  - type: run_command
    description: "pats.json holds real PAT records with the fields needed to diagnose expiry/scope (Expiration, Scopes)"
    command: |
      python3 -c "
      import json
      d = json.load(open('pats.json', encoding='utf-8-sig'))
      assert isinstance(d, dict) and d.get('Result') == 'Success' and 'Data' in d, f'not a successful uip retrieval; top-level={list(d) if isinstance(d, dict) else type(d).__name__}'
      rows = d['Data']
      assert isinstance(rows, list) and len(rows) >= 1, f'expected a list of PATs; got {type(rows).__name__}'
      r = rows[0]
      assert 'Expiration' in r and 'Scopes' in r, f'PAT record missing Expiration/Scopes; keys={list(r)[:10]}'
      print(f'OK: {len(rows)} PATs retrieved with expiry/scope fields; keys={list(r)[:8]}')
      "
    timeout: 15
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
