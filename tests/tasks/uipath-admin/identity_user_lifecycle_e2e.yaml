task_id: skill-admin-identity-user-lifecycle-e2e
description: >
  End-to-end test (outcome-graded): agent invites a user, confirms it exists,
  and updates its surname. Graded by reading the user back from the live tenant
  with the updated surname — proving invite + update landed — not the command
  string. The post_run cleanup deletes the user (exercising delete too).
tags: [uipath-admin, e2e, mode:build, lifecycle:setup, identity, user-lifecycle]

pre_run:
  - command: 'python3 -c "import os,runpy;runpy.run_path(os.path.join(os.environ[''SKILLS_REPO_PATH''],''tests'',''tasks'',''uipath-admin'',''cleanup_lifecycle_user.py''))"'
    timeout: 30

post_run:
  - command: 'python3 -c "import os,runpy;runpy.run_path(os.path.join(os.environ[''SKILLS_REPO_PATH''],''tests'',''tasks'',''uipath-admin'',''cleanup_lifecycle_user.py''))"'
    timeout: 30

run_limits:
  expected_turns: 12
  max_turns: 40
  turn_timeout: 600

initial_prompt: |
  Onboard a test user with email "ce-identity-lifecycle@example.com", name
  "Test", surname "LifecycleUser". After inviting, search for the user to
  confirm they exist. Then update the user's surname to "UpdatedUser".

  Do NOT prompt the user for confirmation — this is an automated test.

success_criteria:
  - type: run_command
    description: "The invited user exists on the tenant with the updated surname (invite + update landed)"
    command: 'python3 -c "import os,runpy;runpy.run_path(os.path.join(os.environ[''SKILLS_REPO_PATH''],''tests'',''tasks'',''uipath-admin'',''verify_user_updated.py''))"'
    timeout: 40
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
