task_id: skill-admin-identity-list-groups-smoke
description: >
  Smoke test: agent retrieves the organization's groups and saves the JSON.
  Graded on the group records read back from the live tenant (Id + Name), not
  the command string.
tags: [uipath-admin, smoke, mode:operate, lifecycle:discover]

run_limits:
  expected_turns: 4

initial_prompt: |
  Show me all groups in my UiPath organization. Save the complete JSON result
  to ./groups.json so it can be reviewed.

  Do NOT prompt the user for confirmation — this is an automated test.

success_criteria:
  - type: run_command
    description: "groups.json holds real groups retrieved from the tenant (Id + Name/DisplayName)"
    command: |
      python3 -c "
      import json
      d = json.load(open('groups.json', encoding='utf-8-sig'))
      assert isinstance(d, dict) and d.get('Result') == 'Success' and 'Data' in d, f'not a successful uip retrieval; top-level={list(d) if isinstance(d, dict) else type(d).__name__}'
      rows = d['Data']
      assert isinstance(rows, list) and len(rows) >= 1, f'expected a list of groups; got {type(rows).__name__} len={len(rows) if isinstance(rows, list) else None}'
      r = rows[0]
      assert 'Id' in r and ('Name' in r or 'DisplayName' in r), f'group record missing Id/Name; keys={list(r)[:10]}'
      print(f'OK: {len(rows)} groups retrieved; sample keys={list(r)[:8]}')
      "
    timeout: 15
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
