task_id: skill-admin-identity-list-robot-accounts-smoke
description: >
  Smoke test (outcome-graded): agent uses the uipath-admin skill to retrieve the
  organization's robot accounts and persist the JSON result. Graded on the
  retrieved collection envelope read back from the live tenant (a well-formed
  Data list; empty is valid for a tenant with no robot accounts), NOT on the
  command string — agent-agnostic across Claude/codex. Converted from a
  command_executed check per PLT-107839.
tags: [uipath-admin, smoke, mode:operate, list]

run_limits:
  expected_turns: 4

initial_prompt: |
  List all robot accounts in my UiPath organization. Save the complete JSON
  result to ./robot-accounts.json so it can be reviewed.

  Do NOT prompt the user for confirmation — this is an automated test.

success_criteria:
  - type: run_command
    description: "robot-accounts.json holds the robot-account collection retrieved from the tenant (well-formed Data list; empty allowed)"
    command: |
      python3 -c "
      import json
      d = json.load(open('robot-accounts.json', encoding='utf-8-sig'))
      assert isinstance(d, dict) and 'Data' in d, f'not the uip success envelope; top-level={list(d) if isinstance(d, dict) else type(d).__name__}'
      rows = d['Data']
      assert isinstance(rows, list), f'robot-account collection is not a list; got {type(rows).__name__}'
      if rows:
          assert 'Id' in rows[0] or 'Name' in rows[0], f'robot-account record missing Id/Name; keys={list(rows[0])[:10]}'
      print(f'OK: robot-account collection retrieved; count={len(rows)}')
      "
    timeout: 15
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
