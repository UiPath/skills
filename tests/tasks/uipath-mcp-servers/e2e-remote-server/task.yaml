task_id: skill-mcp-servers-e2e-remote-server
description: >
  E2E (live DefaultTenant): register a `remote`-type AgentHub MCP server pointing at the public
  DeepWiki MCP endpoint, refresh its tools (sync), verify the server resolved, then the harness
  deletes it.
tags: [uipath-mcp-servers, e2e, mode:build, lifecycle:setup]
sandbox:
  template_sources:
    - type: template_dir
      path: ../_setup
      mount_point: _setup
run_limits:
  max_turns: 40
  turn_timeout: 600

initial_prompt: |
  Work autonomously — take this end to end and don't stop to ask me anything.

  I want to wire up the public DeepWiki MCP endpoint in AgentHub so we can use its tools. Register
  a remote-type MCP server in the Shared folder, name it "E2E Remote", pointing at
  https://mcp.deepwiki.com/mcp (it's a public streamable-HTTP MCP server, no auth), then refresh
  its tools. Give it a unique slug (append the Unix epoch, e.g. remote-e2e-<EPOCH>).

  When it's done, leave a report.json in the working dir for cleanup:
  {"slug": "<slug>", "folder_path": "Shared"}
success_criteria:
  - type: skill_triggered
    description: "uipath-mcp-servers skill auto-loaded (inferred from the task, not named in the prompt)"
    skill_name: "uipath-mcp-servers"
    expected_skill: "uipath-mcp-servers"
    weight: 1.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Created a remote-type MCP server"
    tool_name: "Bash"
    command_pattern: 'uip\s+agenthub\s+mcp\s+create\s+remote'
    min_count: 1
    weight: 2.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Ran refresh-tools with a folder context (--folder-key or --folder-path; the CLI resolves the path)"
    tool_name: "Bash"
    command_pattern: '(?s)uip\s+agenthub\s+mcp\s+refresh-tools.*--folder-(key|path)'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: file_exists
    description: "report.json written for cleanup"
    path: report.json
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "Live tenant: the remote server is retrievable"
    command: 'uip agenthub mcp get "$(jq -r .slug report.json)" --folder-path Shared --output json | jq -e ".Data"'
    timeout: 60
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0

post_run:
  - command: "python3 _setup/cleanup_mcp_server.py"
    timeout: 120
