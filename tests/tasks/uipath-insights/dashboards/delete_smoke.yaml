task_id: skill-insights-smoke-dashboard-delete
description: >
  Smoke test: agent uses the uipath-insights skill to remove a Maestro
  process's saved monitoring dashboard. Given a request that names the
  process and asks for a copy to be kept, the agent should read the slot
  first, delete once by process key with --yes and --backup-file (writes
  guide Rules 15 and 17), report the alert definitions that went with it
  (Rule 16), and say what the Monitoring tab serves now. The CLI is
  authenticated.

  The process key is a fresh GUID per run, written to seed.json in
  pre_run and belonging to no Maestro process, and a second pre_run step
  seeds its slot with a saved dashboard, so there is something to delete on
  every run and the live read-back at the end can prove the slot serves
  the template again. The backup is graded as the CLI's own artifact: a
  camelCase definition whose dataModel is AO (Rule 7), which an agent that
  redirected stdout or wrote prose cannot produce.
tags: [uipath-insights, smoke, mode:build, lifecycle:setup]

run_limits:
  expected_turns: 10

sandbox:
  template_sources:
    - type: template_dir
      path: _setup
      mount_point: _setup

pre_run:
  # A fresh key per run, then a saved row in its slot. slot.py never fails
  # the task: a slot it cannot seed is left as it is, and the prompt's own
  # rule tells the agent to stop on an empty slot. The fresh key is what
  # keeps two gate runs on stacked PRs out of each other's slot (skills
  # runs 35721927455 and 35721932318 collided on a fixed key).
  - command: "python3 _setup/slot.py new"
    timeout: 30
    fail_on_error: false
  - command: "python3 _setup/slot.py seed"
    timeout: 180
    fail_on_error: false

post_run:
  - command: "python3 _setup/slot.py clear"
    timeout: 120

initial_prompt: |
  Remove the saved Insights monitoring dashboard on the Maestro process
  whose key is the process_key in ./seed.json. Before it goes, keep a copy of
  its definition at ./before-delete.json so we can recreate it later.
  Tell me which alert definitions were removed with it and what the
  process's Monitoring tab shows now. If the process has no saved
  dashboard, say so and stop. Delete once, and do not create, copy, or
  update anything.

success_criteria:
  - type: skill_triggered
    description: "Agent activated the uipath-insights skill"
    skill_name: "uipath-insights"
    expected_skill: "uipath-insights"
    weight: 1.5
    pass_threshold: 1.0

  # Every wildcard in this file is bounded with
  # (?:(?!uip\s)(?:[^&;|\n]|\\\n))*; update_smoke.yaml's first comment
  # explains why each part of that class is load-bearing.
  #
  # Rule 10: read before writing. The slot read is what tells the agent
  # there is a saved dashboard to remove and what its id is.
  - type: command_executed
    description: "Agent read the slot before deleting"
    tool_name: "Bash"
    command_pattern: 'uip\s+insights\s+dashboards\s+get\b(?!\s+(?:--help|-h)\b)(?:(?!uip\s)(?:[^&;|\n]|\\\n))*--process-key'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  # The delete, in the shape the guide teaches: --yes because the CLI
  # never prompts and refuses without it, --backup-file because the
  # backend keeps no copy (Rule 15). Matched in one pattern each, so a run
  # that misses one names the one it missed. Either flag order passes.
  - type: command_executed
    description: "Agent confirmed the delete with --yes"
    tool_name: "Bash"
    command_pattern: 'uip\s+insights\s+dashboards\s+delete\b(?!\s+(?:--help|-h)\b)(?:(?!uip\s)(?:[^&;|\n]|\\\n))*(--yes|\s-y)\b'
    min_count: 1
    weight: 2.0
    pass_threshold: 1.0

  # Tied to the path the prompt names, so the json_check below reads the
  # file this flag wrote. A read the agent sent to the same path first is
  # fine and expected (Rule 10 says read before writing): the delete runs
  # after it and overwrites the file with the CLI's own artifact.
  - type: command_executed
    description: "Agent kept a backup of the definition the delete removes at the named path"
    tool_name: "Bash"
    command_pattern: 'uip\s+insights\s+dashboards\s+delete\b(?!\s+(?:--help|-h)\b)(?:(?!uip\s)(?:[^&;|\n]|\\\n))*--backup-file[\s=]+"?\.?/?before-delete\.json'
    min_count: 1
    weight: 2.0
    pass_threshold: 1.0

  # Rule 18: one write, never a blind repeat. Bounded command_executed
  # rather than command_not_executed for the reason update_smoke.yaml
  # gives: the loader rewrites command_not_executed to max_count 0.
  - type: command_executed
    description: "Agent did not send the delete more than once"
    tool_name: "Bash"
    command_pattern: 'uip\s+insights\s+dashboards\s+delete\b(?!\s+(?:--help|-h)\b)'
    min_count: 0
    max_count: 1
    weight: 2.0
    pass_threshold: 1.0

  # The prompt asks for a removal and nothing else. A create or copy after
  # the delete would re-occupy the slot the read-back below checks; an
  # update is an edit the user did not ask for.
  - type: command_not_executed
    description: "Agent did not create, copy, or update a dashboard"
    tool_name: "Bash"
    command_pattern: 'uip\s+insights\s+dashboards\s+(create|copy|update)\b(?!\s+(?:--help|-h)\b)'
    max_count: 0
    weight: 2.0
    pass_threshold: 1.0

  # The delete id form takes the numeric id only; a template-keyed id is
  # refused locally, and there is nothing to delete behind a template.
  - type: command_not_executed
    description: "Agent did not address the delete with a template-keyed id"
    tool_name: "Bash"
    command_pattern: 'uip\s+insights\s+dashboards\s+delete\s+"?UiPath-'
    max_count: 0
    weight: 1.5
    pass_threshold: 1.0

  # SKILL.md Critical Rule 2 forbids command substitution and shell
  # variables inside a uip invocation; the flag list is the superset every
  # dashboard task carries, so a neighbour's `jq --arg $KEY` cannot
  # satisfy it.
  - type: command_not_executed
    description: "Agent did not use command substitution or a shell variable in a uip insights dashboard command"
    tool_name: "Bash"
    command_pattern: 'uip\s+insights\s+dashboards\s+\S+(?:(?!uip\s)(?:[^&;|\n]|\\\n))*--(process-key|case|source-type|localization|output-file|file|backup-file|expected-version|from-process-key|to-process-key|limit|offset|output)[\s=]+"?(\$\(|`|\$[A-Za-z_{])|uip\s+insights\s+dashboards\s+(get|update|delete)\s+"?(\$\(|`|\$[A-Za-z_{])'
    max_count: 0
    weight: 1.5
    pass_threshold: 1.0

  # command_executed only greps the command string. --help is the reality
  # gate: exit 0 only when the CLI registers the command, exit 3 otherwise.
  - type: run_command
    description: "CLI path is real: dashboards delete is registered in the installed CLI"
    command: "uip insights dashboards delete --help"
    timeout: 60
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  # The backup is the CLI's artifact, not the agent's prose: a camelCase
  # definition with dataModel AO (Rule 7). The file name is the prompt's
  # ground-truth anchor, so the agent has to know it.
  - type: json_check
    description: "before-delete.json is the camelCase definition the CLI wrote"
    path: "before-delete.json"
    assertions:
      - expression: "dataModel"
        operator: equals
        expected: "AO"
      - expression: "charts"
        operator: type
        expected: "array"
      - expression: "tables"
        operator: type
        expected: "array"
    weight: 2.0
    pass_threshold: 1.0

  # The delete landed. The slot read after the run says the process
  # serves the template again, which no command string can fake.
  - type: run_command
    description: "Live: the slot serves the template again after the run"
    command: >-
      K=$(python3 -c 'import json; print(json.load(open("seed.json"))["process_key"])');
      uip insights dashboards get --process-key "$K" --output json
      | python3 -c 'import json,sys; sys.exit(0 if json.load(sys.stdin)["Data"]["Saved"] is False else 1)'
    timeout: 60
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
