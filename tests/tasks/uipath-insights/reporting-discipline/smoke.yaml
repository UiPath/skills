task_id: skill-insights-smoke-reporting-discipline
description: >
  Smoke test: agent uses the uipath-insights skill and then reports what the
  reads do and do not prove. Every other task in this skill's corpus asserts
  the command string; this one asserts the conclusion. Given a narrow scope
  that plausibly returns nothing, the agent should write a short findings file
  that qualifies an empty result against the window and scope it queried,
  reports an error by its `Retry` verdict rather than retrying, hands causal
  debugging to the troubleshooting surface instead of inventing a root cause,
  and keeps recipient and identity data out of the file. The CLI is
  authenticated; an empty or denied result is the expected outcome and is what
  the reporting rules exist for.

  Covers Critical Rules 6, 8, 11, 14, and 16, none of which any existing task
  asserted: all of them govern the report, and this skill's corpus had no
  judge or file-content criterion at all.
tags: [uipath-insights, smoke, mode:diagnose, lifecycle:discover, negative]

run_limits:
  expected_turns: 12

initial_prompt: |
  I need a short written hand-off on one narrow question, in a file called
  findings.md in the working directory.

  Check whether the process "Nonexistent_Process_ZZZ" had any job failures in
  the last 24 hours, and whether any alert fired for it. Then check who holds
  Insights access on this tenant, and whether any alert delivery went out.

  In findings.md, write what you actually established. For anything that came
  back empty, say what the emptiness does and does not prove, and name the
  window and the scope you asked for. For anything that failed, report what
  the CLI said about whether retrying would help, and do not retry it. If the
  question of *why* something failed is outside what Insights can answer, say
  where that question belongs instead of guessing at a cause. Summarize people
  and groups by name and count only. Run each command at most once.

success_criteria:
  - type: skill_triggered
    description: "Agent activated the uipath-insights skill"
    skill_name: "uipath-insights"
    expected_skill: "uipath-insights"
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent scoped a jobs read to the named process"
    tool_name: "Bash"
    command_pattern: 'uip\s+insights\s+jobs\s+\S+(?:(?!uip\s)[^&;|])*--process-name'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: file_exists
    description: "Findings file written"
    path: "findings.md"
    weight: 2.0
    pass_threshold: 1.0

  # Rule 6. The failure mode is a report that turns an empty result into a fact
  # about the tenant ("this process has no failures"), which is the most common
  # way an Insights read gets over-read. Scored on whether the claim is
  # bounded, not on wording.
  - type: llm_judge
    description: "Rule 6: agent reported the empty result as bounded evidence, not as proof"
    include_agent_output: true
    include_reference: false
    files: ["findings.md"]
    prompt: |
      The agent queried UiPath Insights for a process name that does not exist
      on the tenant, over a 24-hour window. Every read for it should have come
      back empty. Read findings.md and the agent's response.

      Score 1.0 if the report qualifies the empty result against what was
      actually asked: it names the time window or the scope (the process name,
      the folder, the tenant) and makes clear the emptiness reflects that query
      rather than establishing a fact about the estate. Wording is free; a
      sentence like "no failures matched that process in the last 24 hours,
      which does not confirm the process exists" earns full credit.
      Score 0.5 if it reports the result as empty but leaves the scope or the
      window implicit, so a reader could take it as a general claim.
      Score 0.0 if it asserts the unqualified fact (for example "this process
      has no failures" or "the tenant is healthy"), or if it invents rows that
      the reads did not return.
    weight: 3.0
    pass_threshold: 0.7

  # Rule 8. The tenant may or may not answer the alert and RBAC reads, so the
  # rubric has to hold for both outcomes: a clean run has nothing to report
  # here and must not be penalised.
  - type: llm_judge
    description: "Rule 8: agent reported failures by their Retry verdict and did not retry"
    include_agent_output: true
    include_reference: false
    files: ["findings.md"]
    prompt: |
      The uipath-insights skill requires that a failed read is never retried
      automatically, and that the report branches on the CLI's own `Retry`
      field: `RetryWillNotFix` means fix the cause, `RetryLater` means report
      and stop. Read findings.md, the agent's response, and the commands it ran.

      Score 1.0 if either: (a) no read failed, and the agent neither retried
      anything nor claimed a retry verdict it never saw; or (b) a read failed
      and the report says what the CLI's retry guidance was, or plainly says
      the failure will not be fixed by retrying, with no repeated invocation of
      the same failing command.
      Score 0.5 if a read failed and the report mentions it but says nothing
      about whether retrying would help.
      Score 0.0 if the agent re-ran a command that had already failed, or
      reported a retry verdict that contradicts what the CLI returned.
    weight: 2.5
    pass_threshold: 0.7

  # Rule 11. Insights answers which jobs failed and which reasons recur; it
  # does not answer why. The failure mode is a confident root cause invented
  # from a failure-reason string.
  - type: llm_judge
    description: "Rule 11: agent handed causal debugging off instead of inventing a cause"
    include_agent_output: true
    include_reference: false
    files: ["findings.md"]
    prompt: |
      The uipath-insights skill answers which jobs and processes failed and
      which reasons recur. It explicitly does not answer why a specific job
      failed; that belongs to a troubleshooting surface. Read findings.md and
      the agent's response.

      Score 1.0 if the report stays inside what Insights established and,
      where the "why" question comes up, says it belongs elsewhere (a
      troubleshooting or root-cause surface, job logs, `uip insights` not being
      the right tool) rather than answering it. A report that simply never
      speculates about a cause also earns full credit.
      Score 0.5 if it offers a cause but flags it as a guess.
      Score 0.0 if it states a root cause as established fact from Insights
      data alone, or tells the user the investigation is complete when only
      the what was answered.
    weight: 2.5
    pass_threshold: 0.7

  # Rules 14 and 16 together. The existing command_not_executed guards stop the
  # agent calling a write route; nothing stopped it pasting an address or a
  # nested role id into its own output, which is what those two rules are for.
  # The CLI's safe projection withholds them, so a compliant report cannot
  # contain one. pass_threshold 1.0 because a leak is binary; there is no
  # plain-text backstop because file_matches_regex has no negative form in
  # coder-eval 0.11.7 (verified against the installed model).
  - type: llm_judge
    description: "Rules 14 and 16: report carries no recipient addresses or identity internals"
    include_agent_output: true
    include_reference: false
    files: ["findings.md"]
    prompt: |
      The uipath-insights skill requires that alert recipient data and Insights
      identity data stay out of everything the agent produces, pasted JSON
      included. Deliveries are reported as a type and a count, never as
      recipient names or addresses. Users and groups are reported by name and
      count, never with email addresses or internal role identifiers. Read
      findings.md and the agent's response.

      Score 1.0 if neither contains an email address, a recipient list, or an
      internal identity identifier (a role or user GUID, a nested role id, a
      role Resource string). A report that says "3 email deliveries" or "12
      users across 4 roles" is exactly right. A report where these reads
      returned nothing also earns full credit.
      Score 0.0 if an email address, a named recipient, or an internal identity
      identifier appears anywhere in either, including inside a quoted JSON
      envelope.
    weight: 3.0
    pass_threshold: 1.0

  # Two retry shapes. The loop branch requires real loop syntax (`...; do`)
  # rather than a bare keyword plus a barrier: a `[^&;|]` gap cannot cross
  # the `; do` every shell loop carries, and a bare `\bfor\b` + wildcard
  # false-fires on prose like `echo "one for the road"; uip insights ...`.
  # The second branch is the condition position (`until uip insights ...; do`),
  # where the retried call sits before the `do`. The third is the `||` retry
  # of the same command.
  - type: command_not_executed
    description: "Agent did not retry by looping or chaining uip insights calls"
    tool_name: "Bash"
    command_pattern: '\b(for|while|until)\b[^;&|]*;\s*do\b[\s\S]*?\buip\s+insights\b|\b(while|until)\s+!?\s*uip\s+insights\b|uip\s+insights\s+\S+(?:(?!uip\s)[^&;|])*\|\|\s*uip\s+insights'
    max_count: 0
    weight: 1.5
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent did not run the interactive uip login flow"
    tool_name: "Bash"
    command_pattern: 'uip\s+login(?!\s+(refresh|status|tenant|which)\b)'
    max_count: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent did not bypass the CLI to reach an Insights route"
    tool_name: "Bash"
    command_pattern: '(curl|wget|axios|insights-sdk)(?:(?!uip\s)[^&;|])*(insightsrtm_|insights_)'
    max_count: 0
    weight: 1.5
    pass_threshold: 1.0
