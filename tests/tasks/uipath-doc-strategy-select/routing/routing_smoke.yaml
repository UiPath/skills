task_id: skill-doc-strategy-select-routing-smoke
description: >
  Smoke test: a reusable-corpus workload whose deliverable is an exhaustive list
  must NOT be answered by retrieval. The skill has to recognise the enumerative
  claim, route the written review to SU1, and say that completeness needs
  deterministic enumeration rather than a bigger result limit. Verifies the skill
  fires and that its routing contract — strategy, decisive signal, case ID,
  boundary — is applied, rather than a bare strategy label.

  This replaced an assertion on PA3. Agentic search is not shipped as a strategy
  yet (see the skill's PA reinstatement notes); when it lands, the enumerative
  half of this workload becomes its boundary case and this task should assert
  both.
tags: [uipath-doc-strategy-select, smoke, mode:build, lifecycle:discover]

run_limits:
  expected_turns: 5

initial_prompt: |
  We keep several thousand controlled procedure documents in a knowledge index
  that is reused across runs. A reviewer asks: "which of these documents still
  reference the retired escalation terminology?" — the wording varies between
  documents, so one lookup never finds them all, and the reviewer needs the
  complete list.

  Load the applicable UiPath skill and route this workload. Write your routing
  decision to `route.txt` as a single line in the skill's reporting format,
  followed by two or three lines explaining what is required before the list
  can be called complete.

  Do NOT create a project, a flow, or an agent. Write only `route.txt`.

success_criteria:
  - type: skill_triggered
    description: "Agent invoked the uipath-doc-strategy-select skill"
    expected_skill: "uipath-doc-strategy-select"
    skill_name: "uipath-doc-strategy-select"
    weight: 1.5
    pass_threshold: 1.0

  - type: file_exists
    description: "Agent produced route.txt"
    path: "route.txt"
    weight: 1.0
    pass_threshold: 1.0

  - type: file_contains
    description: "Recognised the enumerative deliverable and routed the review to SU1"
    path: "route.txt"
    includes:
      - "SU1"
    weight: 3.0
    pass_threshold: 1.0

  - type: file_contains
    description: "Applied the completeness boundary rather than treating search as exhaustive"
    path: "route.txt"
    includes:
      - "enumerat"
    weight: 3.0
    pass_threshold: 1.0
