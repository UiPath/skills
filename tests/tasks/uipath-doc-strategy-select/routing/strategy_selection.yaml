task_id: skill-doc-strategy-select-strategy-selection
description: >
  Strategy-selection accuracy. 6 rows: one workload per strategy, across all six.

  Trimmed for cost. The measured set was 42 rows — 21 workloads, each written twice
  in different words, six rows per strategy across all seven — and it is what the
  routing claims in the scorecard rest on. Classify & Split has since been withheld
  from the release, so the scorecard's CS column describes a strategy this build no
  longer ships.

  This 6-row cut keeps one row per shipped strategy so a regression in any single one
  still shows, and drops everything the larger set was built to measure beyond that.
  Recover it with:

      git checkout <ref> -- tests/tasks/uipath-doc-strategy-select/routing/strategy_selection.jsonl

  What the cut no longer measures:

  - Paraphrase invariance. Every workload used to appear under two phrasings sharing
    a `pair` key; only variant `a` survives, so analyze_consistency.py reports 0 of 0
    pairs. A routing signal that works under one wording and fails under another is
    now invisible.
  - The AF/SU seam. `af-clinical-qa` missed in every run of this project under both
    phrasings and is the skill's one known routing defect. It is not in this cut,
    because a permanently-red row in a 6-row gate leaves the suite never green. AF is
    represented by `af-grant-eligibility-read--a`, which passes.
  - Per-strategy depth. One row per strategy cannot distinguish a genuine routing
    failure from one unlucky workload.

  Rows remain held out from the case library, and still state the workload as a
  business would state it — no row contains the words strategy, signal, harness,
  sub-agent or agentic.

  On AH. Its decisive signal used to be circular — "a capability verified to exist
  only in the advanced harness" is a design conclusion, not something a business says
  about its own workload — and it scored 0 for 6 on every run. UiPath publishes the
  capability matrix and a selection rule
  (https://docs.uipath.com/agents/automation-cloud/latest/user-guide/advanced-agents):
  advanced suits work showing two or more of — dozens of tool calls in one run;
  intermediate work that must persist as files; independent parts; material larger
  than one prompt. Those are workload properties, so AH is answerable.

  A row failing here means the routing signal in SKILL.md's Fast Routing table did
  not generalise past the wording of the case it was written from. Fix the routing
  copy, do not relax the row.

  The grading command interpolates ${row.expected_strategy} into a run_command
  string. If the harness does not substitute row fields there, check_strategy.py
  fails loudly with an explicit message rather than grading against a literal
  template — see its --expected guard.

tags: [uipath-doc-strategy-select, integration, mode:build, lifecycle:discover]

dataset:
  paths: ["strategy_selection.jsonl"]

reference:
  directory: .

initial_prompt: |
  Route this document workload to exactly one processing strategy.

  ${row.workload}

  Load the applicable UiPath skill and use its strategy taxonomy. Write your answer
  to a file named `routing.txt` in the current working directory. The FIRST line
  must be the strategy ID alone — one of AH, AF, SU, PS, EX, BT — with nothing
  else on that line. Put your reasoning on the lines below; only the first line is
  read.

  Do not create a project, a flow, an agent, or any other artifact. Write only
  `routing.txt`.

  This run is headless. No user is present and nobody will answer a question, so
  do not ask and do not pause. Pick the single best strategy and commit to it; if
  two are close, choose the one the skill's routing table prefers and say why
  underneath.

success_criteria:
  - type: skill_triggered
    description: "Agent invoked the uipath-doc-strategy-select skill"
    expected_skill: "uipath-doc-strategy-select"
    skill_name: "uipath-doc-strategy-select"
    weight: 1.0
    suite_thresholds: {recall.yes: 0.90}

  - type: run_command
    description: "Selected strategy matches the case library's ground truth for row ${row.id}"
    command: "python3 $REFERENCE_DIR/check_strategy.py --expected '${row.expected_strategy}'"
    timeout: 60
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
    # 0.78 x 6 rows = 4.68, so 5 of 6 must pass; 4 of 6 (0.667) fails.
    suite_thresholds: {mean: 0.78}

run_limits:
  max_turns: 6
  turn_timeout: 300
  task_timeout: 600
