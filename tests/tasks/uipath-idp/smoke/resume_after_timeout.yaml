task_id: skill-idp-resume-after-timeout-smoke
description: >
  Smoke: the wait on a digitization runs out. `digitize --wait` answers
  TimeoutError with the `runs get` command for the run; the run itself keeps
  going. The agent must read that run with `runs get`, in the same folder,
  and must not start a second digitization. Offline: `uip` is a record_cli
  mock, and the markdown only the `runs get` answer carries must reach the
  saved file.
tags: [uipath-idp, smoke, mode:operate, lifecycle:setup]

run_limits:
  expected_turns: 8
  max_turns: 25

sandbox:
  record_cli:
    - tool: uip
      stderr: "uip (mock): offline smoke sandbox; only the `uip documents` calls this task needs are answered.\n"
      responses:
        - when:
            verb: "login status"
          stdout: >-
            {"Result":"Success","Code":"LoginStatus","Data":{"Status":"Logged in",
            "Organization":"example-org","Tenant":"DefaultTenant"}}

        - when:
            verb: "documents digitize"
          exit_code: 4
          stdout: >-
            {"Result":"TimeoutError","Code":"DocumentsDigitize","ErrorCode":"timeout",
            "Message":"Run 9a3f6c58-1e2d-4b7a-b0c4-6f8d2e5a7c13 polling timed out",
            "Instructions":"The run was still running and keeps going on the server; do not start it again. Check it with: uip documents runs get 9a3f6c58-1e2d-4b7a-b0c4-6f8d2e5a7c13 --folder-path 'Finance' --wait --output json",
            "Retry":"RetryLater","Data":{
            "runId":"9a3f6c58-1e2d-4b7a-b0c4-6f8d2e5a7c13","capability":"digitize","status":"running",
            "engine":null,"result":null,"digitization":null,"warnings":[],"error":null,
            "createdAt":"2026-01-15T09:30:05Z","completedAt":null}}

        - when:
            verb: "documents runs get"
          stdout: >-
            {"Result":"Success","Code":"DocumentsRunsGet","Data":{
            "runId":"9a3f6c58-1e2d-4b7a-b0c4-6f8d2e5a7c13","capability":"digitize","status":"succeeded",
            "engine":{"modelId":null,"ocr":{"engine":"auto","applyOnPdf":"auto"},"layout":{"engine":null}},
            "result":{"pageCount":1,
            "markdown":"<!-- page: 1 -->\n\n# Service Agreement SA-7731\n\nBetween Northwind Traders and Contoso Ltd.",
            "pages":[{"number":1,"width":1700,"height":2200}]},
            "digitization":{"runId":"9a3f6c58-1e2d-4b7a-b0c4-6f8d2e5a7c13"},
            "warnings":[],"error":null,
            "createdAt":"2026-01-15T09:30:05Z","completedAt":"2026-01-15T09:36:40Z"}}

initial_prompt: |
  Document 7c1d9e42-3b5a-4f68-8a0e-5d2c6b1f9a37 is already uploaded in the
  Orchestrator folder "Finance". Digitize it with UiPath and save the
  markdown it returns, unchanged, to contract.md.

  Important:
  - The `uip` CLI here is an offline stand-in that answers the document
    commands with canned output. Do NOT attempt to log in.
  - Do NOT ask for confirmation — this is an automated test.

success_criteria:
  - type: skill_triggered
    description: "Agent invoked the uipath-idp skill"
    skill_name: "uipath-idp"
    expected_skill: "uipath-idp"
    weight: 3.0
    pass_threshold: 1.0

  - type: cli_called
    description: "Started the digitization once and never again after the timeout (Critical Rule 5)"
    tool: uip
    verb: "documents digitize"
    flags:
      document-id: "7c1d9e42-3b5a-4f68-8a0e-5d2c6b1f9a37"
    max_count: 1
    weight: 3.0
    pass_threshold: 1.0

  - type: cli_called
    description: "Read the timed-out run with runs get, in the folder it was started in"
    tool: uip
    verb: "documents runs get"
    positional: ["9a3f6c58-1e2d-4b7a-b0c4-6f8d2e5a7c13"]
    flags:
      folder-path: "Finance"
    value_flags: [output, output-filter, timeout, folder-key, tenant]
    weight: 3.0
    pass_threshold: 1.0

  - type: file_contains
    description: "contract.md holds the markdown the finished run returned"
    path: "contract.md"
    includes:
      - "<!-- page: 1 -->"
      - "SA-7731"
    weight: 2.0
    pass_threshold: 1.0
