task_id: skill-connector-builder-icon-dark-theme
description: >
  Install a vendor logo as the connector icon when that logo is solid black.
  `builder validate` passes a black icon (it only warns when image.svg is
  missing), but the periodic build fails an icon whose ink is under 1.5:1 on
  Studio Web's dark surface (#1F1F1F). Guards Rule 13: the agent must make the
  logo follow the surface without recolouring the brand or adding a tile.
tags: [uipath-connector-builder, integration, 'mode:build', 'lifecycle:generate']

sandbox:
  template_sources:
    - type: template_dir
      path: fixtures
      mount_point: vendor

reference:
  directory: .

initial_prompt: |
  Build the shell of a NEW UiPath Integration Service connector on disk for a
  fictional REST API. This is an OFFLINE build — do not log in; pass the
  organization explicitly so the element key can be derived without a session.

  Before starting, load the uipath-connector-builder skill and follow its
  workflow. Do NOT ask for approval, confirmation, or feedback. Do NOT pause
  between steps.

  Connector spec:
    - Display name: Acme Widgets
    - Organization slug: acme
    - Base URL: https://api.acme.example.com
    - Authentication: none (the API is public; configure the `none` auth type)
    - Icon: the vendor's official logo is at vendor/acme-logo.svg — use it as
      the connector icon. It must be ready to publish to Studio Web.

  Finish by running the connector-builder validate step and making sure it
  passes with 0 errors.

success_criteria:
  - type: run_command
    description: "validate re-run confirms a valid connector (exit 0, 0 errors)"
    command: "uip is connectors builder validate --connector-dir periodic-design-acme-acmewidgets"
    timeout: 60
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  # The vendor logo replaced the init placeholder (grey tile + initial).
  - type: file_contains
    description: "image.svg is the vendor logo, not the init placeholder"
    path: periodic-design-acme-acmewidgets/app/element/image.svg
    includes: ["M32 6 L58 56 H44 L32 31 L20 56 H6 Z"]
    excludes: ["<text"]
    weight: 1.5
    pass_threshold: 1.0

  # Primary check — validate is blind to this, so it is the reason the task exists.
  - type: run_command
    description: "icon stays visible on Studio Web's dark surface (#1F1F1F, >= 1.5:1)"
    command: "python3 $REFERENCE_DIR/check_icon_contrast.py periodic-design-acme-acmewidgets/app/element/image.svg --surface dark"
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  # Brand not recoloured: a logo repainted white passes dark but vanishes on light.
  - type: run_command
    description: "icon still visible on a light surface (brand not repainted)"
    command: "python3 $REFERENCE_DIR/check_icon_contrast.py periodic-design-acme-acmewidgets/app/element/image.svg --surface light"
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "no full-bleed backdrop tile added (the brand has none)"
    command: "python3 $REFERENCE_DIR/check_icon_contrast.py periodic-design-acme-acmewidgets/app/element/image.svg --surface dark --forbid-backdrop"
    timeout: 30
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 1.0
