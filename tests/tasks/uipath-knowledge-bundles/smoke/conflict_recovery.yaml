task_id: skill-kb-conflict-recovery-smoke
description: >
  Smoke: a change proposal comes back conflicted because the file it touches
  moved in a newer version. The recovery is to download the bundle again,
  re-apply the edit, and revise the SAME proposal with
  `change-proposal update` — which takes its base to the new version and
  keeps the review thread. Opening a fresh proposal also merges eventually
  but strands the existing comments on the old id, so it is the shortcut this
  task grades against. Criteria read actual CLI invocations, not a
  self-report.
tags: [uipath-knowledge-bundles, smoke, mode:operate]

run_limits:
  expected_turns: 8
  max_turns: 30

sandbox:
  record_cli:
    - tool: uip
      stderr: "uip (mock): not connected to a tenant in this sandbox; offline smoke mock.\n"
      responses:
        - when:
            verb: "or kb change-proposal get"
            positional: ["4"]
          stdout: >-
            {"Result":"Success","Code":"KnowledgeBundleProposalDetail","Data":{
            "Id":"4","Title":"Clarify the retry rules","Status":"Conflicted","BaseVersion":2,"Revision":1,
            "ChangedEntries":[{"path":"concepts/queues.md","hash":"sha256:aa","size":412}],"DeletedPaths":[]}}

        # The merge that reports the conflict. `Data.Status` is the signal —
        # `ErrorCode` is the same `invalid_argument` every merge refusal uses.
        - when:
            verb: "or kb change-proposal merge"
            positional: ["4"]
          exit_code: 1
          stdout: >-
            {"Result":"Failure","ErrorCode":"invalid_argument",
            "Message":"Error merging proposal",
            "Instructions":"HTTP 409: The proposal is Conflicted, not open. Its files moved in a newer version: re-download the bundle, re-apply the edit, and run 'kb change-proposal update 4' — revising this proposal keeps its review thread, where a new proposal starts one over.",
            "Retry":"RetryWillNotFix",
            "Data":{"ProposalId":"4","Merged":false,"Status":"Conflicted","Message":"concepts/queues.md moved in version 3"}}

        - when:
            verb: "or kb download"
          stdout: >-
            {"Result":"Success","Code":"KnowledgeBundleDownloaded","Data":{"Version":3,"Destination":"./kb","Files":4}}

        - when:
            verb: "or kb status"
          stdout: >-
            {"Result":"Success","Code":"KnowledgeBundleStatus","Data":{
            "BundleId":"a1b2c3d4-0000-0000-0000-000000000001","BaseVersion":3,
            "Files":[{"Path":"concepts/queues.md","Kind":"Modified"}]}}

        - when:
            verb: "or kb change-proposal update"
            positional: ["4"]
          stdout: >-
            {"Result":"Success","Code":"KnowledgeBundleProposalUpdated","Data":{
            "Id":"4","Title":"Clarify the retry rules","Status":"Open","BaseVersion":3,"Revision":2,
            "Changed":1,"Deleted":0,"Objects":1,"Inlined":1,"Uploaded":0}}

        - when:
            verb: "or kb change-proposal create"
          stdout: >-
            {"Result":"Success","Code":"KnowledgeBundleProposalCreated","Data":{
            "Id":"5","Title":"Clarify the retry rules","Status":"Open","BaseVersion":3,"Revision":1,
            "Changed":1,"Deleted":0,"Objects":1,"Inlined":1,"Uploaded":0}}

initial_prompt: |
  Proposal 4 on knowledge bundle a1b2c3d4-0000-0000-0000-000000000001 (folder
  Shared) will not merge. Get it landed, and keep the review discussion that
  is already on it.

  Important:
  - The `uip` CLI is available but is NOT connected to a live tenant in this
    environment. Run each command once and move on. Do NOT retry and do NOT
    attempt to log in.
  - Do NOT prompt the user for confirmation — this is an automated test.

success_criteria:
  # The whole point: revise the conflicted proposal rather than replace it.
  - type: cli_called
    description: "Revised the conflicted proposal in place with change-proposal update"
    verb: "or kb change-proposal update"
    tool: "uip"
    positional: ["4"]
    weight: 3.0
    pass_threshold: 1.0

  # The shortcut. A new proposal merges, and loses the thread the prompt
  # explicitly asked to keep.
  - type: cli_called
    description: "Did NOT open a replacement proposal, which would strand the existing comments"
    verb: "or kb change-proposal create"
    tool: "uip"
    min_count: 0
    max_count: 0
    weight: 3.0
    pass_threshold: 1.0

  # Revising against the stale checkout would just conflict again.
  - type: cli_called
    description: "Re-downloaded the bundle before revising, so the new base is the newer version"
    verb: "or kb download"
    tool: "uip"
    weight: 2.0
    pass_threshold: 1.0

  # Stopping early would bank both guards above and look like a pass.
  - type: cli_called
    description: "Attempted the merge that reports the conflict"
    verb: "or kb change-proposal merge"
    tool: "uip"
    positional: ["4"]
    weight: 1.5
    pass_threshold: 1.0
