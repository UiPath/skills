task_id: skill-kb-paging-a-long-history-smoke
description: >
  Smoke: a file's history is longer than one window. `history`, `versions`
  and `change-proposal list` each answer a row window bounded by
  `--limit`/`--offset`, and the envelope's `Pagination` carries `HasMore`.
  The question asked here — which proposal FIRST added the file — cannot be
  answered from a window whose oldest row is not the oldest row there is.
  The agent must read `HasMore` and either fetch the rest or say the answer
  is not in what it has; concluding from the first window is the failure.
tags: [uipath-knowledge-bundles, smoke, mode:operate]

run_limits:
  expected_turns: 5
  max_turns: 25

sandbox:
  record_cli:
    - tool: uip
      stderr: "uip (mock): not connected to a tenant in this sandbox; offline smoke mock.\n"
      responses:
        # A non-zero `--offset`, listed first because the first matching rule
        # wins. The first version of this task answered every call with the
        # same window — so an agent that paged correctly got page one back,
        # concluded from it, and was graded for the mock's failure to page.
        # `--offset 0` is page one, so it falls through to the rule below.
        - when:
            verb: "or kb history"
            flags:
              offset: {matches_regex: "^[1-9][0-9]*$"}
          stdout: >-
            {"Result":"Success","Code":"KnowledgeBundleFileHistory",
            "Pagination":{"Returned":2,"Limit":3,"Offset":3,"Total":5,"HasMore":false},
            "Data":[{"Version":4,"Kind":"Modified","Proposal":"31","Author":"user:ana","ChangedAt":"2026-04-02T09:00:00Z"},
            {"Version":2,"Kind":"Added","Proposal":"12","Author":"user:mihai","ChangedAt":"2026-03-11T14:20:00Z"}]}

        # The first window stops short and says so: five rows in all, three
        # returned, and the file's addition is not among them.
        - when:
            verb: "or kb history"
          stdout: >-
            {"Result":"Success","Code":"KnowledgeBundleFileHistory",
            "Pagination":{"Returned":3,"Limit":3,"Offset":0,"Total":5,"HasMore":true},
            "Data":[{"Version":12,"Kind":"Modified","Proposal":"88","Author":"user:ana","ChangedAt":"2026-09-01T10:00:00Z"},
            {"Version":11,"Kind":"Modified","Proposal":"84","Author":"agent/claude-fable-5","ChangedAt":"2026-08-19T08:30:00Z"},
            {"Version":9,"Kind":"Modified","Proposal":"77","Author":"user:radu","ChangedAt":"2026-07-04T16:45:00Z"}]}

initial_prompt: |
  In the knowledge bundle in folder Shared, bundle key
  a1b2c3d4-0000-0000-0000-000000000001, I need to know which change proposal
  FIRST added the file concepts/queues.md, and who opened it. Use
  --limit 3 so the answers stay readable.

environment_notes:
  - The `uip` CLI is available but is NOT connected to a live tenant in this
    environment. Run each command once and move on. Do NOT retry and do NOT
    attempt to log in.
  - Do NOT prompt the user for confirmation — this is an automated test.

success_criteria:
  - type: cli_called
    description: "Read the file's history"
    verb: "or kb history"
    tool: "uip"
    weight: 2.0
    pass_threshold: 1.0

  - type: llm_judge
    description: "Found the file's addition past the first window instead of answering from it"
    include_agent_output: true
    prompt: |
      The user asked which change proposal FIRST added
      concepts/queues.md, and who opened it. `uip or kb history` answers in
      windows. The first window (no `--offset`) held versions 12, 11 and 9,
      all `Kind: "Modified"`, with `"Total":5` and `"HasMore":true`. Asking
      again with `--offset 3` returned the rest: version 4 (Modified) and
      version 2, `Kind: "Added"`, proposal 12, opened by user:mihai.

      Score 1.0 if the agent's answer is proposal 12 opened by user:mihai.
      Also score 1.0 if it did not reach that answer but said plainly that
      the first window does not contain the file's addition and that more
      rows exist — not naming any proposal as the answer.

      Score 0.0 if it named proposal 77, 84 or 88 as the one that first added
      the file, said version 9 (or any version other than 2) is where it
      appeared, or presented the first window as the whole history.
    weight: 3.0
    pass_threshold: 1.0
