task_id: skill-troubleshoot-execute-query-enable-constraints
description: >
  UiPath diagnostic agent must diagnose an Execute Query failure that faults on
  every Orchestrator run with "Execute Query: Failed to enable constraints. One
  or more rows contain values violating non-null, unique, or foreign-key
  constraints." (System.Data.ConstraintException). The query executed fine — the
  fault is that the returned rows violate the schema Execute Query auto-infers
  for the result DataTable: the Sql is a SELECT * over a one-to-many
  Customers->Orders JOIN, so the CustomerId column (inferred as the unique/
  primary key from its source table) repeats, and DataTable.EnableConstraints
  throws. The error text names the constraint CATEGORY but not which column or
  why, so the cause is only visible in the workflow SQL. The agent must identify
  the duplicate-key-vs-inferred-schema mismatch (SELECT * over a 1-to-many JOIN)
  and recommend reshaping the query so the returned key is unique (select the
  needed columns at the correct grain) — NOT blame bad DB data, a connection
  problem, a syntax error, or recommend disabling constraint enforcement as the
  fix. Grades the conclusion (skill_triggered + llm_judge against RESOLUTION.md),
  not the trajectory.

tags: [uipath-troubleshoot, rpa, e2e, mode:diagnose, lifecycle:discover]

agent:
  allowed_tools: ["Bash", "Read", "Write", "Edit", "Glob", "Grep", "Skill", "Agent", "AskUserQuestion", "TodoWrite"]

run_limits:
  expected_turns: 40
  task_timeout: 5400
  max_turns: 60
  turn_timeout: 3600

sandbox:
  node: {}
  template_sources:
    - type: template_dir
      path: ../../_shared/mock_template
    - type: template_dir
      path: process
    - type: template_dir
      path: data
  mock_path_dirs:
    - m

pre_run:
  # Seal the mock store before the agent starts: packs m/r/ into an opaque
  # m/.store and removes m/r/, so the agent cannot read the recorded uip
  # outputs and reach the diagnosis without investigating.
  - command: "python m/seal"
    timeout: 60
    fail_on_error: true

reference:
  directory: reference

initial_prompt: |
  My CustomerOrderReport process is faulting in Orchestrator on every run.
  Can you investigate why?

success_criteria:
  - type: skill_triggered
    description: "Agent invoked the uipath-troubleshoot skill"
    skill_name: "uipath-troubleshoot"
    expected_skill: "uipath-troubleshoot"
    weight: 1.0

  - type: llm_judge
    description: "Agent's diagnosis matches RESOLUTION.md"
    weight: 3.0
    pass_threshold: 0.7
    include_reference: false
    files:
      - $REFERENCE_DIR/RESOLUTION.md
    include_dialog: true
    include_agent_output: true
    prompt: |
      Grade the agent's final answer against the attached RESOLUTION.md.

      Score on whether the agent identifies the same root cause and
      recommends the same fix as RESOLUTION.md:

        1.0  Same root cause AND same fix (or equivalent).
        0.8  Same root cause; fix is right area but vague.
        0.5  Adjacent cause, missing a key specific.
        0.2  Wrong direction; recognized surface only.
        0.0  Misdiagnosed or blocked.

      Return JSON: {"score": <float>, "rationale": "<one sentence>"}

simulation:
  enabled: true
  persona: |
    You are the UiPath user who originally reported the failing process.
    You are waiting for the diagnostic agent to finish its investigation
    and trust its expertise. You only have the information you wrote in
    your initial report — no extra data.
  goal: |
    Let the agent complete its diagnostic flow without imposing
    constraints. Approve every scope expansion or clarification the
    agent requests so the investigation reaches the final resolution.
  constraints:
    - "If the agent asks where the project source code / project directory / XAML files are, answer with the current working directory: respond exactly `.` (a single dot) — the project files for this scenario are staged into the sandbox cwd by the test harness."
    - "If the agent asks whether to expand investigation scope (any new product domain such as orchestrator, database-activities, activity-packages), always answer Yes — pick the recommended / first / affirmative option."
    - "If the agent asks how to proceed when data is missing, tell it to proceed with best-effort findings using the evidence already gathered. EXCEPTION: if the missing data is the project source code path, fall back to the rule above (`.` / current working directory)."
    - "Never invent or provide new factual data — you don't know any details beyond your initial report. EXCEPTION: the project source code path IS a real fact about your test setup; you may share it when asked (`.`)."
    - "Keep replies short (one sentence or pick a numbered option)."
    - "Never instruct the agent to stop, abort, or skip phases."
    - "If the agent offers or asks to apply/implement the fix itself (editing project files, or running validate/build/pack/publish), DECLINE: say you will apply the change yourself in Studio later, and ask only for the root cause and the exact fix steps. Never approve a source-file edit."
  max_turns: 6
