task_id: skill-troubleshoot-excel-macro-vba-error
description: >
  UiPath troubleshoot agent must diagnose an Execute Macro failure
  where the macro ran but threw a VBA runtime error inside the
  macro code. The activity surfaces this as COMException with
  HRESULT 0x80020009 (DISP_E_EXCEPTION) wrapping the inner VBA
  error 'Run-time error 91: Object variable or With block variable
  not set'. Agent must match the activity-packages/excel-activities/playbooks/execute-macro-failures.md
  playbook, identify the VBA-error branch (branch 2) from the
  HRESULT + inner-message evidence, and recommend opening the
  workbook in the VBA editor to fix the macro's logic.

tags: [uipath-troubleshoot, rpa, e2e, mode:diagnose]

agent:
  allowed_tools: ["Bash", "Read", "Write", "Edit", "Glob", "Grep", "Skill", "AskUserQuestion", "TodoWrite"]

run_limits:
  expected_turns: 300
  task_timeout: 4500
  max_turns: 60
  turn_timeout: 3600

sandbox:
  python: {}
  template_sources:
    - type: template_dir
      path: ../../_shared/mock_template
    - type: template_dir
      path: process
    - type: template_dir
      path: data
  mock_path_dirs: ["m"]

pre_run:
  # Seal the mock store before the agent starts: packs m/r/ into an opaque
  # m/.store and removes m/r/, so the agent cannot read the recorded uip
  # outputs and reach the diagnosis without investigating.
  - command: "python m/seal"
    timeout: 60
    fail_on_error: true

reference:
  file: RESOLUTION.md

initial_prompt: |
  My Orchestrator job just faulted with
  `System.Runtime.InteropServices.COMException (0x80020009): Exception occurred. ---> Run-time error '91': Object variable or With block variable not set`
  Pinned job key: bb222222-cccc-dddd-eeee-ffffaaaabbbb. The macro
  was working fine last week. What's wrong now?

success_criteria:
  - type: skill_triggered
    description: "Agent invoked the uipath-troubleshoot skill"
    skill_name: "uipath-troubleshoot"
    expected_skill: "uipath-troubleshoot"
    weight: 1.0

  - type: llm_judge
    description: "Agent's diagnosis matches RESOLUTION.md"
    weight: 3.0
    pass_threshold: 0.7
    include_reference: true
    include_dialog: true
    include_agent_output: true
    prompt: |
      Grade the agent's final answer against the attached RESOLUTION.md.

      Score on whether the agent identifies the same root cause and
      recommends the same fix as RESOLUTION.md:

        1.0  Same root cause AND same fix (or equivalent).
        0.8  Same root cause; fix is right area but vague.
        0.5  Adjacent cause, missing a key specific.
        0.2  Wrong direction; recognized surface only.
        0.0  Misdiagnosed or blocked.

      Return JSON: {"score": <float>, "rationale": "<one sentence>"}

simulation:
  enabled: true
  persona: |
    You are the UiPath user who originally reported the failing process.
    You are waiting for the diagnostic agent to finish its investigation
    and trust its expertise. You only have the information you wrote in
    your initial report — no extra data.
  goal: |
    Let the agent complete its diagnostic flow without imposing
    constraints. Approve every scope expansion or clarification the
    agent requests so the investigation reaches the final resolution.
  constraints:
    - "If the agent asks whether to expand investigation scope (any new product domain such as orchestrator, system-activities, activity-packages), always answer Yes — pick the recommended / first / affirmative option."
    - "If the agent asks how to proceed when data is missing, tell it to proceed with best-effort findings using the evidence already gathered."
    - "If the agent asks where the failing project's source or code is, tell it the project source is available in the current working directory."
    - "Never invent or provide new factual data — you don't know any details beyond your initial report, other than the project-source location noted above."
    - "Keep replies short (one sentence or pick a numbered option)."
    - "Never instruct the agent to stop, abort, or skip phases."
    - "If the agent offers or asks to apply/implement the fix itself (editing project files, or running validate/build/pack/publish), DECLINE: say you will apply the change yourself in Studio later, and ask only for the root cause and the exact fix steps. Never approve a source-file edit."
  max_turns: 6
