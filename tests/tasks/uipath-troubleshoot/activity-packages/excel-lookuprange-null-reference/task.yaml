task_id: skill-troubleshoot-lookup-null-reference
description: >
  UiPath troubleshooting agent must diagnose a classic Lookup Range failure
  caused by the activity being placed outside any Excel Application Scope: with
  no workbook context object, the Lookup Range dereferences null and faults
  with System.NullReferenceException at startup. The fault stack and Main.xaml
  both show no enclosing Excel scope. Success = agent matches the
  null-reference-from-activity playbook AND identifies the missing Excel scope
  (found in Main.xaml) as the cause.
tags: [uipath-troubleshoot, rpa, e2e, mode:diagnose]

agent:
  allowed_tools: ["Bash", "Read", "Write", "Edit", "Glob", "Grep", "Skill", "Agent", "AskUserQuestion", "TodoWrite"]

run_limits:
  expected_turns: 300
  task_timeout: 5400
  max_turns: 60
  turn_timeout: 3600

sandbox:
  template_sources:
  - type: template_dir
    path: ../../_shared/mock_template
  - type: template_dir
    path: process
  - type: template_dir
    path: data
  mock_path_dirs:
  - m

pre_run:
  # Seal the mock store before the agent starts: packs m/r/ into an opaque
  # m/.store and removes m/r/, so the agent cannot read the recorded uip
  # outputs and reach the diagnosis without investigating.
  - command: "python m/seal"
    timeout: 60
    fail_on_error: true

reference:
  file: RESOLUTION.md

initial_prompt: |
  My OrderLookup process faults on every run in Orchestrator with an
  "Object reference not set to an instance of an object" error. The folder
  is "RPA Production". It is supposed to look up order IDs in an orders
  spreadsheet.

success_criteria:
  - type: skill_triggered
    description: "Agent invoked the uipath-troubleshoot skill"
    skill_name: "uipath-troubleshoot"
    expected_skill: "uipath-troubleshoot"
    weight: 1.0

  - type: llm_judge
    description: "Agent's diagnosis matches RESOLUTION.md"
    weight: 3.0
    pass_threshold: 0.7
    include_reference: true
    include_dialog: true
    include_agent_output: true
    prompt: |
      Grade the agent's final answer against the attached RESOLUTION.md.

      Score on whether the agent identifies the same root cause and
      recommends the same fix as RESOLUTION.md:

        1.0  Same root cause AND same fix (or equivalent).
        0.8  Same root cause; fix is right area but vague.
        0.5  Adjacent cause, missing a key specific.
        0.2  Wrong direction; recognized surface only.
        0.0  Misdiagnosed or blocked.

      Return JSON: {"score": <float>, "rationale": "<one sentence>"}

simulation:
  enabled: true
  persona: |
    You are the UiPath user who reported the failing process. You know only
    that it faults on every run with an "Object reference not set" error and
    that it is supposed to look up order IDs in an orders spreadsheet. You
    have just the information in your initial report.
  goal: |
    Let the agent complete its troubleshooting flow without imposing
    constraints. Approve every scope expansion or clarification the agent
    requests so the investigation reaches the final resolution.
  constraints:
    - "If the agent asks whether to expand investigation scope (any new product domain such as orchestrator, excel-activities, activity-packages), always answer Yes - pick the recommended / first / affirmative option."
    - "If the agent asks whether the workflow was recently changed, say you are not sure - you did not build it and do not know its internals."
    - "If the agent asks how to proceed when data is missing, tell it to proceed with best-effort findings using the workflow source and the job evidence already gathered."
    - "If the agent asks where the failing project's source or code is, tell it the project source is available in the current working directory."
    - "Never invent factual data beyond your initial report, other than the project-source location noted above."
    - "Keep replies short (one sentence or pick a numbered option)."
    - "Never instruct the agent to stop, abort, or skip phases."
    - "If the agent offers or asks to apply/implement the fix itself (editing project files, or running validate/build/pack/publish), DECLINE: say you will apply the change yourself in Studio later, and ask only for the root cause and the exact fix steps. Never approve a source-file edit."
  max_turns: 6
