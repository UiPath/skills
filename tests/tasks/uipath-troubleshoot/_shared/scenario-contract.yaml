# Master contract for uipath-troubleshoot scenario task.yamls.
#
# Every scenario under tests/tasks/uipath-troubleshoot/ is generated from one
# template (_shared/scripts/generate_scenario.py) and must keep the invariants
# below. `scripts/check-troubleshoot-tasks.py` enforces this file against every
# scenario AND against the generator template itself, so a rule added here
# cannot silently apply to only one of them.
#
# Add a rule here ONLY when it holds for every scenario. The checker fails the
# build on violation, so a rule that is merely preferred belongs in the suite
# CLAUDE.md as guidance instead.

# Tasks that are not faithful-replay scenarios and therefore carry none of the
# scenario invariants. smoke-manifest-commands is a deterministic fixture check
# with no agent investigation and no simulated dialog.
exempt:
  - smoke-manifest-commands/task.yaml

simulation:
  # The simulated user drives the dialog. These fingerprints must appear in
  # simulation.constraints; wording around them is free.
  required_constraints:
    - id: decline-fix-application
      contains: "Never approve a source-file edit"
      why: >
        Scenarios grade the diagnosis only (skill_triggered + llm_judge against
        RESOLUTION.md). A simulated user who approves the agent's offer to
        apply the fix sends the run into an edit + validate/build/pack loop
        that costs 8-30 minutes per task and is never graded. The simulator
        must take the fix steps and end the dialog.

success_criteria:
  required_types:
    - skill_triggered
    - llm_judge
  # Grading investigation bookkeeping (which files were written, which CLI
  # route was taken) false-fails agents that reach the right conclusion by a
  # different valid path.
  forbidden_types:
    - file_exists
    - file_contains
    - command_executed
  skill_triggered:
    expected_skill: uipath-troubleshoot
  llm_judge:
    weight: 3.0
    pass_threshold: 0.7
    require_true:
      - include_reference
      - include_agent_output
    # The judge grades the presented diagnosis, not internal artifacts.
    forbidden_keys:
      - files

structure:
  required_tags:
    - uipath-troubleshoot
  reference_file: RESOLUTION.md
  # Prepends ./m to PATH so bare `uip` resolves to the mock dispatcher instead
  # of the real CLI (which would try to authenticate).
  mock_path_dirs:
    - m
  require_run_limits: true

# Validated as a synthetic scenario after rendering its placeholders, so the
# generator cannot drift from the scenarios it produces.
generator_template:
  path: tests/tasks/uipath-troubleshoot/_shared/scripts/generate_scenario.py
  symbol: TASK_YAML_TEMPLATE
