task_id: skill-troubleshoot-screenshot-handle-invalid
description: >
  UiPath diagnostic agent must diagnose a DashboardSnapshotBot
  unattended job that faults partway through at a screenshot activity
  with "System.ComponentModel.Win32Exception (6): The handle is
  invalid. at System.Drawing.Graphics.CopyFromScreen(...)". The root
  cause is that the unattended run has no live interactive desktop to
  capture: the robot user has LoginToConsole=true, so it attaches to
  the machine's physical console (no rendered desktop when no one is
  logged in there) instead of opening its own RDP session, and
  CopyFromScreen has no valid device context. The agent must recognize
  screen capture needs a live session and recommend giving the robot
  its own one (set Login to Console = No / keep an interactive session
  connected), NOT treat it as a workflow-logic bug. Per the
  screen-capture-handle-invalid playbook.

tags: [uipath-troubleshoot, orchestrator, rpa, e2e, mode:diagnose, lifecycle:discover]

agent:
  allowed_tools: ["Bash", "Read", "Write", "Edit", "Glob", "Grep", "Skill", "Agent", "AskUserQuestion", "TodoWrite"]

run_limits:
  expected_turns: 300
  task_timeout: 5400
  max_turns: 60
  turn_timeout: 3600

sandbox:
  python: {}
  template_sources:
    - type: template_dir
      path: ../../../_shared/mock_template
    - type: template_dir
      path: process
    - type: template_dir
      path: data
  mock_path_dirs: ["m"]

pre_run:
  # Seal the mock store before the agent starts: packs m/r/ into an opaque
  # m/.store and removes m/r/, so the agent cannot read the recorded uip
  # outputs and reach the diagnosis without investigating.
  - command: "python m/seal"
    timeout: 60
    fail_on_error: true

reference:
  directory: reference

initial_prompt: |
  My DashboardSnapshotBot job in the MonitoringOps folder faults
  midway with a "handle is invalid" error when it tries to grab a
  screenshot. It works when I run it interactively on my machine but
  fails as a scheduled unattended job. Why, and how do I fix it?

success_criteria:
  - type: skill_triggered
    description: "Agent invoked the uipath-troubleshoot skill"
    skill_name: "uipath-troubleshoot"
    expected_skill: "uipath-troubleshoot"
    weight: 1.0

  - type: llm_judge
    description: "Agent's diagnosis matches RESOLUTION.md"
    weight: 3.0
    pass_threshold: 0.7
    include_reference: false
    files:
      - $REFERENCE_DIR/RESOLUTION.md
    include_dialog: true
    include_agent_output: true
    prompt: |
      Grade the agent's final answer against the attached RESOLUTION.md.

      Score on whether the agent identifies the same root cause and
      recommends the same fix as RESOLUTION.md:

        1.0  Same root cause AND same fix (or equivalent).
        0.8  Same root cause; fix is right area but vague.
        0.5  Adjacent cause, missing a key specific.
        0.2  Wrong direction; recognized surface only.
        0.0  Misdiagnosed or blocked.

      Return JSON: {"score": <float>, "rationale": "<one sentence>"}

simulation:
  enabled: true
  persona: |
    You are the UiPath user who reported the failing
    DashboardSnapshotBot job. You are waiting for the diagnostic
    agent to finish and trust its expertise. You only know what you
    wrote in your initial report — it fails on a "handle is invalid"
    error when taking a screenshot as an unattended job, but works
    interactively. You do not know what Login to Console is.
  goal: |
    Let the agent complete its diagnostic flow without imposing
    constraints. Approve every scope expansion or clarification the
    agent requests so the investigation reaches the final resolution.
  constraints:
    - "If the agent asks whether to expand investigation scope (orchestrator, robots, session settings, ui-automation), always answer Yes — pick the recommended / first / affirmative option."
    - "If the agent asks how to proceed when data is missing, tell it to proceed with best-effort findings using the evidence already gathered."
    - "Never invent or provide new factual data — you don't know any details beyond your initial report."
    - "Keep replies short (one sentence or pick a numbered option)."
    - "Never instruct the agent to stop, abort, or skip phases."
    - "If the agent offers or asks to apply/implement the fix itself (editing project files, or running validate/build/pack/publish), DECLINE: say you will apply the change yourself in Studio later, and ask only for the root cause and the exact fix steps. Never approve a source-file edit."
  max_turns: 6
