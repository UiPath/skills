task_id: skill-troubleshoot-is-trigger-traces-evidence-first
description: >
  A trigger that is working: it polled every five minutes, every cycle
  succeeded, and the events that matched started jobs. The reporter believes it
  is broken because the issues they care about are excluded by the filter. The
  test is ordering — a trace read first answers it in one command, while the
  configuration checks the old playbook led with (connection ping, fire log)
  find nothing and cost the run. Guards the evidence-first rewrite of
  trigger-not-firing.md; activation tests cannot distinguish it from the
  previous inference-first version.
tags: [uipath-troubleshoot, integration-service, e2e, mode:diagnose]

agent:
  allowed_tools: ["Bash", "Read", "Grep", "Glob", "Skill", "TodoWrite"]

run_limits:
  expected_turns: 12
  task_timeout: 2400
  max_turns: 40

sandbox:
  template_sources:
    - type: template_dir
      path: ../../../_shared/mock_template
    - type: template_dir
      path: data
  mock_path_dirs:
    - m

pre_run:
  - command: "python m/seal"
    timeout: 60
    fail_on_error: true

reference:
  directory: reference

initial_prompt: |
  My Jira trigger in folder ISTriggersReliability/Jira has not started a job for
  any of the issues my team raised this morning. The trigger is called
  ProcessIssues_EventTrigger-Wait for Issue Created. Why is it not firing?

  Investigate and tell me the root cause. Do not run any mutating command;
  give me the commands to run instead.

success_criteria:
  - type: skill_triggered
    description: "Agent invoked the uipath-troubleshoot skill"
    skill_name: "uipath-troubleshoot"
    expected_skill: "uipath-troubleshoot"
    weight: 1.0

  - type: command_executed
    description: "Agent read the trigger's traces"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+is\s+trigger-traces\s+list'
    min_count: 1
    weight: 3.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent opened a trace's spans to read the filter"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+traces\s+spans\s+get'
    min_count: 1
    weight: 2.0
    pass_threshold: 1.0

  # The whole point of the rewrite: with healthy traces in hand there is no
  # reason to ping the connection. The old playbook led with it.
  - type: command_not_executed
    description: "Agent did not ping the connection against a healthy trigger"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+is\s+connections\s+ping'
    weight: 3.0
    pass_threshold: 1.0

  - type: llm_judge
    description: "Agent blames the filter, not the connection or the trigger"
    weight: 3.0
    pass_threshold: 0.7
    include_reference: false
    files:
      - $REFERENCE_DIR/RESOLUTION.md
    include_dialog: true
    include_agent_output: true
    prompt: |
      Grade the agent's final answer against the attached RESOLUTION.md.

      The correct answer is that the trigger is healthy and its filter
      `(project == 'SUP')` excluded the reporter's issues. Credit the agent for
      quoting the filter expression and naming the rejected record.

        1.0  Says the trigger ran fine and the filter rejected the events, and
             quotes the expression or names the rejected record id.
        0.8  Says the filter is the cause but does not quote it.
        0.5  Says the trigger ran fine but does not identify the filter.
        0.2  Blames the connection, permissions, or the subscription.
        0.0  Says the trigger is broken, or reaches no conclusion.

      Return JSON: {"score": <float>, "rationale": "<one sentence>"}
