<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Acme Vendor Portal</title>
  <style>
    .row { margin: 6px 0; }
    label { display: inline-block; width: 90px; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Vendor record</h1>
  <div class="row"><label>Vendor ID</label> <span class="field-value">V-2231</span></div>
  <div class="row"><label>Tax ID</label> <span class="field-value">T-9981</span></div>
  <p>Vendor code: <input id="vendor-code" type="text" value=""></p>
  <p>Notes: <input id="vendor-notes" type="text" value=""></p>
  <button id="sync-button" type="button" onclick="startSync()">Sync</button>
  <p>Sync status: <span id="sync-status">Idle</span></p>
  <script>
    function startSync() {
      var status = document.getElementById('sync-status');
      status.textContent = 'Syncing';
      setTimeout(function () { status.textContent = 'Ready'; }, 1500);
    }
  </script>
</body>
</html>
