task_id: skill-migrator-migrate-classic-windows
description: >
  Skill-guided evaluation: the agent uses the uipath-activity-migrator skill to
  migrate a committed Windows-framework project that still uses classic UIA
  activities (ConsentBannerProbe: one XAML with Open Browser, Click, Get Full
  Text, Close Tab). Verifies the skill's pipeline end to end without user
  questions: acquire UiPath.Upgrade.exe, analyze and upgrade in SARIF mode with
  the pinned UIAutomation line, summarize, write the output to a sibling folder,
  leave the source untouched, and produce an output that `uip rpa build`
  compiles. Windows only: the migrator is a .NET 8 desktop tool and the build
  needs Helm. The runtime check is declined in the prompt because the project
  drives a browser, which the runner cannot exercise.
tags: [uipath-activity-migrator, smoke, mode:build, lifecycle:generate, windows]

run_limits:
  expected_turns: 45
  max_turns: 90
  task_timeout: 2400
  turn_timeout: 2400

sandbox:
  template_sources:
    - type: template_dir
      path: fixture

# Grading-only copy of the fixture, exposed to run_command as REFERENCE_DIR.
reference:
  directory: fixture

initial_prompt: |
  Migrate the UiPath project in ./ConsentBannerProbe with the Activity
  Migrator. Target the 26.10 UIAutomation line. Do not run the migrated
  project.

  The `uip` CLI is available and authenticated in this sandbox.

success_criteria:
  - type: skill_triggered
    description: "Agent invoked the uipath-activity-migrator skill"
    skill_name: "uipath-activity-migrator"
    expected_skill: "uipath-activity-migrator"
    weight: 1.0
    pass_threshold: 1.0

  # Rule 2: every analyze/upgrade run uses SARIF output. The segment idiom keeps
  # the lookahead inside this one command; `--help` invocations are exempt.
  - type: command_executed
    description: "Agent ran analyze with --output-format sarif"
    command_pattern: '(?:UiPath\.Upgrade\.exe|\$\{?\w+\}?)"?\s+analyze(?=(?:(?!\n|&&|\|\||;|\|).)*--output-format\s+sarif)'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent ran upgrade into a separate output path"
    command_pattern: '(?:UiPath\.Upgrade\.exe|\$\{?\w+\}?)"?\s+upgrade(?=(?:(?!\n|&&|\|\||;|\|).)*--output-path)'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: command_not_executed
    description: "No analyze or upgrade run without SARIF output (console mode opens a browser and prints nothing machine-readable)"
    command_pattern: '(?:UiPath\.Upgrade\.exe|\$\{?\w+\}?)"?\s+(analyze|upgrade)(?!(?:(?!\n|&&|\|\||;|\|).)*(--output-format\s+sarif|--help))'
    weight: 1.5
    pass_threshold: 1.0

  # Rule 7: extension options bind only in the `--name=value` form; the
  # space-separated form is accepted and silently ignored by the tool.
  - type: command_executed
    description: "Agent pinned the UIAutomation version with the = form"
    command_pattern: '--uia-package-version=\d'
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent never passed the UIAutomation version space-separated"
    command_pattern: '--uia-package-version\s+\d'
    weight: 1.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent classified the SARIF with the skill's summarizer"
    command_pattern: 'summarize-sarif\.mjs'
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0

  - type: file_exists
    description: "Analyze SARIF was written under the source's .upgrade folder"
    path: "ConsentBannerProbe/.upgrade/analyze-latest.sarif"
    weight: 1.0
    pass_threshold: 1.0

  - type: file_exists
    description: "Upgrade SARIF was written under the source's .upgrade folder"
    path: "ConsentBannerProbe/.upgrade/upgrade-latest.sarif"
    weight: 1.0
    pass_threshold: 1.0

  - type: file_check
    description: "Output project.json is a Windows project pinned to the requested 26.10 UIAutomation line"
    path: "ConsentBannerProbe_Upgraded/project.json"
    patterns:
      - pattern: '"targetFramework"\s*:\s*"Windows"'
        must_match: true
      - pattern: '"UiPath\.UIAutomation\.Activities"\s*:\s*"\[26\.10\.\d+\]"'
        must_match: true
    weight: 2.0
    pass_threshold: 1.0

  # The tool rewrote the classic UIA activities into their modern counterparts;
  # `ui:LogMessage` stays because the `ui:` prefix also covers System activities.
  - type: file_check
    description: "Output Main.xaml carries modern UIA activities and no classic ones"
    path: "ConsentBannerProbe_Upgraded/Main.xaml"
    patterns:
      - pattern: '<uix:NApplicationCard\s'
        must_match: true
      - pattern: '<uix:NClick\s'
        must_match: true
      - pattern: '<uix:NGetText\s'
        must_match: true
      - pattern: '<ui:(Click|GetFullText|OpenBrowser|CloseTab)\s'
        must_match: false
    weight: 2.0
    pass_threshold: 1.0

  # Rule 5: the source project is never written to (only its .upgrade folder).
  # REFERENCE_DIR is read inside Python so the check works under cmd.exe and /bin/sh.
  - type: run_command
    description: "Source project.json and Main.xaml are byte-identical to the fixture"
    command: |-
      python -c "import filecmp, os, sys; t = os.path.join(os.environ['REFERENCE_DIR'], 'ConsentBannerProbe'); sys.exit(0 if all(filecmp.cmp(os.path.join(t, f), os.path.join('ConsentBannerProbe', f), shallow=False) for f in ('Main.xaml', 'project.json')) else 1)"
    timeout: 10
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  # Rule 8, graded as an outcome: the harness builds the output itself with the
  # host Studio pin cleared. Absolute path per the rpa-tool double-resolve bug;
  # `shutil.which` resolves the `uip.cmd` shim on Windows.
  - type: run_command
    description: "uip rpa build exits 0 against the migrated output"
    command: |-
      python -c "import subprocess, os, sys, shutil; uip = shutil.which('uip') or 'uip'; env = dict(os.environ); env.pop('UIPATH_STUDIO_PID', None); sys.exit(subprocess.call([uip, 'rpa', 'build', os.path.abspath('ConsentBannerProbe_Upgraded'), '--output', 'json'], env=env))"
    timeout: 600
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  # Rule 11: the prompt declined the run; the agent must not start one.
  - type: command_not_executed
    description: "Agent did not run or debug the migrated project"
    command_pattern: 'uip\s+rpa\s+(run|debug)\b'
    weight: 1.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent did not resolve package versions through the headless Studio (refuses Legacy projects, starts Helm for nothing)"
    command_pattern: 'uip\s+rpa\s+packages\s+versions'
    weight: 1.0
    pass_threshold: 1.0
