task_id: skill-ah-publish-from-pdd-403-fallback
description: >
  APPLICATIONS NEVER BLOCK THE PUBLISH — the RPANAV-19120 scenario against the same
  mocked Automation Hub tenant as publish_from_pdd_structural, with one difference:
  this tenant's submission schema does NOT offer `new_applications` (an older build,
  or an admin who disabled adding applications for the section). Three of the PDD's
  five systems are missing from the inventory, so the skill's only route to create
  them is the admin inventory upsert (`uip ah applications update`), which the mock
  answers with the real 403 a non-admin gets. The grade: the agent attempted the
  upsert once, before the create, and then published anyway — exactly one create,
  the two inventory systems attached by id, no `new_applications` key, no decoy or
  out-of-scope substitute, and the three uncreatable systems named in the
  description. The payload, documents, read-back, header and users-list checks are
  the structural task's own. Deterministic, no tenant, judge-free.
tags: [uipath-automationhub, integration, mode:build, lifecycle:setup]

run_limits:
  expected_turns: 22
  max_turns: 40

# The structural task's fixtures (mock tenant, PDD, process map) with one file
# overlaid: ah-schema.json without the new_applications property. Later sources
# overwrite earlier ones.
sandbox:
  template_sources:
    - type: template_dir
      path: ../_shared/mock_template
    - type: template_dir
      path: ../publish_from_pdd_structural/fixtures
    - type: template_dir
      path: fixtures
  mock_path_dirs:
    - mocks

# The grader is the structural task's check_publish.py (shared subcommands plus `fallback`).
reference:
  directory: ../publish_from_pdd_structural

initial_prompt: |
  Our Retail Account Onboarding process is approved. Its PDD is
  `pdd-retail-account-onboarding.md` and its process map is
  `process-map-retail-account-onboarding.bpmn`, both in this folder. Publish the
  process to UiPath Automation Hub as a business process and attach both
  documents.

  The PDD is the only source for what the process is and which systems it uses.

  Important:
  - The `uip` CLI is already available and authenticated; it is backed by a local
    test harness. Do NOT run `uip login` and do NOT handle a token yourself.
  - Do NOT inspect `mocks/` directly.
  - Do NOT call AskUserQuestion — it is not available in this harness. Treat the
    payload preview as approved and keep going.

  Before starting, load the uipath-automationhub skill and follow its workflow.

success_criteria:
  - type: skill_triggered
    description: "Agent activated the uipath-automationhub skill"
    skill_name: "uipath-automationhub"
    expected_skill: "uipath-automationhub"
    weight: 1.5
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent NEVER sent the admin-token header x-ah-openapi-auth (would 401 a cloud token)"
    tool_name: "Bash"
    command_pattern: '(?i)x-ah-openapi-auth'
    weight: 3.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent NEVER sent the admin app-key header x-ah-openapi-app-key (401s a cloud token exactly like x-ah-openapi-auth)"
    tool_name: "Bash"
    command_pattern: '(?i)x-ah-openapi-app-key'
    weight: 3.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent stayed on the CLI transport — no hand-built Authorization header and no raw HTTP to Automation Hub"
    tool_name: "Bash"
    command_pattern: '(?i)(authorization["'']?\s*[:=]|\b(curl|wget|invoke-restmethod|invoke-webrequest)\b[^\n]*automationhub_)'
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "Exactly one automations create --from-schema, on the Business Process idea flow (the 403 never stops or re-runs the publish)"
    command: "python3 $REFERENCE_DIR/check_publish.py create-once"
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "Submitted answers resolve every required field: PDD process name and description, an active onboarding category, the auth-info email as owner and submitter, documentation codes verbatim from the schema enum, no template placeholders"
    command: "python3 $REFERENCE_DIR/check_publish.py payload"
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  # The scenario under test (RPANAV-19120): attempt the admin upsert once, take the
  # 403, publish anyway with what the inventory has, and say what was left out.
  - type: run_command
    description: "403 FALLBACK — admin applications upsert attempted before the create and never retried after the 403; the create carries the two inventory ids only (no new_applications, no decoy or out-of-scope substitute) and the description names Trapets, Scrive and Temenos T24 as not in the inventory"
    command: "python3 $REFERENCE_DIR/check_publish.py fallback"
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "PDD (type 1) and the laid-out process map (type 6, or 9) each uploaded once to the created process, byte-identical to the staged files"
    command: "python3 $REFERENCE_DIR/check_publish.py documents"
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "Owner lookup, if any, is server-side and does not assume the active-only filter: every users list carries --search and --invite-status all (RPANAV-19110)"
    command: "python3 $REFERENCE_DIR/check_publish.py users"
    timeout: 30
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "Agent read the attachments and the record back after the create (documents list + automations get)"
    command: "python3 $REFERENCE_DIR/check_publish.py verify"
    timeout: 30
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent did not read the mocked tenant data directly instead of through the CLI"
    tool_name: "Bash"
    command_pattern: '(cat|less|head|tail|grep|jq|python3?)\s+[\s\S]*mocks/(responses|\.calls)'
    weight: 1.0
    pass_threshold: 1.0
