task_id: skill-ah-publish-studio-web-link-smoke
description: >
  Smoke test: Step 6b, linking a Studio Web solution to the published process.
  The caller supplies the designer URL and does NOT say whether the solution
  has a `.bpmn`. The skill's rule is never invent, guess or search for a
  solution id or URL — no discovery API exists on this path — and omit
  `hasProcessMap` when the caller doesn't know. The calls reach the live alpha
  tenant the CI login targets, through the call recorder; the solution is a
  placeholder, and AH's Studio Web notification for it fails in the background
  without failing the save. post_run archives exactly the process ids this run's
  creates returned. Grades COMMAND SHAPE plus the answers file: the agent
  publishes over the CLI, carries the caller's URL through verbatim, and never
  fabricates a solution id or a hasProcessMap value. Nothing else covers Step 6b.
tags: [uipath-automationhub, smoke, mode:build, lifecycle:setup]

run_limits:
  expected_turns: 14

sandbox:
  template_sources:
    - type: template_dir
      path: _shared/live_template
    - type: template_dir
      path: _setup
      mount_point: _setup
  mock_path_dirs:
    - .uip-recorder

# A tenant outage or revoked login fails here as TENANT NOT READY, which the smoke
# gate leaves out of the pass rate, instead of being scored against the skill.
pre_run:
  - command: "python3 _setup/preflight_ah.py"
    timeout: 300

initial_prompt: |
  Publish the approved business process below to UiPath Automation Hub using
  the `uipath-automationhub` skill, and link it to its Studio Web solution.

    Process name:  "Order Intake (smoke)"
    Description:   Intake and triage inbound orders.
    Systems used:  Excel
    Studio Web solution URL:
      https://alpha.uipath.com/smokeorg/studio_/designer/proj-smoke-0001?solutionId=sol-smoke-0001
    Solution name: "Order Intake Solution"

  I do not know whether that solution's orchestration project contains a
  `.bpmn` file.

  The `uip` CLI is already available and authenticated against the target
  tenant. Do NOT run `uip login` and do NOT handle a token yourself.

  Write the filled answers to `./ah-answers.json` before creating the process.

  Important:
  - Walk through the skill's full publish sequence in order. If the create is
    rejected, fix the payload and retry it once, as the skill says; never re-run
    a create that succeeded.
  - Do NOT prompt the user for confirmation — this is an automated test.
  - Use the solution URL exactly as given. Do NOT search for, guess or invent a
    solution id, project id or URL, and do NOT guess the hasProcessMap value.
  - NEVER send the `x-ah-openapi-auth` or `x-ah-openapi-app-key` header — this
    skill authenticates with the user's cloud session, not an admin OpenAPI token.

success_criteria:
  - type: skill_triggered
    description: "Agent activated the uipath-automationhub skill"
    skill_name: "uipath-automationhub"
    expected_skill: "uipath-automationhub"
    weight: 3.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent created the process over the CLI (uip ah automations create --from-schema …)"
    tool_name: "Bash"
    command_pattern: '(?i)uip ah automations create[^\n]*--from-schema'
    min_count: 1
    weight: 3.0
    pass_threshold: 1.0

  # The id lands in the answers document, not on a command line — grade the
  # file, not Bash.
  - type: file_contains
    description: "Agent carried the caller's solution id through verbatim into the answers"
    path: "ah-answers.json"
    includes:
      - 'sol-smoke-0001'
    weight: 2.0
    pass_threshold: 1.0

  # No discovery API exists for Studio Web solutions on this path, so any
  # attempt to look one up is the agent inventing a capability.
  - type: command_not_executed
    description: "Agent did NOT try to discover a solution (no invented solutions/projects lookup)"
    tool_name: "Bash"
    command_pattern: '(?i)uip (ah )?(solutions|studio|projects) '
    weight: 2.0
    pass_threshold: 1.0

  # The caller said they don't know, so emitting either boolean is a guess.
  # No file-absence criterion type exists, so assert it over the whole file.
  - type: file_matches_regex
    description: "Agent did NOT guess hasProcessMap when the caller said they did not know"
    path: "ah-answers.json"
    pattern: '(?s)\A(?!.*hasProcessMap).*\Z'
    weight: 2.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent fetched the schema before answering it (uip ah automations schema)"
    tool_name: "Bash"
    command_pattern: '(?i)uip ah automations schema'
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent NEVER sent the admin-token header x-ah-openapi-auth (would 401 a cloud token)"
    tool_name: "Bash"
    command_pattern: '(?i)x-ah-openapi-auth'
    weight: 3.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent NEVER sent the admin app-key header x-ah-openapi-app-key"
    tool_name: "Bash"
    command_pattern: '(?i)x-ah-openapi-app-key'
    weight: 2.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "CLI transport means no hand-built auth: agent never constructed an Authorization header"
    tool_name: "Bash"
    command_pattern: '(?i)Authorization:\s*Bearer'
    weight: 1.0
    pass_threshold: 1.0

post_run:
  - command: 'python3 _setup/cleanup_ah.py --created'
    timeout: 300
