task_id: skill-ah-publish-process-smoke
description: >
  Smoke test: agent uses the uipath-automationhub skill to publish a
  business process (and a PDD document) to Automation Hub. The eval image
  ships an `ah`-capable `uip`, so the skill's Step-0 preflight must route to
  the CLI flows. The calls reach the live alpha tenant the CI login targets,
  and post_run archives the process by its fixed name. The test grades the
  COMMAND SHAPE; the content of a publish is graded by
  publish_from_pdd_structural. The skill must (1) activate, (2) take the CLI transport (`uip ah …`
  — auth is the CLI's job; the agent never handles a token), (3) walk the
  publish sequence — `idea-flows list` → `automations create --from-schema` →
  `documents create` — and (4) NEVER send the admin-token header
  `x-ah-openapi-auth` (the single most important rule on the API path, and a
  header the CLI path never needs to construct at all).
tags: [uipath-automationhub, smoke, mode:build, lifecycle:setup]

run_limits:
  expected_turns: 10

sandbox:
  template_sources:
    - type: template_dir
      path: _setup
      mount_point: _setup

initial_prompt: |
  Publish the approved business process below to UiPath Automation Hub using
  the `uipath-automationhub` skill, and attach its PDD document.

    Process name: "Invoice Reconciliation (smoke)"
    Description:  Reconcile supplier invoices against POs.
    Systems used: Excel
    PDD:          name "PDD", link https://example.invalid/pdd

  The `uip` CLI is already available and authenticated against the target
  tenant. Do NOT run `uip login` and do NOT handle a token yourself.

  Important:
  - Walk through the skill's full publish sequence and issue each command once,
    in order. Do NOT retry a failed command.
  - Do NOT prompt the user for confirmation — this is an automated test.
  - NEVER send the `x-ah-openapi-auth` or `x-ah-openapi-app-key` header — this
    skill authenticates with the user's cloud session, not an admin OpenAPI token.

success_criteria:
  - type: skill_triggered
    description: "Agent activated the uipath-automationhub skill"
    skill_name: "uipath-automationhub"
    expected_skill: "uipath-automationhub"
    weight: 3.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent NEVER sent the admin-token header x-ah-openapi-auth (would 401 a cloud token)"
    tool_name: "Bash"
    command_pattern: '(?i)x-ah-openapi-auth'
    weight: 3.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent NEVER sent the admin app-key header x-ah-openapi-app-key"
    tool_name: "Bash"
    command_pattern: '(?i)x-ah-openapi-app-key'
    weight: 2.0
    pass_threshold: 1.0

  # The eval image's uip has the ah surface, so the preflight must land on the
  # CLI transport — every AH operation is a `uip ah …` command, and the agent
  # never constructs auth headers itself.
  - type: command_executed
    description: "Agent took the CLI transport (ran uip ah commands)"
    tool_name: "Bash"
    command_pattern: '(?i)uip ah '
    min_count: 1
    weight: 2.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent ran the Step-0 preflight that selects the transport (uip ah --help)"
    tool_name: "Bash"
    command_pattern: '(?i)uip ah --help'
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent started with the connectivity/flows call (uip ah idea-flows list)"
    tool_name: "Bash"
    command_pattern: '(?i)uip ah idea-flows list'
    min_count: 1
    weight: 2.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent created via the schema path (uip ah automations create --from-schema …)"
    tool_name: "Bash"
    command_pattern: '(?i)uip ah automations create[^\n]*--from-schema'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent attached the document (uip ah documents create …)"
    tool_name: "Bash"
    command_pattern: '(?i)uip ah documents create'
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "CLI transport means no hand-built auth: agent never constructed an Authorization header"
    tool_name: "Bash"
    command_pattern: '(?i)Authorization:\s*Bearer'
    weight: 1.0
    pass_threshold: 1.0

post_run:
  - command: 'python3 _setup/cleanup_ah.py --name "Invoice Reconciliation (smoke)"'
    timeout: 300
