task_id: skill-ah-publish-from-pdd-structural
description: >
  STRUCTURAL PUBLISH — the Cartographer -> Automation Hub hand-off, graded on what
  the agent actually submits. A fictional, reduced PDD (Retail Account Onboarding)
  and its laid-out BPMN process map are staged in the sandbox, and `uip` is a
  mocked Automation Hub tenant: a Business Process idea flow, a schema that
  requires "Applications used" and offers `new_applications`, an inventory with
  two of the PDD's five systems plus decoys (including the PDD's explicitly
  out-of-scope Avaloq), and an archived category beside the active ones. The mock
  snapshots every `--file` at call time, and a checker grades the submitted
  answers: one create, the auth-info identity as owner/submitter, an active
  category, verbatim enum codes, applications matching the PDD's systems exactly,
  both documents uploaded byte-identical with the right type ids, and a
  post-create read-back. It sits between the command-shape smoke tests and a live
  e2e publish — no tenant, deterministic, judge-free.
tags: [uipath-automationhub, integration, mode:build, lifecycle:setup]

run_limits:
  expected_turns: 20
  max_turns: 40

sandbox:
  template_sources:
    - type: template_dir
      path: ../_shared/mock_template
    - type: template_dir
      path: fixtures
  mock_path_dirs:
    - mocks

reference:
  directory: .

initial_prompt: |
  Our Retail Account Onboarding process is approved. Its PDD is
  `pdd-retail-account-onboarding.md` and its process map is
  `process-map-retail-account-onboarding.bpmn`, both in this folder. Publish the
  process to UiPath Automation Hub as a business process and attach both
  documents.

  The PDD is the only source for what the process is and which systems it uses.

  Important:
  - The `uip` CLI is already available and authenticated; it is backed by a local
    test harness. Do NOT run `uip login` and do NOT handle a token yourself.
  - Do NOT inspect `mocks/` directly.
  - Do NOT call AskUserQuestion — it is not available in this harness. Treat the
    payload preview as approved and keep going.

  Before starting, load the uipath-automationhub skill and follow its workflow.

success_criteria:
  - type: skill_triggered
    description: "Agent activated the uipath-automationhub skill"
    skill_name: "uipath-automationhub"
    expected_skill: "uipath-automationhub"
    weight: 1.5
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent NEVER sent the admin-token header x-ah-openapi-auth (would 401 a cloud token)"
    tool_name: "Bash"
    command_pattern: '(?i)x-ah-openapi-auth'
    weight: 3.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent NEVER sent the admin app-key header x-ah-openapi-app-key"
    tool_name: "Bash"
    command_pattern: '(?i)x-ah-openapi-app-key'
    weight: 2.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent stayed on the CLI transport — no hand-built Authorization header and no raw HTTP to Automation Hub"
    tool_name: "Bash"
    command_pattern: '(?i)(authorization:\s*bearer|\b(curl|wget|invoke-restmethod|invoke-webrequest)\b[^\n]*automationhub_)'
    weight: 2.0
    pass_threshold: 1.0

  # The schema offers new_applications, so missing systems go in the answer. The
  # admin upsert needs MANAGE_APP_INVENTORY (the mock 403s it) and must not be
  # reached for here — applications never block the publish.
  - type: command_not_executed
    description: "Agent added missing systems through new_applications, not the admin applications upsert"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+ah\s+applications\s+update\b(?![^\n]*--help)'
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "Exactly one automations create --from-schema, on the Business Process idea flow (a success is never re-run)"
    command: "python3 $REFERENCE_DIR/check_publish.py create-once"
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "Submitted answers resolve every required field: PDD process name and description, an active onboarding category (not the template's 1 or the archived 4), the auth-info email as direct-string owner and submitter, documentation codes verbatim from the schema enum, no template placeholders"
    command: "python3 $REFERENCE_DIR/check_publish.py payload"
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "Applications match the PDD exactly: inventory ids for Dynamics 365 + Signicat, Trapets / Scrive / Temenos T24 as new_applications, no decoys, no out-of-scope Avaloq, no thin apps"
    command: "python3 $REFERENCE_DIR/check_publish.py applications"
    timeout: 30
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0

  - type: run_command
    description: "PDD (type 1) and the laid-out process map (type 6, or 9) each uploaded once to the created process, byte-identical to the staged files"
    command: "python3 $REFERENCE_DIR/check_publish.py documents"
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "Agent read the attachments and the record back after the create (documents list + automations get)"
    command: "python3 $REFERENCE_DIR/check_publish.py verify"
    timeout: 30
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent did not read the mocked tenant data directly instead of through the CLI"
    tool_name: "Bash"
    command_pattern: '(cat|less|head|tail|grep|jq|python3?)\s+[\s\S]*mocks/(responses|\.calls)'
    weight: 1.0
    pass_threshold: 1.0
