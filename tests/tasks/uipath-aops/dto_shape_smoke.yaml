task_id: skill-aops-dto-shape-smoke
description: >
  Skill-guided evaluation: agent uses the uipath-aops skill to compose a
  PipelineDto JSON file with the correct field shape — the provider-native
  RemoteId on `repositoryId`, `repositoryType: "git"`, empty `projectName`,
  and camelCase keys (CLI stdout is PascalCased; input files are not).
  Verifies the field-source rules don't get silently violated.

  Platform note: this task provides the identifiers directly so no discovery
  calls are needed. What matters is the JSON shape the agent writes.
tags: [uipath-aops, smoke, mode:build]

sandbox:
  driver: tempdir
  python: {}

initial_prompt: |
  Write a PipelineDto JSON file at `./pipeline.json` for a new CICD pipeline.

  Inputs (already discovered, shown as the CLI printed them):
  - Pipeline name: my-pipeline
  - Connection Identifier: 24efc94e-ffd6-43a7-56ae-08de956e94fd
  - Repository Identifier (SourceControl UUID): ffcefc70-dcfe-4bbb-89f5-08de956e99e9
  - Repository RemoteId (provider-native id): 1063142941
  - Repository CloneUrl: https://github.com/sc-test-org/Dummy-Studio-Project.git
  - Repository Name: Dummy-Studio-Project
  - Repository DefaultBranch: main
  - Project path: project.json
  - Published process ProcessId: 5421a94a-ab67-4ac0-b181-03e9983cdb06

  Use the uipath-aops skill workflow to decide which input maps to which
  PipelineDto field, and which key casing the file must use.

  Important:
  - You do NOT need to call `uip aops pipeline create` — just write the
    JSON file at the path above.
  - Do NOT prompt the user for confirmation — this is an automated test.

success_criteria:
  - type: file_exists
    description: "Pipeline DTO JSON was written at the expected path"
    path: "pipeline.json"
    weight: 1.5
    pass_threshold: 1.0

  - type: file_contains
    description: "DTO uses repositoryType: git"
    path: "pipeline.json"
    includes:
      - '"repositoryType": "git"'
    weight: 1.5
    pass_threshold: 1.0

  - type: file_contains
    description: "DTO uses the provider-native RemoteId for repositoryId"
    path: "pipeline.json"
    includes:
      - '"repositoryId": "1063142941"'
    weight: 2.0
    pass_threshold: 1.0

  - type: file_contains
    description: "DTO has empty projectName"
    path: "pipeline.json"
    includes:
      - '"projectName": ""'
    weight: 1.5
    pass_threshold: 1.0

  - type: file_contains
    description: "DTO carries the correct branch and processIdentifier"
    path: "pipeline.json"
    includes:
      - '"branch": "main"'
      - '"processIdentifier": "5421a94a-ab67-4ac0-b181-03e9983cdb06"'
    weight: 1.5
    pass_threshold: 1.0

  - type: file_contains
    description: "DTO uses camelCase input keys, not the PascalCase of CLI output"
    path: "pipeline.json"
    excludes:
      - '"RepositoryId"'
      - '"RepositoryType"'
      - '"ProjectName"'
      - '"ProcessIdentifier"'
      - '"Branch"'
      - '"ConnectionIdentifier"'
    weight: 2.0
    pass_threshold: 1.0

  - type: file_contains
    description: "DTO omits server-assigned fields"
    path: "pipeline.json"
    excludes:
      - '"latestPipelineExecution"'
    weight: 1.0
    pass_threshold: 1.0
