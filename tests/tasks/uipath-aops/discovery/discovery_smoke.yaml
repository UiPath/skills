task_id: skill-aops-discovery-smoke
description: >
  Skill-guided evaluation: agent uses the uipath-aops skill to discover the
  inputs needed to create a CICD pipeline — SourceControl connection, source
  (solutions or standalone projects), repositories, and available published
  Orchestrator processes. Tests that the skill teaches the current CLI
  namespace (`uip aops`, not the retired `uip sc` / `uip cicd`) and the
  `--output json` convention.

  Platform note: runs without an authenticated tenant — commands will fail
  with auth errors. That is acceptable; what matters is correct command
  invocation with correct flags.
tags: [uipath-aops, smoke, mode:build, lifecycle:discover]


initial_prompt: |
  I want to create a CICD pipeline that targets the "DummyPipeline"
  published process on my StudioAdmin tenant. First, discover what's
  available — connections, solutions / projects, repositories, and
  processes.

  Important:
  - The `uip` CLI is available but the AOps subcommands may not be
    installed and/or the CLI is not connected to a live tenant.
    Commands WILL fail — that is expected and acceptable.
    Run each command exactly once regardless of errors.
    Do NOT retry, do NOT attempt to login, do NOT try to install tools,
    do NOT troubleshoot errors.
  - Do NOT prompt the user for confirmation — this is an automated test.

success_criteria:
  - type: command_executed
    description: "Agent listed SourceControl connections via uip aops"
    tool_name: "Bash"
    command_pattern: 'uip\s+aops\s+connection\s+list\s+.*--output\s+json'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent listed solutions or standalone projects on the connection"
    tool_name: "Bash"
    command_pattern: 'uip\s+aops\s+connection\s+(solutions|projects)\s+'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent listed repositories on the connection (needed to recover RemoteId)"
    tool_name: "Bash"
    command_pattern: 'uip\s+aops\s+connection\s+repos\s+'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent listed published Orchestrator processes"
    tool_name: "Bash"
    command_pattern: 'uip\s+aops\s+pipeline\s+processes\s+.*--output\s+json'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent must not fall back to the retired `uip sc` tool"
    tool_name: "Bash"
    command_pattern: 'uip\s+sc\s+'
    weight: 2.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent must not fall back to the retired `uip cicd` tool"
    tool_name: "Bash"
    command_pattern: 'uip\s+cicd\s+'
    weight: 2.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent consistently used --output json across uip aops calls"
    tool_name: "Bash"
    command_pattern: 'uip\s+aops\s+.*--output\s+json'
    min_count: 3
    weight: 1.0
    pass_threshold: 1.0
