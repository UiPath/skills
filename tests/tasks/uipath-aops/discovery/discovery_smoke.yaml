task_id: skill-aops-discovery-smoke
description: >
  Skill-guided evaluation: agent uses the uipath-aops skill to survey what a
  StudioAdmin tenant exposes — SourceControl connections and the published
  Orchestrator processes a pipeline can bind to. Tests that the skill teaches
  the current CLI namespace (`uip aops`, not the retired `uip sc` /
  `uip cicd`) and the `--output json` convention.

  Platform note: the smoke tenant has no SourceControl connection provisioned,
  so `connection list` answers `Data: []`. Everything downstream of a
  connection — `connection solutions`, `connection projects`,
  `connection repos`, `repo project-files` — needs a connection identifier
  that does not exist here, so this task deliberately asserts only the
  tenant-independent entry points. The connection-scoped half of the discovery
  flow needs an integration task against a seeded tenant; it is not covered
  by smoke.
tags: [uipath-aops, smoke, mode:build, lifecycle:discover]


initial_prompt: |
  I want to create a CICD pipeline on my StudioAdmin tenant. Before I pick
  anything, show me what the tenant exposes: which SourceControl connections
  exist, which pipelines are already defined, and which published processes a
  pipeline could bind to.

  Important:
  - The `uip` CLI may not be connected to a live tenant, and the tenant may
    have nothing provisioned. Commands can fail or return empty — that is
    expected and acceptable. Report what you find, including "none", and
    move on. Do NOT retry, do NOT attempt to login, do NOT try to install
    tools, do NOT troubleshoot errors.
  - Do NOT prompt the user for confirmation — this is an automated test.

success_criteria:
  - type: command_executed
    description: "Agent listed SourceControl connections via uip aops"
    tool_name: "Bash"
    command_pattern: 'uip\s+aops\s+connection\s+list\s+.*--output\s+json'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent listed the pipelines already defined in the runtime environment"
    tool_name: "Bash"
    command_pattern: 'uip\s+aops\s+pipeline\s+list\s+.*--output\s+json'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent listed published Orchestrator processes"
    tool_name: "Bash"
    command_pattern: 'uip\s+aops\s+pipeline\s+processes\s+.*--output\s+json'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent must not drive discovery through the retired `uip sc` tool"
    tool_name: "Bash"
    command_pattern: 'uip\s+sc\s+(connection|repo|project|solution)\b'
    weight: 2.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent must not drive discovery through the retired `uip cicd` tool"
    tool_name: "Bash"
    command_pattern: 'uip\s+cicd\s+(pipeline|execution)\b'
    weight: 2.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent consistently used --output json across uip aops calls"
    tool_name: "Bash"
    command_pattern: 'uip\s+aops\s+.*--output\s+json'
    min_count: 3
    weight: 1.0
    pass_threshold: 1.0
