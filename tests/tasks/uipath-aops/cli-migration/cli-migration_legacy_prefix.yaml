task_id: skill-aops-legacy-prefix-guard-smoke
description: >
  Migration guard — the user asks in the retired vocabulary (`uip sc`,
  `uip cicd`). `@uipath/sc-tool` and `@uipath/cicd-tool` were unified into
  `@uipath/aops-tool`, and `@uipath/cicd-tool` no longer exists on npm, so
  copying the user's wording verbatim produces commands that cannot work. The
  skill must translate to `uip aops` and still answer the question that was
  asked.

  The negative guards match a retired prefix followed by a real subject
  (`uip sc connection`, `uip cicd pipeline`) rather than any occurrence of the
  prefix: probing `uip sc --help` to confirm the tool is gone is legitimate
  diagnosis, whereas trying to do the work through it is the regression.

  Platform note: the tenant may be empty or unreachable, so the listings can
  come back empty or fail. What matters is which namespace the agent drives.
tags: [uipath-aops, smoke, mode:build, lifecycle:discover]


initial_prompt: |
  Use `uip sc` to list my StudioAdmin SourceControl connections, then use
  `uip cicd` to list the pipelines in my runtime environment. I need both
  listings — if a command name I gave you is wrong, work out the right one
  and get me the listings anyway.

  Important:
  - The `uip` CLI may not be connected to a live tenant, and the tenant may
    have nothing provisioned. Commands can fail or return empty — that is
    expected and acceptable. Report what you find, including "none".
    Do NOT retry and do NOT troubleshoot errors.
  - Do NOT prompt the user for confirmation — this is an automated test.

success_criteria:
  - type: command_executed
    description: "Agent listed connections under the current `uip aops` namespace"
    tool_name: "Bash"
    command_pattern: 'uip\s+aops\s+connection\s+list\s+.*--output\s+json'
    min_count: 1
    weight: 3.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent listed pipelines under the current `uip aops` namespace"
    tool_name: "Bash"
    command_pattern: 'uip\s+aops\s+pipeline\s+list\s+.*--output\s+json'
    min_count: 1
    weight: 3.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent must not do the work through the retired `uip sc` tool"
    tool_name: "Bash"
    command_pattern: 'uip\s+sc\s+(connection|repo|project|solution)\b'
    weight: 3.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent must not do the work through the retired `uip cicd` tool"
    tool_name: "Bash"
    command_pattern: 'uip\s+cicd\s+(pipeline|execution)\b'
    weight: 3.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent must not try to install the retired sc-tool or cicd-tool packages"
    tool_name: "Bash"
    command_pattern: 'uip\s+tools\s+install\s+.*@uipath/(sc|cicd)-tool'
    weight: 2.0
    pass_threshold: 1.0
