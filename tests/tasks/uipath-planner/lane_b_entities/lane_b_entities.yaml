task_id: skill-planner-lane-b-entities
description: >
  Lane B (non-PDD, no Cartographer): a document-less request to build a Maestro Flow that approves
  club expenses, where the request itself says the three record types are to be kept in Data Fabric
  and names their fields. The planner must detect the business records, treat them as Native
  entities this solution owns, and write a plan with one `platform:<Solution>:entity:<Entity>` task
  per entity (complete create body), one `solution:…:resources:Entity:<Entity>` task per entity, and
  an `Entities:` binding row with the right read/write direction on the flow task (Goal 1 plan v10,
  Phase N1 — Lane B half). Nothing is created and nothing is built.
tags: [uipath-planner, integration, mode:build, lifecycle:generate, data-fabric, lane-b]

run_limits:
  expected_turns: 20
  task_timeout: 2400
  turn_timeout: 2000

reference:
  directory: .

initial_prompt: |
  I want to build a UiPath Maestro Flow from scratch — I have NO design document and no process
  write-up. The flow approves student-club expenses: when a new expense is recorded, look up the
  member who submitted it and the budget line it draws on, approve it when the cost fits the
  remaining budget and the member holds a position, and write the decision back on the expense.

  The club keeps these records in UiPath Data Fabric; nothing exists yet, the solution creates them:
  - Member: member_id, first_name, last_name, email, position
  - Budget: budget_id, category, amount, spent, remaining
  - Expense: expense_id, expense_description, expense_date, cost, approved, link_to_member
    (→ Member.member_id), link_to_budget (→ Budget.budget_id)
  Amounts are decimals; everything else is text; approved is a yes/no. Solution name
  ExpenseApproval, folder Shared.

  Load the appropriate UiPath skill. Work autonomously — don't ask me questions — and do not
  create, scaffold or build anything yet. Produce the implementation plan only, routed to the
  right specialist skills, and save it as `expense-approval-plan.md` in the current directory.

success_criteria:
  - type: skill_triggered
    description: "Agent engaged the uipath-planner skill"
    skill_name: "uipath-planner"
    expected_skill: "uipath-planner"
    weight: 2.0
    pass_threshold: 1.0

  - type: file_exists
    description: "Lane B wrote the plan file"
    path: "expense-approval-plan.md"
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "Plan scored against the golden: entity tasks, fields, types, relationships, bindings, order"
    command: python3 "$REFERENCE_DIR/../sdd_to_tasks_entities/check_tasks_entities.py" --golden "$REFERENCE_DIR/golden.json" --tasks expense-approval-plan.md
    score_from_stdout: true
    timeout: 60
    weight: 4.0
    pass_threshold: 0.6

  - type: command_executed
    description: "Agent must NOT create, update or delete entities"
    tool_name: "Bash"
    command_pattern: 'uip\b[^\n|;&]*?\bdf\s+entities\s+(create|update|delete)\b(?![^\n|;&]*--help)'
    min_count: 0
    max_count: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent must NOT write to a solution"
    tool_name: "Bash"
    command_pattern: 'uip\b[^\n|;&]*?\bsolution\s+(init|projects|resources|pack|publish|deploy|upload)\b(?![^\n|;&]*--help)'
    min_count: 0
    max_count: 0
    weight: 1.0
    pass_threshold: 1.0
