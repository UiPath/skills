task_id: skill-planner-vocab-to-tasks-entities
description: >
  Lane B (non-PDD) with a user-passed compiled entity spec: a document-less request names the student
  club's record types only in business words and points the planner at `vocabulary/entities.json`
  (create bodies compiled by code from the source schema). The planner must carry each body into one
  entity task as given per data-vocabulary-guide.md, order the tasks by the spec's relationships, add the
  solution resource tasks and the `Entities:` binding on the flow task. Scored by
  sdd_to_tasks_entities/check_tasks_entities.py. Oracle by construction for the bodies (spec and golden
  share the BIRD source schema); it measures carrying, ordering and binding. Nothing is created.
tags: [uipath-planner, integration, mode:build, lifecycle:generate, data-fabric, lane-b, vocabulary]

run_limits:
  expected_turns: 25
  task_timeout: 2700
  turn_timeout: 2400

sandbox:
  template_sources:
    - type: template_dir
      path: fixtures

# the checker lives in a sibling eval; the planner tests dir is the reference root
reference:
  directory: ..

initial_prompt: |
  I want to build a UiPath Maestro Flow from scratch — no design document. The flow approves
  student-club expenses: when a new expense is recorded, look up the member who submitted it and the
  budget line it draws on, approve it when the cost fits the remaining budget and the member holds a
  position, and write the decision back on the expense.

  The club keeps all of its records in UiPath Data Fabric and nothing exists yet — the solution creates
  them: events, majors, zip codes, attendance, budgets, expenses, income and members. The records and the
  flow are separate deliverables; the records have to exist before the flow can bind to them. Solution
  name StudentClubExpenses, folder Shared.

  Use the compiled entity spec at `./vocabulary/entities.json` for how each record is defined.

  Load the appropriate UiPath skill. Work autonomously — don't ask me questions — and do not create,
  scaffold or build anything yet. Produce the implementation plan only, routed to the right specialist
  skills, and save it as `student-club-plan.md` in the current directory.

success_criteria:
  - type: skill_triggered
    description: "Agent engaged the uipath-planner skill"
    skill_name: "uipath-planner"
    expected_skill: "uipath-planner"
    weight: 2.0
    pass_threshold: 1.0

  - type: file_exists
    description: "Lane B wrote the plan file"
    path: "student-club-plan.md"
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "Plan scored against the golden: entity tasks, fields, types, relationships, bindings, order"
    command: python3 "$REFERENCE_DIR/sdd_to_tasks_entities/check_tasks_entities.py" --golden "$REFERENCE_DIR/vocab_to_tasks_entities/golden.json" --tasks student-club-plan.md
    score_from_stdout: true
    timeout: 60
    weight: 4.0
    pass_threshold: 0.6

  - type: command_executed
    description: "Agent must NOT create, update or delete entities"
    tool_name: "Bash"
    command_pattern: 'uip\b[^\n|;&]*?\bdf\s+entities\s+(create|update|delete)\b(?![^\n|;&]*--help)'
    min_count: 0
    max_count: 0
    weight: 2.0
    pass_threshold: 1.0
