task_id: skill-case-phase-0-finalize-draft
description: >
  CASE DRAFT FINALIZATION ONLY (planner Case Design Lane) — a complete CandidateInterview interview draft
  (sdd.draft.md) is staged into the sandbox; the planner's Case Design Lane resumes from the
  draft, runs the Finalization checks, and renames it to an approved sdd.md. Decoupled from the
  interview (covered by candidate_interview) so the heavy finalization step runs
  in one bounded turn. Grades mechanical validity of the produced sdd.md
  (sdd_check: variable lineage, per-gate rule legality, task types, entry/exit
  conditions, interrupting semantics) plus domain coherence.
  Also verifies that unresolved runnable resources retain concrete portable names
  in both their task blocks and the Section 4 integration rollup.
tags:
  - uipath-planner
  - integration
  - lifecycle:generate
  - mode:build
  - shape:multi-node
  - resource
  - feature:approval-gate
  - feature:conversational
  - feature:registry

# Budget is set from the staged fixture, not from the sibling default. The
# passing reference is case_finalize_draft_picker: a 7 KB draft finalized in
# 6m06s (366s) under a 1500s wall. This task stages a 53 KB draft — 7.5x that
# fixture — and the criteria require the complete ordered inventory, so the
# render cannot be shortened. Linear scaling of the reference is ~2741s, i.e.
# above the old 2400s turn wall, and run 2026-08-31_04-15-47 duly ERRORed at it
# with zero criteria graded (the loan variant had already written a passing
# sdd.md when the wall fired). turn_timeout is the binding wall for a
# single-user-turn task, so it must clear the work and task_timeout must clear
# turn_timeout. If a run still hits this wall, the cause is the doc/validator
# hunting seen in that run, not the budget — raise it no further.
run_limits:
  task_timeout: 4200
  max_turns: 150
  turn_timeout: 3600

# Stage the ready-made interview draft into the sandbox root as sdd.draft.md.
# The planner's draft-finalization path (sdd.draft.md present, no sdd.md) picks it up.
sandbox:
  template_sources:
    - type: template_dir
      path: fixtures

initial_prompt: |
  I have a draft design document for our CandidateInterview case-management
  solution — it's saved as `sdd.draft.md` in this folder. Please finalize it into
  the final design document.

  Work from what's there; the design is settled, so don't redo it or re-interview
  me. The connector IDs and the two agent resource identities in the draft are
  unresolved on purpose — leave them that way and preserve the agents' concrete
  intended resource names. I just need the finalized design for now, nothing
  built yet.

  This is a Maestro case-management SDD finalization. Keep it inside the Case
  Management SDD template shape; finalize the draft into `sdd.md` in this
  folder. Use the direct draft-finalization fast path: read the draft and the
  case SDD template, write the finalized `sdd.md`, and do not spawn subagents,
  run tenant discovery, or derive implementation tasks.

success_criteria:
  - type: file_exists
    description: "sdd.draft.md is still in place — finalization renders beside the draft, never consumes it"
    path: "sdd.draft.md"
    weight: 1.0
    pass_threshold: 1.0

  - type: file_exists
    description: "Finalization produced the approved sdd.md"
    path: "sdd.md"
    weight: 1.5
    pass_threshold: 1.0

  - type: file_exists
    description: "sdd.draft.md is still in place — finalization renders beside the draft, never consumes it"
    path: "sdd.draft.md"
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "sdd.md is mechanically sound: variable mappings + lineage, per-gate rule legality, task types, entry/completion/exit conditions"
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-planner/_shared/sdd_check.py"
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "Unresolved agent tasks preserve concrete names in Section 2 and Section 4 while folder and identity remain unresolved"
    command: "python3 $TASK_DIR/check_resource_name_contract.py"
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "sdd.md preserves the engineering-role / L4+ Onsite-Loop gating rule"
    command: "python3 $TASK_DIR/check_finalize_inventory.py"
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "sdd.md preserves all 3 exception lanes"
    command: "grep -Eiq 'rejected' sdd.md && grep -Eiq 'withdrawn' sdd.md && grep -Eiq 'on hold' sdd.md"
    timeout: 10
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "finalized sdd.md preserves all 7 primary stages (none dropped at finalization)"
    command: "[ \"$(grep -cE '^#+ +Stage [0-9]' sdd.md)\" -ge 7 ]"
    timeout: 10
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "stopped at the finalized sdd.md — did not run ahead into a caseplan build"
    command: "! find . -name caseplan.json -not -path '*/.venv/*' | grep -q ."
    timeout: 10
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: llm_judge
    description: "Finalized sdd.md is domain-coherent for the candidate-interview process"
    files:
      - sdd.md
      - sdd.draft.md
    max_file_chars: 150000
    include_agent_output: false
    prompt: |
      You are reviewing a finalized Solution Design Document (the attached
      sdd.md) for a CANDIDATE-INTERVIEW (hiring) case. A separate mechanical check
      already verifies variable mappings, lineage, per-gate rule legality, task
      types, and entry/exit conditions — focus on DOMAIN COHERENCE.

      SCOPE — this is a FINALIZATION, not a design. The staged `sdd.draft.md` is
      attached alongside the final and is AUTHORITATIVE: the requester said the
      design is settled and the agent is forbidden to redesign it, and a separate
      criterion requires the draft's ordered stage/task inventory preserved
      verbatim. So attribute every flaw before you score it:
      - a flaw already present in `sdd.draft.md` and carried faithfully across is
        NOT a finalization defect — do not deduct for it, even where it is a real
        design weakness (business sequencing, task order within a stage, lane
        triggers, a route the draft never modeled);
      - deduct only for what finalization introduced or failed to do: content
        dropped, renamed, merged or invented; a broken render or summary section;
        or a mechanically required rule pairing it should have supplied.
      Say which of the two you are scoring in your rationale.

      Judge, within that scope:
      - Stage order is sensible for hiring (Application Received → Recruiter
        Screen → Technical Screen → Onsite Loop → Debrief → Offer → Hired).
      - Task types fit the work (ATS sync, screens, coding exercise, scorecards,
        debrief decision, comp/offer, offer letter via DocuSign, Workday handoff).
      - The 3 exception lanes (Rejected, Withdrawn, On Hold) are entered by a
        sensible trigger and correctly terminal or resumable.
      - The conditional rules are genuinely modeled: the Onsite Loop gated to
        engineering L4+, and Debrief blocked until all onsite scorecards are in.
      - No semantic gaps that break downstream: a decision outcome that routes
        nowhere, an inverted sequence, or data a task needs that no upstream task
        produces. Tenant-default / placeholder connector IDs are expected — do
        NOT penalize them.

      Score 1.0 if the design is coherent and would build into a working case
      with no major flaws; 0.5 if mostly coherent with minor gaps; 0.0 if there
      are major logical/domain errors.
    weight: 3.0
    # 0.7, not 1.0: an LLM coherence judge rarely returns a perfect 1.0.
    pass_threshold: 0.7

# Simulator only confirms resumption + approves the finalized sdd.md. No
# interview — the design is already settled in the staged draft.
simulation:
  enabled: true
  persona: |
    You are the talent-acquisition operations lead at Helix who requested the
    CandidateInterview case. The design draft is already written; you are only
    confirming its finalization into an approved sdd.md.
  goal: |
    Get the existing sdd.draft.md finalized into an approved sdd.md. Resume from
    the draft, use it as-is, and approve. Keep the agent at design/finalization only.
  constraints:
    - "If it asks how you want to proceed with the existing draft, tell it to use the draft as-is and finalize it — you don't want to be re-interviewed or redo the design."
    - "When the agent presents the finalized sdd.md for approval, approve it on the first pass ('looks good — approved'). If it warns about high-severity review items, unresolved/tenant-default connector IDs, or unresolved agent identities, approve anyway — the unresolved identities are intentional for this design spec, but the concrete agent resource names must remain."
    - "Do not request design changes or add new requirements — the draft is settled. Do not ask the agent to re-run the interview."
    - "Decline or skip any optional HTML-preview offer."
    - "Keep the agent at design/finalization only. If it offers to build a caseplan or move to a later phase, tell it to stop at the approved sdd.md."
    - "Once sdd.md is approved, the task is done — end the conversation; do not open new topics."
    - "Keep replies short — one sentence or a single option pick."
  max_turns: 10
