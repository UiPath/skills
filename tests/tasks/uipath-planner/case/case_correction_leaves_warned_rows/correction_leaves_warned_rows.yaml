task_id: skill-case-correction-leaves-warned-rows
description: >
  E5 of the SDD-schema evals (MST-15966), E1b's mirror image: a document the
  CLI accepts is left alone. The staged sdd.md is the ready, planner-written
  WarrantyClaimTriage design (the sla_from_sdd fixture) with one Tasks row
  hand-edited without its outer pipes on line 173. `sdd validate` exits 0 and
  reports only the non-fatal SDD_ROW_WITHOUT_OUTER_PIPES warning, whose
  message says to start the row with `|`. The user asks for one unrelated
  correction. The planner must make exactly that edit by hand and never
  hand-edit another line, even the warned one; `sdd format` (run on every
  handoff, Cliff 2026-09-30) may then normalize table form — outer pipes,
  separator, padding — but never prose or a cell's content. Graded on the
  non-table lines, the table cells, and the parsed Model against the fixture
  with only the SLA changed. Needs a CLI with `sdd validate` (UiPath/cli stack A, A6).
  Measured on cli f64f6696e before SDD corrections were routed to the planner:
  the edit went to the case skill or to no skill in 4 of 4 runs, so nothing
  re-validated it. Both skills now route a change to an existing case sdd.md
  to the planner's SDD correction path, so the planner running and the
  re-validation are graded.
tags: [uipath-planner, integration, mode:build, lifecycle:generate, shape:multi-node]

run_limits:
  task_timeout: 1200
  max_turns: 40
  turn_timeout: 900

sandbox:
  template_sources:
    - type: template_dir
      path: fixtures

reference:
  directory: .

initial_prompt: |
  `sdd.md` in this folder is the approved design for our WarrantyClaimTriage
  case. Change the case-level SLA from 5 days to 4 days. That's the only
  change — it's the design document only, nothing gets built.

success_criteria:
  - type: run_command
    description: "Only the requested change: non-table lines byte-identical, table cells identical except the SLA (Document History rows allowed); table form may be normalized"
    command: "python3 $REFERENCE_DIR/check_only_requested_change.py"
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Advisory: the planner ran `sdd format` on the handoff (§Terminal step 5; skipped on a CLI without the command)"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)"?\s+maestro\s+case\s+sdd\s+format'
    min_count: 1
    weight: 1.0
    pass_threshold: 0.0

  - type: run_command
    description: "The corrected sdd.md still passes `sdd validate` (exit 0)"
    command: "uip maestro case sdd validate sdd.md --output json > /dev/null"
    timeout: 120
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    description: "The file was re-validated after the correction (planner §Terminal step 3)"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)"?\s+maestro\s+case\s+sdd\s+validate'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: skill_triggered
    description: "The correction ran through the planner, which owns every edit to a case SDD"
    skill_name: "uipath-planner"
    expected_skill: "uipath-planner"
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "No caseplan build"
    command: "! find . -name caseplan.json -not -path '*/.venv/*' | grep -q ."
    timeout: 10
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0
