task_id: skill-planner-interview-genome-no-sdd
description: >
  Integration: `interview` on an authored genome with no SDD beside it, by a user who says they are the
  process owner. The genome holds twelve open entries: D2–D11 for the process owner, D1 for the
  system's owner, D12 for whoever knows the process, and fourteen Configuration Questions. The first
  question is how to answer; no roles question, since the request names the role. Only the process
  owner's entries are asked, by genome id, and no Configuration Question, which the build asks when no
  file keeps its answer. Each answer is applied: D2–D11 read decided, D1 and D12 stay open, the
  Configuration Questions keep their values (an answer may add one), no SDD is written and the genome
  passes the strict check. The closing counts what is still open by role and offers to write the SDD
  for the answerers who are not in the session, the offer advisory. A simulated process owner answers.
tags: [uipath-planner, integration, mode:build, lifecycle:generate, feature:conversational]

sandbox:
  template_sources:
    - type: template_dir
      path: fixtures

reference:
  directory: ..

initial_prompt: |
  Interview me on the open questions in the genome in this folder. I'm the process owner.

  Do not build anything in this run.

simulation:
  enabled: true
  persona: |
    You are the process owner of supplier invoice entry and approval. You decide the business outcomes
    and rules. You do not know how the robot reaches SAP or how the clerks look suppliers up today.
  goal: |
    Answer the genome's open questions that are yours, so the genome records them as decided, then stop.
  constraints:
    - "When asked how you want to answer, choose to go through every item, a batch at a time."
    - "When a question lists options, pick the one marked Recommended; when none is, pick the first. Answer every question of a batch."
    - "If asked which roles you answer for, answer: only the process owner."
    - "Never answer a question you were not asked, and ask the agent for nothing else."
    - "Once the agent says the answers are applied and lists what is still open, end the conversation."
  max_turns: 10

success_criteria:
  - type: skill_triggered
    description: "Agent engaged the uipath-planner skill"
    skill_name: "uipath-planner"
    expected_skill: "uipath-planner"
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "The process owner's entries D2–D11 read decided"
    command: "node $REFERENCE_DIR/_shared/check_interview.mjs entries supplier-invoice-entry-and-approval-genome.md decided 2-11"
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "The other roles' entries D1 and D12 stay open"
    command: "node $REFERENCE_DIR/_shared/check_interview.mjs entries supplier-invoice-entry-and-approval-genome.md open 1 12"
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "No Configuration Question was answered into the genome; an answer may add one"
    command: >-
      node $REFERENCE_DIR/_shared/check_interview.mjs kept supplier-invoice-entry-and-approval-genome.md
      $REFERENCE_DIR/interview_genome/fixtures/supplier-invoice-entry-and-approval-genome.md "Configuration Questions"
    timeout: 30
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "No SDD was written"
    command: "node $REFERENCE_DIR/_shared/check_interview.mjs absent 'sdd(\\.draft)?\\.md$'"
    timeout: 30
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "The genome passes the strict check"
    command: "node $REFERENCE_DIR/_shared/check_interview.mjs strict"
    timeout: 60
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: llm_judge
    description: "The interview asks the process owner's entries only, how-to-answer first, and closes by role"
    include_dialog: true
    include_tool_calls: true
    include_reference: false
    prompt: |
      The user, who said they are the process owner, asked to be interviewed on the open questions of a
      genome (an automation blueprint). Its open entries: D2–D11 answered by the process owner, D1 by the
      system's owner, D12 by whoever knows the process; it also holds Configuration Questions (CQ1–CQ14).
      Read the dialog and the agent's questions, whether asked in chat or as structured questions.

      Check four things:
      1. The agent's first question asks how the user wants to answer (for example every item a batch
         at a time, only what needs a decision, or the defaults).
      2. The agent never asks which roles the user answers for: the request already named the role.
      3. The questions asked are the process owner's entries only, each named by its id (D2 … D11).
         D1, D12 and the Configuration Questions are not asked. Saying the user may answer another
         role's entry if they know it is not asking it.
      4. The final message counts what is still open by role.

      Score 1.0 when all four hold, 0.75 with three, 0.5 with two, 0.0 otherwise.
    weight: 2.5
    pass_threshold: 0.75

  - type: llm_judge
    description: "Advisory: the closing offers the SDD for absent answerers"
    include_agent_output: true
    include_dialog: true
    include_reference: false
    prompt: |
      The closing message is the one that reports the work written. A shorter reply the agent sends after
      the user answers a question that message asked is not it: grade the closing message.

      Read the agent's closing message after it applied the user's answers to a genome (an automation
      blueprint). Score 1.0 when it offers to write an SDD (solution design document) for the answerers
      who are not in the session; 0.0 otherwise.
    weight: 1.0
    pass_threshold: 0
