task_id: skill-planner-interview-extract-refactor
description: >
  Integration: a refactor of a three-workflow XAML project, by a user who says they are the process
  owner. `extract` writes the genome with no SDD, offers the interview once, after the strict check
  and before the hand-over, and applies its answers; then it hands the genome to `uipath-genome` with
  the request quoted. The build asks none of the entries the interview decided and offers no edit for
  them; an entry the interview left open is asked once, by the build or named by it, never by both
  skills. The request stops the run before any project is created, so it ends in the build's question
  phase. A simulated process owner answers.
tags: [uipath-planner, integration, mode:build, lifecycle:generate, feature:conversational]

run_limits:
  turn_timeout: 1800
  task_timeout: 3600

sandbox:
  template_sources:
    - type: template_dir
      path: ../../extract_component/fixtures
    # Backstop for the request's stop: .claude/settings.json denies writing a project or workflow
    # (Claude Code reads it; other harnesses do not).
    - type: template_dir
      path: ../_setup/build_stop

agent:
  # The simulated user answers between turns; a harness whose prompt is built for unattended runs
  # otherwise skips the questions the skill asks.
  system_prompt_file: ../_shared/attended-session.md

reference:
  directory: ..

initial_prompt: |
  `InvoiceIntake/` is a UiPath project. Refactor it: rebuild it in this folder as a clean project that does the same. It does not run in Orchestrator, and there are no other resources for it.

  I'm the process owner. Use Sonnet subagents for reading. In this run, go as far as the build's questions: ask them, then stop before creating any project.

simulation:
  enabled: true
  persona: |
    You are the process owner of the invoice intake this project automates. You decide business outcomes
    and rules. You do not know the systems' hosts, accounts or mailboxes.
  goal: |
    Get the project refactored, answering the questions that are yours.
  constraints:
    - "When a question lists options, pick the one marked Recommended; when none is, pick the first. Answer every question of a batch."
    - "When asked for a preferences file, answer that you have none."
    - "When a question asks for something you do not know (a host, an account, a mailbox), say it is for the environment's owners."
    - "Do not ask for the interview yourself; answer it when the agent offers it."
    - "You answer only as the process owner: if offered other roles' questions, decline them."
    - "When asked whether you want to adjust anything, say no. When the same message also offers the interview, accept the interview."
    - "Once the build has asked its questions and stops before creating a project, or reports that it cannot create one, end the conversation."
  max_turns: 16

success_criteria:
  - type: skill_triggered
    description: "Agent engaged the uipath-planner skill"
    skill_name: "uipath-planner"
    expected_skill: "uipath-planner"
    weight: 1.0
    pass_threshold: 1.0

  - type: skill_triggered
    description: "The genome was handed to uipath-genome"
    skill_name: "uipath-genome"
    expected_skill: "uipath-genome"
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "No SDD was written"
    command: "node $REFERENCE_DIR/_shared/check_interview.mjs absent 'sdd(\\.draft)?\\.md$'"
    timeout: 30
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "The genome passes the strict check"
    command: "node $REFERENCE_DIR/_shared/check_interview.mjs strict"
    timeout: 60
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 1.0

  - type: llm_judge
    description: "One interview offer, after the genome is written and before the hand-over"
    include_dialog: true
    include_tool_calls: true
    include_reference: false
    prompt: |
      The user, the process owner, asked to refactor a small UiPath project. The planner extracts a genome
      (an automation blueprint) from it, then a build skill builds from the genome in the same session.
      Read the dialog and the agent's questions, whether asked in chat or as structured questions.

      Score 1.0 when the interview on the genome's open entries is offered exactly once, after the genome
      is written and checked and before the build starts asking its own questions. Score 0.0 when it is
      offered more than once, before the genome is written, or not at all.
    weight: 2.0
    pass_threshold: 1.0

  - type: llm_judge
    description: "The build asks no entry the interview decided, and no entry is asked by both skills"
    include_dialog: true
    include_tool_calls: true
    include_reference: false
    prompt: |
      The user, the process owner, asked to refactor a small UiPath project. First the planner interviews
      the user on the genome's open entries (ids D1, D2 …); then the build asks its own questions (how the
      work is split, the setup, open decisions it still needs). Read the dialog and the agent's questions,
      whether asked in chat or as structured questions.

      A configuration value the build asks (a server, a folder, an address, a credential) is not an
      interview entry, even when an entry's wording mentions it. When no interview ran (the user declined
      it, or it was never asked), it decided nothing and left every entry open: the build may ask each
      entry once.

      Score 1.0 when both hold:
      1. The build asks none of the entries the interview decided, and offers no edit for them.
      2. An entry the interview left open (another role's, or skipped) is asked once by the build or
         named by it, never asked by both the interview and the build.
      Score 0.5 when one holds, 0.0 when neither does.
    weight: 2.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Advisory: the hand-over to uipath-genome quotes the user's request (read from Claude Code's Skill call; other harnesses have none)"
    tool_name: "Skill"
    command_pattern: '(?=[\s\S]*uipath-genome)(?=[\s\S]*Refactor it: rebuild it in this folder)'
    min_count: 1
    weight: 1.0
    pass_threshold: 0
