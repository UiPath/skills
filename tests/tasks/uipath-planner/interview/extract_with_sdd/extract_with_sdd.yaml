task_id: skill-planner-interview-extract-with-sdd
description: >
  Integration: `extract` of a three-workflow XAML project "to rebuild later", where the request asks
  for the SDD too, by a user who says they are the process owner. The SDD is written beside the genome.
  After the strict check the interview is offered on the SDD's items, with no roles question since the
  request names the role; the answers are written into the SDD's items and applied to the genome, and
  the genome passes the strict check with the SDD's `Genome` row current. The closing counts what is
  open by role; naming the two files and the counts by group are advisory. Nothing is built. A
  simulated process owner answers.
tags: [uipath-planner, integration, mode:build, lifecycle:generate, feature:conversational]

run_limits:
  turn_timeout: 1800
  task_timeout: 3000

sandbox:
  template_sources:
    - type: template_dir
      path: ../../extract_component/fixtures

agent:
  # The simulated user answers between turns; a harness whose prompt is built for unattended runs
  # otherwise skips the questions the skill asks.
  system_prompt_file: ../_shared/attended-session.md

reference:
  directory: ..

initial_prompt: |
  `InvoiceIntake/` is a UiPath project. Extract its genome into this folder: we will rebuild it later. Write the SDD too, for the people who will answer its open questions. It does not run in Orchestrator, and there are no other resources for it.

  I'm the process owner. Do not build anything in this run.

simulation:
  enabled: true
  persona: |
    You are the process owner of the invoice intake this project automates. You decide business outcomes
    and rules. You do not know the systems' hosts, accounts or mailboxes.
  goal: |
    Get the genome and its SDD written, answering the open questions that are yours, then stop.
  constraints:
    - "When asked how you want to answer the open items, choose to go through every item, a batch at a time."
    - "When a question lists options, pick the one marked Recommended; when none is, pick the first. Answer every question of a batch."
    - "When asked for a preferences file, answer that you have none."
    - "When a question asks for something you do not know (a host, an account, a mailbox), say it is for the environment's owners."
    - "Do not ask for the interview yourself; answer it when the agent offers it."
    - "You answer only as the process owner: if offered other roles' questions, decline them."
    - "When asked whether you want to adjust anything, or offered a build, say no."
    - "Once the agent reports the answers applied and what is still open, end the conversation."
  max_turns: 10

success_criteria:
  - type: skill_triggered
    description: "Agent engaged the uipath-planner skill"
    skill_name: "uipath-planner"
    expected_skill: "uipath-planner"
    weight: 1.0
    pass_threshold: 1.0

  - type: file_exists
    description: "A genome was written"
    path: "*-genome.md"
    weight: 1.0
    pass_threshold: 1.0

  - type: file_exists
    description: "The SDD was written beside the genome"
    path: "*-sdd.md"
    weight: 2.0
    pass_threshold: 1.0

  - type: file_matches_regex
    description: "The SDD's Document History records the interview"
    path: "*-sdd.md"
    pattern: '(?im)^\|\s*\d{4}-\d{2}-\d{2}\s*\|.*\b(interview|answer)'
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "The genome passes the strict check, the SDD's Genome row current after the answers"
    command: "node $REFERENCE_DIR/_shared/check_interview.mjs strict"
    timeout: 60
    expected_exit_code: 0
    weight: 2.5
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Extraction does not scaffold, build or run the project"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+rpa\s+(init|new|run|build|debug)'
    weight: 1.0
    pass_threshold: 1.0

  - type: llm_judge
    description: "The interview is offered after writing, on the SDD's items, with no roles question"
    include_dialog: true
    include_tool_calls: true
    include_reference: false
    prompt: |
      The user, who said they are the process owner, asked for the genome (an automation blueprint) of a
      small UiPath project and for the SDD (solution design document) written from it. Read the dialog and
      the agent's questions, whether asked in chat or as structured questions.

      Check three things:
      1. Once the genome and the SDD are written, one question asks how the user wants to answer the open
         items, and one of its options leaves them all open for now.
      2. The agent never asks which roles the user answers for: the request already named the role.
      3. The items then asked are the process owner's, each by its id. The "Defects the rebuild fixes"
         block, which has no id, and a question about how to go on after a batch need none.

      Score 1.0 when all three hold, 0.5 with two, 0.0 otherwise.
    weight: 2.5
    pass_threshold: 1.0

  - type: llm_judge
    description: "The closing counts what is open by role"
    include_agent_output: true
    include_dialog: true
    include_reference: false
    prompt: |
      The closing message is the one that reports the work written. A shorter reply the agent sends after
      the user answers a question that message asked is not it: grade the closing message.

      Read the agent's closing message after it applied the user's answers. Score 1.0 when it counts the
      items still open by the role that answers them, or says that none is open; 0.0 otherwise.
    weight: 2.0
    pass_threshold: 1.0

  - type: llm_judge
    description: "Advisory: the closing names both files and counts what is open by group"
    include_agent_output: true
    include_dialog: true
    include_reference: false
    prompt: |
      The closing message is the one that reports the work written. A shorter reply the agent sends after
      the user answers a question that message asked is not it: grade the closing message.

      Read the agent's closing message after it applied the user's answers. Check two things:
      1. It names the genome file and the SDD (solution design document) file.
      2. It counts the items still open by group (business decisions, material, configuration values …).
         A group shown by the items' ids or labels (CQ1–CQ10 for configuration values, the preferences
         item) counts as named.

      Score 1.0 when both hold, 0.5 with one, 0.0 with neither.
    weight: 1.0
    pass_threshold: 0
