task_id: skill-planner-interview-author-from-sdd
description: >
  Integration: `author` from an agreed, ready SDD whose design already settled every point that changes
  the design, by a user who says they are the process owner. No interview is offered and no question
  that only a later step can place is asked before the genome is written. One genome is written with
  a `Designed in:` line pinned to the SDD; no second SDD. The SDD's body stays as `design` wrote it,
  its Action Required section is written again from the genome, and its handoff gains the `Genome`
  row. The genome passes the strict check, and the closing names the open items by role. A simulated
  process owner answers.
tags: [uipath-planner, integration, mode:build, lifecycle:generate, feature:conversational]

run_limits:
  turn_timeout: 1500
  task_timeout: 2400

sandbox:
  template_sources:
    - type: template_dir
      path: ../interview_sdd/fixtures

reference:
  directory: ..

initial_prompt: |
  Write the genome for the SDD in this folder.

  I'm the process owner. Do not build anything in this run.

simulation:
  enabled: true
  persona: |
    You are the process owner of supplier invoice entry, and you agreed this SDD.
  goal: |
    Get the genome written from the SDD, then stop.
  constraints:
    - "When a question lists options, pick the one marked Recommended; when none is, pick the first."
    - "When asked for a preferences file, answer that you have none."
    - "If the agent offers an interview, edits or a build after writing the genome, decline."
    - "Once the agent reports the genome written, end the conversation."
  max_turns: 6

success_criteria:
  - type: skill_triggered
    description: "Agent engaged the uipath-planner skill"
    skill_name: "uipath-planner"
    expected_skill: "uipath-planner"
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "The genome passes the strict check, its Designed in fingerprint matching the SDD"
    command: "node $REFERENCE_DIR/_shared/check_interview.mjs strict"
    timeout: 60
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "The genome's Designed in line names the SDD"
    command: "node $REFERENCE_DIR/_shared/check_interview.mjs line '^>\\s*Designed in:.*supplier-invoice-entry-sdd\\.md'"
    timeout: 30
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "No second SDD was written"
    command: "node $REFERENCE_DIR/_shared/check_interview.mjs absent '^(?!(.*/)?supplier-invoice-entry-sdd\\.md$).*sdd(\\.draft)?\\.md$'"
    timeout: 30
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "The SDD's body is unchanged"
    command: >-
      node $REFERENCE_DIR/_shared/check_interview.mjs body supplier-invoice-entry-sdd.md
      e81e69d1316ee1d6835d2958458fbd95f494beda228f78d6fc92f688103c9b37
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "The SDD's Action Required is written again from the genome"
    command: >-
      node $REFERENCE_DIR/_shared/check_interview.mjs unchanged supplier-invoice-entry-sdd.md
      94ac85773adb7464ab0090e0af4d84697fa6409bc15541852d62601a2aea7b54 "Action Required"
    timeout: 30
    expected_exit_code: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: file_matches_regex
    description: "The SDD's handoff gains the Genome row"
    path: "supplier-invoice-entry-sdd.md"
    pattern: '\| \*\*Genome\*\* \| [^|\n]*-genome\.md'
    weight: 1.5
    pass_threshold: 1.0

  - type: llm_judge
    description: "No interview offer and no later-step question before writing; a closing by role"
    include_dialog: true
    include_tool_calls: true
    include_reference: false
    prompt: |
      The user, the process owner, asked for the genome (an automation blueprint) of an agreed SDD
      (solution design document) whose design already settled the trigger, the systems, the approval
      and the scope. Read the dialog and the agent's questions, whether asked in chat or as structured
      questions.

      Check three things:
      1. No interview is offered before the genome is written.
      2. Before the genome is written, nothing is asked except, at most, whether the user has a
         preferences file (team standing answers and development standards).
      3. The final message counts the questions still open by the role that answers them.

      Score 1.0 when all three hold, 0.5 with two, 0.0 otherwise.
    weight: 2.0
    pass_threshold: 1.0
