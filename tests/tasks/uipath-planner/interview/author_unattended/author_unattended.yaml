task_id: skill-planner-interview-author-unattended
description: >
  Integration: `author` on a one-sentence idea, in a run that says nobody will answer questions. The
  interview is never offered in an unattended run and the follow-up rounds ask nothing, so the run
  asks no structured question and writes a genome with no SDD. A business value the idea does not give
  (the approval limit) reads `default: none` instead of an invented amount. The closing counts the
  open decisions by role, names `interview <genome>` and the offer to write the SDD for answerers
  outside the session, and asks for the preferences file. Nothing is built. It gates on the files, the
  strict check and no invented limit; the closing is advisory.
tags: [uipath-planner, integration, mode:build, lifecycle:generate]

reference:
  directory: ..

initial_prompt: |
  Write a genome for this automation, in this folder. Run unattended: nobody will answer questions.

  When a supplier invoice comes in, enter it in our ERP and get it approved when it is over the limit.

  Do not build anything in this run.

success_criteria:
  - type: skill_triggered
    description: "Agent engaged the uipath-planner skill"
    skill_name: "uipath-planner"
    expected_skill: "uipath-planner"
    weight: 1.0
    pass_threshold: 1.0

  - type: file_exists
    description: "A genome was written"
    path: "*-genome.md"
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "No SDD was written"
    command: "node $REFERENCE_DIR/_shared/check_interview.mjs absent 'sdd(\\.draft)?\\.md$'"
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "The genome passes the strict check"
    command: "node $REFERENCE_DIR/_shared/check_interview.mjs strict"
    timeout: 60
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "The approval limit is a Configuration Question with no invented amount"
    command: >-
      node $REFERENCE_DIR/_shared/check_interview.mjs line '^\s*\d+\.(?![^\n(]*\b(?:who|role|person|user|group|approver|catalog|retry|retries|failure)\b)(?=[^\n(]*(?:\blimit\b|\bthreshold\b|approval amount))[^\n]*\((?:constant|setting); default:(?![^;)\n]*\d)' '^\s*\d+\..*(?:\blimit\b|\bthreshold\b|approval amount)'
    timeout: 30
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 1.0

  - type: llm_judge
    description: "Advisory: the closing counts what is open, by role"
    include_agent_output: true
    include_dialog: true
    include_reference: false
    prompt: |
      The closing message is the one that reports the work written. A shorter reply the agent sends after
      the user answers a question that message asked is not it: grade the closing message.

      The user asked for a genome (an automation blueprint) of a one-sentence idea, in a run where
      nobody answers questions. Read the agent's closing message, its closing summary.

      Score 1.0 when it counts the genome's open decisions, split by who answers them (a role such as the
      process owner or the system's owner), or says that none is open; 0.0 otherwise. Decisions counted
      by tier or by group alone, with no role, are not counted by role; configuration values need no
      role, and those listed beside the decisions are not part of their count. Do not grade the genome
      itself.
    weight: 2.0
    pass_threshold: 0

  - type: llm_judge
    description: "Advisory: the closing says how what is open gets answered"
    include_agent_output: true
    include_dialog: true
    include_reference: false
    prompt: |
      The closing message is the one that reports the work written. A shorter reply the agent sends after
      the user answers a question that message asked is not it: grade the closing message.

      The user asked for a genome (an automation blueprint) of a one-sentence idea, in a run where
      nobody answers questions. Read the agent's closing message, its closing summary. Check four things:
      1. It says how many configuration values are open or needed before a build.
      2. It names the interview command for the genome, in the form `interview <genome file name>`.
      3. It offers to write an SDD (solution design document) for answerers who are not in the session.
      4. It asks whether the user has a preferences file (team standing answers and development standards).

      Score 1.0 when all four hold, 0.75 with three, 0.5 with two, 0.0 with one or none.
    weight: 1.0
    pass_threshold: 0
