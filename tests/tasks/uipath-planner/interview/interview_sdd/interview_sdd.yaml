task_id: skill-planner-interview-sdd-no-genome
description: >
  Integration: `interview` on a ready SDD that has no genome yet, by a user who says they are the
  process owner. Eleven items are open in its Action Required: D1 and D3 for the process owner, the
  rest for the system's owner, the environment's owners, the delivery lead and whoever holds the
  source. The first question is how to answer; no roles question, since the request names the role.
  Only D1 and D3 are asked, by their SDD ids. Each answer is a design revise of the SDD: written on
  its item's answer line or into the section that holds its subject, with a Document History row for
  the interview; the other roles' items stay blank, and no genome is written. The closing names what
  is still open by role. A simulated process owner answers. It gates on D1 and D3 answered, the other
  items blank, the SDD ready and no genome; how the questions are asked, the history row and the
  closing are advisory.
tags: [uipath-planner, integration, mode:build, lifecycle:generate, feature:conversational]

sandbox:
  template_sources:
    - type: template_dir
      path: fixtures

agent:
  # The simulated user answers between turns; a harness whose prompt is built for unattended runs
  # otherwise skips the questions the skill asks.
  system_prompt_file: ../_shared/attended-session.md

reference:
  directory: ..

initial_prompt: |
  Interview me on the open questions in the SDD in this folder. I'm the process owner.

  Do not build anything in this run.

simulation:
  enabled: true
  persona: |
    You are the process owner of supplier invoice entry. You decide business outcomes and rules. You do
    not know how the ERP or the mailbox can be reached, nor the environments' tenants and machines.
  goal: |
    Answer the SDD's open questions that are yours, then stop.
  constraints:
    - "When asked how you want to answer, choose to go through every item, a batch at a time."
    - "When a question lists options, pick the one marked Recommended; when none is, pick the first. When it asks for a value, keep its default."
    - "If asked which roles you answer for, answer: only the process owner."
    - "Never answer a question you were not asked, and ask the agent for nothing else."
    - "Once the agent says the answers are written and lists what is still open, end the conversation."
  max_turns: 8

success_criteria:
  - type: skill_triggered
    description: "Agent engaged the uipath-planner skill"
    skill_name: "uipath-planner"
    expected_skill: "uipath-planner"
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "The process owner's items D1 and D3 are answered"
    command: "node $REFERENCE_DIR/_shared/check_interview.mjs items supplier-invoice-entry-sdd.md answered D1 D3"
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "The other roles' items stay blank"
    command: "node $REFERENCE_DIR/_shared/check_interview.mjs items supplier-invoice-entry-sdd.md blank D2 D4-11"
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "Advisory: the SDD's Document History gains a row for this interview"
    command: "node $REFERENCE_DIR/_shared/check_interview.mjs count supplier-invoice-entry-sdd.md '^\\|\\s*\\d{4}-\\d{2}-\\d{2}\\s*\\|.*\\b(interview|answer)' 2"
    timeout: 30
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 0

  - type: file_contains
    description: "The SDD stays ready"
    path: "supplier-invoice-entry-sdd.md"
    includes:
      - "| **Status** | ready |"
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "No genome was written"
    command: "node $REFERENCE_DIR/_shared/check_interview.mjs absent '-genome\\.md$'"
    timeout: 30
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 1.0

  - type: llm_judge
    description: "Advisory: how-to-answer first, no roles question, the process owner's items by id"
    include_dialog: true
    include_tool_calls: true
    include_reference: false
    prompt: |
      The user, who said they are the process owner, asked to be interviewed on the open questions of an
      SDD (solution design document) that has no genome yet. Its open items: D1 and D3 for the process
      owner; D2 and D4–D11 for the system's owner, the environment's owners, the delivery lead and
      whoever holds the source. Read the dialog and the agent's questions, whether asked in chat or as
      structured questions.

      Check three things:
      1. The agent's first question asks how the user wants to answer.
      2. The agent never asks which roles the user answers for.
      3. Only D1 and D3 are asked, each named by its id.

      Score 1.0 when all three hold, 0.5 with two, 0.0 otherwise.
    weight: 2.0
    pass_threshold: 0

  - type: llm_judge
    description: "Advisory: the closing names what is still open, by role"
    include_agent_output: true
    include_dialog: true
    include_reference: false
    prompt: |
      The user, the process owner, was interviewed on the open questions of an SDD (solution design document) with no genome yet. Read the agent's
      final message, the one that reports the answers applied. Score 1.0 when it names what is still
      open by the role that answers it, a count of the open items per role being enough, or says that
      nothing is open; 0.0 otherwise.
    weight: 0.5
    pass_threshold: 0
