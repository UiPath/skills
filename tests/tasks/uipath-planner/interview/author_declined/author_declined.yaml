task_id: skill-planner-interview-author-declined
description: >
  Integration: `author` on a one-sentence idea, where the request declines the interview and asks for
  defaults with the open points written down. No offer question and no interview; at most one round of
  follow-up questions. The genome is written with defaults and open entries, the approval limit as a
  Configuration Question with `default: none`, no SDD, and passes the strict check. With no round
  asked, the closing asks for the preferences file; it names `interview <genome>` and offers to write
  the SDD for answerers outside the session. A simulated process owner answers. It gates on the files,
  the strict check, no invented limit and no interview; the rest is advisory.
tags: [uipath-planner, integration, mode:build, lifecycle:generate, feature:conversational]

run_limits:
  turn_timeout: 1500
  task_timeout: 2400

agent:
  # The simulated user answers between turns; a harness whose prompt is built for unattended runs
  # otherwise skips the questions the skill asks.
  system_prompt_file: ../_shared/attended-session.md

reference:
  directory: ..

initial_prompt: |
  Write a genome for this automation, in this folder. Do not interview me: use your defaults and write the open points down.

  When a supplier invoice comes in, enter it in our ERP and get it approved when it is over the limit.

  I'm the process owner. Do not build anything in this run.

simulation:
  enabled: true
  persona: |
    You are the process owner of supplier invoice handling in accounts payable. You want the genome
    written with defaults and do not want to be interviewed.
  goal: |
    Get the genome written with its open points listed, then stop.
  constraints:
    - "When a question lists options, pick the one marked Recommended; when none is, pick the first."
    - "When asked for a preferences file, answer that you have none."
    - "If the agent offers an interview, edits, the SDD or a build after writing the genome, decline."
    - "Once the agent reports the genome written, end the conversation."
  max_turns: 6

success_criteria:
  - type: skill_triggered
    description: "Agent engaged the uipath-planner skill"
    skill_name: "uipath-planner"
    expected_skill: "uipath-planner"
    weight: 1.0
    pass_threshold: 1.0

  - type: file_exists
    description: "A genome was written"
    path: "*-genome.md"
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "No SDD was written"
    command: "node $REFERENCE_DIR/_shared/check_interview.mjs absent 'sdd(\\.draft)?\\.md$'"
    timeout: 30
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "The genome passes the strict check"
    command: "node $REFERENCE_DIR/_shared/check_interview.mjs strict"
    timeout: 60
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "The approval limit is a Configuration Question with no invented amount"
    command: >-
      node $REFERENCE_DIR/_shared/check_interview.mjs line '^\s*\d+\.(?![^\n(]*\b(?:who|role|person|user|group|approver|catalog|retry|retries|failure)\b)(?=[^\n(]*(?:\blimit\b|\bthreshold\b|approval amount))[^\n]*\((?:constant|setting); default:(?![^;)\n]*\d)' '^\s*\d+\..*(?:\blimit\b|\bthreshold\b|approval amount)'
    timeout: 30
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 1.0

  - type: llm_judge
    description: "No interview, and at most one follow-up round"
    include_dialog: true
    include_tool_calls: true
    include_reference: false
    prompt: |
      The user, the process owner, asked for a genome (an automation blueprint) of a one-sentence idea and
      said: do not interview me, use your defaults and write the open points down. Read the dialog and the
      agent's questions, whether asked in chat or as structured questions.

      Score 1.0 when, before the genome is written, the agent neither offers nor runs an interview, and
      asks at most one round of follow-up questions; 0.0 otherwise. The closing message, once the genome
      is written, may name `interview <genome>` as the way to answer later: that is not an offer.
    weight: 2.0
    pass_threshold: 1.0

  - type: llm_judge
    description: "Advisory: the preferences file is asked"
    include_dialog: true
    include_reference: false
    prompt: |
      The user, the process owner, asked for a genome (an automation blueprint) of a one-sentence idea and
      said: do not interview me, use your defaults and write the open points down. Read the dialog.

      Score 1.0 when the agent asks whether the user has a preferences file (team standing answers and
      development standards): in its round of follow-up questions when it asked one, otherwise in the
      closing message that reports the genome written; 0.0 otherwise.
    weight: 0.5
    pass_threshold: 0

  - type: llm_judge
    description: "Advisory: the closing names the interview and the SDD offer"
    include_agent_output: true
    include_dialog: true
    include_reference: false
    prompt: |
      The closing message is the one that reports the work written. A shorter reply the agent sends after
      the user answers a question that message asked is not it: grade the closing message.

      Read the agent's closing message after it wrote the genome (an automation blueprint). Check two things:
      1. It names the interview command for the genome, `interview <genome file name>`.
      2. It offers to write an SDD (solution design document) for answerers who are not in the session.

      Score 1.0 when both hold, 0.5 with one, 0.0 with neither.
    weight: 1.0
    pass_threshold: 0
