task_id: skill-planner-sdd-revise-updates-genome
description: >
  Integration: the uipath-planner skill revises one business rule of a ready single-product RPA SDD
  (Daily Sales Summary, minimum line amount 10.00 → 25.00) whose genome is already written and pinned to
  it by its `Designed in:` fingerprint. Grades that the SDD carries the new value, that the genome was
  updated to it, and that the genome passes the strict check — which fails a stale fingerprint, so the
  genome is current with the revised SDD. Nothing is built.
tags: [uipath-planner, integration, mode:build, lifecycle:generate]

sandbox:
  template_sources:
    - type: template_dir
      path: fixtures

# Every check calls the skill's check-genome.mjs with node through $REFERENCE_DIR (its scripts folder).
reference:
  directory: ../../../../skills/uipath-planner/scripts

initial_prompt: |
  In the SDD `daily-sales-summary-sdd.md`, sales lines below 25.00 (not 10.00) are now left out of
  the totals. Update the design. Do not build anything.

  Do not ask follow-up questions — take the defaults. Do not run any `uip` commands.

success_criteria:
  - type: skill_triggered
    description: "Agent engaged the uipath-planner skill"
    skill_name: "uipath-planner"
    expected_skill: "uipath-planner"
    weight: 2.0
    pass_threshold: 1.0

  - type: file_contains
    description: "The SDD carries the new minimum amount"
    path: "daily-sales-summary-sdd.md"
    includes:
      - "25.00"
    excludes:
      - "below 10.00"
    weight: 1.5
    pass_threshold: 1.0

  - type: file_contains
    description: "The genome carries the new minimum amount"
    path: "daily-sales-summary-genome.md"
    includes:
      - "25.00"
    excludes:
      - "default: 10.00"
    weight: 2.0
    pass_threshold: 1.0

  # strict fails a `Designed in:` fingerprint that no longer matches the SDD
  - type: run_command
    description: "The genome passes the strict check against the revised SDD"
    command: >-
      node $REFERENCE_DIR/check-genome.mjs component daily-sales-summary-genome.md --profile strict
    timeout: 60
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "The SDD stays ready and keeps its Genome handoff row"
    command: >-
      node -e "const t = require('fs').readFileSync('daily-sales-summary-sdd.md', 'utf8');
      process.exit(t.includes('| **Status** | ready |') && t.includes('**Genome**') ? 0 : 1)"
    timeout: 30
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Revising the design does not scaffold, build or run a project"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+rpa\s+(init|run|build|debug)'
    weight: 1.0
    pass_threshold: 1.0
