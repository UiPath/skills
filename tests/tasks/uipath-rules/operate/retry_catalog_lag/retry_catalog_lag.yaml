task_id: skill-rules-operate-retry-catalog-lag
description: >
  Retry condition, against a mocked `uip`. The agent reads the contract of
  ClaimLimits, deployed to Shared a minute ago, and `describe` answers that
  the rule is not in the resource catalog yet. The failure modes guide says
  to wait a minute and run the command again once, then stop and show the
  error. The mock is stateless, so the retry fails too. Grades exactly two
  `describe` calls and no login or tenant change. The body is the `not_found`
  error with `RetryAfter60Seconds` that UiPath/cli main raises on a catalog
  miss, after `get` finds the rule in its store.
tags: [uipath-rules, integration, "mode:operate", "lifecycle:discover"]

run_limits:
  # The agent waits about a minute before its one retry.
  turn_timeout: 900

sandbox:
  python: {}
  record_cli:
    - tool: uip
      exit_code: 1
      stderr: "uip (mock): not connected to a tenant in this offline sandbox.\n"
      responses:
        - when:
            verb: "login status"
          stdout: >-
            {"Result":"Success","Code":"LoginStatus","Data":{"Status":"Logged in",
            "Identity":"analyst@example.com","IdentityType":"User","AuthFlow":"Interactive",
            "CredentialSource":"SavedLogin","Provider":"File","UserId":"00000000-0000-4000-8000-000000000901",
            "UserEmail":"analyst@example.com","UserName":"Example Analyst","BaseUrl":"https://cloud.uipath.com",
            "Organization":"example-org","OrganizationId":"00000000-0000-4000-8000-000000000902",
            "Tenant":"DefaultTenant","TenantId":"00000000-0000-4000-8000-000000000903",
            "ExpirationDate":"2026-06-02T10:14:05.000Z"}}

        - when:
            verb: "rules describe"
            positional: ["ClaimLimits"]
          exit_code: 1
          stdout: >-
            {"Result":"Failure","ErrorCode":"not_found",
            "Message":"Business rule 'ClaimLimits' is not in the resource catalog for folder 'Shared' yet.",
            "Instructions":"The rule exists but the resource catalog does not list it yet, which is normal right after a deploy. Run the command again shortly.",
            "Retry":"RetryAfter60Seconds","Context":{"Session":{"Profile":"default","Organization":"example-org","Tenant":"DefaultTenant","Hint":"The default login was used. If the resource is in another organization or tenant, re-run with --profile <profile-name>."}}}

        - when:
            verb: "rules get"
            positional: ["ClaimLimits"]
          stdout: >-
            {"Result":"Success","Code":"RulesGet","Data":{"Key":"00000000-0000-4000-8000-000000000301",
            "Name":"ClaimLimits","FolderPath":"Shared","FolderKey":"00000000-0000-4000-8000-000000000001",
            "Description":"","CurrentVersion":"1.0.0","Source":"BusinessRules","Tags":[],
            "CreationTime":"2026-06-02T09:14:05.112Z"}}

        - when:
            verb: "rules versions"
            positional: ["ClaimLimits"]
          stdout: >-
            {"Result":"Success","Code":"RulesVersionList","Pagination":{"Returned":1,"Limit":50,"Offset":0,"HasMore":false},
            "Data":[{"Version":"1.0.0","IsActive":true,"CreationTime":"2026-06-02T09:14:05.112Z"}]}

reference:
  directory: ../..

initial_prompt: |
  We deployed the ClaimLimits business rule to the Shared folder a minute ago.
  What inputs and outputs does it take?

  The `uip` CLI here is a mock that answers like a live tenant. Do not ask for
  confirmation.

success_criteria:
  - type: skill_triggered
    description: "Agent engaged the uipath-rules skill"
    skill_name: "uipath-rules"
    expected_skill: "uipath-rules"
    weight: 1.0
    pass_threshold: 1.0

  - type: cli_called
    description: "Agent ran describe again once after the catalog miss, then stopped"
    tool: uip
    verb: "rules describe"
    positional: ["ClaimLimits"]
    min_count: 2
    max_count: 2
    weight: 3.0
    pass_threshold: 1.0

  - type: cli_called
    description: "Agent did not switch tenants"
    tool: uip
    verb: "login tenant"
    min_count: 0
    max_count: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: cli_called
    description: "Agent did not log out to try another login"
    tool: uip
    verb: "logout"
    min_count: 0
    max_count: 0
    weight: 1.0
    pass_threshold: 1.0
