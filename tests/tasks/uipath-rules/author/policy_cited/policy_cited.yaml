task_id: skill-rules-integration-policy-cited
description: >
  Agent builds a Business Rules decision table from the same policy with the
  digitizer's output (`document.md` plus `dom.json`) and cites it with the
  skill's cite.mjs. Grades that cite.mjs ran, that the agent's cites.json
  passes cite.mjs and the .dmn's sourceRefs are exactly what cite.mjs writes
  from it (no box written or edited by hand), that check-uipdm.mjs passes, that
  no qualityWarning carries conditionId, and the table's outcome on the hidden
  scenarios.
tags: [uipath-rules, integration, "mode:build", "lifecycle:generate"]

sandbox:
  python: {}
  template_sources:
    - type: template_dir
      path: ../../_setup/policy_digitized
      mount_point: policy

reference:
  directory: ../..

initial_prompt: |
  Build a UiPath Business Rules project named ReimbursementRules from our
  equipment reimbursement policy. The digitizer already ran:
  `./policy/document.md` is the page-marked text and `./policy/dom.json` is the
  digitizer's output. Cite where in the policy each row was read.

  Use these names so we can wire the rule into a workflow:
  - Inputs: `serviceDays` (number), `requestAmount` (number),
    `hasDirectorPreApproval` (boolean), `hasMedicalAccommodation` (boolean).
  - Output: `outcome` (string), one of "Approve", "Deny", "Refer".
  Keep each named input as its own column of the table; do not build a column
  from an expression that combines inputs.

  Nobody is available to answer questions: at every question accept your own
  proposed answer and write it in notes.md. There is no tenant, so do not run
  `uip rules debug`; record the test cases as not run.

success_criteria:
  - type: skill_triggered
    description: "Agent engaged the uipath-rules skill"
    skill_name: "uipath-rules"
    expected_skill: "uipath-rules"
    weight: 1.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent wrote the citations with cite.mjs"
    tool_name: "Bash"
    command_pattern: 'node\s+"?[^\s"]*cite\.mjs'
    min_count: 1
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "uip rules validate passes on the project"
    command: "python3 $REFERENCE_DIR/_shared/extract_check.py validate"
    timeout: 120
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "cites.json passes cite.mjs; the .dmn's sourceRefs are what cite.mjs writes; uipdm elements valid; no conditionId"
    command: "python3 $REFERENCE_DIR/_shared/extract_check.py refs"
    timeout: 120
    expected_exit_code: 0
    weight: 4.0
    pass_threshold: 1.0

  - type: run_command
    description: "The table returns the policy's outcome on all 15 hidden scenarios, missing facts included"
    command: "python3 $REFERENCE_DIR/_shared/extract_check.py outcomes"
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent did not run rules debug without a tenant"
    tool_name: "Bash"
    command_pattern: '(?m)(?:^|&&|;|\|\|?)\s*uip\s+rules\s+debug'
    weight: 0.5
    pass_threshold: 0
