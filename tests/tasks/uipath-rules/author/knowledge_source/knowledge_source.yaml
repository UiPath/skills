task_id: skill-rules-author-knowledge-source
description: >
  Agent authors a supplier approval whose thresholds come from a named policy,
  and shows that policy on the diagram as the authority the decision follows,
  offline. The prompt names no DMN construct. The drd-guide teaches a
  knowledge source cited by the decision's `authorityRequirement` /
  `requiredAuthority`, the only link the designer offers to one. Grades skill
  activation, `uip rules validate` and `uip rules format` run by the grader,
  one knowledge source for the policy, cited by the approval decision and
  linked no other way, its card placed, and the approval on 8 cases.
tags: [uipath-rules, integration, "mode:build", "lifecycle:generate"]

sandbox:
  python: {}

reference:
  directory: ../..

initial_prompt: |
  Create a UiPath Business Rules project named SpendRules for our supplier
  approvals. Its thresholds come from our Procurement Policy 2026: show that
  policy on the diagram as the authority the approval follows, so auditors can
  see where the thresholds come from.

  - Inputs: `onboarded` (boolean) and `spend` (number).
  - Output: `approved` (boolean).
  - A supplier that is not onboarded is never approved.
  - An onboarded supplier is approved up to and including 25000, and not
    approved above that.

  There is no tenant to evaluate against, so do not run `uip rules debug`.
  Do not ask for confirmation.

success_criteria:
  - type: skill_triggered
    description: "Agent engaged the uipath-rules skill"
    skill_name: "uipath-rules"
    expected_skill: "uipath-rules"
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "uip rules validate passes on the project"
    command: "python3 $REFERENCE_DIR/_shared/rules_check.py validate SpendRules"
    timeout: 120
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "The diagram matches the model: uip rules format changes nothing"
    command: "python3 $REFERENCE_DIR/_shared/rules_check.py format SpendRules"
    timeout: 120
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "The approval cites the Procurement Policy as a knowledge source and returns the policy's decision"
    command: "python3 $REFERENCE_DIR/author/knowledge_source/check_knowledge_source.py"
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
