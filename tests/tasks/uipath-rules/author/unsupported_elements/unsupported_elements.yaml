task_id: skill-rules-smoke-graph-unsupported-elements
description: >
  Agent is asked for a Business Rules project that holds an element the skill
  does not author, offline. One dataset row per element: a decision service,
  an import, and a boxed context. Critical Rule 3 says to decline the element
  and express the logic as decision tables. Grades skill activation, the rule
  holding none of the three, the approval on the policy cases, and `uip rules
  validate` and `uip rules format` run by the grader. Knowledge models and
  literal expressions are in the profile and are covered by their own tasks.
  A knowledge source and a group are not rows and are not graded: the
  designer draws and keeps both.
tags: [uipath-rules, integration, "mode:build", "lifecycle:generate"]

sandbox:
  python: {}

reference:
  directory: ../..

dataset:
  rows:
    - id: decision-service
      request: >-
        Wrap the decision in a decision service, so other models can call it as
        one unit.
    - id: import
      request: >-
        Import our shared `SupplierTypes` model from `supplier-types.dmn`, so
        the supplier types are defined in one place.
    - id: context
      request: >-
        Write the decision's logic as a boxed context, with one entry for the
        onboarding check, one for the spend check, and a final result entry.

initial_prompt: |
  Create a UiPath Business Rules project named SupplierRules for our supplier
  approvals. ${row.request}

  - Inputs: `onboarded` (boolean) and `spend` (number).
  - Output: `approved` (boolean).
  - A supplier that is not onboarded is never approved.
  - An onboarded supplier is approved up to and including 25000, and not
    approved above that.

  There is no tenant to evaluate against, so do not run `uip rules debug`.
  Do not ask for confirmation.

success_criteria:
  - type: skill_triggered
    description: "Agent engaged the uipath-rules skill"
    skill_name: "uipath-rules"
    expected_skill: "uipath-rules"
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "The rule holds no decision service, import or context, and returns the policy's decision"
    command: "python3 $REFERENCE_DIR/author/unsupported_elements/check_unsupported_elements.py"
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "uip rules validate passes on the project"
    command: "python3 $REFERENCE_DIR/_shared/rules_check.py validate SupplierRules"
    timeout: 120
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "The diagram matches the model: uip rules format changes nothing"
    command: "python3 $REFERENCE_DIR/_shared/rules_check.py format SupplierRules"
    timeout: 120
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0
