task_id: skill-rules-e2e-graph-formula-and-model-debug
description: >
  Agent creates a Business Rules project whose band is a decision table, whose
  rate is a business knowledge model the fee calls, and whose fee is a literal
  expression, then verifies it with `uip rules debug` against a tenant with
  Business Rules enabled. Grades the debug command and the engine's band and
  fee on three cases. These are the two constructs the offline evaluator cannot
  run: arithmetic and a call. Their structure is graded by the author tasks.
tags: [uipath-rules, e2e, "mode:build", "lifecycle:generate", "outcome-graded"]

sandbox:
  python: {}
  template_sources:
    - type: template_dir
      path: ../../_setup
      mount_point: _setup

run_limits:
  # 1800 turn + 1500 for the engine grade + 300 margin. At 2400 an agent that used its
  # whole turn was killed partway through grading, which reads as a failure.
  task_timeout: 3600
  turn_timeout: 1800

reference:
  directory: ../..

initial_prompt: |
  Create a UiPath Business Rules project named FeeRules for our loan fees, and
  verify it returns the right answers before you finish. Keep it as one rule:

  Band
  - Input: `loanAmount` (number).
  - Output: `band` (string), "Small" below 50000 and "Large" from 50000 up.

  Rate
  - The rate per band is reused elsewhere, so put it in a business knowledge
    model: a Large loan is 0.015, a Small loan is 0.02.

  Fee
  - Reads the band and `loanAmount`, and calls the rate model.
  - Output: `fee` (number), the amount times the rate.
  - There are no cases to list, so write it as a formula, not a table.

  Do NOT publish or deploy anything. Do NOT ask for approval, confirmation, or
  feedback. Do NOT pause between planning and implementation.
  Before starting, load the uipath-rules skill and follow its workflow.

success_criteria:
  - type: command_executed
    description: "Agent verified the rule with rules debug"
    tool_name: "Bash"
    command_pattern: 'uip\s+rules\s+debug'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "The rules engine returns the expected band and fee for every case"
    command: "python3 $REFERENCE_DIR/lifecycle/formula_and_model_debug/check_formula_and_model_debug.py"
    timeout: 1500
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0

  - type: run_command
    description: "The diagram matches the model: uip rules format changes nothing"
    command: "python3 $REFERENCE_DIR/_shared/rules_check.py format FeeRules"
    timeout: 120
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

pre_run:
  # A tenant that cannot run Business Rules ends the run as ERROR, not as a skill failure.
  - command: 'python3 _setup/canary.py'
    timeout: 300
  # What is already on disk is not ours to delete; `solution_cleanup.py` says why.
  - command: 'python3 _setup/solution_cleanup.py record FeeRules'
    timeout: 60

# `rules debug` uploads a Studio Web solution per run; delete the ones this run created so they
# do not accumulate on the tenant, and only those.
post_run:
  - command: 'python3 _setup/solution_cleanup.py delete FeeRules || true'
    timeout: 180
