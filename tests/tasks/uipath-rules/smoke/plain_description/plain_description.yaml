task_id: skill-rules-smoke-plain-description
description: >
  Agent creates a Business Rules project from a prose shipping policy, with no
  source document, offline. The request has nothing to extract from, so the
  document-extraction route of the uipath-rules skill must not run. Grades skill
  activation, the scaffold and refresh commands, `uip rules validate` run by the
  grader, the authoring profile and entry-point contract, the fee for 12 hidden
  weight and membership scenarios (ranges written as intervals, never a comma
  list), the annotation per row, and that no extraction artifact exists: the
  extraction guides are not read, no cites.json is written,
  and the .dmn carries no uipdm element.
tags: [uipath-rules, smoke, "mode:build", "lifecycle:generate"]

sandbox:
  python: {}

reference:
  directory: ../..

initial_prompt: |
  Create a UiPath Business Rules project named ShippingFee for our shipping
  policy:

  - Inputs: `weightKg` (number) and `isPremium` (boolean).
  - Output: `shippingFee` (number), in dollars.
  - A standard order under 1 kg costs 5, from 1 kg up to 5 kg costs 8, from
    5 kg up to 20 kg costs 15, and 20 kg or more costs 30.
  - Premium members ship free under 5 kg and pay half the standard fee from
    5 kg up.

  There is no tenant to evaluate against, so do not run `uip rules debug`.
  Do not ask for confirmation.

success_criteria:
  - type: skill_triggered
    description: "Agent engaged the uipath-rules skill"
    skill_name: "uipath-rules"
    expected_skill: "uipath-rules"
    weight: 1.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent scaffolded the project with rules init"
    tool_name: "Bash"
    command_pattern: 'uip\s+rules\s+init'
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent regenerated the package files with rules refresh"
    tool_name: "Bash"
    command_pattern: 'uip\s+rules\s+refresh'
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "uip rules validate passes on the project"
    command: "python3 $REFERENCE_DIR/_shared/plain_check.py validate"
    timeout: 120
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "The rule follows the authoring profile, its entry point carries the contract, ranges are intervals, and it returns the policy's fee on all 12 scenarios"
    command: "python3 $REFERENCE_DIR/_shared/plain_check.py shipping"
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "Every rule carries an annotation naming its case"
    command: "python3 $REFERENCE_DIR/_shared/plain_check.py names"
    timeout: 30
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "No extraction artifact: no cites.json, no uipdm element in the .dmn"
    command: "python3 $REFERENCE_DIR/_shared/plain_check.py route"
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent did not read the extraction guides for a request with no source document"
    command_pattern: 'references/extraction/'
    min_count: 0
    max_count: 0
    weight: 2.0
    pass_threshold: 1.0
