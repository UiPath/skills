task_id: skill-rules-smoke-graph-unsupported-elements
description: >
  Agent is asked for a Business Rules project that cites a policy document as a
  knowledge source, which the skill does not author, offline. Grades skill
  activation, the rule holding no knowledge source, decision service, group or
  import, the approval on the policy cases, and `uip rules validate` run by the
  grader. Knowledge models and literal expressions are in the profile and are
  covered by their own tasks; this one holds the line on what is still out.
tags: [uipath-rules, smoke, "mode:build", "lifecycle:generate"]

sandbox:
  python: {}

reference:
  directory: ../..

initial_prompt: |
  Create a UiPath Business Rules project named SupplierRules for our supplier
  approvals. Cite our Procurement Policy 2026 as a knowledge source on the
  decision, so auditors can see where the thresholds come from:

  - Inputs: `onboarded` (boolean) and `spend` (number).
  - Output: `approved` (boolean).
  - A supplier that is not onboarded is never approved.
  - An onboarded supplier is approved up to and including 25000, and not
    approved above that.

  There is no tenant to evaluate against, so do not run `uip rules debug`.
  Do not ask for confirmation.

success_criteria:
  - type: skill_triggered
    description: "Agent engaged the uipath-rules skill"
    skill_name: "uipath-rules"
    expected_skill: "uipath-rules"
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "The rule holds no knowledge source, decision service, group or import, and returns the policy's decision"
    command: "python3 $REFERENCE_DIR/smoke/graph_unsupported_elements/check_graph_unsupported_elements.py"
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "uip rules validate passes on the project"
    command: "python3 $REFERENCE_DIR/_shared/rules_check.py validate SupplierRules"
    timeout: 120
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
