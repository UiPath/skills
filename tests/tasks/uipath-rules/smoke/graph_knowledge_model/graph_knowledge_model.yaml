task_id: skill-rules-smoke-graph-knowledge-model
description: >
  Agent creates a Business Rules project whose tier lookup sits in a business
  knowledge model the decision calls, with a note on the diagram, offline.
  Grades skill activation, the model carrying a variable and encapsulated
  logic, a decision actually calling it, the discounts the model answers, the
  annotation being tied to an element, no cards overlapping, and
  `uip rules validate` run by the grader.

  The prompt pins the model's signature — the parameter names and their order
  — which is what makes its values gradable offline: the encapsulated logic is
  a decision table like any other, so the same evaluator runs it against those
  parameters. Without the signature pinned the agent chose what the model took,
  and a model with the tiers swapped passed the whole task on structure alone.
  The *decision's* discount is still not graded here, because a call is FEEL the
  offline evaluator does not run and no e2e task covers DiscountRules.
tags: [uipath-rules, smoke, "mode:build", "lifecycle:generate"]

sandbox:
  python: {}

reference:
  directory: ../..

initial_prompt: |
  Create a UiPath Business Rules project named DiscountRules for our order
  discounts. The tier lookup is reused elsewhere, so put it in a business
  knowledge model and call it from the decision:

  - Inputs: `customerTier` (string), one of "Gold", "Silver", "Standard", and
    `orderTotal` (number).
  - Output: `discount` (number), a percentage.
  - Gold is 10, Silver is 5, Standard is 0.
  - For an order total of 1000 or more, Gold is 15, Silver is 7.5, and
    Standard is 2.
  - The knowledge model takes two parameters, `customerTier` then
    `orderTotal`, and answers with the discount.

  Add a note on the diagram saying the tiers are set by Sales and reviewed
  each quarter.

  There is no tenant to evaluate against, so do not run `uip rules debug`.
  Do not ask for confirmation.

success_criteria:
  - type: skill_triggered
    description: "Agent engaged the uipath-rules skill"
    skill_name: "uipath-rules"
    expected_skill: "uipath-rules"
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "The knowledge model carries a variable and logic, a decision calls it, it answers the policy's discount for every tier, the note is tied to an element, and no cards overlap"
    command: "python3 $REFERENCE_DIR/smoke/graph_knowledge_model/check_graph_knowledge_model.py"
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "uip rules validate passes on the project"
    command: "python3 $REFERENCE_DIR/_shared/rules_check.py validate DiscountRules"
    timeout: 120
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
