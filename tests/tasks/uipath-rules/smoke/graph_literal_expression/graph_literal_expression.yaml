task_id: skill-rules-smoke-graph-literal-expression
description: >
  Agent creates a Business Rules project whose band is a decision table and
  whose fee is a literal expression reading it, offline. Grades skill
  activation, the fee being a typed non-empty literalExpression with its own
  variable and no annotation column, the fee requiring the band, the band's
  values on four cases, no cards overlapping, and `uip rules validate` run by
  the grader. The fee arithmetic is graded by the engine in the e2e task.
tags: [uipath-rules, smoke, "mode:build", "lifecycle:generate"]

sandbox:
  python: {}

reference:
  directory: ../..

initial_prompt: |
  Create a UiPath Business Rules project named FeeRules for our loan fees.
  Keep them as two decisions in the one rule:

  Band
  - Input: `loanAmount` (number).
  - Output: `band` (string), "Small" below 50000 and "Large" from 50000 up.

  Fee
  - Reads the band and `loanAmount`.
  - Output: `fee` (number).
  - There are no cases to list, it is one calculation: a Large loan is
    1.5% of the amount, a Small loan is 2% of the amount. Write it as a
    formula, not a table.

  There is no tenant to evaluate against, so do not run `uip rules debug`.
  Do not ask for confirmation.

success_criteria:
  - type: skill_triggered
    description: "Agent engaged the uipath-rules skill"
    skill_name: "uipath-rules"
    expected_skill: "uipath-rules"
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "The fee is a typed literal expression requiring the band, the band's cases match, and no cards overlap"
    command: "python3 $REFERENCE_DIR/smoke/graph_literal_expression/check_graph_literal_expression.py"
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "uip rules validate passes on the project"
    command: "python3 $REFERENCE_DIR/_shared/rules_check.py validate FeeRules"
    timeout: 120
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
