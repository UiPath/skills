task_id: skill-rules-smoke-graph-unsupported-bkm
description: >
  Agent is asked for a Business Rules project that puts part of its logic in a
  business knowledge model, which the skill does not author, offline. Grades
  skill activation, the rule holding no business knowledge model and only
  decision tables, the discount on the policy cases, and `uip rules validate`
  run by the grader.
tags: [uipath-rules, smoke, "mode:build", "lifecycle:generate"]

sandbox:
  python: {}

reference:
  directory: ../..

initial_prompt: |
  Create a UiPath Business Rules project named DiscountRules for our order
  discounts. Put the tier lookup in a business knowledge model and call it
  from the decision:

  - Inputs: `customerTier` (string), one of "Gold", "Silver", "Standard", and
    `orderTotal` (number).
  - Output: `discount` (number), a percentage.
  - Gold is 10, Silver is 5, Standard is 0.
  - For an order total of 1000 or more, Gold is 15, Silver is 7.5, and
    Standard is 2.

  There is no tenant to evaluate against, so do not run `uip rules debug`.
  Do not ask for confirmation.

success_criteria:
  - type: skill_triggered
    description: "Agent engaged the uipath-rules skill"
    skill_name: "uipath-rules"
    expected_skill: "uipath-rules"
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "The rule holds no business knowledge model, only decision tables, and returns the policy's discount"
    command: "python3 $REFERENCE_DIR/smoke/graph_unsupported_bkm/check_graph_unsupported_bkm.py"
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "uip rules validate passes on the project"
    command: "python3 $REFERENCE_DIR/_shared/rules_check.py validate DiscountRules"
    timeout: 120
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
