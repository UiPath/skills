task_id: skill-rules-smoke-graph-extend-table
description: >
  Agent adds a second decision to an existing single-table Business Rules
  project, offline: an interest rate that reads the existing risk band and a
  new `loanAmount` input. Grades the original decision, its published entry
  point, its row annotations, and the shapes already on the diagram keeping
  their values, no two cards overlapping, the new decision requiring the
  original one, both decisions' values on the policy cases, and
  `uip rules validate` run by the grader.
tags: [uipath-rules, smoke, "mode:build", "lifecycle:generate"]

sandbox:
  python: {}
  template_sources:
    - type: template_dir
      path: fixtures

reference:
  directory: ../..

initial_prompt: |
  The `RiskRules/` folder is our UiPath Business Rules project for credit
  risk. A process is bound to its risk band, so that decision stays as it is.
  Add an interest rate to the same rule, as a second decision that builds on
  the risk band:

  - Inputs: the risk band and a new input `loanAmount` (number).
  - Output: `interestRate` (number).
  - High risk is 12.5.
  - Medium risk is 9 for a loan amount of 100000 or more, otherwise 8.
  - Low risk is 6 for a loan amount of 100000 or more, otherwise 5.5.

  There is no tenant to evaluate against, so do not run `uip rules debug`.
  Do not ask for confirmation.

success_criteria:
  - type: run_command
    description: "The original decision, its entry point, its row annotations, and its shapes are kept, no cards overlap, and the contract carries the new decision"
    command: "python3 $REFERENCE_DIR/smoke/graph_extend_table/check_graph_extend_table.py identity"
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "The rate decision requires the band decision and both return the policy's values"
    command: "python3 $REFERENCE_DIR/smoke/graph_extend_table/check_graph_extend_table.py behavior"
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "uip rules validate passes on the project"
    command: "python3 $REFERENCE_DIR/_shared/rules_check.py validate"
    timeout: 120
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "Every rule of both decisions carries an annotation naming its case"
    command: "python3 $REFERENCE_DIR/_shared/graph_check.py names RiskRules"
    timeout: 30
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent did not re-scaffold the existing project"
    tool_name: "Bash"
    command_pattern: 'uip\s+rules\s+init'
    weight: 1.0
    pass_threshold: 1.0
