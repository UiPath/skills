task_id: skill-rules-smoke-graph-repair
description: >
  Agent repairs a two-decision Business Rules project, offline: the rate
  decision requires an input that no longer exists, and the band decision
  requires the rate decision back, which makes a cycle `uip rules validate`
  does not report. Grades the agent running `uip rules validate`, the grader's
  own `uip rules validate` passing, the graph being acyclic and complete, both
  decisions keeping their ids and values, and the diagram and published entry
  points being kept.
tags: [uipath-rules, integration, "mode:diagnose", "lifecycle:generate"]

sandbox:
  python: {}
  template_sources:
    - type: template_dir
      path: fixtures

reference:
  directory: ../..

initial_prompt: |
  Our `LoanRules/` UiPath Business Rules project stopped working after
  someone edited it by hand. Fix it without changing what the rule returns:

  Risk band, from `creditScore` and `income`
  - A credit score below 580 is High risk.
  - A credit score from 580 up to 699 is Medium risk when income is at least
    50000, otherwise High risk.
  - A credit score of 700 or more is Low risk.

  Interest rate, from the risk band and `loanAmount`
  - High risk is 12.5.
  - Medium risk is 9 for a loan amount of 100000 or more, otherwise 8.
  - Low risk is 6 for a loan amount of 100000 or more, otherwise 5.5.

  There is no tenant to evaluate against, so do not run `uip rules debug`.
  Do not ask for confirmation.

success_criteria:
  - type: skill_triggered
    description: "Agent engaged the uipath-rules skill"
    skill_name: "uipath-rules"
    expected_skill: "uipath-rules"
    weight: 1.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent looked for the problems with rules validate"
    tool_name: "Bash"
    command_pattern: 'uip\s+rules\s+validate'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "uip rules validate passes on the repaired project"
    command: "python3 $REFERENCE_DIR/_shared/rules_check.py validate LoanRules"
    timeout: 120
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "The graph is acyclic and complete, both decisions keep their ids and values, and the diagram and entry points are kept"
    command: "python3 $REFERENCE_DIR/diagnose/repair_graph/check_repair_graph.py"
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent did not re-scaffold the existing project"
    tool_name: "Bash"
    command_pattern: 'uip\s+rules\s+init'
    weight: 1.0
    pass_threshold: 1.0
