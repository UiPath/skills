task_id: skill-rules-e2e-graph-import-and-debug
description: >
  Agent turns a two-decision `.dmn` file into a Business Rules project and
  verifies it with `uip rules debug` against a tenant with Business Rules
  enabled. The file's rate decision reads the band decision by its output
  column name, which `uip rules validate` passes. Grades the debug command
  and the rules engine's risk band and interest rate on six cases.
tags: [uipath-rules, e2e, "mode:build", "lifecycle:generate", "outcome-graded"]

sandbox:
  python: {}
  template_sources:
    - type: template_dir
      path: fixtures

run_limits:
  # 1800 turn + 1500 for the engine grade + 300 margin. At 2400 an agent that used its
  # whole turn was killed partway through grading, which reads as a failure.
  task_timeout: 3600
  turn_timeout: 1800

reference:
  directory: ../..

initial_prompt: |
  `loan-rules.dmn` is our loan policy rule, exported from another
  environment. Create a UiPath Business Rules project named LoanRules that
  holds it, and verify it returns the right answers before you finish:

  - The risk band is High for a credit score below 580, Medium from 580 up to
    699 when income is at least 50000 and High otherwise, and Low from 700.
  - The interest rate is 12.5 for High risk, 9 for Medium risk and a loan
    amount of 100000 or more and 8 otherwise, and 6 for Low risk and a loan
    amount of 100000 or more and 5.5 otherwise.

  Do NOT publish or deploy anything. Do NOT ask for approval, confirmation, or
  feedback. Do NOT pause between planning and implementation.
  Before starting, load the uipath-rules skill and follow its workflow.

success_criteria:
  - type: command_executed
    description: "Agent verified the rule with rules debug"
    tool_name: "Bash"
    command_pattern: 'uip\s+rules\s+debug'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "The rules engine returns the policy's risk band and interest rate for every case"
    command: "python3 $REFERENCE_DIR/_shared/graph_check.py engine"
    timeout: 1500
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0

# `rules debug` uploads a Studio Web solution per run; delete it so runs do not accumulate on the tenant.
post_run:
  - command: |
      python3 - <<'EOF' || true
      import glob, json, subprocess
      for path in glob.glob("**/*.uipx", recursive=True):
          solution_id = json.load(open(path)).get("SolutionId")
          if solution_id:
              subprocess.run(["uip", "solution", "delete", solution_id, "--yes", "--output", "json"], timeout=120)
      EOF
    timeout: 180
