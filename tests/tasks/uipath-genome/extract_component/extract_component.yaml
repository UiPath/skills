task_id: skill-genome-extract-component
description: >
  Smoke: the uipath-genome skill extracts one component genome from a staged three-workflow
  XAML project (mailbox intake, PDF field extraction, vendor validation, ERP queue handoff).
  Gates on the genome contract (core profile): one component genome, every section, valid skill
  names, steps and criteria, a Transactional Shape that is not the stub and names its unit of work
  (the per-email loop that queues each invoice), a Source Map naming the three workflows, and the
  source's business facts. The full format rules (strict profile: split options or the
  consumer-outside line, outcome rows) are graded as an advisory criterion. Tagged windows only so the Windows smoke
  workflow runs it: the Linux smoke workflow skips every skill that owns a windows-tagged task
  (execute_component), so without the tag no PR would run it.
tags: [uipath-genome, windows, smoke, mode:build, lifecycle:generate]

sandbox:
  template_sources:
    - type: template_dir
      path: fixtures

# run_command goes through cmd.exe on Windows, so every check calls the skill's check-genome.py
# through `python -c` and reads REFERENCE_DIR (the skill's scripts folder) from the environment. The
# genome's file name is the agent's choice: the checker resolves the "*-genome.md" pattern itself.
reference:
  directory: ../../../../skills/uipath-genome/scripts

initial_prompt: |
  The UiPath Studio project in `InvoiceIntake/` was inherited from another team.
  Extract a genome from it so we have a ground-truth blueprint of what it does.
  Write the genome into the current directory. There are no other resources
  for this process beyond the project itself. Do not run any `uip` commands.

success_criteria:
  - type: skill_triggered
    description: "Agent engaged the uipath-genome skill"
    skill_name: "uipath-genome"
    expected_skill: "uipath-genome"
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "Exactly one component genome written"
    command: >-
      python -c "import os, subprocess, sys; sys.exit(subprocess.call([sys.executable,
      os.path.join(os.environ['REFERENCE_DIR'], 'check-genome.py'), 'tokens', '*-genome.md',
      '--files', '1', '--expect', 'UIPATH-AUTOMATION-GENOME: component']))"
    timeout: 60
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "Genome meets the core contract, describes a transactional flow, with a Source Map naming the three workflows"
    command: >-
      python -c "import os, subprocess, sys; sys.exit(subprocess.call([sys.executable,
      os.path.join(os.environ['REFERENCE_DIR'], 'check-genome.py'), 'component', '*-genome.md',
      '--profile', 'core', '--expect', 'uipath-rpa', 'ERP_InvoicePosting', '--shape', 'transactional',
      '--source-map', 'Main.xaml', 'ValidateInvoice.xaml', 'ExtractInvoiceFields.xaml']))"
    timeout: 60
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "Business rules and configuration carry the source's thresholds and names"
    command: >-
      python -c "import os, subprocess, sys; sys.exit(subprocess.call([sys.executable,
      os.path.join(os.environ['REFERENCE_DIR'], 'check-genome.py'), 'tokens', '*-genome.md',
      '--min', '0.8', '--expect', 'credit limit', 'approved vendor', 'ERP_InvoicePosting',
      'ap-lead@contoso.com', 'imap.contoso.com']))"
    timeout: 60
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "Target applications and the failure path come from the source"
    command: >-
      python -c "import os, subprocess, sys; sys.exit(subprocess.call([sys.executable,
      os.path.join(os.environ['REFERENCE_DIR'], 'check-genome.py'), 'tokens', '*-genome.md',
      '--min', '0.75', '--expect', 'Excel', 'IMAP', 'PDF', 'Failed']))"
    timeout: 60
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Extraction does not build or run the project"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+rpa\s+(run|build|debug)'
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "Advisory: genome meets every mechanical format rule (strict profile)"
    command: >-
      python -c "import os, subprocess, sys; sys.exit(subprocess.call([sys.executable,
      os.path.join(os.environ['REFERENCE_DIR'], 'check-genome.py'), 'component', '*-genome.md',
      '--profile', 'strict']))"
    timeout: 60
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 0
