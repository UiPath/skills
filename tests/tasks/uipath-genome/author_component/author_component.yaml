task_id: skill-genome-author-component
description: >
  Smoke: the uipath-genome skill authors one component genome from a described sheet-to-web-client
  process worked by a pool of robots. Gates on the genome contract (core profile) and on the
  Transactional Shape it must describe: one flow whose unit of work is a sheet row. The full format
  rules (strict profile: outcome rows, split options per unit, retry and consecutive-failure stop,
  configuration question kinds) are graded as an advisory criterion. Tagged windows only so the
  Windows smoke workflow runs it: the Linux smoke workflow skips every skill that owns a
  windows-tagged task (execute_component), so without the tag no PR would run it.
tags: [uipath-genome, windows, smoke, mode:build, lifecycle:generate]

# run_command goes through cmd.exe on Windows, so every check calls the skill's check-genome.py
# through `python -c` and reads REFERENCE_DIR (the skill's scripts folder) from the environment. The
# genome's file name is the agent's choice: the checker resolves the "*-genome.md" pattern itself.
reference:
  directory: ../../../../skills/uipath-genome/scripts

initial_prompt: |
  Write a genome for an automation called "Customer Address Sync" and save it in the
  current directory.

  Every weekday at 07:00 a robot reads the "Pending" sheet of the address-change workbook
  on the operations share (around 200 rows a day: customer number, new street address,
  postcode, city, country, requester email) and hands each row to a pool of two robots
  that update the customer's address in the Dynamics 365 web client (sign in with the CRM
  robot account, open the customer, replace the address, save, read back the change
  number) and email the requester the change number. A row whose customer number is
  unknown in Dynamics 365, or whose postcode fails the country's format, must be rejected
  with an email to the requester and never retried; a web client timeout or a lost session
  must be retried before the row is given up on. Operations wants to see the status of
  every row of the day and a summary when the run ends. Document it as one project with
  two entry points.

  Do not ask follow-up questions — take the defaults. Do not run any `uip` commands.

success_criteria:
  - type: skill_triggered
    description: "Agent engaged the uipath-genome skill"
    skill_name: "uipath-genome"
    expected_skill: "uipath-genome"
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "Exactly one component genome written"
    command: >-
      python -c "import os, subprocess, sys; sys.exit(subprocess.call([sys.executable,
      os.path.join(os.environ['REFERENCE_DIR'], 'check-genome.py'), 'tokens', '*-genome.md',
      '--files', '1', '--expect', 'UIPATH-AUTOMATION-GENOME: component']))"
    timeout: 60
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "Genome meets the core contract and describes one flow whose unit of work is a row"
    command: >-
      python -c "import os, subprocess, sys; sys.exit(subprocess.call([sys.executable,
      os.path.join(os.environ['REFERENCE_DIR'], 'check-genome.py'), 'component', '*-genome.md',
      '--profile', 'core', '--expect', 'uipath-rpa', 'Dynamics 365',
      '--shape', 'transactional', '--flows', '1', '--unit', 'row']))"
    timeout: 60
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "Business rules, schedule and notification target come from the description"
    command: >-
      python -c "import os, subprocess, sys; sys.exit(subprocess.call([sys.executable,
      os.path.join(os.environ['REFERENCE_DIR'], 'check-genome.py'), 'tokens', '*-genome.md',
      '--min', '0.75', '--expect', 'postcode', '07:00', 'requester', 'customer number']))"
    timeout: 60
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Authoring does not scaffold, build or run a project"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+rpa\s+(init|run|build|debug)'
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "Advisory: genome meets every mechanical format rule (strict profile)"
    command: >-
      python -c "import os, subprocess, sys; sys.exit(subprocess.call([sys.executable,
      os.path.join(os.environ['REFERENCE_DIR'], 'check-genome.py'), 'component', '*-genome.md',
      '--profile', 'strict']))"
    timeout: 60
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 0
