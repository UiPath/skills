task_id: skill-genome-interview-build-no-sdd
description: >
  Integration: `uipath-genome` builds an authored genome that has no SDD and no readiness file, for a
  user who says they are the process owner. The genome holds twelve open entries: business outcomes
  D2–D11, and two readings, D1 (how SAP is reached) and D12 (how a supplier is found). No file holds an
  answer, so the build offers no edits before its first question, and it neither writes nor asks for an
  SDD. It asks the open business outcomes itself and lists the readings as unconfirmed. An answer that
  keeps what the genome builds changes nothing, and the build never edits the genome. The request stops
  the run before any project is created, so it ends in the build's question phase. A simulated process
  owner answers.
tags: [uipath-genome, integration, mode:build, lifecycle:generate, feature:conversational]

run_limits:
  turn_timeout: 1800
  task_timeout: 3600

sandbox:
  template_sources:
    - type: template_dir
      path: ../../../uipath-planner/interview/interview_genome/fixtures
    # Backstop for the request's stop: .claude/settings.json denies writing a project or workflow
    # (Claude Code reads it; other harnesses do not).
    - type: template_dir
      path: ../../../uipath-planner/interview/_setup/build_stop

reference:
  directory: ../../../uipath-planner/interview

initial_prompt: |
  Build the genome in this folder with uipath-genome.

  I'm the process owner. Use Sonnet subagents for reading. In this run, go as far as the build's questions: ask them, then stop before creating any project.

simulation:
  enabled: true
  persona: |
    You are the process owner of supplier invoice entry and approval. You decide business outcomes and
    rules. You do not know how the robot reaches SAP, nor the tenants, folders and machines.
  goal: |
    Get the automation built from the genome, answering the questions that are yours.
  constraints:
    - "When asked how you want to answer, choose to go through every question, a batch at a time."
    - "When a question lists options, pick the one marked as built now; otherwise the one marked Recommended; otherwise the first. Answer every question of a batch."
    - "When asked for a preferences file, answer that you have none."
    - "When a question asks for something you do not know (how SAP is reached, a tenant, a folder, a machine), say it is for the system's owner or the environment's owners."
    - "Once the build has asked its questions and stops before creating a project, or reports that it cannot create one, end the conversation."
  max_turns: 16

success_criteria:
  - type: skill_triggered
    description: "Agent engaged the uipath-genome skill"
    skill_name: "uipath-genome"
    expected_skill: "uipath-genome"
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "No SDD was written"
    command: "node $REFERENCE_DIR/_shared/check_interview.mjs absent 'sdd(\\.draft)?\\.md$'"
    timeout: 30
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "The genome is unchanged: answers that keep what it builds change nothing"
    command: >-
      node $REFERENCE_DIR/_shared/check_interview.mjs unchanged supplier-invoice-entry-and-approval-genome.md
      a68dbce8f3bf5a87faf9108f0ba4ce755207a4532d831b388ddfef5711d8eec8
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: llm_judge
    description: "The build asks the open business outcomes, lists the readings as unconfirmed, and never asks for an SDD"
    include_dialog: true
    include_tool_calls: true
    include_reference: false
    prompt: |
      The user, the process owner, asked the build skill to build a genome (an automation blueprint) that
      has no SDD (solution design document) beside it. The genome's open entries: D2–D11 are business
      outcomes; D1 (how SAP is reached) and D12 (how a supplier is found) are readings. Read the dialog and
      the agent's questions, whether asked in chat or as structured questions.

      Check four things:
      1. Before its first question, the agent does not offer to apply edits or answers from a file.
      2. The agent asks the open business outcomes (D2–D11) itself.
      3. The readings D1 and D12 are listed as unconfirmed, not built as settled facts without a word.
      4. The agent neither asks for an SDD nor offers to write one.

      Score 1.0 when all four hold, 0.75 with three, 0.5 with two, 0.0 otherwise.
    weight: 3.0
    pass_threshold: 0.75
