task_id: skill-solution-resources-refresh
description: >
  Integration test: agent uses the uipath-solution skill to run
  `uip solution resources refresh` so the solution-folder artefacts and
  bindings reflect the registered projects before packing. Exercises the
  core sync mechanism (Critical Rule "refresh before pack/upload") that
  every binding-dependent test relies on implicitly but none asserts.
  Runs entirely in the sandbox tempdir — no tenant interaction.

  The prompt deliberately carries a runtime signal ("cross-platform") and a
  don't-block instruction: the scaffolded project is incidental to the
  tested surface, and without a framework signal uipath-rpa SKILL.md Rule
  2a mandates AskUserQuestion — which dead-ends a headless eval (nightly
  2026-08-07: agent stopped at "which runtime should I register?" and never
  ran resources refresh).
tags: [uipath-solution, integration, mode:build, lifecycle:setup]

run_limits:
  expected_turns: 12

initial_prompt: |
  I'm preparing a UiPath solution for packaging.

  1. Create a new UiPath solution called "BillingSuite" and register a
     project into it — scaffold a minimal cross-platform project if you
     need one.
  2. Make sure the solution's bundled resources / bindings are synced to
     the current solution state so it's ready to pack.
  3. Confirm the resources are in sync and tell me you're ready to pack.

  Pick sensible defaults for anything I haven't pinned down — please take
  it all the way through without stopping to ask me questions.

success_criteria:
  - type: command_executed
    description: "Agent created a solution via uip solution init (or pre-rename `new`)"
    tool_name: "Bash"
    command_pattern: 'uip\s+solution\s+(init|new)\s+.*BillingSuite'
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0

  - type: json_check
    description: "Solution has a project registered, so refresh acts on real state (not a no-op on an empty solution)"
    path: "BillingSuite/BillingSuite.uipx"
    assertions:
      - expression: "length(Projects)"
        operator: gte
        expected: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent synced bundled artefacts via uip solution resources refresh"
    tool_name: "Bash"
    command_pattern: 'uip\s+solution\s+resources\s+refresh\b(?!\s+(?:--help|-h)\b)'
    min_count: 1
    weight: 2.5
    pass_threshold: 1.0

  # Behavioural stand-in for "confirm the resources are in sync": refresh's
  # observable effect is the generated solution_folder artefacts, so assert
  # those instead of the agent's own claim that it synced. Project name is
  # agent-chosen (the prompt lets it scaffold one), so glob rather than
  # naming a file. Replaced an llm_judge that graded the final reply's
  # wording — a self-report, and redundant with the two criteria above.
  - type: run_command
    description: "refresh materialised solution_folder artefacts (resources actually in sync, not just claimed)"
    command: "python3 -c \"import pathlib,sys; sys.exit(0 if list(pathlib.Path('BillingSuite/resources/solution_folder').rglob('*.json')) else 1)\""
    timeout: 30
    weight: 1.5
    pass_threshold: 1.0
