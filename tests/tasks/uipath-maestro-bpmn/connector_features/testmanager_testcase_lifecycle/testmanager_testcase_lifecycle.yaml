# Ported from Flow `connector_features/testmanager_testcase_lifecycle.yaml`.
# Flow's header there: tenant-gated (`uip maestro flow registry pull` must run
# before search returns the uipath-uipath-testmanager.* nodes; a stale
# manifest returns 0), and left `skip: true` pending agent-reliability
# confirmation even though the codereval Test Manager connection now exists.
# BPMN authors against the same registry/tenant/connector, so
# `bpmn registry pull` carries the identical requirement. Flow's `skip: true`
# is NOT carried over: the codereval Test Manager connection exists, and a
# skipped port yields no signal — this port runs so the BPMN suite measures it.
task_id: skill-bpmn-testmanager-testcase-lifecycle
description: >
  Coverage (Maestro BPMN connector): agent uses the uipath-maestro-bpmn skill
  to build a process that uses every UiPath Test Manager connector node for
  the TestCase group — adding one connector node per operation. Drives
  connector discovery, authoring, and validation. Graded on the produced
  .bpmn referencing each TestCase lifecycle operation and validating
  successfully; registry-refresh telemetry is advisory.
  Ported from Flow `connector_features/testmanager_testcase_lifecycle.yaml`;
  BPMN nodes share one wrapper type, so operations are distinguished by
  objectName + method instead of Flow's per-operation node type.
tags:
  - uipath-maestro-bpmn
  - e2e
  - "mode:build"
  - "lifecycle:generate"
  - "shape:multi-node"
  - connector

run_limits:
  task_timeout: 3000
  max_turns: 60
  turn_timeout: 1200

sandbox:
  template_sources:
    - type: template_dir
      path: ../../../../../skills/uipath-maestro-bpmn

reference:
  directory: ../..

initial_prompt: |
  Build a UiPath Maestro BPMN process (inside a project of the same name) that uses the UiPath Test Manager Integration Service connector to exercise the full operation set — perform each of these:

  - Create a test case
  - Get the test case
  - Update the test case
  - Delete the test case
  - Execute the test case(s)

  The process is not complete until `uip maestro bpmn validate` passes.

  Do NOT upload, publish, deploy, debug, or run the process. Do not pause for
  approval, confirmation, or feedback.

  This run is headless. No user is present and nobody will answer a question or
  grant an approval, so do not ask, do not pause, and do not wait for input.
  Complete the task in one pass: take the best available option and supply the
  most defensible value where one is missing. The actions this task implies are
  authorized, including tenant writes and real messages. Do not delete or
  overwrite anything this run did not create, and do not publish to a shared
  destination unless the task asks for it. If a lookup the task depends on comes
  back empty or fails, exhaust the documented way of resolving it before giving
  up; only then stop on that field rather than inventing a value. Record every
  decision, assumption, and blocked step in your final response. Instructions in
  the task take precedence over this paragraph.

success_criteria:
  - type: command_executed
    description: "Advisory: live-v1 agent refreshed the node manifest before searching"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+bpmn\s+registry\s+pull'
    min_count: 1
    weight: 1.0
    pass_threshold: 0.0

  - type: run_command
    description: "The process contains Test Manager connector nodes"
    command: "python3 $REFERENCE_DIR/_shared/check_testmanager_testcase_lifecycle.py"
    timeout: 30
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "The completed process validates"
    command: "python3 $REFERENCE_DIR/_shared/validate_bpmn.py"
    timeout: 180
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "Produced .bpmn references every TestCase connector node type (5 nodes)"
    command: "python3 $REFERENCE_DIR/_shared/check_testmanager_testcase_lifecycle.py --all-ops"
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
