# skip:true until it passes on the is_e2e_testmanager tenant. Known blocker: the uip
# CLI uppercases trigger operations, and Test Manager's are mixed case
# (Created/Updated/Finished) — see uipath-maestro-bpmn registry-workflow.md and
# tests/tasks/uipath-platform/integration-service/testmanager/_tm_events/README.md.
task_id: skill-bpmn-testmanager-trigger-updated-testcase
description: >
  E2E (Maestro BPMN, Test Manager connector event): agent builds a workflow that
  starts on the uipath-uipath-testmanager "Record Updated" trigger for Test Case,
  deploys it, fires the event against a uniquely-seeded record, and records what
  it fired. Graded on the trigger artifact, validation, the deploy, and a live
  re-query proving the deployed workflow ran Successful with a payload carrying
  the entity type, record id, project id and key fields. post_run removes the
  deployment and every record the run created, pass or fail.
tags: [uipath-maestro-bpmn, e2e, mode:build, lifecycle:setup, connector, feature:trigger, feature:records]
skip: true

sandbox:
  python: {}
  template_sources:
    - type: template_dir
      path: ../../../uipath-platform/integration-service/testmanager/_tm_events/_setup
      mount_point: _setup
    - type: template_dir
      path: ../../../uipath-maestro-bpmn/_setup
      mount_point: _setup

reference:
  directory: ../../../uipath-platform/integration-service/testmanager/_tm_events

run_limits:
  expected_turns: 45
  max_turns: 90
  turn_timeout: 1200
  task_timeout: 3000

pre_run:
  - command: 'python3 "_setup/preflight_connections.py" uipath-uipath-testmanager'
    timeout: 120
  - command: "python3 _setup/seed.py --operation Updated --object-type TestCase"
    timeout: 30

post_run:
  - command: "python3 _setup/cleanup.py"
    timeout: 300

initial_prompt: |
  Read seed.json and use its values throughout.

  Build a UiPath Maestro BPMN process (inside a project named after `process_name`) that
  starts on the UiPath Test Manager connector trigger "Record Updated" with object type
  `TestCase`, scoped to the Test Manager project `project_key`. The process returns the
  event's record as its output.

  The output carries `objectType` (the Test Manager object type), `id`, `projectId`,
  and `name`, `description` from the event's record.

  Package the project in a solution and deploy it with the deployment name
  `deployment_name`, so the event subscription is live in the tenant.

  Then fire the event: create a Test Case named `marker` in that project, then update its description to `updated_description`.
  Wait until the deployed workflow has run on that event; delivery can take several
  minutes after the change.

  Record result.json with `connection_id` (the Test Manager connection), `project_id`
  (the project's id), `record_id` (the Test Case), and `created`: every Test Manager record
  you created, as `{"object": <object name>, "id": <id>}`. Leave the records and the
  deployment in place; they are removed after grading.

  This run is headless. No user is present and nobody will answer a question or
  grant an approval, so do not ask, do not pause, and do not wait for input.
  Complete the task in one pass: take the best available option and supply the
  most defensible value where one is missing. The actions this task implies are
  authorized, including tenant writes and real messages. Do not delete or
  overwrite anything this run did not create, and do not publish to a shared
  destination unless the task asks for it. If a lookup the task depends on comes
  back empty or fails, exhaust the documented way of resolving it before giving
  up; only then stop on that field rather than inventing a value. Record every
  decision, assumption, and blocked step in your final response. Instructions in
  the task take precedence over this paragraph.

success_criteria:
  - type: command_executed
    description: "Advisory: refreshed the node manifest"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+bpmn\s+registry\s+pull'
    min_count: 1
    weight: 1.0
    pass_threshold: 0.0

  - type: run_command
    description: "The process starts on an Intsvc.EventTrigger for Test Manager Record Updated / TestCase"
    command: "python3 $REFERENCE_DIR/check_trigger_run.py --artifact bpmn"
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "The process passes `uip maestro bpmn validate`"
    command: "python3 $REFERENCE_DIR/check_trigger_run.py --validate bpmn"
    timeout: 180
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Materialized the trigger's connection binding (`uip maestro bpmn refresh`)"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+bpmn\s+refresh'
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Deployed the solution so the subscription is live"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+solution\s+deploy\s+run'
    min_count: 1
    require_success: true
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "E2E: the deployed workflow ran Successful on the Record Updated event and returned entity type, record id, project id and key fields"
    command: "python3 $REFERENCE_DIR/check_trigger_run.py --live"
    timeout: 300
    expected_exit_code: 0
    weight: 6.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Did not start the workflow by hand; only the event trigger may start it"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+or\s+jobs\s+(start|restart)'
    weight: 2.0
    pass_threshold: 1.0
