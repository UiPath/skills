task_id: skill-bpmn-datafabric-smoke-update
description: >
  Smoke: Create -> UpdateEntityRecordV2 (single-field score change) -> Get ->
  Delete. Verifies partial update wiring and update body contains only the
  target field. Static-validate only; runtime `bpmn debug` skipped to avoid
  live tenant side effects. Count enforcement lives in the verifier script
  (counts nodes in the final .bpmn, not CLI invocations).
  Ported from Flow `connector_features/datafabric_connector/smoke_update.yaml`;
  connector activities are modeled as bpmn:sendTask nodes carrying the
  registry Intsvc.ActivityExecution wrapper instead of Flow connector nodes.
tags:
  - uipath-maestro-bpmn
  - smoke
  - "mode:build"
  - "lifecycle:generate"
  - connector
  - uipath-uipath-dataservice

sandbox:
  template_sources:
    - type: template_dir
      path: ../../../../../../skills/uipath-maestro-bpmn
    - type: template_dir
      path: ../../../_setup
      mount_point: _setup
    - type: template_dir
      path: ../_setup
      mount_point: _setup

run_limits:
  max_turns: 100
  turn_timeout: 1500
  task_timeout: 3600

reference:
  directory: ../../..

pre_run:
  - command: 'python3 "_setup/preflight_connections.py" uipath-uipath-dataservice'
    timeout: 120
  - command: 'python3 "_setup/ensure_entity.py" "_setup/flow_code_eval_entity.entity.json"'
    timeout: 60

initial_prompt: |
  Build this with the UiPath Data Service Integration Service connector
  (`uipath-uipath-dataservice`) activities for every entity operation.

  Build a UiPath Maestro BPMN process against FlowCodeEvalEntity that:

  1. Creates a record: title="SmokeUpdateTest", score=5.0, viewCount=100, active=false, releaseDate="2022-01-01".
  2. Updates only the score to 9.0 — the update body should carry score and nothing else.
  3. Retrieves the record by Id to confirm.
  4. Deletes the record.

  Use the Data Service Integration Service connector activities for these
  operations.

  The process is not complete until `uip maestro bpmn validate` passes.

  Do NOT upload, publish, deploy, debug, or run the process. Do not pause for
  approval, confirmation, or feedback.

  This run is headless. No user is present and nobody will answer a question or
  grant an approval, so do not ask, do not pause, and do not wait for input.
  Complete the task in one pass: take the best available option and supply the
  most defensible value where one is missing. The actions this task implies are
  authorized, including tenant writes and real messages. Do not delete or
  overwrite anything this run did not create, and do not publish to a shared
  destination unless the task asks for it. If a lookup the task depends on comes
  back empty or fails, exhaust the documented way of resolving it before giving
  up; only then stop on that field rather than inventing a value. Record every
  decision, assumption, and blocked step in your final response. Instructions in
  the task take precedence over this paragraph.
success_criteria:
  - type: command_executed
    description: "BPMN validated"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+bpmn\s+validate'
    min_count: 1
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "Final .bpmn has Create + Update + Get + Delete DF nodes on FlowCodeEvalEntity"
    command: "python3 $REFERENCE_DIR/_shared/check_df_smoke_update.py --ops"
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "Update node body contains only score (partial-update discipline)"
    command: "python3 $REFERENCE_DIR/_shared/check_df_smoke_update.py --partial"
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0
