task_id: skill-bpmn-datafabric-query-every-row
description: >
  Integration: a request to read every record of a Data Fabric entity. A query
  returns at most `limit` records and `limit` stops at 1000, so one query
  silently drops every record past the first page (MW-281). The process must
  page: a Query Entity Records node on a loop, its `start` an `=`-expression.
  Static-validate only.
tags:
  - uipath-maestro-bpmn
  - integration
  - "mode:build"
  - "lifecycle:generate"
  - "shape:multi-node"
  - connector

sandbox:
  template_sources:
    - type: template_dir
      path: ../../../_setup
      mount_point: _setup
    - type: template_dir
      path: ../_setup
      mount_point: _setup

run_limits:
  expected_turns: 40
  task_timeout: 2400
  max_turns: 120
  turn_timeout: 1800

reference:
  directory: ../../..

pre_run:
  - command: 'python3 "_setup/preflight_connections.py" uipath-uipath-dataservice'
    timeout: 120
  - command: 'python3 "_setup/ensure_entity.py" "_setup/flow_code_eval_entity.entity.json"'
    timeout: 60

initial_prompt: |
  Build a UiPath Maestro BPMN process that reads every record of the Data
  Fabric entity FlowCodeEvalEntity and returns, as the process output
  `activeCount`, how many of them have `active` set to true.

  The process is not complete until `uip maestro bpmn validate` passes.

  Do NOT upload, publish, deploy, debug, or run the process. Do not pause for
  approval, confirmation, or feedback.

  This run is headless. No user is present and nobody will answer a question or
  grant an approval, so do not ask, do not pause, and do not wait for input.
  Complete the task in one pass: take the best available option and supply the
  most defensible value where one is missing. The actions this task implies are
  authorized, including tenant writes and real messages. Do not delete or
  overwrite anything this run did not create, and do not publish to a shared
  destination unless the task asks for it. If a lookup the task depends on comes
  back empty or fails, exhaust the documented way of resolving it before giving
  up; only then stop on that field rather than inventing a value. Record every
  decision, assumption, and blocked step in your final response. Instructions in
  the task take precedence over this paragraph.
success_criteria:
  - type: command_executed
    description: "BPMN file was validated"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+bpmn\s+validate'
    min_count: 1
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "A Query Entity Records node on FlowCodeEvalEntity loops with an =-expression start and a limit of at most 1000"
    command: "python3 $REFERENCE_DIR/_shared/check_df_query_every_row.py paged"
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "The paged query sorts, so pages neither repeat nor skip records"
    command: "python3 $REFERENCE_DIR/_shared/check_df_query_every_row.py sorted"
    timeout: 30
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 1.0
