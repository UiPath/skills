task_id: skill-bpmn-datafabric-integration-create-get
description: >
  Integration test for the UiPath Data Fabric (Integration Service) connector
  in Maestro BPMN. Covers Create + Get round-trip on FlowCodeEvalEntity (C-01)
  and expansionLevel comparison across levels 1, 2, and 3 (C-02).
  Static-validate only; runtime `bpmn debug` skipped to avoid live tenant
  side effects (same scope as the Flow original).
  Ported from Flow `connector_features/datafabric_connector/integration_create_get.yaml`;
  connector activities are modeled as bpmn:sendTask nodes carrying the registry
  Intsvc.ActivityExecution wrapper instead of Flow connector nodes. Flow's
  `flow node add uipath.connector.uipath-uipath-dataservice.*` authoring step
  maps to `bpmn registry get Intsvc.ActivityExecution --object-name <Object>`
  (BPMN has no native Data Fabric node, so the Flow prompt's contrast against
  `core.datafabric.*` is dropped). The connector skill emits two valid
  activity shapes for the same operation: the curated per-operation objectName
  (e.g. `CreateEntityRecordCurated`), or the generic entity-CRUD form where
  every node's objectName is the entity name itself and the verb lives in
  `operation`/`method` instead; both are accepted by the grader and by the
  advisory registry-get criteria below.
tags:
  - uipath-maestro-bpmn
  - integration
  - "mode:build"
  - "lifecycle:generate"
  - "shape:multi-node"
  - connector
  - uipath-uipath-dataservice
  - "feature:connections"

sandbox:
  template_sources:
    - type: template_dir
      path: ../../../../../../skills/uipath-maestro-bpmn
    - type: template_dir
      path: ../../../_setup
      mount_point: _setup
    - type: template_dir
      path: ../_setup
      mount_point: _setup

run_limits:
  expected_turns: 40
  task_timeout: 1500
  max_turns: 120
  turn_timeout: 1200

reference:
  directory: ../../..

pre_run:
  - command: 'python3 "_setup/preflight_connections.py" uipath-uipath-dataservice'
    timeout: 120
  - command: 'python3 "_setup/ensure_entity.py" "_setup/flow_code_eval_entity.entity.json"'
    timeout: 60

initial_prompt: |
  Build this with the UiPath Data Service Integration Service connector
  (`uipath-uipath-dataservice`) activities for every entity operation.

  Build a UiPath Maestro BPMN process that exercises FlowCodeEvalEntity in two
  scenarios:

  C-01 — All eight fields round-trip:
  Create a record with:
    * title: 'IntegrationCreateTest'
    * description: 'A sci-fi integration test record. A must-watch film.'
    * score: 6.75
    * viewCount: 420
    * active: true
    * releaseDate: '2023-08-20'
    * lastUpdated: '2023-08-20T14:00:00'
    * externalId: any valid UUID value of your choice
  Retrieve it by Id and delete when done.

  C-02 — Expansion depth:
  Create a second record with title='ExpansionTest', score=5.5. Retrieve it
  at expansionLevel=1, expansionLevel=2, and expansionLevel=3. Delete when
  done.

  Use the Data Service Integration Service connector activities for these
  operations.

  The process is not complete until `uip maestro bpmn validate` passes.

  This run is headless. No user is present and nobody will answer a question or
  grant an approval, so do not ask, do not pause, and do not wait for input.
  Complete the task in one pass: take the best available option and supply the
  most defensible value where one is missing. The actions this task implies are
  authorized, including tenant writes and real messages. Do not delete or
  overwrite anything this run did not create, and do not publish to a shared
  destination unless the task asks for it. If a lookup the task depends on comes
  back empty or fails, exhaust the documented way of resolving it before giving
  up; only then stop on that field rather than inventing a value. Record every
  decision, assumption, and blocked step in your final response. Instructions in
  the task take precedence over this paragraph.
success_criteria:
  - type: command_executed
    description: "Advisory: agent queried the registry for Create Entity Record"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+bpmn\s+registry\s+get\s+Intsvc\.ActivityExecution\b[^\n]*--object-name\s+"?(CreateEntityRecordCurated|CreateEntityRecord_V3|FlowCodeEvalEntity)'
    min_count: 1
    weight: 1.5
    pass_threshold: 0.0

  - type: command_executed
    description: "Advisory: agent queried the registry for Get Entity Record By Id"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+bpmn\s+registry\s+get\s+Intsvc\.ActivityExecution\b[^\n]*--object-name\s+"?(GetEntityRecordByIdCurated|GetEntityRecord_V3|FlowCodeEvalEntity)'
    min_count: 1
    weight: 2.0
    pass_threshold: 0.0

  - type: command_executed
    description: "Advisory: agent queried the registry for Delete Entity Record"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+bpmn\s+registry\s+get\s+Intsvc\.ActivityExecution\b[^\n]*--object-name\s+"?(DeleteEntityRecordCurated|DeleteEntityRecord_V3|FlowCodeEvalEntity)'
    min_count: 1
    weight: 1.5
    pass_threshold: 0.0

  - type: command_executed
    description: "BPMN file was validated"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+bpmn\s+validate'
    min_count: 1
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "BPMN has Create-then-Get chains on FlowCodeEvalEntity, and Get nodes cover expansionLevel {1,2,3}"
    command: "python3 $REFERENCE_DIR/_shared/check_df_integration_create_get.py"
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
