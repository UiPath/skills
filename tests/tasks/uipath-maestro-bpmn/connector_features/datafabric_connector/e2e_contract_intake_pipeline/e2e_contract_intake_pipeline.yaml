task_id: skill-bpmn-datafabric-e2e-contract-intake-pipeline
description: >
  E2E test for the UiPath Data Fabric connector — the full CRUD activity
  surface exercised in one process on a single ContractRegistry record.
  Focus is on DF activity payloads and Create-output-Id chaining across
  Get / Update / Delete; orchestration primitives (loops, decisions,
  multi-branch fan-out) are covered by core-BPMN tests, not here.
  Static-validate only; runtime `bpmn debug` skipped to avoid live tenant
  side effects.
  Ported from Flow
  `connector_features/datafabric_connector/e2e_contract_intake_pipeline.yaml`;
  connector activities are modeled as bpmn:sendTask nodes carrying the
  registry Intsvc.ActivityExecution wrapper, and the `--shape` mode checks
  only that each connector-keyed sendTask carries that typed wrapper (Flow's
  manifest-diff checks need a live registry call and have no static analog
  here).
tags: [uipath-maestro-bpmn, e2e, "mode:build", "lifecycle:generate", "shape:multi-node", connector, uipath-uipath-dataservice]

run_limits:
  expected_turns: 40
  max_turns: 100
  turn_timeout: 2700
  task_timeout: 5400

sandbox:
  template_sources:
    - type: template_dir
      path: ../../../../../../skills/uipath-maestro-bpmn
    - type: template_dir
      path: ../../../_setup
      mount_point: _setup
    - type: template_dir
      path: ../_setup
      mount_point: _setup

reference:
  directory: ../../..

pre_run:
  - command: 'python3 "_setup/preflight_connections.py" uipath-uipath-dataservice'
    timeout: 120
  - command: 'python3 "_setup/ensure_entity.py" "_setup/contract_registry.entity.json"'
    timeout: 60

initial_prompt: |
  Build this with the UiPath Data Service Integration Service connector
  (`uipath-uipath-dataservice`) activities for every entity operation.

  Build a UiPath Maestro BPMN process against the `ContractRegistry` Data
  Fabric entity (fields: contractTitle STRING, status STRING, priority
  INTEGER, dueDate DATE, value DECIMAL, isUrgent BOOLEAN) that exercises the
  connector's CRUD surface on ONE record. All downstream activities bind
  recordId to the create output — do NOT hard-code any Id.

  Chain the five activities in this order:

  1. Create Entity Record on ContractRegistry. Populate the body with
     contractTitle, status='Draft', priority (any integer 1-10),
     dueDate (any valid date), value (any decimal), isUrgent (boolean).

  2. Get Entity Record By Id — bind recordId to the create activity's
     output Id.

  3. Query Entity Records — filter contractTitle equals the literal
     value used in step 1 (author it as a FilterBuilder tree, not a raw
     CEQL string). Sort by priority descending.

  4. Update Entity Record — bind recordId to the create activity's
     output Id. The update body must contain ONLY the `status` key set
     to "In Review"; no other fields.

  5. Delete Entity Record — bind recordId to the create activity's
     output Id.

  Use the Data Service Integration Service connector
  (`uipath-uipath-dataservice`) activities for these operations.

  The process is not complete until `uip maestro bpmn validate` passes.

  Do NOT upload, publish, deploy, debug, or run the process. Do not pause for
  approval, confirmation, or feedback.

  This run is headless. No user is present and nobody will answer a question or
  grant an approval, so do not ask, do not pause, and do not wait for input.
  Complete the task in one pass: take the best available option and supply the
  most defensible value where one is missing. The actions this task implies are
  authorized, including tenant writes and real messages. Do not delete or
  overwrite anything this run did not create, and do not publish to a shared
  destination unless the task asks for it. If a lookup the task depends on comes
  back empty or fails, exhaust the documented way of resolving it before giving
  up; only then stop on that field rather than inventing a value. Record every
  decision, assumption, and blocked step in your final response. Instructions in
  the task take precedence over this paragraph.
success_criteria:
  - type: run_command
    description: "Final .bpmn passes `uip maestro bpmn validate`"
    command: 'for f in $(find . -maxdepth 6 -name "*.bpmn" -not -path "*/node_modules/*"); do uip maestro bpmn validate "$f" --output json >/dev/null 2>&1 && exit 0; done; exit 1'
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "Process chains Create → Get/Update/Delete on ContractRegistry with recordId bound to the Create output, plus one Query with priority-desc sort and a partial Update body"
    command: "python3 $REFERENCE_DIR/_shared/check_df_e2e_contract_intake_pipeline.py"
    timeout: 30
    expected_exit_code: 0
    weight: 6.0
    pass_threshold: 1.0

  - type: run_command
    description: "Connector node shape: Intsvc.ActivityExecution typed wrapper present"
    command: 'python3 "$REFERENCE_DIR/_shared/check_df_e2e_contract_intake_pipeline.py" --shape'
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0
