task_id: skill-bpmn-datafabric-contractregistry-crud-filters
description: >
  Integration coverage for the ContractRegistry Data Fabric lifecycle:
  create all entity fields, query with null and date filters, update a title
  through a variable, retrieve the updated record by Id, and expose mapped
  outputs without losing the entity binding.
  Ported from Flow
  `connector_features/datafabric_connector/contractregistry_crud_filters.yaml`;
  connector activities are modeled as bpmn:sendTask nodes carrying the
  registry Intsvc.ActivityExecution wrapper instead of Flow connector nodes.
tags: [uipath-maestro-bpmn, integration, "mode:build", "lifecycle:generate", "shape:multi-node", connector, "feature:records", "feature:entities", "feature:activities", uipath-uipath-dataservice]

run_limits:
  turn_timeout: 1800
  task_timeout: 3600

sandbox:
  template_sources:
    - type: template_dir
      path: ../../../../../../skills/uipath-maestro-bpmn
    - type: template_dir
      path: ../../../_setup
      mount_point: _setup
    - type: template_dir
      path: ../_setup
      mount_point: _setup

reference:
  directory: ../../..

pre_run:
  - command: 'python3 "_setup/preflight_connections.py" uipath-uipath-dataservice'
    timeout: 120
  - command: 'python3 "_setup/ensure_entity.py" "_setup/contract_registry.entity.json"'
    timeout: 60

initial_prompt: |
  Build this with the UiPath Data Service Integration Service connector
  (`uipath-uipath-dataservice`) activities for every entity operation.

  Build a UiPath Maestro BPMN process named ContractRegistryCrudFilters with a
  manual start using the configured UiPath Data Fabric connection and the
  ContractRegistry entity. Preserve the entity name on every Data Service
  connector node.

  The process must:

  1. Create one ContractRegistry record and populate every field:
     contractTitle, status, priority, dueDate, value, and isUrgent. Use
     non-null deterministic or generated values for the fields.
  2. Query ContractRegistry with a filter that selects records where
     dueDate is less than 2026-08-04. Return at most 100 records.
  3. Query ContractRegistry with a filter that selects records where
     contractTitle is null. Return at most 100 records.
  4. Store a random/non-constant contract title in a process variable and
     update the created record's contractTitle from that variable.
  5. Get the updated ContractRegistry record by Id, using the Id from the
     update activity's output rather than a hard-coded Id.
  6. Map the created, queried, updated, and retrieved values to process
     outputs where the activity supports output mapping.

  Use the Data Service Integration Service connector
  (`uipath-uipath-dataservice`) activities for these operations.

  The process is not complete until `uip maestro bpmn validate` passes.

  Do NOT upload, publish, deploy, debug, or run the process. Do not pause for
  approval, confirmation, or feedback.

  This run is headless. No user is present and nobody will answer a question or
  grant an approval, so do not ask, do not pause, and do not wait for input.
  Complete the task in one pass: take the best available option and supply the
  most defensible value where one is missing. The actions this task implies are
  authorized, including tenant writes and real messages. Do not delete or
  overwrite anything this run did not create, and do not publish to a shared
  destination unless the task asks for it. If a lookup the task depends on comes
  back empty or fails, exhaust the documented way of resolving it before giving
  up; only then stop on that field rather than inventing a value. Record every
  decision, assumption, and blocked step in your final response. Instructions in
  the task take precedence over this paragraph.
success_criteria:
  - type: run_command
    description: "Final .bpmn passes `uip maestro bpmn validate`"
    command: 'for f in $(find . -maxdepth 6 -name "*.bpmn" -not -path "*/node_modules/*"); do uip maestro bpmn validate "$f" --output json >/dev/null 2>&1 && exit 0; done; exit 1'
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "ContractRegistry CRUD, filters, variable update, Get-by-Id wiring, and output mapping are present"
    command: "python3 $REFERENCE_DIR/_shared/check_df_contractregistry_crud_filters.py"
    timeout: 30
    expected_exit_code: 0
    weight: 6.0
    pass_threshold: 1.0
