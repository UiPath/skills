task_id: skill-bpmn-datafabric-smoke-create-all-types
description: >
  Smoke: Data Service Create Entity Record connector node
  (Intsvc.ActivityExecution) on FlowCodeEvalEntity binds all 8 supported field
  types (STRING, MULTILINE_TEXT, DECIMAL, INTEGER, BOOLEAN, DATE, DATETIME,
  UUID) with correct JSON literal shapes inside its single target="body"
  input. Static-validate only; runtime `bpmn debug` skipped to avoid live
  tenant side effects. Ported from Flow
  `connector_features/datafabric_connector/smoke_create_all_types.yaml`;
  dropped the `core.datafabric.*` node contrast (BPMN has no native Data
  Fabric node) and re-homed the field map from Flow's `bodyParameters` object
  to the BPMN registry shell's single `target="body"` JSON input on a
  bpmn:sendTask.
tags: [uipath-maestro-bpmn, smoke, "mode:build", "lifecycle:generate", "shape:single-node", connector, uipath-uipath-dataservice, "feature:connections"]

run_limits:
  max_turns: 120
  expected_turns: 30
  turn_timeout: 1800
  task_timeout: 3600

sandbox:
  template_sources:
    - type: template_dir
      path: ../../../../../../skills/uipath-maestro-bpmn
    - type: template_dir
      path: ../../../_setup
      mount_point: _setup
    - type: template_dir
      path: ../_setup
      mount_point: _setup

reference:
  directory: ../../..

pre_run:
  - command: 'python3 "_setup/preflight_connections.py" uipath-uipath-dataservice'
    timeout: 120
  - command: 'python3 "_setup/ensure_entity.py" "_setup/flow_code_eval_entity.entity.json"'
    timeout: 60

initial_prompt: |
  Build this with the UiPath Data Service Integration Service connector
  (`uipath-uipath-dataservice`) activities for every entity operation.

  I'm adding a record to the FlowCodeEvalEntity entity from my UiPath Maestro
  BPMN process and want to fill in all the different field types we support.
  Build a UiPath Maestro BPMN process named "DataFabricAllTypesSmoke" with a
  manual start and a single Data Fabric Create Entity Record activity that
  creates a record with these values:

  * title: "AllTypesTest-Smoke" (STRING)
  * description: "A sci-fi smoke test record covering all supported field types. A must-watch film." (MULTILINE_TEXT)
  * score: 7.25 (DECIMAL)
  * viewCount: 350 (INTEGER)
  * active: true (BOOLEAN)
  * releaseDate: "2024-03-10" (DATE)
  * lastUpdated: "2024-03-10T09:00:00" (DATETIME)
  * externalId: any valid UUID value of your choice

  Use the UiPath Data Service Integration Service connector
  (`uipath-uipath-dataservice`) for this operation.

  The process is not complete until `uip maestro bpmn validate` passes.

  Do NOT upload, publish, deploy, debug, or run the process. Do not pause for
  approval, confirmation, or feedback.

  This run is headless. No user is present and nobody will answer a question or
  grant an approval, so do not ask, do not pause, and do not wait for input.
  Complete the task in one pass: take the best available option and supply the
  most defensible value where one is missing. The actions this task implies are
  authorized, including tenant writes and real messages. Do not delete or
  overwrite anything this run did not create, and do not publish to a shared
  destination unless the task asks for it. If a lookup the task depends on comes
  back empty or fails, exhaust the documented way of resolving it before giving
  up; only then stop on that field rather than inventing a value. Record every
  decision, assumption, and blocked step in your final response. Instructions in
  the task take precedence over this paragraph.

success_criteria:
  - type: run_command
    description: "Final .bpmn passes `uip maestro bpmn validate`"
    command: 'for f in $(find . -maxdepth 6 -name "*.bpmn" -not -path "*/node_modules/*"); do uip maestro bpmn validate "$f" --output json >/dev/null 2>&1 && exit 0; done; exit 1'
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "Create Entity Record body covers all 8 field types with correct JSON literal shapes (or `=` expression bindings)"
    command: "python3 $REFERENCE_DIR/_shared/check_df_smoke_create_all_types.py"
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0
