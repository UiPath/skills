task_id: skill-bpmn-slack-http-fallback
description: >
  E2E test: a catalog connector (Slack, uipath-salesforce-slack) has no native
  activity for "list a team's custom emoji" (Slack's emoji.list). The skill must
  fall back to a connector-mode HTTP-request node that reuses the existing Slack
  connection's managed auth, then the process must debug green.
  Exercises the no-native-activity -> managed-HTTP fallback path end-to-end:
  structural check confirms the fallback shape, runtime check confirms
  `uip maestro bpmn debug` completes against the live Slack connection.

  Ported from Flow `connector_features/slack-http-fallback/slack_http_fallback.yaml`;
  the HTTP-fallback node is modeled as a bpmn:sendTask carrying the registry
  Intsvc.ActivityExecution wrapper with connectorKey uipath-salesforce-slack
  targeting the emoji.list endpoint (registry-workflow.md §"Connectionless vs
  connector HTTP"),
  `flow debug`'s single-call inline payload becomes an ephemeral-solution
  import + `bpmn debug` + `debug-instance incidents` read, and the check_debug
  criterion's timeout is raised from Flow's 720s to 930s to cover the extra
  CLI steps (`solution init`/`solution projects import`, a separate
  `incidents` read) that BPMN's live surface needs beyond Flow's single
  `flow debug` call (arithmetic in the grader's docstring).
tags: [uipath-maestro-bpmn, e2e, "mode:build", "lifecycle:generate", "shape:single-node", connector, "feature:http", outcome-graded]

run_limits:
  expected_turns: 32
  task_timeout: 2400
  max_turns: 100
  turn_timeout: 1200

sandbox:
  template_sources:
    - type: template_dir
      path: ../../_setup
      mount_point: _setup

reference:
  directory: ../..

initial_prompt: |
  Create a new UiPath Maestro BPMN process project called "SlackEmojiListTest"
  inside a solution of the same name, with a manual start that lists the custom
  emoji for a team. Wire the manual start to the node that
  lists the emoji.

  Use the Slack connection in the `Shared/uipath-maestro-flow` folder.

  Validate the final BPMN file. Once it validates, debug it.

  This run is headless. No user is present and nobody will answer a question or
  grant an approval, so do not ask, do not pause, and do not wait for input.
  Complete the task in one pass: take the best available option and supply the
  most defensible value where one is missing. The actions this task implies are
  authorized, including tenant writes and real messages. Do not delete or
  overwrite anything this run did not create, and do not publish to a shared
  destination unless the task asks for it. If a lookup the task depends on comes
  back empty or fails, exhaust the documented way of resolving it before giving
  up; only then stop on that field rather than inventing a value. Record every
  decision, assumption, and blocked step in your final response. Instructions in
  the task take precedence over this paragraph.
success_criteria:
  - type: run_command
    description: "The completed process validates"
    command: "python3 $REFERENCE_DIR/_shared/validate_bpmn.py"
    timeout: 180
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Advisory: live-v1 agent invoked bpmn debug"
    tool_name: "Bash"
    command_pattern: "(uip|\\$UIP)\\s+maestro\\s+bpmn\\s+debug"
    min_count: 1
    weight: 1.5
    pass_threshold: 0.0

  - type: run_command
    description: "Emoji list falls back to an HTTP-request node bound to the Slack connector (no native activity exists for it) and targets the emoji.list endpoint"
    command: "python3 $REFERENCE_DIR/_shared/check_slack_http_fallback.py check_fallback"
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "uip maestro bpmn debug finishes with a completed final status and no incidents against the live Slack connection"
    command: "python3 $REFERENCE_DIR/_shared/check_slack_http_fallback.py check_debug"
    timeout: 930
    expected_exit_code: 0
    weight: 6.0
    pass_threshold: 1.0

post_run:
  - command: "python3 _setup/cleanup_solutions.py"
    timeout: 120
