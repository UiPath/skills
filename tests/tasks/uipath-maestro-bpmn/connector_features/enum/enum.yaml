task_id: skill-bpmn-enum
description: >
  Tests the enum IS feature — configures a connector node with an enum
  importance field on the Gmail "Send Mail" activity. Recipient, subject, and
  body are fixed so the test can verify the enum value wiring.
  Ported from Flow `connector_features/enum.yaml`; the Gmail Send Mail
  connector node is modeled as a bpmn:sendTask carrying the registry
  Intsvc.ActivityExecution wrapper instead of a Flow connector node, and the
  request body is graded in either of two accepted shapes — one JSON
  target="body" input, or one typed target="body" input per field — since
  BPMN's canonical single-blob shape coexists with the CLI manifest's stale
  separate-inputs guidance (registry-workflow.md §3 "Body shape").
  Validate-only, matching Flow's own scope — the Flow source never called
  `flow debug` either, only `flow validate`.
tags:
  - uipath-maestro-bpmn
  - integration
  - "lifecycle:generate"
  - "shape:single-node"
  - connector
  - uipath-google-gmail
  - "mode:build"

run_limits:
  expected_turns: 46
  task_timeout: 3600
  turn_timeout: 1200

sandbox:
  template_sources:
    - type: template_dir
      path: ../../../../../skills/uipath-maestro-bpmn

reference:
  directory: ../..

initial_prompt: |
  Create a new UiPath Maestro BPMN process project called "EnumTest" with a manual start.
  Build a process that sends an email via the Gmail "Send Mail" connector
  activity. Use these exact values:
    - to:        "is-test@uipath.com"
    - subject:   "weather today"
    - body:      "Weather update for today."
    - importance: "high"
  Validate the final BPMN file.
  Use the connection present in Shared/uipath-maestro-flow.

  Do NOT upload, publish, deploy, debug, or run the process. Do not pause for
  approval, confirmation, or feedback.

  This run is headless. No user is present and nobody will answer a question or
  grant an approval, so do not ask, do not pause, and do not wait for input.
  Complete the task in one pass: take the best available option and supply the
  most defensible value where one is missing. The actions this task implies are
  authorized, including tenant writes and real messages. Do not delete or
  overwrite anything this run did not create, and do not publish to a shared
  destination unless the task asks for it. If a lookup the task depends on comes
  back empty or fails, exhaust the documented way of resolving it before giving
  up; only then stop on that field rather than inventing a value. Record every
  decision, assumption, and blocked step in your final response. Instructions in
  the task take precedence over this paragraph.
success_criteria:
  - type: command_executed
    description: "Advisory: live-v1 agent listed connections before choosing one"
    tool_name: "Bash"
    command_pattern: "(uip|\\$UIP)\\s+is\\s+connections\\s+list"
    min_count: 1
    weight: 1.0
    pass_threshold: 0.0

  - type: run_command
    description: "Tenant has at least one Gmail connection (precondition for connector authoring)"
    command: "python3 $REFERENCE_DIR/_setup/preflight_connections.py uipath-google-gmail"
    timeout: 35
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "BPMN file exists and is well-formed XML"
    command: "python3 $REFERENCE_DIR/_shared/check_enum_flow.py EnumTest structure"
    timeout: 10
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "BPMN uses Gmail connector or task-specific managed HTTP fallback"
    command: "python3 $REFERENCE_DIR/_shared/check_managed_http_fallback.py EnumTest uipath-google-gmail enum"
    timeout: 10
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "Connector node's body carries to and importance"
    command: "python3 $REFERENCE_DIR/_shared/check_enum_flow.py EnumTest body_params"
    timeout: 10
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "The completed process validates"
    command: "python3 $REFERENCE_DIR/_shared/validate_bpmn.py"
    timeout: 180
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0
