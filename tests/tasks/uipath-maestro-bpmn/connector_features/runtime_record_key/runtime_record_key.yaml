task_id: skill-bpmn-runtime-record-key
description: >
  A record fetched by a key that arrives as a process input. Jira's curated
  "Get Issue" also needs `project` and `issuetype`, design-time lookups the
  connector resolves against the connection; filling them from inputs is
  `check`'s LOOKUP_RUNTIME_VALUE (the caller holds only the key, not the ids
  they need); pinning them reads one project only. The step must read the
  issue by its key alone (the generic Retrieve Issue, `get-record` on
  `curated_issue`). Graded on the compiled BPMN, validate-only; the summary
  output mapping is not graded here.
tags:
  - uipath-maestro-bpmn
  - integration
  - "lifecycle:generate"
  - "shape:single-node"
  - connector
  - "mode:build"

run_limits:
  expected_turns: 45
  task_timeout: 1500
  max_turns: 120
  turn_timeout: 1200

reference:
  directory: ../..

initial_prompt: |
  Create a new UiPath Maestro BPMN process project called "IssueDigest" with a
  manual start. It takes a Jira issue key as an input argument, looks up that
  issue, and returns the issue's summary as an output. It should work for an
  issue in any project.
  Use the Atlassian Jira connection available in the `Shared/uipath-maestro-flow`
  folder. Validate the final BPMN file.

  Do NOT upload, publish, deploy, debug, or run the process.

  This run is headless. No user is present and nobody will answer a question or
  grant an approval, so do not ask, do not pause, and do not wait for input.
  Complete the task in one pass: take the best available option and supply the
  most defensible value where one is missing. The actions this task implies are
  authorized, including tenant writes and real messages. Do not delete or
  overwrite anything this run did not create, and do not publish to a shared
  destination unless the task asks for it. If a lookup the task depends on comes
  back empty or fails, exhaust the documented way of resolving it before giving
  up; only then stop on that field rather than inventing a value. Record every
  decision, assumption, and blocked step in your final response. Instructions in
  the task take precedence over this paragraph.
success_criteria:
  - type: run_command
    description: "Tenant has a Jira connection in Shared/uipath-maestro-flow (precondition)"
    command: "python3 $REFERENCE_DIR/_setup/preflight_connections.py uipath-atlassian-jira=uipath-maestro-flow"
    timeout: 35
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "BPMN file exists and is well-formed XML"
    command: "python3 -c \"import sys; sys.path.insert(0, '$REFERENCE_DIR'); from _shared.bpmn_check import parse_bpmn; parse_bpmn('IssueDigest')\""
    timeout: 10
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "The Jira step reads the issue by the input key alone, with no design-time lookup (run-time or pinned)"
    command: "python3 $REFERENCE_DIR/_shared/check_runtime_record_key.py IssueDigest uipath-atlassian-jira project,issuetype"
    timeout: 10
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "The completed process validates"
    command: "python3 $REFERENCE_DIR/_shared/validate_bpmn.py"
    timeout: 180
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0
