task_id: skill-bpmn-script-jint-guidance
description: >
  Script task eval: agent authors the current Studio/Alpha v3 ScriptTask
  contract while respecting the Jint runtime boundary.
tags: [uipath-maestro-bpmn, smoke, mode:build, lifecycle:generate, shape:single-node, node:script]

run_limits:
  expected_turns: 40
  max_turns: 60
initial_prompt: |
  Create a local BPMN project named "RiskScoreScriptBpmn".
  The process should manually start with `amount` and `daysOverdue` inputs,
  calculate a risk score in a BPMN script task, and end with a `riskScore`
  output.

  Requirements:
  - Use the documented UiPath BPMN extension namespace
    `http://uipath.org/schema/bpmn`; do not use workflow-activities
    namespaces for BPMN extension XML.
  - Use the current Studio serializer contract
    `bpmn:process isExecutable="false"`.
  - Declare public `amount` and `daysOverdue` inputs bound to the root start,
    a public `riskScore` output bound to the root end, and distinct mutable
    internal variables for all three values. Use `number` for amount/riskScore
    and `integer` for daysOverdue. Bridge them explicitly on the start/end
    events with `BPMN.Variables` mappings.
  - Use `bpmn:scriptTask` with `scriptFormat="JavaScript"`.
  - Use the current v3 Studio serializer shape: a `BPMN.Variables` mapping,
    `uipath:scriptVersion value="v3"`, an input schema for `vars` and
    `metadata`, and `uipath:input name="args"` that passes `=vars` and
    `=metadata`.
  - Read `amount` and `daysOverdue` in the script through
    `vars.<mutable variable id>`, not top-level identifiers or `args.*`.
  - Return the numeric score directly. Map `=result.response` to a scoped
    `scriptResponse` variable of type `number`, map the standard scoped typed
    `Error`, then map `=vars.<scriptResponse id>` to the mutable `riskScore`
    variable with a custom output. Bridge that mutable value to the public
    output on the root end.
  - Write script content that is compatible with the Jint runtime. Do not use
    Node.js modules, filesystem APIs, network APIs, browser globals, packages,
    timers, or long-running async behavior.
  - Include BPMN DI for every visible node and sequence flow.
  - Do not upload, publish, deploy, debug, or run the process.

success_criteria:
  - type: run_command
    description: "BPMN source was created"
    command: "find . -type f -name '*.bpmn' -path '*RiskScoreScriptBpmn*' | grep -q ."
    timeout: 10
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "Script task follows Jint-compatible BPMN guidance"
    command: "python3 $TASK_DIR/check_script_jint_guidance.py"
    timeout: 30
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0
