task_id: skill-bpmn-script-jint-guidance
description: >
  Script task eval: agent authors the supported ScriptTask runtime contract and
  stays within the Jint runtime boundary.
tags: [uipath-maestro-bpmn, smoke, "mode:build", "lifecycle:generate", "shape:single-node", "node:script"]

run_limits:
  expected_turns: 36
  max_turns: 60
initial_prompt: |
  Create a local BPMN project named "RiskScoreScriptBpmn".
  It must manually start with public `amount` (number) and `daysOverdue`
  (integer) inputs, calculate a numeric risk score in one JavaScript
  ScriptTask, and return it as the public `riskScore` output.

  Requirements:
  - Use the supported ScriptTask and public input/output contracts, including
    standard response and typed error handling.
  - Keep the JavaScript deterministic and Jint-compatible; do not use Node.js,
    filesystem, network, browser, package, timer, or async APIs.
  - Include BPMN DI for every visible node and sequence flow.
  - Validate the finished BPMN locally.
  - Do not upload, publish, deploy, debug, or run the process.

success_criteria:
  - type: run_command
    description: "BPMN uses supported public I/O and ScriptTask runtime contracts"
    command: "python3 $TASK_DIR/check_script_jint_guidance.py"
    timeout: 30
    expected_exit_code: 0
    weight: 6.0
    pass_threshold: 1.0

  - type: run_command
    description: "BPMN passes the local Maestro canvas/deploy-readiness validator"
    command: "bpmn=$(find . -type f -name 'RiskScoreScriptBpmn.bpmn'); test \"$(printf '%s\\n' \"$bpmn\" | grep -c .)\" -eq 1 && uip maestro bpmn validate \"$bpmn\" --output json"
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0
