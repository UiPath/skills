task_id: skill-bpmn-e2e-live-debug
description: >
  The smallest Maestro BPMN process that EXECUTES: a manual start, one script
  step that multiplies 6 by 7 into a `product` variable, an end event, asked
  the way a Studio Web user would ask it. The grader imports the exact
  submitted project into its own ephemeral solution, runs it once under
  `uip maestro bpmn debug` from its own sandbox (Studio Web's host can refuse
  the agent's debug with UnavailableInHost, and its testbench stubs
  RunProject), and asserts what the run did: it completed with no incidents,
  a script task completed, and `product` reads back 42 in the runtime
  variables. Whether the agent ran its own debug and read the variables is
  advisory. Live: no mocks; auth comes from the experiment environment.
tags: [uipath-maestro-bpmn, e2e, "mode:operate", "lifecycle:setup", path-to-ga, outcome-graded]
sandbox:
  template_sources:
    - type: template_dir
      path: ../../_setup
      mount_point: _setup

# turn_timeout must cover the whole agent session (observed: a 902s session was
# killed by the 900s default, then a 1500s turn timed out while the agent
# wandered on solution scaffolding + variable scoping under slow Bedrock latency
# on the shared runner). task_timeout adds headroom for grading (the
# grader's own debug run) on top.
run_limits:
  expected_turns: 30
  # turn 2400 + criteria 180 + 30 + 30 + 900 = 3540, plus margin.
  task_timeout: 3700
  max_turns: 120
  turn_timeout: 2400

reference:
  directory: ../..

initial_prompt: |
  You are a coding agent in an empty Agentic Process (Maestro BPMN) project.
  No user is present, and nobody will answer a question or grant approval, so
  do not ask, do not pause, and do not wait for input. Do not delete or
  overwrite anything this run did not create, except what the task asks you
  to change, and do not publish to a shared destination unless the task asks
  for it.

  I want to build an automation, called "ProductCalc", so I can check that
  processes run end to end on this tenant. It starts manually and takes no
  inputs. A script step multiplies 6 by 7 and stores the result in a process
  variable called `product`, then the process ends. `product` should come out
  as 42.

  <!-- helper:start -->
  The process has no inputs. Process variable: product (number).
  <!-- helper:end -->

  Build the process and do a test run.

success_criteria:
  - type: run_command
    description: uip maestro bpmn validate passes on the BPMN file
    command: python3 $REFERENCE_DIR/_shared/validate_bpmn.py
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  # Advisory: Studio Web's host may refuse the agent's own `bpmn debug`
  # (UnavailableInHost) and its testbench stubs RunProject, so the agent's
  # test run cannot gate the task. The grader runs the process itself below.
  - type: command_executed
    description: "Advisory: agent ran a live BPMN debug session"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+bpmn\s+debug\s'
    min_count: 1
    weight: 1.0
    pass_threshold: 0.0

  - type: command_executed
    description: "Advisory: agent inspected the debug instance's runtime variables"
    tool_name: "Bash"
    command_pattern: '(uip|\$\{?UIP\}?)\s+maestro\s+bpmn\s+debug-instances?\s+variables(-all)?(?![^;&|\n#]*\s(-h|--help)(\s|$))(\s+--[\w-]+(=\S+|\s+[^\s<>|;&-]\S*))*\s+["'']?(?!\d*[<>])[\w${]'
    min_count: 1
    weight: 1.0
    pass_threshold: 0.0

  # 300 (debug) + 90 (solution init) + 180 (solution import)
  # + 120 (variables-all) + 120 (incidents) + 60 margin = 870.
  - type: run_command
    description: "Effects: one debug run of the submitted project, from the grader's sandbox, completes with no incidents, a script task completes in it, and the process variable product reads back 42"
    command: "python3 $REFERENCE_DIR/debug/live_debug_e2e/check_product_run.py"
    timeout: 900
    expected_exit_code: 0
    weight: 6.0
    pass_threshold: 1.0

# The grader imports the project into its own solution; delete it after grading.
post_run:
  - command: "python3 _setup/cleanup_solutions.py"
    timeout: 120
