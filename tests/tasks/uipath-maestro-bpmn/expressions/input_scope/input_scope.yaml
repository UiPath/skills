task_id: skill-bpmn-expr-input-scope
description: >
  Variable-scoping eval from the 2026-11-17 Autopilot dogfood (issue 6): a
  process whose steps use its start inputs must open on the Studio Web canvas
  without "A variable is unresolved". A process input belongs to the start
  event, so a step reading `vars.<inputId>` downstream is unresolved on the
  canvas and only a VARIABLE_NOT_SET warning in validate, which compile and a
  passing validate both hide. The grader fails on any VARIABLE_NOT_SET or
  VARIABLE_DOES_NOT_EXIST. Authoring only, no cloud effects.
tags: [uipath-maestro-bpmn, smoke, "mode:build", "lifecycle:generate"]

run_limits:
  expected_turns: 20
  max_turns: 60

reference:
  directory: ../..

initial_prompt: |
  Load and follow the uipath-maestro-bpmn skill.

  Could you make me a BPMN process for our parking garage? It gets how many
  hours someone parked and whether they have a monthly pass. Pass holders pay
  nothing. Everyone else pays 3 per hour, but never more than 20. It should
  give back the fee.

  Make it a local project called ParkingFee and validate it. Don't upload,
  publish or run anything, and don't stop to ask me questions.

success_criteria:
  - type: run_command
    description: "BPMN source was authored"
    command: "python3 $REFERENCE_DIR/_shared/check_bpmn_present.py ParkingFee"
    timeout: 30
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "Emitted BPMN validates"
    command: "python3 $REFERENCE_DIR/_shared/validate_bpmn.py"
    timeout: 150
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "The start values are process inputs, mapped by the start event and read by a later step (otherwise the scope check is vacuous)"
    command: "python3 $REFERENCE_DIR/expressions/input_scope/check_inputs_declared.py ParkingFee.bpmn 2"
    timeout: 30
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "Every step reads only variables set upstream (no VARIABLE_NOT_SET: canvas 'A variable is unresolved')"
    command: "python3 $REFERENCE_DIR/expressions/canvas_ready/check_canvas_ready.py ParkingFee.bpmn --check scope"
    timeout: 150
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
