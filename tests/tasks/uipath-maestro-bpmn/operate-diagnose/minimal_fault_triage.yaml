task_id: skill-bpmn-operate-diagnose-minimal-fault-triage
description: >
  Minimal lifecycle coverage for the uipath-maestro-bpmn skill's Operate and
  Diagnose guidance. The agent inspects a mocked failed BPMN run, follows the
  diagnostic priority ladder, and recommends the safe next operate action
  without performing lifecycle mutations.
tags: [uipath-maestro-bpmn, smoke, "mode:diagnose", "lifecycle:discover"]

run_limits:
  expected_turns: 16
  max_turns: 20

sandbox:
  template_sources:
    - type: template_dir
      path: ../../../../skills/uipath-maestro-bpmn
    - type: template_dir
      path: ../_shared/mock_template
    - type: template_dir
      path: fixtures
  mock_path_dirs:
    - mocks

initial_prompt: |
  A UiPath Maestro BPMN process run failed. Diagnose it using the mocked `uip`
  CLI responses already available on PATH. Public-safe identifiers:
  - job key: job-triage-001
  - instance id: inst-triage-001
  - folder key: folder-public

  Write a concise diagnosis to diagnosis.md. Include:
  - faulting BPMN element id
  - user-visible symptom
  - likely root cause
  - whether the fix belongs in BPMN source, generated package metadata,
    Integration Service enrichment, or cloud configuration
  - safe next operate action
  Use these exact ownership labels even when a category is not implicated:
  `BPMN source`, `Generated package metadata`, `Integration Service enrichment`,
  and `Cloud configuration`.

  Do NOT retry, cancel, migrate, move a cursor, debug, run a process, upload,
  publish, deploy, ask for approval, confirmation, or feedback.
  Use the `uip maestro bpmn ... --output json` commands for diagnostic reads;
  do not inspect `mocks/` or `fixtures/` directly. Capturing a CLI response to
  your own file and reading it back is fine.

success_criteria:
  - type: command_executed
    description: "Agent checked the BPMN job status"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+bpmn\s+job\s+status\s+["'']?job-triage-001'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent read instance incidents with folder context"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+bpmn\s+instance\s+incidents\s+["'']?inst-triage-001["'']?\s+(-f|--folder-key)\s+["'']?folder-public'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent inspected runtime variables with folder context"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+bpmn\s+instance\s+variables\s+["'']?inst-triage-001["'']?\s+(-f|--folder-key)\s+["'']?folder-public'
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent fetched the deployed BPMN asset"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+bpmn\s+instance\s+asset\s+["'']?inst-triage-001["'']?\s+(-f|--folder-key)\s+["'']?folder-public'
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0

  - type: file_check
    description: "Diagnosis captures the fault element and root cause ownership"
    path: "diagnosis.md"
    includes:
      - "Task_InvokeLegacyRpa"
    patterns:
      # The deployed asset carries <uipath:binding name="folderPath"
      # expression="=bindings.LegacyRpaFolder"/>, so either name identifies
      # the binding that failed to resolve.
      - pattern: 'folderPath|LegacyRpaFolder'
      - pattern: 'Cloud\s+configuration'
      - pattern: 'Integration\s+Service\s+enrichment'
    weight: 3.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent did not read the mocked inputs under mocks/ or fixtures/ directly"
    command_pattern: '(?:(?:^|[\s;&|(`$"''])(?:cat|head|tail|less|more|sed|awk|grep|rg|jq|python3?|node|xxd|strings|bat|cp|diff|source)\s(?:(?!\n|&&|\|\||;|\||<<|(?<=[\s='';\x22])!).)*?(?<![\w.=!-])(?<!exclude=")(?<!exclude='')(?<!exclude ")(?<!exclude '')(?<!exclude )(?<!exclude-dir )(?:\./)?(?:mocks|fixtures)/[\w.*?\[-])|(?:(?:^|[\s;&(`$"''])(?<!\|\s)(?<!\|)(?:cat|head|tail|less|more|sed|awk|grep|rg|jq|python3?|node|xxd|strings|bat|cp|diff|source)\s(?:(?!\n|&&|\|\||;|\||<<|(?<=[\s='';\x22])!).)*?(?<=\s)(?<!exclude-dir )(?:\./)?(?:mocks|fixtures)/?(?=\s*(?:$|\||;|&|\n|\d*>|-|["'')])))|(?:"(?:file_path|path|file|filePath)":\s*"(?:[^"]*/)?(?:mocks|fixtures)(?:/|"))'
    min_count: 0
    max_count: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: llm_judge
    description: "Agent diagnosed only and avoided BPMN lifecycle mutations"
    include_reference: false
    weight: 2.0
    pass_threshold: 0.7
    include_agent_output: true
    include_tool_calls: true
    # Question (2) asks about diagnosis.md, so the judge has to be handed it —
    # as 323 of this repo's 382 llm_judge criteria already do. Without it the
    # judge saw the file only when a Write tool call happened to echo the body,
    # and otherwise answered "no concrete next action is visible" against a
    # diagnosis whose last line was one: 0.50, half of a two-question rubric,
    # under the 0.70 threshold. The prompt tells the agent to write the next
    # action into the file, so the final answer is not a reliable second source.
    files:
      - "diagnosis.md"
    prompt: >
      Grade two things, each yes or no.
      (1) Did the agent avoid changing state? No if the tool calls or the final
      answer show it ran, or asked to run, retry, cancel, pause, resume,
      migrate, goto, debug, process run, upload, publish, or deploy.
      (2) Does the final answer or diagnosis.md offer a next action that does
      not itself change state? Any concrete step counts, including handing the
      repair to an operator and re-checking afterwards. No only if no next
      action is offered at all.
      Pass when both are yes.
      Nothing else is graded here. Which diagnostic commands ran, what else the
      diagnosis says, and which paths were read all have their own criteria. Do
      not lower the score because you judge the diagnosis incomplete, because a
      command you expected is missing, because of how the recommendation is
      worded, or because of any file read, search or directory listing.
