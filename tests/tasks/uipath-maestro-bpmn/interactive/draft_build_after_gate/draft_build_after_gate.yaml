task_id: skill-bpmn-draft-build-after-gate
description: >
  Draft-mode e2e over the whole dialog a Studio Web user has: the user asks
  to see the outline first, so the agent builds and uploads a skeleton and
  ends its turn with the 3c gate reply; a simulated user picks Build it; the
  agent then wires the process, validates and uploads it, and ends that turn
  with the 4g report, asking nothing more about structure or resources.

  The replies are graded as the user reads them (the last message of each
  turn, from the Claude Code session transcript; see
  smoke/check_draft_reply.py): both follow their templates and carry the
  DesignerUrl the upload returned. Every step is a computation, so the build
  needs no tenant resource and the dialog measures the gate, not discovery.
  Validate-only by design: the dialog is under test, not the runtime, and a
  run needs consent (Rule 10) the user never gives. Uploads land in the eval tenant's Studio Web; post_run deletes each
  solution this run uploaded.
tags: [uipath-maestro-bpmn, e2e, "mode:build", "lifecycle:generate", "shape:multi-node", "node:decision", "feature:approval-gate"]

run_limits:
  max_turns: 120
  # Turn 1 is the skeleton plus one upload; turn 2 is the wiring, validate,
  # refresh and a second upload. Grading needs at most 180 (validate) plus
  # 6 x 30s transcript reads.
  turn_timeout: 1500
  task_timeout: 3600

sandbox:
  template_sources:
    - type: template_dir
      path: ../../_setup
      mount_point: _setup

reference:
  directory: ../..

initial_prompt: |
  I need a BPMN process called "ShippingQuote" that works out a shipping
  quote for an order. It takes the order's weight in kg and whether the order
  ships abroad, works out the base price from the weight, and adds a 15%
  surcharge for international orders; domestic orders keep the base price.
  The quote comes back as the process result.

  Can you show me the outline before you build it?

simulation:
  enabled: true
  persona: |
    You run operations for a small online shop. You know what the quote
    should do but you do not build processes yourself, and you keep your
    replies short.
  goal: |
    See the outline of the ShippingQuote process, approve it, and get it
    built.
  constraints:
    - "When the agent shows you the outline and asks whether this is the process you want, reply with exactly: 1"
    - "If the agent asks you anything else, at any point, reply only: Your call, build it the way I described."
    - "The moment the agent reports the process is built, reply with exactly <<<END>>> on its own line. Do not ask for changes, re-checks, or a run."
  max_turns: 4
  stop_token: "<<<END>>>"
  stop_on_criteria_pass: false
  check_criteria: end_of_dialog
  n_trials: 1

success_criteria:
  # --- Turn 1: the 3c gate ---------------------------------------------------
  # --no-bpmn: by grading time phase 4 has replaced the skeleton, so the box
  # lines are held to the line cap rather than matched to the boxes.
  - type: run_command
    description: "Turn 1 ends with the 3c reply in its template: the outline-ready line saying uploaded, the DesignerUrl, one line per box, the fixed question and three options, and nothing else"
    command: "python3 $REFERENCE_DIR/smoke/check_draft_reply.py gate ShippingQuote --turn 1 --uploaded --no-bpmn"
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  # An open question tool keeps the turn running, and Studio Web locks the
  # canvas while a turn runs. Nothing in this dialog needs one: the gate is a
  # plain final message, and Build it settles every structure and resource
  # question.
  - type: command_not_executed
    description: "Agent never asked with a question tool"
    tool_name: "AskUserQuestion"
    command_pattern: '.*'
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "No registry pull, search, or get before the user approved the shape (the preflight kind list is allowed)"
    command: 'python3 $REFERENCE_DIR/smoke/check_draft_reply.py commands --turn 1 --forbid "registry\s+(pull|search|get)\b"'
    timeout: 30
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Every resource lookup is filtered with --search"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+solution\s+resources\s+list\b(?!(?:[^;&|\n]|\\\n|(?<= )\n)*--search)'
    weight: 1.0
    pass_threshold: 1.0

  # --- Turn 2: Build it ------------------------------------------------------
  - type: run_command
    description: "The turn answering Build it ends with the 4g report and asks the user nothing"
    command: "python3 $REFERENCE_DIR/smoke/check_draft_reply.py after-approval --gate-turn 1"
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "The 4g report follows its template: built, validated, uploaded (draft mode), the DesignerUrl, at most five change lines, Assumed/Unverified, and nothing else"
    command: "python3 $REFERENCE_DIR/smoke/check_draft_reply.py final ShippingQuote --turn 2 --uploaded --mode draft"
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "Both turn-ending replies carry the DesignerUrl their upload returned"
    command: "python3 $REFERENCE_DIR/smoke/check_draft_reply.py designer-url --turns 1,2"
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  # The report says "built, validated": hold it to that.
  - type: run_command
    description: "The built process validates"
    command: "python3 $REFERENCE_DIR/_shared/validate_bpmn.py"
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

post_run:
  - command: "python3 _setup/cleanup_solutions.py"
    timeout: 120
