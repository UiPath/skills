# Same-ground alignment expansion plan (Tao, 2026-08-21): loop-neutral
# v1-base prompt, outcome-graded criteria at preserved weights, and
# arm-agnostic artifact discovery.
task_id: skill-bpmn-bellevue-weather-simulated
description: >
  Bellevue weather process (HTTP -> script -> decision), but driven by a
  simulated non-technical user who withholds requirements until asked. Tests
  the agent's ability to clarify an ambiguous ask before building.

  Ported from Flow
  `interactive/bellevue_weather_simulated/bellevue_weather_simulated.yaml`;
  the persona/goal/constraints are unchanged apart from product-noun swaps
  ("UiPath Flow" -> "UiPath Maestro BPMN process", "a `.flow` file" -> "a
  `.bpmn` file"), the Managed HTTP construct and live-debug sequence follow
  the same translation as the committed non-simulated port
  (`multi_node/bellevue_weather/bellevue_weather.yaml` +
  `_shared/check_weather_bpmn.py`), and the live-check criterion timeout
  grows from Flow's 600s to 1050s to fund that larger live-debug surface
  (ephemeral solution import + `bpmn debug` + `debug-instance
  variables-all`/`incidents`, per LIVE-ADDENDUM's budget rule); `run_limits`
  are otherwise Flow's verbatim, except `task_timeout`, which is raised from
  2400s to 2550s (turn_timeout 1200 + worst-case grading 1245 + 60s margin)
  so the larger live-check budget still fits under the single turns+grading
  watchdog. The graded assertions themselves (a weather-HTTP node exists; the
  run's outputs contain one of the two verdict strings; the project was named
  as elicited) are unchanged from Flow's own grader.
tags: [uipath-maestro-bpmn, e2e, "mode:build", "lifecycle:generate", "shape:multi-node", "node:decision", "feature:http", simulation]

sandbox:
  template_sources:
    - type: template_dir
      path: ../../../../../skills/uipath-maestro-bpmn
    - type: template_dir
      path: ../../_setup
      mount_point: _setup

run_limits:
  # Ceiling on agent turns across the whole dialog, with generous headroom so a
  # long build is never truncated mid-flow. The dialog length itself is bounded
  # by simulation.max_turns below. Unchanged from Flow.
  max_turns: 70
  turn_timeout: 1200
  # Flow's task_timeout (2400) does not cover this task's larger live-debug
  # criterion (1050s vs Flow's 600s): turn_timeout (1200) + worst-case grading
  # (180 validate + 1050 live check + 15 name check = 1245) + 60s margin =
  # 2505; rounded up for per-criterion spawn overhead. task_timeout wraps
  # turns AND grading under one watchdog (tests/README.md), so it must cover
  # both, not grading alone.
  task_timeout: 2550

# No initial_prompt — the simulator generates turn 1 from its persona + goal.

reference:
  directory: ../..

simulation:
  enabled: true

  persona: |
    You are a non-technical operations analyst. You have heard of UiPath but
    have never built a process yourself. You speak in plain English, never in
    code. You are friendly but impatient: if the agent dithers, prod it to
    just build something. You cannot read or write code — if the agent shows
    you code, say "I trust you, just make it work."

  goal: |
    You want a UiPath Maestro BPMN process that checks today's weather for
    the Bellevue office and tells you whether it's a nice day.

    OPENING MESSAGE: open the way you would to a colleague — a couple of short
    sentences covering the outcome you want plus the rules that actually
    matter to you: it is the Bellevue, Washington office; strictly above 60
    degrees Fahrenheit is a nice day and the result should say 'nice day', at
    or below 60 should say 'bring a jacket'; and you want a short written
    summary of the weather rather than raw numbers. Say that it has to be
    built as a UiPath Maestro BPMN process — not an API workflow, not a
    standalone script — inside a solution of the same name, and that you want
    it validated before you sign off. Do not name files or paths and do not
    use technical wording. Close by inviting the agent to ask you anything it
    needs before it starts building. Keep the withheld items below to
    yourself until it asks.

    WITHHELD — reveal each of these ONLY if the agent asks about it:
      - The project name should be "BellevueWeather".
      - Where the weather data comes from: the open-meteo public API, called
        directly over HTTP — NOT an Integration Service connector.
      - You do not require the project to execute before signing off.

  constraints:
    - "Never paste or read code. If shown code, say 'I trust you, just make it work.'"
    - "Do not mention 'HTTP', 'open-meteo', 'connector', 'node', 'script', or 'decision' unless the agent brings them up first."
    - "Do not reveal the project name 'BellevueWeather' unless asked what to name it."
    - "If the agent proposes getting the weather through an Integration Service connector, tell it to call the public open-meteo API directly over HTTP instead."
    - "The one thing worth pushing back on: if the agent reports it built something that is not a Maestro BPMN process at all (e.g. an API workflow), tell it you specifically want a Maestro BPMN process — i.e. a `.bpmn` file in the workspace — and are not satisfied until there is one."
    - "If the agent asks you anything before it starts building, answer every outstanding question in ONE message — include any withheld fact it asked about, stated plainly — and then let it build."
    - "The moment the agent reports it has built the process, the conversation is over: reply with exactly <<<END>>> on its own line. Do not ask for a rebuild, polish, re-checks, or alternative designs, and do not raise a requirement you have not mentioned yet — the grader verifies the result from here."
  max_turns: 8
  stop_token: "<<<END>>>"
  stop_on_criteria_pass: false
  check_criteria: end_of_dialog
  n_trials: 1

success_criteria:
  # Name-agnostic: any unambiguous generated .bpmn must validate. The exact
  # project name is scored separately below.
  - type: run_command
    description: "uip maestro bpmn validate passes (any .bpmn)"
    command: "python3 $REFERENCE_DIR/_shared/validate_bpmn.py"
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  # Runtime check:
  - type: run_command
    description: "BPMN debug runs; weather-HTTP node executed and output contains a verdict"
    command: "python3 $REFERENCE_DIR/_shared/check_weather_bpmn_simulated.py"
    timeout: 1050
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0

  # The project name is a WITHHELD, COSMETIC requirement (persona reveals it only
  # if asked what to name it) — the process behaves identically whatever it's
  # called. Non-gating: reports whether the agent elicited the exact name
  # (score 1/0), but pass_threshold 0 keeps a cosmetic miss from failing the
  # task and the low weight keeps it from dominating the score.
  - type: run_command
    description: "Project/BPMN file is named BellevueWeather (elicited from the user)"
    command: "find . -iname 'BellevueWeather*.bpmn' | grep -q ."
    timeout: 15
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 0

post_run:
  - command: "python3 _setup/cleanup_solutions.py"
    timeout: 120
