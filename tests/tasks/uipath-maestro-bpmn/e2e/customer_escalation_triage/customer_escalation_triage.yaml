task_id: skill-bpmn-e2e-customer-escalation-triage
description: >
  E2E live Jira + Slack coverage for the BPMN escalation triage, asked the
  way a Studio Web user would ask it: a process classifies an escalation's
  severity, opens a real Jira ticket and posts a real Slack alert. The grader
  imports the exact submitted project (sha256 pinned, found wherever the
  agent put it) into its own ephemeral solution, runs one seeded Sev1 case
  (unique correlationId) via `uip maestro bpmn debug`, and asserts what the
  run did: it completed with no incidents, one Jira step returned an issue
  key and one Slack step a message ts (a search, comment or lookup on the
  same connector is not counted), the Slack step's own response shows a
  message in the seeded channel carrying the correlationId and severity,
  re-reading the created key from Jira finds an issue in the seeded project
  and type whose summary carries the correlationId, and the named outputs
  read back severity=Sev1, caseKey=<correlationId>, jiraIssueKey=<that key>.
  Connector steps are found
  by connector key alone, so any Create Issue / Send Message operation
  counts; the process must name all three severities. Created records are
  cleaned up from a flat journal in post_run. The packed-bindings check and
  the agent's own test run are advisory.

  Tenant prerequisite: enabled `uipath-atlassian-jira`
  (is-sandboxes-test@uipath.com-uipath-sandbox-380) and
  `uipath-salesforce-slack` (is-sandboxes) connections in folder
  `Shared/uipath-maestro-flow`, reaching the `CE` / "Coder Eval" Jira project
  (issue type Task) and Slack channel C0B2FDZD1M3. Targets live in the shared
  `_setup/escalation_is.py`.
tags: [uipath-maestro-bpmn, e2e, mode:build, lifecycle:generate, shape:multi-node, connector, feature:escalation, path-to-ga, outcome-graded]
run_limits:
  expected_turns: 55
  max_turns: 120
  # First claude nightly (09-16) killed the agent mid-work at the 1200s turn
  # cap. task_timeout also covers the graded criteria (180 + 180 + 1800s
  # run_commands) plus per-criterion spawn overhead. Exceeding the nightly's
  # ~3600s ROPC token TTL is safe here: the graded checker shells a fresh
  # `uip` subprocess per call (_shared/bpmn_live.py run_cli), each re-reading
  # the bind-mounted auth the refresher re-mints every 3000s — no token is
  # held in-process across the live window.
  task_timeout: 4800
  turn_timeout: 2400

sandbox:
  template_sources:
    - type: template_dir
      path: ../../_setup
      mount_point: _setup
    - type: template_dir
      path: _setup
      mount_point: _setup

pre_run:
  - command: "python3 _setup/seed.py"
    timeout: 240

reference:
  directory: ../..

post_run:
  # Repo-standard solution sweep: the grader keeps its ephemeral solution
  # under the sandbox CWD precisely so this glob finds the .uipx.
  - command: "python3 _setup/cleanup_solutions.py"
    timeout: 120
  # Connector records the solution sweep cannot reach: replays the flat
  # journal of created Jira/Slack ids (teardown_jira.py precedent).
  - command: "python3 _setup/teardown_escalation.py"
    # Covers escalation_is.TEARDOWN_TIMEOUT: a connection lookup plus, per
    # record, a delete, one retry and a confirming reread. Killing this sweep
    # leaks live Jira issues and Slack messages, so it is budgeted for its
    # worst case rather than its typical one. The sweep also stops starting
    # calls at escalation_is.TEARDOWN_BUDGET and names what it skipped.
    # post_run runs outside the
    # task_timeout watchdog, so this does not compete with grading.
    timeout: 300

initial_prompt: |
  You are a coding agent in an empty Agentic Process (Maestro BPMN) project.
  No user is present, and nobody will answer a question or grant approval, so
  do not ask, do not pause, and do not wait for input. Do not delete or
  overwrite anything this run did not create, except what the task asks you
  to change, and do not publish to a shared destination unless the task asks
  for it.

  Build a process called "CustomerEscalationTriage" that triages a customer
  escalation, opens a Jira ticket for it and alerts a Slack channel. It
  receives these inputs: customerTier, serviceState, workaroundAvailable,
  correlationId, jiraProjectKey, jiraIssueTypeId and slackChannelId.

  How to rate the severity:
  - Sev1: customerTier is "Enterprise", serviceState is "Unavailable", and
    there is no workaround.
  - Sev2: any other case where serviceState is "Unavailable" or "Degraded".
  - Sev3: everything else.

  Open a Jira ticket in the provided project and issue type, using my sandbox
  connection from the uipath-maestro-flow shared folder. Its summary must
  include the correlationId, for example "[Sev1] <correlationId> customer
  escalation".

  Then post a Slack message to the channel slackChannelId, through the sandbox
  Slack connection in the same shared folder I mentioned above. Post it as the
  user, not the bot. The message must also include the correlationId and the
  severity.

  Outputs: severity, caseKey (the correlationId we were given) and
  jiraIssueKey (the key of the ticket that was created).

  <!-- helper:start -->
  Inputs: customerTier (string), serviceState (string), workaroundAvailable
  (boolean), correlationId (string), jiraProjectKey (string), jiraIssueTypeId
  (string), slackChannelId (string). jiraIssueTypeId is the numeric id of an
  issue type, such as "10001".
  Outputs: severity (string), caseKey (string), jiraIssueKey (string).
  severity is "Sev1", "Sev2" or "Sev3".
  The Jira connection is "is-sandboxes-test@uipath.com-uipath-sandbox-380" and
  the Slack connection is "is-sandboxes", both in the
  Shared/uipath-maestro-flow folder. The Jira summary and the Slack message
  include the correlationId.
  <!-- helper:end -->

  Build the process and do a test run.
success_criteria:
  # Discovered, not hardcoded: Studio Web names the file Process.bpmn and
  # the request names no folder layout.
  - type: run_command
    description: "The UiPath CLI validator independently accepts the generated BPMN"
    command: "python3 $REFERENCE_DIR/_shared/validate_bpmn.py"
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  # Advisory: Studio Web's host may refuse the agent's own `bpmn debug`
  # (UnavailableInHost) and its testbench stubs RunProject.
  - type: command_executed
    description: 'Advisory: the agent ran its own test run (uip maestro bpmn debug), as the request asks'
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+bpmn\s+debug(?!-instances?)(?!\s+--help)\s'
    min_count: 1
    weight: 1.0
    pass_threshold: 0.0

  - type: run_command
    description: "Advisory: project independently packs with real (non-stub) Jira and Slack connection bindings"
    command: "python3 $REFERENCE_DIR/e2e/customer_escalation_triage/check_customer_escalation_package.py"
    timeout: 180
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 0.0

  - type: run_command
    description: "Effects: one seeded Sev1 debug run completes with no incidents; one Jira step returns an issue key and one Slack step a message ts; the Slack step's response shows a message in the seeded channel carrying the correlationId and Sev1; re-reading the created key from Jira finds an issue in the seeded project and type whose summary carries the correlationId; outputs severity=Sev1, caseKey=<correlationId>, jiraIssueKey=<that key>"
    command: "python3 $REFERENCE_DIR/e2e/customer_escalation_triage/check_customer_escalation_behavior.py"
    timeout: 1800
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0
