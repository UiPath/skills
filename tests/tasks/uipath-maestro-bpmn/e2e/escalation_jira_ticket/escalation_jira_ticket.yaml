task_id: skill-bpmn-e2e-escalation-jira-ticket
description: >
  E2E live Jira coverage for the escalation BPMN process, asked the way a
  Studio Web user would ask it: a manual-start process classifies an
  escalation's severity and opens a Jira ticket for it. The grader seeds a
  Sev1 case (unique correlationId), imports the exact submitted project into
  its own ephemeral solution, runs it once under `uip maestro bpmn debug
  --inputs`, and asserts what the run did: it completed with no incidents, a
  Jira step completed and returned an issue key, re-reading that key from
  Jira finds a Task in project CE whose summary carries the seeded
  correlationId (this run's ticket, not a fabricated key), and the named outputs read back
  severity=Sev1, caseKey=<correlationId>, jiraIssueKey=<that key>. The Jira
  step is found by connector key alone, so any Create Issue operation counts.
  The created issue is deleted in post_run. Whether the agent ran its own
  test is advisory. A manual start is used because the Outlook email-received
  trigger is not reliably debug-testable.

  Tenant prerequisite: a `uipath-atlassian-jira` connection in folder
  `Shared/uipath-maestro-flow` reaching the `CE` / "Coder Eval" project (issue
  type Task). Targets live in the task's `_setup/jira_is.py`.
tags: [uipath-maestro-bpmn, e2e, mode:build, lifecycle:generate, shape:multi-node, connector, feature:escalation, path-to-ga, outcome-graded]
run_limits:
  expected_turns: 55
  max_turns: 120
  # turn_timeout kept at Flow's verbatim 1200s. Grading sum: command_executed
  # (no timeout: field -> priced at the suite's 30s default) + the validate
  # loop (180s) + the behavior criterion (1600s, check_jira_ticket_run.py) = 1810s.
  # task_timeout must cover turn_timeout + grading (1200 + 1810 = 3010s); raised
  # to 3100s for headroom. This is the one sanctioned run_limits deviation
  # (LIVE-ADDENDUM: "run_limits.task_timeout must cover the agent's turn budget
  # plus all grading").
  task_timeout: 3100
  turn_timeout: 1200

sandbox:
  template_sources:
    - type: template_dir
      path: ../../_setup
      mount_point: _setup
    - type: template_dir
      path: _setup
      mount_point: _setup

pre_run:
  - command: "python3 _setup/seed.py"
    timeout: 60

reference:
  directory: ../..

post_run:
  # Repo-standard solution sweep first (both the agent's own build solution
  # and the grader's ephemeral live-eval solution live under the sandbox CWD).
  - command: "python3 _setup/cleanup_solutions.py"
    timeout: 120
  - command: "python3 _setup/teardown_jira.py"
    timeout: 120

initial_prompt: |
  You are a coding agent in an empty Agentic Process (Maestro BPMN) project.
  No user is present, and nobody will answer a question or grant approval, so
  do not ask, do not pause, and do not wait for input. Do not delete or
  overwrite anything this run did not create, except what the task asks you
  to change, and do not publish to a shared destination unless the task asks
  for it.

  Automate my process called "EscalationJiraTicket" that triages a customer
  escalation and opens a Jira ticket for it. We have an intake form that
  collects senderEmail, senderDomain, subject, body, customerTier,
  productionDown, workaroundAvailable, hasAttachments, customerMatchStatus,
  isDuplicate and correlationId. I will bring these in when I start the
  process.

  How to rate the severity:
  - Sev1: customerTier is "Enterprise", production is down, and there is no
    workaround.
  - Sev2: production is down but there is a workaround.
  - Sev3: everything else.

  Open the ticket as a Task in our Jira project CE ("Coder Eval"). The ticket
  summary must also include the correlationId, for example "[Sev1]
  <correlationId> <subject>".

  Outputs: severity, caseKey (the correlationId we were given) and
  jiraIssueKey (the key of the ticket that was created).

  <!-- helper:start -->
  Inputs: senderEmail (string), senderDomain (string), subject (string), body
  (string), customerTier (string), productionDown (boolean),
  workaroundAvailable (boolean), hasAttachments (boolean), customerMatchStatus
  (string), isDuplicate (boolean), correlationId (string).
  Outputs: severity (string), caseKey (string), jiraIssueKey (string).
  severity is "Sev1", "Sev2" or "Sev3".
  The Jira connection is "is-sandboxes-test@uipath.com-uipath-sandbox-380", in
  the Shared/uipath-maestro-flow folder. Create the issue in project CE as issue
  type Task. The summary includes the correlationId.
  <!-- helper:end -->

  Build the process and do a test run.
success_criteria:
  # Discovered, not hardcoded: Studio Web names the file Process.bpmn.
  - type: run_command
    description: "Generated EscalationJiraTicket BPMN validates without errors"
    command: "python3 $REFERENCE_DIR/_shared/validate_bpmn.py"
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  # Advisory: Studio Web's host may refuse the agent's own `bpmn debug`
  # (UnavailableInHost) and its testbench stubs RunProject.
  - type: command_executed
    description: 'Advisory: the agent ran its own test run (uip maestro bpmn debug), as the request asks'
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+bpmn\s+debug(?!-instances?)(?!\s+--help)\s'
    min_count: 1
    weight: 1.0
    pass_threshold: 0.0

  # 480 (debug) + 90 (solution init) + 180 (solution import)
  # + 120 (variables-all) + 120 (incidents) + Jira connection lookup and
  # issue reread (~360, three 120s CLI calls) + 60 margin = 1410.
  - type: run_command
    description: "Effects: one seeded Sev1 debug run completes with no incidents; a Jira step completes and returns an issue key; re-reading it from Jira finds a Task in project CE whose summary carries the seeded correlationId; outputs severity=Sev1, caseKey=<correlationId>, jiraIssueKey=<that key>"
    command: "python3 $REFERENCE_DIR/e2e/escalation_jira_ticket/check_jira_ticket_run.py"
    timeout: 1600
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0
