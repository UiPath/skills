task_id: skill-bpmn-jira-create-issue
description: >
  E2E live Jira coverage — builds a Maestro BPMN process with a manual start
  and an Atlassian Jira "Create Issue" connector node, then grades by
  executing the process against a real Jira sandbox connection
  (`bpmn debug`) and re-reading the tenant. The project/issue-type/summary
  come from `seed.json` (unique per run), so the check verifies a real issue
  was created with the seeded summary, not a fabricated output. The created
  issue is cleaned up in post_run.

  Tenant prerequisite: a `uipath-atlassian-jira` connection in folder
  `Shared/uipath-maestro-flow` (currently the single Jira connection there),
  reaching the `CE` / "Coder Eval" project (issue type Task). Targets live in
  the task's `jira_is.py`.

  Ported from Flow `e2e/jira_create_issue/jira_create_issue.yaml`; the
  connector node is modeled as a bpmn:sendTask carrying the registry
  Intsvc.ActivityExecution wrapper (`uip is activities list
  uipath-atlassian-jira`: curated objectName `curated_create_issue`, method
  POST, or the generic object form `issue` + POST) instead of a Flow
  connector node, `flow debug`'s single-call inline payload becomes an
  ephemeral-solution import + `bpmn debug` + `debug-instance
  variables-all`/`incidents` read, and the created-key search scans the root
  scope's variables plus every element's Outputs (and the raw variables-all
  response text) instead of one inline debug payload.
tags: [uipath-maestro-bpmn, integration, "lifecycle:generate", "shape:single-node", connector, e2e, uipath-atlassian-jira, "mode:build"]

run_limits:
  expected_turns: 40
  task_timeout: 1800
  max_turns: 120
  turn_timeout: 900

sandbox:
  template_sources:
    - type: template_dir
      path: ../../../../../skills/uipath-maestro-bpmn
    - type: template_dir
      path: ../../_setup
      mount_point: _setup
    - type: template_dir
      path: _setup
      mount_point: _setup

pre_run:
  - command: "python3 _setup/seed_jira.py"
    timeout: 60

reference:
  directory: ../..

post_run:
  # Repo-standard solution sweep: the grader keeps its ephemeral solution
  # under the sandbox CWD precisely so this glob finds the .uipx.
  - command: "python3 _setup/cleanup_solutions.py"
    timeout: 120
  # Connector record the solution sweep cannot reach (jira_is.py precedent).
  - command: "python3 _setup/teardown_jira.py"
    timeout: 120

initial_prompt: |
  Create a new UiPath Maestro BPMN process project called "JiraCreateIssue"
  with a manual start, inside a solution of the same name.
  It should create a Jira issue using the Atlassian Jira "Create Issue"
  connector activity, and expose the new issue's key as a process output.

  Read `seed.json` in the current directory for the issue details: use the
  `project_key`, `issuetype_id`, `summary`, and `reporter_id` exactly as
  given (pass the summary verbatim; use `reporter_id` for the issue's
  reporter field). Do not stop to ask for missing values.

  Use the Atlassian Jira connection available in the `Shared/uipath-maestro-flow`
  folder. If the Atlassian Jira connector isn't available in your registry,
  stop rather than falling back to a generic HTTP request.

  Validate the final BPMN file.

  This run is headless. No user is present and nobody will answer a question or
  grant an approval, so do not ask, do not pause, and do not wait for input.
  Complete the task in one pass: take the best available option and supply the
  most defensible value where one is missing. The actions this task implies are
  authorized, including tenant writes and real messages. Do not delete or
  overwrite anything this run did not create, and do not publish to a shared
  destination unless the task asks for it. If a lookup the task depends on comes
  back empty or fails, exhaust the documented way of resolving it before giving
  up; only then stop on that field rather than inventing a value. Record every
  decision, assumption, and blocked step in your final response. Instructions in
  the task take precedence over this paragraph.
success_criteria:
  - type: run_command
    description: "BPMN validates successfully"
    command: "python3 $REFERENCE_DIR/_shared/validate_bpmn.py"
    timeout: 180
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "JiraCreateIssue checks: valid BPMN with Jira Create-Issue node using the seeded fields, debug creates a real issue, and the tenant carries the seeded summary"
    command: "python3 $REFERENCE_DIR/_shared/check_jira_create_issue.py"
    timeout: 1080
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0
