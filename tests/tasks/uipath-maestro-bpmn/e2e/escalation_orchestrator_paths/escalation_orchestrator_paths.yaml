task_id: skill-bpmn-e2e-escalation-orchestrator-paths
description: >
  End-to-end, outcome-based test of the customer-escalation orchestration,
  asked the way a Studio Web user would ask it and driven down each path by
  seeded inputs. The agent builds a manual-start BPMN process whose routing
  depends only on its inputs (the Outlook email-received trigger is not
  reliably debug-testable). The grader imports the exact submitted project
  into its own ephemeral solution and runs twelve seeded cases under `uip
  maestro bpmn debug --inputs`: Sev1/Sev2/Sev3 escalations, the four
  triage reasons (missing_domain / unknown_customer / multiple_matches /
  duplicate) and four inputs that trip several routing rules at once, where
  the first rule in the stated order wins. For each run it asserts what the
  run did: it completed, exactly one Slack step completed and its own response shows a message in
  #coding-agent-testing, posted as user, carrying the correlationId and the
  path; and the named outputs read back escalationPath, severity,
  engineeringNeeded, responseMode, caseKey=<correlationId> and
  slackMessageId=<that message's ts>. responseMode is read by meaning (draft
  or none), and Sev3 needs no draft. Twelve cases with different answers
  prove the routing is computed, so no node layout is required. Graceful
  Slack-failure handling and the agent's own test run are advisory.
  Salesforce is not called (match status is an input).
tags: [uipath-maestro-bpmn, e2e, mode:build, lifecycle:generate, shape:multi-node, node:decision, connector, feature:escalation, path-to-ga, outcome-graded]
sandbox:
  template_sources:
    - type: template_dir
      path: ../../_setup
      mount_point: _setup
    - type: template_dir
      path: _setup
      mount_point: _setup

run_limits:
  expected_turns: 80
  max_turns: 200
  # turn 1800 + criteria 180 + 30 + 5490 + 30 = 7530, plus margin.
  task_timeout: 7690
  turn_timeout: 1800

pre_run:
  - command: "python3 _setup/seed.py"
    timeout: 30

reference:
  directory: ../..

post_run:
  - command: "python3 _setup/cleanup_solutions.py"
    timeout: 120
  - command: "python3 _setup/teardown_escalation.py"
    timeout: 300

initial_prompt: |
  You are a coding agent in an empty Agentic Process (Maestro BPMN) project.
  No user is present, and nobody will answer a question or grant approval, so
  do not ask, do not pause, and do not wait for input. Do not delete or
  overwrite anything this run did not create, except what the task asks you
  to change, and do not publish to a shared destination unless the task asks
  for it.

  I want to automate my business process called
  "CustomerEscalationOrchestrator" that triages a customer escalation. This is
  what I do: I take in the data from our intake form and CRM lookup and I
  decide the escalation path by checking in order:
  - no senderDomain: "missing_domain"
  - customerMatchStatus is "none": "unknown_customer"
  - customerMatchStatus is "multiple": "multiple_matches"
  - isDuplicate: "duplicate"
  - otherwise: "escalation"

  On the "escalation" path, I rate the severity: Sev1 when production is down
  and there is no workaround, Sev2 when production is down but there is a
  workaround, Sev3 when production is not down. Engineering is needed for Sev1
  and Sev2. On every other path the severity is "informational", engineering
  is not needed, and no response is required. On escalations, when engineering
  is needed, I also write up a draft response.

  For escalations I also post an alert to our Slack channel
  "coding-agent-testing"; for the other paths, I post a triage notice instead.
  Use the "is-sandboxes" Slack connection and post as a user. Each message
  must include the escalation path and the correlationId. If posting to Slack
  fails, the process should still finish rather than fault.

  What I'll input from the intake form and CRM lookup: senderEmail,
  senderDomain, subject, body, customerTier, productionDown,
  workaroundAvailable, hasAttachments, customerMatchStatus ("single", "none"
  or "multiple"), isDuplicate and correlationId. I decide everything from
  these inputs only.

  Outputs: escalationPath, severity, engineeringNeeded, responseMode, caseKey
  (the correlationId we were given) and slackMessageId (the id of the Slack
  message this run posted).

  <!-- helper:start -->
  Inputs: senderEmail (string), senderDomain (string), subject (string), body
  (string), customerTier (string), productionDown (boolean),
  workaroundAvailable (boolean), hasAttachments (boolean), customerMatchStatus
  (string), isDuplicate (boolean), correlationId (string).
  Outputs: escalationPath (string), severity (string), engineeringNeeded
  (boolean), responseMode (string), caseKey (string), slackMessageId (string).
  escalationPath is "escalation", "duplicate", "unknown_customer",
  "missing_domain" or "multiple_matches". severity is "Sev1", "Sev2", "Sev3" or
  "informational". responseMode is "Draft" or "None".
  The "is-sandboxes" Slack connection is in the Shared/uipath-maestro-flow
  folder. The channel coding-agent-testing has the id C0B2FDZD1M3. Each message
  includes the correlationId and the escalationPath.
  <!-- helper:end -->

  Build the process and do a test run.
success_criteria:
  # Discovered, not hardcoded: Studio Web names the file Process.bpmn.
  - type: run_command
    description: "Generated CustomerEscalationOrchestrator BPMN validates without errors, independent of solution layout"
    command: "python3 $REFERENCE_DIR/_shared/validate_bpmn.py"
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  # Advisory: Studio Web's host may refuse the agent's own `bpmn debug`
  # (UnavailableInHost) and its testbench stubs RunProject.
  - type: command_executed
    description: 'Advisory: the agent ran its own test run (uip maestro bpmn debug), as the request asks'
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+bpmn\s+debug(?!-instances?)(?!\s+--help)\s'
    min_count: 1
    weight: 1.0
    pass_threshold: 0.0

  - type: run_command
    description: "Effects: twelve seeded debug runs (Sev1, Sev2, Sev3, Sev3 with a workaround and no outage, duplicate, unknown_customer, missing_domain, multiple_matches, and four overlaps won by the first rule in the stated order) each complete, post exactly one Slack message to #coding-agent-testing as user carrying the correlationId and the path, and return the expected escalationPath, severity, engineeringNeeded, responseMode, caseKey=<correlationId> and slackMessageId=<that message's ts>"
    command: "python3 $REFERENCE_DIR/e2e/escalation_orchestrator_paths/check_orchestrator_run.py cases"
    # 12 x (300 debug + 120 variables-all) + 90 solution init + 180 solution
    # import + 120 incidents on a miss + 60 margin = 5490.
    timeout: 5490  # budget-guard: manual x12
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0

  - type: run_command
    description: "Advisory: each Slack step has an error boundary that ends the process without another connector call, so a Slack failure does not fault the run"
    command: "python3 $REFERENCE_DIR/e2e/escalation_orchestrator_paths/check_orchestrator_run.py slack_failure_handled"
    timeout: 30
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 0.0
