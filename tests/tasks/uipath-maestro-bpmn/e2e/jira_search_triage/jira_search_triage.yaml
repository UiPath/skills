task_id: skill-bpmn-jira-search-triage
description: >
  E2E live Jira coverage of a JQL-search-driven triage process: a
  manual-start Maestro BPMN process that searches for issues matching a
  seeded JQL and, for each match, adds a triage comment. pre_run seeds two
  real issues carrying a unique tag; grading runs the process (`bpmn debug`)
  and asserts both seeded issues come back carrying the triage comment.

  Tenant prerequisite: a `uipath-atlassian-jira` connection in folder
  `Shared/uipath-maestro-flow` reaching the `CE` / "Coder Eval" project, with
  issue-search scope. Targets live in `jira_is.py`.

  Ported from Flow `e2e/jira_search_triage/jira_search_triage.yaml`; the
  search-and-loop-and-comment shape is modeled as a bpmn:sendTask carrying
  the registry Intsvc.ActivityExecution wrapper for the Search Issues by JQL
  operation (`uip is activities list uipath-atlassian-jira`: curated
  objectName `issue_search_get`, method GET) feeding a
  bpmn:multiInstanceLoopCharacteristics loop over the matches, whose body is
  an Add Comment connector activity (curated objectName
  `curated_add_comment`), instead of a Flow search node feeding a
  `core.logic.loop` node. `flow debug`'s single inline payload becomes an
  ephemeral-solution import + `bpmn debug` + `debug-instance incidents` read.
  The second criterion's timeout is raised from Flow's 1320s to 1440s: the
  BPMN sequence adds the ephemeral solution init/import and an explicit
  incidents read on top of Flow's single inline debug call, on the same
  tenant re-read Flow itself performs (arithmetic in the grader's docstring).
tags: [uipath-maestro-bpmn, integration, "lifecycle:generate", "shape:multi-node", "node:loop", connector, e2e, uipath-atlassian-jira, "mode:build"]

# Parked (platform/skill gap). Criteria stay one-for-one with Flow; unskip when the gap closes.
# platform/skill gap: multiInstanceLoopCharacteristics over a connector response fails at runtime with 400008 (CI run 35525387843).
skip: true

run_limits:
  expected_turns: 45
  task_timeout: 2400
  max_turns: 120
  turn_timeout: 900

sandbox:
  template_sources:
    - type: template_dir
      path: ../../_setup
      mount_point: _setup
    - type: template_dir
      path: _setup
      mount_point: _setup

pre_run:
  - command: "python3 _setup/seed_jira.py"
    timeout: 90

reference:
  directory: ../..

post_run:
  # Repo-standard solution sweep: the grader keeps its ephemeral solution
  # under the sandbox CWD precisely so this glob finds the .uipx.
  - command: "python3 _setup/cleanup_solutions.py"
    timeout: 120
  # Connector record the solution sweep cannot reach (jira_is.py precedent).
  - command: "python3 _setup/teardown_jira.py"
    timeout: 120

initial_prompt: |
  Create a new UiPath Maestro BPMN process project called "JiraSearchTriage"
  with a manual start, inside a solution of the same name.

  Read `seed.json` in the current directory for the `jql` query and the
  `processed_comment` body.

  Build a process that:
    1. Searches Jira for issues matching `jql`, using the Atlassian Jira
       "Search Issues by JQL" connector activity.
    2. Loops over the returned issues and adds a comment to each whose body is
       `processed_comment` (pass it verbatim), using the "Add Comment" activity.

  Use the Atlassian Jira connection available in the `Shared/uipath-maestro-flow`
  folder. If the Atlassian Jira connector isn't available in your registry, stop
  rather than falling back to a generic HTTP request.

  Validate the final BPMN file.

  This run is headless. No user is present and nobody will answer a question or
  grant an approval, so do not ask, do not pause, and do not wait for input.
  Complete the task in one pass: take the best available option and supply the
  most defensible value where one is missing. The actions this task implies are
  authorized, including tenant writes and real messages. Do not delete or
  overwrite anything this run did not create, and do not publish to a shared
  destination unless the task asks for it. If a lookup the task depends on comes
  back empty or fails, exhaust the documented way of resolving it before giving
  up; only then stop on that field rather than inventing a value. Record every
  decision, assumption, and blocked step in your final response. Instructions in
  the task take precedence over this paragraph.
success_criteria:
  - type: run_command
    description: "BPMN validates successfully"
    command: "python3 $REFERENCE_DIR/_shared/validate_bpmn.py"
    timeout: 180
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "JiraSearchTriage checks: valid BPMN with a JQL search feeding a loop of Add-Comment, debug completes, and both seeded issues carry the triage comment"
    command: "python3 $REFERENCE_DIR/_shared/check_jira_search_triage.py"
    timeout: 1440
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0
