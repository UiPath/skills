task_id: skill-bpmn-e2e-invoice-exception-triage
description: >
  Skill-guided e2e evaluation: agent uses the uipath-maestro-bpmn skill to
  author a synthetic BPMN Process Orchestration project with a script task,
  gateway branch, human review task, and complete package metadata. This
  exercises greenfield BPMN source authoring, diagram requirements, and local
  package-file consistency without cloud-side effects.
tags: [uipath-maestro-bpmn, e2e, "mode:build", "lifecycle:generate", "shape:multi-node", "node:decision", "node:hitl", "feature:approval-gate"]

run_limits:
  task_timeout: 2400
  turn_timeout: 1800
  expected_turns: 25

# The check imports _shared/bpmn_check.py, so the reference mirror must span
# the whole uipath-maestro-bpmn task tree, not just e2e/. This yaml sits
# directly in e2e/ (no per-task subdir), so one `..` reaches the tree root.
reference:
  directory: ..

initial_prompt: |
  Create a new local Maestro BPMN Process Orchestration project named
  InvoiceExceptionTriage. The project must be fully synthetic and public-safe.

  Model this process:
  - Manual start event accepts invoiceId and amount variables.
  - Script task classifyInvoice sets a risk value.
  - Exclusive gateway routeByRisk sends low-risk invoices to an auto-approved
    end event and high-risk invoices to a user task named Review invoice.
  - The human review path ends at a reviewed end event.

  Include BPMN DI shapes/edges for all visible elements and create the package
  metadata files expected by the skill:
  project.uiproj, bindings_v2.json, entry-points.json, operate.json, and
  package-descriptor.json.

  Do NOT upload, publish, deploy, debug, run a process, ask for approval,
  confirmation, or feedback. Do NOT pause between planning and implementation.
  Build the complete local project end-to-end in a single pass.

success_criteria:
  # The prompt names only the project, not its directory layout. `uip maestro
  # bpmn init` nests the project under a `<Name>Solution/` wrapper unless the
  # agent passes --skip-solution-registration, so grade the project wherever
  # the agent placed it (rglob), like the other BPMN e2e tasks.
  - type: run_command
    description: "BPMN source file was created"
    command: "python3 -c \"from pathlib import Path; import sys; sys.exit(0 if any(Path('.').rglob('InvoiceExceptionTriage.bpmn')) else 'InvoiceExceptionTriage.bpmn missing')\""
    timeout: 30
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "Project metadata file was created beside the BPMN source"
    command: "python3 -c \"from pathlib import Path; import sys; b=next(Path('.').rglob('InvoiceExceptionTriage.bpmn'), None); sys.exit(0 if b and (b.parent / 'project.uiproj').is_file() else 'project.uiproj missing beside InvoiceExceptionTriage.bpmn')\""
    timeout: 30
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "Package operate metadata was created beside the BPMN source"
    command: "python3 -c \"from pathlib import Path; import sys; b=next(Path('.').rglob('InvoiceExceptionTriage.bpmn'), None); sys.exit(0 if b and (b.parent / 'operate.json').is_file() else 'operate.json missing beside InvoiceExceptionTriage.bpmn')\""
    timeout: 30
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "Generated BPMN project has the required process structure and package references"
    command: "python3 $REFERENCE_DIR/e2e/check_invoice_exception_triage.py"
    timeout: 30
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0

  # Deterministic twin of the judge below (as in event_trigger_start.yaml), so the
  # judge is not the only guard on the prompt's "Do NOT upload, publish, deploy, debug, run a process".
  # The CLI spells these `uip solution upload|publish|deploy` and `uip maestro bpmn
  # process run|publish` (assets/uip-catalog-snapshot.json), so those count too.
  # A `--help` on the same command is a read and does not count.
  # `pack` is left out: this prompt asks for the package metadata files and does
  # not forbid packing, which is local.
  - type: command_not_executed
    description: "Agent did not run any cloud-side Maestro BPMN lifecycle command"
    tool_name: "Bash"
    command_pattern: '(?:\buip|\$UIP)\s+(?:maestro\s+bpmn\s+(?:upload|publish|deploy|debug|run|process\s+(?:run|publish))|solution\s+(?:upload|publish|deploy))\b(?![^\n;&|]*\s(?:--help|-h)\b)'
    weight: 1.0
    pass_threshold: 1.0

  - type: llm_judge
    description: "Agent kept the lifecycle local and avoided cloud-side operations"
    weight: 2.0
    pass_threshold: 0.7
    include_agent_output: true
    include_tool_calls: true
    include_reference: false
    prompt: >
      Pass if the agent created only local project files and did not run or
      request approval for BPMN debug, process run, upload, publish, or deploy
      commands. Exactly these commands are always acceptable and must
      NOT fail this check, because each reads or writes only local
      files: `uip maestro bpmn check`, `compile`, `decompile`, `format`,
      `merge`, `validate`, `init` and `refresh` (offline source checks,
      conversion between `.bpmn.ts` source and `.bpmn` XML, diagram
      layout, validation, and local scaffold and metadata files; none of
      them packs, uploads or runs anything), read-only registry and
      connection reads (`uip maestro bpmn registry list/get/pull/search`
      and `uip maestro registry prepare/describe/search/get/pull`), and
      `--help` invocations. Fail only if
      tool calls or the final answer show a cloud-side lifecycle mutation or
      a request to perform one.
