task_id: skill-bpmn-e2e-agent-deploy-run
description: >
  E2E live coverage for a BPMN process that calls a low-code agent built in
  the same solution. The agent authors both projects, deploys the solution
  into a new Orchestrator folder, and must leave the process working from
  that folder. Graded on the live outcome: both processes are deployed in the
  seeded folder, and a run of the deployed process there, with inputs the
  grader picks after the agent stops, returns the right sum, the agent's
  classification of the name, and its reason. The end event must publish the
  classification and reason straight from one agent-job node's response
  fields, that node must run once and hold those values, and the one job it
  started must be a successful job of the folder's Agent process. Covers what the
  authoring-only agent_job task and the agents deploy task cannot: the
  deployed agent actually answering when the deployed process calls it.
tags: [uipath-maestro-bpmn, e2e, "mode:build", "lifecycle:setup", "shape:multi-node", resource, outcome-graded, studio-web-unsupported, studio-web-unsupported:no-testbench-publish]

run_limits:
  max_turns: 150
  task_timeout: 3900
  turn_timeout: 2400

sandbox:
  template_sources:
    # teardown.py comes from api_workflow_composition; seed.json uses its keys.
    - type: template_dir
      path: ../api_workflow_composition/_setup
      mount_point: _setup
    - type: template_dir
      path: _setup
      mount_point: _setup

reference:
  directory: ../..

pre_run:
  - command: "python3 _setup/seed_agent_deploy.py"
    timeout: 60

post_run:
  - command: "python3 _setup/teardown.py"
    timeout: 300

initial_prompt: |
  Read `seed.json` in the current directory. It carries:
  - `solutionName` -- the exact Studio Web solution name to create/use.
  - `parentFolderPath` and `folderName` -- concatenate them
    (`<parentFolderPath>/<folderName>`) for the Orchestrator folder to
    deploy into.

  Build, in that solution, a Maestro BPMN process that takes two numbers
  `a` and `b` and a person's first name `name`, and returns:
  - `sum` -- a + b
  - `gender` -- "male", "female" or "unknown" for that first name, decided by
    a low-code agent you build in the same solution and the process calls
  - `reason` -- the agent's one-sentence explanation

  Deploy the solution into the seeded folder. The process has to work when
  it runs from that folder: after you stop, it is run there with other
  inputs. Do not delete or overwrite any pre-existing tenant object outside
  what this task created.

  This run is headless. No user is present and nobody will answer a
  question or grant an approval, so do not ask, do not pause, and do not
  wait for input. Complete the task in one pass: take the best available
  option and supply the most defensible value where one is missing. The
  actions this task implies are authorized, including tenant writes.
  If a lookup the task depends on comes back empty or fails, exhaust the
  documented way of resolving it before giving up; only then stop on that
  field rather than inventing a value. Record every decision, assumption,
  and blocked step in your final response. Instructions in the task take
  precedence over this paragraph.

  Load and follow the `uipath-maestro-bpmn` skill.

success_criteria:
  - type: skill_triggered
    description: "Agent invoked the uipath-maestro-bpmn skill"
    skill_name: "uipath-maestro-bpmn"
    expected_skill: "uipath-maestro-bpmn"
    weight: 1.0
    pass_threshold: 1.0

  - type: skill_triggered
    description: "Advisory: agent loaded the uipath-agents skill to build the agent (informational, non-gating)"
    skill_name: "uipath-agents"
    expected_skill: "uipath-agents"
    weight: 1.0
    pass_threshold: 0.0

  - type: run_command
    description: "Deployed: the seeded folder holds the BPMN process (ProcessOrchestration) and the low-code agent (Agent)"
    command: "python3 $REFERENCE_DIR/e2e/agent_deploy_run/check_agent_deploy_folder.py"
    timeout: 180
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "Behaviour: the deployed process, started in the seeded folder with grader-picked inputs, completes cleanly with the right sum, gender and reason; gender and reason are published from one agent-job node's response fields, that node runs once, and the job it started is a successful job of the folder's Agent process"
    command: "python3 $REFERENCE_DIR/e2e/agent_deploy_run/check_agent_deploy_behavior.py"
    timeout: 1260
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0
