task_id: skill-bpmn-e2e-devcon-expense-approval
description: >
  DevCon end-to-end scenario: developer gives a vague expense approval requirement.
  Agent must detect the HITL need, design a sensible schema with correctly typed
  fields, build the full process (manual start → script → HITL → script → end),
  wire edges correctly so the HITL's decision reaches the downstream logging
  step, and validate. Tests that both the maestro-bpmn and human-in-the-loop
  skills work together across the full authoring lifecycle. Validate-only: an
  Actions.HITL user task blocks on human review and cannot be `bpmn debug`-ged
  headlessly, so correctness is enforced via the semantic checker rather than
  runtime.
  Ported from Flow `e2e/devcon_expense_approval.yaml`; HITL fields/outcomes
  become Actions.HITL context inputs and typed outputs bound to declared
  process variables, node-id data bindings (`vars.<node>.output.<field>`)
  become flat `vars.<VarId>` variable references, and Flow's per-outcome port
  wiring (`outcome-<id>` handles) has no BPMN analog — it collapses to a
  single completion edge from the userTask to the downstream script, since
  both of Flow's outcome ports were wired to that same node anyway. Platform
  difference: unlike Flow's inline quick-form (no tenant resource needed),
  Actions.HITL binds to a real deployed Action App, so `uip maestro bpmn
  validate` can only pass with a genuine appId/actions/key binding — an
  agent that authors placeholder `<ACTION_APP_ID>` values (the correct move
  when no such app exists) will fail validate with `MISSING_BINDING` even
  though the process is otherwise well-formed.
tags: [uipath-maestro-bpmn, uipath-human-in-the-loop, e2e, devcon]

run_limits:
  expected_turns: 29
  max_turns: 120
  turn_timeout: 1200

reference:
  directory: ../..

sandbox:
  template_sources:
    - type: template_dir
      path: ../../../../../skills/uipath-maestro-bpmn

initial_prompt: |
  I want to automate our expense approval workflow. Here's the rough idea:

  Employees submit expense reports through our internal system. We need a
  process that:
  - Pulls the expense details (mock this with a script for now — expense
    amount, who submitted it, what category like "Travel" or "Equipment", and
    an expense ID)
  - Sends it to a manager for review. The manager needs to see the details and
    either approve or reject. If they reject, they should be able to add a
    reason. The manager group is "expense-approvers".
  - After the manager decides, log the outcome in another script step — it
    should read the manager's decision and their rejection reason if they
    rejected it.

  I'm not sure exactly what all the fields should be, but the key ones are: the
  amount (it's a number), the submitter's name (text), and the category (text).
  The manager fills in their decision (approved yes/no) and optionally a reason.

  Build the complete process as a UiPath Maestro BPMN project called
  "ExpenseApproval" in a solution of the same name. Wire everything end-to-end
  and validate it.

  Do NOT upload, publish, deploy, debug, or run the process. Do not pause for
  approval, confirmation, or feedback.

  This run is headless. No user is present and nobody will answer a question or
  grant an approval, so do not ask, do not pause, and do not wait for input.
  Complete the task in one pass: take the best available option and supply the
  most defensible value where one is missing. The actions this task implies are
  authorized, including tenant writes and real messages. Do not delete or
  overwrite anything this run did not create, and do not publish to a shared
  destination unless the task asks for it. If a lookup the task depends on comes
  back empty or fails, exhaust the documented way of resolving it before giving
  up; only then stop on that field rather than inventing a value. Record every
  decision, assumption, and blocked step in your final response. Instructions in
  the task take precedence over this paragraph.
success_criteria:
  - type: command_executed
    description: "Agent created a solution"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP|\$\{?UIP\}?)\s+(solution\s+(new|init)|maestro\s+bpmn\s+init)'
    min_count: 1
    weight: 1.0
    pass_threshold: 0.0  # advisory: bpmn init auto-scaffolds the wrapper solution unless --skip-solution-registration is passed (CI 35500726138)

  - type: command_executed
    description: "BPMN-project initialization telemetry (report only; the artifact is graded below)"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP|\$\{?UIP\}?)\s+maestro\s+bpmn\s+init'
    min_count: 1
    weight: 1.0
    pass_threshold: 0.0

  - type: run_command
    description: "BPMN file exists (path-agnostic discovery)"
    command: "python3 -c \"from pathlib import Path; import sys; sys.exit(0 if any(Path('.').rglob('ExpenseApproval*.bpmn')) else sys.exit('ExpenseApproval*.bpmn missing'))\""
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "BPMN has semantically correct inline HITL schema, decision capture, downstream wiring, and vars.<id> access paths"
    command: "python3 $REFERENCE_DIR/_shared/check_devcon_expense_approval.py"
    timeout: 30
    expected_exit_code: 0
    weight: 16.5
    pass_threshold: 1.0

  - type: command_executed
    description: "BPMN-validation telemetry (report only; successful validation is graded below)"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP|\$\{?UIP\}?)\s+maestro\s+bpmn\s+validate'
    min_count: 1
    weight: 2.5
    pass_threshold: 0.0

  - type: run_command
    description: "BPMN validates successfully"
    command: 'for f in $(find . -maxdepth 6 -name "*.bpmn" -not -path "*/node_modules/*"); do uip maestro bpmn validate "$f" --output json >/dev/null 2>&1 && exit 0; done; exit 1'
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
