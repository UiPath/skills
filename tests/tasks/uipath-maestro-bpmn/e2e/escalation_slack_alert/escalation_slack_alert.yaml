task_id: skill-bpmn-e2e-escalation-slack-alert
description: >
  End-to-end, outcome-based slice of the customer-escalation orchestration.
  The agent builds a manual-start escalation-triage BPMN process that
  classifies severity and posts a Slack alert. A manual start is used
  deliberately — the Outlook email-received trigger cannot be reliably
  debug-tested (seeding a self-addressed email is flaky against the shared
  mailbox; see the outlook_trigger_inbox and customer_escalation task
  notes). The grader seeds a Sev1 case, imports the exact submitted project
  into an ephemeral solution, runs `uip maestro bpmn debug --inputs`, and
  verifies the OUTCOME via `debug-instance variables-all`/`incidents`: the
  process completes, classifies Sev1 with engineering needed, preserves the
  correlationId, and — the point of the test — the Slack Send Message
  activity actually posted (its own response ts is exposed as a process
  output). Grades the delivered Slack side effect, not "did it run".

  Ported from Flow `e2e/escalation_slack_alert/escalation_slack_alert.yaml`;
  the Script node is a bpmn:scriptTask (BPMN.Variables mapping) and the
  Slack activity is a bpmn:sendTask carrying Intsvc.ActivityExecution; `flow
  debug`'s single-call inline payload becomes an ephemeral-solution import
  (sha256-pinned) + `bpmn debug` + `debug-instance variables-all`/
  `incidents`, because `bpmn debug` returns an instance id rather than
  inline variables. No Jira, no tenant re-read, and no Slack teardown — same
  as the ported Flow task, which never re-reads the tenant or deletes the
  message it posts.
tags: [uipath-maestro-bpmn, e2e, mode:build, lifecycle:generate, shape:multi-node, connector, feature:escalation, path-to-ga, outcome-graded]

run_limits:
  expected_turns: 55
  max_turns: 120
  task_timeout: 2600
  turn_timeout: 1200

sandbox:
  template_sources:
    - type: template_dir
      path: ../../../../../skills/uipath-maestro-bpmn
    - type: template_dir
      path: ../../_setup
      mount_point: _setup
    - type: template_dir
      path: _setup
      mount_point: _setup

pre_run:
  - command: "python3 _setup/seed.py"
    timeout: 30

reference:
  directory: ../..

post_run:
  - command: "python3 _setup/cleanup_solutions.py"
    timeout: 120

initial_prompt: |
  Build a UiPath Maestro BPMN process named "EscalationSlackAlert" (inside a
  solution of the same name) with a MANUAL start.

  The process triages a customer escalation and posts a Slack alert with next
  steps. Declare these process inputs (in variables associated with the start
  event): senderEmail, subject, body, customerTier, productionDown (boolean),
  workaroundAvailable (boolean), correlationId.

  Steps:
  1. A Script task classifies severity from the inputs:
     - Sev1  = customerTier is "Enterprise" AND productionDown is true AND
               workaroundAvailable is false.
     - Sev2  = productionDown is true AND workaroundAvailable is true.
     - Sev3  = everything else (informational / no production impact).
     Also decide engineeringNeeded (true for Sev1 and Sev2, false for Sev3) and a
     short nextSteps string.
  2. Post a Slack alert to the channel "coding-agent-testing" using the Slack
     "Send Message to channel" connector activity. Use the Slack connection
     named "is-sandboxes" and send as `user`. The message must include the
     severity, the correlationId, and the next steps.
  3. End the process, mapping these public output variables:
     - severity          (Sev1 / Sev2 / Sev3)
     - engineeringNeeded (boolean)
     - caseKey           = the incoming correlationId
     - slackMessageId    = the identifier of the Slack message that was posted
                           (from the Slack Send node's own output)

  Validate the BPMN. Do NOT run or debug the process — the grader executes it
  with seeded inputs. Before starting, load the uipath-maestro-bpmn skill and
  follow its workflow.

  This run is headless. No user is present and nobody will answer a question or
  grant an approval, so do not ask, do not pause, and do not wait for input.
  Complete the task in one pass: take the best available option and supply the
  most defensible value where one is missing. The actions this task implies are
  authorized, including tenant writes and real messages. Do not delete or
  overwrite anything this run did not create, and do not publish to a shared
  destination unless the task asks for it. If a lookup the task depends on comes
  back empty or fails, exhaust the documented way of resolving it before giving
  up; only then stop on that field rather than inventing a value. Record every
  decision, assumption, and blocked step in your final response. Instructions in
  the task take precedence over this paragraph.
success_criteria:
  # ── The agent validated the BPMN (convention adherence) ─────────────────
  - type: command_executed
    description: "Agent validated the generated BPMN"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP|\$\{?UIP\}?)\s+maestro\s+bpmn\s+validate'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  # ── The delivered BPMN validates ────────────────────────────────────────
  - type: run_command
    description: "Generated EscalationSlackAlert BPMN validates without errors, independent of solution layout"
    command: "python3 $REFERENCE_DIR/_shared/validate_bpmn.py"
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  # ── OUTCOME: seeded Sev1 run posts to Slack and returns the right outputs ─
  - type: run_command
    description: "Seeded Sev1 debug run completes, classifies Sev1 + engineering, preserves correlationId, and the Slack alert was actually posted (non-empty message id)"
    command: "python3 $REFERENCE_DIR/_shared/check_escalation_slack_alert.py"
    timeout: 1100
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0
