task_id: skill-bpmn-e2e-escalation-slack-alert
description: >
  End-to-end, outcome-based slice of the customer-escalation orchestration,
  asked the way a Studio Web user would ask it: a manual-start BPMN process
  classifies an escalation's severity and posts a Slack alert. (The Outlook
  email-received trigger cannot be reliably debug-tested, so the start is
  manual.) The grader imports the exact submitted project into its own
  ephemeral solution, runs the seeded Sev1 case once under `uip maestro bpmn
  debug --inputs`, and asserts what the run did: it completed with no
  incidents, a Slack step completed and its own response shows a message in
  #coding-agent-testing carrying the correlationId and severity, and the
  named outputs read back severity=Sev1, engineeringNeeded=true,
  caseKey=<correlationId>, slackMessageId=<that message's ts>. Statically:
  the posting step sends as `user`, and the process names all three
  severities. Whether the agent ran its own test is advisory.
tags: [uipath-maestro-bpmn, e2e, mode:build, lifecycle:generate, shape:multi-node, connector, feature:escalation, path-to-ga, outcome-graded]
run_limits:
  expected_turns: 55
  max_turns: 120
  task_timeout: 2600
  turn_timeout: 1200

sandbox:
  template_sources:
    - type: template_dir
      path: ../../_setup
      mount_point: _setup
    - type: template_dir
      path: _setup
      mount_point: _setup

pre_run:
  - command: "python3 _setup/seed.py"
    timeout: 30

reference:
  directory: ../..

post_run:
  - command: "python3 _setup/cleanup_solutions.py"
    timeout: 120
  - command: "python3 _setup/teardown_escalation.py"
    timeout: 300

initial_prompt: |
  You are a coding agent in an empty Agentic Process (Maestro BPMN) project.
  No user is present, and nobody will answer a question or grant approval, so
  do not ask, do not pause, and do not wait for input. Do not delete or
  overwrite anything this run did not create, except what the task asks you
  to change, and do not publish to a shared destination unless the task asks
  for it.

  Build a process called "EscalationSlackAlert" that triages a customer
  escalation and alerts the team in Slack. Someone starts it by hand with
  these inputs: senderEmail, subject, body, customerTier, productionDown,
  workaroundAvailable and correlationId.

  How to rate the severity:
  - Sev1: customerTier is "Enterprise", production is down, and there is no
    workaround.
  - Sev2: production is down but there is a workaround.
  - Sev3: everything else.

  Engineering is needed for Sev1 and Sev2, not for Sev3. Also write a short
  note on the next steps.

  Post the alert to our Slack channel "coding-agent-testing" through the
  "is-sandboxes" Slack connection, posted as the user rather than the bot. The
  message must include the severity, the correlationId and the next steps.

  Outputs: severity (Sev1, Sev2 or Sev3), engineeringNeeded, caseKey (the
  correlationId we were given) and slackMessageId (the id of the Slack message
  that was posted).

  <!-- helper:start -->
  Inputs: senderEmail (string), subject (string), body (string), customerTier
  (string), productionDown (boolean), workaroundAvailable (boolean),
  correlationId (string).
  Outputs: severity (string), engineeringNeeded (boolean), caseKey (string),
  slackMessageId (string). severity is "Sev1", "Sev2" or "Sev3".
  The "is-sandboxes" Slack connection is in the Shared/uipath-maestro-flow
  folder. The channel coding-agent-testing has the id C0B2FDZD1M3.
  <!-- helper:end -->

  Build the process and do a test run.
success_criteria:
  # ── The delivered BPMN validates ────────────────────────────────────────
  - type: run_command
    description: "Generated EscalationSlackAlert BPMN validates without errors, independent of solution layout"
    command: "python3 $REFERENCE_DIR/_shared/validate_bpmn.py"
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  # Advisory: Studio Web's host may refuse the agent's own `bpmn debug`
  # (UnavailableInHost) and its testbench stubs RunProject.
  - type: command_executed
    description: 'Advisory: the agent ran its own test run (uip maestro bpmn debug), as the request asks'
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+bpmn\s+debug(?!-instances?)(?!\s+--help)\s'
    min_count: 1
    weight: 1.0
    pass_threshold: 0.0

  # ── OUTCOME: seeded Sev1 run posts to Slack and returns the right outputs ─
  # 480 (debug) + 90 (solution init) + 180 (solution import)
  # + 120 (variables-all) + 120 (incidents) + 60 margin = 1050.
  - type: run_command
    description: "Effects: one seeded Sev1 debug run completes with no incidents; a Slack step completes and its own response shows a message in #coding-agent-testing carrying the correlationId and Sev1, posted as user; outputs severity=Sev1, engineeringNeeded=true, caseKey=<correlationId>, slackMessageId=<that message's ts>"
    command: "python3 $REFERENCE_DIR/e2e/escalation_slack_alert/check_slack_alert_run.py"
    timeout: 1100
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0
