task_id: skill-bpmn-smoke-draft-skeleton-timer
description: >
  Draft-mode smoke eval for a trigger-start shape: the user asks to see the
  shape first, so the agent builds a phase 2 skeleton whose start event is a
  real timer start, with bare bpmn:task boxes and generated DI, makes no
  registry call, and stops at the approval gate instead of wiring real nodes.
tags: [uipath-maestro-bpmn, smoke, "mode:build", "lifecycle:generate", "feature:approval-gate"]

run_limits:
  expected_turns: 20
  max_turns: 60

sandbox:
  python: {}

reference:
  # The parent, so the staged copy also holds the `_shared` that check_draft_skeleton.py imports.
  directory: ..

initial_prompt: |
  I want a BPMN process called "NightlyReportSketch" that runs every morning
  at 6 and looks at yesterday's orders. On a busy day, more than 100 orders,
  the manager gets a full summary; otherwise a short summary is enough.

  Sketch it for me first so I can see the shape. Don't upload or run anything
  yet.

success_criteria:
  # Both skills' draft guidance makes no registry lookup before the gate (v1
  # phase-2-skeleton-guide.md rule 3, v2 draft-skeleton.md rule 3), so the guard
  # covers v1's `uip maestro bpmn registry` and v2's `uip maestro registry`
  # spellings, and v2's `prepare` / `describe` as well as `pull` / `search` / `get`.
  # Excluded: v1's phase 1a preflight `uip maestro bpmn registry list` (the box
  # kind list, which runs before the skeleton by design), and `--help`, which
  # looks nothing up.
  - type: command_not_executed
    description: "Agent made no registry discovery before the shape was approved (the preflight kind list is allowed)"
    tool_name: "Bash"
    command_pattern: '(?:\buip|\$UIP)\s+maestro\s+(?:bpmn\s+)?registry\s+(?:pull|search|get|prepare|describe)\b(?![^\n;&|]*\s(?:--help|-h)\b)'
    weight: 2.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent did not upload, as the request forbids"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+solution\s+upload'
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "Skeleton has a timer start, bare task boxes, a real conditioned gateway, full DI, project metadata, and validates with zero errors"
    command: "python3 $REFERENCE_DIR/smoke/check_draft_skeleton.py NightlyReportSketch --timer-start"
    timeout: 60
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  # The 3c gate is graded on the reply the user reads, through coder_eval's
  # agent-neutral agent output, so it grades claude, codex and antigravity
  # alike. The checklist is itemized and the verdict binary, which keeps the
  # judge close to deterministic. The skeleton is attached so the box lines
  # can be matched to its tasks.
  - type: llm_judge
    description: "The 3c reply follows its template: the outline-ready line, the local .bpmn path, one line per task box, the fixed question and its three options, and nothing else"
    include_reference: false
    include_agent_output: true
    max_file_chars: 60000
    files:
      - NightlyReportSketch/NightlyReportSketch.bpmn
      - NightlyReportSketchSolution/NightlyReportSketch/NightlyReportSketch.bpmn
      # Studio Web: the solution export, whose main file is Process.bpmn.
      - NightlyReportSketch/NightlyReportSketch/Process.bpmn
    weight: 2.0
    pass_threshold: 1.0
    prompt: |
      You check one chat message against a fixed template. Grade the format
      only, never the process design.

      WHICH TEXT TO GRADE. AGENT OUTPUT holds every message the agent sent in
      this turn. If it contains a `[RESULT - ...]` marker, grade the text
      after the LAST such marker: that is the final message, whole. Otherwise
      the messages are joined, possibly with no separator: grade the text from
      the LAST occurrence of `NightlyReportSketch: outline ready` (markdown emphasis around
      the name allowed) to the end, and ignore what comes before it. If the
      phrase does not occur at all, the message fails item 1.

      Ignore blank lines and markdown emphasis (`**`, `*`, backticks). In the
      graded text, check every item:

      1. The first line starts with `NightlyReportSketch: outline ready (draft mode).` and
         does not say `uploaded`. After that, the same line may hold at most
         one more sentence, about a lookup that failed or changes kept.
      2. The second line is the path of the local `.bpmn` file (ends in
         `.bpmn`) as plain text, and nothing else. A Markdown link
         (`[label](<path>)`, whatever its label or target) fails this item:
         the path is written bare, never as a link. In Studio Web, where the
         skeleton is on the canvas, this line is exactly
         `The outline is on the canvas` instead.
      3. Next come the box lines, each starting with `- `. The attached
         `.bpmn` file's `bpmn:task` elements are the task boxes. Every task
         box has exactly one line, and every line names one task box (its
         action words, with or without the bracketed kind), followed by
         `: ` and the box's resource status (a resource name, a
         which-of-two question, `none yet, create it or name one`, `not
         checked`, or `no resource needed`). A box line with no status
         fails this item. The task box's label may end
         with ` → <variable>` (the variable that box produces, which the
         skill puts in the label itself), so a line may carry that suffix
         too: it is part of the box's name, not a resource status and not a
         line explaining a variable. There is no line
         for a start event, timer, gateway, branch, or end event. Each line is
         one short clause, under about 200 characters.
      4. Next is exactly the line `Is this the process you want?`, or, when
         item 2's line is `The outline is on the canvas`, exactly
         `Accept the canvas change to keep this outline, then pick one:`.
      5. Then exactly three numbered options, in this order: `1.` Build it,
         `2.` Change it, `3.` Keep it, each with any short description. Nothing
         follows the third option.
      6. No other line exists anywhere in the graded text, and nothing
         comes before item 1's line: when the graded text is a `[RESULT - ...]`
         block, its first non-blank line must be item 1's line, so any line
         above it fails this item. No status or progress sentence (for
         example "Valid, zero errors", "Lookups complete", "Here is the
         outline"), no `---` separator, no heading, no
         code block or drawn diagram, no `Flow:` or `The shape:` prose, no line
         explaining a gateway, a condition, or a variable, no table.

      Score 1.0 only if every item holds; otherwise 0.0. In findings, list
      each failed item by number and quote the offending line. If the
      attached file is `<file not found>`, judge item 3 on the box lines
      alone and say so.

  # An open question tool keeps the turn running, and Studio Web locks the
  # canvas while a turn runs: the gate must be a plain final message.
  # AskUserQuestion is Claude Code's tool; codex and antigravity have no tool
  # of that name, so this passes vacuously there. coder_eval cannot scope a
  # criterion to one agent type, so it is informational (weight 0, so it
  # adds no score and cannot fail a run): it reports a Claude pick list.
  - type: command_not_executed
    description: "Claude only (vacuous on other agents): the gate question is asked in the final message, not with AskUserQuestion"
    tool_name: "AskUserQuestion"
    command_pattern: '.*'
    weight: 0
    pass_threshold: 0

  - type: run_command
    description: "Every box is labeled with a toolbox kind (the skill's table, else the type's `registry list` Label), never an invented or case-only one"
    command: "python3 $REFERENCE_DIR/smoke/check_skeleton_kinds.py NightlyReportSketch"
    timeout: 60
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  # Tenants hold thousands of processes: a 3c lookup without --search lists
  # them all. The lookahead stays inside one shell command; a line
  # continuation (raw `\<newline>`, or ` <newline>` once coder_eval
  # normalizes the command) does not end it.
  - type: command_not_executed
    description: "Every 3c resource lookup is filtered with --search"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+solution\s+resources\s+list\b(?!(?:\\\n|(?<= )\n|(?!\n|(?:^|[\s;&|(`])(?:uip|\$UIP)\s).)*--search)'
    weight: 1.0
    pass_threshold: 1.0
