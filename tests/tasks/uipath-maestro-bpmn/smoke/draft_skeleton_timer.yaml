task_id: skill-bpmn-smoke-draft-skeleton-timer
description: >
  Draft-mode smoke eval for a trigger-start shape: the user asks to see the
  shape first, so the agent builds a phase 2 skeleton whose start event is a
  real timer start, with bare bpmn:task boxes and generated DI, makes no
  registry call, skips `refresh` (it fails with no manual start), and stops
  at the approval gate instead of wiring real nodes.
tags: [uipath-maestro-bpmn, smoke, "mode:build", "lifecycle:generate", "feature:approval-gate"]

run_limits:
  expected_turns: 20
  max_turns: 60

sandbox:
  python: {}

reference:
  directory: .

initial_prompt: |
  I want a BPMN process called "NightlyReportSketch" that runs every morning
  at 6 and looks at yesterday's orders. On a busy day, more than 100 orders,
  the manager gets a full summary; otherwise a short summary is enough.

  Sketch it for me first so I can see the shape. Don't upload or run anything
  yet.

success_criteria:
  - type: command_not_executed
    description: "Agent made no registry calls before the shape was approved"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+bpmn\s+registry\s+(pull|list|search|get)'
    weight: 2.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent did not upload, as the request forbids"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+solution\s+upload'
    weight: 1.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent skipped refresh, which fails on a trigger-start skeleton"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+bpmn\s+refresh'
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "Skeleton has a timer start, bare task boxes, a real conditioned gateway, full DI, project metadata, and validates with zero errors"
    command: "python3 $REFERENCE_DIR/check_draft_skeleton.py NightlyReportSketch --timer-start"
    timeout: 60
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  # The 3c gate is graded on the reply the user reads (the last message of
  # the turn), read from the Claude Code session transcript: see
  # check_draft_reply.py for where it comes from and the template it holds.
  - type: run_command
    description: "The 3c reply follows its template: the outline-ready line, the local .bpmn path, one line per task box, the fixed question and its three options, and nothing else"
    command: "python3 $REFERENCE_DIR/check_draft_reply.py gate NightlyReportSketch --local"
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  # An open question tool keeps the turn running, and Studio Web locks the
  # canvas while a turn runs: the gate must be a plain final message.
  - type: command_not_executed
    description: "Agent asked the gate question in its final message, not with a question tool"
    tool_name: "AskUserQuestion"
    command_pattern: '.*'
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "Every box is labeled with a toolbox kind from `registry list`, never an invented or case-only one"
    command: "python3 $REFERENCE_DIR/check_skeleton_kinds.py NightlyReportSketch"
    timeout: 60
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  # Tenants hold thousands of processes: a 3c lookup without --search lists
  # them all. The lookahead stays inside one shell command; a line
  # continuation (raw `\<newline>`, or ` <newline>` once coder_eval
  # normalizes the command) does not end it.
  - type: command_not_executed
    description: "Every 3c resource lookup is filtered with --search"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+solution\s+resources\s+list\b(?!(?:[^;&|\n]|\\\n|(?<= )\n)*--search)'
    weight: 1.0
    pass_threshold: 1.0
