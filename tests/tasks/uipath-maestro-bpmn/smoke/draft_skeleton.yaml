task_id: skill-bpmn-smoke-draft-skeleton
description: >
  Draft-mode smoke eval: the user asks to see the shape first, so the agent
  builds a phase 2 skeleton (bare bpmn:task boxes, real gateway and flows,
  generated DI) without any registry call, validates it, and stops at the
  approval gate instead of wiring real nodes. The request forbids upload, so
  the agent must show the shape locally.
tags: [uipath-maestro-bpmn, smoke, "mode:build"]

run_limits:
  expected_turns: 20
  max_turns: 60

sandbox:
  python: {}

reference:
  directory: .

initial_prompt: |
  I need a BPMN process called "InvoiceIntakeSketch" for incoming invoices.
  We record each one. Anything of 1000 or more needs a manager to review it,
  and the rest go through automatic approval.

  Can you show me what it would look like before you build it? Don't upload
  or run anything yet.

success_criteria:
  - type: command_not_executed
    description: "Agent made no registry calls before the shape was approved"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+bpmn\s+registry\s+(pull|list|search|get)'
    weight: 2.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent did not upload, as the request forbids"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+solution\s+upload'
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "Skeleton has bare task boxes, a real conditioned gateway, full DI, project metadata, and validates with zero errors"
    command: "python3 $REFERENCE_DIR/check_draft_skeleton.py InvoiceIntakeSketch"
    timeout: 60
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
