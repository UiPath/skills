task_id: skill-bpmn-author-validate
description: >
  Skill-guided evaluation: agent uses the uipath-maestro-bpmn skill to author a
  small registry-driven Maestro BPMN process (start -> exclusive gateway with
  two conditioned branches -> end), with a BPMN diagram, then validates it with
  a local well-formed-XML / structural check. Authoring only — no cloud effects.
tags: [uipath-maestro-bpmn, smoke, "mode:build", "lifecycle:generate"]

run_limits:
  expected_turns: 20
  max_turns: 45

reference:
  directory: ..

initial_prompt: |
  Load and follow the uipath-maestro-bpmn skill.

  Author a local Maestro BPMN project named `InvoiceApproval` for this process:
    - a blank start event,
    - an exclusive gateway "Amount check" with two outgoing branches:
        - a conditioned branch (e.g. amount over a threshold),
        - a default branch,
    - each branch leads to its own end event.

  Requirements:
  - Resolve any UiPath extension node to its registered type the way your skill
    prescribes; declare any variables in `<uipath:variables>`, each with an
    `elementId`. Do not invent uipath:* XML from prose.
  - Author the structural BPMN (definitions/process scaffold, sequence flows,
    gateway conditions + default) the way your skill prescribes.
  - The emitted `.bpmn` MUST carry a complete bpmndi:BPMNDiagram — a shape for
    every node and an edge for every sequence flow.
  - Validate the file with an explicit Bash command before finishing: parse the
    project's `.bpmn` as well-formed XML with Python's `xml.etree.ElementTree`
    where `python3` exists, otherwise `uip maestro bpmn validate <file>`, which
    reports malformed XML. A grep or regex check is not a parse.
  - Do not upload, publish, deploy, debug, run, or pack anything.

success_criteria:
  - type: command_executed
    description: "Agent ran an explicit validation command on the authored BPMN"
    tool_name: "Bash"
    command_pattern: 'python3?\s+-c\s+\\?(["''])(?=(?:\\.|(?!\1)[^\\])*ET\.parse\()(?=(?:\\.|(?!\1)[^\\])*(?:InvoiceApproval|(?<![\w/])(?:\./)?Process)[\w/*]*\.bpmn)|python3?\s+-c\s+\\?(["''])(?:\\.|(?!\2)[^\\])*ET\.parse\((?:\\.|(?!\2)[^\\])*\\?\2\s+[^\s;&|]*(?:InvoiceApproval|(?<![\w/])(?:\./)?Process)[\w/*]*\.bpmn|python3?\s+-\s(?=[^\n]*<<-?\s*(["'']?)(\w+)\3)(?=(?:(?!\s\4(?:\s|$)).)*ET\.parse\()(?=(?:(?!\s\4(?:\s|$)).)*(?:InvoiceApproval|(?<![\w/])(?:\./)?Process)[\w/*]*\.bpmn)|(?:uip|\$UIP)\s+maestro\s+bpmn\s+validate(?:\s+-[\w-]+(?:=\S*|\s+(?!-)[^\s;&|]+)?)*\s+[\"'']?[^\s;&|\"'']*?(?:InvoiceApproval(?:/(?:InvoiceApproval|Process))?|(?<![\w/])(?:\./)?Process)\.bpmn'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "BPMN source was authored"
    command: "python3 $REFERENCE_DIR/_shared/check_bpmn_present.py InvoiceApproval"
    timeout: 30
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "BPMN file contains a diagram for Studio Web import"
    command: "python3 $REFERENCE_DIR/_shared/check_bpmn_present.py InvoiceApproval --contains bpmndi:BPMNDiagram --contains bpmndi:BPMNPlane --contains exclusiveGateway"
    timeout: 30
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "Authored BPMN is well-formed, structurally sound, and fully shaped"
    command: "python3 $REFERENCE_DIR/smoke/check_author_validate.py"
    timeout: 30
    expected_exit_code: 0
    weight: 4.0
    pass_threshold: 1.0
