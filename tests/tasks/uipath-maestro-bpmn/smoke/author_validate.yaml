task_id: skill-bpmn-author-validate
description: >
  Skill-guided evaluation: agent uses the uipath-maestro-bpmn skill to author a
  small registry-driven Maestro BPMN process (start -> exclusive gateway with
  two routed branches -> end), completes its BPMN diagram, then validates it
  with the local CLI. Authoring only — no cloud effects.
tags: [uipath-maestro-bpmn, smoke, "mode:build", "lifecycle:generate"]

run_limits:
  expected_turns: 20
  max_turns: 45

sandbox:
  template_sources:
    - type: template_dir
      path: ../../../../skills/uipath-maestro-bpmn
    - type: template_dir
      path: author_validate_fixture
  mock_path_dirs:
    - mocks

initial_prompt: |
  Load and follow the uipath-maestro-bpmn skill.

  Author a local Maestro BPMN project with main file
  `InvoiceApproval/InvoiceApproval.bpmn` for this process:
    - a blank start event,
    - an exclusive gateway "Amount check" with two outgoing branches:
        - a conditioned branch (e.g. amount over a threshold),
        - a default branch,
    - each branch leads to its own end event.

  Requirements:
  - Discover extension types via the registry first if you add any UiPath
    extension node; declare any variables with the registry's BPMN.Variables
    template. Do not hand-author uipath:* XML from prose.
  - Author the structural BPMN (definitions/process scaffold, sequence flows,
    gateway conditions + default) per the skill's structural reference.
  - The file MUST include a bpmndi:BPMNDiagram with a BPMNShape for every node
    and a BPMNEdge for every sequence flow.
  - The task is not complete until
    `uip maestro bpmn validate InvoiceApproval/InvoiceApproval.bpmn` passes.
  - Do not upload, publish, deploy, debug, run, or pack anything.

success_criteria:
  - type: command_executed
    description: "Agent ran an explicit validation command on the authored BPMN"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+bpmn\s+validate\s+InvoiceApproval/InvoiceApproval\.bpmn'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: file_exists
    description: "BPMN source was authored"
    path: "InvoiceApproval/InvoiceApproval.bpmn"
    weight: 1.0
    pass_threshold: 1.0

  - type: file_contains
    description: "BPMN file contains a diagram for canvas import"
    path: "InvoiceApproval/InvoiceApproval.bpmn"
    includes:
      - "bpmndi:BPMNDiagram"
      - "bpmndi:BPMNPlane"
      - "exclusiveGateway"
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "Authored BPMN is well-formed, structurally sound, and fully shaped"
    command: "python3 $TASK_DIR/check_author_validate.py"
    timeout: 30
    expected_exit_code: 0
    weight: 4.0
    pass_threshold: 1.0

  - type: run_command
    description: "The first validation attempt happened after complete DI existed"
    command: "python3 $TASK_DIR/check_author_validate.py .first-validation-input.bpmn"
    timeout: 30
    expected_exit_code: 0
    weight: 4.0
    pass_threshold: 1.0

  - type: run_command
    description: "Final post-layout BPMN passes CLI validation"
    command: "uip maestro bpmn validate InvoiceApproval/InvoiceApproval.bpmn --output json"
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0
