task_id: skill-bpmn-smoke-draft-request-is-gate
description: >
  The user asks for "a BPMN draft" and nothing else: no "show me first", no
  source-only deliverable. A request for a draft is the draft gate, so the
  agent builds a skeleton of bare task boxes, validates it, and stops at the
  approval gate instead of building the process. Counterpart of
  draft_word_is_not_gate.yaml (a "draft project" of files to import later is a
  build). draft-skeleton.md "When".
tags: [uipath-maestro-bpmn, smoke, "mode:build", "lifecycle:generate", "feature:approval-gate"]

run_limits:
  expected_turns: 20
  max_turns: 60

sandbox:
  python: {}

reference:
  # The parent, so the staged copy also holds the `_shared` that check_draft_skeleton.py imports.
  directory: ..

initial_prompt: |
  hey, can you create a BPMN draft for our expense claims? call it
  "ExpenseClaims". someone submits a claim, if it's over 500 dollars their
  manager has to approve it, otherwise it's approved automatically, then
  our "Pay Expense" robot pays it out and we email the employee that it's
  been paid. don't upload it

success_criteria:
  - type: run_command
    description: "ExpenseClaims is a skeleton: bare task boxes, a real conditioned gateway, full DI, and it validates"
    command: "python3 $REFERENCE_DIR/smoke/check_draft_skeleton.py ExpenseClaims"
    timeout: 60
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  # Same guard as draft_skeleton.yaml: a skeleton makes no registry lookup
  # before the shape is approved; `--help` looks nothing up.
  - type: command_not_executed
    description: "Agent made no registry discovery before the shape was approved"
    tool_name: "Bash"
    command_pattern: '(?:\buip|\$UIP)\s+maestro\s+(?:bpmn\s+)?registry\s+(?:pull|search|get|prepare|describe)\b(?![^\n;&|]*\s(?:--help|-h)\b)'
    weight: 2.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent did not upload, as the request forbids"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+solution\s+upload'
    weight: 1.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Claude only (vacuous on other agents): agent did not ask the user mid-turn with AskUserQuestion"
    tool_name: "AskUserQuestion"
    command_pattern: '.*'
    weight: 1.0
    pass_threshold: 1.0

  - type: llm_judge
    description: "The final message stops at the draft approval gate; it does not report a built process"
    include_reference: false
    include_agent_output: true
    weight: 2.0
    pass_threshold: 1.0
    prompt: |
      The user asked for a BPMN draft. The agent should show a skeleton and
      stop for the user's approval, not build the finished process.

      WHICH TEXT TO GRADE. AGENT OUTPUT holds every message the agent sent. If
      it contains a `[RESULT - ...]` marker, grade the text after the LAST such
      marker. Otherwise grade the agent's last message. The graded text is
      the agent's reply only: it ends where AGENT OUTPUT ends, and the
      instruction after it (to call submit_verdict) is yours, not the agent's.

      Check every item:

      1. It contains the question `Is this the process you want?` (markdown
         emphasis allowed).
      2. It offers the approval options Build it, Change it and Keep it.
      3. It does not present ExpenseClaims as a built, working process (for
         example "built, validated", a final report with `Assumed:` or
         `Needs:` lines, or wired activities described as done).

      Score 1.0 only if every item holds; otherwise 0.0. In findings, list
      each failed item by number and quote the offending text.
