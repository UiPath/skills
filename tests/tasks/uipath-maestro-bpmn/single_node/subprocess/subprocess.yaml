task_id: skill-bpmn-subprocess
description: >
  Skill-guided evaluation: agent uses the uipath-maestro-bpmn skill to
  encapsulate logic inside a container (an embedded bpmn:subProcess or a
  bpmn:callActivity) — the BPMN analogue of a Flow Subflow. Authoring only — no
  cloud effects.
tags: [uipath-maestro-bpmn, integration, "mode:build", "lifecycle:generate", "shape:multi-node", "node:subflow"]

run_limits:
  expected_turns: 22
  max_turns: 60

reference:
  directory: ../..

initial_prompt: |
  Load and follow the uipath-maestro-bpmn skill.

  Author a single Maestro BPMN file `SubflowDemo.bpmn` in the working directory
  that takes a string and reverses it, with the reversal logic encapsulated in a
  container rather than sitting directly in the top-level process.

  Requirements:
  - Encapsulate the logic in an embedded bpmn:subProcess (with its own nested
    start event, an inner activity such as a scriptTask, and a nested end event)
    OR a bpmn:callActivity.
  - The top-level flow is: start -> container -> end.
  - Author the structural BPMN the way your skill prescribes; do not invent
    uipath:* XML from prose. If you add a scriptTask, keep it Jint-safe (no
    Node.js/browser APIs).
  - The emitted `.bpmn` must carry a complete bpmndi:BPMNDiagram — a shape for
    every visible node (including the container and its inner nodes) and an edge
    for every sequence flow.
  - Validate the file locally before finishing by running
    `uip maestro bpmn validate <file>` (or a well-formed-XML parse if the CLI
    is unavailable).

  Do NOT upload, publish, deploy, debug, run, or pack anything. Do NOT ask for
  approval, confirmation, or feedback, and do NOT pause between planning and
  implementation. Build the complete file end-to-end in a single pass.

success_criteria:
  # Presence by the shared locator, not a root path: the v1 skill writes `SubflowDemo.bpmn`
  # where it stands, the builder-SDK skill scaffolds `SubflowDemo/SubflowDemo.bpmn` — both are the
  # task done. Same rule the grader below uses to find the file.
  - type: run_command
    description: "BPMN source was authored"
    command: "python3 $REFERENCE_DIR/_shared/check_bpmn_present.py SubflowDemo"
    timeout: 30
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  # Content by the same locator as the presence check above, not a root path:
  # `file_contains` on `SubflowDemo.bpmn` failed the builder-SDK skill's
  # `SubflowDemo/SubflowDemo.bpmn` on layout alone (R15 v2 terminate).
  - type: run_command
    description: "BPMN file has a diagram"
    command: "python3 $REFERENCE_DIR/_shared/check_bpmn_present.py SubflowDemo --contains bpmndi:BPMNDiagram"
    timeout: 30
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "BPMN encapsulates logic in a subProcess (nested start/activity/end) or callActivity, with a shape and resolvable flows"
    command: "python3 $REFERENCE_DIR/single_node/subprocess/check_subprocess.py"
    timeout: 30
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0

  # Deterministic twin of the judge below (as in event_trigger_start.yaml), so the
  # judge is not the only guard on the prompt's "Do NOT upload, publish, deploy, debug, run, or pack".
  # The CLI spells these `uip solution upload|publish|deploy|pack` and `uip maestro bpmn
  # process run|publish` (assets/uip-catalog-snapshot.json), so those count too.
  # A `--help` on the same command is a read and does not count.
  - type: command_not_executed
    description: "Agent did not run any cloud-side or packaging Maestro BPMN lifecycle command"
    tool_name: "Bash"
    command_pattern: '(?:\buip|\$UIP)\s+(?:maestro\s+bpmn\s+(?:upload|publish|deploy|debug|run|pack|process\s+(?:run|publish))|solution\s+(?:upload|publish|deploy|pack))\b(?![^\n;&|]*\s(?:--help|-h)\b)'
    weight: 1.0
    pass_threshold: 1.0

  - type: llm_judge
    description: "Agent kept the lifecycle local and avoided cloud-side operations"
    weight: 2.0
    pass_threshold: 0.7
    include_agent_output: true
    include_tool_calls: true
    include_reference: false
    prompt: >
      Pass if the agent created only local files and did not run or request
      approval for BPMN debug, process run, upload, publish, pack, or deploy
      commands. Exactly these commands are always acceptable and must
      NOT fail this check, because each reads or writes only local
      files: `uip maestro bpmn check`, `compile`, `decompile`, `format`,
      `merge`, `validate`, `init` and `refresh` (offline source checks,
      conversion between `.bpmn.ts` source and `.bpmn` XML, diagram
      layout, validation, and local scaffold and metadata files; none of
      them packs, uploads or runs anything), read-only registry and
      connection reads (`uip maestro bpmn registry list/get/pull/search`
      and `uip maestro registry prepare/describe/search/get/pull`), and
      `--help` invocations. Every command
      in the forbidden list above stays forbidden — including `pack`, even
      though it runs locally. Fail only if tool calls or the final answer
      show a forbidden lifecycle command or a request to perform one.
