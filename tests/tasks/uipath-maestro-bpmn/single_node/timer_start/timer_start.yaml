task_id: skill-bpmn-timer-start
description: >
  Timer start-event eval: agent uses the uipath-maestro-bpmn skill to author
  a scheduled (timer) start event that fires on a recurring hourly cycle,
  using the registry Intsvc.TimerTrigger wrapper on a bpmn:startEvent with a
  bpmn:timerEventDefinition. Ports the Flow scheduled-trigger smoke test to
  a BPMN timer start event. Source-only by construction: a timer start
  derives no entry point, so the project is deliberately not package-ready.
  Authoring only — a timer only fires in a live engine, so this validates
  the structure locally.
tags: [uipath-maestro-bpmn, smoke, "mode:build", "lifecycle:generate", "feature:trigger"]

run_limits:
  expected_turns: 18
  max_turns: 45

reference:
  directory: ../..

initial_prompt: |
  Load and follow the uipath-maestro-bpmn skill.

  Create a local BPMN project named "ScheduledReportBpmn". Keep the main file
  named `ScheduledReportBpmn.bpmn` inside the CLI-generated project. Model a
  process that is started by a schedule (not a manual start) and runs every hour:
  scheduled timer start -> a script task that assembles a report -> end.

  Requirements:
  - Retrieve the Intsvc.TimerTrigger template with `uip maestro bpmn registry
    get` before authoring, and author the node from that template rather than
    from prose.
  - The process start MUST be a bpmn:startEvent carrying the Intsvc.TimerTrigger
    wrapper and a bpmn:timerEventDefinition. There must be NO manual start event.
    This makes the process source-only: only a manual root start derives an
    entry point, so `refresh` and `pack` are unavailable for this shape and are
    not part of the task.
  - Configure a recurring hourly schedule using a bpmn:timeCycle with a valid
    ISO-8601 repeating interval (for example R/PT1H). Do not use a never-firing
    interval.
  - The emitted `.bpmn` must carry a complete bpmndi:BPMNDiagram — a shape for
    every node and an edge for every sequence flow.
  - Before finishing, validate that the generated project BPMN is well-formed
    XML with an explicit Bash command that parses it with Python's
    `xml.etree.ElementTree`.
  - Do not upload, publish, deploy, debug, run, or pack anything, and do not
    pause for approval or confirmation.

success_criteria:
  - type: command_executed
    description: "Agent retrieved the Intsvc.TimerTrigger registry template"
    tool_name: "Bash"
    # Both tokens in one invocation, either order: agents legitimately batch
    # lookups through a shell loop (`for t in Intsvc.TimerTrigger ...; do uip
    # maestro bpmn registry get "$t"`), where the literal type never follows
    # `get` directly. Still requires retrieving THIS type from the registry.
    command_pattern: >-
      (?s)(uip\s+maestro\s+bpmn\s+registry\s+get[\s\S]*Intsvc\.TimerTrigger|Intsvc\.TimerTrigger[\s\S]*uip\s+maestro\s+bpmn\s+registry\s+get)
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent ran an explicit well-formed-XML validation on the authored BPMN"
    tool_name: "Bash"
    # A Python ElementTree parse of THIS file, in one of three shapes, each bounded
    # to its own program so a later, unrelated `find` cannot supply the name:
    # (1) `ET.parse(` and the file name inside the same quoted `python3 -c` program,
    #     in either order (an agent that globbed into a variable wrote
    #     `fs=list(...rglob('ScheduledReportBpmn.bpmn')); ET.parse(fs[0])`, R14 v2,
    #     builder-sdk#1882); an escaped inner quote does not end the program, and
    #     the program may open with an escaped quote, as it does inside a wrapper
    #     like `/bin/bash -lc "python3 -c \"...\""` (the codex shell tool's form);
    # (2) the argv form, the file after the closing quote:
    #     `python3 -c "...ET.parse(sys.argv[1])" ScheduledReportBpmn/ScheduledReportBpmn.bpmn`;
    # (3) a `python3 - <<'PY'` heredoc whose body (or the `python3 -` arguments)
    #     names the file and calls `ET.parse(`, up to the terminator word (bounded
    #     by whitespace, so the newline-collapsed haystack stops there too).
    # The escape branch is `\\\1` (an escaped quote), not `\\.`: `(?!\1).` already takes
    # any other backslash, so `\\.` only gave each backslash a second way to match, and
    # a backslash run made a failed search backtrack without bound. Same strings match.
    # Cases in _shared/test_grader_command_patterns.py.
    command_pattern: 'python3?\s+-c\s+\\?(["''])(?=(?:\\\1|(?!\1).)*ET\.parse\()(?=(?:\\\1|(?!\1).)*ScheduledReportBpmn\.bpmn)|python3?\s+-c\s+\\?(["''])(?:\\\2|(?!\2).)*ET\.parse\((?:\\\2|(?!\2).)*\\?\2\s+[^\s;&|]*ScheduledReportBpmn\.bpmn|python3?\s+-\s(?=[^\n]*<<-?\s*(["'']?)(\w+)\3)(?=(?:(?!\s\4(?:\s|$)).)*ET\.parse\()(?=(?:(?!\s\4(?:\s|$)).)*ScheduledReportBpmn\.bpmn)'
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "Timer start event is a recurring scheduled start with valid structure"
    command: "python3 $REFERENCE_DIR/_shared/check_timer_start.py"
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
