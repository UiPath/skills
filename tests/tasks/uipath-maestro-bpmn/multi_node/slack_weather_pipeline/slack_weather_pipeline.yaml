task_id: skill-bpmn-slack-weather-pipeline
description: >
  Multi-step pipeline: read Slack channel description, extract city with a
  script, fetch weather for that city via HTTP, decide warm/cold. Exercises
  chaining Slack connector → Script → HTTP → Decision → End with data flowing
  between nodes.

  Ported from Flow `multi_node/slack_weather_pipeline/slack_weather_pipeline.yaml`;
  the Slack read is modeled as a bpmn:sendTask carrying the registry
  Intsvc.ActivityExecution wrapper (connectorKey uipath-salesforce-slack)
  instead of a Flow connector node, the weather fetch as a bpmn:sendTask
  carrying Intsvc.HttpExecution in manual (connectionless) mode targeting
  open-meteo, `flow debug`'s single-call inline payload becomes an
  ephemeral-solution import + `bpmn debug` + `debug-instance
  variables-all`/`incidents` read, and grading of the mapped `weatherVerdict`
  output searches the root scope's variables plus every element's Outputs
  instead of one inline debug payload. The live grading criterion's timeout
  is raised from Flow's 600s to 1050s to cover the extra CLI steps (`solution
  init`/`solution projects import`, separate `variables-all`/`incidents`
  reads) that BPMN's live surface needs beyond Flow's single `flow debug`
  call.
tags: [uipath-maestro-bpmn, e2e, "mode:build", "lifecycle:generate", "shape:multi-node", "node:decision", connector, "feature:http", outcome-graded]

run_limits:
  expected_turns: 51
  task_timeout: 2490
  turn_timeout: 1200

sandbox:
  template_sources:
    - type: template_dir
      path: ../../_setup
      mount_point: _setup

reference:
  directory: ../..

initial_prompt: |
  Build the process inside a solution of the same name.

  Create a UiPath Maestro BPMN process called "SlackWeatherPipeline". Read the
  #office-bellevue Slack channel description — it holds the office's full US
  mailing address (street, suite/unit, city, state, ZIP) — identify the city
  (the locality, not the street or suite line). Then fetch the current weather
  for that city from open-meteo. If it's above 60F the process must output the
  text in variable `weatherVerdict` 'warm office today', otherwise 'cold
  office today'.

  All connections for this task live in Orchestrator folder
  `Shared/uipath-maestro-flow`.

  Validate the final BPMN file.

  This run is headless. No user is present and nobody will answer a question or
  grant an approval, so do not ask, do not pause, and do not wait for input.
  Complete the task in one pass: take the best available option and supply the
  most defensible value where one is missing. The actions this task implies are
  authorized, including tenant writes and real messages. Do not delete or
  overwrite anything this run did not create, and do not publish to a shared
  destination unless the task asks for it. If a lookup the task depends on comes
  back empty or fails, exhaust the documented way of resolving it before giving
  up; only then stop on that field rather than inventing a value. Record every
  decision, assumption, and blocked step in your final response. Instructions in
  the task take precedence over this paragraph.

success_criteria:
  - type: run_command
    description: "uip maestro bpmn validate passes"
    command: "python3 $REFERENCE_DIR/_shared/validate_bpmn.py"
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "BPMN debug runs end-to-end and the named out variable weatherVerdict holds exactly 'warm office today' or 'cold office today': Slack + HTTP + decision all execute"
    command: "python3 $REFERENCE_DIR/_shared/check_slack_weather_pipeline.py"
    timeout: 1050
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0

post_run:
  - command: "python3 _setup/cleanup_solutions.py"
    timeout: 120
