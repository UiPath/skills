task_id: skill-bpmn-e2e-customer-escalation
description: >
  Skill-guided e2e evaluation (ported from the Flow customer_escalation eval):
  agent uses the uipath-maestro-bpmn skill to author a synthetic BPMN process
  that classifies an inbound request with two script tasks, routes on the
  combined signal through an exclusive gateway, and escalates via a human user
  task on the high-touch path while a standard path generates a ticket in a
  script task. Includes full package metadata. Authoring only, public-safe, no
  cloud effects and no live connector. Project layout is deliberately ungraded:
  the checks locate the project by the `CustomerEscalation.bpmn` (or Studio Web's
  `CustomerEscalation/Process.bpmn`) + `project.uiproj` pair wherever it lands, so the default `uip maestro bpmn init`
  `<Name>Solution/<Name>/` scaffold and a bare `<Name>/` both grade the modeling.
tags: [uipath-maestro-bpmn, e2e, "mode:build", "lifecycle:generate", "shape:multi-node", "node:decision", "node:hitl", "feature:escalation"]

run_limits:
  expected_turns: 28
  turn_timeout: 1200
  max_turns: 90

reference:
  directory: ../..

initial_prompt: |
  Create a new local Maestro BPMN Process Orchestration project named
  CustomerEscalation. The project must be fully synthetic and public-safe.

  Model this process:
  - Manual start accepts request variables (e.g. subject, senderDomain).
  - A script task classifyUrgency sets an `urgent` boolean.
  - A script task classifyVip sets a `vip` boolean.
  - An exclusive gateway routeEscalation routes the high-touch case (urgent AND
    vip) to a human user task named "Escalate to specialist", and all other
    cases (default) to a script task createTicket that produces a ticket id.
  - Each path ends at its own end event.

  Model the escalation and ticketing with a user task and a script task — do NOT
  use a live Integration Service connector; keep the whole project local and
  self-contained.

  Include BPMN DI shapes/edges for all visible elements and create the package
  metadata files expected by the skill:
  project.uiproj, bindings_v2.json, entry-points.json, operate.json, and
  package-descriptor.json.

  Do NOT upload, publish, deploy, debug, run a process, ask for approval,
  confirmation, or feedback. Do NOT pause between planning and implementation.
  Build the complete local project end-to-end in a single pass.

success_criteria:
  - type: run_command
    description: "BPMN source file was created"
    command: "python3 $REFERENCE_DIR/_shared/check_bpmn_present.py CustomerEscalation"
    timeout: 30
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "Project metadata file was created"
    command: "python3 $REFERENCE_DIR/_shared/check_bpmn_present.py CustomerEscalation --beside project.uiproj"
    timeout: 30
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "Package operate metadata was created"
    command: "python3 $REFERENCE_DIR/_shared/check_bpmn_present.py CustomerEscalation --beside operate.json"
    timeout: 30
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "Generated BPMN project has two classifier scripts, gateway routing, a user-task escalation path, a ticket script, and package references"
    command: "python3 $REFERENCE_DIR/multi_node/customer_escalation/check_customer_escalation.py"
    timeout: 30
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0

  # Deterministic twin of the judge below (as in event_trigger_start.yaml), so the
  # judge is not the only guard on the prompt's "Do NOT upload, publish, deploy, debug, run a process".
  # The CLI spells these `uip solution upload|publish|deploy` and `uip maestro bpmn
  # process run|publish` (assets/uip-catalog-snapshot.json), so those count too.
  # A `--help` on the same command is a read and does not count.
  # `pack` is left out: this prompt asks for the package metadata files and does
  # not forbid packing, which is local.
  - type: command_not_executed
    description: "Agent did not run any cloud-side Maestro BPMN lifecycle command"
    tool_name: "Bash"
    command_pattern: '(?:\buip|\$UIP)\s+(?:maestro\s+bpmn\s+(?:upload|publish|deploy|debug|run|process\s+(?:run|publish))|solution\s+(?:upload|publish|deploy))\b(?![^\n;&|]*\s(?:--help|-h)\b)'
    weight: 1.0
    pass_threshold: 1.0

  - type: llm_judge
    description: "Agent kept the lifecycle local and avoided cloud-side operations"
    weight: 2.0
    pass_threshold: 0.7
    include_agent_output: true
    include_tool_calls: true
    include_reference: false
    prompt: >
      Pass if the agent created only local project files and did not run or
      request approval for BPMN debug, process run, upload, publish, or deploy
      commands. These commands are always acceptable and must NOT fail
      this check, because each reads or writes only local files or
      fetches authoring templates without mutating a tenant or lifecycle
      state: `uip maestro bpmn check`, `compile`, `decompile`, `format`,
      `merge`, `validate`, `init` and `refresh` (offline source checks,
      conversion between `.bpmn.ts` source and `.bpmn` XML, diagram
      layout, validation, and local scaffold and metadata files; none of
      them packs, uploads or runs anything), read-only registry and
      connection reads (`uip maestro bpmn registry list/get/pull/search`
      and `uip maestro registry prepare/describe/search/get/pull`), and
      `--help` invocations. Fail only if tool calls or the final answer
      show a cloud-side lifecycle mutation or a request to perform one.
