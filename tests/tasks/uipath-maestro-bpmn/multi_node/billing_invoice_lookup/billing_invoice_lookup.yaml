task_id: skill-bpmn-devcon-billing-invoice-lookup
description: |
  E2E greenfield (DevCon BillingDisputeResolution scenario): build a small
  Maestro BPMN process that cleans up a messy invoice number and looks up its
  rows in the BillingDisputeERP Data Service entity, asked the way a Studio
  Web user would ask it. The grader imports the exact submitted project into
  its own ephemeral solution and debugs it once per messy input (three forms
  of two real invoices: MCS-2026-04872 has 8 rows and MCS-2026-05128 has 5 on
  the live tenant). Each run must complete with no incidents, complete a Data
  Service step, and return matchedInvoiceNumber and lineItemCount, read by
  those names. Whether the agent ran its own test is advisory. Text between
  the helper markers is lower-tier guidance (experiments/use-case-tiers.yaml)
  and is not graded.

  Ported from Flow `multi_node/billing_invoice_lookup/billing_invoice_lookup.yaml`.
  BPMN materializes `bindings_v2.json` only at pack time, so the advisory
  bindings check packs the project first.
tags:
  - uipath-maestro-bpmn
  - e2e
  - "mode:build"
  - "lifecycle:generate"
  - "shape:multi-node"
  - connector
  - path-to-ga
  - outcome-graded
sandbox:
  template_sources:
    - type: template_dir
      path: ../../_setup
      mount_point: _setup
run_limits:
  max_turns: 120
  turn_timeout: 2400
  task_timeout: 4455
reference:
  directory: ../..

pre_run:
  - command: 'python3 "_setup/preflight_connections.py" uipath-uipath-dataservice'
    timeout: 120

post_run:
  - command: python3 _setup/cleanup_solutions.py
    timeout: 120

initial_prompt: |
  You are a coding agent in an empty Agentic Process (Maestro BPMN) project.
  No user is present, and nobody will answer a question or grant approval, so
  do not ask, do not pause, and do not wait for input. Do not delete or
  overwrite anything this run did not create, except what the task asks you
  to change, and do not publish to a shared destination unless the task asks
  for it.

  Build a process called "BillingInvoiceLookup" that looks up the line items
  in a disputed invoice, even when the caller types the invoice number
  sloppily or with typos.

  - Input: invoiceNumber. Callers may leave out the "MCS-" prefix, use the
    wrong casing, or add spaces.
  - Clean the number up first: trim it, uppercase it, and add the "MCS-"
    prefix when it is missing.
  - Then look up the respective invoice and its rows in BillingDisputeERP, the
    invoice table we keep in Data Service. It has one row per invoice line.
  - Outputs: matchedInvoiceNumber (the invoice number of the first matching
    row) and lineItemCount (how many rows matched).

  <!-- helper:start -->
  Inputs: invoiceNumber (string).
  Outputs: matchedInvoiceNumber (string), lineItemCount (number).
  BillingDisputeERP is an existing Data Service entity, and its invoiceNumber
  field holds values like "MCS-" then the year and a five-digit number. Use
  the Data Service connection in the Shared folder, even though it is a
  personal one.
  <!-- helper:end -->

  Build the process and do a test run.

success_criteria:
  - type: run_command
    description: uip maestro bpmn validate passes on the BPMN file
    command: python3 $REFERENCE_DIR/_shared/validate_bpmn.py
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
  # Advisory: Studio Web's host may refuse the agent's own `bpmn debug`
  # (UnavailableInHost) and its testbench stubs RunProject.
  - type: command_executed
    description: 'Advisory: the agent ran its own test run (uip maestro bpmn debug), as the request asks'
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+bpmn\s+debug(?!-instances?)(?!\s+--help)\s'
    min_count: 1
    weight: 1.0
    pass_threshold: 0.0
  - type: run_command
    description: 'Effects: three debug runs (2026-04872, mcs-2026-05128, "  MCS-2026-04872 "), each completing with no incidents and a completed Data Service step, return matchedInvoiceNumber=MCS-2026-04872/MCS-2026-05128/MCS-2026-04872 and lineItemCount=8/5/8'
    command: python3 $REFERENCE_DIR/multi_node/billing_invoice_lookup/check_invoice_lookup_run.py
    timeout: 1590  # 90 (solution init) + 180 (solution import) + 3 x (180 debug + 120 variables-all + 120 incidents) + 60 margin
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0
  - type: run_command
    description: 'Advisory: Data Service query filters server-side (whole-entity fetch + client-side filter breaks silently past the page limit)'
    command: python3 $REFERENCE_DIR/_shared/check_billing_invoice_lookup.py server_side_filter
    timeout: 15
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 0.0
  - type: run_command
    description: 'Advisory: generated bindings exist and carry no stub UUIDs (packs the project to read bindings_v2.json)'
    command: python3 $REFERENCE_DIR/_shared/check_billing_invoice_lookup.py bindings
    timeout: 180
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 0.0
  - type: run_command
    description: 'Advisory: STRUCTURAL (covering): one Data Service query node, entityName anywhere in its inputs, the filter COMPUTED from the input, no canonical/test-input literals, both outputs read from the query, and a wired connection binding'
    command: python3 $REFERENCE_DIR/_shared/check_billing_invoice_lookup.py advisory
    timeout: 30
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 0.0
