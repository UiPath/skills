task_id: skill-bpmn-devcon-billing-invoice-lookup
description: |
  E2E greenfield (DevCon BillingDisputeResolution scenario): build a ~4-node
  Maestro BPMN process that normalizes a messy invoice number and queries the
  BillingDisputeERP Data Service entity; graded by validate plus three
  ephemeral-solution `bpmn debug` runs over malformed inputs.

  Ported from Flow `multi_node/billing_invoice_lookup/billing_invoice_lookup.yaml`.
  Changes: the Data Service `query-entity-records` Flow node becomes a
  `bpmn:sendTask` carrying the registry `Intsvc.ActivityExecution` wrapper
  (curated `QueryEntityRecordsCurated`/`QueryEntityRecords_V3`, or the generic
  entity object with operation List/method GET); the connection is a
  process-level `=bindings.<id>` `resource="Connection"` binding instead of an
  inline `connectionId`/`connectionFolderKey` pair; `flow debug`'s single
  inline-payload call becomes, per malformed input, an ephemeral solution
  import + `bpmn debug` + `debug-instance variables-all`/`incidents` read
  (LIVE-ADDENDUM's canonical live pattern); and the bindings/non-stub-id check
  now packs the project first (`uip maestro bpmn pack`), since BPMN
  materializes `bindings_v2.json` only at pack time, unlike Flow's compiler,
  which resolved the connection straight into the emitted node. The live
  lookup criterion's timeout is raised from Flow's 1200s to 1590s to cover the
  extra ephemeral-solution CLI round trips per case; see
  `_shared/check_billing_invoice_lookup.py`'s module docstring for the
  arithmetic.
tags:
  - uipath-maestro-bpmn
  - e2e
  - "mode:build"
  - "lifecycle:generate"
  - "shape:multi-node"
  - connector
  - path-to-ga
  - outcome-graded
sandbox:
  template_sources:
    - type: template_dir
      path: ../../_setup
      mount_point: _setup
run_limits:
  max_turns: 120
  turn_timeout: 2400
  task_timeout: 4455
reference:
  directory: ../..

pre_run:
  - command: 'python3 "_setup/preflight_connections.py" uipath-uipath-dataservice'
    timeout: 120

post_run:
  - command: python3 _setup/cleanup_solutions.py
    timeout: 120

initial_prompt: |
  Build a UiPath Maestro BPMN process "BillingInvoiceLookup" (in a solution of
  the same name) that looks up a disputed invoice's line items, tolerating
  messy input.

  - Input: process variable `invoiceNumber` (string). Callers may omit the
    "MCS-" prefix, use wrong casing, or add whitespace.
  - Normalize the input (trim, uppercase, prepend `MCS-` if absent), then look
    up the matching rows in the existing `BillingDisputeERP` Data Service
    entity.
  - Outputs: `matchedInvoiceNumber` (string, first matched row's invoiceNumber)
    and `lineItemCount` (number of rows returned).

  Build the lookup on the Data Service Query Entity Records connector
  activity (`uipath-uipath-dataservice`).

  Validate the final BPMN file — the task is not complete until `uip maestro
  bpmn validate` passes. Grading then runs the process under debug against
  live tenant data, so build it to actually run, not merely validate.

  This run is headless. No user is present and nobody will answer a question or
  grant an approval, so do not ask, do not pause, and do not wait for input.
  Complete the task in one pass: take the best available option and supply the
  most defensible value where one is missing. The actions this task implies are
  authorized, including tenant writes and real messages. Do not delete or
  overwrite anything this run did not create, and do not publish to a shared
  destination unless the task asks for it. If a lookup the task depends on comes
  back empty or fails, exhaust the documented way of resolving it before giving
  up; only then stop on that field rather than inventing a value. Record every
  decision, assumption, and blocked step in your final response. Instructions in
  the task take precedence over this paragraph.

success_criteria:
  - type: run_command
    description: uip maestro bpmn validate passes on the BPMN file
    command: python3 $REFERENCE_DIR/_shared/validate_bpmn.py
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
  - type: run_command
    description: Check script debugs three malformed inputs (fail-fast, one ephemeral-solution bpmn debug run each); every exercised input must resolve to MCS-2026-04872 with 8 line items
    command: python3 $REFERENCE_DIR/_shared/check_billing_invoice_lookup.py lookup
    timeout: 1590  # 90 (solution init) + 180 (solution import) + 3 x (180 debug + 120 variables-all + 120 incidents) + 60 margin; see check_billing_invoice_lookup.py
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0
  - type: run_command
    description: 'Advisory: Data Service query filters server-side (whole-entity fetch + client-side filter breaks silently past the page limit)'
    command: python3 $REFERENCE_DIR/_shared/check_billing_invoice_lookup.py server_side_filter
    timeout: 15
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 0.0
  - type: run_command
    description: 'Advisory: generated bindings exist and carry no stub UUIDs (packs the project to read bindings_v2.json)'
    command: python3 $REFERENCE_DIR/_shared/check_billing_invoice_lookup.py bindings
    timeout: 180
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 0.0
  - type: run_command
    description: 'Advisory: STRUCTURAL (covering): one Data Service query node, entityName anywhere in its inputs, the filter COMPUTED from the input, no canonical/test-input literals, both outputs read from the query, and a wired connection binding'
    command: python3 $REFERENCE_DIR/_shared/check_billing_invoice_lookup.py advisory
    timeout: 30
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 0.0
