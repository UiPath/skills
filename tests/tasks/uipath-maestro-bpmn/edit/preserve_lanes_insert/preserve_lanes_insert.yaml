task_id: skill-bpmn-edit-preserve-lanes-insert
description: >
  Brownfield insert into a process the user laid out by hand (pool, four
  lanes, colored tasks, an annotation, routed edges). The new step must land in
  a lane without overlapping anything, and the existing diagram must survive:
  no re-layout, no lost pool or lanes, no stripped colors or resized tasks.
  Existing shapes may move only together, by one offset, to make room.
tags: [uipath-maestro-bpmn, integration, "mode:build", "lifecycle:generate", "shape:multi-node"]

run_limits:
  expected_turns: 20
  max_turns: 80

sandbox:
  template_sources:
    - type: template_dir
      path: fixture

reference:
  directory: ../..

initial_prompt: |
  Load and follow the uipath-maestro-bpmn skill.

  In `ExpenseClaim.bpmn`, once a claim is paid we need to record the payment
  date on the claim before the receipts are archived.

  Work locally only: do not upload, publish, deploy, debug or run anything, and
  do not pause for approval.

success_criteria:
  - type: file_exists
    description: "The edited BPMN file is still present"
    path: "ExpenseClaim.bpmn"
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "The edited process validates"
    command: "python3 $REFERENCE_DIR/_shared/validate_bpmn.py"
    timeout: 120
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "New step inserted in a lane without overlap, and the pool, lanes, colors, sizes and placement survived"
    command: "python3 $REFERENCE_DIR/_shared/check_preserve_lanes_insert.py"
    timeout: 30
    expected_exit_code: 0
    weight: 4.0
    pass_threshold: 1.0
