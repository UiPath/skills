task_id: skill-bpmn-eval-run-e2e
description: >
  First BPMN task that EXECUTES an evaluation. The four other evaluate/ tasks
  stop at local authoring; `uip maestro bpmn eval run *` had no coverage. The
  agent builds a deterministic process (no inputs; a script task returns
  6 * 7 as the `product` output), an exact-match evaluator, and an eval set
  with one case that must pass (expects 42) and one that must fail (expects
  41). It then runs the set once against the tenant, reads the run's status,
  the per-case results, the failing cases on their own (`--only-failed`) and
  a CSV export (`--export-format csv`). The results grader re-reads
  `run results` live for the run id the agent recorded, so a hand-written
  results file cannot pass. The process takes no inputs on purpose:
  live_debug_e2e found `bpmn debug --inputs` values do not reach the runtime,
  and this task measures the run verbs, not that gap. `run list` / `run
  compare` and the no-redeploy rerun live in eval_run_compare/.
tags: [uipath-maestro-bpmn, e2e, mode:operate, lifecycle:setup, feature:eval, studio-web-unsupported, studio-web-unsupported:local-only-solution]

sandbox:
  template_sources:
    - type: template_dir
      path: ../../_setup
      mount_point: _setup

run_limits:
  expected_turns: 45
  max_turns: 120
  # `run start --wait` blocks in one Bash call while the tenant deploys and
  # runs every data point; one turn can legitimately take many minutes.
  turn_timeout: 1800
  task_timeout: 5400

reference:
  directory: ../..

initial_prompt: |
  Load and follow the uipath-maestro-bpmn skill.

  I want a scored evaluation of a small Maestro BPMN process, run for real in
  the connected tenant.

  Build a Maestro BPMN project called "ProductCheck" inside a solution of the
  same name. The process takes no inputs: a script task multiplies 6 by 7, and
  the process returns the result as an integer output named `product`. Make
  sure it validates.

  Score it with an evaluator named `product-match` that requires the output to
  match exactly. Put two cases, both with no inputs, in an eval set named
  `Product Checks`:
    - `correct`, expecting `{"product":42}`
    - `wrong-on-purpose`, expecting `{"product":41}`. This one should fail: I
      want proof the scorer can tell the difference.

  Then run the set against Studio Web. You have my consent to upload and deploy
  this project for that. Start exactly one run.

  When it has finished I want:
    - the run's current status,
    - the per-case scores,
    - the failing cases on their own,
    - a CSV export of the results I can open in a spreadsheet.

  Save the raw JSON the CLI prints, unedited, under `eval-evidence/`:
  `run-start.json` (from starting the run), `status.json`, `results.json` and
  `failed-only.json`.

  This run is headless. No user is present and nobody will answer a question or
  grant an approval, so do not ask, do not pause, and do not wait for input.
  Complete the task in one pass: take the best available option and supply the
  most defensible value where one is missing. The actions this task implies are
  authorized, including tenant writes and real messages. Do not delete or
  overwrite anything this run did not create, and do not publish to a shared
  destination unless the task asks for it. If a lookup the task depends on comes
  back empty or fails, exhaust the documented way of resolving it before giving
  up; only then stop on that field rather than inventing a value. Record every
  decision, assumption, and blocked step in your final response. Instructions in
  the task take precedence over this paragraph.

success_criteria:
  - type: run_command
    description: "ProductCheck BPMN artifact exists"
    command: "python3 $REFERENCE_DIR/_shared/check_bpmn_present.py ProductCheck"
    timeout: 30
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "product-match exact-match evaluator and Product Checks set with both cases and their expected outputs"
    command: "python3 $REFERENCE_DIR/evaluate/check_eval_run.py --check artifacts"
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  # The skill: "Always use the BPMN simulation commands ... never the
  # `maestro flow eval` verb on a BPMN project."
  - type: command_not_executed
    description: "Agent never drove the BPMN project with the flow eval verb"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+flow\s+eval\b'
    exclude_pattern: '--help'
    weight: 1.0
    pass_threshold: 1.0

  # `run` / `runs` and `start` / `create` are aliases (evaluate.md § Spellings).
  # max_count 1: every start redeploys the solution and costs a tenant run.
  - type: command_executed
    description: "Agent started exactly one eval run"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+bpmn\s+eval\s+runs?\s+(start|create)\b'
    exclude_pattern: '--help'
    min_count: 1
    max_count: 1
    weight: 2.0
    pass_threshold: 1.0

  # Advisory: polling `run status` is an equally correct way to wait.
  - type: command_executed
    description: "Informational: the run was awaited with --wait rather than polled"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+bpmn\s+eval\s+runs?\s+(start|create)\b[^;&|\n]*--wait'
    min_count: 1
    weight: 0.0
    pass_threshold: 0.0

  - type: command_executed
    description: "Agent read the run's status"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+bpmn\s+eval\s+runs?\s+status\b'
    exclude_pattern: '--help'
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent read the run's results"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+bpmn\s+eval\s+runs?\s+results\b'
    exclude_pattern: '--help'
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent filtered the results to the failing cases"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+bpmn\s+eval\s+runs?\s+results\b[^;&|\n]*--only-failed'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  # Re-reads `run results` live for the run id in eval-evidence/run-start.json.
  - type: run_command
    description: "Live results: the run completed, correct scored 1.0 and wrong-on-purpose scored below 1.0"
    command: "python3 $REFERENCE_DIR/evaluate/check_eval_run.py --check results"
    timeout: 240
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0

  - type: run_command
    description: "Saved failing-cases output lists only wrong-on-purpose"
    command: "python3 $REFERENCE_DIR/evaluate/check_eval_run.py --check failed-only"
    timeout: 30
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "A bpmn-eval-results-*.csv export lists both cases"
    command: "python3 $REFERENCE_DIR/evaluate/check_eval_run.py --check export"
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

# `run start` deploys the solution to the tenant; delete it afterward
# (best-effort, never affects pass/fail). BPMN_E2E_CLEANUP=never keeps it.
post_run:
  - command: "python3 _setup/cleanup_solutions.py"
    timeout: 120
