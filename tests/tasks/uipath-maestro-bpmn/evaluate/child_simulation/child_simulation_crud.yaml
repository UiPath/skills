task_id: skill-bpmn-eval-child-simulation-crud
description: >
  Skill-guided child simulation CRUD: agent uses the uipath-maestro-bpmn
  skill's evaluate capability to scaffold a BPMN project, build an eval set +
  data point, then add child tool simulations on an agent node using
  `--parent`, list them, and remove one — all in a single pass, no separate
  parent simulation step. Covers Static and Llm child strategies. The BPMN CLI
  cannot auto-resolve a child tool's output schema, so the Llm child simulation
  MUST pass an explicit `--output-schema` (unlike Flow). Purely local, no login,
  no upload, no run. Tests whether the skill teaches the `--parent` flag and the
  child simulation lifecycle, and verifies the child simulations persist in the
  eval-set JSON nested inside the auto-created parent.
tags: [uipath-maestro-bpmn, smoke, mode:build, lifecycle:generate, feature:eval, feature:child-simulation]

run_limits:
  expected_turns: 25
  max_turns: 90

reference:
  directory: ../..

initial_prompt: |
  Load and follow the uipath-maestro-bpmn skill's evaluate capability to
  scaffold a BPMN project, build an eval set with one data point, then add
  **child tool simulations** on an agent node — purely local, no Studio Web
  round-trip.

  Steps:
  1. Create a solution `ChildSimEval` and a Maestro BPMN project `ChildSimEval`
     inside it (keep the project directory named `ChildSimEval`).

  2. Declare a string input variable named `query` on the process before adding
     the data point.

  3. Create an eval set named `Agent Tools` in the BPMN project. (No
     `--entry-point`, no `--evaluators` — defaults are fine.)

  4. Add one data point named `search-test` to that eval set with inputs
     `{"query":"weather in NYC"}` and expected
     `{"answer":"Sunny, 72°F in New York City."}`.

  5. Add a `Static` child simulation on the `search-test` data point targeting
     child tool `Web_Search` on parent agent node `agent-1`. Use
     `--mock-value '{"results":[{"title":"NYC Weather","snippet":"Sunny, 72°F"}]}'`.
     Do NOT add a separate parent simulation first.

  6. Add an `Llm` child simulation on the `search-test` data point targeting
     child tool `Send_Email` on the same parent `agent-1`. Supply
     `--simulation-instructions "Return a success status with a message ID."`.
     The BPMN CLI cannot auto-resolve the child tool's output schema, so pass
     it explicitly:
     `--output-schema '{"type":"object","properties":{"status":{"type":"string"},"messageId":{"type":"string"}}}'`.

  7. List the child simulations on `agent-1` to confirm both are present.

  8. Remove the `Send_Email` child simulation from `agent-1`.

  Important:
  - Use `--output json` on every `uip maestro bpmn eval ...` command.
  - Use `--parent agent-1` on every child simulation command (add/list/remove).
  - Do NOT call `uip login`. Do NOT call `uip solution upload`. Do NOT call
    `uip maestro bpmn eval run *` — this task tests local CRUD only.
  - Do NOT add a separate parent simulation for `agent-1` before adding children —
    use the child simulation workflow from the skill (`--parent` auto-creates it).

  This run is headless. No user is present and nobody will answer a question or
  grant an approval, so do not ask, do not pause, and do not wait for input.
  Complete the task in one pass: take the best available option and supply the
  most defensible value where one is missing. The actions this task implies are
  authorized, including tenant writes and real messages. Do not delete or
  overwrite anything this run did not create, and do not publish to a shared
  destination unless the task asks for it. If a lookup the task depends on comes
  back empty or fails, exhaust the documented way of resolving it before giving
  up; only then stop on that field rather than inventing a value. Record every
  decision, assumption, and blocked step in your final response. Instructions in
  the task take precedence over this paragraph.
success_criteria:
  - type: command_executed
    description: "Agent created a solution"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+solution\s+(new|init)'
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent initialized a BPMN project"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+(maestro\s+)?bpmn\s+init'
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "ChildSimEval BPMN artifact exists"
    command: "python3 $REFERENCE_DIR/_shared/check_bpmn_present.py ChildSimEval"
    timeout: 30
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent created an eval set"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+bpmn\s+eval\s+set\s+add'
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent added a data point with --inputs and --expected"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+bpmn\s+eval\s+add\s+.*(--inputs.*--expected|--expected.*--inputs)'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent added a Static child simulation with --parent and --mock-value"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+bpmn\s+eval\s+simulation\s+add\s+(?=.*--parent\b)(?=.*--strategy\s+Static\b)(?=.*--mock-value\b)'
    min_count: 1
    weight: 3.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent added an Llm child simulation with --parent, --strategy Llm, and explicit --output-schema"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+bpmn\s+eval\s+simulation\s+add\s+(?=.*--parent\b)(?=.*--strategy\s+Llm\b)(?=.*--output-schema\b)'
    min_count: 1
    weight: 3.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent listed child simulations with --parent"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+bpmn\s+eval\s+simulation\s+list\s+.*--parent'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent removed a child simulation with --parent"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+bpmn\s+eval\s+simulation\s+remove\s+(?=.*--parent\b)'
    min_count: 1
    weight: 2.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent did NOT add a parent simulation without --parent before adding children"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+bpmn\s+eval\s+simulation\s+add\s+agent-1\s+(?!.*--parent)'
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "Eval-set JSON shows the auto-created parent with child simulations persisted correctly"
    command: "python3 $REFERENCE_DIR/evaluate/child_simulation/check_child_simulation_crud.py"
    timeout: 10
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
