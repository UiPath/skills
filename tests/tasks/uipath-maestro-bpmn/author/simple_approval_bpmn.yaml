task_id: skill-bpmn-simple-approval-bpmn
description: >
  Authoring eval: agent composes a model-authored simple approval BPMN that
  combines StartAgentJob, an exclusive gateway, CreateQueueItem, a script task,
  the supported local project scaffold, public entry/exit variable bridges,
  numeric migration metadata, and BPMN DI. Mirrors the manual smoke
  "simple approval" scenario.
tags: [uipath-maestro-bpmn, integration, "mode:build", "lifecycle:generate", "shape:multi-node", "node:decision", resource]

run_limits:
  task_timeout: 2400
  turn_timeout: 1800
  expected_turns: 55
  max_turns: 90
initial_prompt: |
  Create a local BPMN project named "ExpenseApprovalBpmn" for this process:
  - Manual start with caller inputs `expenseId` (string) and `amount` (double),
    and returned output `decision` (string).
  - Service task that calls `Orchestrator.StartAgentJob` to triage the expense
    via a synthetic placeholder agent reference.
  - Exclusive gateway routes high-amount requests (`amount >= 1000`) to a
    `bpmn:sendTask` that creates a queue item via `Orchestrator.CreateQueueItem`,
    and routes the default branch to a `bpmn:scriptTask` that auto-approves the
    request and writes to the `decision` output variable.
  - Both branches converge on a single completion end event, which returns
    `decision`.

  Requirements:
  - Use synthetic placeholder resource names only. Do not include tenant URLs,
    folder keys, connection IDs, real queue names, real agent identifiers, or
    user names.
  - Use the skill's documented mutable-state bridges at the manual entry and
    single completion end event.
  - Include the current numeric serializer migration metadata.
  - Use a registry-derived JavaScript ScriptTask, map its result to the mutable
    decision variable, and keep its code compatible with the Jint runtime (no
    Node.js, browser, filesystem, or network APIs).
  - Include BPMN DI shapes for every visible node and BPMN DI edges with
    waypoints for every sequence flow.
  - Do not upload, publish, deploy, debug, or run the process.

success_criteria:
  - type: file_exists
    description: "BPMN source was created"
    path: "ExpenseApprovalBpmn/ExpenseApprovalBpmn.bpmn"
    weight: 1.0
    pass_threshold: 1.0

  - type: file_exists
    description: "Project metadata was created"
    path: "ExpenseApprovalBpmn/project.uiproj"
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "Simple approval BPMN has the requested nodes, supported local scaffold, public input/output bridges, migration metadata, and complete DI"
    command: "python3 $TASK_DIR/check_simple_approval_bpmn.py"
    timeout: 30
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0
