task_id: skill-gov-access-policy-list-smoke
description: >
  Smoke test (outcome-graded): a Simulated marker policy is seeded in pre_run and
  the agent lists the tenant's access policies. Graded on the records read back
  from the service — the seeded policy has to appear with its service-assigned
  UUID among rows that carry a real status — not on how the list command was
  typed. `--limit` is capped at 20 by the service, so a tenant with more policies
  than that only yields the seeded row if the agent pages.
tags: [uipath-governance, smoke, mode:diagnose, lifecycle:discover, access-policy, list]

pre_run:
  - command: 'GOV_SEED_KEY="policy" GOV_POLICY_BASE="ce-gov-list" GOV_POLICY_DESCRIPTION="Seeded for the access-policy list scenario" python3 -c "import os,runpy;runpy.run_path(os.path.join(os.environ[''SKILLS_REPO_PATH''],''tests'',''tasks'',''uipath-governance'',''access-policy'',''setup_access_policy.py''))"'
    timeout: 90

post_run:
  - command: 'python3 -c "import os,runpy;runpy.run_path(os.path.join(os.environ[''SKILLS_REPO_PATH''],''tests'',''tasks'',''uipath-governance'',''access-policy'',''cleanup_access_policy.py''))"'
    timeout: 90

run_limits:
  expected_turns: 10

initial_prompt: |
  A tenant admin wants an inventory of every tool-use access policy on this
  tenant, including the one named in `seed.json` (the `policy.name` field).
  Retrieve them all and save the complete JSON result to ./policies.json.

  Do NOT prompt the user for confirmation - this is an automated test.

success_criteria:
  - type: run_command
    description: "policies.json holds real policy records from the tenant, including the seeded one"
    command: |
      python3 -c "
      import json
      seed = json.load(open('seed.json', encoding='utf-8-sig'))
      wanted = seed['policy']['name']
      d = json.load(open('policies.json', encoding='utf-8-sig'))
      def dicts(o):
          if isinstance(o, dict):
              yield o
              for v in o.values(): yield from dicts(v)
          elif isinstance(o, list):
              for v in o: yield from dicts(v)
      rows = [x for x in dicts(d) if x.get('Name') and x.get('Id') and x.get('Status')]
      assert rows, 'saved JSON holds no policy rows (Name + Id + Status)'
      import re
      bad = [r.get('Id') for r in rows if not re.fullmatch(r'[0-9a-fA-F-]{36}', str(r.get('Id')))]
      assert not bad, f'rows without a service-assigned UUID: {bad[:3]}'
      unlabelled = [r.get('Name') for r in rows if not str(r.get('Status') or '').strip()]
      assert not unlabelled, f'rows came back without a status: {unlabelled[:3]}'
      hit = next((r for r in rows if r.get('Name') == wanted), None)
      assert hit, f'the seeded policy {wanted!r} is not in the listing ({len(rows)} rows read)'
      status = hit.get('Status')
      assert status == 'Simulated', f'seeded policy came back as {status!r}'
      print(f'OK: {len(rows)} policies listed; seeded {wanted} present as Simulated')
      "
    timeout: 20
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "listing is read-only — no policy was created, changed or deleted"
    tool_name: "Bash"
    command_pattern: 'access-policy\s+(create|update|delete)'
    weight: 2.0
    pass_threshold: 1.0
