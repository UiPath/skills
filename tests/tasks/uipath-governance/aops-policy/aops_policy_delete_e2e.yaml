task_id: skill-gov-aops-policy-delete-e2e
description: >
  End-to-end (outcome-graded): the agent removes a policy it did not create. The
  check reads the seeded identifier back — aops deletes for real, so `get` must
  report the policy missing and a name search must return nothing. A do-nothing
  agent cannot make a seeded identifier vanish.
tags: [uipath-governance, e2e, mode:build, lifecycle:setup, aops-policy, delete]

pre_run:
  - command: 'AOPS_SEED_KEY="retired" AOPS_POLICY_BASE="ce-gov-aops-retire" AOPS_PRODUCT="E2E" AOPS_DESCRIPTION="Obsolete - scheduled for removal" python3 -c "import os,runpy;runpy.run_path(os.path.join(os.environ[''SKILLS_REPO_PATH''],''tests'',''tasks'',''uipath-governance'',''aops-policy'',''setup_aops_policy.py''))"'
    timeout: 120
  # A second policy the agent is told to leave alone. Without it the check only
  # reads the target back, so an agent that wipes the E2E registry scores full marks.
  - command: 'AOPS_SEED_KEY="bystander" AOPS_POLICY_BASE="ce-gov-aops-keep" AOPS_PRODUCT="E2E" AOPS_DESCRIPTION="Active - must survive the retirement" python3 -c "import os,runpy;runpy.run_path(os.path.join(os.environ[''SKILLS_REPO_PATH''],''tests'',''tasks'',''uipath-governance'',''aops-policy'',''setup_aops_policy.py''))"'
    timeout: 120

post_run:
  - command: 'python3 -c "import os,runpy;runpy.run_path(os.path.join(os.environ[''SKILLS_REPO_PATH''],''tests'',''tasks'',''uipath-governance'',''aops-policy'',''cleanup_aops_policy.py''))"'
    timeout: 120

run_limits:
  expected_turns: 18

initial_prompt: |
  The AOps governance policy named in `seed.json` (the `retired.name` field) is
  obsolete. Remove it from the `E2E` product's policy registry. Leave every other
  policy on the organization untouched, and do not change any deployment.

  Do NOT ask for approval, confirmation, or feedback.
  Do NOT pause between planning and implementation.
  Before starting, load the uipath-governance skill and follow its workflow.

success_criteria:
  - type: run_command
    description: "the seeded policy is gone — get reports it missing, the name search is empty, and the bystander policy survived"
    command: 'AOPS_SEED_KEY="retired" AOPS_CHECK="absent" AOPS_BYSTANDER_KEY="bystander" python3 -c "import os,runpy;runpy.run_path(os.path.join(os.environ[''SKILLS_REPO_PATH''],''tests'',''tasks'',''uipath-governance'',''aops-policy'',''verify_aops_policy.py''))"'
    timeout: 120
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "nothing was deployed — governance deployment state is left untouched"
    tool_name: "Bash"
    command_pattern: 'aops-policy\s+deployment\s+\w+\s+(configure|remove|delete)'
    weight: 2.0
    pass_threshold: 1.0
