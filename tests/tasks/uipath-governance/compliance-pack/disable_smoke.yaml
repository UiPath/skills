task_id: skill-governance-compliance-disable
description: >
  Skill-guided: "remove ISO 42001 settings from my tenant" must check current compliance
  standard state first, then call state disable. Must NOT call state enable (that would be
  the opposite operation) and must NOT skip the state get pre-check.

tags: [uipath-governance, smoke, mode:operate, lifecycle:setup, feature:compliance]

# Compliance-pack and AOps state is tenant-global, so live runs collided with
# concurrent tasks (CI run 36674826204). The `uip` shim serves those calls from
# recorded fixtures and keeps state in the sandbox — see mock_template/mocks/uip.
# Scenario `active`: ISO 42001 applied (manual settings pending), so disable is the meaningful next step.
sandbox:
  python: {}
  mock_path_dirs: [mocks]
  template_sources:
    - {type: template_dir, path: mock_template}

pre_run:
  - command: 'printf active > .compliance-mock-scenario'
    timeout: 10

initial_prompt: |
  The ISO 42001 standard is currently applied on my tenant — remove all its recommended settings.

  Capture all command output to ./output.txt
  (use `> output.txt 2>&1` for the first command, `>> output.txt 2>&1` for the rest).

  Important:
  - Do NOT run uip login.
  - Always pass --output json.
  - Do NOT prompt for confirmation - this is an automated test.

success_criteria:
  - type: skill_triggered
    description: "Agent activated the uipath-governance skill"
    skill_name: "uipath-governance"
    expected_skill: "uipath-governance"
    weight: 1.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent checked current pack state before disabling (advisory)"
    command_pattern: 'uip\s+gov\s+compliance-packs\s+state\s+get\b'
    min_count: 1
    weight: 1.0
    pass_threshold: 0

  - type: command_executed
    description: "Agent called state disable to remove standard settings"
    command_pattern: 'uip\s+gov\s+compliance-packs\s+state\s+disable\s+\S+'
    min_count: 1
    weight: 3.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Disable flow does NOT call state enable (wrong direction)"
    command_pattern: 'uip\s+gov\s+compliance-packs\s+state\s+enable'
    weight: 3.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Disable flow does NOT call aops-policy create (wrong path)"
    command_pattern: 'uip\s+gov\s+aops-policy\s+create'
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "The pack was really disabled on the tenant (shim state)"
    command: >-
      python3 -c "import json, os, sys;
      p = '.compliance-mock-state.json';
      s = json.load(open(p)) if os.path.exists(p) else {};
      sys.exit(0 if s.get('disabled') else 1)"
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: file_exists
    description: "Command output captured to output.txt"
    path: "output.txt"
    weight: 1.0
    pass_threshold: 1.0
