task_id: skill-governance-compliance-disable
description: >
  Skill-guided: "remove ISO 42001 settings from my tenant" must check current compliance
  standard state first, then call state disable. Must NOT call state enable (that would be
  the opposite operation) and must NOT skip the state get pre-check.

  Platform note: in CI the tenant is live and these commands succeed; locally
  they fail with auth errors. The prompt must not assert either way - see
  drift_restore_smoke.yaml for the failure this caused.
tags: [uipath-governance, smoke, mode:operate, lifecycle:setup, feature:compliance]

sandbox:
  python: {}
  template_sources:
    - type: template_dir
      path: _setup
      mount_point: _setup

# Precondition: the shared tenant is mutable and the compliance-pack cleanup
# DISABLES the pack, so ISO 42001 is often already inactive when this task runs.
# A correct agent that checks state first then sees Active:false rightly refuses
# to disable a no-op — failing through no fault of its own. Enable the pack first
# so `state disable` is always the meaningful required next step. Tolerant of
# no-auth (always exits 0), so local runs are unaffected.
pre_run:
  - command: 'python3 _setup/setup_enable_compliance_pack.py'
    timeout: 120

# Safety net: smoke sandboxes have live tenant auth in CI — the agent's
# `state disable` is harmless, but a wrong-direction run (state enable /
# aops-policy create) really mutates the tenant. Clean up after.
post_run:
  - command: 'python3 _setup/cleanup_compliance_pack.py'
    timeout: 120

initial_prompt: |
  The ISO 42001 standard is currently applied on my tenant — remove all its recommended settings.

  Keep a copy of every command's output in ./output.txt - append with
  `>> output.txt 2>&1`, or `| tee -a output.txt` where the skill redirects that
  command's output to a session file of its own. The skill's session-file layout
  wins; output.txt is an extra copy for review, not a replacement.

  Important:
  - A uip command may fail with an auth error. If one does, carry on with the
    remaining steps - do NOT retry or login.
  - Decide whether a command succeeded from the `Result` field of that command's
    own JSON response. Do NOT search the accumulated output.txt for words like
    "unauthorized" or "forbidden" - the compliance standard's control
    descriptions contain them as ordinary policy text, so that check reports
    failure on a good run.
  - Run each command once, capture output, move on.
  - Always pass --output json.
  - Do NOT prompt for confirmation - this is an automated test.

success_criteria:
  - type: skill_triggered
    description: "Agent activated the uipath-governance skill"
    skill_name: "uipath-governance"
    expected_skill: "uipath-governance"
    weight: 1.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent checked current pack state before disabling (advisory)"
    command_pattern: 'uip\s+gov\s+compliance-packs\s+state\s+get\b'
    min_count: 1
    weight: 1.0
    pass_threshold: 0

  - type: command_executed
    description: "Agent called state disable to remove standard settings"
    command_pattern: 'uip\s+gov\s+compliance-packs\s+state\s+disable\s+\S+'
    min_count: 1
    weight: 3.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Disable flow does NOT call state enable (wrong direction)"
    command_pattern: 'uip\s+gov\s+compliance-packs\s+state\s+enable'
    weight: 3.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Disable flow does NOT call aops-policy create (wrong path)"
    command_pattern: 'uip\s+gov\s+aops-policy\s+create'
    weight: 2.0
    pass_threshold: 1.0

  - type: file_exists
    description: "Command output captured to output.txt"
    path: "output.txt"
    weight: 1.0
    pass_threshold: 1.0
