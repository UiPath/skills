task_id: skill-governance-compliance-already-configured
description: >
  Skill-guided: edge case where all ISO 42001 settings are already Applied on the tenant
  (coverage returns NewCount == 0). The skill must present "all settings Applied" message
  and NOT call state enable. Tests the newCount=0 branch of the full-apply flow.

  Platform note: in CI the tenant is live and these commands succeed; locally
  they fail with auth errors. The prompt must not assert either way - see
  drift_restore_smoke.yaml for the failure this caused.
  The agent must determine from the coverage response not to proceed with
  state enable.
tags: [uipath-governance, smoke, mode:operate, lifecycle:discover, feature:compliance]

sandbox:
  python: {}
  template_sources:
    - type: template_dir
      path: _setup
      mount_point: _setup

# Safety net: smoke sandboxes have live tenant auth in CI, so an agent that
# fails this test (calls state enable) really mutates the tenant. Clean up after.
post_run:
  - command: 'python3 _setup/cleanup_compliance_pack.py'
    timeout: 120

initial_prompt: |
  Check the ISO 42001 posture for my tenant. My tenant has already had all
  ISO 42001 settings configured previously — I expect the posture check to
  show everything as Applied. I am not looking to make any changes, just
  want to verify the current state.

  Keep a copy of every command's output in ./output.txt - append with
  `>> output.txt 2>&1`, or `| tee -a output.txt` where the skill redirects that
  command's output to a session file of its own. The skill's session-file layout
  wins; output.txt is an extra copy for review, not a replacement.

  Important:
  - A uip command may fail with an auth error. If one does, carry on with the
    remaining steps - do NOT retry or login.
  - Decide whether a command succeeded from the `Result` field of that command's
    own JSON response. Do NOT search the accumulated output.txt for words like
    "unauthorized" or "forbidden" - the compliance standard's control
    descriptions contain them as ordinary policy text, so that check reports
    failure on a good run.
  - Run each command once, capture output, move on.
  - Always pass --output json.
  - Do NOT prompt for confirmation.

success_criteria:
  - type: command_executed
    description: "Agent ran state coverage to check current posture"
    command_pattern: 'uip\s+gov\s+compliance-packs\s+state\s+coverage\s+(?:tenant|organization)\s+\S+\s+(?:iso-42001|\$\S+)'
    min_count: 1
    weight: 3.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent did NOT call state enable — all settings already Applied"
    command_pattern: 'uip\s+gov\s+compliance-packs\s+state\s+enable'
    weight: 4.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent did NOT call aops-policy create (wrong path)"
    command_pattern: 'uip\s+gov\s+aops-policy\s+create'
    weight: 2.0
    pass_threshold: 1.0

  - type: file_exists
    description: "Command output captured to output.txt"
    path: "output.txt"
    weight: 1.0
    pass_threshold: 1.0
