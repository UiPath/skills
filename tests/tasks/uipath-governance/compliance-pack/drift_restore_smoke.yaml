task_id: skill-governance-compliance-drift-restore
description: >
  Skill-guided: "check my ISO 42001 posture" on a tenant whose settings have
  drifted must run coverage, read Summary.DriftedControlCount / DriftedControls,
  and route the drifted settings to state restore — NOT to aops-policy update
  (the remedy for manual settings) and NOT to a re-apply via state enable.

  This is the discovery path the drift feature unlocks: the user never says
  "restore", they ask for posture, and the drift data is what turns the answer
  into a restore offer.

  Prompt note: a prompt warning of auth errors once made the agent grep
  output.txt for auth keywords, hit "unauthorized"/"forbidden" in the ISO 42001
  control prose that `catalog get` returns, and abort before running coverage
  (run 2026-08-07_04-44-12) — hence the `Result`-field instruction.
tags: [uipath-governance, smoke, mode:operate, lifecycle:setup, feature:compliance]

# Compliance-pack and AOps state is tenant-global, so live runs collided with
# concurrent tasks (CI run 36674826204). The `uip` shim serves those calls from
# recorded fixtures and keeps state in the sandbox — see mock_template/mocks/uip.
# Scenario `drifted`: ISO 42001 applied with 5 settings changed since (a live capture).
sandbox:
  python: {}
  mock_path_dirs: [mocks]
  template_sources:
    - {type: template_dir, path: mock_template}

pre_run:
  - command: 'printf drifted > .compliance-mock-scenario'
    timeout: 10

initial_prompt: |
  Check my ISO 42001 compliance posture and tell me how to fix whatever isn't right.

  Capture all command output to ./output.txt
  (use `> output.txt 2>&1` for the first command, `>> output.txt 2>&1` for the rest).

  Important:
  - Decide whether a command succeeded from the `Result` field of that command's
    own JSON response. Do NOT search the accumulated output.txt for words like
    "unauthorized" or "forbidden" - the ISO 42001 control descriptions contain
    them as ordinary policy text, so that check reports failure on a good run.
  - Always pass --output json.
  - Do NOT prompt for confirmation - this is an automated test.

success_criteria:
  - type: command_executed
    description: "Agent ran the posture check via state coverage"
    command_pattern: 'uip\s+gov\s+compliance-packs\s+state\s+coverage\s+(?:tenant|organization)\s+\S+\s+(?:iso-42001|\$\S+)'
    min_count: 1
    weight: 3.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent loaded the catalog first — coverage joins with it for setting names"
    command_pattern: 'uip\s+gov\s+compliance-packs\s+catalog\s+(?:get|list)'
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent read applied state from state get — coverage alone cannot tell whether the pack is applied"
    command_pattern: 'uip\s+gov\s+compliance-packs\s+state\s+get\s+(?:tenant|organization)\s+\S+\s+(?:iso-42001|\$\S+)'
    min_count: 1
    weight: 2.0
    pass_threshold: 1.0

  # Deliberately NOT asserting that `state enable` is absent. Every gov task
  # shares one pack and each cleanup disables it globally, so a sibling can
  # flip Active mid-run — and with Active false the skill is RIGHT to offer
  # the apply. The assertion would fail correct behavior at random.

  - type: command_not_executed
    description: "Drifted settings are NOT routed to aops-policy update (that is the manual-setting remedy)"
    command_pattern: 'uip\s+gov\s+aops-policy\s+update'
    weight: 3.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Posture check does NOT disable the standard"
    command_pattern: 'uip\s+gov\s+compliance-packs\s+state\s+disable'
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "A state coverage call returned posture data (resolved tenant id)"
    command: >-
      python3 -c "import json, os, sys;
      p = '.compliance-mock-log.jsonl';
      calls = [json.loads(l) for l in open(p)] if os.path.exists(p) else [];
      sys.exit(0 if any(c['Code'] == 'CompliancePacksStateCoverage' for c in calls) else 1)"
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: file_exists
    description: "Command output captured to output.txt"
    path: "output.txt"
    weight: 1.0
    pass_threshold: 1.0
