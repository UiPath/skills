task_id: skill-governance-compliance-interactive-values
description: >
  Skill-guided: partial apply for Robot UIAutomation settings must detect settings
  needing user-supplied values (synthesize-formdata.mjs notEmpty warning) and prompt
  the user before proceeding. Tests Step 1b of partial-apply/impl.md for the ISO 42001
  compliance standard.

  Platform note: in CI the tenant is live and these commands succeed; locally
  they fail with auth errors. The prompt must not assert either way - see
  drift_restore_smoke.yaml for the failure this caused.
tags: [uipath-governance, smoke, mode:build, lifecycle:setup, feature:compliance]


sandbox:
  python: {}
  template_sources:
    - type: template_dir
      path: _setup
      mount_point: _setup

# CI passes live tenant auth into every smoke sandbox, so the partial-apply
# flow can REALLY create `iso-42001-2023-*-robot` AOps policies. Clean up before
# and after.
pre_run:
  - command: 'python3 _setup/cleanup_compliance_pack.py'
    timeout: 120

post_run:
  - command: 'python3 _setup/cleanup_compliance_pack.py'
    timeout: 120

initial_prompt: |
  As part of our ISO 42001 work I want to restrict which URLs and applications
  our robots are allowed to automate — set up just that control for now, leave
  the rest of the standard alone.

  Keep a copy of every command's output in ./output.txt - append with
  `>> output.txt 2>&1`, or `| tee -a output.txt` where the skill redirects that
  command's output to a session file of its own. The skill's session-file layout
  wins; output.txt is an extra copy for review, not a replacement.

  If you're asked for the URL or application lists, just answer SKIP for now.
  Important:
  - A uip command may fail with an auth error. If one does, carry on with the
    remaining steps - do NOT retry or login.
  - Decide whether a command succeeded from the `Result` field of that command's
    own JSON response. Do NOT search the accumulated output.txt for words like
    "unauthorized" or "forbidden" - the compliance standard's control
    descriptions contain them as ordinary policy text, so that check reports
    failure on a good run.
  - Run each command once, capture output, move on.
  - Always pass --output json. Do NOT prompt for confirmation.
  - Write any helper scripts to the current working directory using relative paths
    (e.g. ./scripts/, ./compliance-session/), not to AppData or TEMP paths.

success_criteria:
  - type: skill_triggered
    description: "Agent activated the uipath-governance skill"
    skill_name: "uipath-governance"
    expected_skill: "uipath-governance"
    weight: 1.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent called catalog get (advisory — codex may skip)"
    command_pattern: 'uip\s+gov\s+compliance-packs\s+catalog\s+get\b'
    min_count: 1
    weight: 1.0
    pass_threshold: 0

  - type: command_executed
    description: "Agent invoked synthesize-formdata.mjs for Robot UIAutomation partial apply"
    command_pattern: 'synthesize-formdata\.mjs'
    min_count: 1
    weight: 1.5
    pass_threshold: 0

  - type: file_exists
    description: "Command output captured to output.txt"
    path: "output.txt"
    weight: 1.0
    pass_threshold: 1.0
