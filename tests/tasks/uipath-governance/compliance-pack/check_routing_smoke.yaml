task_id: skill-governance-compliance-check-routing
description: >
  Skill-guided: "check my ISO 42001 posture" must run posture analysis using
  state coverage - NOT deployed-policy commands or pack-walker.mjs. Tests that
  the skill correctly identifies a check-only request and makes no mutations.
  The prompt names ISO 42001 explicitly, so the pack-scoped commands must target
  iso-42001 - several standards are available and picking the wrong one fails.

tags: [uipath-governance, smoke, mode:operate, lifecycle:discover, feature:compliance]

# Compliance-pack and AOps state is tenant-global, so live runs collided with
# concurrent tasks (CI run 36674826204). The `uip` shim serves those calls from
# recorded fixtures and keeps state in the sandbox — see mock_template/mocks/uip.
# Scenario `inactive`: ISO 42001 never applied.
sandbox:
  python: {}
  mock_path_dirs: [mocks]
  template_sources:
    - {type: template_dir, path: mock_template}

pre_run:
  - command: 'printf inactive > .compliance-mock-scenario'
    timeout: 10

initial_prompt: |
  Check my ISO 42001 compliance standard posture. Show me which recommended settings are already
  configured and which are not yet applied. Do not change anything.

  Capture all command output to ./output.txt
  (use `> output.txt 2>&1` for the first command, `>> output.txt 2>&1` for the rest).

  Important:
  - Always pass --output json.
  - Do NOT prompt for confirmation - this is an automated test.

success_criteria:
  - type: command_executed
    description: "Agent called catalog get for pack detail"
    command_pattern: 'uip\s+gov\s+compliance-packs\s+catalog\s+get\s+(?:iso-42001|\$\S+)'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent called state coverage for posture analysis"
    command_pattern: 'uip\s+gov\s+compliance-packs\s+state\s+coverage\s+(?:tenant|organization)\s+\S+\s+(?:iso-42001|\$\S+)'
    min_count: 1
    weight: 3.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent did NOT call state enable (check-only mode)"
    command_pattern: 'uip\s+gov\s+compliance-packs\s+state\s+enable'
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "A state coverage call returned posture data (resolved tenant id)"
    command: >-
      python3 -c "import json, os, sys;
      p = '.compliance-mock-log.jsonl';
      calls = [json.loads(l) for l in open(p)] if os.path.exists(p) else [];
      sys.exit(0 if any(c['Code'] == 'CompliancePacksStateCoverage' for c in calls) else 1)"
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: file_exists
    description: "Command output captured to output.txt"
    path: "output.txt"
    weight: 1.0
    pass_threshold: 1.0
