task_id: skill-governance-compliance-apply-commands
description: >
  Skill-guided: full standard apply must call state coverage first then state enable.
  Tests that the skill runs posture analysis before configuring, and uses state enable
  (not manual aops-policy create) for the full standard path.

  Platform note: in CI the tenant is live and these commands succeed; locally
  they fail with auth errors. The prompt must not assert either way - see
  drift_restore_smoke.yaml for the failure this caused.
tags: [uipath-governance, smoke, mode:operate, lifecycle:setup, feature:compliance]


sandbox:
  python: {}
  template_sources:
    - type: template_dir
      path: _setup
      mount_point: _setup

# CI passes live tenant auth into every smoke sandbox, so `state enable` here
# REALLY enables the pack. Clean up compliance-pack debris before (keeps coverage gaps present so
# the enable path is exercised deterministically) and after.
pre_run:
  - command: 'python3 _setup/cleanup_compliance_pack.py'
    timeout: 120

post_run:
  - command: 'python3 _setup/cleanup_compliance_pack.py'
    timeout: 120

initial_prompt: |
  Apply the ISO 42001 recommended settings to my tenant to improve my posture
  towards the compliance standard. First show me what would be configured, then proceed.

  Keep a copy of every command's output in ./output.txt - append with
  `>> output.txt 2>&1`, or `| tee -a output.txt` where the skill redirects that
  command's output to a session file of its own. The skill's session-file layout
  wins; output.txt is an extra copy for review, not a replacement.

  Important:
  - A uip command may fail with an auth error. If one does, carry on with the
    remaining steps - do NOT retry or login.
  - Decide whether a command succeeded from the `Result` field of that command's
    own JSON response. Do NOT search the accumulated output.txt for words like
    "unauthorized" or "forbidden" - the compliance standard's control
    descriptions contain them as ordinary policy text, so that check reports
    failure on a good run.
  - Run each command once, capture output, move on.
  - Scope: apply the standard, nothing more. If the standard turns out to be
    applied already, report that and stop. Do NOT go on to configure the
    individual settings that need a manual, org-specific value - that is a
    separate request, and the values it needs are not yours to invent.
  - Always pass --output json.
  - Confirmation is waived for the apply itself - this is an automated test.
    That waiver does NOT extend to steps the skill gates behind asking the
    user for a value; where the skill says to ask, stop and report instead.

success_criteria:
  - type: command_executed
    description: "Agent ran state coverage for posture analysis before apply"
    command_pattern: 'uip\s+gov\s+compliance-packs\s+state\s+coverage\s+(?:tenant|organization)\s+\S+\s+(?:iso-42001|\$\S+)'
    min_count: 1
    weight: 2.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent called state enable for full pack configuration"
    command_pattern: 'uip\s+gov\s+compliance-packs\s+state\s+enable\s+(?:tenant|organization)\s+\S+\s+(?:iso-42001|\$\S+)'
    min_count: 1
    weight: 3.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Full apply does NOT call aops-policy create directly (wrong path)"
    command_pattern: 'uip\s+gov\s+aops-policy\s+create'
    weight: 3.0
    pass_threshold: 1.0

  - type: file_exists
    description: "Command output captured to output.txt"
    path: "output.txt"
    weight: 1.0
    pass_threshold: 1.0
