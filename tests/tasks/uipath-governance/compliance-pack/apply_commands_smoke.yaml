task_id: skill-governance-compliance-apply-commands
description: >
  Skill-guided: full standard apply must call state coverage first then state enable.
  Tests that the skill runs posture analysis before configuring, and uses state enable
  (not manual aops-policy create) for the full standard path.

tags: [uipath-governance, smoke, mode:operate, lifecycle:setup, feature:compliance]

# Compliance-pack and AOps state is tenant-global, so live runs collided with
# concurrent tasks (CI run 36674826204). The `uip` shim serves those calls from
# recorded fixtures and keeps state in the sandbox — see mock_template/mocks/uip.
# Scenario `inactive`: ISO 42001 never applied, so coverage shows gaps and enable is the meaningful next step.
sandbox:
  python: {}
  mock_path_dirs: [mocks]
  template_sources:
    - {type: template_dir, path: mock_template}

pre_run:
  - command: 'printf inactive > .compliance-mock-scenario'
    timeout: 10

initial_prompt: |
  Apply the ISO 42001 recommended settings to my tenant to improve my posture
  towards the compliance standard. First show me what would be configured, then proceed.

  Capture all command output to ./output.txt
  (use `> output.txt 2>&1` for the first command, `>> output.txt 2>&1` for the rest).

  Important:
  - Do NOT run uip login.
  - Always pass --output json.
  - Do NOT prompt for confirmation - this is an automated test.

success_criteria:
  - type: command_executed
    description: "Agent ran state coverage for posture analysis before apply"
    command_pattern: 'uip\s+gov\s+compliance-packs\s+state\s+coverage\s+(?:tenant|organization)\s+\S+\s+(?:iso-42001|\$\S+)'
    min_count: 1
    weight: 2.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent called state enable for full pack configuration"
    command_pattern: 'uip\s+gov\s+compliance-packs\s+state\s+enable\s+(?:tenant|organization)\s+\S+\s+(?:iso-42001|\$\S+)'
    min_count: 1
    weight: 3.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Full apply does NOT call aops-policy create directly (wrong path)"
    command_pattern: 'uip\s+gov\s+aops-policy\s+create'
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "The pack was really enabled on the tenant (shim state)"
    command: >-
      python3 -c "import json, os, sys;
      p = '.compliance-mock-state.json';
      s = json.load(open(p)) if os.path.exists(p) else {};
      sys.exit(0 if s.get('enabled') else 1)"
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: file_exists
    description: "Command output captured to output.txt"
    path: "output.txt"
    weight: 1.0
    pass_threshold: 1.0
