task_id: skill-governance-compliance-query-clause
description: >
  Skill-guided: "what does ISO 42001 compliance standard clause A.6.2.8 recommend?" must use
  catalog get only - zero state commands, zero mutations. Tests that information-only queries
  stay in the query plugin and never trigger apply flows.

tags: [uipath-governance, smoke, mode:operate, lifecycle:discover, feature:compliance]

# Compliance-pack and AOps state is tenant-global, so live runs collided with
# concurrent tasks (CI run 36674826204). The `uip` shim serves those calls from
# recorded fixtures and keeps state in the sandbox — see mock_template/mocks/uip.
# Scenario `inactive`: ISO 42001 never applied.
sandbox:
  python: {}
  mock_path_dirs: [mocks]
  template_sources:
    - {type: template_dir, path: mock_template}

pre_run:
  - command: 'printf inactive > .compliance-mock-scenario'
    timeout: 10

initial_prompt: |
  What does ISO 42001 clause A.6.2.8 recommend for my UiPath tenant?

  Retrieve the recommendation from the compliance standard's catalog on the
  tenant — do not answer from your own knowledge or by reading local files.

  Capture all command output to ./output.txt
  (use `> output.txt 2>&1` for the first command, `>> output.txt 2>&1` for the rest).

  Important:
  - Run the catalog lookup once,
    capture the result, and report it. Use --output json.

success_criteria:
  - type: skill_triggered
    description: "Agent activated the uipath-governance skill"
    skill_name: "uipath-governance"
    expected_skill: "uipath-governance"
    weight: 1.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent called catalog get to retrieve clause recommendations"
    command_pattern: 'uip\s+gov\s+compliance-packs\s+catalog\s+get\b'
    min_count: 1
    weight: 3.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Query does NOT call any state commands - information only, no mutations"
    command_pattern: 'uip\s+gov\s+compliance-packs\s+state\s+(coverage|enable|disable|get|list)'
    weight: 3.0
    pass_threshold: 1.0

  - type: file_exists
    description: "Command output captured to output.txt"
    path: "output.txt"
    weight: 1.0
    pass_threshold: 1.0
