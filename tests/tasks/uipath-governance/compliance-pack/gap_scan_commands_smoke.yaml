task_id: skill-governance-compliance-gap-scan-commands
description: >
  Skill-guided: posture analysis for ISO 42001 compliance standard must use catalog get +
  state coverage, NOT deployed-policy commands or pack-walker.mjs. Tests the correct
  two-command sequence in the plugin architecture.

  Platform note: in CI the tenant is live and these commands succeed; locally
  they fail with auth errors. The prompt must not assert either way - see
  drift_restore_smoke.yaml for the failure this caused.
tags: [uipath-governance, smoke, mode:operate, lifecycle:discover, feature:compliance]


sandbox:
  python: {}
  template_sources:
    - type: template_dir
      path: _setup
      mount_point: _setup

# Safety net: smoke sandboxes have live tenant auth in CI, so an agent that
# strays into apply flows really mutates the tenant. Clean up after.
post_run:
  - command: 'python3 _setup/cleanup_compliance_pack.py'
    timeout: 120

initial_prompt: |
  Run a posture analysis for the ISO 42001 compliance standard against my tenant. Show me which
  recommended settings are configured and which are not yet applied.

  Keep a copy of every command's output in ./output.txt - append with
  `>> output.txt 2>&1`, or `| tee -a output.txt` where the skill redirects that
  command's output to a session file of its own. The skill's session-file layout
  wins; output.txt is an extra copy for review, not a replacement.

  Important:
  - A uip command may fail with an auth error. If one does, carry on with the
    remaining steps - do NOT retry or login.
  - Decide whether a command succeeded from the `Result` field of that command's
    own JSON response. Do NOT search the accumulated output.txt for words like
    "unauthorized" or "forbidden" - the compliance standard's control
    descriptions contain them as ordinary policy text, so that check reports
    failure on a good run.
  - Run each command once, capture output, move on.
  - Always pass --output json.
  - Do NOT prompt for confirmation.

success_criteria:
  - type: command_executed
    description: "Agent called catalog get (advisory — codex may skip to state coverage)"
    command_pattern: 'uip\s+gov\s+compliance-packs\s+catalog\s+get\b'
    min_count: 1
    weight: 1.0
    pass_threshold: 0

  - type: command_executed
    description: "Agent called state coverage for posture analysis"
    command_pattern: 'uip\s+gov\s+compliance-packs\s+state\s+coverage\b'
    min_count: 1
    weight: 3.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent did NOT use pack-walker.mjs (removed in plugin architecture)"
    command_pattern: 'pack-walker\.mjs'
    weight: 2.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent did NOT use deployed-policy commands (wrong path for compliance packs)"
    command_pattern: 'deployed-policy\s+(list|get)'
    weight: 2.0
    pass_threshold: 1.0

  - type: file_exists
    description: "Command output captured to output.txt"
    path: "output.txt"
    weight: 1.0
    pass_threshold: 1.0
