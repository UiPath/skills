task_id: skill-governance-compliance-org-scope
description: >
  Skill-guided: "apply ISO 42001 organization-wide" must iterate over tenants
  using tenant scope — NOT call state enable organization (backend not implemented).
  Agent must: (1) list tenants via uip login tenant list, (2) run state coverage
  per tenant, (3) call state enable tenant for each tenant with gaps.

tags: [uipath-governance, smoke, mode:operate, lifecycle:setup, feature:compliance]

# Compliance-pack and AOps state is tenant-global, so live runs collided with
# concurrent tasks (CI run 36674826204). The `uip` shim serves those calls from
# recorded fixtures and keeps state in the sandbox — see mock_template/mocks/uip.
# Scenario `inactive`: ISO 42001 never applied on any of the 4 tenants.
sandbox:
  python: {}
  mock_path_dirs: [mocks]
  template_sources:
    - {type: template_dir, path: mock_template}

pre_run:
  - command: 'printf inactive > .compliance-mock-scenario'
    timeout: 10

initial_prompt: |
  Apply ISO 42001 recommended settings organization-wide to all tenants.

  Capture all command output to ./output.txt
  (use `> output.txt 2>&1` for the first command, `>> output.txt 2>&1` for the rest).

  Important:
  - Run each command once and move on.
  - Always pass --output json. Do NOT prompt for confirmation.

success_criteria:
  - type: skill_triggered
    description: "Agent activated the uipath-governance skill"
    skill_name: "uipath-governance"
    expected_skill: "uipath-governance"
    weight: 1.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent listed tenants in the org to discover all targets"
    command_pattern: 'uip\s+login\s+tenant\s+list'
    min_count: 1
    weight: 3.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent ran state coverage at tenant scope (advisory — codex may skip)"
    command_pattern: 'uip\s+gov\s+compliance-packs\s+state\s+coverage[\s\S]*tenant'
    min_count: 1
    weight: 1.0
    pass_threshold: 0

  - type: command_executed
    description: "Agent called state enable at tenant scope"
    command_pattern: 'uip\s+gov\s+compliance-packs\s+state\s+enable[\s\S]*tenant'
    min_count: 1
    weight: 2.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent did NOT use organization scope for state enable (backend not implemented)"
    command_pattern: 'uip\s+gov\s+compliance-packs\s+state\s+enable[\s\S]*organization'
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "The pack was enabled on every tenant in the org, one tenant at a time (shim state)"
    command: >-
      python3 -c "import json, os, sys;
      p = '.compliance-mock-state.json';
      s = json.load(open(p)) if os.path.exists(p) else {};
      sys.exit(0 if len(set(s.get('enabled', []))) >= 4 else 1)"
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: file_exists
    description: "Command output captured to output.txt"
    path: "output.txt"
    weight: 1.0
    pass_threshold: 1.0
