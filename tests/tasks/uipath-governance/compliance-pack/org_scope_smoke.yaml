task_id: skill-governance-compliance-org-scope
description: >
  Skill-guided: "apply ISO 42001 organization-wide" must iterate over tenants
  using tenant scope — NOT call state enable organization (backend not implemented).
  Agent must: (1) list tenants via uip login tenant list, (2) run state coverage
  per tenant, (3) call state enable tenant for each tenant with gaps.

  Platform note: in CI the tenant is live and these commands succeed; locally
  they fail with auth errors. The prompt must not assert either way - see
  drift_restore_smoke.yaml for the failure this caused.
tags: [uipath-governance, smoke, mode:operate, lifecycle:setup, feature:compliance]

sandbox:
  python: {}
  template_sources:
    - type: template_dir
      path: _setup
      mount_point: _setup

# CI passes live tenant auth into every smoke sandbox, so `state enable` here
# REALLY enables the pack on the login tenant. Clean up compliance-pack debris before and after.
pre_run:
  - command: 'python3 _setup/cleanup_compliance_pack.py'
    timeout: 120

post_run:
  - command: 'python3 _setup/cleanup_compliance_pack.py'
    timeout: 120

initial_prompt: |
  Apply ISO 42001 recommended settings organization-wide to all tenants.

  Keep a copy of every command's output in ./output.txt - append with
  `>> output.txt 2>&1`, or `| tee -a output.txt` where the skill redirects that
  command's output to a session file of its own. The skill's session-file layout
  wins; output.txt is an extra copy for review, not a replacement.

  Important:
  - A uip command may fail with an auth error. If one does, carry on with the
    remaining steps - do NOT retry or login.
  - Decide whether a command succeeded from the `Result` field of that command's
    own JSON response. Do NOT search the accumulated output.txt for words like
    "unauthorized" or "forbidden" - the compliance standard's control
    descriptions contain them as ordinary policy text, so that check reports
    failure on a good run.
  - Run each command once, capture output, move on.
  - Scope: apply the standard per tenant, nothing more. Where a tenant has it
    applied already, say so for that tenant and move to the next one. Do NOT go
    on to configure the individual settings that need a manual, org-specific
    value - that is a separate request, and the values it needs are not yours
    to invent.
  - Always pass --output json.
  - Confirmation is waived for the apply itself. That waiver does NOT extend to
    steps the skill gates behind asking the user for a value; where the skill
    says to ask, stop and report instead.

success_criteria:
  - type: skill_triggered
    description: "Agent activated the uipath-governance skill"
    skill_name: "uipath-governance"
    expected_skill: "uipath-governance"
    weight: 1.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent listed tenants in the org to discover all targets"
    command_pattern: 'uip\s+login\s+tenant\s+list'
    min_count: 1
    weight: 3.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent ran state coverage at tenant scope (advisory — codex may skip)"
    command_pattern: 'uip\s+gov\s+compliance-packs\s+state\s+coverage\s+tenant'
    min_count: 1
    weight: 1.0
    pass_threshold: 0

  - type: command_executed
    description: "Agent called state enable at tenant scope (advisory — codex stops after auth errors)"
    command_pattern: 'uip\s+gov\s+compliance-packs\s+state\s+enable\s+tenant'
    min_count: 1
    weight: 2.0
    pass_threshold: 0

  - type: command_not_executed
    description: "Agent did NOT use organization scope for state enable (backend not implemented)"
    command_pattern: 'uip\s+gov\s+compliance-packs\s+state\s+enable\s+organization'
    weight: 3.0
    pass_threshold: 1.0

  - type: file_exists
    description: "Command output captured to output.txt"
    path: "output.txt"
    weight: 1.0
    pass_threshold: 1.0
