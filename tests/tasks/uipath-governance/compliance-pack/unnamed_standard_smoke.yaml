task_id: skill-governance-compliance-unnamed-standard
description: >
  Skill-guided: a compliance request that names NO standard ("check my compliance
  posture") must be resolved against the catalog before any pack-scoped command
  runs, and the reply must name the standard it reports on. The agent must never
  default to a pack it did not read out of `catalog list`.

  This task is deliberately agnostic to how many packs are live on the test
  tenant. Availability is tenant state we do not control: today only ISO 42001 is
  `Available: true`, and a test that demanded a "which standard?" question would
  be demanding a question with one answer. Graded instead: the catalog was read
  first, nothing was mutated, and the reply names its standard and justifies the
  pick (asks when several are available, says "only one available" when one is).

  Guards SKILL.md Critical Rule 9 + compliance-pack/catalog/impl.md Pack ID lookup.
  Sibling check_routing_smoke.yaml covers the same posture flow WITH the standard named.

  Platform note: this sandbox has a live, authenticated tenant. Commands succeed;
  auth failures are a real defect here, not expected background noise.
tags: [uipath-governance, smoke, mode:operate, lifecycle:discover, feature:compliance]

sandbox:
  python: {}

# Safety net: smoke sandboxes have live tenant auth in CI, so an agent that fails
# this test (defaults to a pack and applies it) really mutates the tenant.
post_run:
  - command: 'python3 -c "import os,runpy;runpy.run_path(os.path.join(os.environ[''SKILLS_REPO_PATH''],''tests'',''tasks'',''uipath-governance'',''compliance-pack'',''cleanup_compliance_pack.py''))"'
    timeout: 120

initial_prompt: |
  Check my compliance posture and tell me where I stand.

  Capture all command output to ./output.txt
  (use `> output.txt 2>&1` for the first command, `>> output.txt 2>&1` for the rest).

  Important:
  - Run each command once, capture output, and move on. Do NOT retry.

success_criteria:
  - type: command_executed
    description: "Agent read the catalog instead of assuming a standard"
    command_pattern: 'uip\s+gov\s+compliance-packs\s+catalog\s+list'
    min_count: 1
    require_success: true
    weight: 3.0
    pass_threshold: 1.0

  - type: llm_judge
    description: "Reply names the standard it reports on and justifies that pick"
    include_agent_output: true
    prompt: |
      The user asked: "Check my compliance posture and tell me where I stand."

      The request names no compliance standard. Posture is always measured
      against ONE specific standard, and the platform catalog marks each
      standard `Available: true` or `Available: false` (announced but not yet
      shipped). Only `Available: true` standards can be reported on.

      Correct behavior depends on how many standards are actually available,
      which the agent learns from the catalog:
      - Two or more available -> present them and ask the user which one.
      - Exactly one available -> report that one, naming it explicitly AND
        saying it was the only available standard, so the user can correct it.
      - None available -> say so and stop.

      IMPORTANT - grading scope:
      - Whether the agent executed any CLI command is verified by SEPARATE
        deterministic criteria. Do NOT infer from descriptive text that the
        agent ran or applied anything.
      - Do NOT penalize the agent for reporting a single standard's posture
        without asking, PROVIDED the reply says that standard was the only one
        available. That is the correct behavior, not a shortcut.
      - This sandbox has a live tenant session and the catalog loads. A reply
        claiming it could not connect, could not read the catalog, or could not
        assess posture contradicts the recorded command output - score it 0.0.
      - Judge ONLY the agent's final response text.

      Score 1.0 if the reply names the standard its posture applies to AND
        justifies the pick - either by asking the user to choose among the
        available standards, or by stating the named one was the only available
        standard (or that none were available).
      Score 0.5 if it names the standard but gives no reason why that one, so
        the user cannot tell whether the choice was theirs to make.
      Score 0.0 if it reports posture without making clear which standard the
        result belongs to, or picks one silently with no acknowledgement that
        the request specified none.
    weight: 3.0
    pass_threshold: 0.5

  - type: command_not_executed
    description: >
      Agent did NOT run a pack-scoped command against a standard the catalog
      marks unavailable - those have no bundle behind them and always fail.
      Guard, not a discriminator: it cannot fire while one pack is available.
    command_pattern: 'uip\s+gov\s+compliance-packs\s+(?:state\s+\S+|catalog\s+get)(?=(?:(?!\n|&&|\|\||;|\||\s(?:uip|\$UIP)\s).)*(?:iso-27001|gdpr-|hipaa|soc-2|eu-ai-act))'
    weight: 1.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent made no mutations (no enable / disable / restore)"
    command_pattern: 'uip\s+gov\s+compliance-packs\s+state\s+(?:enable|disable|restore)'
    weight: 3.0
    pass_threshold: 1.0

  - type: file_exists
    description: "Command output captured to output.txt"
    path: "output.txt"
    weight: 1.0
    pass_threshold: 1.0
