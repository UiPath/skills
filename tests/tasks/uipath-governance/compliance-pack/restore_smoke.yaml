task_id: skill-governance-compliance-restore
description: >
  Skill-guided: "reset my ISO 42001 settings back to what the standard recommends"
  must check current compliance standard state first (restore is active-pack-only),
  then call state restore. Must NOT call state disable (that removes settings, the
  opposite operation) and must NOT drop to aops-policy create.

tags: [uipath-governance, smoke, mode:operate, lifecycle:setup, feature:compliance]

# Restore is active-pack-only, and pack state is tenant-global: a concurrent
# task's cleanup disabled the pack between this task's enable and the agent's
# `state get`, so a correct agent refused to restore (CI run 36674826204). The
# `uip` shim serves compliance-pack calls from recorded fixtures and keeps pack
# state in the sandbox — see mock_template/mocks/uip. `drifted` = active pack
# with 5 settings changed since applied (a live capture).
sandbox:
  python: {}
  mock_path_dirs: [mocks]
  template_sources:
    - {type: template_dir, path: mock_template}

pre_run:
  - command: 'printf drifted > .compliance-mock-scenario'
    timeout: 10

initial_prompt: |
  I changed some of the ISO 42001 policies on my tenant by hand — reset them back to the values the standard recommends.

  Capture all command output to ./output.txt
  (use `> output.txt 2>&1` for the first command, `>> output.txt 2>&1` for the rest).

  Important:
  - Do NOT run uip login.
  - Always pass --output json.
  - Do NOT prompt for confirmation - this is an automated test.

success_criteria:
  # Either pre-check is correct: restore/impl.md skips `state get` when the
  # agent arrives from a coverage drift check (drift proves the pack is active).
  - type: command_executed
    description: "Agent checked the pack before restoring — state get, or a coverage drift check (restore is active-pack-only)"
    command_pattern: 'uip\s+gov\s+compliance-packs\s+state\s+(?:get|coverage)\s+(?:tenant|organization)\s+\S+\s+(?:iso-42001|\$\S+)'
    min_count: 1
    weight: 2.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent called state restore to reset the standard to its suggested values"
    command_pattern: 'uip\s+gov\s+compliance-packs\s+state\s+restore\s+(?:tenant|organization)\s+\S+\s+(?:iso-42001|\$\S+)'
    min_count: 1
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "Restore actually ran against the active pack (shim state)"
    command: >-
      python3 -c "import json, os, sys;
      p = '.compliance-mock-state.json';
      s = json.load(open(p)) if os.path.exists(p) else {};
      sys.exit(0 if s.get('restored') else 1)"
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Restore flow does NOT call state disable (removes settings, wrong direction)"
    command_pattern: 'uip\s+gov\s+compliance-packs\s+state\s+disable'
    weight: 3.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Restore flow does NOT drop to aops-policy create (wrong path)"
    command_pattern: 'uip\s+gov\s+aops-policy\s+create'
    weight: 2.0
    pass_threshold: 1.0

  - type: file_exists
    description: "Command output captured to output.txt"
    path: "output.txt"
    weight: 1.0
    pass_threshold: 1.0
