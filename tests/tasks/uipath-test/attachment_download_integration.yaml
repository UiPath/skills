task_id: skill-test-attachment-download-integration
description: >
  Integration test: agent uses the uipath-test skill to fetch one named file
  from a test case that has two attachments, into a folder the user named. It
  has to list the attachments, pick the right one by name and download it by
  id, not sweep an execution and not grab the other file. Graded on disk.
  pre_run makes sure the owned EVFX-ATTDL-Login test case exists in HEALTH,
  uploads both files and removes the local copies; post_run clears its
  attachments.
tags: [uipath-test, integration, mode:operate, lifecycle:discover, feature:test-case, outcome-graded]

run_limits:
  expected_turns: 12
  max_turns: 30

pre_run:
  - command: |
      python3 - <<'PYEOF'
      import json, os, subprocess, sys

      def call(*a):
          r = subprocess.run(["uip", *a, "--output", "json"], capture_output=True, text=True)
          try:
              return json.loads(r.stdout[r.stdout.index("{"):])
          except Exception:
              return {}

      def need(out, what):
          if out.get("Result") != "Success":
              print(f"SEED FAILED: {what}: {str(out)[:500]}")
              sys.exit(1)
          return out.get("Data") or {}

      def ensure_case(name):
          projects = call("tm", "project", "list", "--filter", "HEALTH").get("Data") or []
          if not any(p.get("ProjectKey") == "HEALTH" for p in projects):
              need(call("tm", "project", "create", "--name", "HEALTH", "--project-key", "HEALTH"), "create HEALTH")
          rows = call("tm", "testcases", "list", "--project-key", "HEALTH", "--filter", name).get("Data") or []
          exact = [r for r in rows if r.get("Name") == name]
          return exact[0] if exact else need(
              call("tm", "testcases", "create", "--project-key", "HEALTH", "--name", name), f"create {name}")

      def clear(case):
          rows = call("tm", "attachment", "list", "--project-key", "HEALTH", "--test-case-keys", case["TestCaseKey"]).get("Data") or []
          for att in [a for r in rows for a in (r.get("AttachmentIds") or [])]:
              need(call("tm", "attachment", "delete", "--project-key", "HEALTH", "--attachment-id", att,
                        "--object-type", "testCase", "--yes"), f"clear {att}")

      def upload(case, fname, body):
          with open(fname, "w") as f:
              f.write(body)
          need(call("tm", "attachment", "upload", "--project-key", "HEALTH", "--object-id", case["Id"],
                    "--object-type", "testCase", "--file", fname), f"upload {fname}")
          os.remove(fname)  # only Test Manager holds it now

      case = ensure_case("EVFX-ATTDL-Login")
      clear(case)
      upload(case, "login-error.log", "EVFX-ATTDL-MARKER login failed: HTTP 401 at step 3\n")
      upload(case, "checkout-notes.txt", "unrelated notes about the checkout flow\n")
      print("SEEDED EVFX-ATTDL-Login with login-error.log and checkout-notes.txt")
      PYEOF
    timeout: 240

post_run:
  - command: |
      python3 - <<'PYEOF'
      import json, os, subprocess, sys

      def call(*a):
          r = subprocess.run(["uip", *a, "--output", "json"], capture_output=True, text=True)
          try:
              return json.loads(r.stdout[r.stdout.index("{"):])
          except Exception:
              return {}

      def need(out, what):
          if out.get("Result") != "Success":
              print(f"SEED FAILED: {what}: {str(out)[:500]}")
              sys.exit(1)
          return out.get("Data") or {}

      def ensure_case(name):
          projects = call("tm", "project", "list", "--filter", "HEALTH").get("Data") or []
          if not any(p.get("ProjectKey") == "HEALTH" for p in projects):
              need(call("tm", "project", "create", "--name", "HEALTH", "--project-key", "HEALTH"), "create HEALTH")
          rows = call("tm", "testcases", "list", "--project-key", "HEALTH", "--filter", name).get("Data") or []
          exact = [r for r in rows if r.get("Name") == name]
          return exact[0] if exact else need(
              call("tm", "testcases", "create", "--project-key", "HEALTH", "--name", name), f"create {name}")

      def clear(case):
          rows = call("tm", "attachment", "list", "--project-key", "HEALTH", "--test-case-keys", case["TestCaseKey"]).get("Data") or []
          for att in [a for r in rows for a in (r.get("AttachmentIds") or [])]:
              need(call("tm", "attachment", "delete", "--project-key", "HEALTH", "--attachment-id", att,
                        "--object-type", "testCase", "--yes"), f"clear {att}")

      def upload(case, fname, body):
          with open(fname, "w") as f:
              f.write(body)
          need(call("tm", "attachment", "upload", "--project-key", "HEALTH", "--object-id", case["Id"],
                    "--object-type", "testCase", "--file", fname), f"upload {fname}")
          os.remove(fname)  # only Test Manager holds it now

      clear(ensure_case("EVFX-ATTDL-Login"))
      PYEOF
    timeout: 180

initial_prompt: |
  my EVFX-ATTDL-Login test case in Test Manager (HEALTH project) has an error
  log attached. can you save just that log into an evidence/ folder here?

success_criteria:
  - type: skill_triggered
    description: "Agent activated the uipath-test skill from a casual request"
    skill_name: "uipath-test"
    expected_skill: "uipath-test"
    weight: 1.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent checked login status (Critical Rule 1)"
    tool_name: "Bash"
    command_pattern: 'uip\s+login\s+status'
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent downloaded a single file by id (`attachment download --attachment-id`, must succeed)"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+tm\s+attachment\s+download\b(?:\\\n|(?!\s\||\s(?:uip|\$UIP)\s)[^\n;&])*?--attachment-id\b'
    require_success: true
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "The error log's content was saved under evidence/ (any file name)"
    command: "grep -rqs 'EVFX-ATTDL-MARKER login failed' evidence/"
    timeout: 10
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "The other attachment (checkout-notes.txt) was not downloaded, by name or content"
    command: "test -z \"$(find . -name 'checkout-notes*' -print -quit)\" && ! grep -rqs 'unrelated notes about the checkout flow' evidence/"
    timeout: 10
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent did not sweep an execution (`download --execution-id`)"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+tm\s+attachment\s+download\b(?:\\\n|(?!\s\||\s(?:uip|\$UIP)\s)[^\n;&])*?--execution-id\b(?!(?:\\\n|(?!\s\||\s(?:uip|\$UIP)\s)[^\n;&])*--help)'
    weight: 1.0
    pass_threshold: 1.0
