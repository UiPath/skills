task_id: skill-test-project-permissions-access-integration
description: >
  Integration test: the agent triages a permission problem on a project by
  reading the caller's held permissions rather than blindly retrying or dropping
  to raw REST. Given a 403 the user hit trying to trigger a run, the agent must
  run `project-permissions get` for that project, then answer from the returned
  Permissions array whether the identity can create executions there. Grades the
  diagnostic behavior (skill routing, the permissions read, no REST fallback, and
  no re-trigger of the failing run) and that the live envelope is well-formed — a
  Success response that carries a non-empty Permissions array (the get is gated on
  Project.Read, so a successful read always holds at least that; no read access
  returns a 403/404, never a Success with an empty array).
tags: [uipath-test, integration, mode:diagnose, lifecycle:discover]

run_limits:
  expected_turns: 8
  max_turns: 22

pre_run:
  - command: |
      python3 - <<'PYEOF'
      import json, subprocess, sys
      NAME = "EVFX-PERMAT-PROJECT"

      def call(label, *a):
          r = subprocess.run(["uip", *a, "--output", "json"],
                             capture_output=True, text=True)
          out = (r.stdout or "").strip()
          print(f"FIXTURE[{label}] rc={r.returncode} out={out[:160]}", flush=True)
          try:
              return json.loads(out[out.index("{"):])
          except Exception:
              return {}

      def find():
          for p in call("list", "tm", "project", "list", "--filter", NAME).get("Data") or []:
              if p.get("Name") == NAME:
                  return p
          return None

      if not find():
          call("create", "tm", "project", "create", "--name", NAME, "--project-key", "EVFXPERMAT")
      if not find():
          print("FIXTURE: PROVISIONING FAILED - could not find or create project", flush=True)
          sys.exit(1)
      print(f"FIXTURE: project {NAME} ready", flush=True)
      PYEOF
    timeout: 120

initial_prompt: |
  Triggering a test run in my UiPath Test Manager project "EVFX-PERMAT-PROJECT"
  just failed with a 403 Forbidden. Before I ask an admin for anything, I want to
  know what my own account is actually permitted to do in that project, and
  specifically whether I'm allowed to create/trigger executions there. Work it
  out and tell me what you based it on. If my account holds no permissions on the
  project at all, that's a valid finding — report it as such.

success_criteria:
  - type: skill_triggered
    description: "Routed through the uipath-test skill"
    skill_name: "uipath-test"
    expected_skill: "uipath-test"
    weight: 1.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent read its own permissions on the named project rather than retrying the failing run"
    tool_name: "Bash"
    command_pattern: 'uip\s+tm\s+project-permissions\s+get\b(?=(?:(?!\n|&&|\|\||;|\||\s(?:uip|\$UIP)\s).)*--project-(key|id)\s)'
    min_count: 1
    weight: 3.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Did not fall back to raw REST (curl/wget) against the permissions API"
    tool_name: "Bash"
    command_pattern: '(?i)(curl|wget)(?:(?!\n|&&|\|\||;|\|).)*permissions'
    min_count: 0
    max_count: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Triaged rather than blindly re-triggering: did NOT re-run the execution this turn"
    tool_name: "Bash"
    command_pattern: 'uip\s+tm\s+(testsets|testcases|executions)\s+run\b'
    min_count: 0
    max_count: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "The live permissions response is a valid envelope with a non-empty Permissions array (Count==len, Project.Read present)"
    command: |
      python3 - <<'PYEOF'
      import json, subprocess, sys
      NAME = "EVFX-PERMAT-PROJECT"
      def call(*a):
          r = subprocess.run(["uip", *a, "--output", "json"], capture_output=True, text=True)
          o = r.stdout or ""
          try: return json.loads(o[o.index("{"):])
          except Exception: return {}
      pk = ""
      for p in call("tm","project","list","--filter",NAME).get("Data") or []:
          if p.get("Name") == NAME: pk = p.get("ProjectKey"); break
      if not pk:
          print("NO_PROJECT"); sys.exit(1)
      d = call("tm","project-permissions","get","--project-key",pk)
      data = d.get("Data") or {}
      perms = data.get("Permissions")
      ok = (d.get("Result") == "Success" and d.get("Code") == "ProjectPermissionsGet"
            and bool(data.get("ProjectId")) and isinstance(perms, list)
            and len(perms) >= 1 and "Project.Read" in perms
            and data.get("Count") == len(perms))
      print("SHAPE_OK" if ok else "SHAPE_FAIL")
      sys.exit(0 if ok else 1)
      PYEOF
    expected_exit_code: 0
    expected_stdout: "SHAPE_OK"
    stdout_match: contains
    timeout: 60
    weight: 2.0
    pass_threshold: 1.0

  - type: llm_judge
    description: "Agent concluded whether it can create/trigger executions, grounded in the Permissions array it read — not just that it ran the command"
    include_agent_output: true
    include_reference: false
    prompt: |
      The user hit a 403 trying to trigger a test run in a UiPath Test Manager
      project and asked ONE thing: based on their own held permissions on that
      project, are they allowed to create/trigger executions there — and what
      is that based on. The agent was expected to read its held permissions via
      `project-permissions get` (which returns Data.Permissions, the permission
      names the caller holds, always including at least `Project.Read`) and then
      ANSWER the question from that array.

      Judge ONLY the agent's final response text, and judge the CONCLUSION it
      reached — not merely that it ran a command.

      A correct conclusion is grounded in the permissions the agent actually
      retrieved: it reports a concrete verdict on whether the account can
      create/trigger executions in that project, and that verdict is CONSISTENT
      with the permissions it reports holding. Either it names an
      execution-granting permission it found present in the array and concludes
      the operation IS permitted, or it reports that the array carries no such
      permission (e.g. only read-level permissions / only `Project.Read`) and
      concludes the operation is NOT permitted. Reporting that the account holds
      no permissions at all is a valid conclusion only if the agent also
      explains that a successful read always carries at least `Project.Read`, so
      a truly empty result means the read did not succeed.

      Do not require any specific permission string or command phrasing; the
      live permission set varies. Grade grounding, concreteness, and internal
      consistency of the verdict.

      Score 1.0 if the response gives a concrete permitted / not-permitted
        verdict for creating/triggering executions AND grounds it in the
        permissions it read (names the permission(s) it keyed on, or states the
        array lacks any execution-granting permission), with the verdict
        consistent with those reported permissions.
      Score 0.5 if it lists or summarizes the retrieved permissions but gives no
        clear permitted/not-permitted verdict on creating executions, or states
        a verdict whose direction contradicts the permissions it reports.
      Score 0.0 if it reaches no conclusion, answers without reading/reporting
        any held permissions, fabricates a permission it did not retrieve, or
        resolves the 403 by re-triggering the run or calling the REST API
        directly instead of reasoning from the permissions.
    weight: 3.0
    pass_threshold: 1.0
