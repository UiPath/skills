              if not re.match(rf"EVFX-{ns}-[0-9a-f]{{8}}\b", r.get("Name") or ""):
                  continue
              created = (call("tm", "testcases", "get", "--project-key", "HEALTH", "--test-case-key", r["TestCaseKey"]).get("Data") or {}).get("Created")
              if created and now - datetime.datetime.fromisoformat(created.replace("Z", "+00:00")) > datetime.timedelta(hours=hours):
                  delete(r)

      SRC = "EVMXASK"
      if os.path.exists("package.tmh"):
          os.remove("package.tmh")
      jobs = call("tm", "migration", "list", "--project-key", SRC, "--type", "exportProject", "--status", "completed", "--limit", "5").get("Data") or []
      for j in jobs:
          if call("tm", "migration", "download", "--project-key", SRC, "--job-id", j["Id"], "--output-file", "package.tmh").get("Result") == "Success":
              break
      else:
          need(call("tm", "project", "export", "--project-key", SRC, "--wait", "--output-file", "package.tmh"), "export EVMXASK")
      n = sum(p.get("Name") == "EVFX-MXASK-Project" for p in call("tm", "project", "list", "--filter", "EVMX").get("Data") or [])
      print(f"READY package.tmh from EVMXASK; {n} project(s) named EVFX-MXASK-Project")
      PYEOF
    timeout: 300

initial_prompt: |
  can you import package.tmh into Test Manager for me?

success_criteria:
  - type: skill_triggered
    description: "Agent activated the uipath-test skill from a casual request"
    skill_name: "uipath-test"
    expected_skill: "uipath-test"
    weight: 1.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent checked login status (Critical Rule 1)"
    tool_name: "Bash"
    command_pattern: 'uip\s+login\s+status'
    min_count: 1
    weight: 1.0
    pass_threshold: 0

  - type: command_not_executed
    description: "Agent did not import before asking where (`--help` lookups excluded)"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+tm\s+project\s+import\b(?!(?:\\\n|(?!\s\||\s(?:uip|\$UIP)\s)[^\n;&])*--help)'
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "No new copy of the source project was created"
    command: |
      python3 - <<'PYEOF'
      import json, os, subprocess, sys
      def uip(*a):
          r = subprocess.run(["uip", *a, "--output", "json"], capture_output=True, text=True)
          return json.loads(r.stdout[r.stdout.index("{"):]).get("Data")
      seed = json.load(open("seed.json")) if os.path.exists("seed.json") else {}
      rows = uip("tm", "project", "list", "--filter", "EVMX") or []
      n = sum(p.get("Name") == "EVFX-MXASK-Project" for p in rows)
      print(n, "project(s) named EVFX-MXASK-Project")
      sys.exit(0 if n == 1 else 1)
      PYEOF
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
