# NOTE: tier is `integration` (not `smoke`) on purpose: the PR-gate smoke runner
# installs @uipath/cli@latest, and `tm pack --type playwright` ships with
# UiPath/cli#3226. Retag to `smoke` once that CLI release is published.
task_id: skill-test-playwright-pack-generate
description: >
  Offline generate test: agent uses the uipath-test skill to scaffold a minimal
  Playwright suite and pack it into an external test package with
  `uip tm pack --type playwright` — no tenant calls needed (pack is offline and
  `--no-create-test-cases` removes the project-key requirement). Asserts the
  agent (a) produces a project that satisfies pack's stated prerequisites
  (@playwright/test dependency, a lockfile, a playwright.config), (b) packs
  with --type playwright, (c) the resulting .nupkg embeds the testcases.json
  test metadata, and (d) it never reaches for the Studio/RPA pipeline
  (link-automation) — the skill, not the prompt, must teach all of this.
tags: [uipath-test, integration, mode:build, lifecycle:generate, feature:test-case]

initial_prompt: |
  Create a minimal Playwright test suite in ./pw-suite with two passing tests
  (plain assertions, no browser interactions needed), then package it as a
  UiPath external test package named "PwPackCheck" version 1.0.0 into ./out.
  Package it WITHOUT auto-creating Test Manager test cases — this machine has
  no tenant access, and the task is complete when the package file exists.
  Do NOT ask for approval, confirmation, or feedback.
  Before starting, load the uipath-test skill and follow its workflow.

success_criteria:
  - type: command_executed
    description: "Agent packed with tm pack --type playwright"
    tool_name: "Bash"
    command_pattern: 'uip\s+tm\s+pack\s+.*--type\s+playwright'
    min_count: 1
    weight: 3.0
    pass_threshold: 1.0

  - type: file_exists
    description: "External test package was produced"
    path: "out/PwPackCheck.1.0.0.nupkg"
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "Package embeds testcases.json test metadata (the ingestion contract)"
    command: "unzip -l out/PwPackCheck.1.0.0.nupkg | grep -qi testcases.json"
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "Project satisfies pack prerequisites: lockfile committed next to package.json"
    command: "ls pw-suite/ | grep -qE 'package-lock.json|yarn.lock|pnpm-lock.yaml|bun.lock'"
    timeout: 30
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent did not reach for the Studio/RPA pipeline (link-automation is an anti-pattern for Playwright packages)"
    tool_name: "Bash"
    command_pattern: 'uip\s+tm\s+testcases?\s+link-automation'
    weight: 1.0
    pass_threshold: 1.0
