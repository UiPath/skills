task_id: skill-test-customfield-definition-crud-smoke
description: >
  Smoke test: agent uses the uipath-test skill to manage a custom field
  *definition* through its lifecycle — create a Text field scoped to
  Requirement, list to confirm, rename it, then delete it. pre_run seeds a
  throwaway `EVFX-CFIELD-*` project per run (key in project-key.txt) and
  post_run deletes it, so concurrent gate runs never collide on the field name
  and nothing is stranded on a shared project. The prompt lays the four steps
  out explicitly and numbered so a single-turn agent plans all of them. Every
  assertion validates the complete command — the case-sensitive
  `--object-type Requirement` and `--data-type Text`, the exact field name,
  `--rename-to`, and the delete selector — not a fragment.
tags: [uipath-test, smoke, mode:operate, lifecycle:manage, feature:customfield]

run_limits:
  expected_turns: 12
  max_turns: 35

pre_run:
  - command: |
      python3 - <<'PYEOF'
      import datetime, json, secrets, subprocess, sys
      PREFIX = "EVFX-CFIELD-"
      now = datetime.datetime.now(datetime.timezone.utc)

      def call(*a):
          r = subprocess.run(["uip", *a, "--output", "json"],
                             capture_output=True, text=True)
          try:
              return json.loads(r.stdout[r.stdout.index("{"):])
          except Exception:
              return {}

      # Orphan sweep: delete only EVFX-CFIELD-* projects stamped more than 6
      # hours ago, so a concurrent run keeps its own.
      for p in call("tm", "project", "list", "--filter", PREFIX).get("Data") or []:
          nm, key = p.get("Name") or "", p.get("ProjectKey")
          if not key or not nm.startswith(PREFIX):
              continue
          try:
              stamp = datetime.datetime.strptime(nm[len(PREFIX):len(PREFIX) + 15], "%Y%m%d-%H%M%S")
          except ValueError:
              continue
          if now - stamp.replace(tzinfo=datetime.timezone.utc) > datetime.timedelta(hours=6):
              call("tm", "project", "delete", "--project-key", key, "--yes")

      key = "EVCF" + secrets.token_hex(2).upper()
      name = f"{PREFIX}{now.strftime('%Y%m%d-%H%M%S')}-{secrets.token_hex(3)}"
      out = call("tm", "project", "create", "--name", name, "--project-key", key)
      if out.get("Result") != "Success":
          print(f"SEED FAILED: could not create {name} ({key}): {out}")
          sys.exit(1)
      with open("project-key.txt", "w") as f:
          f.write(key + "\n")
      print(f"SEEDED project {name} with key {key}")
      PYEOF
    timeout: 180

post_run:
  - command: |
      [ -f project-key.txt ] && uip tm project delete \
        --project-key "$(cat project-key.txt)" --yes --output json || true
    timeout: 120

initial_prompt: |
  The key of my Test Manager project is in project-key.txt in this folder. I'm
  working on custom fields for requirements. Please do all four of these, in
  order, and don't stop to ask — I've already confirmed the delete:

  1. Add a custom field on requirements called "Eval Reviewer" — just free
     text, to note who reviewed a requirement.
  2. Show me the project's custom fields so I can check it's there.
  3. Rename it to "Eval Reviewer Team".
  4. Remove it so we don't leave anything behind.

success_criteria:
  - type: command_executed
    description: "Agent checked login status (`uip login status`)"
    tool_name: "Bash"
    command_pattern: 'uip\s+login\s+status'
    min_count: 1
    weight: 1.0
    pass_threshold: 0

  - type: command_executed
    description: "Complete create command: `uip tm customfield create --project-key <KEY> --name \"Eval Reviewer\" --data-type Text --object-type Requirement`"
    tool_name: "Bash"
    command_pattern: '(?=.*--project-key\s+\S+)(?=.*--name\s+["\x27]?Eval Reviewer)(?=.*--data-type\s+Text)(?=.*--object-type\s+Requirement)uip\s+tm\s+customfield\s+create'
    min_count: 1
    weight: 2.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Complete list command: `uip tm customfield list --project-key <KEY>`"
    tool_name: "Bash"
    command_pattern: '(?=.*--project-key\s+\S+)uip\s+tm\s+customfield\s+list\s'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Complete rename command: `uip tm customfield update --project-key <KEY> --rename-to \"Eval Reviewer Team\"`"
    tool_name: "Bash"
    command_pattern: '(?=.*--project-key\s+\S+)(?=.*--rename-to\s+["\x27]?Eval Reviewer Team)uip\s+tm\s+customfield\s+update'
    min_count: 1
    weight: 2.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Complete delete command: `uip tm customfield delete --project-key <KEY> (--field-ids <uuid> | --name \"Eval Reviewer Team\" --object-type Requirement)`"
    tool_name: "Bash"
    command_pattern: '(?=.*--project-key\s+\S+)(?=.*(--field-ids\s+\S+|--object-type\s+Requirement))uip\s+tm\s+customfield\s+delete'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0
