task_id: skill-test-customfield-definition-crud-smoke
description: >
  Smoke test: agent uses the uipath-test skill to manage a custom field
  *definition* through its lifecycle — create a Text field scoped to
  Requirement, list to confirm, rename it, then delete it. The task is
  self-contained and deterministic: it creates its own field with a fixed
  name in the HEALTH project (which has no custom fields) and removes it
  again. Every assertion validates the complete command — the
  case-sensitive `--object-type Requirement` and `--data-type Text`, the
  exact field name, `--rename-to`, and `--output json` — not a fragment.
  The prompt pre-authorizes the delete — the uipath-test skill mandates
  user confirmation before any `delete`, and a single-turn run has no
  second turn to grant it.
tags: [uipath-test, smoke, mode:operate, lifecycle:manage, feature:customfield]

run_limits:
  expected_turns: 12
  max_turns: 35

# Clean slate: a failed prior run can leave the field behind, making the
# agent's `customfield create` fail as a duplicate (seen in GH run
# 30291369296). Delete both names before the run, mirroring the population
# task's pre_run pattern.
pre_run:
  - command: |
      uip tm customfield delete --project-key HEALTH --name "Eval Def Reviewer" --object-type Requirement --yes --output json || true
      uip tm customfield delete --project-key HEALTH --name "Eval Def Rev Team" --object-type Requirement --yes --output json || true
    timeout: 60

# Safety net: remove the field (pre- or post-rename name) if the in-run
# delete didn't happen, so failed runs never leave state on shared HEALTH.
post_run:
  - command: |
      uip tm customfield delete --project-key HEALTH --name "Eval Def Reviewer" --object-type Requirement --yes --output json || true
      uip tm customfield delete --project-key HEALTH --name "Eval Def Rev Team" --object-type Requirement --yes --output json || true
    timeout: 60

initial_prompt: |
  I'm in the HEALTH project in Test Manager. Can you add a custom field on
  requirements called "Eval Def Reviewer" — just free text, to note who
  reviewed a requirement. Show me the project's custom fields so I can
  check it's there. Actually, rename it to "Eval Def Rev Team". And once
  we're done, remove it so we don't leave anything behind — you have my
  confirmation to delete it, so go ahead without asking again.

success_criteria:
  - type: command_executed
    description: "Agent checked login status (`uip login status`)"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+login\s+status'
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Complete create command: `uip tm customfield create --project-key HEALTH --name \"Eval Def Reviewer\" --data-type Text --object-type Requirement --output json`"
    tool_name: "Bash"
    command_pattern: '(?=.*--project-key\s+HEALTH)(?=.*--name\s+["\x27]?Eval Def Reviewer)(?=.*--data-type\s+Text)(?=.*--object-type\s+Requirement)(uip|\$UIP)\s+tm\s+customfield\s+create'
    min_count: 1
    weight: 2.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Complete list command: `uip tm customfield list --project-key HEALTH`"
    tool_name: "Bash"
    command_pattern: '(?=.*--project-key\s+HEALTH)(uip|\$UIP)\s+tm\s+customfield\s+list\s'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Complete rename command: `uip tm customfield update --project-key HEALTH --rename-to \"Eval Def Rev Team\" --output json`"
    tool_name: "Bash"
    command_pattern: '(?=.*--project-key\s+HEALTH)(?=.*--rename-to\s+["\x27]?Eval Def Rev Team)(uip|\$UIP)\s+tm\s+customfield\s+update'
    min_count: 1
    weight: 2.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Complete delete command: `uip tm customfield delete --project-key HEALTH (--field-ids <uuid> | --name \"Eval Def Rev Team\" --object-type Requirement) --output json`"
    tool_name: "Bash"
    command_pattern: '(?=.*--project-key\s+HEALTH)(?=.*(--field-ids\s+\S+|--object-type\s+Requirement))(uip|\$UIP)\s+tm\s+customfield\s+delete'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0
