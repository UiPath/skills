task_id: skill-test-defect-traceability-integration
description: >
  Integration test: agent uses the uipath-test skill to trace an existing
  defect back to what it came from and what it puts at risk. The
  seeded failed result on `EVFX-DEFTRACE-TC1` already carries a defect,
  hand-linked to tracker issue EVFX-DEFTRACE-1, and the test case is covered
  by requirement `EVFX-DEFTRACE-REQ`. Asserts that the agent reaches the
  defect through the failed result's `DefectId` (or a defects list) instead
  of guessing a UUID, then uses the `defects` trace verbs —
  `get-related --object-type Requirement` for impact and `get-external-issue`/`get` for the
  tracker link — and writes the answer to a file graded on the real fixture
  values. Read-only: nothing is created or deleted by the agent. `pre_run`
  builds the fixture in a fresh `EVFX-DEFTRACE-<stamp>-<hex>` project per run
  (key in `project-key.txt`) and `post_run` deletes it, so concurrent runs
  never share a defect.
tags: [uipath-test, integration, mode:diagnose, lifecycle:discover, feature:test-case]

run_limits:
  expected_turns: 16
  max_turns: 40

pre_run:
  - command: |
      python3 - <<'PYEOF'
      import datetime, json, secrets, subprocess, sys
      PREFIX = "EVFX-DEFTRACE-"
      now = datetime.datetime.now(datetime.timezone.utc)

      def fail(msg):
          print(f"FIXTURE: PROVISIONING FAILED - {msg}", flush=True)
          sys.exit(1)

      def call(label, *a):
          r = subprocess.run(["uip", *a, "--output", "json"],
                             capture_output=True, text=True)
          out = (r.stdout or "").strip()
          print(f"FIXTURE[{label}] rc={r.returncode} out={out[:200]}", flush=True)
          try:
              return json.loads(out[out.index("{"):])
          except Exception:
              return {}

      # Orphan sweep: a run that died before post_run strands its project.
      # Only projects stamped more than 6 hours ago, so a concurrent run
      # (several models run the nightly at once) keeps its own.
      for p in call("sweep", "tm", "project", "list", "--filter", PREFIX).get("Data") or []:
          name, key = p.get("Name") or "", p.get("ProjectKey")
          try:
              stamp = datetime.datetime.strptime(name[len(PREFIX):len(PREFIX) + 15], "%Y%m%d-%H%M%S")
          except ValueError:
              continue
          if key and now - stamp.replace(tzinfo=datetime.timezone.utc) > datetime.timedelta(hours=6):
              call("sweep.delete", "tm", "project", "delete", "--project-key", key, "--yes")

      # A fresh project per run: the failed result (one defect per result)
      # is never shared with a concurrent run.
      P = "EVDT" + secrets.token_hex(2).upper()
      name = f"{PREFIX}{now.strftime('%Y%m%d-%H%M%S')}-{secrets.token_hex(3)}"
      if call("project.create", "tm", "project", "create", "--name", name,
              "--project-key", P).get("Result") != "Success":
          fail(f"could not create project {name} ({P})")
      with open("project-key.txt", "w") as f:
          f.write(P + "\n")

      def created(kind, name):
          call(f"{kind}.create", "tm", kind, "create", "--project-key", P, "--name", name)
          for x in call(f"{kind}.find", "tm", kind, "list", "--project-key", P,
                        "--filter", name).get("Data") or []:
              if x.get("Name") == name:
                  return x
          fail(f"could not create {name}")

      def failed_logs(eid):
          return [l for l in call("logs", "tm", "executions", "testcaselogs", "list",
                                  "--project-key", P, "--execution-id", eid,
                                  "--only-failed").get("Data") or []
                  if l.get("Result") == "Failed"]

      def seed_failed_run(ts, tc):
          call("set.add", "tm", "testcases", "add", "--test-set-key", ts["TestSetKey"],
               "--test-case-keys", tc["TestCaseKey"])
          eid = (call("run", "tm", "testsets", "run", "--test-set-key", ts["TestSetKey"],
                      "--execution-type", "manual").get("Data") or {}).get("ExecutionId")
          if not eid:
              fail("could not start a manual execution")
          call("finish", "tm", "testcaselog", "finish", "--project-key", P,
               "--execution-id", eid, "--test-case-id", tc["Id"], "--result", "Failed",
               "--has-error", "true", "--executed-by", "eval-fixture@uipath.com")
          logs = failed_logs(eid)
          if not logs:
              fail(f"execution {eid} has no failed result after finish")
          return eid, logs[0]

      ISSUE = "EVFX-DEFTRACE-1"
      ts = created("testsets", "EVFX-DEFTRACE-SET")
      tc = created("testcases", "EVFX-DEFTRACE-TC1")
      req = created("requirements", "EVFX-DEFTRACE-REQ")
      call("req.link", "tm", "requirements", "testcases", "--project-key", P,
           "--requirement-id", req["Id"], "--add-testcase-ids", tc["Id"])
      eid, _ = seed_failed_run(ts, tc)
      did = (call("defect.create", "tm", "defects", "create", "--project-key", P,
                  "--execution-id", eid, "--test-case-id", tc["Id"]).get("Data") or {}).get("Id")
      if not did:
          fail("could not raise the fixture defect")
      call("defect.link", "tm", "defects", "update", "--project-key", P,
           "--defect-id", did, "--external-reference", ISSUE, "--external-link",
           f"https://example.atlassian.net/browse/{ISSUE}")
      issue = call("defect.issue", "tm", "defects", "get-external-issue",
                   "--project-key", P, "--defect-id", did).get("Data") or {}
      if issue.get("ExternalKey") != ISSUE:
          fail(f"defect {did} is not linked to {ISSUE}: {issue}")
      print(f"FIXTURE: defect {did} on {eid} linked to {ISSUE} (project {P})", flush=True)
      PYEOF
    timeout: 280

post_run:
  - command: |
      [ -f project-key.txt ] && uip tm project delete \
        --project-key "$(cat project-key.txt)" --yes --output json || true
    timeout: 180

initial_prompt: |
  The key of my Test Manager project is in project-key.txt in this folder.
  Someone raised a defect off the last failed run of the `EVFX-DEFTRACE-SET`
  test set in that project. Before I triage it I need to
  know three things: which test case it was raised against, which
  requirements it puts at risk, and which issue in our tracker it is linked
  to. Write the answer to `defect-trace.md` in the current directory.

success_criteria:
  - type: command_executed
    description: "Agent checked login status before touching Test Manager (Critical Rule #1)"
    tool_name: "Bash"
    command_pattern: 'uip\s+login\s+status'
    min_count: 1
    weight: 1.0
    pass_threshold: 0   # advisory

  - type: command_executed
    description: "Agent reached the defect from the run's results or the defect list, not a guessed UUID"
    tool_name: "Bash"
    command_pattern: 'uip\s+tm\s+(executions?\s+testcaselogs\s+list|defects?\s+list)\b'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent read the requirements at risk with `defects get-related --object-type Requirement`"
    tool_name: "Bash"
    command_pattern: '^(?=[\s\S]*\bRequirement\b)[\s\S]*?uip\s+tm\s+defects?\s+get-related\b(?=[\s\S]*--defect-id\s+\S)(?=[\s\S]*--object-type\s+\S)'
    min_count: 1
    weight: 3.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent read the tracker link with `defects get-external-issue` or `defects get`"
    tool_name: "Bash"
    command_pattern: '(?=[\s\S]*--defect-id\s+\S)uip\s+tm\s+defects?\s+(get-external-issue|get)(?![\w-])'
    min_count: 1
    weight: 2.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Read-only task: the agent did not create, update or delete defects"
    tool_name: "Bash"
    command_pattern: 'uip\s+tm\s+defects?\s+(create|update|delete)\b'
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "defect-trace.md names the real test case, requirement and tracker issue from the fixture"
    command: |
      test -f defect-trace.md \
        && grep -q 'EVFX-DEFTRACE-TC1' defect-trace.md \
        && grep -q 'EVFX-DEFTRACE-REQ' defect-trace.md \
        && grep -q 'EVFX-DEFTRACE-1\b' defect-trace.md
    timeout: 5
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
