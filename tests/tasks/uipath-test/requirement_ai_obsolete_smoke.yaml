task_id: skill-test-requirement-ai-obsolete-smoke
description: >
  Smoke test: agent uses the uipath-test skill to have Test Manager's AI flag
  obsolete test cases on a requirement, show the flags, delete ONLY the one
  ranked first (go-ahead given up front) and take any other flagged ones off
  the requirement while keeping them. Asserts from
  references/requirement-ai-guide.md (Scenario 3, rules 1 and 7): one search
  job, shown before acting; the delete goes through
  `find-obsolete-testcases --delete --yes --select 1`, not a hand-rolled
  `testcases delete` that skips the CLI's linked-test-case check; nothing
  else is deleted. Graded on tenant state: exactly one of the four seeded
  test cases is gone. EVFX-AIDEL-TC3 and TC4 are planted off-topic so the AI
  has something to flag; whether it flags more than one is not stable, so
  the unlink is advisory. The task owns the EVFX-AIDEL-* namespace; pre_run
  recreates the deleted test case and relinks all four every run. Spends one
  AI job per run.
tags: [uipath-test, smoke, mode:operate, lifecycle:setup, feature:test-case]

run_limits:
  expected_turns: 14
  max_turns: 40
  turn_timeout: 1500
  task_timeout: 1800

sandbox:
  template_sources:
    - type: template_dir
      path: _setup
      mount_point: _setup

reference:
  directory: _setup

pre_run:
  - command: >-
      python3 _setup/req_ai_fixture.py seed --project HEALTH --stamped-prefix EVFX-AIDEL-
      --requirement EVFX-AIDEL-REQ --require-access find-obsolete-testcases
      --description "A nurse records a patient's vital signs: temperature, pulse and blood pressure. Values outside the normal range are highlighted in red. A record can be corrected within 24 hours and keeps the previous value in its history."
      --case "EVFX-AIDEL-TC1 Record vital signs=Enter temperature, pulse and blood pressure for a patient and save the record."
      --case "EVFX-AIDEL-TC2 Out-of-range value is highlighted=Enter a pulse of 150 and check that it is shown in red."
      --case "EVFX-AIDEL-TC3 Print shipping label=Open an order, print its shipping label and check the address block."
      --case "EVFX-AIDEL-TC4 Export monthly invoice as PDF=Open the billing page, pick last month and download the invoice as a PDF file."
    timeout: 280

post_run:
  - command: |
      [ -f project-key.txt ] && uip tm project delete \
        --project-key "$(cat project-key.txt)" --yes --output json || true
    timeout: 120

initial_prompt: |
  In the project whose key is in project-key.txt, have Test Manager's AI find obsolete test cases among
  those linked to requirement EVFX-AIDEL-REQ, and show me what it flags.
  Delete only the one it ranks first (its #1); you have my go-ahead for that
  one delete, no need to ask again. Take any other flagged ones off the
  requirement, but keep them.

success_criteria:
  - type: command_executed
    description: "Agent checked login status before touching Test Manager (Critical Rule #1)"
    tool_name: "Bash"
    command_pattern: 'uip\s+login\s+status'
    min_count: 1
    weight: 1.0
    pass_threshold: 0   # advisory

  - type: command_executed
    description: "Agent ran the search on its own first, to show the flags (`find-obsolete-testcases --requirement-id|--requirement-key`, no --unlink/--delete)"
    tool_name: "Bash"
    command_pattern: 'uip\s+tm\s+requirements?\s+find-obsolete-testcases(?!(?:(?!\n|&&|\|\||;|\||\s(?:uip|\$UIP)\s).)*--(?:activity-id|help|unlink\b|delete\b))(?=(?:(?!\n|&&|\|\||;|\||\s(?:uip|\$UIP)\s).)*--requirement-(?:id|key)\s+\S)'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Delete through the guarded path on the same job: `find-obsolete-testcases --activity-id <id> --delete --yes --select 1`"
    tool_name: "Bash"
    command_pattern: 'uip\s+tm\s+requirements?\s+find-obsolete-testcases(?=(?:(?!\n|&&|\|\||;|\||\s(?:uip|\$UIP)\s).)*--activity-id\s+\S)(?=(?:(?!\n|&&|\|\||;|\||\s(?:uip|\$UIP)\s).)*--delete\b)(?=(?:(?!\n|&&|\|\||;|\||\s(?:uip|\$UIP)\s).)*(?:--yes|-y)\b)(?=(?:(?!\n|&&|\|\||;|\||\s(?:uip|\$UIP)\s).)*--select\s+["\x27]?1(?![\s"\x27]*\d))'
    min_count: 1
    weight: 2.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Other flags were unlinked on the same job (`--activity-id <id> --unlink`) — advisory: the AI may flag only one"
    tool_name: "Bash"
    command_pattern: 'uip\s+tm\s+requirements?\s+find-obsolete-testcases(?=(?:(?!\n|&&|\|\||;|\||\s(?:uip|\$UIP)\s).)*--activity-id\s+\S)(?=(?:(?!\n|&&|\|\||;|\||\s(?:uip|\$UIP)\s).)*--unlink\b)'
    min_count: 1
    weight: 1.0
    pass_threshold: 0   # advisory

    # Bounded command_executed, not command_not_executed: the loader rewrites
    # command_not_executed to max_count 0 (see uipath-insights/dashboards/copy_smoke.yaml).
  - type: command_executed
    description: "No second search job (rule 1)"
    tool_name: "Bash"
    command_pattern: 'uip\s+tm\s+requirements?\s+find-obsolete-testcases(?!(?:(?!\n|&&|\|\||;|\||\s(?:uip|\$UIP)\s).)*--(?:activity-id|help))(?=(?:(?!\n|&&|\|\||;|\||\s(?:uip|\$UIP)\s).)*--requirement-(?:id|key)\s+\S)'
    min_count: 0
    max_count: 1
    weight: 2.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "No delete outside the guarded path (`testcases delete` skips the linked-test-case check, rule 7)"
    tool_name: "Bash"
    command_pattern: 'uip\s+tm\s+testcases?\s+delete\b'
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "Outcome: exactly one of the four EVFX-AIDEL test cases was deleted; the unlinked ones still exist"
    command: "python3 $REFERENCE_DIR/req_ai_fixture.py check --project HEALTH --requirement EVFX-AIDEL-REQ --exist-count EVFX-AIDEL-TC=3"
    timeout: 120
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
