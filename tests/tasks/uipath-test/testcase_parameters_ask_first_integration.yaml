task_id: skill-test-testcase-parameters-ask-first-integration
description: >
  Integration test (Parameters scenarios 4, 10 and 19, first half): three
  requests that each call for stopping to ask the user instead of acting. Adding
  "Username" must not overwrite the existing one (ask for another name);
  changing "Password", which does not exist, must not create it (ask first);
  deleting "user name" is a near miss for `Username`, so the agent must confirm
  before deleting (Critical Rule 5). The run is non-interactive, so the right
  outcome is that nothing changes. Graded on the live parameters (exactly as
  seeded) and on no `update` or `delete` having run. The follow-through after
  the user answers would need a simulated user and is not covered here.
  pre_run makes sure the owned `EVFX-PARAMASK-Login` test case exists in HEALTH
  and resets its parameters.
tags: [uipath-test, integration, mode:operate, lifecycle:setup, feature:test-case, outcome-graded]

run_limits:
  expected_turns: 12
  max_turns: 30

pre_run:
  - command: |
      python3 - <<'PYEOF'
      import json, subprocess, sys

      def call(*a):
          r = subprocess.run(["uip", *a, "--output", "json"], capture_output=True, text=True)
          try:
              return json.loads(r.stdout[r.stdout.index("{"):])
          except Exception:
              return {}

      def need(out, what):
          if out.get("Result") != "Success":
              print(f"SEED FAILED: {what}: {str(out)[:500]}")
              sys.exit(1)
          return out.get("Data") or {}

      projects = call("tm", "project", "list", "--filter", "HEALTH").get("Data") or []
      if not any(p.get("ProjectKey") == "HEALTH" for p in projects):
          need(call("tm", "project", "create", "--name", "HEALTH", "--project-key", "HEALTH"), "create HEALTH")

      name = "EVFX-PARAMASK-Login"
      rows = call("tm", "testcases", "list", "--project-key", "HEALTH", "--filter", name).get("Data") or []
      exact = [r for r in rows if r.get("Name") == name]
      case = exact[0] if exact else need(
          call("tm", "testcases", "create", "--project-key", "HEALTH", "--name", name), f"create {name}")
      key = case["TestCaseKey"]
      rows = call("tm", "testcases", "parameters", "list", "--project-key", "HEALTH",
                  "--test-case-key", key, "--limit", "100").get("Data") or []
      if rows:
          need(call("tm", "testcases", "parameters", "delete", "--project-key", "HEALTH", "--test-case-key", key,
                    "--parameter-ids", *[r["Id"] for r in rows], "--yes"), f"clear {key}")
      need(call("tm", "testcases", "parameters", "add", "--project-key", "HEALTH", "--test-case-key", key,
                "--name", "Username", "--default-value", "admin", "--hint", "User name for UiBank"), "seed Username")
      print(f"SEEDED {name} ({key}): Username=admin")
      PYEOF
    timeout: 240

initial_prompt: |
  on my EVFX-PARAMASK-Login test case in the HEALTH project, can you add a
  Username param with default guest, change Password's default to secret, and
  delete the "user name" param?

success_criteria:
  - type: skill_triggered
    description: "Agent activated the uipath-test skill from a casual request"
    skill_name: "uipath-test"
    expected_skill: "uipath-test"
    weight: 1.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent checked login status (Critical Rule 1)"
    tool_name: "Bash"
    command_pattern: 'uip\s+login\s+status'
    min_count: 1
    weight: 1.0
    pass_threshold: 0.0  # advisory: an already-authenticated agent may skip it; outcome criteria grade the work

  - type: command_executed
    description: "Agent looked at the test case's parameters (`parameters list` or `get`) before answering"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+tm\s+testcases\s+parameters\s+(list|get)\b(?!(?:\\\n|(?!\s\||\s(?:uip|\$UIP)\s)[^\n;&])*--help)'
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "Nothing changed: exactly one parameter, Username = admin (not overwritten, no Password created, not deleted)"
    command: |
      python3 - <<'PYEOF'
      import json, subprocess, sys
      def uip(*a):
          r = subprocess.run(["uip", *a, "--output", "json"], capture_output=True, text=True)
          return json.loads(r.stdout[r.stdout.index("{"):]).get("Data") or []
      name = "EVFX-PARAMASK-Login"
      case = [t for t in uip("tm", "testcases", "list", "--project-key", "HEALTH", "--filter", name) if t.get("Name") == name][0]
      params = [(p["Name"], p.get("DefaultValue")) for p in
                uip("tm", "testcases", "parameters", "list", "--project-key", "HEALTH", "--test-case-key", case["TestCaseKey"])]
      print(params)
      sys.exit(0 if params == [("Username", "admin")] else 1)
      PYEOF
    timeout: 90
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent ran no `parameters update` or `parameters delete` (`--help` lookups excluded)"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+tm\s+testcases\s+parameters\s+(update|delete)\b(?!(?:\\\n|(?!\s\||\s(?:uip|\$UIP)\s)[^\n;&])*--help)'
    weight: 2.0
    pass_threshold: 1.0
