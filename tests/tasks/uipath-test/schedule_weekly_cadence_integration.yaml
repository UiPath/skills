task_id: skill-test-schedule-weekly-cadence-integration
description: >
  Integration test: build a WEEKLY schedule from a natural-language cadence in a
  non-UTC timezone, exercising `uip tm schedules create`. The difficulty is the
  cadence translation, which only the skill teaches: `--cron` is six or seven
  fields starting with SECONDS (Quartz), not five-field Unix, and a five-field
  guess passes neither the Quartz shape nor the day-of-week mapping; weekly is
  `--cron-details` `type` 3 with a `days` array. The prompt gives "every Monday
  and Thursday at 09:00, Europe/Bucharest" and the start day, and leaves the
  cron shape, the recurrence JSON, the wall-clock format and --output json to
  the skill.

  Concurrency: two model variants run the nightly against the shared CLAIM
  project at once, so the schedule name is per-run stamped and correctness is
  graded on the agent's own emitted create (per-run isolated) rather than on a
  fixed-name post-state row that a concurrent run would collide with. A daily
  guess carries no Mon/Thu and a five-field guess carries no Quartz `?`, so both
  fail the create-content criteria; a tolerant post-state confirms the server
  accepted a weekly schedule today.
tags: [uipath-test, integration, mode:build, lifecycle:setup, feature:trigger]

run_limits:
  expected_turns: 14
  max_turns: 54
  turn_timeout: 1200
  task_timeout: 1800

pre_run:
  - timeout: 300
    command: |
      python3 - <<'EOF'
      import json, subprocess, sys, datetime
      P, SET = "CLAIM", "EVFX-SCHEDWK-SET"
      CASES = ["EVFX-SCHEDWK-TC1"]
      PREFIX = "EVFX-SCHEDWK-"
      today = datetime.datetime.now(datetime.timezone.utc).strftime("%Y%m%d")

      def fail(msg):
          print(f"FIXTURE: PROVISIONING FAILED - {msg}", flush=True)
          sys.exit(1)

      def call(label, *a):
          r = subprocess.run(["uip", *a, "--output", "json"],
                             capture_output=True, text=True)
          out = (r.stdout or "").strip()
          print(f"FIXTURE[{label}] rc={r.returncode} out={out[:300]}", flush=True)
          try:
              return json.loads(out[out.index("{"):])
          except Exception:
              return {}

      def pick(d, *names):
          for n in names:
              if d.get(n):
                  return d[n]
          return None

      def by_name(label, kind, name):
          d = call(label, "tm", kind, "list", "--project-key", P, "--filter", name)
          for x in (d.get("Data") or []):
              if x.get("Name") == name:
                  return x
          return None

      def has_verb(*words):
          return subprocess.run(["uip", *words, "--help"],
                               capture_output=True, text=True).returncode == 0

      for words in (["tm", "schedules", "create"], ["tm", "schedules", "list"],
                    ["tm", "schedules", "delete"]):
          if not has_verb(*words):
              fail(f"this CLI has no 'uip {' '.join(words)}' - needs the "
                   f"release carrying the test set schedule verbs")

      ts = by_name("set.find", "testsets", SET)
      if not ts:
          call("set.create", "tm", "testsets", "create", "--project-key", P, "--name", SET)
          ts = by_name("set.refind", "testsets", SET)
      if not ts:
          fail(f"could not create or find {SET}")
      set_key = pick(ts, "TestSetKey", "Key", "ObjKey")
      set_id = ts.get("Id")

      keys = []
      for name in CASES:
          tc = by_name(f"case.find.{name}", "testcases", name)
          if not tc:
              call(f"case.create.{name}", "tm", "testcases", "create",
                   "--project-key", P, "--name", name)
              tc = by_name(f"case.refind.{name}", "testcases", name)
          if not tc:
              fail(f"could not create or find {name}")
          keys.append(pick(tc, "TestCaseKey", "Key", "ObjKey"))
      call("cases.assign", "tm", "testcases", "add", "--test-set-key", set_key,
           "--test-case-keys", ",".join(keys))

      # Sweep only EARLIER-DAY stamped schedules. The agent stamps its name with
      # today's YYYYMMDD, and a concurrent variant run does too, so a whole
      # -prefix delete would strand the other run mid-create. Spare today's.
      d = call("sched.list", "tm", "schedules", "list", "--project-key", P, "--limit", "200")
      stale = [r["Id"] for r in (d.get("Data") or [])
               if str(r.get("Name", "")).startswith(PREFIX)
               and today not in str(r.get("Name", "")) and r.get("Id")]
      if stale:
          call("sched.clear", "tm", "schedules", "delete", "--project-key", P,
               "--schedule-ids", *stale, "--yes")
      print(f"FIXTURE: ready set_key={set_key!r} set_id={set_id!r} swept={len(stale)}", flush=True)
      EOF

initial_prompt: |
  Set up a recurring run in my UiPath Test Manager project CLAIM. I want the
  "EVFX-SCHEDWK-SET" test set to run every Monday and Thursday at 09:00
  Bucharest time, starting next Monday.

  Name the schedule "EVFX-SCHEDWK-<STAMP>", where <STAMP> is the current UTC
  date and time as YYYYMMDD-HHMMSS followed by 6 random lowercase hex characters
  you generate once for this session. Another session may run at the same
  moment, so the random part is what keeps the name yours — do not reuse or
  extend a schedule an earlier session left behind. Create it for me; no need to
  check in.

success_criteria:
  - type: command_executed
    description: "Agent checked login status with --output json (Critical Rule #1)"
    tool_name: "Bash"
    command_pattern: 'uip\s+login\s+status.*--output\s+json'
    min_count: 1
    weight: 1.0
    pass_threshold: 0

  - type: command_executed
    # Advisory only (pass_threshold 0): signals the agent drove the schedules
    # CLI. NOT gating, because an agent may build the cron-details JSON in a
    # python3 -c wrapper (the captured Bash command is then `python3 -c ...`,
    # not a literal `uip tm schedules create`). Correctness is graded on the
    # STORED schedule below, which is invocation-agnostic and works for every
    # model.
    description: "Agent drove the schedules CLI (advisory; may be wrapped)"
    tool_name: "Bash"
    command_pattern: '(?i)schedules["\s,]+create'
    min_count: 1
    weight: 0.5
    pass_threshold: 0

  - type: run_command
    # PRIMARY, model-agnostic grade: assert the full weekly cadence on the
    # schedule actually stored in Test Manager, not on how the agent typed the
    # command. A today-stamped EVFX-SCHEDWK- schedule must sit on the set, in
    # Bucharest time, with a Quartz 6/7-field cron (carries `?`), hour 09, and
    # Mon+Thu in the day-of-week field, plus a JSON cron-details object. A daily
    # or five-field guess fails this; an agent that wrapped the call in python
    # still passes. Today-filtered + any-match keeps it safe under concurrent
    # per-model runs on the shared project.
    description: "A stamped EVFX-SCHEDWK- weekly schedule (Mon+Thu 09:00 Bucharest, Quartz cron + JSON details) is stored on the set today"
    command: |
      python3 -c "
      import json, subprocess, datetime
      today = datetime.datetime.now(datetime.timezone.utc).strftime('%Y%m%d')

      def uip(*a):
          r = subprocess.run(['uip', *a, '--output', 'json'],
                             capture_output=True, text=True)
          t = r.stdout or ''
          return json.loads(t[t.index('{'):]) if '{' in t else {}

      sets = uip('tm','testsets','list','--project-key','CLAIM','--filter','EVFX-SCHEDWK-SET')
      sid = next((x['Id'] for x in (sets.get('Data') or [])
                  if x.get('Name') == 'EVFX-SCHEDWK-SET'), None)
      assert sid, 'EVFX-SCHEDWK-SET not found'

      rows = uip('tm','schedules','list','--project-key','CLAIM','--limit','200').get('Data') or []
      mine = [r for r in rows
              if str(r.get('Name','')).startswith('EVFX-SCHEDWK-') and today in str(r.get('Name',''))]
      def ok(s):
          cron = str(s.get('CronExpression') or '')
          f = cron.split()
          tz = str(s.get('TimeZone') or s.get('Timezone') or '')
          if not (s.get('TestSetId') == sid and len(f) in (6, 7)
                  and 'Bucharest' in tz
                  and str(s.get('CronDetails') or '').strip().startswith('{')):
              return False
          if '?' not in cron:            # Quartz, not five-field Unix
              return False
          if f[2] != '9':                # 09:00
              return False
          dow = f[5].upper()             # Mon + Thu
          parts = dow.replace(',', ' ').split()
          has_mon = 'MON' in dow or '2' in parts
          has_thu = 'THU' in dow or '5' in parts
          return has_mon and has_thu
      assert any(ok(s) for s in mine), f'no valid Mon+Thu 09:00 weekly schedule stamped today; found {[(r.get(\"Name\"), r.get(\"CronExpression\")) for r in mine]}'
      "
    timeout: 120
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent did not reach past the CLI to the schedule REST route"
    tool_name: "Bash"
    command_pattern: '(?i)(curl|wget)(?:(?!uip\s)[^&;|\r\n\\]|\\\r?\n|\\[^\r\n])*testsetschedules?\b'
    max_count: 0
    weight: 1.0
    pass_threshold: 1.0
