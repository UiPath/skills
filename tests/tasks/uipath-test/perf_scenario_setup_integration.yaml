task_id: skill-test-perf-scenario-setup-integration
description: >
  Integration test: agent uses the uipath-test skill to set up a performance
  (load) test for one automated test case without running it: create a
  scenario under the name pre_run hands it, and bind the test case to it as a
  load group with 5 virtual users, which means finding the test case's package
  and Orchestrator folder. Graded on the tenant: the scenario exists with
  exactly one load group for EVFX-PERFSET-TC1, its package, and 5 virtual
  users, and nothing was run.
tags: [uipath-test, integration, mode:build, lifecycle:setup, outcome-graded]

# Blocked: on the eval tenant (alpha codereval/DefaultTenant) every perf-scenario
# call returns 403 for coder-eval-bot, even with an App Tester (Test Cloud)
# licence and the Performance Tester role in CLAIM; a browser-signed-in user
# passes. EVFX-PERFSET-TC1 also needs its one-time link to a performance-ready
# package there. Re-enable once the bot can call perf-scenario list.
skip: true

run_limits:
  expected_turns: 14
  max_turns: 30

# Dedicated fixture, see tests/tasks/uipath-test/fixtures/README.md. The
# scenario name is stamped per run and handed over in scenario-name.txt so
# concurrent runs never grade each other's scenario; post_run deletes it.
pre_run:
  - command: |
      python3 - <<'PYEOF'
      import datetime, json, secrets, subprocess, sys
      P, NS = "CLAIM", "EVFX-PERFSET-"
      TC = NS + "TC1"
      now = datetime.datetime.now(datetime.timezone.utc)

      def call(*a):
          r = subprocess.run(["uip", *a, "--output", "json"],
                             capture_output=True, text=True)
          try:
              return json.loads(r.stdout[r.stdout.index("{"):r.stdout.rindex("}") + 1])
          except Exception:
              return {}

      # Sweep scenarios a dead run stranded; only ones stamped more than
      # 6 hours ago, so a concurrent run keeps its own.
      listed = call("tm", "perf-scenario", "list", "--project-key", P, "--search", NS, "--limit", "200")
      for s in (listed.get("Data") or {}).get("Scenarios") or []:
          name, key = s.get("Name") or "", s.get("ScenarioKey")
          if not key or not name.startswith(NS):
              continue
          try:
              stamp = datetime.datetime.strptime(name[len(NS):len(NS) + 15], "%Y%m%d-%H%M%S")
          except ValueError:
              continue
          if now - stamp.replace(tzinfo=datetime.timezone.utc) > datetime.timedelta(hours=6):
              call("tm", "perf-scenario", "delete", "--scenario-key", key, "--yes")

      # The test case under load is created if absent, but its automation link
      # is a one-time manual step (fixtures/README.md, Automation-linked
      # fixtures): it needs a performance-ready package in a folder.
      found = [t for t in call("tm", "testcases", "list", "--project-key", P, "--filter", TC).get("Data") or []
               if t.get("Name") == TC]
      if not found:
          out = call("tm", "testcases", "create", "--project-key", P, "--name", TC)
          if out.get("Result") != "Success":
              print(f"SEED FAILED: could not create {TC} in {P}: {out}")
              sys.exit(1)
          found = [{}]
      if not found[0].get("PackageName"):
          print(f"SEED FAILED: {TC} in {P} is not linked to a package. Link it once to a "
                "performance-ready package with `uip tm testcases link-automation` "
                "(fixtures/README.md, Automation-linked fixtures).")
          sys.exit(1)

      name = f"{NS}{now.strftime('%Y%m%d-%H%M%S')}-{secrets.token_hex(3)}"
      with open("scenario-name.txt", "w") as f:
          f.write(name + "\n")
      print(f"SEEDED: {TC} ({found[0].get('TestCaseKey')}) on {found[0].get('PackageName')}; scenario name {name}")
      PYEOF
    timeout: 180

post_run:
  - command: |
      python3 - <<'PYEOF'
      import json, os, subprocess
      def call(*a):
          r = subprocess.run(["uip", *a, "--output", "json"], capture_output=True, text=True)
          try:
              return json.loads(r.stdout[r.stdout.index("{"):r.stdout.rindex("}") + 1])
          except Exception:
              return {}
      if os.path.exists("scenario-name.txt"):
          name = open("scenario-name.txt").read().strip()
          for s in (call("tm", "perf-scenario", "list", "--project-key", "CLAIM", "--search", name).get("Data") or {}).get("Scenarios") or []:
              if s.get("Name") == name and s.get("ScenarioKey"):
                  call("tm", "perf-scenario", "delete", "--scenario-key", s["ScenarioKey"], "--yes")
      PYEOF
    timeout: 120

initial_prompt: |
  I want to load test our EVFX-PERFSET-TC1 test case in the Test Manager project
  CLAIM with 5 virtual users. Set up a performance scenario for it, named as in
  scenario-name.txt. Don't run anything yet, I'll start it myself.

success_criteria:
  - type: command_executed
    description: "Agent checked login status (Critical Rule 1)"
    tool_name: "Bash"
    command_pattern: 'uip\s+login\s+status'
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent created the scenario with `perf-scenario create`"
    tool_name: "Bash"
    command_pattern: 'uip\s+tm\s+perf-scenario\s+create\b'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent bound the test case with `perf-scenario load-groups add`"
    tool_name: "Bash"
    command_pattern: 'uip\s+tm\s+perf-scenario\s+load-groups\s+add\b'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "The scenario has exactly one load group: EVFX-PERFSET-TC1, its package, 5 virtual users"
    command: |
      python3 - <<'PYEOF'
      import json, subprocess, sys
      TC = "EVFX-PERFSET-TC1"
      def call(*a):
          r = subprocess.run(["uip", *a, "--output", "json"], capture_output=True, text=True)
          return json.loads(r.stdout[r.stdout.index("{"):r.stdout.rindex("}") + 1])
      name = open("scenario-name.txt").read().strip()
      tc = [t for t in call("tm", "testcases", "list", "--project-key", "CLAIM", "--filter", TC)["Data"] if t.get("Name") == TC][0]
      keys = [s["ScenarioKey"] for s in (call("tm", "perf-scenario", "list", "--project-key", "CLAIM", "--search", name)["Data"] or {}).get("Scenarios") or []
              if s.get("Name") == name]
      if len(keys) != 1:
          print("scenarios named", name, ":", keys); sys.exit(1)
      groups = call("tm", "perf-scenario", "get", "--scenario-key", keys[0])["Data"].get("LoadGroups") or []
      print("load groups:", [(g.get("TestCaseKey"), g.get("PackageName"), g.get("VirtualUsers")) for g in groups])
      ok = (len(groups) == 1 and groups[0].get("TestCaseKey") == tc["TestCaseKey"]
            and groups[0].get("PackageName") == tc["PackageName"] and groups[0].get("VirtualUsers") == 5)
      sys.exit(0 if ok else 1)
      PYEOF
    timeout: 90
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent did not run the scenario (the user will start it)"
    tool_name: "Bash"
    command_pattern: 'uip\s+tm\s+perf-scenario\s+execute\b'
    weight: 1.5
    pass_threshold: 1.0
