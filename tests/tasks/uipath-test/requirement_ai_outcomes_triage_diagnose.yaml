task_id: skill-test-requirement-ai-outcomes-triage-diagnose
description: >
  Smoke test (offline): agent uses the uipath-test skill to decide the next
  step for six saved outputs of Test Manager's requirement AI commands, the
  outcomes a live tenant cannot produce on demand. Each file is the CLI's
  real envelope shape (from the command source): a generation that found
  nothing (CannotGenerateAdditionalAIArtifacts, rule 5), an evaluation that
  hit the model's token limit (RetryWillNotFix, rule 6), a search stopped by
  the AI rate limit (RetryLater, rule 6), a --create that already created
  its test cases (rule 9), a --delete that left a no-longer-linked test case
  alone (NotLinked, rule 10), and a wait that timed out (rule 3). The
  grader checks the agent's decision file, one closed-vocabulary verdict per
  run. The ids are synthetic; the task touches no tenant state and spends no
  AI units, and it asserts that the agent starts no AI job.
tags: [uipath-test, smoke, mode:diagnose, lifecycle:discover]

run_limits:
  expected_turns: 8
  max_turns: 25

pre_run:
  - command: |
      mkdir -p ai-runs
      cat > ai-runs/run_a.json <<'EOF'
      {
        "Result": "Success",
        "Code": "RequirementGenerateTestCases",
        "Data": {
          "RequirementId": "a1b2c3d4-0000-4000-8000-00000000000a",
          "ActivityId": "f1e2d3c4-0000-4000-8000-00000000000a",
          "Status": "CannotGenerateAdditionalAIArtifacts",
          "TestCases": []
        },
        "Instructions": "The AI proposed no new test cases: your existing test cases already cover the requirement. Change --instructions or add --attachment-ids, then run again."
      }
      EOF
      cat > ai-runs/run_b.json <<'EOF'
      {
        "Result": "ValidationError",
        "ErrorCode": "invalid_argument",
        "Retry": "RetryWillNotFix",
        "Message": "AI requirement evaluation ended with status 'TokenLimitReached': The requirement and its attachments are too large for the AI model.",
        "Instructions": "Running it again with the same inputs will not help: change the requirement's description or attachments first.",
        "Data": {
          "ActivityId": "f1e2d3c4-0000-4000-8000-00000000000b",
          "Status": "TokenLimitReached",
          "CanRetry": false
        }
      }
      EOF
      cat > ai-runs/run_c.json <<'EOF'
      {
        "Result": "Failure",
        "ErrorCode": "rate_limited",
        "Retry": "RetryLater",
        "Message": "AI obsolete test case search ended with status 'RateLimitReached': The AI service is getting too many requests right now.",
        "Instructions": "Run 'uip tm requirements find-obsolete-testcases --project-key 'DEMO' --requirement-id 'a1b2c3d4-0000-4000-8000-00000000000c' --wait' to start a new job.",
        "Data": {
          "ActivityId": "f1e2d3c4-0000-4000-8000-00000000000c",
          "Status": "RateLimitReached"
        }
      }
      EOF
      cat > ai-runs/run_d.json <<'EOF'
      {
        "Result": "Success",
        "Code": "RequirementGenerateTestCases",
        "Data": {
          "RequirementId": "a1b2c3d4-0000-4000-8000-00000000000d",
          "ActivityId": "f1e2d3c4-0000-4000-8000-00000000000d",
          "Status": "Processed",
          "TestCases": [
            {"Number": 1, "Title": "Sign in with valid credentials", "IsTestCaseCreated": false},
            {"Number": 2, "Title": "Sign in with a wrong password", "IsTestCaseCreated": false},
            {"Number": 3, "Title": "Account locks after five failed attempts", "IsTestCaseCreated": false},
            {"Number": 4, "Title": "Email is case-insensitive", "IsTestCaseCreated": false}
          ],
          "Created": 4
        }
      }
      EOF
      cat > ai-runs/run_e.json <<'EOF'
      {
        "Result": "Success",
        "Code": "RequirementFindObsoleteTestCases",
        "Data": {
          "RequirementId": "a1b2c3d4-0000-4000-8000-00000000000e",
          "ActivityId": "f1e2d3c4-0000-4000-8000-00000000000e",
          "Status": "Processed",
          "ObsoleteTestCases": [
            {"Number": 1, "TestCaseId": "c1c2c3c4-0000-4000-8000-000000000001", "TestCaseKey": "DEMO:42", "Name": "Reset password by SMS", "Score": 85, "ConfidenceLevel": "High", "IsDeleted": false},
            {"Number": 2, "TestCaseId": "c1c2c3c4-0000-4000-8000-000000000002", "TestCaseKey": "DEMO:43", "Name": "Reset password by security question", "Score": 80, "ConfidenceLevel": "High", "IsDeleted": false}
          ],
          "Deleted": [1],
          "NotLinked": [2]
        },
        "Warning": "Left flagged test case(s) 2 alone: they are not linked to requirement 'a1b2c3d4-0000-4000-8000-00000000000e', and the CLI only changes test cases linked to it."
      }
      EOF
      cat > ai-runs/run_f.json <<'EOF'
      {
        "Result": "Failure",
        "ErrorCode": "timeout",
        "Retry": "RetryLater",
        "Message": "AI activity 'f1e2d3c4-0000-4000-8000-00000000000f' polling timed out. Last status: InProgress. The job may still finish.",
        "Instructions": "Run 'uip tm requirements generate-testcases --project-key 'DEMO' --activity-id 'f1e2d3c4-0000-4000-8000-00000000000f' --wait' to wait for the same job again, or drop --wait to check its status."
      }
      EOF
    timeout: 30

initial_prompt: |
  Our nightly QA pipeline ran Test Manager's requirement AI commands and
  saved each command's JSON output in ai-runs/ (run_a.json to run_f.json).
  Our on-call engineer needs a next step for each run. Write
  ai-runs/triage.json: an object mapping each run (run_a … run_f) to exactly
  one of these verdicts:

  - "resume-same-job": follow the job that already exists, by its id
  - "start-new-job-now": run the command again right away as a new job
  - "retry-later": wait, then run it again as a new job
  - "change-inputs": a new run only helps after the requirement or its
    inputs change
  - "no-action": the run reached its result; nothing to re-run

  Just the decisions, please; the engineer will do any re-runs.

success_criteria:
  - type: json_check
    description: "run_a — nothing found (CannotGenerateAdditionalAIArtifacts) is a result: no-action (rule 5)"
    path: "ai-runs/triage.json"
    assertions:
      - expression: "run_a"
        operator: "equals"
        expected: "no-action"
    weight: 1.5
    pass_threshold: 1.0

  - type: json_check
    description: "run_b — TokenLimitReached is RetryWillNotFix: change-inputs (rule 6)"
    path: "ai-runs/triage.json"
    assertions:
      - expression: "run_b"
        operator: "equals"
        expected: "change-inputs"
    weight: 1.5
    pass_threshold: 1.0

  - type: json_check
    description: "run_c — RateLimitReached is RetryLater: retry-later, not an immediate new job (rule 6)"
    path: "ai-runs/triage.json"
    assertions:
      - expression: "run_c"
        operator: "equals"
        expected: "retry-later"
    weight: 1.5
    pass_threshold: 1.0

  - type: json_check
    description: "run_d — Created: 4 means --create already ran; running it again duplicates every test case (rule 9)"
    path: "ai-runs/triage.json"
    assertions:
      - expression: "run_d"
        operator: "equals"
        expected: "no-action"
    weight: 2.0
    pass_threshold: 1.0

  - type: json_check
    description: "run_e — NotLinked test case was left alone by design: no-action, not a retry (rule 10)"
    path: "ai-runs/triage.json"
    assertions:
      - expression: "run_e"
        operator: "equals"
        expected: "no-action"
    weight: 1.5
    pass_threshold: 1.0

  - type: json_check
    description: "run_f — a timeout leaves the job running: resume-same-job, never a new start (rule 3)"
    path: "ai-runs/triage.json"
    assertions:
      - expression: "run_f"
        operator: "equals"
        expected: "resume-same-job"
    weight: 2.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent started no AI job while triaging (rule 1)"
    tool_name: "Bash"
    command_pattern: 'uip\s+tm\s+requirements?\s+(?:generate-testcases|evaluate|find-obsolete-testcases)(?!(?:(?!\n|&&|\|\||;|\||\s(?:uip|\$UIP)\s).)*--(?:activity-id|help))(?=(?:(?!\n|&&|\|\||;|\||\s(?:uip|\$UIP)\s).)*--requirement-(?:id|key)\s+\S)'
    weight: 2.0
    pass_threshold: 1.0
