task_id: skill-test-defect-full-lifecycle-e2e
description: >
  E2E test: agent uses the uipath-test skill to walk the whole defects surface
  in a project it provisions and tears down itself. It creates a throwaway
  project, a requirement covered by a test case, and a test set; runs the set
  manually and records the case as Failed; raises a defect from that result;
  sets its status, priority and tracker link by hand (no tracker connected);
  traces it to its test case, execution and the requirement it puts at risk;
  checks it for evidence; writes a triage report; deletes the defect; and
  deletes the project. Asserts every defects verb except `list` (covered by no task yet) and
  `attachments download` — a manual result carries no evidence the CLI can
  seed (see fixtures/README.md) — plus the outcome: a report graded on the
  values the agent set, and the exact project this run created (named in the
  report) gone from the tenant. Grading only that project keeps concurrent
  runs on the same tenant (several models in one nightly) from failing each
  other. The
  skill — not the prompt — must teach recording a manual result with
  `testcaselog finish --result Failed`, deriving the defect's ids from the
  failed result, the hand-link flags, one `get-related` per object type, and
  the 120 s shell time limit on slow `defects` writes.
tags: [uipath-test, e2e, mode:operate, lifecycle:setup, feature:test-case]

run_limits:
  expected_turns: 32
  max_turns: 75
  turn_timeout: 1500
  task_timeout: 1800

# Self-contained: the agent creates and deletes its own project, so the task
# reads and writes nothing in CLAIM/HEALTH/BANK. pre_run only sweeps projects
# a crashed run left behind on an EARLIER day (today's are graded below).
pre_run:
  - command: |
      python3 - <<'PYEOF'
      import json, subprocess, datetime
      PREFIX = "EVFX-DEFFLOW-"
      today = datetime.datetime.now(datetime.timezone.utc).strftime("%Y%m%d")

      def call(*a):
          r = subprocess.run(["uip", *a, "--output", "json"],
                             capture_output=True, text=True)
          try:
              return json.loads(r.stdout[r.stdout.index("{"):])
          except Exception:
              return {}

      removed = 0
      for p in call("tm", "project", "list", "--filter", PREFIX).get("Data") or []:
          name = p.get("Name") or ""
          if not name.startswith(PREFIX) or name.startswith(PREFIX + today):
              continue
          key = p.get("ProjectKey") or p.get("Key")
          if key:
              call("tm", "project", "delete", "--project-key", key, "--yes")
              removed += 1
      print(f"ORPHAN SWEEP: removed {removed} stranded {PREFIX}* project(s) from earlier days")
      PYEOF
    timeout: 240

initial_prompt: |
  I want to rehearse our whole defect workflow in Test Manager before we roll it
  out, in a throwaway project of your own that you remove at the end.

  Set up the project with one requirement, "Login works", covered by one manual
  test case, "Login with valid user", and put that test case in a test set. Run
  the set as a manual run and record the test case as Failed — pretend I
  executed it and it broke.

  Then treat that failure the way we will in real life: raise a defect for it,
  set its status to "Investigating" and its priority to "High", and link it to
  the Jira issue EVDE-101 (https://example.atlassian.net/browse/EVDE-101) — we
  don't have Jira connected, I file issues by hand. Find out which test case
  and which execution the defect came from, which requirements it puts at risk,
  what tracker link Test Manager now holds for it, and whether any evidence is
  attached to it. Write all of that, plus the project's name, to
  `defect-report.md` in the current directory.

  Once the report is written, delete the defect, then delete the project. You
  have my approval to delete both without asking.

  Name the project `EVFX-DEFFLOW-<STAMP>-<TAG>`, where <STAMP> is the current UTC
  date and time as YYYYMMDD-HHMMSS and <TAG> is 6 random lowercase hex
  characters you generate once for this session. Use a project key of `EVDE`
  followed by 4 uppercase hex characters. Do not reuse any existing project.

success_criteria:
  - type: command_executed
    description: "Agent checked login status before touching Test Manager (Critical Rule #1)"
    tool_name: "Bash"
    command_pattern: 'uip\s+login\s+status'
    min_count: 1
    weight: 1.0
    pass_threshold: 0   # advisory

  - type: command_executed
    description: "Agent created its throwaway project with --name and --project-key"
    tool_name: "Bash"
    command_pattern: '(?=[\s\S]*--name\s+["\x27]?EVFX-DEFFLOW-)(?=[\s\S]*--project-key\s+["\x27]?EVDE)uip\s+tm\s+project\s+create\b'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent recorded the manual result as Failed with `testcaselog finish --result Failed`"
    tool_name: "Bash"
    command_pattern: '(?=[\s\S]*--execution-id\s+\S)(?=[\s\S]*--result\s+["\x27]?Failed)uip\s+tm\s+testcaselog\s+finish\b'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent raised the defect from the failed result (`defects create` with --execution-id and the test case)"
    tool_name: "Bash"
    command_pattern: '(?=[\s\S]*--execution-id\s+\S)(?=[\s\S]*--test-case-(id|key)\s+\S)uip\s+tm\s+defects?\s+create\b'
    min_count: 1
    weight: 2.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Update sets status Investigating (alone or with priority/link)"
    tool_name: "Bash"
    command_pattern: '(?=[\s\S]*--defect-id\s+\S)(?=[\s\S]*--status\s+["\x27]?Investigating)uip\s+tm\s+defects?\s+update\b'
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Update sets priority High"
    tool_name: "Bash"
    command_pattern: '(?=[\s\S]*--defect-id\s+\S)(?=[\s\S]*--priority\s+["\x27]?High)uip\s+tm\s+defects?\s+update\b'
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Update hand-links EVDE-101 via --external-reference"
    tool_name: "Bash"
    command_pattern: '(?=[\s\S]*--defect-id\s+\S)(?=[\s\S]*--external-reference\s+["\x27]?EVDE-101)uip\s+tm\s+defects?\s+update\b'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent read the requirements at risk with `get-related --object-type Requirement`"
    tool_name: "Bash"
    command_pattern: '^(?=[\s\S]*\bRequirement\b)[\s\S]*?uip\s+tm\s+defects?\s+get-related\b(?=[\s\S]*--defect-id\s+\S)(?=[\s\S]*--object-type\s+\S)'
    min_count: 1
    weight: 2.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent traced the defect's origin with get-related TestCase / TestExecution / TestCaseLog — advisory; the ids are also known from the run"
    tool_name: "Bash"
    command_pattern: '(?=[\s\S]*--defect-id\s+\S)(?=[\s\S]*--object-type\s+["\x27]?(TestCase|TestExecution|TestCaseLog)\b)uip\s+tm\s+defects?\s+get-related\b'
    min_count: 1
    weight: 1.0
    pass_threshold: 0   # advisory

  - type: command_executed
    description: "Agent read the tracker link (get-external-issue or get) — advisory; the update response also carries it"
    tool_name: "Bash"
    command_pattern: '(?=[\s\S]*--defect-id\s+\S)uip\s+tm\s+defects?\s+(get-external-issue|get)(?![\w-])'
    min_count: 1
    weight: 1.0
    pass_threshold: 0   # advisory

  - type: command_executed
    description: "Agent checked the defect for evidence with `defects attachments list`"
    tool_name: "Bash"
    command_pattern: '(?=[\s\S]*--defect-id\s+\S)uip\s+tm\s+defects?\s+attachments\s+list\b'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent deleted the defect with --yes"
    tool_name: "Bash"
    command_pattern: '(?=[\s\S]*--defect-id\s+\S)(?=[\s\S]*(--yes|-y)\b)uip\s+tm\s+defects?\s+delete\b'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent deleted its throwaway project with --yes (Critical Rule #6)"
    tool_name: "Bash"
    command_pattern: '(?=[\s\S]*--project-key\s+["\x27]?EVDE)(?=[\s\S]*(--yes|-y)\b)uip\s+tm\s+project\s+delete\b'
    min_count: 1
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "defect-report.md names the test case, the requirement at risk, the tracker issue and the status/priority the agent set"
    command: |
      test -f defect-report.md \
        && grep -qi 'Login with valid user' defect-report.md \
        && grep -qi 'Login works' defect-report.md \
        && grep -q 'EVDE-101' defect-report.md \
        && grep -qi 'Investigating' defect-report.md \
        && grep -qi 'High' defect-report.md
    timeout: 5
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "Outcome: the project this run created (named in defect-report.md) is gone from the tenant, so the defect went with it"
    command: |
      python3 - <<'PYEOF'
      import json, re, subprocess
      names = re.findall(r"EVFX-DEFFLOW-\d{8}-\d{6}-[0-9a-f]{6}", open("defect-report.md", encoding="utf-8").read())
      assert names, "defect-report.md does not name the EVFX-DEFFLOW-* project"
      out = subprocess.run(["uip", "tm", "project", "list", "--filter", "EVFX-DEFFLOW-", "--output", "json"],
                           capture_output=True, text=True).stdout
      d = json.loads(out[out.index("{"):])
      assert d.get("Result") == "Success", d
      left = sorted({p["Name"] for p in d.get("Data") or []} & set(names))
      assert not left, f"project(s) left behind: {left}"
      PYEOF
    timeout: 90
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0
