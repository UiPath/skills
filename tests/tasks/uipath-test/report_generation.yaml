task_id: skill-test-report-generation-qa
description: >
  Integration test: agent uses the uipath-test skill to generate a QA Engineer
  test report from Test Manager data against a live tenant. Asserts that the
  agent (a) runs `uip login status` at least once, (b) lists executions for
  a test set with `--test-set-id` and `--output json`, (c) writes the
  report to `test-report-qa-<TODAY>.md` (the skill's default filename for
  today's date), and (d) the report body contains the QA-persona structural
  sections taught by references/test-result-report-guide.md (regression
  analysis + the full pass/fail breakdown) and references the target
  test set. The prompt targets the CLAIM project's test set CLAIM:23.
  The skill — not the prompt — must teach the filename
  convention, the persona-specific sections, and the `--output json` flag.
  Note: when the test set has no executions, the skill correctly
  stops before running `list-testcaselogs` (Critical Rule #4), so that
  command is not asserted here; the report is expected to render the
  empty-data sections honestly.
tags: [uipath-test, integration, mode:operate, lifecycle:generate, feature:test-case]

run_limits:
  expected_turns: 20
  max_turns: 50

initial_prompt: |
  Generate a **QA Engineer** test report from my UiPath Test Manager "CLAIM"
  project — use the test set CLAIM:23. Save the report file in the current
  working directory using the default filename convention from the skill.

  The report is only complete when it carries the full section structure the
  skill defines for this persona — don't hand back a summary that skips
  sections.

success_criteria:
  - type: command_executed
    description: "Agent checked login status (Critical Rule #1 + #2)"
    tool_name: "Bash"
    command_pattern: 'uip\s+login\s+status'
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent listed executions for a test set (`executions list --test-set-id`)"
    tool_name: "Bash"
    command_pattern: 'uip\s+tm\s+executions\s+list\s+.*--test-set-id'
    min_count: 1
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "Report file written using the QA persona filename convention with today's date (test-report-qa-<TODAY>.md)"
    command: "ls \"test-report-qa-$(date -u +%Y-%m-%d).md\" >/dev/null 2>&1"
    timeout: 5
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "QA persona report contains skill-taught structural sections (regression + full pass/fail breakdown) and references the test set"
    command: |
      python3 -c "
      import glob, re, sys
      paths = sorted(glob.glob('test-report-qa-[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9].md'))
      if not paths:
          sys.exit(2)
      body = open(paths[-1], encoding='utf-8', errors='replace').read()
      lower = body.lower()
      def heading(pat):
          return re.search(r'(?im)^#{1,4}\s*.*' + pat, body) is not None
      # Grade the section structure the skill mandates for this persona
      # (references/test-result-report-guide.md step 6), not just keywords --
      # otherwise a report can omit every required heading and still score.
      checks = {
          'Summary heading': heading(r'summary'),
          'Test Set heading': heading(r'test\s*set'),
          'Results Breakdown heading': heading(r'results?\s*breakdown'),
          'Frequently Failing Test Cases heading': heading(r'frequently\s*failing'),
          'Regressions heading (QA persona)': heading(r'regression'),
          'pass/fail counts in body': all(t in lower for t in ['passed', 'failed']),
      }
      missing = [k for k, ok in checks.items() if not ok]
      if missing:
          sys.stderr.write('missing: ' + ', '.join(missing) + chr(10))
          sys.exit(1)
      sys.exit(0)
      "
    timeout: 5
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0
