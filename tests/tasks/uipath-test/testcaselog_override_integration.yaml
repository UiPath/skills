task_id: skill-test-testcaselog-override-integration
description: >
  Operate test: a failure on a settled run is a known environment flake, not a
  product defect, and has to be corrected without losing what the run actually
  recorded. Exercises `uip tm testcaselog override create` and the
  Result-versus-OriginalResult distinction, which no other task covers.

  Only an override produces the graded state. Re-finishing the log moves
  `Result` to `Passed` and carries `OriginalResult` with it; re-running the
  cases makes a new log entirely. Only an override leaves `Result: Passed` on a
  log whose `OriginalResult` is still `Failed`, with a reason attached. An agent
  that "fixes" the run instead of correcting the record fails.

  The prompt says the failure is environmental and that the original result must
  stay visible. It does not name the verb, the flag, or that `--reason` is
  required — a `create` without it is refused — and it does not say that
  `OriginalResult` is the field carrying the run's own answer.

  Concurrency: two model variants share the CLAIM project, so the graded
  outcome is the agent's own emitted `override create` (per-run isolated), not a
  fixed-name post-state a concurrent run would collide with. The fixture seeds
  a per-run STAMPED manual execution and sweeps only earlier-day ones, so a
  concurrent run's in-flight execution is never deleted.
tags: [uipath-test, integration, mode:operate, lifecycle:setup, feature:test-case]

run_limits:
  expected_turns: 16
  max_turns: 40

# Dedicated fixture — see tests/tasks/uipath-test/fixtures/README.md for the
# EVFX- contract.
#
# There is no `executions create` in this CLI: an execution is opened with a
# run. The fixture opens a per-run STAMPED manual execution with
# `testcases run --name EVFX-TCLOG-<STAMP>-RUN --execution-type manual`, which
# returns the execution under Data.Id and opens one Pending log per case; the
# fixture then finishes those logs Passed/Failed/Passed. The execution sits on
# an ad-hoc test set hidden from `testsets list`, so growth is invisible to the
# agent; pre_run bounds it by deleting only EARLIER-DAY executions (never a
# concurrent run's today-stamped one).
pre_run:
  - timeout: 300
    command: |
      python3 - <<'EOF'
      import json, subprocess, sys, datetime, secrets
      P = "CLAIM"
      CASES = ["EVFX-TCLOG-TC1", "EVFX-TCLOG-TC2", "EVFX-TCLOG-TC3"]
      FAILING = "EVFX-TCLOG-TC2"
      # Distinguishing prefix: the trailing "-TC" keeps --search off the sibling
      # read/manual-record testcaselog namespaces, which share the leading stem.
      SEARCH = "EVFX-TCLOG-TC"
      now = datetime.datetime.now(datetime.timezone.utc)
      today = now.strftime("%Y-%m-%d")
      stamp = now.strftime("%Y%m%d-%H%M%S") + secrets.token_hex(3)
      runname = f"EVFX-TCLOG-{stamp}-RUN"

      def fail(msg):
          print(f"FIXTURE: PROVISIONING FAILED - {msg}", flush=True)
          sys.exit(1)

      def call(label, *a):
          r = subprocess.run(["uip", *a, "--output", "json"],
                             capture_output=True, text=True)
          out, err = (r.stdout or "").strip(), (r.stderr or "").strip()
          print(f"FIXTURE[{label}] rc={r.returncode} out={out[:400]} err={err[:250]}",
                flush=True)
          try:
              return json.loads(out[out.index("{"):])
          except Exception:
              return {}

      def pick(d, *names):
          for n in names:
              if d.get(n):
                  return d[n]
          return None

      def by_name(label, kind, name):
          d = call(label, "tm", kind, "list", "--project-key", P, "--filter", name)
          for x in (d.get("Data") or []):
              if x.get("Name") == name:
                  return x
          return None

      def has_verb(*words):
          return subprocess.run(["uip", *words, "--help"],
                               capture_output=True, text=True).returncode == 0

      # Probe each verb the fixture and task need and FAIL rather than seed: a
      # silent seed against a CLI missing any of them scores the agent for work
      # it could not do. `executions create` does NOT exist in this CLI — the
      # execution is opened with `testcases run`.
      for words in (["tm", "testcases", "run"],
                    ["tm", "testcaselog", "finish"],
                    ["tm", "testcaselog", "list"],
                    ["tm", "testcaselog", "get"],
                    ["tm", "testcaselog", "override"]):
          if not has_verb(*words):
              fail(f"this CLI has no 'uip {' '.join(words)}' - needs the "
                   f"release carrying the test case log verbs")

      # Cases - create if absent, never delete.
      case_ids = {}
      for name in CASES:
          tc = by_name(f"case.find.{name}", "testcases", name)
          if not tc:
              call(f"case.create.{name}", "tm", "testcases", "create",
                   "--project-key", P, "--name", name)
              tc = by_name(f"case.refind.{name}", "testcases", name)
          if not tc:
              fail(f"could not create or find {name}")
          case_ids[name] = tc.get("Id")
          if not case_ids[name]:
              fail(f"{name} has no id")
      id_to_name = {v: k for k, v in case_ids.items()}

      # Sweep only EARLIER-DAY executions. Ad-hoc-set executions are invisible to
      # `executions list`, so enumerate the task's own logs and group by their
      # execution; delete an execution only when EVERY one of its logs was last
      # touched before today. A concurrent run's today-stamped execution (logs
      # updated today, or not yet finished) is spared.
      d = call("sweep.list", "tm", "testcaselog", "list", "--project-key", P,
               "--search", SEARCH, "--limit", "200")
      by_exec = {}
      for l in (d.get("Data") or []):
          eid = l.get("TestExecutionId")
          if not eid:
              continue
          by_exec.setdefault(eid, []).append((l.get("Updated") or "")[:10])
      stale = [eid for eid, days in by_exec.items()
               if days and all(x and x < today for x in days)]
      # `executions delete` ships with the executions PR, not this one, so sweep
      # only when it is present. Per-run STAMPED execution names make the sweep
      # optional: a missing verb leaves earlier runs' executions behind but they
      # never collide with this run.
      if has_verb("tm", "executions", "delete"):
          for eid in stale:
              call(f"sweep.del.{eid[:8]}", "tm", "executions", "delete",
                   "--execution-id", eid, "--project-key", P, "--yes")

      # Open the per-run STAMPED manual execution over the three cases. One call
      # opens one Pending log per case.
      run = call("run", "tm", "testcases", "run", "--project-key", P,
                 "--test-case-id", case_ids["EVFX-TCLOG-TC1"],
                 case_ids["EVFX-TCLOG-TC2"], case_ids["EVFX-TCLOG-TC3"],
                 "--name", runname, "--execution-type", "manual")
      eid = (run.get("Data") or {}).get("Id")
      if not eid:
          fail("could not open the stamped manual execution")

      # Settle it: TC1 and TC3 pass, TC2 fails. `finish` needs --result AND
      # --has-error AND --executed-by, and --executed-by is an EMAIL.
      logs = call("logs", "tm", "executions", "testcaselogs", "list",
                  "--execution-id", eid, "--project-key", P).get("Data") or []
      if len(logs) != len(CASES):
          fail(f"execution {eid} opened {len(logs)} logs, expected {len(CASES)}")
      for l in logs:
          name = id_to_name.get(l.get("TestCaseId"))
          failing = name == FAILING
          call(f"finish.{name}", "tm", "testcaselog", "finish", "--project-key", P,
               "--execution-id", eid, "--test-case-id", l.get("TestCaseId"),
               "--result", "Failed" if failing else "Passed",
               "--has-error", "true" if failing else "false",
               "--executed-by", "evfx-tclog-fixture@uipath.com")

      # Assert the shape the task reads on THIS execution: exactly one Failed,
      # and nothing overridden yet. A log that finished Passed, or one carrying a
      # previous override, would let the graded outcome pass for the wrong reason.
      d = call("verify", "tm", "executions", "testcaselogs", "list",
               "--execution-id", eid, "--project-key", P)
      rows = d.get("Data") or []
      if len(rows) != len(CASES):
          fail(f"expected {len(CASES)} logs, found {len(rows)}")
      failed = [r for r in rows if r.get("Result") == "Failed"]
      if len(failed) != 1:
          fail(f"expected exactly 1 Failed log, found {len(failed)}")
      for r in rows:
          if r.get("OriginalResult") not in (None, "", r.get("Result")):
              fail(f"log {r.get('Id')} starts already overridden: "
                   f"Result={r.get('Result')!r} "
                   f"OriginalResult={r.get('OriginalResult')!r}")

      print(f"FIXTURE: ready execution={eid!r} name={runname!r} "
            f"failing={FAILING!r} log={failed[0].get('Id')!r}", flush=True)
      EOF

initial_prompt: |
  Our regression test cases named "EVFX-TCLOG-TC1", "EVFX-TCLOG-TC2" and
  "EVFX-TCLOG-TC3" in the CLAIM project (Test Manager) just had a manual run,
  and one of them failed. We have traced that failure to a flaky test
  environment on our side, not a defect in the product, so the release
  dashboard should show that case as passing.

  Please correct that, noting the reason as "Environment flake - agent pool
  unavailable, not a product defect". I still need to be able to see what the
  run itself actually recorded for that case, so do not re-run or re-close
  anything.

  Tell me which test case it was and what the run had recorded for it. No need
  to check back with me.

success_criteria:
  - type: command_executed
    description: "Agent checked login status with --output json (Critical Rule #1)"
    tool_name: "Bash"
    command_pattern: 'uip\s+login\s+status.*--output\s+json'
    min_count: 1
    weight: 1.0
    pass_threshold: 0

  - type: command_executed
    # Listing the project's logs by result, or narrowing a run's logs, are both
    # legitimate routes to the failing log. What is graded is that the log id
    # came from the CLI rather than from thin air.
    description: "Agent found the failing log through the CLI rather than inventing an id"
    command_pattern: 'uip\s+tm\s+(executions?\s+testcaselogs\s+list|testcaselog\s+(list|latest|get))\b'
    tool_name: "Bash"
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    # The graded outcome, per-run isolated. Presence of a non-empty --reason and
    # a --result: `--reason` is required and a create without it is refused, so
    # an agent that skipped the guide stops here. Re-finishing or re-running
    # emits no `override create` and fails this.
    # Accept create OR update: both set Result + a --reason through the override
    # surface and leave OriginalResult untouched. A model that corrects an
    # existing override (update, by --override-id) achieves the same outcome as
    # one that creates it, so grading only `create` wrongly fails a valid path.
    # Advisory (pass_threshold 0): the outcome is graded on stored state below,
    # which also covers a model that wraps the call in a python3 -c subprocess.
    description: "Agent used `testcaselog override create`/`update` with a --result and a non-empty --reason (advisory)"
    command_pattern: 'uip\s+tm\s+testcaselog\s+override\s+(create|update)\b(?=(?:(?!uip\s)[^&;|\r\n\\]|\\\r?\n|\\[^\r\n])*--result\s+\S)(?=(?:(?!uip\s)[^&;|\r\n\\]|\\\r?\n|\\[^\r\n])*--reason\s+\S)'
    tool_name: "Bash"
    min_count: 1
    weight: 1.0
    pass_threshold: 0

  # PRIMARY, model-agnostic grade: an override leaves Result Passed on a log
  # whose OriginalResult is still Failed. Graded on stored Test Manager state,
  # so it holds however the agent invoked the CLI (create or update, direct or
  # wrapped in a python3 -c subprocess). Any-match keeps it safe under
  # concurrent per-model runs; the advisory command check above still
  # differentiates per model in the weighted score.
  - type: run_command
    description: "At least one EVFX-TCLOG log reports Passed while OriginalResult still reads Failed"
    command: |
      python3 -c "
      import json, subprocess

      def uip(*a):
          r = subprocess.run(['uip', *a, '--output', 'json'],
                             capture_output=True, text=True)
          t = r.stdout or ''
          return json.loads(t[t.index('{'):]) if '{' in t else {}

      logs = uip('tm','testcaselog','list','--project-key','CLAIM',
                 '--search','EVFX-TCLOG-TC','--limit','200').get('Data') or []
      corrected = [l for l in logs
                   if l.get('Result') == 'Passed' and l.get('OriginalResult') == 'Failed']
      assert corrected, (
          'no EVFX-TCLOG log reports Passed over an OriginalResult of Failed; '
          f'results={[(l.get(\"Result\"), l.get(\"OriginalResult\")) for l in logs]}')
      "
    timeout: 150
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: command_not_executed
    # Re-closing the log would move Result AND OriginalResult together, losing
    # exactly what the prompt asked to keep.
    description: "Agent did not re-close the log, which would overwrite what the run recorded"
    command_pattern: 'uip\s+tm\s+testcaselog\s+finish\b'
    tool_name: "Bash"
    max_count: 0
    weight: 1.5
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent did not re-run the cases or the run instead of correcting the record"
    command_pattern: 'uip\s+tm\s+(testsets?\s+run|testcases?\s+run|executions?\s+(run|retry))\b'
    tool_name: "Bash"
    max_count: 0
    weight: 1.5
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent did not reach past the CLI to the test case log REST route"
    command_pattern: '(?i)(curl|wget)(?:(?!uip\s)[^&;|\r\n\\]|\\\r?\n|\\[^\r\n])*testcaselogs?\b'
    tool_name: "Bash"
    max_count: 0
    weight: 1.0
    pass_threshold: 1.0
