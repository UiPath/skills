task_id: skill-test-requirement-ai-obsolete-delete-smoke
description: >
  Smoke test: agent uses the uipath-test skill to have Test Manager's AI flag
  obsolete test cases on a requirement and deletes ONLY the one ranked
  first, with the user's go-ahead given up front. Asserts from
  references/requirement-ai-guide.md: the delete goes through
  `find-obsolete-testcases --delete --yes --select 1` (rules 4 and 8), on
  one search job (rule 1), not through a hand-rolled `testcases delete`
  that skips the CLI's linked-test-case check (rule 10). Graded on tenant
  state: exactly one of the four seeded test cases is gone. EVFX-AIDEL-TC3
  and TC4 are planted off-topic so the AI has something to flag. The task
  owns the EVFX-AIDEL-* namespace; pre_run recreates the deleted test case
  and relinks all four every run. Spends one AI job per run.
tags: [uipath-test, smoke, mode:operate, lifecycle:setup, feature:test-case]

run_limits:
  expected_turns: 12
  max_turns: 40
  turn_timeout: 1500
  task_timeout: 1800

sandbox:
  template_sources:
    - type: template_dir
      path: _setup
      mount_point: _setup

reference:
  directory: _setup

pre_run:
  - command: >-
      python3 _setup/req_ai_fixture.py seed --project HEALTH
      --requirement EVFX-AIDEL-REQ
      --description "A nurse records a patient's vital signs: temperature, pulse and blood pressure. Values outside the normal range are highlighted in red. A record can be corrected within 24 hours and keeps the previous value in its history."
      --case "EVFX-AIDEL-TC1 Record vital signs=Enter temperature, pulse and blood pressure for a patient and save the record."
      --case "EVFX-AIDEL-TC2 Out-of-range value is highlighted=Enter a pulse of 150 and check that it is shown in red."
      --case "EVFX-AIDEL-TC3 Print shipping label=Open an order, print its shipping label and check the address block."
      --case "EVFX-AIDEL-TC4 Export monthly invoice as PDF=Open the billing page, pick last month and download the invoice as a PDF file."
    timeout: 280

initial_prompt: |
  In project HEALTH, have Test Manager's AI find obsolete test cases among
  those linked to requirement EVFX-AIDEL-REQ. Delete only the one it ranks
  first (its #1) and leave any others for me to review. You have my go-ahead
  for that one delete, no need to ask again.

success_criteria:
  - type: command_executed
    description: "Agent checked login status before touching Test Manager (Critical Rule #1)"
    tool_name: "Bash"
    command_pattern: 'uip\s+login\s+status'
    min_count: 1
    weight: 1.0
    pass_threshold: 0   # advisory

  - type: command_executed
    description: "Delete through the guarded path: `find-obsolete-testcases --delete --yes --select 1`"
    tool_name: "Bash"
    command_pattern: 'uip\s+tm\s+requirements?\s+find-obsolete-testcases(?=(?:(?!\n|&&|\|\||;|\||\s(?:uip|\$UIP)\s).)*--delete\b)(?=(?:(?!\n|&&|\|\||;|\||\s(?:uip|\$UIP)\s).)*(?:--yes|-y)\b)(?=(?:(?!\n|&&|\|\||;|\||\s(?:uip|\$UIP)\s).)*--select\s+["\x27]?1(?![\s"\x27]*\d))'
    min_count: 1
    weight: 2.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "No second search job (rule 1)"
    tool_name: "Bash"
    command_pattern: 'uip\s+tm\s+requirements?\s+find-obsolete-testcases(?!(?:(?!\n|&&|\|\||;|\||\s(?:uip|\$UIP)\s).)*--(?:activity-id|help))(?=(?:(?!\n|&&|\|\||;|\||\s(?:uip|\$UIP)\s).)*--requirement-(?:id|key)\s+\S)'
    max_count: 1
    weight: 2.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "No delete outside the guarded path (`testcases delete` skips the linked-test-case check, rule 10)"
    tool_name: "Bash"
    command_pattern: 'uip\s+tm\s+testcases?\s+delete\b'
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "Outcome: exactly one of the four EVFX-AIDEL test cases was deleted"
    command: "python3 $REFERENCE_DIR/req_ai_fixture.py check --project HEALTH --requirement EVFX-AIDEL-REQ --exist-count EVFX-AIDEL-TC=3"
    timeout: 120
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
