# Tenant prerequisites (documented in references/playwright-first-mile-guide.md):
#   - Test Manager with the Playwright feature flag enabled
#   - a folder the runner user is a member of, with a Cloud Robots - Serverless
#     machine assigned (the task lets the agent discover/provision this)
#   - @uipath/cli new enough to carry tm pack --type playwright (UiPath/cli#3226)
# Must-pass once the CLI is published and the e2e tenant has the serverless
# Playwright runtime; until then this documents the target bar. (path-to-ga
# tag deliberately omitted pending an allowlisted approver — see PR notes.)
task_id: skill-test-playwright-first-mile-e2e
description: >
  Full Playwright first-mile e2e: agent uses the uipath-test skill to take a
  Playwright suite from source to executed results in Test Manager — pack,
  upload, wait for automatic ingestion (no link step), fill a test set by the
  ingestion-applied PW_* labels, probe the test set's Playwright context, run
  ONLY one Playwright project, and fetch the results. The skill — not the
  prompt — must teach the pipeline order, the unfiltered ingestion poll, the
  probe-then-branch discriminator, the hidden commands, and bounded waiting.
tags: [uipath-test, e2e, mode:operate, lifecycle:setup, feature:test-case]

max_iterations: 1
run_limits:
  expected_turns: 50
  max_turns: 49
  turn_timeout: 1200

initial_prompt: |
  Create a minimal Playwright test suite in ./pw-suite with two passing tests
  (plain assertions, no browser interactions) whose playwright config defines
  the projects "chromium" and "firefox". Then get it executed through UiPath
  Test Manager on this tenant, running ONLY the "chromium" Playwright project,
  and report the final per-test results. Use the Test Manager project with key
  PWE2E, creating it if it does not exist. The task is not complete until you
  have fetched the execution's results (or have diagnosed precisely why the
  tenant cannot run it, per the skill's triage guidance).
  Do NOT ask for approval, confirmation, or feedback.
  Do NOT pause between planning and implementation.
  Before starting, load the uipath-test skill and follow its workflow.

success_criteria:
  - type: command_executed
    description: "Agent packed with tm pack --type playwright targeting the TM project"
    tool_name: "Bash"
    command_pattern: 'uip\s+tm\s+pack\s+.*--type\s+playwright.*--project-key|uip\s+tm\s+pack\s+.*--project-key.*--type\s+playwright'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent uploaded the package to Orchestrator"
    tool_name: "Bash"
    command_pattern: 'uip\s+(or|orchestrator)\s+packages\s+upload'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent polled for automatic ingestion with an unfiltered test case list (guide Step 3)"
    tool_name: "Bash"
    command_pattern: 'uip\s+tm\s+testcases?\s+list\s+--project-key\s+PWE2E(?!.*--filter)'
    min_count: 1
    weight: 2.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent filled the test set by label (not by hand-collected keys)"
    tool_name: "Bash"
    command_pattern: 'uip\s+tm\s+testcases?\s+add\s+.*--labels'
    min_count: 1
    weight: 2.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent probed the Playwright context before running (hidden command)"
    tool_name: "Bash"
    command_pattern: 'uip\s+tm\s+testsets?\s+playwright-context'
    min_count: 1
    weight: 2.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent ran the test set scoped to the chromium project (hidden flag)"
    tool_name: "Bash"
    command_pattern: 'uip\s+tm\s+testsets?\s+run\s+.*--playwright-projects\s+chromium'
    min_count: 1
    weight: 3.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent fetched results (report/testcaselogs/stats) rather than stopping at run"
    tool_name: "Bash"
    command_pattern: 'uip\s+tm\s+(report\s+get|executions\s+(testcaselogs\s+list|get-stats))'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "E2E outcome: latest PWE2E execution reached a terminal state with results (Passed on a capable tenant)"
    command: "uip tm executions list --project-key PWE2E --output json 2>/dev/null | grep -qE '\"Status\": \"(Finished|Passed)\"'"
    timeout: 120
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent did not link-automation the ingested Playwright test cases (anti-pattern)"
    tool_name: "Bash"
    command_pattern: 'uip\s+tm\s+testcases?\s+link-automation'
    weight: 1.0
    pass_threshold: 1.0
