# Needs `uip tm run --type package` (UiPath/cli#4845, in `@uipath/cli@dev` and
# every release after it), the package and robot described in
# fixtures/README.md.
task_id: skill-test-run-package-failing-smoke
description: >
  Smoke test: agent runs every test in an uploaded package with
  `uip tm run --type package` and the run reports a failing test. The package
  is the cross-platform `FailingTestCase_CrossPlatform_VB_Tests` (one test
  that always fails), run by the folder's serverless robot. The skill teaches
  (Rule 10(c)) that exit 1 with `RunPackageTestsFailed` is a test result to
  report, not a CLI error to retry. pre_run checks the package is there,
  seeds a throwaway `EVFX-RUNPKGFAIL-*` project per run, and post_run deletes
  it. Graded on the JUnit report on disk and on the tenant: the report's
  execution id must be a Finished execution in the seeded project, the report
  must record the failed test (as `<failure>` or `<error>`), and the project must hold exactly one execution,
  so an agent that re-runs the command after exit 1 fails.
tags: [uipath-test, smoke, mode:operate, lifecycle:setup, feature:test-case, outcome-graded]

run_limits:
  expected_turns: 8
  max_turns: 25
  turn_timeout: 1200

pre_run:
  - command: |
      python3 - <<'PYEOF'
      import datetime, json, secrets, subprocess, sys
      PREFIX = "EVFX-RUNPKGFAIL-"
      now = datetime.datetime.now(datetime.timezone.utc)

      def call(*a):
          r = subprocess.run(["uip", *a, "--output", "json"],
                             capture_output=True, text=True)
          try:
              return json.loads(r.stdout[r.stdout.index("{"):])
          except Exception:
              return {}

      # The package is a one-time tenant fixture (see fixtures/README.md). If it
      # is gone, fail loudly instead of scoring the agent on a run that cannot
      # start.
      pkg = call("or", "packages", "versions", "FailingTestCase_CrossPlatform_VB_Tests",
                 "--folder-path", "uipath-test-folder-feed")
      if not pkg.get("Data"):
          print(f"FIXTURE: PROVISIONING FAILED - FailingTestCase_CrossPlatform_VB_Tests not in uipath-test-folder-feed: {pkg}")
          sys.exit(1)

      # Orphan sweep: a run that died before post_run strands its project.
      # Only delete projects stamped more than 6 hours ago, so a concurrent
      # run keeps its own.
      for p in call("tm", "project", "list", "--filter", PREFIX).get("Data") or []:
          name = p.get("Name") or ""
          key = p.get("ProjectKey")
          if not key or not name.startswith(PREFIX):
              continue
          try:
              stamp = datetime.datetime.strptime(name[len(PREFIX):len(PREFIX) + 15], "%Y%m%d-%H%M%S")
          except ValueError:
              continue
          if now - stamp.replace(tzinfo=datetime.timezone.utc) > datetime.timedelta(hours=6):
              call("tm", "project", "delete", "--project-key", key, "--yes")

      key = "EVRF" + secrets.token_hex(2).upper()
      name = f"{PREFIX}{now.strftime('%Y%m%d-%H%M%S')}-{secrets.token_hex(3)}"
      out = call("tm", "project", "create", "--name", name, "--project-key", key)
      if out.get("Result") != "Success":
          print(f"SEED FAILED: could not create {name} ({key}): {out}")
          sys.exit(1)
      with open("project-key.txt", "w") as f:
          f.write(key + "\n")
      print(f"SEEDED project {name} with key {key}")
      PYEOF
    timeout: 180

post_run:
  - command: |
      [ -f project-key.txt ] && uip tm project delete \
        --project-key "$(cat project-key.txt)" --yes --output json || true
    timeout: 120

initial_prompt: |
  CI just uploaded the test package "FailingTestCase_CrossPlatform_VB_Tests"
  to the Orchestrator folder "uipath-test-folder-feed". Run all of its tests
  in my Test Manager project (its key is in project-key.txt in this folder)
  and write the JUnit report to results/junit.xml. This CI step is killed
  after 10 minutes. Tell me how the run went.

success_criteria:
  - type: command_executed
    description: "Agent checked login status (Critical Rule 1)"
    tool_name: "Bash"
    command_pattern: 'uip\s+login\s+status'
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0

  - type: command_executed
    description: "One complete `tm run --type package` command: package, folder, project, a --timeout within the 10-minute budget"
    tool_name: "Bash"
    command_pattern: '(?=(?:[^&;|\r\n\\]|\\\r?\n|\\.)*--type[\s=]+package\b)(?=(?:[^&;|\r\n\\]|\\\r?\n|\\.)*--package-name[\s=]+["\x27]?FailingTestCase_CrossPlatform_VB_Tests\b)(?=(?:[^&;|\r\n\\]|\\\r?\n|\\.)*--package-version[\s=]+\S)(?=(?:[^&;|\r\n\\]|\\\r?\n|\\.)*--folder-(?:path[\s=]+["\x27]?uipath-test-folder-feed|key[\s=]+\S))(?=(?:[^&;|\r\n\\]|\\\r?\n|\\.)*--project-(?:key|id)[\s=]+\S)(?=(?:[^&;|\r\n\\]|\\\r?\n|\\.)*--timeout[\s=]+["\x27]?(?:[1-9]\d?|[1-5]\d\d|600)\b)uip\s+tm\s+run\b'
    min_count: 1
    weight: 3.0
    pass_threshold: 1.0

  - type: file_contains
    description: "A JUnit report with a <testsuite> is at results/junit.xml"
    path: "results/junit.xml"
    includes:
      - "<testsuite "
      - "<testcase "
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "The report's execution id is a Finished execution in the seeded project, it records the failed test, and the agent did not re-run after exit 1 (exactly one execution)"
    command: |
      python3 - <<'PYEOF'
      import json, re, subprocess, sys
      key = open("project-key.txt").read().strip()
      xml = open("results/junit.xml").read()
      m = re.search(r'<testsuite\b[^>]*\bid="([0-9a-fA-F-]{36})"', xml)
      if not m:
          print("no <testsuite id> in results/junit.xml"); sys.exit(1)
      r = subprocess.run(["uip", "tm", "executions", "list", "--project-key", key,
                          "--output", "json"], capture_output=True, text=True)
      rows = json.loads(r.stdout[r.stdout.index("{"):]).get("Data") or []
      hit = [e for e in rows if (e.get("Id") or "").lower() == m.group(1).lower()]
      status = hit[0].get("Status") if hit else "not in project"
      cases = re.findall(r'<testcase\b(.*?)(?=<testcase\b|</testsuite>)', xml, re.S)
      failed = [c for c in cases if re.search(r'<(failure|error)\b', c)]
      skipped = [c for c in cases if re.search(r'<skipped\b', c)]
      # Exactly one execution: re-running after exit 1 would add another.
      print("report execution:", m.group(1), "->", status, "| executions in project:",
            len(rows), "| testcases:", len(cases), "failed:", len(failed), "skipped:", len(skipped))
      ok = status == "Finished" and len(rows) == 1 and failed and not skipped
      sys.exit(0 if ok else 1)
      PYEOF
    timeout: 60
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent did not hand-build the run with testsets create / testcases link-package"
    tool_name: "Bash"
    command_pattern: 'uip\s+tm\s+(testsets\s+create|testcases\s+link-package)'
    weight: 1.5
    pass_threshold: 1.0
