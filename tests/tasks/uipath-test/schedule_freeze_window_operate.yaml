task_id: skill-test-schedule-freeze-window-operate
description: >
  Operate test: a release freeze over one test set, exercising the schedule
  surface `uip tm schedules` — create, disable, delete and next-runs — which no
  other task covers together. The agent sets up three schedules and then treats
  them differently: one stays live (nightly), one is created and then PAUSED (not
  removed — wanted back after the freeze), one is created and then DELETED. The
  pause and the delete are deliberately different asks, so an agent that reaches
  for `delete` on the one meant to be paused fails the pause outcome, and one
  that disables the one meant to be removed fails the delete outcome.

  The cadence is the real difficulty. `--cron` takes six or seven fields
  starting with SECONDS (Quartz) and a five-field Unix guess carries no Quartz
  `?`; `--cron-details` is a required JSON object for every recurrence type.
  The prompt says "nightly at 02:00 UTC" and leaves the cron shape, the
  recurrence JSON, the wall-clock format and `--output json` to the skill.

  Concurrency: two model variants share the CLAIM project, so every schedule is
  per-run stamped and created by the agent itself (no pre-seeded fixed-name
  objects to collide on), and each outcome is graded on the agent's own emitted
  command — per-run isolated, accurate under concurrent runs.
tags: [uipath-test, integration, mode:operate, lifecycle:setup, feature:trigger]

run_limits:
  expected_turns: 20
  max_turns: 48
  turn_timeout: 1200
  task_timeout: 1800

pre_run:
  - timeout: 300
    command: |
      python3 - <<'EOF'
      import json, subprocess, sys, datetime
      P, SET = "CLAIM", "EVFX-SCHED-SET"
      CASES = ["EVFX-SCHED-TC1", "EVFX-SCHED-TC2"]
      PREFIX = "EVFX-SCHED-"
      today = datetime.datetime.now(datetime.timezone.utc).strftime("%Y%m%d")

      def fail(msg):
          print(f"FIXTURE: PROVISIONING FAILED - {msg}", flush=True)
          sys.exit(1)

      def call(label, *a):
          r = subprocess.run(["uip", *a, "--output", "json"],
                             capture_output=True, text=True)
          out, err = (r.stdout or "").strip(), (r.stderr or "").strip()
          print(f"FIXTURE[{label}] rc={r.returncode} out={out[:400]} err={err[:250]}",
                flush=True)
          try:
              return json.loads(out[out.index("{"):])
          except Exception:
              return {}

      def pick(d, *names):
          for n in names:
              if d.get(n):
                  return d[n]
          return None

      def by_name(label, kind, name):
          d = call(label, "tm", kind, "list", "--project-key", P, "--filter", name)
          for x in (d.get("Data") or []):
              if x.get("Name") == name:
                  return x
          return None

      def has_verb(*words):
          return subprocess.run(["uip", *words, "--help"],
                               capture_output=True, text=True).returncode == 0

      for words in (["tm", "schedules", "create"], ["tm", "schedules", "list"],
                    ["tm", "schedules", "next-runs"], ["tm", "schedules", "disable"],
                    ["tm", "schedules", "delete"]):
          if not has_verb(*words):
              fail(f"this CLI has no 'uip {' '.join(words)}' - needs the "
                   f"release carrying the test set schedule verbs")

      # Immutable source fixtures: test set + cases. Create if absent, never delete.
      ts = by_name("set.find", "testsets", SET)
      if not ts:
          call("set.create", "tm", "testsets", "create", "--project-key", P, "--name", SET)
          ts = by_name("set.refind", "testsets", SET)
      if not ts:
          fail(f"could not create or find {SET}")
      set_key = pick(ts, "TestSetKey", "Key", "ObjKey")
      set_id = ts.get("Id")
      if not set_key or not set_id:
          fail(f"{SET} has no key or id")

      keys = []
      for name in CASES:
          tc = by_name(f"case.find.{name}", "testcases", name)
          if not tc:
              call(f"case.create.{name}", "tm", "testcases", "create",
                   "--project-key", P, "--name", name)
              tc = by_name(f"case.refind.{name}", "testcases", name)
          if not tc:
              fail(f"could not create or find {name}")
          keys.append(pick(tc, "TestCaseKey", "Key", "ObjKey"))
      call("cases.assign", "tm", "testcases", "add", "--test-set-key", set_key,
           "--test-case-keys", ",".join(keys))

      # The agent creates all three schedules itself, each stamped with today's
      # date. Sweep only EARLIER-DAY EVFX-SCHED- schedules (the trailing dash
      # keeps this off the WK/LC/SMOKE sibling namespaces), sparing a concurrent variant
      # run's today-stamped schedules.
      d = call("sched.list", "tm", "schedules", "list", "--project-key", P, "--limit", "200")
      stale = [r["Id"] for r in (d.get("Data") or [])
               if str(r.get("Name", "")).startswith(PREFIX)
               and today not in str(r.get("Name", "")) and r.get("Id")]
      if stale:
          call("sched.clear", "tm", "schedules", "delete", "--project-key", P,
               "--schedule-ids", *stale, "--yes")
      print(f"FIXTURE: ready set_key={set_key!r} set_id={set_id!r} swept={len(stale)}", flush=True)
      EOF

initial_prompt: |
  We are going into a release freeze on the "EVFX-SCHED-SET" test set in the
  CLAIM project (Test Manager). Set up three schedules for me. Name each one
  "EVFX-SCHED-<STAMP>-<ROLE>", where <STAMP> is the current UTC date and time as
  YYYYMMDD-HHMMSS plus 6 random lowercase hex characters you generate once for
  this session (another session may run at the same moment, so the random part
  keeps the names yours), and <ROLE> is NIGHTLY, KEEP or TEMP as below:

  1. "...-NIGHTLY": runs that test set nightly at 02:00 UTC, starting a week
     from today. Leave it live.
  2. "...-KEEP": same test set — create it, then pause it. Do not delete it; we
     want it back after the freeze.
  3. "...-TEMP": same test set — create it, then delete it. You have my approval
     to delete that one.

  Then tell me when the NIGHTLY schedule is due to fire next. No need to check
  back with me.

success_criteria:
  - type: command_executed
    description: "Agent checked login status with --output json (Critical Rule #1)"
    tool_name: "Bash"
    command_pattern: 'uip\s+login\s+status.*--output\s+json'
    min_count: 1
    weight: 1.0
    pass_threshold: 0

  - type: command_executed
    # What is graded is that both flags were passed at all: `--cron-details` is
    # the one an agent who skipped the guide leaves off, and omitting it is a
    # 500. Field count / shape is graded by the Quartz `?` criterion below.
    description: "Agent passed both --cron and --cron-details to schedules create"
    command_pattern: 'uip\s+tm\s+schedules\s+create\b(?=(?:(?!uip\s)[^&;|\r\n\\]|\\\r?\n|\\[^\r\n])*--cron\s)(?=(?:(?!uip\s)[^&;|\r\n\\]|\\\r?\n|\\[^\r\n])*--cron-details\s)'
    tool_name: "Bash"
    min_count: 1
    weight: 2.0
    pass_threshold: 1.0

  - type: command_executed
    # Quartz shape, not five-field Unix: a 6/7-field Quartz cron carries a `?`
    # in exactly one of day-of-month / day-of-week; a five-field Unix guess
    # never does.
    description: "Agent used a Quartz cron (contains `?`), not a five-field Unix guess"
    command_pattern: 'uip\s+tm\s+schedules\s+create\b(?=(?:(?!uip\s)[^&;|\r\n\\]|\\\r?\n|\\[^\r\n])*--cron\s)(?=(?:(?!uip\s)[^&;|\r\n\\]|\\\r?\n|\\[^\r\n])*\?)'
    tool_name: "Bash"
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    # The pause: an agent that deletes the KEEP schedule instead of disabling it
    # emits no disable and fails here. Per-run isolated.
    description: "Agent PAUSED a schedule with disable (not delete)"
    command_pattern: 'uip\s+tm\s+schedules\s+disable\b(?=(?:(?!uip\s)[^&;|\r\n\\]|\\\r?\n|\\[^\r\n])*--schedule-ids\s+\S)'
    tool_name: "Bash"
    min_count: 1
    weight: 2.5
    pass_threshold: 1.0

  - type: command_executed
    # The removal: distinct from the pause. An agent that disables the TEMP
    # schedule instead of deleting it emits no delete and fails here.
    description: "Agent DELETED a schedule with delete --yes (distinct from the pause)"
    command_pattern: 'uip\s+tm\s+schedules\s+delete\b(?=(?:(?!uip\s)[^&;|\r\n\\]|\\\r?\n|\\[^\r\n])*--schedule-ids\s+\S)(?=(?:(?!uip\s)[^&;|\r\n\\]|\\\r?\n|\\[^\r\n])*--yes\b)'
    tool_name: "Bash"
    min_count: 1
    weight: 2.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent asked the CLI when the nightly schedule fires next"
    command_pattern: 'uip\s+tm\s+schedules\s+next-runs\b(?=(?:(?!uip\s)[^&;|\r\n\\]|\\\r?\n|\\[^\r\n])*--schedule-ids\s+\S)'
    tool_name: "Bash"
    min_count: 1
    weight: 2.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent did not reach past the CLI to the schedule REST route"
    command_pattern: '(?i)(curl|wget)(?:(?!uip\s)[^&;|\r\n\\]|\\\r?\n|\\[^\r\n])*testsetschedules?\b'
    tool_name: "Bash"
    max_count: 0
    weight: 1.0
    pass_threshold: 1.0
