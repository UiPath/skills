task_id: skill-test-requirement-ai-generate-async-create-smoke
description: >
  Smoke test: agent uses the uipath-test skill to start Test Manager's AI
  test case generation WITHOUT waiting, hands back the job id, follows the
  job by its --activity-id, and creates every proposed test case from that
  job. Asserts the asynchronous half of references/requirement-ai-guide.md:
  a start with neither --wait nor --create returns the ActivityId, the
  follow-up and the create run on --activity-id (no second generation, rule
  1), and the create is not run twice on one job (rule 9). Graded on tenant
  state: the requirement ends with at least one linked test case, every one
  labelled autopilot-generated, and no title twice. The task owns the
  EVFX-AIASYNC-* namespace; pre_run resets the requirement and deletes what
  an earlier run created. Spends one AI job per run.
tags: [uipath-test, smoke, mode:operate, lifecycle:setup, feature:test-case]

run_limits:
  expected_turns: 12
  max_turns: 40
  turn_timeout: 1500
  task_timeout: 1800

sandbox:
  template_sources:
    - type: template_dir
      path: _setup
      mount_point: _setup

reference:
  directory: _setup

pre_run:
  - command: >-
      python3 _setup/req_ai_fixture.py seed --project HEALTH
      --requirement EVFX-AIASYNC-REQ
      --description "A patient can book a clinic appointment online. Only free slots in the next 60 days are offered. A patient can hold at most two future appointments. Booking sends a confirmation email, and cancelling less than 24 hours before the slot is not allowed."
    timeout: 280

initial_prompt: |
  Start Test Manager's AI test case generation for requirement
  EVFX-AIASYNC-REQ in project HEALTH, but don't sit and wait on it: give me
  the job id as soon as it's running. Then check on that job, and once it
  has finished, create all the test cases it proposed, linked to the
  requirement.

success_criteria:
  - type: command_executed
    description: "Agent checked login status before touching Test Manager (Critical Rule #1)"
    tool_name: "Bash"
    command_pattern: 'uip\s+login\s+status'
    min_count: 1
    weight: 1.0
    pass_threshold: 0   # advisory

  - type: command_executed
    description: "Asynchronous start: `generate-testcases --requirement-id|--requirement-key` with neither --wait nor --create"
    tool_name: "Bash"
    command_pattern: 'uip\s+tm\s+requirements?\s+generate-testcases(?!(?:(?!\n|&&|\|\||;|\||\s(?:uip|\$UIP)\s).)*--(?:activity-id|help|wait\b|create\b))(?=(?:(?!\n|&&|\|\||;|\||\s(?:uip|\$UIP)\s).)*--requirement-(?:id|key)\s+\S)'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent followed the job by its id at least once before creating (`generate-testcases --activity-id <id>` without --create)"
    tool_name: "Bash"
    command_pattern: 'uip\s+tm\s+requirements?\s+generate-testcases(?=(?:(?!\n|&&|\|\||;|\||\s(?:uip|\$UIP)\s).)*--activity-id\s+\S)(?!(?:(?!\n|&&|\|\||;|\||\s(?:uip|\$UIP)\s).)*--create\b)'
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent created all proposed test cases from that job: `generate-testcases --activity-id <id> --create` (no --select)"
    tool_name: "Bash"
    command_pattern: 'uip\s+tm\s+requirements?\s+generate-testcases(?=(?:(?!\n|&&|\|\||;|\||\s(?:uip|\$UIP)\s).)*--activity-id\s+\S)(?=(?:(?!\n|&&|\|\||;|\||\s(?:uip|\$UIP)\s).)*--create\b)(?!(?:(?!\n|&&|\|\||;|\||\s(?:uip|\$UIP)\s).)*--select\b)'
    min_count: 1
    weight: 2.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "No second generation job for the same request (rule 1)"
    tool_name: "Bash"
    command_pattern: 'uip\s+tm\s+requirements?\s+generate-testcases(?!(?:(?!\n|&&|\|\||;|\||\s(?:uip|\$UIP)\s).)*--(?:activity-id|help))(?=(?:(?!\n|&&|\|\||;|\||\s(?:uip|\$UIP)\s).)*--requirement-(?:id|key)\s+\S)'
    max_count: 1
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "Outcome: EVFX-AIASYNC-REQ has AI-created linked test cases and no duplicates (--create ran once on the job)"
    command: "python3 $REFERENCE_DIR/req_ai_fixture.py check --project HEALTH --requirement EVFX-AIASYNC-REQ --min-links 1 --links-ai-created --no-duplicate-titles"
    timeout: 120
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
