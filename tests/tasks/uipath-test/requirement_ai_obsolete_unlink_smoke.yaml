task_id: skill-test-requirement-ai-obsolete-unlink-smoke
description: >
  Smoke test: agent uses the uipath-test skill to have Test Manager's AI flag
  obsolete test cases among the three linked to a requirement, shows the
  flagged list, then takes the flagged ones off the requirement while
  keeping them. Asserts from references/requirement-ai-guide.md: the search
  runs once and is shown before acting (rule 4), the unlink runs on the
  search's --activity-id (rule 1), and nothing is deleted (`--unlink`, never
  `--delete` or `testcases delete`; rule 8). Graded on tenant state: all
  three test cases still exist and at least one is no longer linked.
  EVFX-AIOBS-TC3 is planted off-topic (invoice export on a password-reset
  requirement) so the AI has something to flag; which ones it flags is
  otherwise not asserted. The task owns the EVFX-AIOBS-* namespace; pre_run
  recreates and relinks all three every run. Spends one AI job per run.
tags: [uipath-test, smoke, mode:operate, lifecycle:setup, feature:test-case]

run_limits:
  expected_turns: 12
  max_turns: 40
  turn_timeout: 1500
  task_timeout: 1800

sandbox:
  template_sources:
    - type: template_dir
      path: _setup
      mount_point: _setup

reference:
  directory: _setup

pre_run:
  - command: >-
      python3 _setup/req_ai_fixture.py seed --project HEALTH
      --requirement EVFX-AIOBS-REQ
      --description "A user who forgot their password can reset it from the sign-in page. Test Manager emails a reset link that expires after 30 minutes and works once. The new password must differ from the last three passwords."
      --case "EVFX-AIOBS-TC1 Reset password via emailed link=Request a reset from the sign-in page, open the emailed link and set a new password."
      --case "EVFX-AIOBS-TC2 Reset link expires after 30 minutes=Open a reset link 31 minutes after it was sent and check that it is refused."
      --case "EVFX-AIOBS-TC3 Export monthly invoice as PDF=Open the billing page, pick last month and download the invoice as a PDF file."
    timeout: 280

initial_prompt: |
  Requirement EVFX-AIOBS-REQ in project HEALTH changed recently. Have Test
  Manager's AI check which of its linked test cases look obsolete and show me
  what it flags. Then take the flagged ones off the requirement. Don't
  delete them; we may reuse them elsewhere.

success_criteria:
  - type: command_executed
    description: "Agent checked login status before touching Test Manager (Critical Rule #1)"
    tool_name: "Bash"
    command_pattern: 'uip\s+login\s+status'
    min_count: 1
    weight: 1.0
    pass_threshold: 0   # advisory

  - type: command_executed
    description: "Agent ran the search on its own first, without acting (`find-obsolete-testcases --requirement-id|--requirement-key`, no --unlink/--delete)"
    tool_name: "Bash"
    command_pattern: 'uip\s+tm\s+requirements?\s+find-obsolete-testcases(?!(?:(?!\n|&&|\|\||;|\||\s(?:uip|\$UIP)\s).)*--(?:activity-id|help|unlink\b|delete\b))(?=(?:(?!\n|&&|\|\||;|\||\s(?:uip|\$UIP)\s).)*--requirement-(?:id|key)\s+\S)'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent unlinked from the same search: `find-obsolete-testcases --activity-id <id> --unlink`"
    tool_name: "Bash"
    command_pattern: 'uip\s+tm\s+requirements?\s+find-obsolete-testcases(?=(?:(?!\n|&&|\|\||;|\||\s(?:uip|\$UIP)\s).)*--activity-id\s+\S)(?=(?:(?!\n|&&|\|\||;|\||\s(?:uip|\$UIP)\s).)*--unlink\b)'
    min_count: 1
    weight: 2.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "No second search job (rule 1)"
    tool_name: "Bash"
    command_pattern: 'uip\s+tm\s+requirements?\s+find-obsolete-testcases(?!(?:(?!\n|&&|\|\||;|\||\s(?:uip|\$UIP)\s).)*--(?:activity-id|help))(?=(?:(?!\n|&&|\|\||;|\||\s(?:uip|\$UIP)\s).)*--requirement-(?:id|key)\s+\S)'
    max_count: 1
    weight: 2.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Nothing deleted: no `find-obsolete-testcases --delete` and no `testcases delete` (rule 8)"
    tool_name: "Bash"
    command_pattern: 'uip\s+tm\s+(?:requirements?\s+find-obsolete-testcases(?=(?:(?!\n|&&|\|\||;|\||\s(?:uip|\$UIP)\s).)*--delete\b)|testcases?\s+delete\b)'
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "Outcome: all three EVFX-AIOBS test cases still exist"
    command: "python3 $REFERENCE_DIR/req_ai_fixture.py check --project HEALTH --requirement EVFX-AIOBS-REQ --exist-count EVFX-AIOBS-TC=3"
    timeout: 120
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "Outcome: at least one flagged test case was taken off the requirement (at most 2 of 3 still linked)"
    command: "python3 $REFERENCE_DIR/req_ai_fixture.py check --project HEALTH --requirement EVFX-AIOBS-REQ --max-links 2"
    timeout: 120
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0
