task_id: skill-test-organize-testcases-into-testsets
description: >
  Integration test: agent uses the uipath-test skill to organise testcases into
  logical test sets for a named feature. Asserts that the agent (a) checks
  login status with --output json, (b) lists
  testcases with --project-key + --filter , and
  (c) creates at least one test set with --project-key + --output json.
  The skill — not the prompt — must teach the --filter narrowing rule and
  the testcases add command for assigning testcases to a set.
  Deliberate trap: "disbursement" is mid-name (CLAIM:19/CLAIM:20 are
  "Claim Payout - … Disbursement") and `--filter` is a PREFIX match, so
  the filtered call returns zero — the skill must teach the prefix-retry
  fallback (broader prefix, then unfiltered re-list) instead of stopping.
tags: [uipath-test, integration, mode:operate, lifecycle:manage, feature:test-set]

run_limits:
  expected_turns: 22
  max_turns: 35

initial_prompt: |
  I have a project called CLAIM. Organise testcases for the "disbursement"
  feature into logical test sets (e.g. happy path, edge cases, regression).
  List the testcases filtered by "disbursement", group them, and create the
  test sets in Test Manager — name each one starting with "Disbursement -"
  (e.g. "Disbursement - Happy Path") with appropriate descriptions. Earlier
  test runs may have left similarly named sets behind — ignore those and
  create fresh ones; don't stop to ask about them.

# Safety net: sweep ALL "Disbursement"-prefixed test sets (this run's and any
# stragglers from prior runs) so the shared CLAIM project never re-accumulates
# duplicates — 165 had piled up by 2026-07-27 and made agents stop to ask
# which set was canonical.
post_run:
  - command: |
      uip tm testsets list --project-key CLAIM --filter "Disbursement - " --output json 2>/dev/null \
        | python3 -c "import json,sys; s=sys.stdin.read(); d=json.loads(s[s.index('{'):]); print('\n'.join(t['TestSetKey'] for t in d.get('Data',[])))" \
        | while read -r key; do
            [ -n "$key" ] && uip tm testsets delete --test-set-key "$key" --yes --output json || true
          done
    timeout: 300

success_criteria:
  - type: command_executed
    description: "Agent checked login status (Critical Rules #1 + #2)"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+login\s+status'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent enumerated project testcases — `testcases list --project-key` with `--filter`, or unfiltered (the skill documents that a mid-name term returns zero on the prefix-only filter, so skipping straight to the re-list is valid)"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+tm\s+testcases?\s+list\s+.*(--filter|--project-key)'
    min_count: 1
    weight: 2.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent created a test set with --project-key"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+tm\s+testsets?\s+create\s+(?:[^&;|\r\n\\]|\\\r?\n|\\.)*--project-key|(uip|\$UIP)\s+tm\s+testsets?\s+create'
    min_count: 1
    weight: 2.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent added testcases to the new test set with --test-set-key + --test-case-keys"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+tm\s+testcases?\s+add\s+(?:[^&;|\r\n\\]|\\\r?\n|\\.)*--test-set-key(?:[^&;|\r\n\\]|\\\r?\n|\\.)*--test-case-keys|(uip|\$UIP)\s+tm\s+testsets?\s+add-testcases\s+(?:[^&;|\r\n\\]|\\\r?\n|\\.)*--test-set-key'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0
