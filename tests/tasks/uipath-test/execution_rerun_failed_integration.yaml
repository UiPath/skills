task_id: skill-test-execution-rerun-failed-integration
description: >
  Integration test: after a regression run finishes with failures, a QA
  engineer triages the result and re-runs only what failed — exercising the
  execution operate/diagnose verbs no existing task covers
  (`executions get-stats`, `executions retry`). The agent
  discovers the most recent finished execution for a test set in the existing
  CLAIM project (`executions list --test-set-id`), pulls its aggregated pass/
  fail statistics (`executions get-stats`), and retries only the failed test
  cases of that execution (`executions retry`). The flaky-analysis task only
  READS executions and assertions; this task drives the re-execution surface.
  The prompt carries no skill-load hint — the get-stats/retry verbs, the
  distinction between re-running an existing execution and starting a new one,
  and `--output json` are all left to the skill.
tags: [uipath-test, integration, mode:operate, lifecycle:setup, feature:test-case]

run_limits:
  expected_turns: 24
  max_turns: 55
  turn_timeout: 1200
  task_timeout: 1500

# Self-healing fixture: this task CONSUMES its own premise — retrying the
# failed cases reopens their logs, and whatever closes them (no robot serves
# this tenant) leaves the newest finished execution with zero failures, so the
# next run has nothing to retry (2026-08-03 nightly: newest run read P3/F0 and
# the agent correctly declined). Before each run, make sure the newest finished
# execution of the suite has at least one Failed case — flipping an existing
# log rather than seeding a new execution, so the shared suite's history depth
# stays stable for the flaky-analysis task.
pre_run:
  - command: |
      python3 - <<'EOF' || true
      import json, subprocess
      def uip(*a):
          r = subprocess.run(["uip", *a, "--output", "json"], capture_output=True, text=True)
          try:
              return json.loads(r.stdout[r.stdout.index("{"):])
          except Exception:
              return {}
      sets = uip("tm", "testsets", "list", "--project-key", "CLAIM", "--filter", "UAT Smoke Suite").get("Data", [])
      ts = next((t for t in sets if t.get("Name") == "UAT Smoke Suite"), None)
      if not ts:
          raise SystemExit(0)
      ex = [e for e in uip("tm", "executions", "list", "--project-key", "CLAIM",
                           "--test-set-id", ts["Id"]).get("Data", []) if e.get("Status") == "Finished"]
      if not ex:
          raise SystemExit(0)
      newest = max(ex, key=lambda e: e.get("Created", ""))
      if (newest.get("Failed") or 0) > 0:
          raise SystemExit(0)
      logs = uip("tm", "executions", "testcaselogs", "list", "--project-key", "CLAIM",
                 "--execution-id", newest["Id"]).get("Data", [])
      if not logs:
          raise SystemExit(0)
      target = logs[-1]
      subprocess.run(["uip", "tm", "testcaselog", "finish", "--project-key", "CLAIM",
                      "--execution-id", newest["Id"], "--test-case-id", target["TestCaseId"],
                      "--result", "Failed", "--has-error", "true",
                      "--executed-by", "eval-fixture@uipath.com", "--output", "json"],
                     capture_output=True, text=True)
      print(f"seeded failure on {newest['Id']} / {target.get('TestCase', {}).get('ObjKey')}")
      EOF
    timeout: 180

# The retry leaves an execution that can never complete on this robot-less
# tenant; close its logs so Pending/Running runs don't accumulate on the suite.
post_run:
  - command: |
      python3 - <<'EOF' || true
      import json, subprocess
      def uip(*a):
          r = subprocess.run(["uip", *a, "--output", "json"], capture_output=True, text=True)
          try:
              return json.loads(r.stdout[r.stdout.index("{"):])
          except Exception:
              return {}
      sets = uip("tm", "testsets", "list", "--project-key", "CLAIM", "--filter", "UAT Smoke Suite").get("Data", [])
      ts = next((t for t in sets if t.get("Name") == "UAT Smoke Suite"), None)
      if not ts:
          raise SystemExit(0)
      for e in uip("tm", "executions", "list", "--project-key", "CLAIM",
                   "--test-set-id", ts["Id"]).get("Data", []):
          if e.get("Status") not in ("Pending", "Running"):
              continue
          for l in uip("tm", "executions", "testcaselogs", "list", "--project-key", "CLAIM",
                       "--execution-id", e["Id"]).get("Data", []):
              if l.get("Result") in (None, "", "None"):
                  subprocess.run(["uip", "tm", "testcaselog", "finish", "--project-key", "CLAIM",
                                  "--execution-id", e["Id"], "--test-case-id", l["TestCaseId"],
                                  "--result", "Passed", "--has-error", "false",
                                  "--executed-by", "eval-fixture@uipath.com", "--output", "json"],
                                 capture_output=True, text=True)
      EOF
    timeout: 300

initial_prompt: |
  Our "UAT Smoke Suite" in the CLAIM project (Test Manager) had a regression run
  finish recently and a few cases failed. Can you pull up that latest finished
  run, show me the pass/fail breakdown, and then kick off a retry of just the
  failed cases so we can tell whether they were real failures or flakes? Don't
  start a fresh run of the whole suite — only retry what actually failed in that
  run. No need to check back with me.

success_criteria:
  - type: command_executed
    description: "Agent checked login status with --output json (Critical Rule #1)"
    tool_name: "Bash"
    command_pattern: 'uip\s+login\s+status.*--output\s+json'
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent pulled aggregated statistics for the execution (`executions get-stats --execution-id`)"
    tool_name: "Bash"
    command_pattern: '(?=[\s\S]*--execution-id\s+\S)(?=[\s\S]*--project-key\s+\S)(?=[\s\S]*--output\s+json)uip\s+tm\s+executions?\s+get-stats\b'
    min_count: 1
    weight: 2.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent retried only the failed cases of that execution (`executions retry --execution-id`)"
    tool_name: "Bash"
    command_pattern: '(?=[\s\S]*--execution-id\s+\S)(?=[\s\S]*--output\s+json)uip\s+tm\s+executions?\s+retry\b'
    min_count: 1
    weight: 3.0
    pass_threshold: 1.0
