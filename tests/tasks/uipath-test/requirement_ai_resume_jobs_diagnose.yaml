task_id: skill-test-requirement-ai-resume-jobs-diagnose
description: >
  Smoke test: agent uses the uipath-test skill to recover two Test Manager AI
  jobs a pipeline left behind. pre_run starts both for real and saves their
  CLI output in nightly/: a generate-testcases call whose 3 s wait timed out
  (exit 2, ErrorCode timeout, the job still running) and an evaluate call
  started without waiting. The agent must read the activity ids from those
  files and finish each job with the SAME verb and --activity-id (rules 1
  and 3 of references/requirement-ai-guide.md, Critical Rule 10(c)), never
  starting a new job. Graded on correctness, not just commands: the grader
  reads both jobs again by id and checks that the agent's titles files list
  exactly their results. The task owns the EVFX-AIRESUME-* namespace. Spends
  two AI jobs per run, both in pre_run.
tags: [uipath-test, smoke, mode:diagnose, lifecycle:discover, feature:test-case]

run_limits:
  expected_turns: 14
  max_turns: 40
  turn_timeout: 1500
  task_timeout: 1800

sandbox:
  template_sources:
    - type: template_dir
      path: _setup
      mount_point: _setup

reference:
  directory: _setup

pre_run:
  - command: >-
      python3 _setup/req_ai_fixture.py seed --project HEALTH
      --requirement EVFX-AIRESUME-REQ
      --description "A pharmacist can approve or reject a repeat prescription request. A request older than 14 days expires on its own. Rejecting needs a reason chosen from a fixed list. The patient is notified by email of every decision."
      --capture-generate-timeout nightly/generate-testcases.json
      --capture-evaluate-start nightly/evaluate.json
    timeout: 280

initial_prompt: |
  Last night our pipeline asked Test Manager's AI (project HEALTH) to
  propose test cases for requirement EVFX-AIRESUME-REQ and to evaluate that
  requirement. It saved each command's output in the nightly/ folder, but it
  looks like it gave up early. Get me both results: write the proposed test
  case titles to nightly/testcases.txt and the evaluation's suggestion titles
  to nightly/suggestions.txt, one title per line, and give me a short
  summary of each.

success_criteria:
  - type: command_executed
    description: "Agent resumed the timed-out generation job by id: `generate-testcases --project-key HEALTH --activity-id <uuid>`"
    tool_name: "Bash"
    command_pattern: 'uip\s+tm\s+requirements?\s+generate-testcases(?=(?:(?!\n|&&|\|\||;|\||\s(?:uip|\$UIP)\s).)*--activity-id\s+["\x27]?[0-9a-fA-F]{8}-)(?=(?:(?!\n|&&|\|\||;|\||\s(?:uip|\$UIP)\s).)*--project-(?:key\s+["\x27]?HEALTH\b|id\s+\S))'
    min_count: 1
    weight: 2.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent read the evaluation job by id with the evaluate verb: `evaluate --project-key HEALTH --activity-id <uuid>`"
    tool_name: "Bash"
    command_pattern: 'uip\s+tm\s+requirements?\s+evaluate(?=(?:(?!\n|&&|\|\||;|\||\s(?:uip|\$UIP)\s).)*--activity-id\s+["\x27]?[0-9a-fA-F]{8}-)(?=(?:(?!\n|&&|\|\||;|\||\s(?:uip|\$UIP)\s).)*--project-(?:key\s+["\x27]?HEALTH\b|id\s+\S))'
    min_count: 1
    weight: 2.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "No new generation job: a timeout is resumed, never restarted (rule 3)"
    tool_name: "Bash"
    command_pattern: 'uip\s+tm\s+requirements?\s+generate-testcases(?!(?:(?!\n|&&|\|\||;|\||\s(?:uip|\$UIP)\s).)*--(?:activity-id|help))(?=(?:(?!\n|&&|\|\||;|\||\s(?:uip|\$UIP)\s).)*--requirement-(?:id|key)\s+\S)'
    max_count: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "No new evaluation job: the started one is read by its id (rule 1)"
    tool_name: "Bash"
    command_pattern: 'uip\s+tm\s+requirements?\s+evaluate(?!(?:(?!\n|&&|\|\||;|\||\s(?:uip|\$UIP)\s).)*--(?:activity-id|help))(?=(?:(?!\n|&&|\|\||;|\||\s(?:uip|\$UIP)\s).)*--requirement-(?:id|key)\s+\S)'
    max_count: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "Outcome: nightly/testcases.txt lists the titles of the generation job named in nightly/generate-testcases.json"
    command: "python3 $REFERENCE_DIR/req_ai_fixture.py check-titles --project HEALTH --verb generate-testcases --capture nightly/generate-testcases.json --titles nightly/testcases.txt"
    timeout: 120
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "Outcome: nightly/suggestions.txt lists the suggestion titles of the evaluation job named in nightly/evaluate.json"
    command: "python3 $REFERENCE_DIR/req_ai_fixture.py check-titles --project HEALTH --verb evaluate --capture nightly/evaluate.json --titles nightly/suggestions.txt"
    timeout: 120
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
