task_id: skill-review-rpa-library-circular-dependency
description: >
  Dependency review. Acme.Core depends on Acme.Data and Acme.Data depends on
  Acme.Core, so neither can be built or published first. The report must name
  both libraries and flag the circular dependency.
tags: [uipath-review, integration, mode:diagnose, lifecycle:discover]

run_limits:
  turn_timeout: 1200
  task_timeout: 1500
  max_turns: 40

sandbox:
  template_sources:
    - type: template_dir
      path: fixture

reference:
  directory: ../..

initial_prompt: |
  Two UiPath library projects exist under `AcmeLibraries` in the current directory.
  Review it and produce a structured review report with Critical / Warning /
  Info findings.

  Use the `uipath-review` skill to perform this review.

  This is a read-only review. Do NOT modify, create, or delete any files
  inside `AcmeLibraries/`. Do NOT run the automation. Do NOT ask for approval,
  confirmation, or feedback.

  Produce the review in TWO places, identical content:
    1. As the chat output (the normal review surface), AND
    2. Saved to a file at `./_review_report.md` at the sandbox root
       (NOT inside `AcmeLibraries/`).

  Writing the file copy first, before the chat report, is encouraged — the
  file is the source of truth the test harness will check.

success_criteria:
  - type: skill_triggered
    description: "Agent invoked the uipath-review skill"
    skill_name: "uipath-review"
    expected_skill: "uipath-review"
    weight: 3.0

  - type: command_not_executed
    description: "Read-only contract: no Write inside AcmeLibraries/ (Critical Rule 1)"
    tool_name: "Write"
    command_pattern: '"file_path":\s*"[^"]*AcmeLibraries/'
    weight: 3.0

  - type: command_not_executed
    description: "Read-only contract: no Edit inside AcmeLibraries/ (Critical Rule 1)"
    tool_name: "Edit"
    command_pattern: '"file_path":\s*"[^"]*AcmeLibraries/'
    weight: 3.0

  - type: run_command
    description: "Report flags the circular dependency between Acme.Core and Acme.Data"
    command: >-
      python3 $REFERENCE_DIR/_shared/check_planted_defect.py
      --marker "AcmeLibraries/Acme.Core/project.json::Acme.Data"
      --marker "AcmeLibraries/Acme.Data/project.json::Acme.Core"
      --mention "Acme.Core"
      --mention "Acme.Data"
      --flag "circular|cyclic|cycle|depend on each other|depends on each other|mutual|each other|chicken-and-egg|chicken and egg|bidirectional"
    timeout: 30
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0
