task_id: skill-review-rpa-invoke-code-credential
description: >
  Security review. The service-account password is a string literal inside the
  C# of an Invoke Code activity (`new NetworkCredential("svc_vendor",
  "...")`). It has no `password=` shape, so a keyword grep misses it; the
  reviewer has to read the code. The report must flag the hardcoded
  credential.
tags: [uipath-review, integration, mode:diagnose, lifecycle:discover]

run_limits:
  turn_timeout: 1200
  task_timeout: 1500
  max_turns: 40

sandbox:
  template_sources:
    - type: template_dir
      path: fixture

reference:
  directory: ../..

initial_prompt: |
  A UiPath RPA project exists at `VendorSync` in the current directory.
  Review it and produce a structured review report with Critical / Warning /
  Info findings.

  Use the `uipath-review` skill to perform this review.

  This is a read-only review. Do NOT modify, create, or delete any files
  inside `VendorSync/`. Do NOT run the automation. Do NOT ask for approval,
  confirmation, or feedback.

  Produce the review in TWO places, identical content:
    1. As the chat output (the normal review surface), AND
    2. Saved to a file at `./_review_report.md` at the sandbox root
       (NOT inside `VendorSync/`).

  Writing the file copy first, before the chat report, is encouraged — the
  file is the source of truth the test harness will check.

success_criteria:
  - type: skill_triggered
    description: "Agent invoked the uipath-review skill"
    skill_name: "uipath-review"
    expected_skill: "uipath-review"
    weight: 3.0

  - type: command_not_executed
    description: "Read-only contract: no Write inside VendorSync/ (Critical Rule 1)"
    tool_name: "Write"
    command_pattern: '"file_path":\s*"[^"]*VendorSync/'
    weight: 3.0

  - type: command_not_executed
    description: "Read-only contract: no Edit inside VendorSync/ (Critical Rule 1)"
    tool_name: "Edit"
    command_pattern: '"file_path":\s*"[^"]*VendorSync/'
    weight: 3.0

  - type: run_command
    description: "Report flags the credential hardcoded inside the Invoke Code activity"
    command: >-
      python3 $REFERENCE_DIR/_shared/check_planted_defect.py
      --marker "VendorSync/Main.xaml::Vend0r_FAKE_2026_DoNotUse"
      --subject "Invoke Code|InvokeCode|NetworkCredential|svc_vendor|Download vendor list"
      --flag "hardcod|hard-cod|hard cod|plaintext|plain text|plain-text|cleartext|clear text|in clear|embedded|inline|literal|exposed|committed|checked in|baked in"
      --mention "password|credential|secret"
      --mention "invoke code|invokecode|networkcredential|svc_vendor"
    timeout: 30
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0
