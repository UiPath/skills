task_id: skill-review-api-workflow-inline-secret
description: >
  API workflow security review. The HTTP activity sends a bearer token literal
  in its `Authorization` header instead of reading an asset or using a
  connection. The report must flag the inline secret as Critical.
tags: [uipath-review, integration, mode:diagnose, lifecycle:discover]

run_limits:
  turn_timeout: 1200
  task_timeout: 1500
  max_turns: 40

sandbox:
  template_sources:
    - type: template_dir
      path: fixture

reference:
  directory: ../..

initial_prompt: |
  A UiPath API Workflow project exists at `PostToErp` in the current directory.
  Review it and produce a structured review report with Critical / Warning /
  Info findings.

  Use the `uipath-review` skill to perform this review.

  This is a read-only review. Do NOT modify, create, or delete any files
  inside `PostToErp/`. Do NOT run the automation. Do NOT ask for approval,
  confirmation, or feedback.

  Produce the review in TWO places, identical content:
    1. As the chat output (the normal review surface), AND
    2. Saved to a file at `./_review_report.md` at the sandbox root
       (NOT inside `PostToErp/`).

  Writing the file copy first, before the chat report, is encouraged — the
  file is the source of truth the test harness will check.

success_criteria:
  - type: skill_triggered
    description: "Agent invoked the uipath-review skill"
    skill_name: "uipath-review"
    expected_skill: "uipath-review"
    weight: 3.0

  - type: command_not_executed
    description: "Read-only contract: no Write inside PostToErp/ (Critical Rule 1)"
    tool_name: "Write"
    command_pattern: '"file_path":\s*"[^"]*PostToErp/'
    weight: 3.0

  - type: command_not_executed
    description: "Read-only contract: no Edit inside PostToErp/ (Critical Rule 1)"
    tool_name: "Edit"
    command_pattern: '"file_path":\s*"[^"]*PostToErp/'
    weight: 3.0

  - type: run_command
    description: "Report flags the bearer token inlined in Workflow.json as Critical"
    command: >-
      python3 $REFERENCE_DIR/_shared/check_planted_defect.py
      --marker "PostToErp/Workflow.json::erp_live_FAKE_4b7d19c0e2a6f853"
      --subject "Authorization|Bearer|Post_Invoice|POST invoice"
      --flag "hardcod|hard-cod|hard cod|plaintext|plain text|plain-text|cleartext|clear text|in clear|embedded|inline|literal|exposed|committed|checked in|baked in"
      --mention "token|bearer|secret|credential|api key|authorization"
      --severity "critical"
    timeout: 30
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0
