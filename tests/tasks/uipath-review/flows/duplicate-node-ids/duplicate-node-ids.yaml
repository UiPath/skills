task_id: skill-review-flows-duplicate-node-ids
description: >
  Flow structural review. Two nodes in `OrderEnrich.flow` ("Normalize order"
  and "Compute total") share the id `normalizeOrder1`, so edges and `$vars`
  references resolve ambiguously. The report must flag the duplicated node id.
tags: [uipath-review, integration, mode:diagnose, lifecycle:discover]

run_limits:
  turn_timeout: 1200
  task_timeout: 1500
  max_turns: 40

sandbox:
  template_sources:
    - type: template_dir
      path: fixture

reference:
  directory: ../..

initial_prompt: |
  A UiPath solution with a Maestro Flow project exists at `OrderEnrichSolution` in the current directory.
  Review it and produce a structured review report with Critical / Warning /
  Info findings.

  Use the `uipath-review` skill to perform this review.

  This is a read-only review. Do NOT modify, create, or delete any files
  inside `OrderEnrichSolution/`. Do NOT run the automation. Do NOT ask for approval,
  confirmation, or feedback.

  Produce the review in TWO places, identical content:
    1. As the chat output (the normal review surface), AND
    2. Saved to a file at `./_review_report.md` at the sandbox root
       (NOT inside `OrderEnrichSolution/`).

  Writing the file copy first, before the chat report, is encouraged — the
  file is the source of truth the test harness will check.

success_criteria:
  - type: skill_triggered
    description: "Agent invoked the uipath-review skill"
    skill_name: "uipath-review"
    expected_skill: "uipath-review"
    weight: 3.0

  - type: command_not_executed
    description: "Read-only contract: no Write inside OrderEnrichSolution/ (Critical Rule 1)"
    tool_name: "Write"
    command_pattern: '"file_path":\s*"[^"]*OrderEnrichSolution/'
    weight: 3.0

  - type: command_not_executed
    description: "Read-only contract: no Edit inside OrderEnrichSolution/ (Critical Rule 1)"
    tool_name: "Edit"
    command_pattern: '"file_path":\s*"[^"]*OrderEnrichSolution/'
    weight: 3.0

  - type: run_command
    description: "Report flags the duplicated node id normalizeOrder1"
    command: >-
      python3 $REFERENCE_DIR/_shared/check_planted_defect.py
      --marker "OrderEnrichSolution/OrderEnrich/OrderEnrich.flow::Compute total"
      --subject "normalizeOrder1"
      --flag "duplicate|duplicated|not unique|non-unique|same id|share|identical|collid|reused|appears twice|used twice|two nodes|ambiguous"
    timeout: 30
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0
