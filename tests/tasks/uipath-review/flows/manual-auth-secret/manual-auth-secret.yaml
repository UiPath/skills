task_id: skill-review-flows-manual-auth-secret
description: >
  Flow security review. The HTTP node calls a vendor API in manual
  authentication mode with a bearer token literal in its `Authorization`
  header: the flow owns the secret, outside Integration Service connections.
  The report must flag the hardcoded token as Critical.
tags: [uipath-review, integration, mode:diagnose, lifecycle:discover]

run_limits:
  turn_timeout: 1200
  task_timeout: 1500
  max_turns: 40

sandbox:
  template_sources:
    - type: template_dir
      path: fixture

reference:
  directory: ../..

initial_prompt: |
  A UiPath solution with a Maestro Flow project exists at `ShipmentStatusSolution` in the current directory.
  Review it and produce a structured review report with Critical / Warning /
  Info findings.

  Use the `uipath-review` skill to perform this review.

  This is a read-only review. Do NOT modify, create, or delete any files
  inside `ShipmentStatusSolution/`. Do NOT run the automation. Do NOT ask for approval,
  confirmation, or feedback.

  Produce the review in TWO places, identical content:
    1. As the chat output (the normal review surface), AND
    2. Saved to a file at `./_review_report.md` at the sandbox root
       (NOT inside `ShipmentStatusSolution/`).

  Writing the file copy first, before the chat report, is encouraged — the
  file is the source of truth the test harness will check.

success_criteria:
  - type: skill_triggered
    description: "Agent invoked the uipath-review skill"
    skill_name: "uipath-review"
    expected_skill: "uipath-review"
    weight: 3.0

  - type: command_not_executed
    description: "Read-only contract: no Write inside ShipmentStatusSolution/ (Critical Rule 1)"
    tool_name: "Write"
    command_pattern: '"file_path":\s*"[^"]*ShipmentStatusSolution/'
    weight: 3.0

  - type: command_not_executed
    description: "Read-only contract: no Edit inside ShipmentStatusSolution/ (Critical Rule 1)"
    tool_name: "Edit"
    command_pattern: '"file_path":\s*"[^"]*ShipmentStatusSolution/'
    weight: 3.0

  - type: run_command
    description: "Report flags the bearer token hardcoded in the HTTP node as Critical"
    command: >-
      python3 $REFERENCE_DIR/_shared/check_planted_defect.py
      --marker "ShipmentStatusSolution/ShipmentStatus/ShipmentStatus.flow::pw_live_FAKE_9f3c2a71d4e85b60"
      --flag "hardcod|hard-cod|hard cod|plaintext|plain text|plain-text|cleartext|clear text|in clear|embedded|inline|literal|exposed|committed|checked in|baked in|manual auth|manual mode|authentication: manual|owns the secret"
      --mention "token|bearer|secret|credential|api key|authorization"
      --mention "critical"
    timeout: 30
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0
