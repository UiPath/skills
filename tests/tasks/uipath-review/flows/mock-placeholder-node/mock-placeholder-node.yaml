task_id: skill-review-flows-mock-placeholder-node
description: >
  Flow production-readiness review. The flow validates, but its routing step
  is still a `core.logic.mock` placeholder node ("Route to team"), so the
  published flow does nothing at that step. The report must flag the mock
  placeholder.
tags: [uipath-review, integration, mode:diagnose, lifecycle:discover]

run_limits:
  turn_timeout: 1200
  task_timeout: 1500
  max_turns: 40

sandbox:
  template_sources:
    - type: template_dir
      path: fixture

reference:
  directory: ../..

initial_prompt: |
  A UiPath solution with a Maestro Flow project exists at `TicketTriageSolution` in the current directory. The team wants to publish it to production.
  Review it and produce a structured review report with Critical / Warning /
  Info findings.

  Use the `uipath-review` skill to perform this review.

  This is a read-only review. Do NOT modify, create, or delete any files
  inside `TicketTriageSolution/`. Do NOT run the automation. Do NOT ask for approval,
  confirmation, or feedback.

  Produce the review in TWO places, identical content:
    1. As the chat output (the normal review surface), AND
    2. Saved to a file at `./_review_report.md` at the sandbox root
       (NOT inside `TicketTriageSolution/`).

  Writing the file copy first, before the chat report, is encouraged — the
  file is the source of truth the test harness will check.

success_criteria:
  - type: skill_triggered
    description: "Agent invoked the uipath-review skill"
    skill_name: "uipath-review"
    expected_skill: "uipath-review"
    weight: 3.0

  - type: command_not_executed
    description: "Read-only contract: no Write inside TicketTriageSolution/ (Critical Rule 1)"
    tool_name: "Write"
    command_pattern: '"file_path":\s*"[^"]*TicketTriageSolution/'
    weight: 3.0

  - type: command_not_executed
    description: "Read-only contract: no Edit inside TicketTriageSolution/ (Critical Rule 1)"
    tool_name: "Edit"
    command_pattern: '"file_path":\s*"[^"]*TicketTriageSolution/'
    weight: 3.0

  - type: run_command
    description: "Report flags the core.logic.mock placeholder node"
    command: >-
      python3 $REFERENCE_DIR/_shared/check_planted_defect.py
      --marker "TicketTriageSolution/TicketTriage/TicketTriage.flow::core.logic.mock"
      --flag "mock|placeholder"
      --mention "core.logic.mock|Route to team|routeToTeam1|mock node|mock placeholder|placeholder node"
    timeout: 30
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0
