task_id: skill-review-solution-orphan-project
description: >
  Solution structure review. ClaimsSolution.uipx registers two processes
  (ClaimsIntake, ClaimsPayout); a third executable project, ClaimsAudit, sits
  in the solution folder but is not registered, so a pack ships without it.
  The report must name ClaimsAudit as unregistered / orphaned.
tags: [uipath-review, integration, mode:diagnose, lifecycle:discover]

run_limits:
  turn_timeout: 1200
  task_timeout: 1500
  max_turns: 40

sandbox:
  template_sources:
    - type: template_dir
      path: fixture

reference:
  directory: ../..

initial_prompt: |
  A UiPath solution exists at `ClaimsSolution` in the current directory.
  Review it and produce a structured review report with Critical / Warning /
  Info findings.

  Use the `uipath-review` skill to perform this review.

  This is a read-only review. Do NOT modify, create, or delete any files
  inside `ClaimsSolution/`. Do NOT run the automation. Do NOT ask for approval,
  confirmation, or feedback.

  Produce the review in TWO places, identical content:
    1. As the chat output (the normal review surface), AND
    2. Saved to a file at `./_review_report.md` at the sandbox root
       (NOT inside `ClaimsSolution/`).

  Writing the file copy first, before the chat report, is encouraged — the
  file is the source of truth the test harness will check.

success_criteria:
  - type: skill_triggered
    description: "Agent invoked the uipath-review skill"
    skill_name: "uipath-review"
    expected_skill: "uipath-review"
    weight: 3.0

  - type: command_not_executed
    description: "Read-only contract: no Write inside ClaimsSolution/ (Critical Rule 1)"
    tool_name: "Write"
    command_pattern: '"file_path":\s*"[^"]*ClaimsSolution/'
    weight: 3.0

  - type: command_not_executed
    description: "Read-only contract: no Edit inside ClaimsSolution/ (Critical Rule 1)"
    tool_name: "Edit"
    command_pattern: '"file_path":\s*"[^"]*ClaimsSolution/'
    weight: 3.0

  - type: run_command
    description: "Report flags ClaimsAudit as an executable project not registered in the .uipx"
    command: >-
      python3 $REFERENCE_DIR/_shared/check_planted_defect.py
      --marker "ClaimsSolution/ClaimsAudit/project.json::ClaimsAudit"
      --marker "ClaimsSolution/ClaimsSolution.uipx::ClaimsPayout/project.json"
      --subject "ClaimsAudit"
      --flag-absence "orphan|not listed|not registered|unregistered|not in the|not included|not part of|missing from|not referenced|not declared|absent from|not present in|outside the solution|isn't listed|is not listed|omitted"
    timeout: 30
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0
