task_id: skill-review-solution-deploy-config-secret
description: >
  Deploy-configuration review. `deploy/deploy-config.prod.json` commits the
  HrPortalPassword asset value in plaintext. The report must flag the
  committed secret as Critical; a URL in the same file must not distract from
  it.
tags: [uipath-review, integration, mode:diagnose, lifecycle:discover]

run_limits:
  turn_timeout: 1200
  task_timeout: 1500
  max_turns: 40

sandbox:
  template_sources:
    - type: template_dir
      path: fixture

reference:
  directory: ../..

initial_prompt: |
  A UiPath solution exists at `HrSolution` in the current directory, with its production deploy configuration under `deploy/`.
  Review it and produce a structured review report with Critical / Warning /
  Info findings.

  Use the `uipath-review` skill to perform this review.

  This is a read-only review. Do NOT modify, create, or delete any files
  inside `HrSolution/`. Do NOT run the automation. Do NOT ask for approval,
  confirmation, or feedback.

  Produce the review in TWO places, identical content:
    1. As the chat output (the normal review surface), AND
    2. Saved to a file at `./_review_report.md` at the sandbox root
       (NOT inside `HrSolution/`).

  Writing the file copy first, before the chat report, is encouraged — the
  file is the source of truth the test harness will check.

success_criteria:
  - type: skill_triggered
    description: "Agent invoked the uipath-review skill"
    skill_name: "uipath-review"
    expected_skill: "uipath-review"
    weight: 3.0

  - type: command_not_executed
    description: "Read-only contract: no Write inside HrSolution/ (Critical Rule 1)"
    tool_name: "Write"
    command_pattern: '"file_path":\s*"[^"]*HrSolution/'
    weight: 3.0

  - type: command_not_executed
    description: "Read-only contract: no Edit inside HrSolution/ (Critical Rule 1)"
    tool_name: "Edit"
    command_pattern: '"file_path":\s*"[^"]*HrSolution/'
    weight: 3.0

  - type: run_command
    description: "Report flags the plaintext HrPortalPassword value in the deploy config as Critical"
    command: >-
      python3 $REFERENCE_DIR/_shared/check_planted_defect.py
      --marker "HrSolution/deploy/deploy-config.prod.json::Summer_FAKE_2026_DoNotUse"
      --subject "HrPortalPassword|deploy-config.prod.json"
      --flag "hardcod|hard-cod|hard cod|plaintext|plain text|plain-text|cleartext|clear text|in clear|embedded|inline|literal|exposed|committed|checked in|baked in|in source control|in the repo|in git|version control"
      --mention "password|secret|credential"
      --mention "critical"
    timeout: 30
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0
