task_id: skill-review-agents-lowcode-guardrail-audit-logging
description: >
  Integration test for uipath-review on a low-code agent with a
  `SendCustomerEmail` tool that legitimately handles PII (recipient email) and
  no guardrail. Blocking PII on that tool would break it, so the right
  recommendation is a Tool-scope LOG guardrail for an audit trail. The reviewer
  should apply guardrails-review.md Recommend Mode and emit
  `LC_GUARDRAIL_RECOMMENDED` recommending a log/audit action (not block).
  Non-gating (integration tag). Needs the authed CLI.
tags: [uipath-review, integration, mode:diagnose, lifecycle:discover, guardrail]

run_limits:
  turn_timeout: 1800
  task_timeout: 2400
  max_turns: 60

sandbox:
  python: {}

pre_run:
  - command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-review/agents/lowcode_review_guardrail_audit_logging/inject_guardrail_audit_logging.py"
    timeout: 30

initial_prompt: |
  A low-code UiPath agent project exists at `ReviewSol/SampleAgent` inside the
  solution `ReviewSol`. Review the agent project for issues and save your review
  report to `./_review_report.md` at the sandbox root.

  This is a read-only review — do not modify anything inside `ReviewSol/`.

success_criteria:
  - type: skill_triggered
    description: "Agent invoked the uipath-review skill"
    skill_name: "uipath-review"
    expected_skill: "uipath-review"
    weight: 3.0

  - type: command_not_executed
    description: "Read-only contract: no Write inside ReviewSol/ (Critical Rule 1)"
    tool_name: "Write"
    command_pattern: '"file_path":\s*"[^"]*ReviewSol'
    weight: 3.0

  - type: command_not_executed
    description: "Read-only contract: no Edit inside ReviewSol/ (Critical Rule 1)"
    tool_name: "Edit"
    command_pattern: '"file_path":\s*"[^"]*ReviewSol'
    weight: 3.0

  # Artifact evidence, not command telemetry. A `command_executed` criterion on the
  # review CLI scores the shape of the agent's shell call rather than the work:
  # coder_eval matches the pattern against only the first 2000 chars of a command,
  # so a CLI call late in a batched `bash -lc` script is invisible, and
  # `require_success` sees only the wrapper's exit code, which `set +e ... exit 0`
  # pins to 0. This asserts the same thing from the report instead -- see the
  # checker's module docstring.
  - type: run_command
    description: "Report carries the review CLI's deterministic findings (Step 2.5a ran)"
    command: 'python3 $SKILLS_REPO_PATH/tests/tasks/uipath-review/_shared/check_review_cli_provenance.py --project ReviewSol/SampleAgent --verb "agent review"'
    timeout: 240
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Advisory: agent fetched the live guardrail catalog visibly in Bash (not gated — the matcher only sees the first 2000 chars of a command, so a batched call is invisible)"
    tool_name: "Bash"
    command_pattern: 'uip\s+agent\s+guardrails\s+catalog'
    min_count: 1
    weight: 0
    pass_threshold: 0
  # Carries the gating weight the advisory check above gave up. That matcher is
  # wrapper-blind, and its `require_success: true` (now dropped) reads only the
  # batch wrapper's exit code -- a `set +e ... exit 0` script scored it 1.00 in two
  # live Codex runs while `guardrails catalog` actually returned `unknown command
  # 'catalog'`. This establishes whether the catalog was really reachable and holds
  # the report to guardrails-review.md Step 0's contract when it was not. It cannot
  # prove the agent fetched it -- no artifact survives that would.
  - type: run_command
    description: "Guardrail catalog reachable, and the report's claim about it is consistent"
    command: 'python3 $SKILLS_REPO_PATH/tests/tasks/uipath-review/_shared/check_guardrail_catalog_evidence.py'
    timeout: 240
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "Review report recommends a Tool-scope log/audit guardrail (LC_GUARDRAIL_RECOMMENDED, audit flavor)"
    command: "python3 $TASK_DIR/check_lowcode_review_guardrail_audit_logging.py"
    timeout: 30
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0
