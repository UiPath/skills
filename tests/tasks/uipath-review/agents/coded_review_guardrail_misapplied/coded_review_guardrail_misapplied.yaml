task_id: skill-review-agents-coded-guardrail-misapplied
description: >
  Integration test for uipath-review on a LangChain coded agent that carries a
  misapplied guardrail: a synthetic-test-data generator (only input is `count`; its
  LLM never receives real PII) wires a `pii_detection` guardrail. `uip codedagent
  review` returns it guardrail-clean, so the reviewer must fetch the live catalog
  (Audit Mode → Relevance), read `pii_detection`'s `when_not_to_use`, and cite
  `CODED_GUARDRAIL_MISAPPLIED`. Non-gating (integration tag). Needs the authed CLI.
tags: [uipath-review, integration, mode:diagnose, lifecycle:discover, guardrail]

run_limits:
  turn_timeout: 1800
  task_timeout: 2400
  max_turns: 60

sandbox:
  python: {}

pre_run:
  - command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-review/agents/coded_review_guardrail_misapplied/inject_guardrail_misapplied.py"
    timeout: 30

initial_prompt: |
  A coded UiPath agent project (LangChain) exists at `CodedAgent`. Review it for
  issues and save your review report to `./_review_report.md`.

  This is a read-only review — do not modify anything inside `CodedAgent/`.

success_criteria:
  - type: skill_triggered
    description: "Agent invoked the uipath-review skill"
    skill_name: "uipath-review"
    expected_skill: "uipath-review"
    weight: 3.0

  - type: command_not_executed
    description: "Read-only contract: no Write inside CodedAgent/ (Critical Rule 1)"
    tool_name: "Write"
    command_pattern: '"file_path":\s*"[^"]*CodedAgent'
    weight: 3.0

  - type: command_not_executed
    description: "Read-only contract: no Edit inside CodedAgent/ (Critical Rule 1)"
    tool_name: "Edit"
    command_pattern: '"file_path":\s*"[^"]*CodedAgent'
    weight: 3.0

  - type: command_executed
    description: "Ran the coded review CLI first (Step 2.5a)"
    tool_name: "Bash"
    command_pattern: 'uip\s+codedagent\s+review'
    min_count: 1
    weight: 2.0
    pass_threshold: 1.0

  # Replaces a `command_executed` check on `uip\s+agent\s+guardrails\s+catalog`.
  # That matcher was wrapper-blind (coder_eval only searches the first 2000 chars of
  # a command, so a batched call is invisible), and its `require_success: true` read
  # the batch wrapper's exit code -- a `set +e ... exit 0` script scored it 1.00 in
  # two live Codex runs while the command actually returned `unknown command
  # 'catalog'`. This establishes whether the catalog was really reachable and holds
  # the report to guardrails-review.md Step 0's contract when it was not. It does not
  # prove the agent fetched the catalog; no artifact survives that would, and a
  # weight-0 advisory of the old check was dropped rather than kept as decoration --
  # it renders PASS at every score, and this suite is triaged on pass/fail alone.
  - type: run_command
    description: "Guardrail catalog reachable, and the report's claim about it is consistent"
    command: 'python3 $SKILLS_REPO_PATH/tests/tasks/uipath-review/_shared/check_guardrail_catalog_evidence.py'
    timeout: 240
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "Review report cites CODED_GUARDRAIL_MISAPPLIED for the PII guardrail on the synthetic-data generator"
    command: "python3 $TASK_DIR/check_coded_review_guardrail_misapplied.py"
    timeout: 30
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0
