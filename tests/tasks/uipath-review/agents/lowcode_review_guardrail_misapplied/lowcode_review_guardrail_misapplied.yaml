task_id: skill-review-agents-lowcode-guardrail-misapplied
description: >
  Integration test for uipath-review on a low-code agent that carries a
  misapplied guardrail: a synthetic-test-data generator (its LLM never sees real
  PII) has a `pii_detection` guardrail at Llm scope. `uip agent review` returns
  it format-clean, so the reviewer must fetch the live catalog and read
  `pii_detection`'s `when_not_to_use` ("Do not apply at Llm scope if the agent's
  LLM never receives raw PII from the user") and cite `LC_GUARDRAIL_MISAPPLIED`.
  Non-gating (integration tag): softer single-shot judgment than the gating
  action-ineffective task. Needs the authed CLI.
tags: [uipath-review, integration, mode:diagnose, lifecycle:discover, guardrail]

run_limits:
  turn_timeout: 1800
  task_timeout: 2400
  max_turns: 60

sandbox:
  python: {}

pre_run:
  - command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-review/agents/lowcode_review_guardrail_misapplied/inject_guardrail_misapplied.py"
    timeout: 30

initial_prompt: |
  A low-code UiPath agent project exists at `ReviewSol/SampleAgent` inside the
  solution `ReviewSol`. Review the agent project for issues and save your review
  report to `./_review_report.md` at the sandbox root.

  This is a read-only review — do not modify anything inside `ReviewSol/`.

success_criteria:
  - type: skill_triggered
    description: "Agent invoked the uipath-review skill"
    skill_name: "uipath-review"
    expected_skill: "uipath-review"
    weight: 3.0

  - type: command_not_executed
    description: "Read-only contract: no Write inside ReviewSol/ (Critical Rule 1)"
    tool_name: "Write"
    command_pattern: '"file_path":\s*"[^"]*ReviewSol'
    weight: 3.0

  - type: command_not_executed
    description: "Read-only contract: no Edit inside ReviewSol/ (Critical Rule 1)"
    tool_name: "Edit"
    command_pattern: '"file_path":\s*"[^"]*ReviewSol'
    weight: 3.0

  # Artifact evidence, not command telemetry. A `command_executed` criterion on
  # `uip\s+agent\s+review` scores the shape of the agent's shell call rather than
  # the work: coder_eval matches the pattern against only the first 2000 chars of
  # a command, so a CLI call late in a batched `bash -lc` script is invisible, and
  # `require_success` sees only the wrapper's exit code, which `set +e ... exit 0`
  # pins to 0. This asserts the same thing from the report instead -- see the
  # checker's module docstring.
  - type: run_command
    description: "Report carries the review CLI's deterministic findings (Step 2.5a ran)"
    command: 'python3 $SKILLS_REPO_PATH/tests/tasks/uipath-review/_shared/check_review_cli_provenance.py'
    timeout: 240
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  # Replaces a `command_executed` check on `uip\s+agent\s+guardrails\s+catalog`.
  # That matcher was wrapper-blind (coder_eval only searches the first 2000 chars of
  # a command, so a batched call is invisible), and its `require_success: true` read
  # the batch wrapper's exit code -- a `set +e ... exit 0` script scored it 1.00 in
  # two live Codex runs while the command actually returned `unknown command
  # 'catalog'`. This establishes whether the catalog was really reachable and holds
  # the report to guardrails-review.md Step 0's contract when it was not. It does not
  # prove the agent fetched the catalog; no artifact survives that would, and a
  # weight-0 advisory of the old check was dropped rather than kept as decoration --
  # it renders PASS at every score, and this suite is triaged on pass/fail alone.
  - type: run_command
    description: "Guardrail catalog reachable, and the report's claim about it is consistent"
    command: 'python3 $SKILLS_REPO_PATH/tests/tasks/uipath-review/_shared/check_guardrail_catalog_evidence.py'
    timeout: 240
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "Review report cites LC_GUARDRAIL_MISAPPLIED for the misapplied Llm-scope PII guardrail"
    command: "python3 $TASK_DIR/check_lowcode_review_guardrail_misapplied.py"
    timeout: 30
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0
