task_id: skill-extension-e2e-adopt-validate
description: >
  Maestro community node e2e via the `uip extension` CLI. A request to turn a new
  function into a community node and check it must be routed to the
  `uipath-extension` skill. Verifies the agent creates the project with
  `uip function new`, adopts it with `uip extension init <publisher>.<name>
  --yes` after showing the plan, fills the template, and runs
  `uip extension validate`. The checker reads the project files, so the run is
  graded on what is on disk and not on what the agent says, and the checker
  runs the finished function with `uip function run`. The task never opens a
  pull request and never uploads. `init` reads the template schema from the
  index repository through `gh`, and the sandbox has no GitHub login, so
  `sandbox.mock_path_dirs` puts a read-only stand-in `gh` (`_setup/gh`) first on
  the task's PATH. It answers only the index repository lookup and the policy
  file read, and fails every other call, so the task needs no login and cannot
  write to GitHub. It lives in the task workspace, so it never replaces the
  `gh` on the host. The local agent shell can still resolve the host `gh`
  first, so the prompt has the agent prefix `PATH` with the `_setup` folder for
  `command -v gh` and for `init`. The stand-in appends every call to
  `_setup/gh-calls.log`, and the checker fails unless that log holds the two
  index reads `init` makes, so a run where the stand-in served no index read
  fails. The log shows that the stand-in answered those reads, not that `init`
  made them, and a hand call to the stand-in would still fill it.
tags: [uipath-extension, e2e, mode:build, lifecycle:generate]

run_limits:
  expected_turns: 25
  turn_timeout: 1200

sandbox:
  template_sources:
    - type: template_dir
      path: _setup
      mount_point: _setup
  mock_path_dirs:
    - _setup

reference:
  directory: .

initial_prompt: |
  Create a UiPath function named `word-count` that takes `text` (string) and
  returns `words` (integer, the number of whitespace-separated words). Make it
  a Maestro community node with the identity `acme.word-count`, fill in the
  template with the license MIT, the label `Word Count`, a one-line
  description and the tag `text`, then check it with the community node gates
  until they pass.

  `uip extension init` reads the community index through `gh`. This sandbox
  has a read-only stand-in `gh` in the `_setup` folder of the workspace root,
  and your shell may find a different `gh` first. Before you adopt the
  project, run `PATH="<absolute path of _setup>:$PATH" command -v gh` and
  confirm it prints a path inside `_setup`. Start `uip extension init` with the
  same `PATH="<absolute path of _setup>:$PATH"` prefix.

  Do NOT upload it and do NOT open any pull request.

success_criteria:
  - type: skill_triggered
    description: "Agent recognised a Maestro community node request and invoked the uipath-extension skill"
    skill_name: "uipath-extension"
    expected_skill: "uipath-extension"
    weight: 3.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent created the project with uip function new"
    tool_name: "Bash"
    command_pattern: 'uip\s+functions?\s+new\s+word-count'
    min_count: 1
    weight: 2.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent adopted the project with uip extension init and the identity"
    tool_name: "Bash"
    command_pattern: 'uip\s+extension\s+init\b(?=[^|;&\n]*\bacme\.word-count\b)(?=[^|;&\n]*--yes\b)'
    min_count: 1
    weight: 2.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent ran the community node gates with uip extension validate"
    tool_name: "Bash"
    command_pattern: 'uip\s+extension\s+validate'
    min_count: 1
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "The community node gates pass on the finished project"
    command: "uip extension validate --path word-count --output json"
    timeout: 120
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent never uploaded the node and never opened a pull request, with gh or with uip extension submit and a security contact and no --dry-run"
    command_pattern: 'uip\s+extension\s+upload\b|gh\s+pr\s+create\b|uip\s+extension\s+submit\b(?![^|;&\n]*--dry-run)[^|;&\n]*--security-contact\b'
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "The stand-in gh answered both index reads, the project is adopted as acme.word-count, the template is schema 2 with no placeholder left, the node does not depend on the Maestro Extensions SDK, and the function returns the word count"
    command: "python3 $REFERENCE_DIR/check_adopt_validate.py"
    timeout: 200
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0
