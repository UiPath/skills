task_id: skill-rpa-fix-broken-xaml-validate-loop
description: >
  Skill-guided evaluation (diagnose mode): given a pre-existing modern
  cross-platform (Portable) XAML project on disk that does NOT validate, the
  agent must run the skill's validate -> read structured errors -> fix one
  root cause -> re-validate loop (Common Rule 3/4, XAML Rule 19) and bring the
  project to a clean per-file `validate` and project `build`. The seeded
  defect is a Write Line that references an undeclared variable `message`, so
  `uip rpa validate` reports a "not declared"/expression error; the fix is to
  declare the missing String variable and give it the specified default. This
  is the D1 repair-loop archetype the uipath-rpa suite currently lacks — every
  existing validate assertion runs against a fresh artifact the agent just
  authored, never a deliberately broken one.

  Platform note: `uip rpa validate` / `build` auto-launch a headless Studio
  host and need a Windows + Studio-class runner; they may not execute on
  Linux/macOS CI. The graded fix (structural correction of Main.xaml) is
  deterministic regardless; the validate/build criteria grade the command
  surface exercised on the Windows runner.
tags: [uipath-rpa, windows, integration, mode:diagnose, lifecycle:generate]
max_iterations: 2

run_limits:
  max_turns: 60
  turn_timeout: 2000
  task_timeout: 2000

initial_prompt: |
  A modern UiPath RPA project at `./RepairGreeting/` was handed to you
  broken: `uip rpa validate` fails on `Main.xaml`. Diagnose the failure,
  fix the root cause, and bring the project to a clean per-file `validate`
  and a clean project `build`. The workflow is meant to print a greeting
  that is stored in a String variable named `message`.

  Do NOT ask for approval, confirmation, or feedback.
  Do NOT pause between planning and implementation.

  First, scaffold the broken starting project on disk. Write exactly these
  two files (their content is authoritative — write them verbatim):

  `./RepairGreeting/project.json`:
  ```json
  {
    "name": "RepairGreeting",
    "projectId": "33333333-3333-3333-3333-333333333333",
    "description": "Broken greeting workflow for the validate->fix loop test",
    "main": "Main.xaml",
    "dependencies": {
      "UiPath.System.Activities": "[24.10.8]"
    },
    "webServices": [],
    "entitiesStores": [],
    "schemaVersion": "4.0",
    "studioVersion": "24.10.0.0",
    "projectVersion": "1.0.0",
    "runtimeOptions": {
      "autoDispose": false,
      "isAttended": false,
      "requiresUserInteraction": false,
      "supportsPersistence": false,
      "workflowSerialization": "DataContract",
      "excludedLoggedData": [],
      "executionType": "Workflow",
      "readyForPiP": false,
      "startsInPiP": false,
      "mustRestoreAllDependencies": true,
      "pipType": "ChildSession"
    },
    "designOptions": {
      "projectProfile": "Development",
      "outputType": "Process",
      "libraryOptions": {
        "includeOriginalXaml": false,
        "privateWorkflows": []
      },
      "processOptions": {
        "ignoredIsolatedActivities": []
      },
      "fileInfoCollection": [],
      "saveToCloud": false
    },
    "expressionLanguage": "VisualBasic",
    "targetFramework": "Portable"
  }
  ```

  `./RepairGreeting/Main.xaml`:
  ```xml
  <Activity mc:Ignorable="sap sap2010 sads" x:Class="Main" xmlns="http://schemas.microsoft.com/netfx/2009/xaml/activities" xmlns:mc="http://schemas.openxmlformats.org/markup-compatibility/2006" xmlns:sap="http://schemas.microsoft.com/netfx/2009/xaml/activities/presentation" xmlns:sap2010="http://schemas.microsoft.com/netfx/2010/xaml/activities/presentation" xmlns:sads="http://schemas.microsoft.com/netfx/2010/xaml/activities/debugger" xmlns:scg="clr-namespace:System.Collections.Generic;assembly=System.Private.CoreLib" xmlns:x="http://schemas.microsoft.com/winfx/2006/xaml">
    <TextExpression.NamespacesForImplementation>
      <scg:List x:TypeArguments="x:String" Capacity="2">
        <x:String>System</x:String>
        <x:String>System.Activities</x:String>
      </scg:List>
    </TextExpression.NamespacesForImplementation>
    <TextExpression.ReferencesForImplementation>
      <AssemblyReference>System.Private.CoreLib</AssemblyReference>
      <AssemblyReference>System.Activities</AssemblyReference>
    </TextExpression.ReferencesForImplementation>
    <Sequence DisplayName="Main">
      <WriteLine Text="[message]" />
    </Sequence>
  </Activity>
  ```

  Then run the diagnose-and-fix loop:
  - Run `uip rpa validate` on the file and READ the reported error(s).
  - Fix the root cause: declare the missing String variable `message` on the
    `Main` sequence and set its default to the exact literal `Hello from RPA`.
    Do NOT inline the literal into the Write Line and do NOT delete the
    Write Line — the workflow must still log the value held in `message`.
  - Re-validate until the file is clean (fix one root cause per iteration,
    up to 5 attempts), then run the project-level `build` and confirm it is
    clean.

  Important:
  - The `uip` CLI is available in this sandbox. Choose the correct CLI for a
    modern (non-Legacy) project.
  - Use `--output json` on commands whose output you parse.

success_criteria:
  # Broken fixture is in place.
  - type: file_exists
    description: "Starter RepairGreeting/project.json was written"
    path: "RepairGreeting/project.json"
    weight: 1.0
    pass_threshold: 1.0

  - type: file_exists
    description: "Starter RepairGreeting/Main.xaml was written"
    path: "RepairGreeting/Main.xaml"
    weight: 1.0
    pass_threshold: 1.0

  # Routing: modern CLI, not legacy, on a Portable project.
  - type: command_executed
    description: "Agent used the modern uip rpa validate CLI (not rpa-legacy) on this Portable project"
    tool_name: "Bash"
    command_pattern: 'uip\s+rpa\s+validate\b'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent did NOT route this modern project to the legacy CLI"
    tool_name: "Bash"
    command_pattern: 'uip\s+rpa-legacy\b'
    max_count: 0
    weight: 1.0
    pass_threshold: 1.0

  # Project-level build gate after the fix.
  - type: command_executed
    description: "Agent ran the project-level uip rpa build gate after fixing"
    tool_name: "Bash"
    command_pattern: 'uip\s+rpa\s+build\b'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent used --output json on parsed uip commands"
    tool_name: "Bash"
    command_pattern: 'uip\s+rpa\s+(validate|build)\b[\s\S]*--output\s+json'
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0

  # The fix landed: message declared as a String variable with the right default,
  # WriteLine still references it. Order-independent structural check.
  - type: run_command
    description: "Main.xaml now declares String variable `message` (default 'Hello from RPA') and the WriteLine still references it"
    command: "python -c \"import re,sys; s=open('RepairGreeting/Main.xaml',encoding='utf-8').read(); var=re.search(r'<Variable\\b(?=[^>]*\\bName=\\\"message\\\")(?=[^>]*x:TypeArguments=\\\"x:String\\\")[^>]*(?:/>|>)', s); greet='Hello from RPA' in s; wl=re.search(r'<WriteLine\\b[^>]*Text=\\\"\\[?[^\\\"]*\\bmessage\\b', s); sys.exit(0 if (var and greet and wl) else 1)\""
    timeout: 10
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  # Guard: the seeded defect (an undeclared `message`) is genuinely resolved by
  # declaration, not by deleting the reference.
  - type: file_contains
    description: "Main.xaml retains the greeting default and a message variable declaration"
    path: "RepairGreeting/Main.xaml"
    includes:
      - 'Name="message"'
      - "Hello from RPA"
    weight: 2.0
    pass_threshold: 1.0
