task_id: skill-rpa-run-smoke-output
description: >
  Skill-guided evaluation (operate mode): the agent must author a trivial
  modern cross-platform (Portable) XAML automation, then actually RUN it with
  `uip rpa run` and confirm the runtime output — not just validate/build it.
  This is the skill's "gate != runtime proof" step (Common Rule 4, Rule 8a):
  a workflow can pass per-file `validate` and project `build` and still do
  nothing at runtime. The workflow writes a deterministic token to an Out
  argument and logs it; grading inspects the captured run result for that
  token so the agent cannot pass by self-reporting success.

  Platform note: `uip rpa run` auto-launches a headless Studio host
  (UiPath.Studio.Helm) and needs a Windows + Studio-class runner; the run
  itself may not execute on Linux/macOS CI. The behavioral criteria
  (init/validate/build/run invocation shape) grade the command surface; the
  outcome criterion grades the run result on the Windows runner.
tags: [uipath-rpa, windows, integration, mode:operate, lifecycle:generate, outcome-graded]
max_iterations: 2

run_limits:
  max_turns: 60
  turn_timeout: 2000
  task_timeout: 2000

initial_prompt: |
  Create a new UiPath RPA automation called "RunSmoke" in the current
  directory, then run it and prove it produced the expected output.

  Requirements:
  - It is a brand-new project (none exists yet) — scaffold it with the
    RPA skill's normal `init` flow. It must be a modern cross-platform
    (Portable) XAML project so it can run headless.
  - The workflow must expose a String Out argument named `Result` and set
    it to the exact literal `RPA_SMOKE_OK_4711`, and also log that same
    value once via a Write Line / Log Message activity.
  - Bring every touched file to per-file `validate` clean, then confirm the
    project `build` is clean.
  - Then RUN the workflow with the modern `uip rpa run` command and capture
    the run result as JSON to `RunSmoke/run-result.json` (redirect the
    command's `--output json` payload to that file). Read the result and
    confirm the run actually succeeded and emitted the token — do NOT judge
    success from the outer CLI `Result` field or from any log entry's level.

  Do NOT ask for approval, confirmation, or feedback.
  Do NOT pause between planning and implementation.

  Important:
  - The `uip` CLI is available in this sandbox. Choose the correct CLI for a
    modern project.
  - Use `--output json` on commands whose output you parse.

success_criteria:
  # Project was scaffolded via the skill's init flow.
  - type: file_exists
    description: "RunSmoke project.json was created"
    path: "RunSmoke/project.json"
    weight: 1.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent scaffolded a modern Portable (cross-platform) project with uip rpa init"
    tool_name: "Bash"
    command_pattern: 'uip\s+rpa\s+init\b[\s\S]*--target-framework\s+"?Portable"?'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  # Workflow shape: an Out argument named Result set to the deterministic token.
  - type: file_check
    description: "Main.xaml declares a String Out argument named Result and sets the RPA_SMOKE_OK_4711 token"
    path: "RunSmoke/Main.xaml"
    patterns:
      - pattern: '<x:Property\b(?=[^>]*\bName="Result")(?=[^>]*Type="OutArgument\(x:String\)")'
        must_match: true
      - pattern: 'RPA_SMOKE_OK_4711'
        must_match: true
    weight: 2.0
    pass_threshold: 1.0

  # Gates were run before the smoke run.
  - type: command_executed
    description: "Agent ran per-file uip rpa validate"
    tool_name: "Bash"
    command_pattern: 'uip\s+rpa\s+validate\b'
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent ran the project-level uip rpa build gate"
    tool_name: "Bash"
    command_pattern: 'uip\s+rpa\s+build\b'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  # Core behavior: the workflow was actually RUN (not just built).
  - type: command_executed
    description: "Agent executed the workflow with uip rpa run"
    tool_name: "Bash"
    command_pattern: 'uip\s+rpa\s+run\b'
    min_count: 1
    weight: 3.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent used --output json on parsed uip commands"
    tool_name: "Bash"
    command_pattern: 'uip\s+rpa\s+run\b[\s\S]*--output\s+json'
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0

  # Outcome: the captured run result carries the deterministic token, proving
  # the workflow ran and produced the value (Windows runner only).
  - type: run_command
    description: "Captured run-result.json contains the RPA_SMOKE_OK_4711 token emitted at runtime"
    command: "python -c \"import sys,pathlib; p=pathlib.Path('RunSmoke/run-result.json'); sys.exit(0 if p.exists() and 'RPA_SMOKE_OK_4711' in p.read_text(encoding='utf-8') else 1)\""
    timeout: 10
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
