task_id: skill-agent-coded-strict-input-no-messages
description: >
  Negative framework-fit smoke test: the user explicitly asks for an OpenAI
  Agents coded agent but with a hard input contract — a single field and no
  `messages`. OpenAI Agents cannot express that (its runner forces a required
  `messages` field), so the agent must recognise the conflict, explain that
  OpenAI Agents is not a fit — attributing the constraint to the OpenAI Agents
  runner, not to UiPath — and suggest a different framework, without scaffolding
  an OpenAI Agents project or silently falling back to a plain function.
tags: [uipath-agents, smoke, mode:build, coded, lifecycle:discover, feature:framework-openai-agents]

run_limits:
  expected_turns: 3

initial_prompt: |
  I want to build a UiPath coded agent that takes an address and breaks it
  down into its parts: street, city, postal code, and country.

  It'll be called by another automation, so the agent's input must be a single
  `address` field with no other input arguments.

  I'd like to use OpenAI Agents since that's the framework I know best. Is it
  complicated?

success_criteria:
  - type: skill_triggered
    description: "Agent consulted the uipath-agents skill"
    skill_name: "uipath-agents"
    expected_skill: "uipath-agents"
    weight: 1.0
    pass_threshold: 1.0

  - type: llm_judge
    description: "Agent recognises OpenAI Agents cannot satisfy the messages-free input contract and does not proceed to build"
    include_agent_output: true
    prompt: |
      The user asked for an OpenAI Agents coded agent whose input is a single
      named field (`address`), invoked programmatically by another automation —
      explicitly NOT a chatbot and with no conversation.

      OpenAI Agents cannot satisfy this: its runner only accepts conversation
      input, so the generated input schema always carries a required `messages`
      field. The correct response is to tell the user that OpenAI Agents cannot
      meet the contract and stop for their decision — optionally naming an
      alternative framework (e.g. LangGraph) — instead of building anything.

      Score the response in exactly one band:

      Score 1.0 if the agent states that OpenAI Agents is incompatible with /
      cannot meet the requested messages-free single-field input contract, AND
      does not proceed to build — it stops and leaves the framework decision to
      the user. Wording, level of detail, which layer it blames for the
      `messages` requirement, and whether it names an alternative framework do
      NOT affect the score. Offering a `messages`-based OpenAI Agents workaround
      as an option is fine.
      Score 0.0 if the agent does not identify the limitation (builds or plans an
      OpenAI Agents project as if it satisfies the request, maps the input into
      `messages` without flagging it, or claims OpenAI Agents can produce a
      messages-free schema), OR identifies the limitation but proceeds anyway —
      e.g. silently switches to another framework and builds without asking.
    weight: 3.0
    # Binary on purpose: the graded invariants are "detects the limitation" and
    # "does not proceed". Attribution/phrasing varied run to run on the same
    # model and produced false failures when graded in finer bands.
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent did not scaffold a project despite the infeasible request"
    tool_name: "Bash"
    command_pattern: 'uip\s+codedagent\s+new'
    weight: 2.0
    pass_threshold: 1.0
