task_id: skill-agent-context-index
description: >
  End-to-end test: scaffold a standalone low-code agent that uses a
  semantic index as a context (RAG) resource. Verifies that the
  `$resourceType: "context"` + `contextType: "index"` resource.json
  format is authored correctly, that `settings.retrievalMode` is a
  valid value, and that `uip agent validate` accepts the resource and
  regenerates derived files.
tags: [uipath-agents, e2e, mode:build, low-code, context-grounding]

run_limits:
  expected_turns: 25
  turn_timeout: 1200

# Explicitly mentioning "autonomous" here since the "question"/"answer" prompt may
# cause the coding agent to assume the conversational low-code agent variant.
reference:
  directory: .

initial_prompt: |
  Create a UiPath low-code autonomous agent "ProductSupportAgent" that 
  answers a user's `question` (string) and returns an `answer` (string). 
  It should base its answers on our existing "UiPathAgentsProductKnowledge" 
  knowledge index — which is already set up in our tenant — instead of 
  answering from general knowledge. The solution should be named "KnowledgeSol".

  Do NOT publish, upload, or deploy. Do NOT ask for approval,
  confirmation, or feedback. Do NOT pause between planning and
  implementation. Complete the entire task end-to-end in a single pass.

success_criteria:
  - type: run_command
    description: "A solution manifest (.uipx) or a project.uiproj exists in the workspace"
    command: |-
      python3 -c "import glob, sys; sys.exit(0 if glob.glob('**/*.uipx', recursive=True) or glob.glob('**/project.uiproj', recursive=True) else 1)"
    timeout: 10
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 0.0  # advisory: init auto-scaffolds the parent solution (CLI #2470)

  - type: run_command
    description: "The workspace has an Agent project (a project.uiproj with ProjectType Agent)"
    command: |-
      python3 -c "import glob, json, sys; sys.exit(0 if sum(json.load(open(f)).get('ProjectType') == 'Agent' for f in glob.glob('**/project.uiproj', recursive=True)) >= 1 else 1)"
    timeout: 10
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent discovered the index identity with uip solution resources list --kind Index"
    tool_name: "Bash"
    command_pattern: 'uip\s+solution\s+resources\s+list\b.*--kind\s+Index'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent fetched the index configuration with uip solution resources get"
    tool_name: "Bash"
    command_pattern: 'uip\s+solution\s+resources\s+get\b'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  # Outcome-based check (auto-registration via `uip <kind> init` OR explicit
  # `uip solution project add` both populate Projects[] in the .uipx).
  - type: json_check
    description: "Project is registered in the parent solution .uipx"
    path: "KnowledgeSol/KnowledgeSol.uipx"
    assertions:
      - expression: "length(Projects)"
        operator: "gte"
        expected: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent refreshed the project to regenerate derived files"
    tool_name: "Bash"
    command_pattern: 'uip\s+agent\s+refresh'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent validated the project"
    tool_name: "Bash"
    command_pattern: 'uip\s+agent\s+validate'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent refreshed solution resources with uip solution resources refresh"
    tool_name: "Bash"
    command_pattern: 'uip\s+solution\s+resources\s+refresh'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: file_exists
    description: "ProductSupportAgent/agent.json was created"
    path: "KnowledgeSol/ProductSupportAgent/agent.json"
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "Context resource shape, retrievalMode, and schema sync"
    command: "python3 $REFERENCE_DIR/check_context_index.py"
    timeout: 30
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0
