task_id: skill-agent-inline-in-flow
description: >
  End-to-end test: given a goal-only prompt to build a flow that uses
  a low-code agent, the agent must derive from the skill that the
  right architecture is the inline-in-flow pattern. Verifies the agent
  uses `uip agent init --inline-in-flow` and the full refresh →
  validate split with `--inline-in-flow`, and produces the UUID-named
  subdirectory layout (no entry-points.json, no project.uiproj,
  empty flow-layout.json) wired into the flow with the correct
  `uipath.agent.autonomous` node and edges.
tags: [uipath-agents, e2e, mode:build, low-code, inline-flow]

run_limits:
  expected_turns: 31
  turn_timeout: 1200

initial_prompt: |
  Create a UiPath Flow project "GreetingFlow" that uses a single low-code agent
  embedded inside the flow project to generate a greeting. The solution
  should be named "GreetingSol".

  Do NOT publish, upload, or deploy. Do NOT ask for approval,
  confirmation, or feedback. Do NOT pause between planning and
  implementation. Complete the entire task end-to-end in a single pass.

success_criteria:
  - type: run_command
    description: "Solution GreetingSol exists (GreetingSol.uipx from uip solution init; in Studio Web the open solution)"
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-agents/_shared/project_files.py registered GreetingSol --min-projects 0"
    timeout: 30
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 0.0  # advisory: init auto-scaffolds the parent solution (CLI #2470)

  - type: command_executed
    description: "Agent scaffolded the inline agent with --inline-in-flow"
    tool_name: "Bash"
    command_pattern: 'uip\s+agent\s+init\s+.*--inline-in-flow'
    min_count: 1
    weight: 2.0
    pass_threshold: 1.0

  # Outcome-based check (auto-registration via `uip <kind> init` OR explicit
  # `uip solution project add` both populate Projects[] in the .uipx).
  - type: run_command
    description: "Project is registered in the parent solution .uipx"
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-agents/_shared/project_files.py registered GreetingSol --min-projects 1"
    timeout: 30
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent refreshed the inline agent with --inline-in-flow"
    tool_name: "Bash"
    command_pattern: 'uip\s+agent\s+refresh\s+.*--inline-in-flow'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent validated the inline agent with --inline-in-flow (read-only check)"
    tool_name: "Bash"
    command_pattern: 'uip\s+agent\s+validate\s+.*--inline-in-flow'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "Flow file was created"
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-agents/_shared/project_files.py exists GreetingSol GreetingFlow GreetingFlow.flow"
    timeout: 30
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "Flow project descriptor was created"
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-agents/_shared/project_files.py exists GreetingSol GreetingFlow project.uiproj"
    timeout: 30
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "Inline agent layout + flow wiring (autonomous node, source dir, edges)"
    command: "python3 $TASK_DIR/check_inline_in_flow.py"
    timeout: 30
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0
