task_id: skill-agent-guardrail-pii-detection
description: >
  Built-in PII detection guardrail. End-to-end test: scaffold a
  standalone low-code agent and add a builtInValidator guardrail for
  pii_detection that blocks Email and PhoneNumber entities. Verifies
  correct $guardrailType, validatorType, $parameterType discriminators,
  PascalCase entity names, enum-list and map-enum parameter types, and
  PascalCase scope values.
tags: [uipath-agents, e2e, mode:build, lifecycle:generate, low-code, guardrail]
initial_prompt: |
  Create a UiPath low-code agent "PiiSafeAgent" that answers user questions about
  their accounts. Add a guardrail that blocks email addresses and phone numbers
  in the agent's output — use a 0.5 threshold for each — with the message "PII
  detected in output." The solution should be named "PiiGuardSol".

  Do NOT publish, upload, or deploy. Do NOT ask for approval,
  confirmation, or feedback. Do NOT pause between planning and
  implementation. Complete the entire task end-to-end in a single pass.

success_criteria:
  - type: run_command
    description: "Solution PiiGuardSol exists (PiiGuardSol.uipx from uip solution init; in Studio Web the open solution)"
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-agents/_shared/project_files.py registered PiiGuardSol --min-projects 0"
    timeout: 30
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 0.0  # advisory: init auto-scaffolds the parent solution (CLI #2470)

  - type: command_executed
    description: "Agent scaffolded the agent project with uip agent init"
    tool_name: "Bash"
    command_pattern: 'uip\s+agent\s+init'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  # Outcome-based check (auto-registration via `uip <kind> init` OR explicit
  # `uip solution project add` both populate Projects[] in the .uipx).
  - type: run_command
    description: "Project is registered in the parent solution .uipx"
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-agents/_shared/project_files.py registered PiiGuardSol --min-projects 1"
    timeout: 30
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent refreshed the project to regenerate derived files"
    tool_name: "Bash"
    command_pattern: 'uip\s+agent\s+refresh'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent validated the project"
    tool_name: "Bash"
    command_pattern: 'uip\s+agent\s+validate'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "PiiSafeAgent/agent.json was created"
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-agents/_shared/project_files.py exists PiiGuardSol PiiSafeAgent agent.json"
    timeout: 30
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 1.0


  - type: run_command
    description: "PII detection guardrail shape (builtInValidator, pii_detection, parameters, PascalCase)"
    command: "python3 $TASK_DIR/check_pii_detection.py"
    timeout: 30
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0

run_limits:
  expected_turns: 15
  max_turns: 30
  turn_timeout: 1200
