task_id: skill-agent-init-validate
description: >
  Skill-guided evaluation: agent uses the uipath-agents skill to scaffold
  a new low-code agent inside a solution and validate it. Tests whether
  the skill teaches the correct solution-first workflow and CLI usage.
tags: [uipath-agents, smoke, mode:build, low-code, lifecycle:generate]

run_limits:
  expected_turns: 12
  turn_timeout: 1200

initial_prompt: |
  Create a UiPath low-code agent "GreeterAgent" that accepts a required
  `name` (string) and returns a `greeting` (string). Make sure it
  validates successfully. The solution should be named "GreetSol".

  Do NOT publish, upload, or deploy. Do NOT ask for approval,
  confirmation, or feedback. Do NOT pause between planning and
  implementation. Complete the entire task end-to-end in a single pass.

success_criteria:
  - type: command_executed
    description: "Agent created the solution with uip solution init"
    tool_name: "Bash"
    command_pattern: 'uip\s+solution\s+init'
    min_count: 1
    weight: 1.5
    pass_threshold: 0.0  # advisory: init auto-scaffolds the parent solution (CLI #2470)

  - type: command_executed
    description: "Agent scaffolded the agent project with uip agent init"
    tool_name: "Bash"
    command_pattern: 'uip\s+agent\s+init'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  # Outcome-based check (auto-registration via `uip <kind> init` OR explicit
  # `uip solution project add` both populate Projects[] in the .uipx).
  - type: run_command
    description: "Project is registered in the parent solution .uipx"
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-agents/_shared/project_files.py registered GreetSol --min-projects 1"
    timeout: 30
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent refreshed the project to regenerate derived files"
    tool_name: "Bash"
    command_pattern: 'uip\s+agent\s+refresh'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent validated the project"
    tool_name: "Bash"
    command_pattern: 'uip\s+agent\s+validate'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "GreeterAgent/agent.json was created"
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-agents/_shared/project_files.py exists GreetSol GreeterAgent agent.json"
    timeout: 30
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "entry-points.json was created inside the agent project"
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-agents/_shared/project_files.py exists GreetSol GreeterAgent entry-points.json"
    timeout: 30
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "flow-layout.json was created inside the agent project"
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-agents/_shared/project_files.py exists GreetSol GreeterAgent flow-layout.json"
    timeout: 30
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "project.uiproj was created inside the agent project"
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-agents/_shared/project_files.py exists GreetSol GreeterAgent project.uiproj"
    timeout: 30
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "Default evaluation set scaffolded (evaluation-set-default.json)"
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-agents/_shared/project_files.py exists GreetSol GreeterAgent evals/eval-sets/evaluation-set-default.json"
    timeout: 30
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "Default evaluator scaffolded (evaluator-default.json)"
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-agents/_shared/project_files.py exists GreetSol GreeterAgent evals/evaluators/evaluator-default.json"
    timeout: 30
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "Default trajectory evaluator scaffolded (evaluator-default-trajectory.json)"
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-agents/_shared/project_files.py exists GreetSol GreeterAgent evals/evaluators/evaluator-default-trajectory.json"
    timeout: 30
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "features/ directory exists and is empty"
    command: "test -d GreetSol/GreeterAgent/features && [ -z \"$(ls -A GreetSol/GreeterAgent/features)\" ]"
    timeout: 5
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "resources/ directory exists and is empty"
    command: "test -d GreetSol/GreeterAgent/resources && [ -z \"$(ls -A GreetSol/GreeterAgent/resources)\" ]"
    timeout: 5
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0
