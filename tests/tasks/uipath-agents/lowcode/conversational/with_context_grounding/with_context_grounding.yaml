task_id: skill-agent-conversational-with-context-grounding
description: >
  Positive integration test. Builds a conversational chatbot that
  answers product support questions by retrieving from a Context
  Grounding semantic index already deployed in the tenant. Verifies the
  skill teaches: conversational scaffold + 7-field fixup + context
  resource (`$resourceType: "context"`, `contextType: "index"`) wiring
  + uip solution resources refresh to produce `bindings_v2.json`. The
  context resource shape is identical to autonomous; only the agent.json
  shell (empty schemas, conversational engine, static user message)
  differs.
tags: [uipath-agents, integration, mode:build, lifecycle:generate, low-code, feature:conversational, context-grounding]
max_iterations: 1

agent:
  type: claude-code
  permission_mode: acceptEdits
  allowed_tools: ["Skill", "Bash", "Read", "Write", "Edit", "Glob", "Grep"]
run_limits:
  max_turns: 50
  turn_timeout: 1200

sandbox:
  python: {}

reference:
  directory: .

initial_prompt: |
  Create a UiPath low-code conversational agent "SupportBot" that
  answers customer product support questions. It should base its
  answers on our existing "UiPathAgentsProductKnowledge" knowledge
  index, which is already set up in our tenant, instead of answering
  from general knowledge. The solution should be named "SupportSol".

  Do NOT publish, upload, or deploy. Do NOT ask for approval,
  confirmation, or feedback. Do NOT pause between planning and
  implementation. Complete the entire task end-to-end in a single pass.

success_criteria:
  - type: run_command
    description: "A solution manifest (.uipx) or a project.uiproj exists in the workspace"
    command: |-
      python3 -c "import glob, sys; sys.exit(0 if glob.glob('**/*.uipx', recursive=True) or glob.glob('**/project.uiproj', recursive=True) else 1)"
    timeout: 10
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "The workspace has an Agent project (a project.uiproj with ProjectType Agent)"
    command: |-
      python3 -c "import glob, json, sys; sys.exit(0 if sum(json.load(open(f)).get('ProjectType') == 'Agent' for f in glob.glob('**/project.uiproj', recursive=True)) >= 1 else 1)"
    timeout: 10
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent discovered the index identity with uip solution resources list --kind Index"
    tool_name: "Bash"
    command_pattern: 'uip\s+solution\s+resources\s+list\b.*--kind\s+Index'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  # No `resources get` gate: it's optional — `resources list --kind Index` already
  # yields the index identity, so a correct artifact needs no `get`.

  - type: command_executed
    description: "Agent validated the project"
    tool_name: "Bash"
    command_pattern: 'uip\s+agent\s+validate'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent refreshed solution resources with uip solution resources refresh"
    tool_name: "Bash"
    command_pattern: 'uip\s+solution\s+resources\s+refresh'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: file_exists
    description: "SupportBot/agent.json was created"
    path: "SupportSol/SupportBot/agent.json"
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "A context resource bound to index UiPathAgentsProductKnowledge was created (folder name is the author's choice)"
    command: "grep -lE '\"indexName\"[[:space:]]*:[[:space:]]*\"UiPathAgentsProductKnowledge\"' SupportSol/SupportBot/resources/*/resource.json"
    timeout: 5
    expected_exit_code: 0
    weight: 2.5
    pass_threshold: 1.0

  - type: json_check
    description: "agent.json has conversational shape — isConversational true + engine conversational-v1"
    path: "SupportSol/SupportBot/agent.json"
    assertions:
      - expression: "metadata.isConversational"
        operator: "equals"
        expected: true
      - expression: "settings.engine"
        operator: "equals"
        expected: "conversational-v1"
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "Context resource shape, conversational schemas empty, bindings_v2.json index binding"
    command: "python3 $REFERENCE_DIR/check_context_index_conversational.py"
    timeout: 30
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0
