task_id: skill-agent-conversational-with-builtin-tool
description: >
  Positive integration test. Builds a conversational agent that uses a
  built-in tool (`analyze-attachments`). Verifies the skill teaches:
  conversational scaffold + 7-field fixup + built-in tool wiring
  together. Built-in tools use `type: "internal"` with
  `properties.toolType: "<kebab-id>"` and need no solution-level files
  (per Critical Rules 20-21). Test passes when the agent produces a
  validatable conversational project containing a properly-shaped
  built-in tool resource.
tags: [uipath-agents, integration, mode:build, lifecycle:generate, low-code, feature:conversational, tool, built-in]
max_iterations: 1

agent:
  type: claude-code
  permission_mode: acceptEdits
  allowed_tools: ["Skill", "Bash", "Read", "Write", "Edit", "Glob", "Grep"]
run_limits:
  max_turns: 50
  turn_timeout: 1200

sandbox:
  python: {}

initial_prompt: |
  Create a UiPath low-code conversational agent "DocAgent" that lets
  users upload documents or images and ask questions about their
  content (extract key points, summarize, describe an image, etc.).
  The solution should be named "DocSol".

success_criteria:
  - type: run_command
    description: "Solution DocSol exists (DocSol.uipx from uip solution init; in Studio Web the open solution)"
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-agents/_shared/project_files.py registered DocSol --min-projects 0"
    timeout: 30
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent scaffolded the agent project with uip agent init"
    tool_name: "Bash"
    command_pattern: 'uip\s+agent\s+init\b'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent validated the project"
    tool_name: "Bash"
    command_pattern: 'uip\s+agent\s+validate'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "DocAgent/agent.json was created"
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-agents/_shared/project_files.py exists DocSol DocAgent agent.json"
    timeout: 30
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: json_check
    description: "agent.json has conversational shape — isConversational true + engine conversational-v1"
    path: "DocSol/DocAgent/agent.json"
    assertions:
      - expression: "metadata.isConversational"
        operator: "equals"
        expected: true
      - expression: "settings.engine"
        operator: "equals"
        expected: "conversational-v1"
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "Built-in analyze-attachments tool is correctly wired (type: internal + properties.toolType)"
    command: "python3 $TASK_DIR/check_builtin_tool.py"
    timeout: 30
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0
