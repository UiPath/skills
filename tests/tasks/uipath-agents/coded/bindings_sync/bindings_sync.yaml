task_id: skill-agents-bindings-sync
description: >
  Skill-guided evaluation: agent uses the uipath-agents bindings skill to scan
  all Python files in a project (including helper modules), resolve module-level
  constants, and produce a correct bindings.json. Tests that the skill teaches
  scanning beyond main.py and constant resolution.
tags: [uipath-agents, smoke, mode:build, lifecycle:generate, coded, bindings]

run_limits:
  expected_turns: 15
  max_turns: 60
  turn_timeout: 1200

pre_run:
  - command: "cp -r $SKILLS_REPO_PATH/tests/tasks/uipath-agents/coded/_fixtures/bindings_sync/invoice-processor/. ."
    timeout: 10

initial_prompt: |
  My uipath coded agent's resources don't show up for override when I deploy
  it. Can you sort that out?

  It's already set up, so nothing to install or publish, and I don't need a
  report file. Complete the task end-to-end. Only stop if there is a critical
  blocker you cannot resolve.

success_criteria:
  - type: skill_triggered
    description: "Agent invoked the uipath-agents skill"
    skill_name: "uipath-agents"
    expected_skill: "uipath-agents"
    weight: 1.5
    pass_threshold: 1.0

  - type: file_exists
    description: "bindings.json exists"
    path: "bindings.json"
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "bindings.json is valid JSON"
    command: "python -c \"import json; json.load(open('bindings.json'))\""
    timeout: 10
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "Three deduped bindings with resolved constants, folder paths, and entrypoint links"
    command: "python3 $TASK_DIR/check_bindings_sync.py"
    timeout: 30
    expected_exit_code: 0
    weight: 6.0
    pass_threshold: 1.0
