task_id: skill-agent-coded-datafabric-nl-tool
description: >
  Coded-agent Data Fabric integration via NL-to-SQL tool. Agent discovers
  entities from the tenant, selects the right one, and wires
  create_datafabric_tool with entity config, prompt forwarding, and
  lazy init.
tags: [uipath-agents, e2e, mode:build, coded, lifecycle:generate, feature:entities]

run_limits:
  expected_turns: 60
  turn_timeout: 1200

initial_prompt: |
  Build me a coded agent called `product-explorer` that lets users
  ask any question they want about our product catalog. The data is
  in Data Fabric — find the right entity by listing what's available.
  I can't predict what users will ask ahead of time. The agent's
  instructions should apply consistently everywhere.

  Scaffold and init only — don't run or deploy.

success_criteria:
  - type: skill_triggered
    description: "Agent invoked the uipath-agents skill"
    skill_name: "uipath-agents"
    expected_skill: "uipath-agents"
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent ran uip codedagent init"
    tool_name: "Bash"
    command_pattern: 'uip\s+codedagent\s+init'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "create_datafabric_tool import, entity config, prompt forwarding, binding"
    command: "python3 $TASK_DIR/check_datafabric_nl_tool.py"
    timeout: 30
    expected_exit_code: 0
    weight: 6.0
    pass_threshold: 1.0
