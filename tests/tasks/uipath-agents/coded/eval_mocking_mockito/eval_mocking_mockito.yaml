task_id: skill-agent-coded-eval-mocking-mockito
description: >
  Coded-agent (LangGraph) eval lifecycle with the declarative mocking
  pattern (`mockingStrategy: mockito`) plus a structured-output
  evaluator. The agent reads an Orchestrator asset AND looks up a
  remote label via a helper; both external calls are registered with
  `@mockable` and mocked declaratively per test case. Output is
  structured JSON, eval'd with `JsonSimilarityEvaluator`. The full
  pipeline runs offline. Project files are pre-seeded via `pre_run`
  (fixtures in `_fixtures/`) so the eval grades mocking + evaluator
  wiring, not file transcription.
tags: [uipath-agents, e2e, coded, mode:build, feature:eval, feature:eval-mocking, feature:framework-langgraph]
max_iterations: 1

pre_run:
  - command: "cp -r $SKILLS_REPO_PATH/tests/tasks/uipath-agents/coded/eval_mocking_mockito/_fixtures/asset-retriever ."
    timeout: 10
  - command: "bash -c 'cd asset-retriever && uv sync && source .venv/bin/activate && uip codedagent setup --force'"
    timeout: 300

initial_prompt: |
  I have an existing LangGraph coded agent project at
  `asset-retriever/` (`main.py`, `langgraph.json`,
  `pyproject.toml`). It reads an Orchestrator asset from the Shared
  folder, masks its value, and fetches a human-readable label from
  a remote registry over HTTP.

  Add a smoke evaluation suite with 2–3 cases covering different
  asset values and run it locally. The evals must pass without
  `uip login`, without the `api_key` asset existing, and without the
  remote registry being reachable. Save the eval output to
  `eval-results.json` in the project root.

  For scoring, use a **structured-output evaluator** — we care
  about the shape of `{"masked_key": ..., "label": ...}`. Those
  should be as similar as possible to what we expect.

  Do NOT publish, upload, or deploy. Complete it in a single pass.

success_criteria:

  - type: command_executed
    description: "Agent ran uip codedagent init to generate entry-points.json"
    tool_name: "Bash"
    command_pattern: 'uip\s+codedagent\s+init'
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent ran the eval suite with --no-report (offline)"
    tool_name: "Bash"
    command_pattern: 'uip\s+codedagent\s+eval\s+.*--no-report'
    min_count: 1
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "Declarative mockito mocking wired + JsonSimilarity evaluator + offline eval results"
    command: "python3 $TASK_DIR/check_eval_mocking_mockito.py"
    timeout: 30
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0

run_limits:
  expected_turns: 45
  max_turns: 55
  turn_timeout: 1800
  task_timeout: 1800
