task_id: skill-agent-coded-eval-custom-evaluator
description: >
  Custom evaluator lifecycle. Verifies the skill guides the agent to scaffold
  a custom evaluator with `uip codedagent add evaluator`, implement it, and
  register it with `uip codedagent register evaluator` to generate the JSON
  spec. The evaluator must be wired into an eval set and run successfully
  (every case gets a numeric score; at least one scores > 0). Scenario: a
  `topic-detector` agent reads a short two-person conversation and names the
  topic discussed; the custom evaluator decides whether the detected topic
  is correct. Topic detection over free-form dialogue needs an LLM call, so
  the workload is genuinely agentic, and the lenient/synonym-aware
  correctness judgement is a natural custom-code fit that no built-in
  evaluator covers. Keep the prompt free of implementation hints (no
  framework, node, or matching mechanics).
tags: [uipath-agents, smoke, coded, mode:build, lifecycle:validate, feature:eval]

run_limits:
  expected_turns: 65
  turn_timeout: 1200
  task_timeout: 1800
  max_turns: 90

initial_prompt: |
  I want a small UiPath coded agent called `topic-detector`. Give it a
  short conversation — a few lines back and forth between two people —
  and it should tell me, in a word or two, what topic they were
  discussing.

  Once it's running locally, I want a custom evaluator for it — my own
  code, not one of the built-in ones — that decides whether the agent
  got the topic right for a given conversation. Be reasonable about
  wording: if the conversation is about fixing a car, "car repair" and
  "auto repair" should both count. Hook that evaluator up to an eval
  set with a couple of conversations and run it locally — no cloud
  reporting — and write the results out so I can review them.

  Build it here. It's all local — nothing to publish or deploy. Work
  straight through in one pass.

success_criteria:
  - type: command_executed
    description: "Agent scaffolded the custom evaluator with uip codedagent add evaluator"
    tool_name: "Bash"
    command_pattern: 'uip\s+codedagent\s+add\s+evaluator'
    min_count: 1
    weight: 2.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent registered the evaluator with uip codedagent register evaluator"
    tool_name: "Bash"
    command_pattern: 'uip\s+codedagent\s+register\s+evaluator'
    min_count: 1
    weight: 2.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent ran the eval suite with --no-report"
    tool_name: "Bash"
    command_pattern: 'uip\s+codedagent\s+eval\s+.*--no-report'
    min_count: 1
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "Custom evaluator file, JSON spec, eval set, and results shape"
    command: "python3 $TASK_DIR/check_eval_custom_evaluator.py"
    timeout: 30
    expected_exit_code: 0
    weight: 5.0
    pass_threshold: 1.0
