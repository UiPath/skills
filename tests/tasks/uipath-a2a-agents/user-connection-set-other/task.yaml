task_id: skill-a2a-agents-user-connection-set-other
description: |
  Give one user their own Integration Service connection on a remote A2A agent, leaving the agent's connection for everyone else. Exercises Per-User Connections and Critical Rules 5 and 8: `uip agenthub remote-a2a-agent-user-connections set` for that user (`--user-email` / `--user-id`) and connection (`--connection-id` / `--connection-name`), after a `--dry-run`, never `--me` and never `remote-a2a-agent update --connection-id` (which would change it for every user). The prompt asks for exactly that user, so the agent need not ask first. Graded from the uip mock's call log. Uses the manifest-driven uip mock — no real tenant call.
tags: [uipath-a2a-agents, smoke, 'mode:build', 'lifecycle:setup']
agent:
  type: claude-code
  allowed_tools: [Skill, Bash, Read, Write]
sandbox:
  python: {}
  template_sources:
  - {type: template_dir, path: ../_shared/mock_template}
  - {type: template_dir, path: fixtures}
  mock_path_dirs: [mocks]
reference:
  directory: .
initial_prompt: |
  Use the `uip` CLI as if it were the real UiPath CLI (it is mocked in this
  sandbox; manifest-driven canned responses).

  TASK: On the remote A2A agent foundry-agent in Agent Gateway, in the Shared
  folder, Jane Doe (jane.doe@example.com) should call with her own OAuth Agent
  2 Agent connection "Foundry (Jane)" instead of the agent's connection.
  Everyone else keeps using the agent's connection. Set that up for Jane.
success_criteria:
- type: run_command
  description: 'A successful `remote-a2a-agent-user-connections set --agent foundry-agent` named Jane and her connection in the Shared folder after a --dry-run; no set used --me, another user or another connection; the agent''s own connection unchanged'
  command: python3 $REFERENCE_DIR/check_user_connection_set_other.py
  timeout: 30
  expected_exit_code: 0
  weight: 3.0
- type: command_not_executed
  description: Agent did NOT delete a per-user connection
  tool_name: Bash
  command_pattern: 'uip\s+agenthub\s+remote-a2a-agent-user-connections\s+delete\b(?![^\n]*--(dry-run|help))'
- type: command_not_executed
  description: Agent did NOT create, edit or delete an Integration Service connection
  tool_name: Bash
  command_pattern: 'uip\s+is\s+connections\s+(create|edit|delete|rename|set-default)\b'
run_limits: {max_turns: 60}
