task_id: skill-hitl-quality-runtime-vars
description: >
  Quality test: after adding a HITL node, agent must wire a downstream
  script node that correctly references $vars.<NodeId>.output and
  uses the reviewer's chosen outcome ($vars.<NodeId>.output.Action, or
  $vars.<NodeId>.status). Tests G1 and G2.
tags: [uipath-human-in-the-loop, integration, runtime-variables]

run_limits:
  expected_turns: 23
  max_turns: 50
  turn_timeout: 600

reference:
  directory: ../uipath-maestro-flow

initial_prompt: |
  Create a flow called "ReviewAndRoute" with:
  1. A manual trigger
  2. A HITL node (label: "Review Decision")
  3. A script node after HITL that reads the human's decision and logs it

  The script node must read the reviewer's decision via the HITL output
  runtime variable ($vars.<nodeId>.output) and ALSO use the outcome the
  reviewer chose. Wire the node's outcome port(s) to the script node.
  Validate the flow.
  Do NOT ask for approval, confirmation, or feedback. Do NOT pause between planning and implementation. Build the complete flow end-to-end in a single pass.

success_criteria:
  - type: run_command
    description: "HITL node with specified ID is present in the flow file"
    command: "python3 $REFERENCE_DIR/_shared/flow_contains.py --flow-name ReviewAndRoute '\"uipath.human-in-the-loop.quick-form\"'"
    timeout: 30
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent validated the flow"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+(maestro\s+)?flow\s+validate.*--output\s+json'
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "uip flow validate passes"
    command: "python3 $REFERENCE_DIR/_shared/validate_flow.py"
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "Downstream script references the HITL output runtime variable"
    command: "python3 $REFERENCE_DIR/_shared/flow_contains.py --flow-name ReviewAndRoute --regex '\\$vars\\.[A-Za-z0-9_-]+\\.output'"
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  # `uip maestro flow check` rejects a script read of `$vars.<id>.status`
  # (HITL_READ_STATUS) and points to the same value on the output object,
  # `.output.Action` (the node maps status from `=result.Action`). `flow validate`
  # still accepts `.status`, so both reads pass here; dropping the `.status`
  # alternative would make the test require obeying `flow check`.
  - type: run_command
    description: "Downstream script uses the reviewer's chosen outcome (.Action in a script node, or $vars.<id>.status)"
    command: "python3 $REFERENCE_DIR/_shared/flow_contains.py --flow-name ReviewAndRoute --regex '\\$vars\\.[A-Za-z0-9_-]+\\.status|\"script\"\\s*:\\s*\"(?:[^\"\\\\]|\\\\.)*?\\.Action\\b'"
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

