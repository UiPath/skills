task_id: skill-hitl-e2e-gdpr-compliance-greenfield
# NOTE: "e2e" here means authoring end-to-end (greenfield JSON flow authoring).
# This test does NOT deploy or execute the flow — it only validates the authored
# .flow file JSON and the skill's ability to author compliance-pattern HITL nodes.
description: >
  Authoring E2E golden scenario (green field): agent builds a GDPR deletion
  request flow with a privacy officer sign-off checkpoint. Tests proactive
  compliance pattern detection and schema design with Reject path. Real
  business use case. Full Discover -> Plan -> Build -> Verify loop. Does not
  deploy or run the flow.
tags: [uipath-human-in-the-loop, e2e, green-field, compliance, gdpr]

run_limits:
  expected_turns: 22
  max_turns: 60
  turn_timeout: 1200

initial_prompt: |
  Build a UiPath Flow named "GdprDeletionApproval" that processes GDPR
  data deletion requests. Each request must be reviewed and signed off by
  a privacy officer before the deletion runs — we need an audit trail for
  every decision.

  Give the privacy officer Approve and Reject outcomes.

  Validate the flow when you're done.
  Do NOT ask for approval, confirmation, or feedback. Do NOT pause between planning and implementation. Build the complete flow end-to-end in a single pass.

success_criteria:
  - type: run_command
    description: "Flow file was created at the expected path"
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/_shared/flow_contains.py --flow-name GdprDeletionApproval"
    timeout: 30
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "Flow contains the inline HITL node type"
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/_shared/flow_contains.py --flow-name GdprDeletionApproval '\"uipath.human-in-the-loop.quick-form\"'"
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "Flow exposes Approve and Reject outcomes"
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/_shared/flow_contains.py --flow-name GdprDeletionApproval 'Approve' 'Reject'"
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "Flow wires the completed handle"
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/_shared/flow_contains.py --flow-name GdprDeletionApproval 'completed'"
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent ran flow validate during the session"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+(maestro\s+)?flow\s+validate.*--output\s+json'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "uip flow validate passes against the authored .flow file"
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/_shared/validate_flow.py"
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
