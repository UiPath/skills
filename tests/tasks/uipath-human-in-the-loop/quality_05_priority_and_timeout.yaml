task_id: skill-hitl-quality-priority-timeout
description: >
  Quality test: agent must configure a high-priority HITL node for a
  financial compliance check. Tests C3 (priority).
tags: [uipath-human-in-the-loop, integration, options]

run_limits:
  expected_turns: 16
  max_turns: 50
  task_timeout: 500
  turn_timeout: 600

initial_prompt: |
  Add a Human-in-the-Loop node to a new flow called "FinanceCompliance".
  This is a financial compliance check — set it to HIGH priority.

  Wire the completed handle to a script node that logs the approval.
  Validate the flow after adding.
  Do NOT ask for approval, confirmation, or feedback. Do NOT pause between planning and implementation. Build the complete flow end-to-end in a single pass.

success_criteria:
  - type: run_command
    description: "HITL node priority is set to High"
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/_shared/flow_contains.py --flow-name FinanceCompliance '\"High\"'"
    timeout: 30
    expected_exit_code: 0
    weight: 2.5
    pass_threshold: 1.0

  - type: run_command
    description: "HITL node is present in the flow file"
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/_shared/flow_contains.py --flow-name FinanceCompliance '\"uipath.human-in-the-loop.quick-form\"'"
    timeout: 30
    expected_exit_code: 0
    weight: 2.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent validated the flow"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+(maestro\s+)?flow\s+validate.*--output\s+json'
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "uip flow validate passes"
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/_shared/validate_flow.py"
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

