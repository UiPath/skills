task_id: skill-hitl-e2e-invoice-approval-greenfield
description: >
  E2E golden scenario (green field), asked the way a Studio Web user would ask
  it: build an invoice approval flow in which finance signs off in Action
  Center before an invoice is posted to SAP (the posting is a stand-in step).
  Graded on a real run: the grader debugs the flow with a fresh invoice
  number, finds the Action Center task that run created, checks it shows the
  invoice number, vendor, amount and currency, approves it as the finance
  manager, and checks the run then completed down the Approve path only, with
  status=posted and sapDocumentNumber=SAP-<invoice>; then a second run is
  rejected and must complete with nothing on the Approve path run,
  status=rejected and an empty sapDocumentNumber. The SAP posting stand-in
  must sit behind the approval. Structural checks accept any outcome layout.
  Text between the helper markers is lower-tier guidance
  (experiments/use-case-tiers.yaml) and is not graded.
tags: [uipath-human-in-the-loop, e2e, green-field, invoice, approval-gate, write-back, path-to-ga, outcome-graded]

run_limits:
  expected_turns: 34
  max_turns: 50
  # task_timeout must be >= turn_timeout or it silently becomes the binding
  # cap (nightly default task_timeout 1200 / turn_timeout 900). The posting
  # stays a stand-in so the test exercises the human task, not SAP. The
  # task budget covers one agent turn plus grading: validate (180s) and two
  # live runs that wait on the task (up to 1800s).
  task_timeout: 3600
  turn_timeout: 1200

sandbox:
  template_sources:
    - type: template_dir
      path: ../uipath-maestro-flow/_setup
      mount_point: _setup

reference:
  directory: ../uipath-maestro-flow

pre_run:
  - command: python3 _setup/cleanup_hitl_runs.py mark
    timeout: 30

post_run:
  - command: python3 _setup/cleanup_hitl_runs.py clean
    timeout: 300
  - command: python3 _setup/cleanup_solutions.py
    timeout: 90

initial_prompt: |
  You are a coding agent in an empty Flow project. No user is present, and
  nobody will answer a question or grant approval, so do not ask, do not
  pause, and do not wait for input. Do not delete or overwrite anything this
  run did not create, except what the task asks you to change, and do not
  publish to a shared destination unless the task asks for it.

  Build an automation called "InvoiceApproval". Our invoices arrive already
  extracted, each with an invoiceNumber, vendorName, totalAmount and currency.
  Finance has to approve every invoice before it is posted to SAP; we cannot
  write to SAP without a human sign-off.

  Send the finance manager a task in Action Center that shows the invoice
  number, vendor, total amount and currency, and lets them Approve or Reject
  it with an optional comment. Nobody on the finance team is set up yet to
  process these tasks.

  - If they approve, post the invoice to SAP. The SAP connection isn't ready,
    so for now, instead of posting, return the SAP document number "SAP-"
    followed by the invoice number.
  - If they reject, post nothing.

  Outputs: status ("posted" or "rejected") and sapDocumentNumber (empty when
  rejected).

  <!-- helper:start -->
  Inputs: invoiceNumber (string), vendorName (string), totalAmount (number),
  currency (string).
  Outputs: status (string), sapDocumentNumber (string). status is "posted" or
  "rejected". When approved, sapDocumentNumber is "SAP-" followed by the
  invoiceNumber, like "SAP-INV-1". When rejected it is empty text.
  The step that builds the "SAP-" number goes after the approval, never
  before it.
  <!-- helper:end -->

  Build and test the automation.

success_criteria:
  - type: run_command
    description: "Flow file was created at the expected path"
    command: "python3 $REFERENCE_DIR/_shared/flow_contains.py --flow-name InvoiceApproval"
    timeout: 30
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "Advisory: Flow contains the inline HITL node type"
    command: "python3 $REFERENCE_DIR/_shared/flow_contains.py --flow-name InvoiceApproval --regex '\"type\":\\s*\"uipath\\.human-in-the-loop(\\.quick-form)?\"'"
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 0.0

  - type: run_command
    description: "Advisory: Flow exposes Approve and Reject outcomes"
    command: "python3 $REFERENCE_DIR/_shared/flow_contains.py --flow-name InvoiceApproval 'Approve' 'Reject'"
    timeout: 30
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 0.0

  - type: run_command
    description: "Advisory: Every outcome on the HITL node has its own wired port, none on the outcome-completed placeholder"
    command: "python3 $REFERENCE_DIR/_shared/check_simulated_hitl.py outcome-wiring"
    timeout: 30
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 0.0

  - type: run_command
    description: "uip maestro flow validate passes against the authored .flow file"
    command: "python3 $REFERENCE_DIR/_shared/validate_flow.py"
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  # Advisory: Studio Web agents may test with the RunProject proxy tool, which
  # the eval testbench stubs; and a run of this flow waits on a person.
  - type: command_executed
    description: "Advisory: the agent ran its own test run (uip maestro flow debug), as the request asks"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+flow\s+debug(?!-instance)(?!\s+--help)'
    min_count: 1
    weight: 1.0
    pass_threshold: 0.0

  - type: run_command
    description: "Effects: the SAP posting stand-in sits behind the approval; a real run created an Action Center task showing the run's invoice number, Northwind Office Supplies, 4870.25 and EUR; after the grader approved it the run completed, a step reachable only from Approve ran when there is one and none reachable only from Reject did, and the outputs are status=posted and sapDocumentNumber=SAP-<invoice>; a second run the grader rejected completed with no step reachable only from Approve run, status=rejected and sapDocumentNumber empty"
    command: "python3 $REFERENCE_DIR/_shared/check_hitl_invoice_approval_run.py"
    # Two runs, each with a 600s deadline that bounds every uip call, then a cancel.
    timeout: 1800
    expected_exit_code: 0
    weight: 6.0
    pass_threshold: 1.0
