task_id: skill-hitl-e2e-invoice-approval-greenfield
# NOTE: "e2e" here means authoring end-to-end (greenfield JSON flow authoring).
# This test does NOT deploy or execute the flow — it only validates the authored
# .flow file JSON and the skill's ability to design and wire HITL nodes.
description: >
  Authoring E2E golden scenario (green field): agent builds a complete invoice
  approval flow from scratch — detecting write-back + approval gate signals,
  designing schema, adding HITL node, wiring all handles, and validating the
  authored .flow file. Real business use case. Full Discover -> Plan -> Build -> Verify loop.
  Does not deploy or run the flow.
tags: [uipath-human-in-the-loop, e2e, green-field, invoice, approval-gate, write-back, path-to-ga]

run_limits:
  expected_turns: 19
  max_turns: 60
  # task_timeout must be >= turn_timeout or it silently becomes the binding
  # cap regardless of the larger per-turn budget below — nightly experiment
  # default is task_timeout 1200 / turn_timeout 900 (tests/experiments/
  # nightly.yaml). This test declared turn_timeout 2400 without also raising
  # task_timeout (previously fixed in 34aa3c773, since lost) so it kept
  # inheriting the 1200s default and dying mid-first-turn at exactly that
  # mark, confirmed on 2026-09-10 run 2026-09-10_04-18-49 ("Task timed out
  # after 1200s", iteration_count 1) and fixed to 2400/2400 in #3196.
  # 2400 still wasn't enough: 2026-09-11 run 2026-09-11_04-17-20 ran the full
  # 2400s and timed out again ("Agent turn timed out after 2400s", iteration
  # 1, 119 assistant turns, max_turns_exhausted False). The iteration log
  # shows real forward progress the whole time, not a loop: live SharePoint/
  # SAP connection discovery, IXP taxonomy lookup for invoice extraction, and
  # registry lookups for every node type, each a real network round trip,
  # before the agent even started writing the flow JSON around the 25-minute
  # mark. Raised to 3600, matching the established heavy-single-turn budget
  # used elsewhere in the repo (e.g. uipath-maestro-bpmn's external_wait and
  # high_volume_batch tasks).
  task_timeout: 3600
  turn_timeout: 3600

initial_prompt: |
  Build a UiPath Flow named "InvoiceApproval" that extracts invoice data
  from a SharePoint folder and posts the approved invoices to SAP. Finance
  needs to review and approve each invoice before it is posted — we cannot
  write to SAP without human sign-off.

  Show the finance manager the relevant invoice fields, give them Approve and
  Reject outcomes, and wire both outcomes onward — Approve to the downstream
  SAP posting step, Reject to wherever the flow should end. Every outcome
  needs its own wired port.

  Validate the flow when you're done.
  Do NOT ask for approval, confirmation, or feedback. Do NOT pause between planning and implementation. Build the complete flow end-to-end in a single pass.

success_criteria:
  - type: run_command
    description: "Flow file was created at the expected path"
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/_shared/flow_contains.py --flow-name InvoiceApproval"
    timeout: 30
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "Flow contains the inline HITL node type"
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/_shared/flow_contains.py --flow-name InvoiceApproval '\"uipath.human-in-the-loop.quick-form\"'"
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "Flow exposes Approve and Reject outcomes"
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/_shared/flow_contains.py --flow-name InvoiceApproval 'Approve' 'Reject'"
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "Flow wires both Approve and Reject outcome ports, not the outcome-completed placeholder"
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/_shared/flow_contains.py --flow-name InvoiceApproval --regex '\"sourcePort\":\\s*\"outcome-approve\"' --regex '\"sourcePort\":\\s*\"outcome-reject\"' --absent-regex '\"sourcePort\":\\s*\"(outcome-)?completed\"'"
    timeout: 30
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "Downstream step references $vars.<hitl-node-id>.output"
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/_shared/flow_contains.py --flow-name InvoiceApproval --regex '\\$vars\\.[A-Za-z0-9_-]+\\.output'"
    timeout: 30
    expected_exit_code: 0
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent ran flow validate during the session"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+(maestro\s+)?flow\s+validate.*--output\s+json'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: run_command
    description: "uip flow validate passes against the authored .flow file"
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-maestro-flow/_shared/validate_flow.py"
    timeout: 30
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0
