task_id: skill-hitl-e2e-apptask-brownfield
description: >
  E2E brown field (AppTask surface), asked the way a Studio Web user would ask
  it: the project already holds an ExpenseAppTask flow that posts expenses to
  SAP (a stand-in step); add a manager review before the posting using the
  tenant's deployed ExpenseReviewApp Action Center app
  (Shared/uipath-agents/ExpenseReviewSol). Graded on a real run: the grader
  debugs the flow with a fresh expense id, finds the app task that run
  created, checks it shows the expense id, employee and amount, approves it,
  and checks the run then completed through the existing posting step with
  status=posted and sapDocumentNumber=SAPEXP-<id>; then a second run is
  rejected and must complete without the posting step, with status=rejected.
  The posting step must sit behind the review. A structural check asks only
  that the review step is backed by ExpenseReviewApp, not a quick form.
  Text between the helper markers is lower-tier guidance
  (experiments/use-case-tiers.yaml) and is not graded.
tags: [uipath-human-in-the-loop, e2e, brown-field, apptask, path-to-ga, outcome-graded]
run_limits:
  expected_turns: 25
  max_turns: 60
  # task_timeout must be >= turn_timeout or the nightly default (1200s)
  # silently caps this. It covers one agent turn plus grading: validate (180s)
  # and two live runs that wait on the app task (up to 1800s).
  task_timeout: 4200
  turn_timeout: 1800

sandbox:
  template_sources:
    - type: template_dir
      path: _fixtures/e2e_07_apptask_brownfield
    - type: template_dir
      path: ../uipath-maestro-flow/_setup
      mount_point: _setup

reference:
  directory: ../uipath-maestro-flow

# A fresh SolutionId per run, so concurrent runs never upload over each other
# in Studio Web and post_run deletes only this run's debug solution.
pre_run:
  - command: "python3 -c \"import json,uuid;p='ExpenseAppTask/ExpenseAppTask.uipx';d=json.load(open(p));d['SolutionId']=str(uuid.uuid4());json.dump(d,open(p,'w'),indent=2)\""
    timeout: 30
  - command: python3 _setup/cleanup_hitl_runs.py mark
    timeout: 30

post_run:
  - command: python3 _setup/cleanup_hitl_runs.py clean
    timeout: 300
  - command: python3 _setup/cleanup_solutions.py
    timeout: 90

initial_prompt: |
  You are a coding agent in UiPath Studio Web in a Studio Web project that
  already contains the ExpenseAppTask flow, which posts employee expenses to
  SAP. No user is present, and nobody will answer a question or grant
  approval, so do not ask, do not pause, and do not wait for input.

  Managers now have to review every expense before it is posted. Add that
  review to the process using our existing "ExpenseReviewApp" Action Center
  app in Shared/uipath-agents/ExpenseReviewSol as the task form. The reviewer
  should see the expense id, employee, amount and description.

  - Post to SAP only when the manager approves.
  - When they reject, end the flow with the status "rejected".

  Leave the rest of the flow as it is.

  <!-- helper:start -->
  ExpenseReviewApp has one text input, Content (string), and its outcomes are
  approve and reject.
  Inputs: expenseId (string), employeeName (string), amount (number),
  description (string).
  Outputs: status (string), sapDocumentNumber (string). status is "posted" or
  "rejected". When approved, sapDocumentNumber is "SAPEXP-" followed by the
  expenseId, built by the existing posting step.
  <!-- helper:end -->

  Build and do a test run.

success_criteria:
  - type: run_command
    description: "uip maestro flow validate passes against the edited .flow file"
    command: "python3 $REFERENCE_DIR/_shared/validate_flow.py"
    timeout: 180
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "The review step is backed by the deployed ExpenseReviewApp (by name, resource key or system name), not a quick form, and the existing SAP posting step is kept"
    command: "python3 $REFERENCE_DIR/_shared/check_hitl_expense_apptask_run.py structure"
    timeout: 30
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  # Advisory: Studio Web agents may test with the RunProject proxy tool, which
  # the eval testbench stubs; and a run of this flow waits on a person.
  - type: command_executed
    description: "Advisory: the agent ran its own test run (uip maestro flow debug), as the request asks"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+maestro\s+flow\s+debug(?!-instance)(?!\s+--help)'
    min_count: 1
    weight: 1.0
    pass_threshold: 0.0

  - type: run_command
    description: "Effects: the existing SAP posting step sits behind the review; a real run created an Action Center app task whose data shows the run's expense id, Dana Whitfield and 1840.5; after the grader approved it the run completed, the review and the posting step completed, and the outputs are status=posted and sapDocumentNumber=SAPEXP-<id>; a second run the grader rejected completed without the posting step, with status=rejected"
    command: "python3 $REFERENCE_DIR/_shared/check_hitl_expense_apptask_run.py run"
    # Two runs, each with a 600s deadline that bounds every uip call, then a cancel.
    timeout: 1800
    expected_exit_code: 0
    weight: 6.0
    pass_threshold: 1.0
