task_id: skill-pm-publish-promote-to-dashboards
description: >
  Critical Rule 8 and the publish loop, neither of which any other task
  touches: `apps publish` promotes the dev definition (mapping +
  transformations + data model) to the published stage, but it promotes the
  DEFINITION, not the rows — the result carries `IngestionNeeded: true` and the
  published data is stale until `ingestions create --wait` runs against it.

  Command-construction only — no live tenant. Commands fail with auth errors;
  what matters is which commands the agent chooses and in what order.
tags: [uipath-process-mining, integration, mode:operate, lifecycle:setup, lifecycle-stages, publish]

run_limits:
  expected_turns: 6
  max_turns: 25
  turn_timeout: 600

initial_prompt: |
  My Process Mining app (app id 9c46289e) is finished on dev — the mapping is
  right, the transformations build, and my custom table queries correctly
  against the sample I loaded. Roll it out so the wider team can use the
  dashboards on the full dataset.

  Use the uipath-process-mining skill and follow its workflow.

  Important:
  - The `uip` CLI is available but is not connected to a live tenant.
    Commands WILL fail with auth errors — that is expected and acceptable.
    Run each command exactly once regardless of errors.
    Do NOT retry, do NOT attempt to login, do NOT troubleshoot errors.
  - Do NOT prompt the user for confirmation — this is an automated test.

success_criteria:

  - type: skill_triggered
    description: "Agent activated the uipath-process-mining skill"
    skill_name: "uipath-process-mining"
    expected_skill: "uipath-process-mining"
    weight: 1.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent promoted the validated dev app to the published stage"
    tool_name: "Bash"
    command_pattern: 'uip\s+pm\s+apps\s+publish\b'
    min_count: 1
    weight: 3.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent re-ingested, since publish answers IngestionNeeded and moves no rows"
    tool_name: "Bash"
    command_pattern: 'uip\s+pm\s+ingestions\s+create\b'
    min_count: 1
    weight: 2.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent blocked on the async ingestion instead of hand-rolling a poll loop"
    tool_name: "Bash"
    command_pattern: 'uip\s+pm\s+ingestions\s+create\b[\s\S]*--wait\b'
    min_count: 1
    weight: 2.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent must NOT hand-roll an apps list poll loop instead of --wait"
    tool_name: "Bash"
    command_pattern: 'while\s+[\s\S]*uip\s+pm\s+apps\s+list\b'
    weight: 1.5
