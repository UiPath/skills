task_id: skill-pm-set-miner-in-place
description: >
  The user wants conformance checking on an app created with the default
  directly-follows miner. Tests that the agent switches the miner IN PLACE with
  `apps data-model set-miner --miner inductive` and then re-ingests, instead of
  creating a new app with `apps create --miner inductive` — which throws away
  the mapping fixes and transformations already made on the app.

  Also pins the re-ingest: the process graph is mined while ingesting, so the
  new miner only takes effect on the next `ingestions create`, not on
  `transformations apply`.

  Command-construction only — no live tenant. Commands fail;
  what matters is which commands the agent chooses.
tags: [uipath-process-mining, integration, mode:build, lifecycle:setup, data-model, miner]

run_limits:
  expected_turns: 6
  max_turns: 25
  turn_timeout: 600

initial_prompt: |
  My Process Mining app (app id 9c46289e) was created with the default
  directly-follows miner. Its data is loaded and I already fixed its mapping
  and transformations. Now I want to run conformance checking on it, which
  needs the inductive miner. Switch it over.

  Use the uipath-process-mining skill and follow its workflow.

  Important:
  - The `uip` CLI is available but is not connected to a live tenant.
    Commands WILL fail — that is expected and acceptable.
    Run each command exactly once regardless of errors.
    Do NOT retry, do NOT attempt to login, do NOT troubleshoot errors.
  - Do NOT prompt the user for confirmation — this is an automated test.

success_criteria:

  - type: skill_triggered
    description: "Agent activated the uipath-process-mining skill"
    skill_name: "uipath-process-mining"
    expected_skill: "uipath-process-mining"
    weight: 1.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent switched the existing app's miner in place"
    tool_name: "Bash"
    command_pattern: 'uip\s+pm\s+apps\s+data-model\s+set-miner\b(?=(?:(?!\n|&&|\|\||;|\||\s(?:uip|\$UIP)\s).)*\b9c46289e\b)(?:(?!\n|&&|\|\||;|\||\s(?:uip|\$UIP)\s).)*--miner[\s=]+["'']?inductive\b'
    min_count: 1
    weight: 3.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent re-ingested, since the process is re-mined only on the next ingestion"
    tool_name: "Bash"
    command_pattern: 'uip\s+pm\s+ingestions\s+create\b(?:(?!\n|&&|\|\||;|\||\s(?:uip|\$UIP)\s).)*\b9c46289e\b'
    min_count: 1
    weight: 2.5
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent must NOT create a new app to get a different miner"
    tool_name: "Bash"
    command_pattern: 'uip\s+pm\s+apps\s+create\b'
    weight: 2.5

  - type: command_not_executed
    description: "Agent must NOT delete the app"
    tool_name: "Bash"
    command_pattern: 'uip\s+pm\s+apps\s+delete\b'
    weight: 2.0

  - type: command_not_executed
    description: "Agent must NOT edit the data model through the REST API"
    tool_name: "Bash"
    command_pattern: '(curl|wget|Invoke-(RestMethod|WebRequest))\b[^\n]*dataModel'
    weight: 1.5
