task_id: skill-pm-data-model-inspect-smoke
description: >
  Read-only smoke: which tables are registered in the app's data model, and how
  do they link to `Cases`? Foreign keys live only in the STRUCTURAL data model
  (`apps data-model get`, /dev/dataModel), not in the semantic model
  (`apps model get`, /dev/model) — the two-namespace distinction the skill
  spends a reference table on, and the one an agent most often collapses.

  Pins the read half of the add-table workflow: inspect what is registered
  before adding to it. Paired with add_table_queryable, which pins the write.

  Command-construction only — no live tenant. Commands fail with auth errors;
  what matters is which namespace the agent reaches for.
tags: [uipath-process-mining, smoke, mode:diagnose, lifecycle:discover, data-model]

run_limits:
  expected_turns: 4
  max_turns: 20

initial_prompt: |
  For my Process Mining app (app id 9c46289e), show me which tables are
  registered in its data model and how each one links back to Cases — I want
  to see the primary keys and foreign keys before I add another table.

  Use the uipath-process-mining skill and follow its workflow.

  Important:
  - The `uip` CLI is available but is not connected to a live tenant.
    Commands WILL fail with auth errors — that is expected and acceptable.
    Run each command exactly once regardless of errors.
    Do NOT retry, do NOT attempt to login, do NOT troubleshoot errors.
  - Do NOT prompt the user for confirmation — this is an automated test.

success_criteria:

  - type: skill_triggered
    description: "Agent activated the uipath-process-mining skill"
    skill_name: "uipath-process-mining"
    expected_skill: "uipath-process-mining"
    weight: 1.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent read the structural data model, where primaryKey/foreignKeys live"
    tool_name: "Bash"
    command_pattern: 'uip\s+pm\s+apps\s+data-model\s+get\b'
    min_count: 1
    weight: 3.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent must NOT mutate the data model on a read-only request"
    tool_name: "Bash"
    command_pattern: 'uip\s+pm\s+apps\s+data-model\s+add-table\b'
    weight: 2.0

  - type: command_not_executed
    description: "Agent must NOT re-ingest on a read-only request"
    tool_name: "Bash"
    command_pattern: 'uip\s+pm\s+ingestions\s+create\b'
    weight: 1.5
