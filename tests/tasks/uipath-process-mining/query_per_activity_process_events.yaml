task_id: skill-pm-query-per-activity-process-events
description: >
  Critical Rule 7, event-table half: fields of the raw event-log table
  (`Event_log`) are refused in queries (`UserError_EventTableUsedInQuery`), and
  the same events are queryable, mined, on the process events table
  (`__Process_Events`). Tests that an agent asked for cases per activity groups
  by the process's activity field (`PF__Process_Events___InternalField_Activity`,
  or the `Events.Activity` id read from `query info`) instead of a plain
  `--group-by Activity`, which resolves to `Event_log` and fails.

  Command-construction only — no live tenant. Commands fail;
  what matters is the shape of the query the agent constructs.
tags: [uipath-process-mining, smoke, mode:diagnose, lifecycle:discover, query, aggregate]

run_limits:
  expected_turns: 6
  max_turns: 25
  turn_timeout: 600

initial_prompt: |
  My Process Mining app (app id 9c46289e) is loaded and transformed. For each
  activity in the process, how many distinct cases pass through it? Show it as
  a readable table. Use the uipath-process-mining skill and follow its
  workflow.

  Important:
  - The `uip` CLI is available but is not connected to a live tenant.
    Commands WILL fail — that is expected and acceptable.
    Run each command exactly once regardless of errors.
    Do NOT retry, do NOT attempt to login, do NOT troubleshoot errors.
  - Do NOT prompt the user for confirmation — this is an automated test.

success_criteria:

  - type: skill_triggered
    description: "Agent activated the uipath-process-mining skill"
    skill_name: "uipath-process-mining"
    expected_skill: "uipath-process-mining"
    weight: 1.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent grouped by the process events table's activity field (or a variable read from query info)"
    tool_name: "Bash"
    command_pattern: 'uip\s+pm\s+query\s+run\b(?:(?!\n|&&|\|\||;|\||\s(?:uip|\$UIP)\s).)*--group-by[\s=]+["'']?(PF__Process_Events__\S*Activity|\$)'
    min_count: 1
    weight: 3.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent must NOT group by the plain Activity column, which lands on the refused Event_log table"
    tool_name: "Bash"
    command_pattern: 'uip\s+pm\s+query\s+run\b(?:(?!\n|&&|\|\||;|\||\s(?:uip|\$UIP)\s).)*--group-by[\s=]+["'']?Activity\b'
    weight: 2.5

  - type: command_not_executed
    description: "Agent must NOT query a field of the raw Event_log table"
    tool_name: "Bash"
    command_pattern: 'uip\s+pm\s+query\s+run\b(?:(?!\n|&&|\|\||;|\||\s(?:uip|\$UIP)\s).)*F__Event_log__'
    weight: 2.0
