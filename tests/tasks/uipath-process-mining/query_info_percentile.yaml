task_id: skill-pm-query-info-percentile
description: >
  Critical Rule 7's mechanism, not just its sugar: query bodies take hashed
  `F__<Table>__<Col>__<hash>` field ids, and the only way to learn them is
  `query info`. `percentile` has no `--group-by/--metric` shorthand to hide
  that — it takes `--field <id>` directly, so an agent that skips discovery
  and guesses a column name gets `UserError_FieldNotFound`.

  Complements query_group_by_sugar, which covers the sugar path where ids are
  resolved for the agent.

  Command-construction only — no live tenant. Commands fail with auth errors;
  what matters is the shape of the query the agent constructs.
tags: [uipath-process-mining, smoke, mode:diagnose, lifecycle:discover, query, percentile]

run_limits:
  expected_turns: 6
  max_turns: 25
  turn_timeout: 600

initial_prompt: |
  My Process Mining app (app id 9c46289e) is loaded and transformed. Give me
  the median and 90th percentile of case throughput time.

  Use the uipath-process-mining skill and follow its workflow.

  Important:
  - The `uip` CLI is available but is not connected to a live tenant.
    Commands WILL fail with auth errors — that is expected and acceptable.
    Run each command exactly once regardless of errors.
    Do NOT retry, do NOT attempt to login, do NOT troubleshoot errors.
  - Do NOT prompt the user for confirmation — this is an automated test.

success_criteria:

  - type: skill_triggered
    description: "Agent activated the uipath-process-mining skill"
    skill_name: "uipath-process-mining"
    expected_skill: "uipath-process-mining"
    weight: 1.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent discovered the queryable model before writing a query body"
    tool_name: "Bash"
    command_pattern: 'uip\s+pm\s+query\s+info\b'
    min_count: 1
    weight: 3.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent ran percentile against a field id"
    tool_name: "Bash"
    command_pattern: 'uip\s+pm\s+query\s+percentile\b.*--field\b'
    min_count: 1
    weight: 3.0
    pass_threshold: 1.0
