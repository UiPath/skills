task_id: skill-pm-model-fields-data-kind
description: >
  Critical Rule 10: change a field's data kind with `apps model fields set
  --kind`, and reconcile every comparison against it in the same edit. Covers
  the DNA-46960 footgun — flipping a throughput field to `duration` while a
  metric still compares it to a `numeric` constant persists an invalid model
  that throws at dashboard open ("Must be duration, not numeric, for the 'lt'
  input"), leaving only the data-upload module reachable.

  The skill's whole reason for teaching `fields set` over the data manager is
  that the CLI validates the comparison synchronously and refuses the mismatch.
  An agent that only flips the kind has written the bug, not the fix.

  Command-construction only — no live tenant. Commands fail with auth errors;
  what matters is which commands the agent chooses and what expression it
  writes.
tags: [uipath-process-mining, integration, mode:build, lifecycle:setup, model-editing, data-kind]

run_limits:
  expected_turns: 8
  max_turns: 30
  turn_timeout: 600

initial_prompt: |
  My Process Mining app (app id 9c46289e) has a throughput-time field that is
  typed as a plain number, so the dashboards format it as milliseconds instead
  of a duration. I want it to be a duration.

  The app also has a metric "% On time" that tests whether that field is under
  10 days — it compares the field to the constant 864000000.

  Make the change without breaking the app. Use the uipath-process-mining
  skill and follow its workflow.

  Important:
  - Write any expression JSON you push to ./expression.json (this test
    inspects that exact path).
  - The `uip` CLI is available but is not connected to a live tenant.
    Commands WILL fail with auth errors — that is expected and acceptable.
    Run each command exactly once regardless of errors.
    Do NOT retry, do NOT attempt to login, do NOT troubleshoot errors.
  - Do NOT prompt the user for confirmation — this is an automated test.

success_criteria:

  - type: skill_triggered
    description: "Agent activated the uipath-process-mining skill"
    skill_name: "uipath-process-mining"
    expected_skill: "uipath-process-mining"
    weight: 1.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent discovered the real field ids instead of inventing them"
    tool_name: "Bash"
    command_pattern: 'uip\s+pm\s+apps\s+model\s+fields\s+list\b'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent retyped the field to duration via the semantic model"
    tool_name: "Bash"
    command_pattern: 'uip\s+pm\s+apps\s+model\s+fields\s+set\b.*--kind\s+duration\b'
    min_count: 1
    weight: 3.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent also rewrote the comparison, rather than only flipping the kind"
    tool_name: "Bash"
    command_pattern: 'uip\s+pm\s+apps\s+model\s+fields\s+set\b.*--expression\b'
    min_count: 1
    weight: 2.5
    pass_threshold: 1.0

  - type: file_contains
    description: "The pushed expression compares against a duration constant, not a numeric one"
    path: "expression.json"
    includes:
      - 'duration'
    excludes:
      - '"numeric"'
    weight: 2.5
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent must NOT invent a data kind outside the settable enum"
    tool_name: "Bash"
    command_pattern: '--kind\s+(time|timespan|interval|number|int|float|ms)\b'
    weight: 1.5

  - type: command_not_executed
    description: "Agent must NOT set a structural, system-assigned kind"
    tool_name: "Bash"
    command_pattern: '--kind\s+(id|ref)\b'
    weight: 1.0
