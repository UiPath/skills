task_id: skill-doc-mode-select-mode-selection
description: >
  Mode-selection accuracy, run-to-run stability and paraphrase invariance.
  48 rows: 24 workloads, each written twice in different words, six rows per
  mode across all eight.

  Three properties this set is built to protect, in the order they were added:

  1. Held out. Rows are drawn from workloads the case library does not use —
     18 from separate engagements, 9 constructed in unrelated domains. Peak
     lexical overlap with any case is 0.16, down from 0.47 when rows were
     written from the cases' own Problem descriptions. At that level the suite
     largely measured whether an agent could match text it had just read.

  2. Stated as a business would state it. An earlier revision spelled out the
     decisive signal inside the prompt — "each ticket stands on its own, we are
     not calling anything out to another system" is BT's routing conclusion,
     not something a user says about their tickets. Those are rewritten to
     carry only business facts, so the mapping from workload to mode is the
     thing under test. Requirements a business really would state ("every line
     has to point back at a source") are kept; conclusions are not.

  3. Consistency, not just accuracy. Each workload appears under two phrasings
     (variant a and b, sharing a `pair` key). Run with repeats and a row's
     replicates also expose run-to-run stability. Accuracy alone cannot tell a
     genuinely uncertain row from a stable-but-wrong one, and cannot see a
     routing signal that works under one framing and fails under another.

  Run it, then read it with the analyzer:

      coder-eval run ... --repeats 5
      python3 analyze_consistency.py <RUN_DIR>

  which reports accuracy by mode, rows whose replicates disagreed, and pairs
  that flipped when reworded — calling out the flips where one phrasing was
  correct and the other was not, since those point at phrasing-dependent
  routing copy rather than a missing signal.

  A row failing here means the routing signal in SKILL.md's Fast Routing table
  did not generalise past the wording of the case it was written from. Fix the
  routing copy, do not relax the row.

  Three things to know before reading a red result:

  - AH is the weakest ground truth in the set and structurally always will be.
    Its decisive signal is a capability need verified to exist only in the
    advanced harness, which is a design conclusion rather than something a
    business states about its own workload. The AH rows carry the long-running,
    precedence and resumability signals the library's AH cases use; treat a
    near miss onto EX or SU as weaker evidence than a miss elsewhere.
  - CS rows are expected to underperform. There is no published Classify &
    Split node configuration in Flow (references/classify-split-guide.md says
    so outright), so an agent reasoning about what it can actually build may
    legitimately fall back. Read a CS miss as a product-gap signal.
  - The grading command interpolates ${row.expected_mode} into a run_command
    string. If the harness does not substitute row fields there, check_mode.py
    fails loudly with an explicit message rather than grading against a literal
    template — see its --expected guard.

tags: [uipath-doc-mode-select, integration, mode:build, lifecycle:discover]

dataset:
  paths: ["mode_selection.jsonl"]

reference:
  directory: .

initial_prompt: |
  Route this document workload to exactly one processing mode.

  ${row.workload}

  Load the applicable UiPath skill and use its mode taxonomy. Write your answer
  to a file named `mode.txt` in the current working directory. The FIRST line
  must be the mode ID alone — one of AH, AF, CS, SU, PS, PA, EX, BT — with
  nothing else on that line. You may add your reasoning on the lines below it.

  Do not create a project, a flow, an agent, or any other artifact. Write only
  `mode.txt`.

  This run is headless. No user is present and nobody will answer a question, so
  do not ask and do not pause. Pick the single best mode and commit to it; if two
  modes are close, choose the one the skill's routing table prefers and say why
  underneath.

success_criteria:
  - type: skill_triggered
    description: "Agent invoked the uipath-doc-mode-select skill"
    expected_skill: "uipath-doc-mode-select"
    skill_name: "uipath-doc-mode-select"
    weight: 1.0
    suite_thresholds: {recall.yes: 0.90}

  - type: run_command
    description: "Selected mode matches the case library's ground truth for row ${row.id}"
    command: "python3 $REFERENCE_DIR/check_mode.py --expected '${row.expected_mode}'"
    timeout: 60
    expected_exit_code: 0
    weight: 3.0
    suite_thresholds: {mean: 0.65}

run_limits:
  max_turns: 6
  turn_timeout: 300
  task_timeout: 600
