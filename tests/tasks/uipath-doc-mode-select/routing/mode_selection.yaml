task_id: skill-doc-mode-select-mode-selection
description: >
  Mode-selection accuracy across the whole decision surface: 27 rows, three per
  mode across all eight, plus three whose ground truth is NONE because the work
  is deterministic and belongs outside the taxonomy.

  Rows are deliberately drawn from workloads the case library does NOT use. An
  earlier version paraphrased each case's own Problem description, which meant
  it largely measured whether an agent could match text it had just read —
  rows shared 65-97% of their content words with their case and peaked at 0.47
  Jaccard. These rows peak at 0.16 against any case in the library. Eighteen
  come from separate engagements; nine are constructed in unrelated domains
  where no distinct engagement was available. The `provenance` field records
  which is which.

  A row failing here means the routing signal in SKILL.md's Fast Routing table
  did not generalise past the wording of the case it was written from. Fix the
  routing copy, do not relax the row.

  Three things to know before reading a red result:

  - AH is the weakest ground truth in the set and always will be. Its decisive
    signal is a capability need verified to exist only in the advanced harness,
    which is a design conclusion rather than something a business states about
    its own workload. The AH rows carry the long-running, multi-stage,
    precedence-and-resumability signals the library's AH cases use; treat a
    near miss onto EX or SU as weaker evidence than a miss elsewhere.
  - CS rows are expected to underperform. There is no published Classify &
    Split node configuration in Flow (references/classify-split-guide.md says
    so outright), so an agent reasoning about what it can actually build may
    legitimately fall back. Read a CS miss as a product-gap signal.
  - The grading command interpolates ${row.expected_mode} into a run_command
    string. If the harness does not substitute row fields there, check_mode.py
    fails loudly with an explicit message rather than grading against a literal
    template — see its --expected guard.

tags: [uipath-doc-mode-select, integration, mode:build, lifecycle:discover]

dataset:
  paths: ["mode_selection.jsonl"]

reference:
  directory: .

initial_prompt: |
  Route this document workload to exactly one processing mode.

  ${row.workload}

  Load the applicable UiPath skill and use its mode taxonomy. Write your answer
  to a file named `mode.txt` in the current working directory. The FIRST line
  must be the mode ID alone — one of AH, AF, CS, SU, PS, PA, EX, BT — with
  nothing else on that line. You may add your reasoning on the lines below it.

  If no document-processing mode applies because the work is deterministic and
  belongs outside the taxonomy, write NONE on that first line instead. NONE is a
  real answer, not a refusal — do not force a mode onto a workload that does not
  need one.

  Do not create a project, a flow, an agent, or any other artifact. Write only
  `mode.txt`.

  This run is headless. No user is present and nobody will answer a question, so
  do not ask and do not pause. Pick the single best mode and commit to it; if two
  modes are close, choose the one the skill's routing table prefers and say why
  underneath.

success_criteria:
  - type: skill_triggered
    description: "Agent invoked the uipath-doc-mode-select skill"
    expected_skill: "uipath-doc-mode-select"
    skill_name: "uipath-doc-mode-select"
    weight: 1.0
    suite_thresholds: {recall.yes: 0.90}

  - type: run_command
    description: "Selected mode matches the case library's ground truth for row ${row.id}"
    command: "python3 $REFERENCE_DIR/check_mode.py --expected '${row.expected_mode}'"
    timeout: 60
    expected_exit_code: 0
    weight: 3.0
    suite_thresholds: {mean: 0.70}

run_limits:
  max_turns: 6
  turn_timeout: 300
  task_timeout: 600
