task_id: skill-platform-guardrails-byog-lifecycle
description: >
  Smoke test: agent uses the uipath-platform skill to walk the full BYOG
  configuration lifecycle — create with the three required flags, list,
  switch off via `update --disabled` (merge semantics, not delete +
  re-create), and delete with `--force`. Grades command shape; auth or
  feature-availability errors are expected in CI, and post_run sweeps any
  real configuration the create may have persisted on the smoke tenant.
tags: [uipath-platform, smoke, mode:operate, lifecycle:setup]

run_limits:
  expected_turns: 14

initial_prompt: |
  Manage bring-your-own guardrail (BYOG) configurations on this tenant:

  1. Register a new BYOG configuration named `byog-smoke-lifecycle` that
     implements the `pii_detection` validator through Integration Service
     connection `18fb337c-29b7-4162-a9e8-0c05b01cf4df`.
  2. List the tenant's BYOG configurations.
  3. Switch the `byog-smoke-lifecycle` configuration OFF, keeping its
     connection and every other setting unchanged. Do not remove it yet.
  4. Now permanently remove it.

  Important:
  - Commands may fail (auth or feature-availability errors) — that is
    expected in this environment. You MUST still run the command for every
    step. Do NOT skip a step because a previous one failed, do NOT retry,
    and do NOT attempt to login.
  - If a step needs an id that an earlier failed command did not return,
    use the placeholder `00000000-0000-0000-0000-000000000000` and keep
    going. The goal is to verify the CLI shape, not real data.
  - Use `--output json` on every uip command.

success_criteria:
  - type: command_executed
    description: "Agent created the BYOG configuration with the three required flags"
    tool_name: "Bash"
    command_pattern: 'uip\s+guardrails\s+byo-configurations\s+create(?=[\s\S]*--connection-id)(?=[\s\S]*--validator-name\s+\S*byog-smoke-lifecycle)(?=[\s\S]*--validator-type\s+\S*pii_detection)'
    min_count: 1
    weight: 2.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent listed the tenant's BYOG configurations"
    tool_name: "Bash"
    command_pattern: 'uip\s+guardrails\s+byo-configurations\s+list'
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent switched the configuration off via update --disabled (not delete + re-create)"
    tool_name: "Bash"
    command_pattern: 'uip\s+guardrails\s+byo-configurations\s+update\s+\S+(?=[\s\S]*--disabled)'
    min_count: 1
    weight: 2.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent deleted the configuration with --force"
    tool_name: "Bash"
    command_pattern: 'uip\s+guardrails\s+byo-configurations\s+delete\s+\S+(?=[\s\S]*--force)'
    min_count: 1
    weight: 2.0
    pass_threshold: 1.0

post_run:
  - command: >-
      python3 $SKILLS_REPO_PATH/tests/tasks/uipath-platform/guardrails/cleanup_byog.py
      --marker byog-smoke-lifecycle
    timeout: 120
