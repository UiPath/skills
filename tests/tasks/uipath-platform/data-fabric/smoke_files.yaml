task_id: skill-datafabric-smoke-files
description: >
  Smoke test: agent uploads, downloads, and removes an attachment on an
  isolated Data Fabric test record.
tags: [uipath-platform, data-fabric, smoke, files, mode:build, lifecycle:setup]
run_limits:
  max_turns: 30

initial_prompt: |
  We have a tenant-level `CE_SmokeDocuments` list in UiPath Data Fabric. Its
  one test row has an Attachment slot.

  I approve uploading, downloading, and deleting the attachment on that one
  test row. Do not change anything else.

  Could you:
    - Make a tiny text file locally, `test_upload.txt`, with anything
      in it.
    - Attach it to that row's Attachment slot.
    - Pull it back down, saving it as `downloaded.txt`.
    - Then remove the attachment.

success_criteria:
  - type: file_exists
    description: "test_upload.txt was created locally"
    path: "test_upload.txt"
    weight: 1.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent uploaded file using files upload with --file flag"
    tool_name: "Bash"
    command_pattern: '(?s)uip\s+df\s+files\s+upload\s+.*--file'
    min_count: 1
    weight: 3.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent downloaded file using files download with --destination flag"
    tool_name: "Bash"
    command_pattern: '(?s)uip\s+df\s+files\s+download\s+.*--destination'
    min_count: 1
    weight: 2.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent deleted file attachment using files delete"
    tool_name: "Bash"
    command_pattern: 'uip\s+df\s+files\s+delete\s+'
    min_count: 1
    weight: 2.0
    pass_threshold: 1.0
  - type: command_executed
    description: "Agent must NOT delete any entity — the list stays intact even if columns or rows are dropped"
    tool_name: "Bash"
    command_pattern: 'uip\s+df\s+entities\s+delete'
    min_count: 0
    max_count: 0
    weight: 2.0
    pass_threshold: 1.0
  - type: command_executed
    description: "Agent must NOT silently drop columns via removeFields — irreversible on CHOICE_SET / RELATIONSHIP fields (loses all values)"
    tool_name: "Bash"
    command_pattern: '(?s)uip\s+df\s+entities\s+update.*removeFields'
    min_count: 0
    max_count: 0
    weight: 2.0
    pass_threshold: 1.0

pre_run:
  - command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-platform/data-fabric/_shared/cleanup_entities_by_name.py --name-prefix CE_SmokeDocuments"
    timeout: 120
    fail_on_error: false
  - command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-platform/data-fabric/_shared/seed_entity.py --entity-name CE_SmokeDocuments --schema-file $SKILLS_REPO_PATH/tests/tasks/uipath-platform/data-fabric/_shared/seeds/smoke_documents.schema.json --records-file $SKILLS_REPO_PATH/tests/tasks/uipath-platform/data-fabric/_shared/seeds/smoke_documents.records.json"
    timeout: 240

post_run:
  - command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-platform/data-fabric/_shared/cleanup_entities_by_name.py --name-prefix CE_SmokeDocuments"
    timeout: 120
