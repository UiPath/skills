task_id: skill-datafabric-smoke-records
description: >
  Smoke test: agent inserts, reads, filters, paginates, updates, and deletes
  records in an isolated seeded Data Fabric entity.
tags: [uipath-platform, data-fabric, smoke, records, mode:build, lifecycle:setup]
run_limits:
  expected_turns: 15
  max_turns: 50

initial_prompt: |
  We already have a tenant-level `CE_LargePaginationTest` list in UiPath Data
  Fabric. Each row has a name, score, and active flag.

  I approve all record inserts, updates, and the final deletion described
  below. Please complete the whole sequence without asking again.

  Could you help me with this:

    - Add one new row: name "Smoke-WriteTests", score 501, active. Call it
      the first row — we'll come back to it.

    - Add two more in a single shot: "Smoke-ReviewPR" (score 502) and
      "Smoke-Deploy" (score 503), both active.

    - Pull the first row back up so I can see it.

    - Show me everything that's active, in batches of 50, and skip
      the first 100 rows.

    - Show me the first page of everything, 10 to a page.

    - Give me the next page of that same list.

    - Jump straight to whatever page holds row number 200, still 10
      to a page.

    - Mark the first row inactive.

    - Mark the other two inactive in one shot.

    - Delete the first row.

success_criteria:
  - type: command_executed
    description: "Agent issued the requested record inserts; the next criterion verifies the batch array shape"
    tool_name: "Bash"
    command_pattern: 'uip\s+df\s+records\s+insert'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent used array body for batch insert (routes to batch endpoint)"
    tool_name: "Bash"
    command_pattern: '(?s)uip\s+df\s+records\s+insert.*\['
    min_count: 1
    weight: 2.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent retrieved a record by ID with records get"
    tool_name: "Bash"
    command_pattern: 'uip\s+df\s+records\s+get\s+'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent used filterGroup in records query body"
    tool_name: "Bash"
    command_pattern: '(?s)uip\s+df\s+records\s+query.*filterGroup'
    min_count: 1
    weight: 2.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent listed records with --limit (cursor pagination)"
    tool_name: "Bash"
    command_pattern: 'uip\s+df\s+records\s+(list|query)\s+.*--limit'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent paged forward via --cursor or --offset (either satisfies smoke; integration_large_pagination tests cursor specifically)"
    tool_name: "Bash"
    command_pattern: 'uip\s+df\s+records\s+list\s+.*(--cursor|--offset|-o\s+\d+)'
    min_count: 1
    weight: 2.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent jumped to a page using -o/--offset on records list"
    tool_name: "Bash"
    command_pattern: 'uip\s+df\s+records\s+list\s+.*(-o\s+\d+|--offset\s+\d+)'
    min_count: 1
    weight: 2.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent used --offset on records query"
    tool_name: "Bash"
    command_pattern: 'uip\s+df\s+records\s+query\s+.*(-o\s+\d+|--offset\s+\d+)'
    min_count: 1
    weight: 2.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent must NOT combine --offset and --cursor on the same command"
    tool_name: "Bash"
    command_pattern: 'uip\s+df\s+records\s+(list|query)(?=[^;&|\n]*--cursor)(?=[^;&|\n]*(-o\s+\d+|--offset\s+\d+))'
    min_count: 0
    max_count: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent must NOT put pagination keys inside the --body JSON"
    tool_name: "Bash"
    command_pattern: '(?s)uip\s+df\s+records\s+query.*--body.*\"(start|offset|pageSize|limit)\"\s*:'
    min_count: 0
    max_count: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent included Id key in records update body"
    tool_name: "Bash"
    command_pattern: '(?s)uip\s+df\s+records\s+update.*\\?"Id\\?"\s*:'
    min_count: 1
    weight: 2.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent issued records update commands (single and batch may share one shell call)"
    tool_name: "Bash"
    command_pattern: 'uip\s+df\s+records\s+update'
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent deleted a record with records delete"
    tool_name: "Bash"
    command_pattern: 'uip\s+df\s+records\s+delete'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent must NOT delete any entity — the list stays intact even if columns or rows are dropped"
    tool_name: "Bash"
    command_pattern: 'uip\s+df\s+entities\s+delete'
    min_count: 0
    max_count: 0
    weight: 2.0
    pass_threshold: 1.0
  - type: command_executed
    description: "Agent must NOT silently drop columns via removeFields — irreversible on CHOICE_SET / RELATIONSHIP fields (loses all values)"
    tool_name: "Bash"
    command_pattern: '(?s)uip\s+df\s+entities\s+update.*removeFields'
    min_count: 0
    max_count: 0
    weight: 2.0
    pass_threshold: 1.0

pre_run:
  - command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-platform/data-fabric/_shared/seed_entity.py --entity-name CE_LargePaginationTest --schema-file $SKILLS_REPO_PATH/tests/tasks/uipath-platform/data-fabric/_shared/seeds/large_pagination.schema.json --records-file $SKILLS_REPO_PATH/tests/tasks/uipath-platform/data-fabric/_shared/seeds/large_pagination.records.json --reset"
    timeout: 300

post_run:
  - command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-platform/data-fabric/_shared/revert_entity_to_seed.py --entity-name CE_LargePaginationTest --schema-file $SKILLS_REPO_PATH/tests/tasks/uipath-platform/data-fabric/_shared/seeds/large_pagination.schema.json --records-file $SKILLS_REPO_PATH/tests/tasks/uipath-platform/data-fabric/_shared/seeds/large_pagination.records.json"
    timeout: 300
