task_id: skill-datafabric-smoke-entities
description: >
  Smoke test: agent creates and updates isolated Data Fabric entity schemas,
  including text, numeric, date, and long-text constraints.
tags: [uipath-platform, data-fabric, smoke, entities, mode:build, lifecycle:setup]
run_limits:
  expected_turns: 20
  max_turns: 60

initial_prompt: |
  We already have a tenant-level `CE_SmokeEntityEmployees` entity in UiPath Data
  Fabric. It holds first name, last name, and hire date.

  I approve creating
  `CE_SmokeDepartments` and applying every requested field/schema update to
  these two test lists. Do not remove fields or delete entities.

  Could you help me with this:

    - Show me the entities we already have on the tenant.

    - Add a new Departments entity called `CE_SmokeDepartments`. Each
      department should hold:
        - a name — required, up to 100 characters
        - a head count — whole number, somewhere between 0 and 10,000
        - a budget in dollars — up to two decimal places, between $0
          and $999,999
        - a description — free-form long text, up to 2000 characters

    - Read `CE_SmokeEntityEmployees` back so we know what's in it.

    - On `CE_SmokeEntityEmployees`, add a salary — dollars and cents, never negative.

    - Rename the hire-date entry to "Date Hired" and make it required.

    - On Departments, stretch the name length limit up to 200
      characters.

  Please don't remove anything or delete entities.

success_criteria:
  - type: run_command
    description: "Live Departments schema contains all requested constraints"
    command: >-
      python3 $SKILLS_REPO_PATH/tests/tasks/uipath-platform/data-fabric/_shared/verify_field_constraints.py
      --entity-name CE_SmokeDepartments --ignore-field-case
      --assertions 'name.Name=STRING,name.lengthLimit=200,name.isRequired=true,headCount.minValue=0,headCount.maxValue=10000,budget.Name=DECIMAL,budget.decimalPrecision=2,budget.minValue=0,budget.maxValue=999999,description.Name=MULTILINE_TEXT,description.lengthLimit=2000'
    timeout: 120
    expected_exit_code: 0
    weight: 4.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent retrieved entity schema with entities get"
    tool_name: "Bash"
    command_pattern: 'uip\s+df\s+entities\s+get\s+'
    min_count: 1
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "Live Employees schema contains the requested salary and hire-date updates"
    command: >-
      python3 $SKILLS_REPO_PATH/tests/tasks/uipath-platform/data-fabric/_shared/verify_field_constraints.py
      --entity-name CE_SmokeEntityEmployees --ignore-field-case
      --assertions 'salary.Name=DECIMAL,salary.decimalPrecision=2,salary.minValue=0,HireDate.displayName=Date Hired,HireDate.isRequired=true'
    timeout: 120
    expected_exit_code: 0
    weight: 4.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent must NOT delete any entity — the list stays intact even if columns or rows are dropped"
    tool_name: "Bash"
    command_pattern: 'uip\s+df\s+entities\s+delete'
    min_count: 0
    max_count: 0
    weight: 2.0
    pass_threshold: 1.0
  - type: command_executed
    description: "Agent must NOT silently drop columns via removeFields — irreversible on CHOICE_SET / RELATIONSHIP fields (loses all values)"
    tool_name: "Bash"
    command_pattern: '(?s)uip\s+df\s+entities\s+update.*removeFields'
    min_count: 0
    max_count: 0
    weight: 2.0
    pass_threshold: 1.0

pre_run:
  - command: >-
      python3 $SKILLS_REPO_PATH/tests/tasks/uipath-platform/data-fabric/_shared/cleanup_entities_by_name.py
      --name-prefix CE_SmokeDepartments
    timeout: 120
    fail_on_error: false
  - command: >-
      python3 $SKILLS_REPO_PATH/tests/tasks/uipath-platform/data-fabric/_shared/cleanup_entities_by_name.py
      --name-prefix CE_SmokeEntityEmployees
    timeout: 120
    fail_on_error: false
  - command: >-
      python3 $SKILLS_REPO_PATH/tests/tasks/uipath-platform/data-fabric/_shared/seed_entity.py
      --entity-name CE_SmokeEntityEmployees
      --schema-file $SKILLS_REPO_PATH/tests/tasks/uipath-platform/data-fabric/_shared/seeds/smoke_entity_employees.schema.json
    timeout: 240

post_run:
  - command: >-
      python3 $SKILLS_REPO_PATH/tests/tasks/uipath-platform/data-fabric/_shared/cleanup_entities_by_name.py
      --name-prefix CE_SmokeDepartments
    timeout: 120
  - command: >-
      python3 $SKILLS_REPO_PATH/tests/tasks/uipath-platform/data-fabric/_shared/cleanup_entities_by_name.py
      --name-prefix CE_SmokeEntityEmployees
    timeout: 120
