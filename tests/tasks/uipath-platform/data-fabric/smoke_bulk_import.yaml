task_id: skill-datafabric-smoke-bulk-import
description: >
  Smoke test: agent uses the uipath-platform skill to bulk-import records
  from a CSV file. Tests that the skill teaches correct CSV format: header row
  must match exact entity field display names (case-sensitive), system fields must be
  excluded, and records import --file is the correct command (not records insert).
tags: [uipath-platform, data-fabric, smoke, records, import, mode:build, lifecycle:setup]
run_limits:
  expected_turns: 10
  max_turns: 30

initial_prompt: |
  We already have a tenant-level `CE_SmokeBulkImport` UiPath Data Fabric
  entity. Each row holds a ProductName, a UnitPrice, and an InStock flag.

  I explicitly approve the requested three-row import. Proceed without
  another confirmation; do not attempt any other mutation.

  Could you load these three into it from a spreadsheet:
    - Product A — $9.99, in stock
    - Product B — $24.50, not in stock
    - Product C — $4.99, in stock

  Save the spreadsheet as `products.csv` and load it into that entity.

success_criteria:
  # Advisory `entities get` check removed — schema is given inline in the
  # prompt, so a schema-fetch is not required and its soft-miss was
  # dragging otherwise-perfect scores below 1.000.

  - type: command_executed
    description: "Agent ran records import with a file (--file or -f, flag before OR after the entity-id positional)"
    tool_name: "Bash"
    command_pattern: '(?s)uip\s+df\s+records\s+import(?=\s+\S).*(?:--file|\s-f)\s+\S+\.csv'
    min_count: 1
    weight: 3.0
    pass_threshold: 1.0

  - type: file_exists
    description: "products.csv was created"
    path: "products.csv"
    weight: 1.5
    pass_threshold: 1.0

  - type: file_contains
    description: "CSV uses the supplied case-sensitive field display names as headers"
    path: "products.csv"
    includes:
      - "Product Name"
      - "Unit Price"
      - "In Stock"
    weight: 2.5
    pass_threshold: 1.0

  - type: file_check
    description: "CSV does not include system fields (Id, CreatedBy, CreateTime, UpdatedBy, UpdateTime)"
    path: "products.csv"
    excludes:
      - "CreatedBy"
      - "CreateTime"
      - "UpdatedBy"
      - "UpdateTime"
    weight: 2.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent must NOT delete any entity — the list stays intact even if columns or rows are dropped"
    tool_name: "Bash"
    command_pattern: 'uip\s+df\s+entities\s+delete'
    min_count: 0
    max_count: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent must NOT silently drop columns via removeFields — irreversible on CHOICE_SET / RELATIONSHIP fields (loses all values)"
    tool_name: "Bash"
    command_pattern: '(?s)uip\s+df\s+entities\s+update.*removeFields'
    min_count: 0
    max_count: 0
    weight: 2.0
    pass_threshold: 1.0

pre_run:
  - command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-platform/data-fabric/_shared/cleanup_entities_by_name.py --name-prefix CE_SmokeBulkImport"
    timeout: 120
    fail_on_error: false
  - command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-platform/data-fabric/_shared/seed_entity.py --entity-name CE_SmokeBulkImport --schema-file $SKILLS_REPO_PATH/tests/tasks/uipath-platform/data-fabric/_shared/seeds/smoke_bulk_import.schema.json --reset"
    timeout: 300

post_run:
  - command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-platform/data-fabric/_shared/cleanup_entities_by_name.py --name-prefix CE_SmokeBulkImport"
    timeout: 120
