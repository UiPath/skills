task_id: skill-datafabric-smoke-choice-multiple-filter
description: >
  Smoke test: agent uses the uipath-platform skill to filter records on a
  CHOICE_SET_MULTIPLE field — picking `contains` for membership and the
  JSON-array string form of `=` for set equality, and avoiding the two known
  HTTP 400 failure modes (bare value with `=`, bracket value with `contains`).
  Verified server behavior — see references/records-query.md §
  "Filtering on Choice-Set Fields".
tags: [uipath-platform, data-fabric, smoke, complex-fields, mode:operate, lifecycle:discover]

run_limits:
  expected_turns: 10
  max_turns: 25


initial_prompt: |
  We have an ExpenseApproval UiPath Data Fabric entity. Each expense has an
  amount and a `tags` column where you can pick one or more from a fixed
  choice set. The options are urgent, billable, and reimbursable.

  Could you run these four searches for me:

    - Show me every expense tagged as urgent.
    - Show me every expense whose tags are exactly urgent and reimbursable
      together, nothing else.
    - Show me every expense that isn't tagged as billable.
    - Show me how many expenses fall under each unique tag
      combination.

success_criteria:
  - type: command_executed
    description: "Task 1 — agent used `contains` with the resolved NumberId for urgent"
    tool_name: "Bash"
    command_pattern: '(?s)uip\s+df\s+records\s+query.*fieldName.*tags.*operator.*contains.*value.*0'
    min_count: 1
    weight: 3.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Task 2 — agent used `=` with the resolved set for urgent + reimbursable"
    tool_name: "Bash"
    command_pattern: '(?s)uip\s+df\s+records\s+query.*fieldName.*tags.*operator.*=.*value.*\[0,\s*2\]'
    min_count: 1
    weight: 3.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Task 3 — agent used `not contains` for negated membership"
    tool_name: "Bash"
    command_pattern: '(?s)uip\s+df\s+records\s+query.*fieldName.*tags.*operator.*not contains'
    min_count: 1
    weight: 2.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Task 4 — agent used groupBy on tags with COUNT aggregate"
    tool_name: "Bash"
    command_pattern: '(?s)uip\s+df\s+records\s+query.*groupBy.*tags.*function.*COUNT'
    min_count: 1
    weight: 2.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Negative — agent must NOT use `=` with a bare value on tags (HTTP 400)"
    tool_name: "Bash"
    command_pattern: '(?s)uip\s+df\s+records\s+query.*\"fieldName\"\s*:\s*\"tags\"\s*,\s*\"operator\"\s*:\s*\"=\"\s*,\s*\"value\"\s*:\s*\"\d+\"'
    min_count: 0
    max_count: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Negative — agent must NOT use `contains` with a bracketed value on tags (HTTP 400)"
    tool_name: "Bash"
    # Scope all three lookaheads to one flat queryFilter object. This tolerates
    # JSON key order without combining values from separate filters.
    command_pattern: '(?s)uip\s+df\s+records\s+query.*\{(?=[^{}]*\\?\"fieldName\\?\"\s*:\s*\\?\"tags\\?\")(?=[^{}]*\\?\"operator\\?\"\s*:\s*\\?\"contains\\?\")(?=[^{}]*\\?\"value\\?\"\s*:\s*\\?\"\[)[^{}]*\}'
    min_count: 0
    max_count: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Negative — agent must NOT use unsupported operators on a CHOICE_SET_MULTIPLE field"
    tool_name: "Bash"
    command_pattern: '(?s)uip\s+df\s+records\s+query(?=.*\"fieldName\"\s*:\s*\"tags\")(?=.*\"operator\"\s*:\s*\"(in|not in|startswith|endswith|>|<|>=|<=)\")'
    min_count: 0
    max_count: 0
    weight: 2.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Negative — agent must NOT pass a display label into a tags filter"
    tool_name: "Bash"
    command_pattern: '(?si)uip\s+df\s+records\s+query(?=.*\"fieldName\"\s*:\s*\"tags\")(?=.*\"value\"\s*:\s*\"(urgent|billable|reimbursable)\")'
    min_count: 0
    max_count: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent must NOT delete any entity — the list stays intact even if columns or rows are dropped"
    tool_name: "Bash"
    command_pattern: 'uip\s+df\s+entities\s+delete'
    min_count: 0
    max_count: 0
    weight: 2.0
    pass_threshold: 1.0
  - type: command_executed
    description: "Agent must NOT silently drop columns via removeFields — irreversible on CHOICE_SET / RELATIONSHIP fields (loses all values)"
    tool_name: "Bash"
    command_pattern: '(?s)uip\s+df\s+entities\s+update.*removeFields'
    min_count: 0
    max_count: 0
    weight: 2.0
    pass_threshold: 1.0
