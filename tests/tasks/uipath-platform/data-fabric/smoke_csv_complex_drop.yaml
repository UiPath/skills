task_id: skill-datafabric-smoke-csv-complex-drop
description: >
  Smoke test: agent uses the uipath-platform skill to seed an entity whose
  schema includes complex field types (CHOICE_SET_SINGLE, CHOICE_SET_MULTIPLE,
  RELATIONSHIP). `records import` ignores complex-field columns —
  verified server behavior in BulkUploadCSVHelper. The agent must use
  `records insert --file <json>` instead and must NOT put complex-field
  columns in a CSV file.
tags: [uipath-platform, data-fabric, smoke, complex-fields, bulk-import, mode:build, lifecycle:setup]

run_limits:
  expected_turns: 10
  max_turns: 25


initial_prompt: |
  We have a tenant-level Expense Import Demo in UiPath Data Fabric. Each expense holds:
    - amount — dollars
    - description — text
    - category — pick one from a category dropdown
    - tags — pick one or more from a tags dropdown
    - customer — links to our Import Demo Customers list

  I approve adding the three rows below. Please do not make any other changes.

  Please bulk-load these three rows in one go, using whichever
  bulk-loading path is right for an entity with these kinds of columns.
  Pick the file format that path needs.

    R1 — $100, "taxi",   category travel, tags travel + lodging, customer Alice
    R2 — $250, "dinner", category meals,  tags meals,            customer Alice
    R3 — $400, "hotel",  category lodging, tags lodging,         customer Bob

  When you're done, write a short note (one paragraph) in `decision.md`
  telling me which loading command you picked and why that's the
  right one for an entity shaped like this. Please be specific about
  what would go wrong with the other option.

success_criteria:
  - type: command_executed
    description: "Agent used `records insert` with a JSON file (--file or -f pointing at .json)"
    tool_name: "Bash"
    command_pattern: '(?s)uip\s+df\s+records\s+insert\s+\S+[^\n]*(?:--file|\s-f)\s+\S+\.json'
    min_count: 1
    weight: 3.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent must NOT actually run `records import` against the entity (help / usage lookups are OK; only a real invocation with an entity ID counts)"
    tool_name: "Bash"
    command_pattern: '(?s)uip\s+df\s+records\s+import\s+[0-9a-fA-F][0-9a-fA-F-]{7,}'
    min_count: 0
    max_count: 0
    weight: 3.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent must NOT produce a .csv file or call records import with one (would silently drop complex fields)"
    tool_name: "Bash"
    command_pattern: '(uip\s+df\s+records\s+import\b.*\.csv|>\s*\S*\.csv\b|tee\s+\S*\.csv\b)'
    min_count: 0
    max_count: 0
    weight: 2.5
    pass_threshold: 1.0

  - type: file_exists
    description: "decision.md was written"
    path: "decision.md"
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "decision.md explains that CSV import loses complex-field values and cites `records insert`"
    command: "grep -qi -E 'ignor(e|ed)|drop(ped)?|skip(ped)?|null|silently|opaque|not (be )?(imported|resolved|preserved|stored)' decision.md && grep -qi 'records insert' decision.md"
    timeout: 5
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "All three complex-field records were inserted"
    command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-platform/data-fabric/_shared/assert_record_count.py --entity-name CE_SmokeExpenseImport --expected 3"
    timeout: 90
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent must NOT delete any entity — the list stays intact even if columns or rows are dropped"
    tool_name: "Bash"
    command_pattern: 'uip\s+df\s+entities\s+delete'
    min_count: 0
    max_count: 0
    weight: 2.0
    pass_threshold: 1.0
  - type: command_executed
    description: "Agent must NOT silently drop columns via removeFields — irreversible on CHOICE_SET / RELATIONSHIP fields (loses all values)"
    tool_name: "Bash"
    command_pattern: '(?s)uip\s+df\s+entities\s+update.*removeFields'
    min_count: 0
    max_count: 0
    weight: 2.0
    pass_threshold: 1.0

pre_run:
  - command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-platform/data-fabric/_shared/cleanup_entities_by_name.py --name-prefix CE_SmokeExpenseImport"
    timeout: 120
    fail_on_error: false
  - command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-platform/data-fabric/_shared/cleanup_entities_by_name.py --name-prefix CE_SmokeImportCustomers"
    timeout: 120
    fail_on_error: false
  - command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-platform/data-fabric/_shared/cleanup_entities_by_name.py --name-prefix CE_SmokeImportTags --include-choice-sets"
    timeout: 120
    fail_on_error: false
  - command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-platform/data-fabric/_shared/seed_choice_set.py --spec $SKILLS_REPO_PATH/tests/tasks/uipath-platform/data-fabric/_shared/seeds/smoke_categories.choice_set.json"
    timeout: 180
  - command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-platform/data-fabric/_shared/seed_choice_set.py --spec $SKILLS_REPO_PATH/tests/tasks/uipath-platform/data-fabric/_shared/seeds/smoke_import_tags.choice_set.json"
    timeout: 180
  - command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-platform/data-fabric/_shared/seed_entity.py --entity-name CE_SmokeImportCustomers --schema-file $SKILLS_REPO_PATH/tests/tasks/uipath-platform/data-fabric/_shared/seeds/smoke_import_customers.schema.json --records-file $SKILLS_REPO_PATH/tests/tasks/uipath-platform/data-fabric/_shared/seeds/smoke_import_customers.records.json"
    timeout: 240
  - command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-platform/data-fabric/_shared/seed_complex_import_fixture.py"
    timeout: 240

post_run:
  - command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-platform/data-fabric/_shared/cleanup_entities_by_name.py --name-prefix CE_SmokeExpenseImport"
    timeout: 120
  - command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-platform/data-fabric/_shared/cleanup_entities_by_name.py --name-prefix CE_SmokeImportCustomers"
    timeout: 120
  - command: "python3 $SKILLS_REPO_PATH/tests/tasks/uipath-platform/data-fabric/_shared/cleanup_entities_by_name.py --name-prefix CE_SmokeImportTags --include-choice-sets"
    timeout: 120
