task_id: skill-platform-is-resource-describe-solution-picker
description: >
  Integration test: agent uses the uipath-platform skill to get the input
  fields of a Data Fabric "Create Entity Record" activity for a folder entity that exists only in a local solution. Tests that the skill
  teaches the solution-resource picker flow — the entity goes in as its name
  on the picker field (folderEntityName, with entityScope=folder) together
  with --solution-folder, so the CLI resolves it by the picker's
  solutionResourceKind and sends its configuration to the connector — and
  that the agent does not drop the picker or reach for a raw HTTP call.
tags: [uipath-platform, integration, mode:operate, lifecycle:discover, integration-service, connector, data-fabric, ipe]

sandbox:
  template_sources:
    - type: template_dir
      path: _setup/df_local_solution
      mount_point: orders-solution

run_limits:
  expected_turns: 25

initial_prompt: |
  I have a local UiPath solution at ./orders-solution. It declares a Data
  Fabric folder entity called PurchaseOrder that I have not deployed yet.

  I'm building an activity with Data Fabric's "Create Entity Record"
  (connector uipath-uipath-dataservice, object CreateEntityRecord_V3) for
  that entity. Find out which input fields its Create operation takes.

  Important:
  - The `uip` CLI is available but is NOT connected to a live tenant in this
    environment. Commands WILL fail with auth errors — that is expected.
    Run each command once and move on. Do NOT retry or attempt to login.
  - Use `--output json` on every uip command.
  - Use "placeholder-connection-id" as the Data Fabric connection id.
  - Load the uipath-platform skill first and follow its Integration Service
    workflow.

success_criteria:
  - type: command_executed
    description: "Agent described the activity's Create operation with the entity on the folderEntityName picker"
    tool_name: "Bash"
    command_pattern: 'uip\s+is\s+resources\s+describe[\s\S]*CreateEntityRecord_V3[\s\S]*folderEntityName=["'']?PurchaseOrder'
    min_count: 1
    weight: 3.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent picked the folder scope the folderEntityName picker belongs to"
    tool_name: "Bash"
    command_pattern: 'uip\s+is\s+resources\s+describe[\s\S]*entityScope=["'']?folder'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent pointed describe at the local solution so the picker resolves there"
    tool_name: "Bash"
    command_pattern: 'uip\s+is\s+resources\s+describe[\s\S]*--solution-folder\s+["'']?\.?/?orders-solution|cd\s+["'']?\.?/?orders-solution[\s\S]*uip\s+is\s+resources\s+describe'
    min_count: 1
    weight: 2.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent passed --operation Create and --connection-id on describe"
    tool_name: "Bash"
    command_pattern: 'uip\s+is\s+resources\s+describe(?=[\s\S]*--operation\s+Create)(?=[\s\S]*--connection-id)'
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent did not bypass describe with a hand-built HTTP call to the schema route"
    tool_name: "Bash"
    command_pattern: '(curl|http-request-preview|resources\s+run\s+create)[\s\S]*standard-objects'
    weight: 1.0
    pass_threshold: 1.0
