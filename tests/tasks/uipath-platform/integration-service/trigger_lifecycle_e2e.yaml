task_id: skill-platform-is-trigger-lifecycle-e2e
description: >
  E2E test (mode:operate): agent uses the uipath-platform skill to operate a
  deployed Integration Service event trigger — fire it by creating a record
  on the watched object, confirm the job, read failed fire attempts, then
  disable and delete it. There is no CLI verb for disable/delete on an IS
  event trigger, so the agent must route those to Orchestrator instead of
  misusing `uip or triggers update|delete --type api`.
tags: [uipath-platform, e2e, mode:operate, lifecycle:setup, integration-service, connector, ipe]

run_limits:
  expected_turns: 12

initial_prompt: |
  I deployed a flow "NewContactFlow" in Orchestrator folder "Shared". It has
  a Salesforce (uipath-salesforce-sfdc) Contact CREATED event trigger on
  connection "placeholder-connection-id"; its trigger key is
  11111111-2222-3333-4444-555555555555.

  1. Fire the trigger once and check that it started a job.
  2. If no job started, show me why the trigger did not fire.
  3. Then disable the trigger, and finally delete it.

  Important:
  - The `uip` CLI is available but is NOT connected to a live tenant in this
    environment. Commands WILL fail with auth errors — that is expected.
    Run each command once and move on. Do NOT retry or attempt to login.
  - Use `--output json` on every uip command.

success_criteria:
  - type: command_executed
    description: "Agent fired the trigger by creating a Contact through the trigger's connection"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+is\s+resources\s+run\s+create\s+.*uipath-salesforce-sfdc.*Contact'
    min_count: 1
    weight: 2.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent checked for the job the trigger should have started"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+(or|orchestrator)\s+jobs\s+list'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent read the trigger's failed fire attempts"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+(or|orchestrator)\s+triggers\s+history\s+11111111-2222-3333-4444-555555555555'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent did not disable/delete the IS event trigger through the HTTP API-trigger verbs — there is no CLI path; toggle/delete it in Orchestrator"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+(or|orchestrator)\s+triggers\s+(update|delete)\b'
    weight: 3.0
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent did not invent a `uip is triggers` lifecycle verb — only objects and describe exist"
    tool_name: "Bash"
    command_pattern: '(uip|\$UIP)\s+is\s+triggers\s+(create|enable|disable|fire|delete|update)\b'
    weight: 1.5
    pass_threshold: 1.0
