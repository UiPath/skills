task_id: skill-platform-traces-feedback-list-detailed
description: >
  Smoke test: agent reaches for `uip traces feedback list detailed` — the only
  read that returns `spanAttributes` (agentId, agentName, userPrompt, output)
  and the only one that works without a `--trace-id` — for a cross-trace bulk
  review, and drives its time-window, sort, and category filters. The whole
  `list detailed` subcommand is untested today. Choosing it over plain `list`
  is itself graded: the prompt asks for span context, which plain `list` cannot
  return. Criteria bind to the requested values, not just flag presence, so
  `--sort-order asc` against a "newest first" ask does not score, while omitting
  the flag does (`desc` is the CLI default — grade the outcome, never a literal
  flag). `uip` is an offline `record_cli` mock that answers every call with a
  404 envelope — the graded behavior is the argv each call received plus that
  envelope captured to a file.
tags: [uipath-platform, smoke, mode:diagnose, lifecycle:discover, traces, feedback]

sandbox:
  record_cli:
    - tool: uip
      stdout: |
        {"Result":"Failure","Message":"Resource not found (404 Not Found)"}

run_limits:
  expected_turns: 12

initial_prompt: |
  Bulk quality sweep across traces, folder key
  `2f6c8a41-93bd-4d17-8e55-6a0b7c19d3e2`. I need each feedback record together
  with the span context behind it — which agent produced it, the user prompt,
  and the agent's output — not just the bare feedback rows.

  - Everything from the last 24 hours.
  - Separately, the window 2026-07-01T00:00:00Z through 2026-07-08T00:00:00Z,
    restricted to category `3f9a2b71-6c48-4d05-b2e7-91ac5d80e6f4`, newest first.
    Save that second response to `detailed.json`.

  The folder and category come from the review export and may not resolve against
  this tenant — that is expected. Run both reads and report what comes back.

success_criteria:
  # Graded from cli_mocks/calls.jsonl: one record per real invocation, argv
  # already split by the shell, so line continuations, quoting, and calls
  # batched into one Bash step need no handling here.
  - type: cli_called
    description: "Last-24-hours pass used the relative lookback (--since 24h)"
    tool: uip
    verb: "traces feedback list detailed"
    flags:
      since: "24h"
      before: {absent: true}
    weight: 2.0
    pass_threshold: 1.0

  - type: cli_called
    description: "Second pass bounded by the requested explicit --after/--before window"
    tool: uip
    verb: "traces feedback list detailed"
    flags:
      after: {matches_regex: '^2026-07-01'}
      before: {matches_regex: '^2026-07-08'}
      since: {absent: true}
    weight: 2.0
    pass_threshold: 1.0

  - type: cli_called
    description: "Second pass filtered to the requested category"
    tool: uip
    verb: "traces feedback list detailed"
    flags:
      category-id: {matches_regex: '^3f9a2b71'}
    weight: 1.5
    pass_threshold: 1.0

  # Must-NOT guard; its positive control is the criterion above. Omitting
  # --sort-order passes (`desc` is the CLI default), as does an explicit desc.
  - type: cli_called
    description: "Category pass not explicitly re-ordered oldest-first"
    tool: uip
    verb: "traces feedback list detailed"
    flags:
      category-id: {matches_regex: '^3f9a2b71'}
      sort-order: "asc"
    min_count: 0
    max_count: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: file_contains
    description: "detailed.json holds a real CLI response envelope, not hand-written JSON"
    path: "detailed.json"
    # The mock's exact reply: only a real call redirected to the file produces it.
    includes:
      - '"Result"'
      - 'Resource not found (404 Not Found)'
    weight: 1.0
    pass_threshold: 1.0
