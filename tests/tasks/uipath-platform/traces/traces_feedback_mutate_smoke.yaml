task_id: skill-platform-traces-feedback-mutate
description: >
  Smoke test: agent corrects and removes existing feedback records — the only
  test where the agent itself runs `update <id>` and `delete <id>` (delete is
  otherwise reached only by harness-side post_run cleanup, whose exit code is
  ignored). The category assertion is the discriminating one: `--category` is
  replacement, not additive, so adding a tag means re-passing the existing tag
  alongside the new one. An agent that passes only the new tag silently drops
  the old one and fails. Also covers `--folder-key` and the required `-y` on the
  two commands they were never checked for. `uip` is an offline `record_cli`
  mock that answers every call with a 404 envelope — the graded behavior is the
  argv each call received.
tags: [uipath-platform, smoke, mode:build, lifecycle:setup, traces, feedback]

sandbox:
  record_cli:
    - tool: uip
      stdout: |
        {"Result":"Failure","Message":"Resource not found (404 Not Found)"}

run_limits:
  expected_turns: 10

initial_prompt: |
  Two corrections to feedback in folder key
  `2f6c8a41-93bd-4d17-8e55-6a0b7c19d3e2`:

  - Record `5c2e8f13-4a76-49bd-8e01-b3d7f6a2c945` was filed thumbs-up by mistake.
    It should be thumbs-down, with the comment "Extraction missed two line items".
    It is tagged "Output" today; it needs to end up tagged "Agent Error" as well,
    and it must keep "Output".
  - Record `81a4d0c6-2f95-4e38-97b2-6ad1c3e5b704` is a duplicate. Get rid of it.

  Both IDs come from the review export and are authoritative — apply the
  corrections directly rather than looking the records up first. They may not
  resolve against this tenant; that is expected and is not a reason to stop.
  Report what each command returns.

success_criteria:
  # Graded from cli_mocks/calls.jsonl: one record per real invocation, argv
  # already split by the shell, so line continuations, quoting, and calls
  # batched into one Bash step need no handling here.
  # value_flags lists every value-bearing flag so a value never shifts the
  # positional record ID (e.g. `update --folder-key <key> <id>`).
  - type: cli_called
    description: "Agent flipped the sentiment and set the new comment via update, with the required --folder-key"
    tool: uip
    verb: "traces feedback update"
    positional: ["5c2e8f13-4a76-49bd-8e01-b3d7f6a2c945"]
    value_flags: [output, folder-key, comment, comment-file, metadata, metadata-file, category, profile]
    flags:
      negative: {present: true}
      comment: {present: true}
      folder-key: "2f6c8a41-93bd-4d17-8e55-6a0b7c19d3e2"
    weight: 2.5
    pass_threshold: 1.0

  # Both tags on ONE update call — two separate updates leave only the last tag,
  # since --category replaces. A flag predicate is satisfied by any one value of
  # a repeated flag, so cli_called cannot require two values together; match one
  # log line instead (MULTILINE, no DOTALL: `.` never leaves the line).
  - type: file_matches_regex
    description: "Agent re-passed the existing tag alongside the new one (--category replaces, not appends)"
    path: "cli_mocks/calls.jsonl"
    pattern: '^(?=.*"argv": \["traces", "feedback", "update")(?=.*"5c2e8f13-4a76-49bd-8e01-b3d7f6a2c945")(?=.*"--category(?:", "|=)Output")(?=.*"--category(?:", "|=)Agent Error").*$'
    flags: 8
    weight: 3.0
    pass_threshold: 1.0

  - type: cli_called
    description: "Agent, not the harness, deleted the duplicate record with --folder-key and the required -y"
    tool: uip
    verb: "traces feedback delete"
    positional: ["81a4d0c6-2f95-4e38-97b2-6ad1c3e5b704"]
    value_flags: [output, folder-key, profile]
    flags:
      folder-key: "2f6c8a41-93bd-4d17-8e55-6a0b7c19d3e2"
      # Quoted: YAML 1.1 reads a bare `yes` key as boolean true.
      "yes": {present: true, aliases: ["y"]}
    weight: 2.5
    pass_threshold: 1.0
