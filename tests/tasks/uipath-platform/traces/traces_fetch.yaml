task_id: skill-platform-traces-fetch
description: >
  Smoke test: agent uses the uipath-platform skill to fetch LLM trace spans for a
  given job key. Verifies the agent knows to call
  `uip traces spans get --job-key <guid> --output json`.
  `uip` is an offline `record_cli` mock that answers every call with a 404
  envelope (no traces for this job key) — the graded behavior is the argv the
  call received.
tags: [uipath-platform, smoke, mode:operate, lifecycle:discover, traces]

sandbox:
  record_cli:
    - tool: uip
      stdout: |
        {"Result":"Failure","Message":"Resource not found (404 Not Found)"}

run_limits:
  expected_turns: 6

initial_prompt: |
  I want to inspect the LLM trace spans for a completed job. The job key is `11111111-2222-3333-4444-555566667777`. Fetch them.

  Use `--output json` on all uip commands.

success_criteria:
  # Graded from cli_mocks/calls.jsonl: one record per real invocation, argv
  # already split by the shell, so line continuations, quoting, and calls
  # batched into one Bash step need no handling here.
  - type: cli_called
    description: "Agent fetched spans using uip traces spans get with --job-key flag"
    tool: uip
    verb: "traces spans get"
    flags:
      job-key: "11111111-2222-3333-4444-555566667777"
    weight: 2.0
    pass_threshold: 1.0
