task_id: skill-platform-traces-feedback-comment-file
description: >
  Smoke test: agent files reviewer write-ups that live outside the command line —
  one already on disk (`--comment-file <path>`), one arriving on stdin from a
  script (`--comment-file -`) — and applies two category tags to the same record
  (`--category` is repeatable). Mutual-exclusion rule 2 from feedback.md is
  graded structurally: both records must be filed with neither create carrying an
  inline `--comment`. None of these flags are reached by any existing traces test.
  `uip` is an offline `record_cli` mock that answers every call with a 404
  envelope — the graded behavior is the argv each call received.
tags: [uipath-platform, smoke, mode:build, lifecycle:setup, traces, feedback]
sandbox:
  template_sources:
    - type: template_dir
      path: _setup
      mount_point: _setup
  record_cli:
    - tool: uip
      stdout: |
        {"Result":"Failure","Message":"Resource not found (404 Not Found)"}
pre_run:
  - command: "sh _setup/seed_feedback_notes.sh"
    timeout: 15

run_limits:
  expected_turns: 12

initial_prompt: |
  Two reviewer write-ups to file as thumbs-down feedback, both in folder key
  `2f6c8a41-93bd-4d17-8e55-6a0b7c19d3e2`:

  1. Trace `7d3a91e0f5c24b8ea0c6d219bb47f0a3` — the write-up is already sitting in
     `review-note.md`. The feedback comment should be that file's text verbatim,
     and the record needs to carry both the "Output" and "Agent Error" tags.
  2. Trace `a18b4c7d2e934f60b5c81d3a6f9e2077` — its write-up is printed on stdout
     by `./gen-note.sh`. Get that text onto the feedback record without staging it
     in a temp file first.

  Both trace IDs come from a review export and may not resolve against this
  tenant — that is expected. File both records anyway and report what comes back.
success_criteria:
  # Graded from cli_mocks/calls.jsonl: one record per real invocation, argv
  # already split by the shell, so line continuations, quoting, pipes, and calls
  # batched into one Bash step need no handling here.
  - type: cli_called
    description: "Agent sourced the first comment from review-note.md rather than retyping it"
    tool: uip
    verb: "traces feedback create"
    flags:
      comment-file: {matches_regex: '(^|/)review-note\.md$'}
    weight: 2.0
    pass_threshold: 1.0

  # Both tags on ONE call. A flag predicate is satisfied by any one value of a
  # repeated flag, so cli_called cannot require two values together; match one
  # log line instead (MULTILINE, no DOTALL: `.` never leaves the line, so both
  # lookaheads bind to the same invocation).
  - type: file_matches_regex
    description: "Agent applied both category tags on one record (--category is repeatable)"
    path: "cli_mocks/calls.jsonl"
    pattern: '^(?=.*"argv": \["traces", "feedback", "create")(?=.*"--category(?:", "|=)Output")(?=.*"--category(?:", "|=)Agent Error").*$'
    flags: 8
    weight: 2.5
    pass_threshold: 1.0

  - type: cli_called
    description: "Agent piped the generated write-up in on stdin (--comment-file -)"
    tool: uip
    verb: "traces feedback create"
    flags:
      comment-file: "-"
    weight: 2.0
    pass_threshold: 1.0

  - type: cli_called
    description: "Trace 7d3a91e0f5c24b8ea0c6d219bb47f0a3 was filed via --comment-file, never inline --comment"
    tool: uip
    verb: "traces feedback create"
    flags:
      trace-id: "7d3a91e0f5c24b8ea0c6d219bb47f0a3"
      comment-file: {present: true}
      comment: {absent: true}
    weight: 1.0
    pass_threshold: 1.0

  - type: cli_called
    description: "Trace a18b4c7d2e934f60b5c81d3a6f9e2077 was filed via --comment-file, never inline --comment"
    tool: uip
    verb: "traces feedback create"
    flags:
      trace-id: "a18b4c7d2e934f60b5c81d3a6f9e2077"
      comment-file: {present: true}
      comment: {absent: true}
    weight: 1.0
    pass_threshold: 1.0
