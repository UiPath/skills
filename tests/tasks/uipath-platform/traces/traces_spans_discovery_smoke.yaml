task_id: skill-platform-traces-spans-discovery
description: >
  Smoke test: agent works both documented ways into a trace — keyed by job
  (`uip traces spans get --job-key <job-key>`, which resolves the job's traces
  itself; the old `uip or jobs traces` discovery step is removed from the CLI),
  then by a log-sourced trace ID using the positional `spans get <trace-id>` form
  with folder context. Complements traces_fetch.yaml, which only ever reaches
  `spans get --job-key` and never touches the positional trace-id form or the
  `--folder-path`/`--folder-key` context flags.
  `uip` is an offline `record_cli` mock that answers every call with a 404
  envelope — the graded behavior is which tools the agent reaches for and the
  argv each call received, not tenant data.
tags: [uipath-platform, smoke, mode:diagnose, lifecycle:discover, traces]

sandbox:
  record_cli:
    - tool: uip
      stdout: |
        {"Result":"Failure","Message":"Resource not found (404 Not Found)"}

run_limits:
  expected_turns: 12

initial_prompt: |
  A support ticket points at job `9f2c1d84-77ab-4e0e-9a63-2f1b0c5e7a10`, which ran
  in the `Shared/uipath-platform` folder.

  Two things I need:
  - Which traces did that job record? I have no trace ID for it.
  - An application log elsewhere in the ticket quotes trace
    `4bf92f3577b34da6a3ce929d0e0e4736` from the same folder. Pull that trace's
    full span detail so I can read its tool calls and LLM interactions.

  Both identifiers come straight off the ticket and may not resolve against this
  tenant — that is expected and not something to work around. Report what the
  commands return; do not go searching for substitute jobs or traces.

success_criteria:
  # Graded from cli_mocks/calls.jsonl: one record per real invocation, argv
  # already split by the shell, so line continuations, quoting, and calls
  # batched into one Bash step need no handling here.
  # value_flags lists every value-bearing flag so a value never shifts the
  # positional trace ID (e.g. `spans get --folder-path <p> <id>`).
  # `uip or jobs traces` is removed (it only prints a pointer and exits
  # non-zero); traces.md teaches `spans get --job-key` for "which traces did
  # this job record".
  - type: cli_called
    description: "Agent got the job's traces by job key (spans get --job-key)"
    tool: uip
    verb: "traces spans get"
    flags:
      job-key: "9f2c1d84-77ab-4e0e-9a63-2f1b0c5e7a10"
    weight: 2.0
    pass_threshold: 1.0

  - type: cli_called
    description: "Agent fetched spans by positional trace ID (not the --job-key shortcut)"
    tool: uip
    verb: "traces spans get"
    positional: ["4bf92f3577b34da6a3ce929d0e0e4736"]
    value_flags: [output, folder-path, folder-key, job-key, profile]
    weight: 2.5
    pass_threshold: 1.0

  - type: cli_called
    description: "Agent passed folder context on spans get (--folder-path or --folder-key)"
    tool: uip
    verb: "traces spans get"
    flags:
      folder-path: {present: true, aliases: [folder-key]}
    weight: 1.5
    pass_threshold: 1.0
