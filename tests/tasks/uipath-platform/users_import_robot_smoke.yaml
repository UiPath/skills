task_id: skill-platform-users-import-robot-smoke
description: >
  Smoke test: agent uses the uipath-platform skill to import a robot
  account into the Orchestrator tenant. Verifies the agent (a) finds the
  IS UUID via `admin robot-accounts list --search` (or remembers it from
  a prior `admin robot-accounts create`), and (b) calls
  `uip or users import --directory-id <uuid> --type DirectoryRobot
  --domain autogen` with all three flags. Without --directory-id the
  CLI rejects with "Missing --directory-id"; without --type the CLI
  errors on a required option. Auth/404 errors are acceptable — goal is
  correct command shape.
tags: [uipath-platform, smoke, mode:build, lifecycle:setup]

run_limits:
  expected_turns: 13

initial_prompt: |
  I created a robot account in Identity Service called "InvoiceRunner"
  with id `f1b2c3d4-0000-0000-0000-000000000001`. I want to import it
  into the Orchestrator tenant so I can later assign it to folders.

  Use `--output json` on all uip commands.

  Important:
  - Auth, Forbidden and 404 errors are expected here and count as done —
    whether the tenant accepts the import is not what this checks. If the CLI
    itself rejects the command as malformed, that is different: fix the
    command and run it again.
  - Do NOT log in, refresh tokens, inspect environment variables, decode
    tokens, or call REST APIs with curl. Once the import command reaches the
    server, stop and summarize the result.

success_criteria:
  - type: command_executed
    description: "Agent called `uip or users import` (the single IS→tenant integration point)"
    tool_name: "Bash"
    command_pattern: 'uip\s+(or|orchestrator)\s+users\s+import'
    min_count: 1
    weight: 3.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent passed --type DirectoryRobot"
    tool_name: "Bash"
    command_pattern: 'uip\s+(or|orchestrator)\s+users\s+import[\s\S]*--type\s+DirectoryRobot'
    min_count: 1
    weight: 2.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent passed --directory-id (required for Robot — server-side Key check)"
    tool_name: "Bash"
    command_pattern: 'uip\s+(or|orchestrator)\s+users\s+import[\s\S]*--directory-id'
    min_count: 1
    weight: 2.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent passed --domain (required; 'autogen' for Robot)"
    tool_name: "Bash"
    command_pattern: 'uip\s+(or|orchestrator)\s+users\s+import[\s\S]*--domain\s+autogen'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: command_not_executed
    # The rationale this used to carry — "omitting --type defaults to
    # DirectoryUser, silently corrupting the import" — no longer holds:
    # --type is a requiredOption, so the CLI answers `required option
    # '--type <type>' not specified` and never reaches the server. Kept as a
    # shape guard, not a corruption guard. Note it is strict on EVERY import
    # call, so an agent that probes without --type before correcting trips it;
    # if that shows up in practice, drop this criterion — criterion 2 already
    # pins the successful call, and the CLI enforces the rest.
    description: "Agent never issued an import without --type (CLI rejects it; shape guard)"
    tool_name: "Bash"
    command_pattern: 'uip\s+(or|orchestrator)\s+users\s+import(?!\s+--help)(?![\s\S]*--type)'
    weight: 2.0
    pass_threshold: 1.0
