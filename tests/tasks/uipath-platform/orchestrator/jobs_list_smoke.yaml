task_id: skill-platform-orchestrator-jobs-list
description: >
  Smoke test: agent uses the uipath-platform skill to list Orchestrator jobs
  scoped to a folder via `uip or jobs list --folder-(key|path) ... --output
  json`. The prompt asks for live job records, so the agent must read them
  from Orchestrator, not from Insights (historical aggregates). Prompt passes
  a placeholder folder key — the CLI returning Auth/400/404 is an acceptable
  outcome; the goal is correct command shape, not tenant state.
tags: [uipath-platform, smoke, mode:operate, lifecycle:discover]

run_limits:
  expected_turns: 8

initial_prompt: |
  List the jobs that are currently in Faulted state in the Orchestrator
  folder with key `11111111-2222-3333-4444-555566667777` in the current
  UiPath tenant. I need the live job records from Orchestrator, not
  historical metrics. If the folder doesn't exist or I can't access it,
  just tell me; don't look in other folders.

success_criteria:
  - type: command_executed
    description: "Agent listed jobs via uip or jobs list"
    tool_name: "Bash"
    command_pattern: 'uip\s+(or|orchestrator)\s+jobs\s+list'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent scoped the list to a folder via --folder-key or --folder-path"
    tool_name: "Bash"
    command_pattern: 'uip\s+(or|orchestrator)\s+jobs\s+list.*--folder-(key|path)'
    min_count: 1
    weight: 1.0
    pass_threshold: 1.0

  - type: command_executed
    description: "Agent filtered server-side with --state Faulted (server-side filter — server has a flag for state, so client-side --output-filter is the wrong tool here)"
    tool_name: "Bash"
    command_pattern: 'uip\s+(or|orchestrator)\s+jobs\s+list.*--state\s+Faulted'
    min_count: 1
    weight: 1.5
    pass_threshold: 1.0

  - type: command_not_executed
    description: "Agent did not query Insights (historical aggregates) for live job records"
    tool_name: "Bash"
    command_pattern: 'uip\s+insights\b'
    max_count: 0
    weight: 1.5
    pass_threshold: 1.0
