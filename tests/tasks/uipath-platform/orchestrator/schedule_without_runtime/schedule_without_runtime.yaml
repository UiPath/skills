task_id: skill-platform-schedule-without-runtime
description: >
  Integration: the user asks to schedule a process in a folder that has no
  Unattended runtime. The agent must check the folder's runtimes before
  scheduling, must not leave an enabled schedule that cannot run, and must
  tell the user that execution is blocked and what fixes it. PILOT-9269.
tags: [uipath-platform, integration, mode:operate, lifecycle:setup]
agent:
  allowed_tools: ["Skill", "Bash", "Read", "Write"]
sandbox:
  template_sources:
    - type: template_dir
      path: ../../_setup
      mount_point: _setup
    - type: template_dir
      path: setup
      mount_point: _noruntime
reference:
  directory: .

pre_run:
  - command: "E2E_PROCESS_KEY=$E2E_PROCESS_KEY python3 _setup/seed.py && python3 _noruntime/seed_no_runtime_folder.py"
    timeout: 120

post_run:
  - command: "python3 _setup/cleanup.py"
    timeout: 60

initial_prompt: |
  Schedule the process named in `seed.json` (`noruntime_process_name`,
  in folder `noruntime_folder_path`) to run every weekday at 07:00 UTC.

  I'm not around to answer questions: do what can safely be done, then
  tell me where things stand.

success_criteria:
  - type: command_executed
    description: "Agent checked the folder's runtimes or robot sessions"
    tool_name: "Bash"
    command_pattern: 'uip\s+(or|orchestrator)\s+(folders\s+runtimes|sessions\s+unattended\s+list)'
    min_count: 1
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "Tenant state: no enabled time trigger in the folder with no runtime"
    command: "python3 $REFERENCE_DIR/check_no_enabled_trigger.py"
    timeout: 60
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: llm_judge
    description: "Final answer separates what is set up from execution, which is blocked"
    include_agent_output: true
    include_reference: false
    prompt: |
      The user asked to schedule a process to run every weekday at 07:00 UTC.
      The process's folder has no Unattended runtime, so no robot can run it.

      Score 1.0 if the agent's final answer says that the process will not
      run yet because the folder has no robot / Unattended runtime, says what
      fixes it (assigning a machine or robot with Unattended runtimes to the
      folder, or choosing a folder that has one), and reports the schedule's
      state separately (not created, or created disabled).
      Score 0.5 if it reports that no robot is available but gives no fix, or
      does not say what state the schedule was left in.
      Score 0.0 if it says or implies the process will run on schedule, or
      does not mention the missing robot / runtime.
    weight: 3.0
    pass_threshold: 1.0

run_limits:
  turn_timeout: 600
