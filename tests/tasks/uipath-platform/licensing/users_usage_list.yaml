task_id: skill-platform-licensing-users-usage-list
description: >
  Smoke test: agent uses the uipath-platform skill to answer a per-user
  consumption question with the organization's user-usage table. Verifies
  the agent reaches for `uip platform users usage list` (sorted as asked)
  rather than the org-level consumables report, which cannot answer a
  per-user question. CLI auth failure is expected in this offline
  environment.
tags: [uipath-platform, smoke, licensing, users, mode:operate, lifecycle:discover]

sandbox:
  # uip PATH shim -> .uip-cmdlog (see _shared/uip-shim): command telemetry as a
  # filesystem side effect. Some agent backends (Antigravity) run commands via
  # background tasks that never surface as tool calls, so command_executed
  # criteria see zero commands even when the agent ran the exact command.
  template_sources:
    - type: template_dir
      path: _shared/uip-shim
  mock_path_dirs:
    - .cmdlog-bin

initial_prompt: |
  Which users in this organization are eating into their monthly allowance
  or their top-up wallet? Show me the per-user consumption table for the
  organization, sorted by email.

  Important:
  - The `uip` CLI is available but is NOT connected to a live tenant in this
    environment. Commands may fail with auth errors — that is expected. Run
    each command once and move on. Do NOT retry or attempt to login.
  - Use `--output json` on every uip command.

success_criteria:
  - type: run_command
    description: "Agent ran `uip platform users usage list` (.uip-cmdlog shim log)"
    command: "grep -Eq 'uip platform users usage list' .uip-cmdlog"
    timeout: 10
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "Agent sorted the table by email as asked (--sort-by email)"
    command: "grep -E 'uip platform users usage list' .uip-cmdlog | grep -Eq -- '--sort-by[= ]email'"
    timeout: 10
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0

  - type: run_command
    description: "Agent did not substitute the org-level consumables report for a per-user question"
    command: "test -f .uip-cmdlog && ! grep -Eq '^ *uip platform licenses consumables' .uip-cmdlog"
    timeout: 10
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0
