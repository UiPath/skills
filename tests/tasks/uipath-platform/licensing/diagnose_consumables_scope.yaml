task_id: skill-platform-licensing-diagnose-consumables-scope
description: >
  Integration test (mode:diagnose): two consumables figures that look wrong but
  are correct by design — `consumedFromOrgWithoutTenant` suppressed under
  `--tenant`, and non-recursive `folders` totals. Verifies the agent reaches the
  "reporting is not broken" verdict and names both documented semantics.
tags: [uipath-platform, integration, licensing, consumables, mode:diagnose, lifecycle:discover]

sandbox:
  # uip PATH shim -> .uip-cmdlog (see _shared/uip-shim): command telemetry as a
  # filesystem side effect. Some agent backends (Antigravity) run commands via
  # background tasks that never surface as tool calls, so command_executed
  # criteria see zero commands even when the agent ran the exact command.
  template_sources:
    - type: template_dir
      path: _shared/uip-shim
  mock_path_dirs:
    - .cmdlog-bin

initial_prompt: |
  Our AI Units (`AIU`) consumption reporting looks broken. Two problems, both
  for tenant `default` over 2026-04-01 to 2026-04-30:

  1. When I scope a consumables summary to that tenant,
     `consumedFromOrgWithoutTenant` comes back as 0 — but account-wide it is
     definitely not 0.
  2. The per-folder AIU numbers for that tenant do not add up to the tenant's
     own total for the same period.

  Is consumption reporting actually broken? Write your verdict and reasoning to
  `verdict.md` in the current directory.

  Important:
  - The `uip` CLI is available but is NOT connected to a live tenant in this
    environment. Commands may fail with auth errors — that is expected. Run
    each command once and move on. Do NOT retry or attempt to login.

success_criteria:
  - type: run_command
    description: "Agent ran a tenant-scoped consumables summary to reproduce observation 1 (.uip-cmdlog shim log). Summary is the CLI default mode, so an omitted --mode counts."
    command: "grep -E 'uip platform licenses consumables get' .uip-cmdlog | grep -Ev -- '--mode[= ](daily|folders)' | grep -Eq -- '--tenant[= ]default'"
    timeout: 10
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "Agent also ran the summary UNSCOPED, so scoped and account-wide figures could be compared — the diagnostic move, not just an assertion about it. Summary is the CLI default mode, so an omitted --mode counts."
    command: "grep -E 'uip platform licenses consumables get' .uip-cmdlog | grep -Ev -- '--mode[= ](daily|folders)' | grep -v -- '--tenant' | grep -q ."
    timeout: 10
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "Agent ran folders mode to reproduce observation 2"
    command: "grep -E 'uip platform licenses consumables get' .uip-cmdlog | grep -Eq -- '--mode[= ]folders'"
    timeout: 10
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: file_exists
    description: "Verdict written to verdict.md"
    path: "verdict.md"
    weight: 1.0
    pass_threshold: 1.0

  # Semantic, not structural: the documented cause has unbounded phrasings
  # ("by design", "by-design", "intentional", "org-level only", "no tenant to
  # attribute it to"). Regex variants of this check have now failed three
  # correct verdicts, so grade the concept and ignore the wording. Judged on
  # the artifact only — no dialog, no agent output.
  - type: llm_judge
    description: "Verdict explains observation 1: consumedFromOrgWithoutTenant is org-scoped with no tenant attribution, so a --tenant summary reports 0 by design"
    weight: 2.0
    pass_threshold: 1.0
    include_dialog: false
    include_agent_output: false
    include_reference: false
    files:
      - verdict.md
    prompt: |
      Read the attached verdict.md. Grade ONLY whether it explains why
      `consumedFromOrgWithoutTenant` reads 0 in a summary scoped with
      `--tenant`.

      Score 1.0 if the verdict conveys that this figure counts organization
      consumption that cannot be attributed to any tenant, and that a
      tenant-scoped query therefore reports 0 as intended behaviour rather
      than a defect.

      Wording is irrelevant. "by design", "by-design", "intentional",
      "deliberate", "suppressed under --tenant", "org-level only",
      "definitionally org-scoped", and "there is no tenant to attribute it
      to" are all equivalent and all score 1.0. Ignore formatting, length,
      structure, and whether the CLI calls succeeded.

      Score 0.0 only if the verdict treats the 0 as data loss, a calculation
      bug, or an unexplained discrepancy, or does not address the field.

  # Same reasoning as observation 1 — graded on the concept, not the wording.
  - type: llm_judge
    description: "Verdict explains observation 2: folder rows carry only their own consumption, so they do not sum to the tenant total"
    weight: 2.0
    pass_threshold: 1.0
    include_dialog: false
    include_agent_output: false
    include_reference: false
    files:
      - verdict.md
    prompt: |
      Read the attached verdict.md. Grade ONLY whether it explains why the
      per-folder AIU figures do not add up to the tenant's own total.

      Score 1.0 if the verdict conveys that a folder row carries only that
      folder's own consumption and therefore is not a rollup of the tenant —
      whether it attributes the shortfall to descendants being excluded from
      a parent's row (non-recursive `consumedBySelf`), to consumption that
      resolves to no folder at all, or to both. Any of those is correct.

      Wording is irrelevant; ignore formatting, length, and whether the CLI
      calls succeeded.

      Score 0.0 only if the verdict treats the gap as a miscalculation or
      data loss, or does not address it.

  - type: run_command
    description: "Verdict concludes reporting is NOT broken. Needs a negative-polarity statement (hedges like 'not shown to be broken' count); bare 'correct'/'expected'/'by design' are too weak — they appear in wrong verdicts too."
    command: "grep -Eiq 'not( (shown|demonstrated|proven|actually|really|truly|clearly|evidently|apparently|to|be))* broken|is ?n.?t broken|no evidence (of|that)[^.]{0,60}(broken|defect|bug)|(is|are) working as (designed|intended|documented|specified)|works? as (designed|intended|documented|specified)|not a (bug|defect)' verdict.md"
    timeout: 10
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0
