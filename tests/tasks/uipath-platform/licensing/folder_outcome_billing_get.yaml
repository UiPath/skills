task_id: skill-platform-licensing-folder-outcome-billing-get
description: >
  Smoke test: agent uses the uipath-platform skill to read whether outcome
  billing (Fully Loaded Transactions) is enabled for one folder. Verifies the
  agent calls `uip platform tenants folder-outcome-billing get <tenant-id>
  <folder-key>` with the two GUIDs in that order, and does not write the
  setting while answering a read question. CLI auth failure is expected in
  this offline environment.
tags: [uipath-platform, smoke, licensing, tenants, mode:operate, lifecycle:discover]

sandbox:
  # uip PATH shim -> .uip-cmdlog (see _shared/uip-shim): command telemetry as a
  # filesystem side effect. Some agent backends (Antigravity) run commands via
  # background tasks that never surface as tool calls, so command_executed
  # criteria see zero commands even when the agent ran the exact command.
  template_sources:
    - type: template_dir
      path: _shared/uip-shim
  mock_path_dirs:
    - .cmdlog-bin

initial_prompt: |
  Is outcome billing turned on for folder `8c144c85-de47-40b7-bfb9-c87dbbe338d4`
  in tenant `5f322473-4d62-4bc9-9257-c4b50e78344b`?

  Use the `uipath-platform` skill and its Folder Outcome Billing workflow for
  this request.

  Important:
  - The `uip` CLI is available but is NOT connected to a live tenant in this
    environment. Commands may fail with auth errors — that is expected. Run
    each command once and move on. Do NOT retry or attempt to login.
  - Use `--output json` on every uip command.

success_criteria:
  - type: run_command
    description: "Agent ran `uip platform tenants folder-outcome-billing get <tenant-id> <folder-key>` in that argument order (.uip-cmdlog shim log)"
    command: "grep -Eq 'uip platform tenants folder-outcome-billing get 5f322473-4d62-4bc9-9257-c4b50e78344b 8c144c85-de47-40b7-bfb9-c87dbbe338d4' .uip-cmdlog"
    timeout: 10
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "Agent did not change the setting while answering a read question (no folder-outcome-billing set)"
    command: "test -f .uip-cmdlog && ! grep -E '^ *uip platform tenants folder-outcome-billing set\\b' .uip-cmdlog | grep -qv -- '--help'"
    timeout: 10
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0
