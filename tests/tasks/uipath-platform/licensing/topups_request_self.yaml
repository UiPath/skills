task_id: skill-platform-licensing-topups-request-self
description: >
  Smoke test: agent uses the uipath-platform skill to ask for a top-up on
  behalf of the logged-in user. Verifies the agent uses the self-service
  `uip platform users top-ups request` (no user argument; the governance
  policy decides between notifying admins and auto-granting) rather than
  granting itself one with the admin `top-ups create`, and that it does not
  loop on the request when it is refused — a refusal (NotEligible,
  NoActiveDistribution, AlreadyGranted, AllowanceAvailable) only clears when
  the user's usage or entitlements change. CLI auth failure is expected in
  this offline environment.
tags: [uipath-platform, smoke, licensing, users, mode:operate, lifecycle:setup]

sandbox:
  # uip PATH shim -> .uip-cmdlog (see _shared/uip-shim): command telemetry as a
  # filesystem side effect. Some agent backends (Antigravity) run commands via
  # background tasks that never surface as tool calls, so command_executed
  # criteria see zero commands even when the agent ran the exact command.
  template_sources:
    - type: template_dir
      path: _shared/uip-shim
  mock_path_dirs:
    - .cmdlog-bin

initial_prompt: |
  I've run out of units for my agents this month. Ask for a top-up for me.

  Use the `uipath-platform` skill and its User Usage & Top-ups workflow for
  this request.

  Important:
  - The `uip` CLI is available but is NOT connected to a live tenant in this
    environment. Commands may fail with auth errors — that is expected. Run
    each command once and move on. Do NOT retry or attempt to login.
  - Use `--output json` on every uip command.

success_criteria:
  # The self-service form is `top-ups request` followed by flags only — it
  # takes no user argument; the request is always for the logged-in user.
  - type: run_command
    description: "Agent asked for the top-up with `uip platform users top-ups request` and no user argument (.uip-cmdlog shim log)"
    command: "grep -Eq '^ *uip platform users top-ups request( +--[a-z-]+(=[^ ]+| +[^- ][^ ]*)?)* *$' .uip-cmdlog"
    timeout: 10
    expected_exit_code: 0
    weight: 3.0
    pass_threshold: 1.0

  - type: run_command
    description: "Agent did not grant itself a top-up with the admin `top-ups create`"
    command: "test -f .uip-cmdlog && ! grep -Eq '^ *uip platform users top-ups create' .uip-cmdlog"
    timeout: 10
    expected_exit_code: 0
    weight: 2.0
    pass_threshold: 1.0

  - type: run_command
    description: "Agent did not loop on the request (at most 2 attempts; a refusal does not clear on retry)"
    command: "test \"$(grep -Ec '^ *uip platform users top-ups request' .uip-cmdlog)\" -le 2"
    timeout: 10
    expected_exit_code: 0
    weight: 1.0
    pass_threshold: 1.0
