task_id: skill-ixp-upgrade-deployment-smoke
description: >
  Smoke: a folder already serves v13 of the project; the agent moves it to v14
  with `deployments upgrade`, addressing the deployment by the DeploymentName
  read from `deployments list`.
  Trap: `create` only ever adds — re-deploying the title on another version is
  a 409, not a repoint. Second trap: `upgrade` takes the backend-minted
  DeploymentName (`invoices-08963f00-ixp`), not the title (`invoices`) the
  deployment was created under; the suffix cannot be derived, so the agent has
  to read it rather than construct it.

  Overlays the deployment-serving mock so the read succeeds — see
  ../_shared/mock_template_deployments/README.md. Grades command shape.
tags: [uipath-ixp, smoke, mode:build, lifecycle:setup]

run_limits:
  expected_turns: 6

sandbox:
  mock_path_dirs: [mocks]
  template_sources:
    - {type: template_dir, path: ../_shared/mock_template}
    - {type: template_dir, path: ../_shared/mock_template_deployments}

initial_prompt: |
  Orchestrator folder `3f0a91c7-1111-2222-3333-444455556666` currently serves
  model version 13 of IXP project `my_invoices-f1afa9ef-ixp`, deployed under the
  title `invoices`. Trained version 14 is ready. Make that folder serve version
  14 instead.

  Important:
  - The `uip` CLI in this environment is not connected to a live tenant;
    some commands fail. Run each command once and move on. Do NOT retry or
    attempt to login.
  - Do NOT prompt the user for confirmation — this is an automated test.

success_criteria:
  # Per-facet matching is what lets this assert the carried-over NAME: the slug
  # is the second positional, so a constructed title cannot satisfy it.
  - type: cli_called
    description: "Moved the deployment with `deployments upgrade <Name> invoices-08963f00-ixp --version 14 --folder-key <key>`"
    log: "mocks/calls.jsonl"
    verb: "ixp deployments upgrade"
    tool: "uip"
    positional: ["my_invoices-f1afa9ef-ixp", "invoices-08963f00-ixp"]
    flags:
      version: "14"
      folder-key: "3f0a91c7-1111-2222-3333-444455556666"
    weight: 3.0
    pass_threshold: 1.0

  - type: cli_called
    description: "Read the DeploymentName from `deployments list` instead of constructing it from the title"
    log: "mocks/calls.jsonl"
    verb: "ixp deployments list"
    tool: "uip"
    positional: ["my_invoices-f1afa9ef-ixp"]
    weight: 1.5
    pass_threshold: 1.0

  # `upgrade` is addressed by DeploymentName. The title in the deployment slot is
  # a clean 404 — the failure the name/title split exists to prevent. The slot is
  # matched exactly, so this does NOT fire on `invoices-08963f00-ixp`.
  # `value_flags` is load-bearing: --version / --folder-key are not declared under
  # `flags` here, so without it their values stay non-flag, shift the positional
  # slots, and argument ordering dodges the guard.
  - type: cli_called
    description: "Did NOT pass the title `invoices` where the DeploymentName belongs"
    log: "mocks/calls.jsonl"
    verb: "ixp deployments upgrade"
    tool: "uip"
    positional: ["my_invoices-f1afa9ef-ixp", "invoices"]
    value_flags: ["version", "folder-key", "output"]
    min_count: 0
    max_count: 0
    weight: 2.0
    pass_threshold: 1.0

  # The deployment already exists on another version, so `create` is a 409, not
  # a repoint. Reaching for it is the mis-model the create/upgrade split exists
  # to prevent. Positive control: the upgrade line above.
  - type: cli_called
    description: "Did NOT try to repoint the existing deployment with `deployments create` (409, not a repoint)"
    log: "mocks/calls.jsonl"
    verb: "ixp deployments create"
    tool: "uip"
    min_count: 0
    max_count: 0
    weight: 2.0
    pass_threshold: 1.0
