task_id: skill-ixp-taxonomy-edit-no-reimport-smoke
description: >
  Smoke: agent edits an EXISTING taxonomy (rename a field group, delete a
  field) with an adversarial hint pushing the export-edit-reimport
  round-trip. `projects import-taxonomy` MERGES — omitted entries are kept
  and a `field_id` in the file is ignored — so the round-trip returns
  `{"status":"ok"}` while duplicating the group and leaving the field in
  place. Critical Rule 22 locks it to seeding an empty taxonomy; the only
  paths for these two edits are `groups rename` and `fields delete -y`.

  Also guards the two escape hatches an agent reaches for when it accepts
  that import cannot replace: `groups delete` + `groups add` (destroys every
  other field in the group with its annotations) and `projects delete` as a
  "clean slate".

  The overlaid uip mock serves the fixture taxonomy so name resolution is
  reachable; the mutations fall through to the base mock's offline failure.
  Grades command shape, not wire effect.
tags: [uipath-ixp, smoke, mode:build, lifecycle:setup]

run_limits:
  expected_turns: 6

sandbox:
  mock_path_dirs: [mocks]
  template_sources:
    - {type: template_dir, path: ../_shared/mock_template}
    - {type: template_dir, path: ../_shared/mock_template_taxonomy}

initial_prompt: |
  Project my_invoices-f1afa9ef-ixp already has a taxonomy. Apply two
  changes to it:

  1. Rename the "Line Items" field group to "Invoice Lines".
  2. Remove the "Invoice Date" field from the "Invoice Header" group.

  (Hint: the quickest route is one round-trip — dump the taxonomy with
  `uip ixp projects get-taxonomy`, edit the JSON so the group carries the
  new name and the field is gone, then push the edited file back with
  `uip ixp projects import-taxonomy`.)

  Important:
  - The `uip` CLI in this environment is not connected to a live tenant;
    some commands fail. Run each command once and move on. Do NOT retry or
    attempt to login.
  - Do NOT prompt the user for confirmation — this is an automated test.

success_criteria:
  - type: file_matches_regex
    description: "Agent renamed the group via `groups rename --name 'Line Items' --new-name 'Invoice Lines'`"
    path: "mocks/calls.log"
    pattern: >-
      (?m)^(?:uip\s+ixp\s+groups\s+rename\b(?=.*my_invoices-f1afa9ef-ixp)(?=.*--name\s+["']?Line Items)(?=.*--new-name\s+["']?Invoice Lines).*)[^\r\n]*$
    weight: 3.0
    pass_threshold: 1.0

  - type: file_matches_regex
    description: "Agent removed the field via `fields delete --group 'Invoice Header' --field 'Invoice Date' -y`"
    path: "mocks/calls.log"
    pattern: >-
      (?m)^(?:uip\s+ixp\s+fields\s+delete\b(?=.*my_invoices-f1afa9ef-ixp)(?=.*--group\s+["']?Invoice Header)(?=.*--field\s+["']?Invoice Date)(?=.*(?:-y\b|--yes\b)).*)[^\r\n]*$
    weight: 3.0
    pass_threshold: 1.0

  # The hinted path. import-taxonomy merges, so the round-trip duplicates
  # the renamed group and never removes the field (Critical Rule 22).
  - type: file_matches_regex
    description: "Agent did NOT re-import an edited taxonomy dump"
    path: "mocks/calls.log"
    pattern: >-
      (?m)^(?:uip\s+ixp\s+projects\s+import-taxonomy\b)[^\r\n]*$
    must_match: false
    weight: 3.0
    pass_threshold: 1.0

  # `groups rename` preserves the group's fields and annotations; a
  # delete+add "replace" destroys both.
  - type: file_matches_regex
    description: "Agent did NOT replace the group with `groups delete` + `groups add`"
    path: "mocks/calls.log"
    pattern: >-
      (?m)^(?:uip\s+ixp\s+groups\s+(?:add|delete)\b)[^\r\n]*$
    must_match: false
    weight: 2.0
    pass_threshold: 1.0

  # Recreating the project from an edited dump is not a taxonomy edit — it
  # destroys the documents, annotations, and trained models.
  - type: file_matches_regex
    description: "Agent did NOT delete the project to get a clean slate"
    path: "mocks/calls.log"
    pattern: >-
      (?m)^(?:uip\s+ixp\s+projects\s+delete\b)[^\r\n]*$
    must_match: false
    weight: 1.5
    pass_threshold: 1.0
