task_id: skill-ixp-create-choice-type-smoke
description: >
  Smoke: agent creates a custom Choice data type with three options and
  instructions.

  Harness is unauthenticated; CLI calls fail with auth errors.
  Grades command shape, not wire effect.
tags: [uipath-ixp, smoke, mode:build, lifecycle:setup]

run_limits:
  expected_turns: 5

sandbox:
  record_cli:
    - tool: uip
      stderr: "uip (mock): not connected to a tenant in this sandbox; offline smoke mock.\n"
    - tool: curl
      stderr: "curl (mock): network egress is disabled in this offline smoke sandbox.\n"

initial_prompt: |
  In the IXP project my_invoices-f1afa9ef-ixp, create a new Field Type named
  "clause presence" of data type Choice with the display values: True, False,
  not present. Instructions: output "not present" if the document has no
  termination-by-counterparty clause; "True" if the clause is present and
  obliges the parties to auto-renew; "False" if it is present but does not
  oblige auto-renewal.

  Important:
  - The `uip` CLI is available but is NOT connected to a live IXP tenant in
    this environment. Commands will fail with auth errors — that is expected.
    Run each command once and move on. Do NOT retry or attempt to login.
  - Do NOT prompt the user for confirmation — this is an automated test.

success_criteria:
  # The three display values are asserted against --choices, not the whole line:
  # the prompt's own instructions text contains "not present", "True" and "False",
  # so the regex this replaced was satisfied by --instructions alone.
  - type: cli_called
    description: "Agent created the choice type via `data-types add … --kind choice … --choices`"
    verb: "ixp data-types add"
    tool: "uip"
    positional: ["my_invoices-f1afa9ef-ixp"]
    flags:
      name: "clause presence"
      kind: "choice"
      choices:
        matches_regex: '(?=[\s\S]*[Tt]rue)(?=[\s\S]*[Ff]alse)(?=[\s\S]*[Nn]ot[ _-]?[Pp]resent)'
      instructions: {present: true}
    # `present` deliberately does not make a flag value-bearing, so --instructions
    # and the kind-choice-mandatory --input-value are declared here to keep their
    # values out of the positionals.
    value_flags: ["instructions", "input-value", "output"]
    weight: 3.0
    pass_threshold: 1.0
