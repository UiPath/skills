task_id: skill-ixp-create-project-suggest-taxonomy-smoke
description: >
  Smoke: agent creates a project and lets IXP auto-suggest the taxonomy from
  the documents. Trap: don't pass --skip-taxonomy or hand-author/import a
  taxonomy — IXP suggests it.

  Harness is unauthenticated; CLI calls fail with auth errors.
  Grades command shape, not wire effect.
tags: [uipath-ixp, smoke, mode:build, lifecycle:setup]

run_limits:
  expected_turns: 5

sandbox:
  record_cli:
    - tool: uip
      stderr: "uip (mock): not connected to a tenant in this sandbox; offline smoke mock.\n"
    - tool: curl
      stderr: "curl (mock): network egress is disabled in this offline smoke sandbox.\n"

initial_prompt: |
  Create an IXP project named ap-invoices from the invoices in ./invoices/,
  and let IXP suggest the taxonomy.

  Important:
  - The `uip` CLI is available but is NOT connected to a live IXP tenant in
    this environment. Commands will fail with auth errors — that is expected.
    Run each command once and move on. Do NOT retry or attempt to login.
  - Do NOT prompt the user for confirmation — this is an automated test.

success_criteria:
  - type: cli_called
    description: "Agent created ap-invoices via `projects create` from ./invoices/"
    verb: "ixp projects create"
    tool: "uip"
    positional: ["ap-invoices"]
    value_flags: ["description", "d", "output"]
    weight: 3.0
    pass_threshold: 1.0

  # Autopilot path: let IXP suggest the taxonomy. --skip-taxonomy or a manual
  # import would defeat the test. One regex alternation became two guards, since
  # cli_called cannot OR across facet sets; 0.5 each keeps the old 1.0 total.
  #
  # `present` is load-bearing on the first: a value-bearing --skip-taxonomy would
  # swallow the folder path, and the guard would pass on the call it forbids.
  - type: cli_called
    description: "Agent did NOT skip the taxonomy on create (autopilot suggests it)"
    verb: "ixp projects create"
    tool: "uip"
    flags:
      skip-taxonomy: {present: true}
    min_count: 0
    max_count: 0
    weight: 0.5
    pass_threshold: 1.0

  - type: cli_called
    description: "Agent did NOT hand-import a taxonomy (autopilot suggests it)"
    verb: "ixp projects import-taxonomy"
    tool: "uip"
    min_count: 0
    max_count: 0
    weight: 0.5
    pass_threshold: 1.0
