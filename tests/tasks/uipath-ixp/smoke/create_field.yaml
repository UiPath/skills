task_id: skill-ixp-create-field-smoke
description: >
  Smoke: agent adds a single field to an existing group.

  Offline: `uip` is a generated stub that answers this task's calls from
  canned responses. Grades command shape, not wire effect.
tags: [uipath-ixp, smoke, mode:build, lifecycle:setup]

run_limits:
  expected_turns: 5

sandbox:
  record_cli:
    - tool: uip
      # Every call the correct path makes is answered below. Anything else
      # falls through to this fallback and fails, so an off-path invocation
      # still looks like a CLI that refused rather than one that agreed.
      stderr: "uip (mock): offline sandbox - this call is not one the task stubs. Continue with the task; do not retry or log in.\n"
      responses:
        - when: {verb: "ixp projects get-taxonomy", value_flags: ["output"]}
          stdout: |
            {"Result":"Success","Data":{"status":"ready","dataset":{"entity_defs":[{"id":"b3a63e6483adaaba","name":"Exact Text","title":"","inherits_from":[],"trainable":true,"color":2,"instructions":""},{"id":"c128ad65bd8af3f8","name":"Date","title":"","inherits_from":["0000000000000007"],"trainable":true,"color":1,"instructions":""},{"id":"e5d7402ba91c6f38","name":"Monetary Quantity","title":"","inherits_from":["0000000000000005"],"trainable":true,"color":4,"instructions":""}],"label_groups":[{"name":"default","label_defs":[{"name":"Invoice Header","id":"5f21c88ab90d4e17","instructions":"Header-level fields of the supplier invoice.","moon_form":[{"field_id":"9a3f5d2c81b7e604","id":"b3a63e6483adaaba","field_type_id":"b3a63e6483adaaba","kind":"Exact Text","name":"Invoice Number","instructions":"The unique invoice identifier printed in the document header.","rule_set":null},{"field_id":"1d8e42b7c3a95f60","id":"c128ad65bd8af3f8","field_type_id":"c128ad65bd8af3f8","kind":"Date","name":"Invoice Date","instructions":"The issue date of the invoice.","rule_set":null},{"field_id":"6e0b74a1f83c2d95","id":"e5d7402ba91c6f38","field_type_id":"e5d7402ba91c6f38","kind":"Monetary Quantity","name":"Total Amount","instructions":"The grand total payable on the invoice, including tax.","rule_set":null}]},{"name":"Line Items","id":"7be409c2d15fa833","instructions":"One entry per line item row on the invoice.","moon_form":[{"field_id":"c47a91e05d2b3f68","id":"b3a63e6483adaaba","field_type_id":"b3a63e6483adaaba","kind":"Exact Text","name":"Description","instructions":"The line item description as printed on the row.","rule_set":null}]},{"name":"Subscriber information","id":"2a6f0c9be4d18537","instructions":"Details of the subscriber named on the invoice.","moon_form":[{"field_id":"e83b15d7a0c94f26","id":"b3a63e6483adaaba","field_type_id":"b3a63e6483adaaba","kind":"Exact Text","name":"surname","instructions":"The subscriber's family name.","rule_set":null}]}]}]}}}
        - when: {verb: "ixp fields add", value_flags: ["output"]}
          stdout: |
            {"Result":"Success"}
    - tool: curl
      stderr: "curl (mock): network egress is disabled in this offline smoke sandbox.\n"

initial_prompt: |
  In the IXP project my_invoices-f1afa9ef-ixp, add a new field named "email"
  to the "Subscriber information" group.

  Do NOT prompt the user for confirmation — this is an automated test.

success_criteria:
  - type: cli_called
    description: "Agent added field \"email\" to \"Subscriber information\" via `fields add`"
    verb: "ixp fields add"
    tool: "uip"
    positional: ["my_invoices-f1afa9ef-ixp"]
    flags:
      group: "Subscriber information"
      field: "email"
    # --type/--instructions carry values but get no predicate here, so they must be
    # declared: undeclared, their values stay non-flag and shift the positional slot
    # the project name is asserted in.
    value_flags: ["type", "instructions", "output"]
    weight: 3.0
    pass_threshold: 1.0
