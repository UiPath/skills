task_id: skill-ixp-metrics-duplicate-field-names-smoke
description: >
  Smoke: comparing two model versions, the agent matches fields on `FieldId`
  and only REPORTS `Name` — the rule in improve-prompts-guide § 1a.

  The fixture gives two different fields the same display name "Description",
  one in each of two groups. That is legal in a real taxonomy, and it is the
  case the rule exists for. An agent that joins version 20 to version 21 on
  `Name` collapses the pair and reports three fields instead of four; one that
  looks the baseline up by name reports four but reads the wrong baseline for
  the Invoice-group "Description" (0.900 instead of its own 0.700) and calls
  an unchanged field regressed. Matching on `FieldId` is the only route to
  both the right count and the right verdicts.

  Because the two share a name, guide § 1a also requires the report to qualify
  them with their `FieldGroup` — a bare "Description" twice tells the reader
  nothing about which score is which.

  The artifact asks only for the display name, as the guide prescribes — the
  `FieldId` join is internal and is graded through its consequences, never
  named in the prompt. The one id that legitimately surfaces is the fallback:
  `dddd000000000003` was deleted from the taxonomy after version 20 was
  scored, so `get-metrics` returns its `Name` as null. The served
  `get-taxonomy` omits it too — the superseded join could not have named it
  either. The rule is to fall back to `FieldId`, never to drop the field.
tags: [uipath-ixp, smoke, mode:operate, lifecycle:improve]

run_limits:
  expected_turns: 6

sandbox:
  mock_path_dirs: [mocks]
  template_sources:
    - {type: template_dir, path: ../_shared/mock_template}
    - {type: template_dir, path: ../_shared/mock_template_metrics}

initial_prompt: |
  An improvement iteration just finished on the IXP project
  `invoices_dup-3e8b52c7-ixp`. Model version 20 was the state before it;
  version 21 is the result.

  Compare every field's F1 between the two versions and write
  `comparison.json` in the working directory:

      {"fields": [
         {"name": ..., "baseline_f1": ..., "current_f1": ..., "verdict": ...},
         ...
      ]}

  `verdict` is "regressed" if the field's F1 fell from version 20 to version
  21, otherwise "unchanged".

  Sort `fields` by `current_f1`, lowest first. Include every field, not only
  the ones that moved.

  Important:
  - Do NOT prompt the user for confirmation — this is an automated test.

success_criteria:
  - type: file_matches_regex
    description: "Read the baseline version (20), not just the current one"
    path: "mocks/calls.log"
    pattern: >-
      (?m)^(?:uip\s+ixp\s+projects\s+get-metrics\b(?=.*(?:--model-version[= ]|-m\s+)20\b).*)[^\r\n]*$
    weight: 1.0
    pass_threshold: 1.0

  # The collapse discriminator. Two fields share the name "Description", so an
  # agent keyed on Name carries three entries across the diff and reports three.
  - type: json_check
    description: "Kept the two same-named fields apart — four fields compared, not three"
    path: "comparison.json"
    assertions:
      - expression: "length(fields)"
        operator: equals
        expected: 4
    weight: 3.0
    pass_threshold: 1.0

  # Both "Description" rows must stay distinguishable in the report, so guide 1a
  # says to qualify a shared name with its `FieldGroup`. `contains` twice rather
  # than `equals` once: the guide fixes WHAT has to appear, not the separator, so
  # "Invoice > Line Items / Description" and "Description (Invoice > Line Items)" pass
  - type: json_check
    description: "Reported the regressed field as its group + display name, against its own 0.900 baseline"
    path: "comparison.json"
    assertions:
      - expression: "fields[0].name"
        operator: contains
        expected: "Description"
      - expression: "fields[0].name"
        operator: contains
        expected: "Line Items"
      # Brackets, not equality: the backend serves float32 widened to double
      # (0.8999999761581421), and the guide says to round for display — both the
      # raw value and a rounded 0.9 land inside.
      - expression: "fields[0].baseline_f1"
        operator: gte
        expected: 0.89
      - expression: "fields[0].baseline_f1"
        operator: lte
        expected: 0.91
      - expression: "fields[0].verdict"
        operator: equals
        expected: "regressed"
    weight: 3.0
    pass_threshold: 1.0

  # The namesake. Its baseline (0.700) differs from the other "Description"
  # (0.900), so an agent that looks baselines up by name reads 0.900 here and
  # calls it regressed. Only a FieldId match gives it its own 0.700.
  - type: json_check
    description: "Read the other `Description` field's own baseline — unchanged at 0.700, not regressed against its namesake's 0.900"
    path: "comparison.json"
    assertions:
      # Wanted: this row named `Description` and qualified with the `Invoice`
      # group, NOT the `Invoice > Line Items` one — separator and word order are
      # free. A regex because `contains` cannot express that exclusion, and
      # coder_eval rejects `contains` literals under 8 characters anyway.
      - expression: "fields[1].name"
        operator: regex
        expected: "(?i)^(?!.*line[ _-]*items)(?=.*description)(?=.*invoice).*$"
      - expression: "fields[1].baseline_f1"
        operator: gte
        expected: 0.69
      - expression: "fields[1].baseline_f1"
        operator: lte
        expected: 0.71
      - expression: "fields[1].verdict"
        operator: equals
        expected: "unchanged"
    weight: 3.0
    pass_threshold: 1.0

  # Null Name -> fall back to FieldId. The only id that belongs in the report.
  # Dropping the field instead also fails the length check above.
  - type: json_check
    description: "Fell back to `FieldId` for the field whose `Name` is null, rather than skipping it"
    path: "comparison.json"
    assertions:
      - expression: "fields[2].name"
        operator: contains
        expected: "dddd000000000003"
      - expression: "fields[2].verdict"
        operator: equals
        expected: "unchanged"
    weight: 2.0
    pass_threshold: 1.0

  # get-metrics now carries Name, so the taxonomy join guide 1a used to
  # prescribe is a wasted call. The mock still serves get-taxonomy, so the old
  # path stays available and this grades the choice, not the capability.
  - type: command_not_executed
    description: "Did NOT fetch the taxonomy to name fields — `get-metrics` returns `Name`"
    tool_name: "Bash"
    command_pattern: 'uip\s+ixp\s+projects\s+get-taxonomy\b'
    weight: 1.5
    pass_threshold: 1.0
