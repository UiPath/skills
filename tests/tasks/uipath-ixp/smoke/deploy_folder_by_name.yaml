task_id: skill-ixp-deploy-folder-by-name-smoke
description: >
  Smoke: the folder is named, not keyed, so the agent resolves it with
  `uip or folders list` and then deploys with the GUID it read back.
  Trap: `--folder-key` takes a GUID and there is no `--folder-path` form, so a
  folder name or path shaped into the key is wrong — and the CLI does not validate
  the key format client-side, so it fails only server-side and the agent gets no
  local signal.

  The recorder serves the folder list, which is why this task can assert the
  RESOLVED key rather than just the lookup: one static `stdout` is enough because
  only one read has to succeed. It is served for every `uip` verb, so a later
  `deployments create` also echoes the folder list — harmless here, since grading
  is on command shape, but the reason a task needing several DIFFERENT reads
  cannot use recorders this way.
tags: [uipath-ixp, smoke, mode:build, lifecycle:setup]

run_limits:
  expected_turns: 5

sandbox:
  record_cli:
    - tool: uip
      exit_code: 0
      stdout: '{"Result":"Success","Code":"OrFoldersList","Data":[{"Key":"3f0a91c7-1111-2222-3333-444455556666","DisplayName":"Invoices","FullyQualifiedName":"Finance/Invoices"},{"Key":"8c22d4e1-9999-8888-7777-666655554444","DisplayName":"Archive","FullyQualifiedName":"Finance/Archive"}]}'
    - tool: curl
      stderr: "curl (mock): network egress is disabled in this offline smoke sandbox.\n"

initial_prompt: |
  Trained model version 13 of IXP project `my_invoices-f1afa9ef-ixp` needs to be
  callable at runtime from the Orchestrator folder named `Finance/Archive`.
  Deploy it there.

  Important:
  - Run each command once and move on. Do NOT retry or attempt to login.
  - Do NOT prompt the user for confirmation — this is an automated test.

success_criteria:
  # The documented source of folder keys, and the positive control for the guards
  # below: a correct run cannot come by a key any other way.
  - type: cli_called
    description: "Went to `uip or folders list` to resolve the folder name to a key"
    verb: "or folders list"
    tool: "uip"
    weight: 1.5
    pass_threshold: 1.0

  # The resolved Archive key, not the Invoices one that shares the served payload:
  # this fails an agent that grabs the first entry instead of matching the name.
  - type: cli_called
    description: "Deployed with `deployments create <Name> --version 13 --folder-key 8c22d4e1-…` (the resolved Archive key)"
    verb: "ixp deployments create"
    tool: "uip"
    positional: ["my_invoices-f1afa9ef-ixp"]
    flags:
      version: "13"
      folder-key: "8c22d4e1-9999-8888-7777-666655554444"
    weight: 3.0
    pass_threshold: 1.0

  # `--folder-key` takes the GUID. The name or path shaped into that flag is the
  # mistake key-only addressing invites. Scoped to ONE flag value, which a
  # whole-line pattern could not do.
  - type: cli_called
    description: "Did NOT pass the folder name or path as --folder-key"
    verb: "ixp deployments create"
    tool: "uip"
    flags:
      folder-key: {matches_regex: "^(Finance|Archive)"}
    min_count: 0
    max_count: 0
    weight: 2.0
    pass_threshold: 1.0

  # There is no `--folder-path` option on either deployment verb.
  - type: cli_called
    description: "Did NOT invent a `--folder-path` option"
    verb: "ixp deployments create"
    tool: "uip"
    flags:
      folder-path: {present: true}
    min_count: 0
    max_count: 0
    weight: 1.5
    pass_threshold: 1.0
