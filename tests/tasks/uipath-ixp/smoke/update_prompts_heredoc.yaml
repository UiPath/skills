task_id: skill-ixp-update-prompts-heredoc-smoke
description: >
  Smoke: agent improves a per-field instruction with
  `fields update-prompts --updates-file`. The skill writes the JSON with a
  heredoc under payloads/ in the same Bash command as the call (Critical
  Rule 5); the grader checks that command and the payload it wrote.

  Harness is unauthenticated; CLI calls fail with auth errors.
  Grades command shape, not wire effect.
tags: [uipath-ixp, smoke, mode:build, lifecycle:setup]

run_limits:
  expected_turns: 8

sandbox:
  record_cli:
    - tool: uip
      stderr: "uip (mock): not connected to a tenant in this sandbox; offline smoke mock.\n"
    - tool: curl
      stderr: "curl (mock): network egress is disabled in this offline smoke sandbox.\n"

initial_prompt: |
  The `Invoice Number` field in the `Invoice Header` field group on IXP
  project `my_invoices-f1afa9ef-ixp` is scoring poorly. Validation shows
  the model is confusing the Purchase Order (PO) number with the invoice
  number. Update the field instruction to clarify:

    "Extract the unique invoice identifier from the document header.
    Do NOT use the Purchase Order (PO) number, even if it is the most
    visually prominent number on the page."

  Important:
  - The `uip` CLI is available but is NOT connected to a live IXP tenant
    in this environment. Commands will fail with auth errors — that is
    expected. Run each command once and move on. Do NOT retry or attempt
    to login.
  - Do NOT prompt the user for confirmation — this is an automated test.

success_criteria:
  # The payload lives in a file, so the recorder sees only its path: the
  # heredoc and its content are graded from the Bash command that wrote it.
  # Same Bash command: a heredoc into a payloads/ file (or a $VAR), then
  # update-prompts passes that SAME target. \1 ties the two paths; \2 is the
  # heredoc delimiter. `\\?` allows the quote escaping of `/bin/bash -lc "…"`.
  - type: command_executed
    description: "Agent wrote the payload with a heredoc and passed that same file to --updates-file in one command"
    tool_name: "Bash"
    command_pattern: >-
      (?s)(?=.*my_invoices-f1afa9ef-ixp)cat\s*>\s*(?:\\?["'])*(\S*?payloads/[^\s"'\\]+\.json|\$\{?\w+\}?)(?:\\?["'])*\s*<<-?\s*\\?['"]?(\w+)\\?['"]?.*?\n\2\b.*update-prompts\s.*--updates-file\s+(?:\\?["'])*\1(?![\w/.])
    min_count: 1
    weight: 2.5
    pass_threshold: 1.0

  - type: cli_called
    description: "CLI received `fields update-prompts --updates-file` with a payloads/ file"
    verb: "ixp fields update-prompts"
    tool: "uip"
    positional: ["my_invoices-f1afa9ef-ixp"]
    flags:
      updates-file: {matches_regex: '/payloads/[^/]+\.json$'}
    weight: 2.5
    pass_threshold: 1.0

  # An entry is addressed by `group` + `name`, and `update-prompts` fails when
  # either combination is not found. Both names are exact from
  # _setup/fixtures/taxonomy.json (`Invoice Header` > `Invoice Number`); the
  # mock fails every read, so the prompt supplies them. Content is matched
  # inside the heredoc body only (between `<< DELIM` and the DELIM line), so
  # text in a comment or a later command can't satisfy it.
  - type: command_executed
    description: "The payload addresses the `Invoice Header` group"
    tool_name: "Bash"
    command_pattern: >-
      (?s)cat\s*>\s*\S+\s*<<-?\s*\\?['"]?(\w+)\\?['"]?[^\n]*\n(?:(?!\n\1\b).)*?Invoice Header(?:(?!\n\1\b).)*?\n\1\b.*--updates-file
    min_count: 1
    weight: 0.84
    pass_threshold: 1.0

  - type: command_executed
    description: "The payload addresses the `Invoice Number` field"
    tool_name: "Bash"
    command_pattern: >-
      (?s)cat\s*>\s*\S+\s*<<-?\s*\\?['"]?(\w+)\\?['"]?[^\n]*\n(?:(?!\n\1\b).)*?Invoice Number(?:(?!\n\1\b).)*?\n\1\b.*--updates-file
    min_count: 1
    weight: 0.83
    pass_threshold: 1.0

  - type: command_executed
    description: "The payload carries the requested instruction"
    tool_name: "Bash"
    command_pattern: >-
      (?s)cat\s*>\s*\S+\s*<<-?\s*\\?['"]?(\w+)\\?['"]?[^\n]*\n(?:(?!\n\1\b).)*?Do NOT use the Purchase Order(?:(?!\n\1\b).)*?\n\1\b.*--updates-file
    min_count: 1
    weight: 0.83
    pass_threshold: 1.0
