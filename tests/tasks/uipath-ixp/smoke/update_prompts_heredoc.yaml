task_id: skill-ixp-update-prompts-heredoc-smoke
description: >
  Smoke: agent improves a per-field instruction with
  `fields update-prompts --updates`. The skill constructs the JSON via
  heredoc; the grader verifies both that shell workflow and the complete
  expanded payload received by the CLI mock.

  Harness is unauthenticated; CLI calls fail with auth errors.
  Grades command shape, not wire effect.
tags: [uipath-ixp, smoke, mode:build, lifecycle:setup]

run_limits:
  expected_turns: 8

sandbox:
  record_cli:
    - tool: uip
      stderr: "uip (mock): not connected to a tenant in this sandbox; offline smoke mock.\n"
    - tool: curl
      stderr: "curl (mock): network egress is disabled in this offline smoke sandbox.\n"

initial_prompt: |
  The `Invoice Number` field in the `Invoice Header` field group on IXP
  project `my_invoices-f1afa9ef-ixp` is scoring poorly. Validation shows
  the model is confusing the Purchase Order (PO) number with the invoice
  number. Update the field instruction to clarify:

    "Extract the unique invoice identifier from the document header.
    Do NOT use the Purchase Order (PO) number, even if it is the most
    visually prominent number on the page."

  Important:
  - The `uip` CLI is available but is NOT connected to a live IXP tenant
    in this environment. Commands will fail with auth errors — that is
    expected. Run each command once and move on. Do NOT retry or attempt
    to login.
  - Do NOT prompt the user for confirmation — this is an automated test.

success_criteria:
  # Shell-text checks: only the Bash command shows the heredoc and `$(cat …)`,
  # so these stay command_executed. The project segment accepts the literal
  # name or a shell variable (`P=my_invoices-f1afa9ef-ixp; … /tmp/ixp/$P/…`).
  - type: command_executed
    description: "Agent wrote the --updates payload under /tmp/ixp/<project>/prompts/ via heredoc"
    tool_name: "Bash"
    command_pattern: 'cat\s*>\s*/tmp/ixp/(?:my_invoices-f1afa9ef-ixp|\$\{?\w+\}?)/prompts/[^\s]+\.json\s*<<\s*[''"]?[A-Z][A-Z0-9_]*[''"]?'
    min_count: 1
    weight: 2.5
    pass_threshold: 1.0

  # Quote runs are `(?:\\?["'])*`, not `["']?`: this criterion reads raw Bash
  # text, and an agent harness that wraps commands in `/bin/bash -lc "…"`
  # backslash-escapes the inner quotes, so `--updates "$(cat …)"` is recorded as
  # `--updates \""'$(cat …)"`. Matching one bare optional quote passed under
  # claude-code and failed under codex for the same correct command.
  - type: command_executed
    description: "Agent passed the heredoc file to `fields update-prompts --updates`"
    tool_name: "Bash"
    command_pattern: 'uip\s+ixp\s+fields\s+update-prompts\s+(?:\\?["''])*(?:my_invoices-f1afa9ef-ixp|\$\{?\w+\}?)(?:\\?["''])*\s+.*--updates\s+(?:\\?["''])*\$\(cat\s+/tmp/ixp/(?:my_invoices-f1afa9ef-ixp|\$\{?\w+\}?)/prompts/[^\s]+\.json\)'
    min_count: 1
    weight: 2.5
    pass_threshold: 1.0

  # An entry is addressed by `group` + `name`, and `update-prompts` fails when
  # either combination is not found. Both names are exact from
  # _setup/fixtures/taxonomy.json (`Invoice Header` > `Invoice Number`); the
  # mock fails every read, so the prompt supplies them.
  - type: cli_called
    description: "`--updates` addresses the `Invoice Header` group"
    verb: "ixp fields update-prompts"
    tool: "uip"
    positional: ["my_invoices-f1afa9ef-ixp"]
    flags:
      updates: {contains: "Invoice Header"}
    weight: 0.84
    pass_threshold: 1.0

  - type: cli_called
    description: "`--updates` addresses the `Invoice Number` field"
    verb: "ixp fields update-prompts"
    tool: "uip"
    positional: ["my_invoices-f1afa9ef-ixp"]
    flags:
      updates: {contains: "Invoice Number"}
    weight: 0.83
    pass_threshold: 1.0

  - type: cli_called
    description: "`--updates` carries the requested instruction"
    verb: "ixp fields update-prompts"
    tool: "uip"
    positional: ["my_invoices-f1afa9ef-ixp"]
    flags:
      updates: {contains: "Do NOT use the Purchase Order"}
    weight: 0.83
    pass_threshold: 1.0
