task_id: skill-ixp-show-predictions-smoke
description: >
  Smoke: agent reads the model's predicted values for one document (the
  prediction layer, via get-predictions — not by reading the file itself).

  Offline: `uip` is a generated stub that answers this task's calls from
  canned responses. Grades command shape, not wire effect.
tags: [uipath-ixp, smoke, mode:operate, lifecycle:setup]

run_limits:
  expected_turns: 5

sandbox:
  record_cli:
    - tool: uip
      # Every call the correct path makes is answered below. Anything else
      # falls through to this fallback and fails, so an off-path invocation
      # still looks like a CLI that refused rather than one that agreed.
      stderr: "uip (mock): offline sandbox - this call is not one the task stubs. Continue with the task; do not retry or log in.\n"
      responses:
        - when: {verb: "ixp labellings get-predictions", value_flags: ["output"]}
          stdout: |
            {"Result":"Success","Data":{"ProjectName":"my_invoices-f1afa9ef-ixp","TotalDocuments":1,"DocumentsWithPredictions":1,"Predictions":[{"DocumentId":"doc-abc-123","ModelVersion":7,"Labels":[{"Name":"Invoice Header","Occurrence":0,"Fields":[{"FieldId":"9a3f5d2c81b7e604","FieldName":"Invoice Number","FormattedValue":"INV-2025-0042"},{"FieldId":"1d8e42b7c3a95f60","FieldName":"Invoice Date","FormattedValue":"2025-11-04"},{"FieldId":"6e0b74a1f83c2d95","FieldName":"Total Amount","FormattedValue":"1200.00"}]},{"Name":"Line Items","Occurrence":0,"Fields":[{"FieldId":"c47a91e05d2b3f68","FieldName":"Description","FormattedValue":"Annual support subscription"}]}]}]}}
    - tool: curl
      stderr: "curl (mock): network egress is disabled in this offline smoke sandbox.\n"

initial_prompt: |
  In the IXP project my_invoices-f1afa9ef-ixp, show the values the model
  predicted for document doc-abc-123.

  Do NOT prompt the user for confirmation — this is an automated test.

success_criteria:
  # The project is named because positionals are ordered: doc-abc-123 can only be
  # asserted as the DOCUMENT argument by pinning the slot before it. The regex this
  # replaced matched the id anywhere, so a get-predictions on another project counted.
  - type: cli_called
    description: "Agent fetched predictions via `labellings get-predictions … doc-abc-123`"
    verb: "ixp labellings get-predictions"
    tool: "uip"
    positional: ["my_invoices-f1afa9ef-ixp", "doc-abc-123"]
    weight: 3.0
    pass_threshold: 1.0
