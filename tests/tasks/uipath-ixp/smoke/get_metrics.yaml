task_id: skill-ixp-get-metrics-smoke
description: >
  Smoke: asked for an improvement loop's BASELINE scores, the agent reads
  the latest trained version — the model instruction edits retrain
  (Critical Rule 21, guide 1a) — not the live one.

  Mirror of metrics_live_version on the same fixture: an agent that
  resolves the live version
  regardless of intent answers 9/0.98 and fails the outcome check. Also
  locks in the project-Name argument (not Title).
tags: [uipath-ixp, smoke, mode:diagnose, lifecycle:discover]

run_limits:
  expected_turns: 6

sandbox:
  mock_path_dirs: [mocks]
  template_sources:
    - {type: template_dir, path: ../_shared/mock_template}
    - {type: template_dir, path: ../_shared/mock_template_versions}

initial_prompt: |
  I'm starting an improvement loop on the extraction instructions of the
  IXP project `my_invoices-f1afa9ef-ixp` — get the baseline per-field F1
  scores the loop's changes will be measured against.

  Write `metrics.json` in the working directory:

      {"version": <the model version the scores belong to>,
       "project_score": <that version's ProjectScore>}

  Important:
  - Do NOT prompt the user for confirmation — this is an automated test.

success_criteria:
  - type: file_matches_regex
    description: "Agent fetched the metrics - `get-metrics` against the requested project Name"
    path: "mocks/calls.log"
    pattern: >-
      (?m)^(?:uip\s+ixp\s+projects\s+get-metrics\s+.*my_invoices-f1afa9ef-ixp)[^\r\n]*$
    weight: 2.0
    pass_threshold: 1.0

  # Resolving the live version instead answers 9 / 0.98.
  - type: json_check
    description: "Reported the improvement baseline — the latest trained version (30), not the live one (9)"
    path: "metrics.json"
    assertions:
      - expression: "version"
        operator: equals
        expected: 30
      - expression: "project_score"
        operator: equals
        expected: 0.91
    weight: 3.0
    pass_threshold: 1.0
