task_id: skill-ixp-get-metrics-smoke
description: >
  Smoke: asked for the BASELINE scores of an improvement loop, the agent
  reads what the guide defines the baseline to be — the latest trained
  version — and reports its numbers, not the live version's.

  The mirror of metrics_live_version, on the same fixture: live is v9
  (ProjectScore 0.98), latest is v30 (ProjectScore 0.91), so the two intents
  have opposite correct answers. "How is it performing in production" reads
  the live version; "inspect scores before iterating" reads the baseline the
  loop improves on — the latest trained model (improve-prompts-guide, 1a).
  The prompt names the improvement loop and the word baseline outright; the
  version must still come from the guide. An agent that resolves the live
  version regardless of intent answers
  9 / 0.98 and fails the outcome check. The graded values are reachable only
  from an actual `get-metrics` read, and the command criterion locks in the
  project-`Name` argument (not `Title`).
tags: [uipath-ixp, smoke, mode:diagnose, lifecycle:discover]

run_limits:
  expected_turns: 6

sandbox:
  mock_path_dirs: [mocks]
  template_sources:
    - {type: template_dir, path: ../_shared/mock_template}
    - {type: template_dir, path: ../_shared/mock_template_versions}

initial_prompt: |
  I'm starting an improvement loop on the extraction instructions of the
  IXP project `my_invoices-f1afa9ef-ixp` — get the baseline per-field F1
  scores the loop's changes will be measured against.

  Write `metrics.json` in the working directory:

      {"version": <the model version the scores belong to>,
       "project_score": <that version's ProjectScore>}

  Important:
  - Do NOT prompt the user for confirmation — this is an automated test.

success_criteria:
  - type: file_matches_regex
    description: "Agent fetched the metrics - `get-metrics` against the requested project Name"
    path: "mocks/calls.log"
    pattern: >-
      (?m)^(?:uip\s+ixp\s+projects\s+get-metrics\s+.*my_invoices-f1afa9ef-ixp)[^\r\n]*$
    weight: 2.0
    pass_threshold: 1.0

  # The intent discriminator. Before-iterating means the loop's baseline: the
  # latest trained version (30, ProjectScore 0.91) — not the live version
  # (9, ProjectScore 0.98) that "how is it performing in production" would
  # read. Version 30 separates the two paths on the artifact.
  - type: json_check
    description: "Reported the improvement baseline — the latest trained version (30), not the live one (9)"
    path: "metrics.json"
    assertions:
      - expression: "version"
        operator: equals
        expected: 30
      - expression: "project_score"
        operator: gte
        expected: 0.9
    weight: 3.0
    pass_threshold: 1.0
