task_id: skill-ixp-delete-field-group-smoke
description: >
  Smoke: agent deletes a field group — a destructive cascade that drops all
  annotations on all its fields, so it must pass -y/--yes (the CLI
  refuses without it).

  Offline: `uip` is a generated stub that answers this task's calls from
  canned responses. Grades command shape, not wire effect.
tags: [uipath-ixp, smoke, mode:build, lifecycle:setup]

run_limits:
  expected_turns: 5

sandbox:
  record_cli:
    - tool: uip
      # Every call the correct path makes is answered below. Anything else
      # falls through to this fallback and fails, so an off-path invocation
      # still looks like a CLI that refused rather than one that agreed.
      stderr: "uip (mock): offline sandbox - this call is not one the task stubs. Continue with the task; do not retry or log in.\n"
      responses:
        - when: {verb: "ixp projects get-taxonomy", value_flags: ["output"]}
          stdout: |
            {"Result":"Success","Data":{"status":"ready","dataset":{"entity_defs":[{"id":"b3a63e6483adaaba","name":"Exact Text","title":"","inherits_from":[],"trainable":true,"color":2,"instructions":""},{"id":"c128ad65bd8af3f8","name":"Date","title":"","inherits_from":["0000000000000007"],"trainable":true,"color":1,"instructions":""},{"id":"e5d7402ba91c6f38","name":"Monetary Quantity","title":"","inherits_from":["0000000000000005"],"trainable":true,"color":4,"instructions":""}],"label_groups":[{"name":"default","label_defs":[{"name":"Invoice Header","id":"5f21c88ab90d4e17","instructions":"Header-level fields of the supplier invoice.","moon_form":[{"field_id":"9a3f5d2c81b7e604","id":"b3a63e6483adaaba","field_type_id":"b3a63e6483adaaba","kind":"Exact Text","name":"Invoice Number","instructions":"The unique invoice identifier printed in the document header.","rule_set":null},{"field_id":"1d8e42b7c3a95f60","id":"c128ad65bd8af3f8","field_type_id":"c128ad65bd8af3f8","kind":"Date","name":"Invoice Date","instructions":"The issue date of the invoice.","rule_set":null},{"field_id":"6e0b74a1f83c2d95","id":"e5d7402ba91c6f38","field_type_id":"e5d7402ba91c6f38","kind":"Monetary Quantity","name":"Total Amount","instructions":"The grand total payable on the invoice, including tax.","rule_set":null}]},{"name":"Line Items","id":"7be409c2d15fa833","instructions":"One entry per line item row on the invoice.","moon_form":[{"field_id":"c47a91e05d2b3f68","id":"b3a63e6483adaaba","field_type_id":"b3a63e6483adaaba","kind":"Exact Text","name":"Description","instructions":"The line item description as printed on the row.","rule_set":null}]},{"name":"name group","id":"b41d8e27f0a3c659","instructions":"Legacy group kept from an earlier taxonomy import.","moon_form":[{"field_id":"70f2c58ad916be34","id":"b3a63e6483adaaba","field_type_id":"b3a63e6483adaaba","kind":"Exact Text","name":"full name","instructions":"The payer's full name as printed.","rule_set":null}]}]}]}}}
        - when: {verb: "ixp groups delete", value_flags: ["output"]}
          stdout: |
            {"Result":"Success"}
    - tool: curl
      stderr: "curl (mock): network egress is disabled in this offline smoke sandbox.\n"

initial_prompt: |
  In the IXP project my_invoices-f1afa9ef-ixp, delete the field group
  "name group".

  Do NOT prompt the user for confirmation — this is an automated test.

success_criteria:
  - type: cli_called
    description: "Agent deleted the group via `groups delete … -y/--yes`"
    verb: "ixp groups delete"
    tool: "uip"
    positional: ["my_invoices-f1afa9ef-ixp"]
    flags:
      name: "name group"
      # Quoted: bare `yes` is a YAML 1.1 boolean, and the key must reach the
      # grader as the string flag name.
      "yes": {present: true, aliases: ["y"]}
    weight: 3.0
    pass_threshold: 1.0
