task_id: skill-ixp-create-project-blank-smoke
description: >
  Smoke: agent creates an empty IXP project by omitting `<folder-path>` — no
  taxonomy, no docs, so it doesn't stall waiting for files or a suggestion,
  and doesn't redirect in-product (the CLI supports this directly).

  Harness is unauthenticated; CLI calls fail with auth errors.
  Grades command shape, not wire effect.
tags: [uipath-ixp, smoke, mode:build, lifecycle:setup]

run_limits:
  expected_turns: 5

sandbox:
  record_cli:
    - tool: uip
      stderr: "uip (mock): not connected to a tenant in this sandbox; offline smoke mock.\n"
    - tool: curl
      stderr: "curl (mock): network egress is disabled in this offline smoke sandbox.\n"

initial_prompt: |
  Create a blank IXP project named "test project".

  Important:
  - The `uip` CLI is available but is NOT connected to a live IXP tenant in
    this environment. Commands will fail with auth errors — that is expected.
    Run each command once and move on. Do NOT retry or attempt to login.
  - Do NOT prompt the user for confirmation — this is an automated test.

success_criteria:
  # argv is recorded as a list, so this also proves "test project" was passed
  # as ONE argument — not a project "test" in a folder "project". `positional`
  # is a prefix match, so a folder after the name is not graded.
  - type: cli_called
    description: "Agent created the project with `projects create \"test project\"`"
    verb: "ixp projects create"
    tool: "uip"
    positional: ["test project"]
    weight: 3.0
    pass_threshold: 1.0
