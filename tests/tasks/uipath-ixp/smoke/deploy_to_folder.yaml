task_id: skill-ixp-deploy-to-folder-smoke
description: >
  Smoke: agent deploys a trained model version to an Orchestrator folder with
  `deployments create`, passing the required --version and --folder-key plus
  the requested --title.
  Trap: publishing is not deploying — the agent must not reach for
  `projects publish`, and must not `upgrade` a project that has no deployment
  yet (that is a 404, not a fallback deploy).

  Harness is unauthenticated; CLI calls fail with auth errors.
  Grades command shape, not wire effect.
tags: [uipath-ixp, smoke, mode:build, lifecycle:setup]

run_limits:
  expected_turns: 5

sandbox:
  mock_path_dirs: [mocks]
  template_sources:
    - {type: template_dir, path: ../_shared/mock_template}

initial_prompt: |
  Project `my_invoices-f1afa9ef-ixp` has trained model version 13, which has
  never been deployed anywhere. Make version 13 callable at runtime from
  Orchestrator folder `3f0a91c7-1111-2222-3333-444455556666`, under the title
  `invoices`.

  Important:
  - The `uip` CLI is available but is NOT connected to a live IXP tenant in
    this environment. Commands will fail with auth errors — that is expected.
    Run each command once and move on. Do NOT retry or attempt to login.
  - Do NOT prompt the user for confirmation — this is an automated test.

success_criteria:
  - type: file_matches_regex
    description: "Deployed with `deployments create <Name> --version 13 --folder-key <key> --title invoices`"
    path: "mocks/calls.log"
    pattern: >-
      (?m)^(?:uip\s+ixp\s+deployments\s+create\b(?=.*my_invoices-f1afa9ef-ixp)(?=.*--version\s+13\b)(?=.*--folder-key\s+["']?3f0a91c7-1111-2222-3333-444455556666)(?=.*--title\s+["']?invoices).*)[^\r\n]*$
    weight: 3.0
    pass_threshold: 1.0

  # Nothing is deployed yet, so there is no deployment to move — `upgrade` here
  # is a 404, never a fallback deploy. Positive control: the create line above,
  # which a correct run is guaranteed to produce.
  - type: file_matches_regex
    description: "Did NOT use `deployments upgrade` for a first-time deploy (upgrade never falls back to a deploy)"
    path: "mocks/calls.log"
    pattern: >-
      (?m)^(?:uip\s+ixp\s+deployments\s+upgrade\b)[^\r\n]*$
    must_match: false
    weight: 1.5
    pass_threshold: 1.0

  # Publishing makes a version usable INSIDE the project; it deploys nothing.
  # Version 13 is already trained, so no publish is warranted here.
  - type: file_matches_regex
    description: "Did NOT substitute `projects publish` for a folder deployment"
    path: "mocks/calls.log"
    pattern: >-
      (?m)^(?:uip\s+ixp\s+projects\s+publish\b)[^\r\n]*$
    must_match: false
    weight: 1.5
    pass_threshold: 1.0
