# By id, not by filename/position: resolving a name or list-position to a
# DocumentId needs a `documents list` lookup (auth) — that resolution path is
# an integration concern (ACTV-88563), so the smoke hands the id directly.
task_id: skill-ixp-delete-document-by-id-smoke
description: >
  Smoke: agent deletes a document by id — irreversible, triggers a retrain.

  Offline: `uip` is a generated stub that answers this task's calls from
  canned responses. Grades command shape, not wire effect.
tags: [uipath-ixp, smoke, mode:operate, lifecycle:setup]

run_limits:
  expected_turns: 5

sandbox:
  record_cli:
    - tool: uip
      # Every call the correct path makes is answered below. Anything else
      # falls through to this fallback and fails, so an off-path invocation
      # still looks like a CLI that refused rather than one that agreed.
      stderr: "uip (mock): offline sandbox - this call is not one the task stubs. Continue with the task; do not retry or log in.\n"
      responses:
        # Orientation: the agent may confirm the document exists before deleting it.
        - when: {verb: "ixp documents list", value_flags: ["output"]}
          stdout: |
            {"Result":"Success","Data":{"Documents":[{"DocumentId":"doc-abc-123","AttachmentRef":"att-9f31c7","Filename":"hp_tax_invoice.png"},{"DocumentId":"doc-def-456","AttachmentRef":"att-40b2ae","Filename":"york_solutions_invoice.png"},{"DocumentId":"doc-ghi-789","AttachmentRef":null,"Filename":"csi_tower_invoice.png"}],"Total":3,"Offset":0,"Limit":50}}
        - when: {verb: "ixp documents delete", value_flags: ["output"]}
          stdout: |
            {"Result":"Success","Data":{"DocumentId":"doc-abc-123","Deleted":true}}
    - tool: curl
      stderr: "curl (mock): network egress is disabled in this offline smoke sandbox.\n"

initial_prompt: |
  In the IXP project my_invoices-f1afa9ef-ixp, delete document doc-abc-123.

  Do NOT prompt the user for confirmation — this is an automated test.

success_criteria:
  - type: cli_called
    description: "Agent deleted the document via `documents delete <Name> doc-abc-123 -y`"
    verb: "ixp documents delete"
    tool: "uip"
    positional: ["my_invoices-f1afa9ef-ixp", "doc-abc-123"]
    flags:
      # Quoted: bare `yes` is a YAML 1.1 boolean.
      "yes": {present: true, aliases: ["y"]}
    weight: 3.0
    pass_threshold: 1.0
