task_id: skill-ixp-confirm-predictions-smoke
description: >
  Smoke: agent reviews predictions and picks the right verdict per
  field — correct → `confirm --fields`; OCR-mangled → row-scoped
  `confirm --group --occurrence --fields --corrections` (Rule 8);
  wrong-field prediction → left unannotated (Rule 10 — agent
  reviews, doesn't extract).

  Harness is unauthenticated; CLI calls fail with auth errors.
  Grades command shape, not wire effect.
tags: [uipath-ixp, smoke, mode:operate, lifecycle:setup]

run_limits:
  expected_turns: 6

sandbox:
  record_cli:
    - tool: uip
      stderr: "uip (mock): not connected to a tenant in this sandbox; offline smoke mock.\n"
    - tool: curl
      stderr: "curl (mock): network egress is disabled in this offline smoke sandbox.\n"

initial_prompt: |
  Review the IXP model's predictions for document `doc-abc-123` on
  project `my_invoices-f1afa9ef-ixp` and record your verdict in the
  labelling system.

  Document content (verbatim from the invoice header):

      Invoice Number: INV-2025-0042
      Invoice Date:   2025-01-15
      Vendor:         Beta Industries Inc.
      Total:          $12,000.00

  IXP model predictions:
  - Invoice Number (field id `f-001`): `INV-2025-0042`
  - Invoice Date (field id `f-002`): `2025-01-15`
  - Total Amount (field id `f-003`): `$1,200.00`
    (the model located the Total line but the OCR mis-read the digits)
  - Vendor Name (field id `f-004`): `Acme Corp`

  `get-predictions` reports these predictions are from ModelVersion 7;
  all four fields sit in field group `Invoice Header`, at `Occurrence` 0.

  Compare each prediction to the document and record your verdict.

  Important:
  - The `uip` CLI is available but is NOT connected to a live IXP tenant
    in this environment. Commands will fail with auth errors — that is
    expected. Run each command once and move on. Do NOT retry or attempt
    to login.
  - Do NOT prompt the user for confirmation — this is an automated test.

# Every criterion declares all value-taking `confirm` flags in `value_flags`,
# so a flag it does not predicate (--group on the f-001 check) never leaves its
# value in the positional slots.
success_criteria:
  # The version pin rides on each confirm criterion, not a criterion of its
  # own: a standalone pin assertion passes on one pinned call while the
  # others go out bare (Rule 18).
  - type: cli_called
    description: "Agent invoked `uip ixp labellings confirm <project> <document>` with --fields and the reviewed -m/--model-version (Critical Rule 18)"
    verb: "ixp labellings confirm"
    tool: "uip"
    positional: ["my_invoices-f1afa9ef-ixp", "doc-abc-123"]
    flags:
      fields: {present: true, aliases: ["f"]}
      model-version: {equals: "7", aliases: ["m"]}
    value_flags: [output, fields, f, corrections, c, group, occurrence, updates, model-version, m]
    weight: 4.0
    pass_threshold: 1.0

  - type: cli_called
    description: "f-001 (cleanly-correct Invoice Number) confirmed on a version-pinned call"
    verb: "ixp labellings confirm"
    tool: "uip"
    positional: ["my_invoices-f1afa9ef-ixp", "doc-abc-123"]
    flags:
      fields: {contains: "f-001", aliases: ["f"]}
      model-version: {equals: "7", aliases: ["m"]}
    value_flags: [output, fields, f, corrections, c, group, occurrence, updates, model-version, m]
    weight: 1.5
    pass_threshold: 1.0

  - type: cli_called
    description: "f-002 (cleanly-correct Invoice Date) confirmed on a version-pinned call"
    verb: "ixp labellings confirm"
    tool: "uip"
    positional: ["my_invoices-f1afa9ef-ixp", "doc-abc-123"]
    flags:
      fields: {contains: "f-002", aliases: ["f"]}
      model-version: {equals: "7", aliases: ["m"]}
    value_flags: [output, fields, f, corrections, c, group, occurrence, updates, model-version, m]
    weight: 1.5
    pass_threshold: 1.0

  - type: cli_called
    description: "Agent did NOT confirm f-004 (wrong-field prediction must be skipped)"
    verb: "ixp labellings confirm"
    tool: "uip"
    flags:
      fields: {contains: "f-004", aliases: ["f"]}
    value_flags: [output, fields, f, corrections, c, group, occurrence, updates, model-version, m]
    min_count: 0
    max_count: 0
    weight: 2.0
    pass_threshold: 1.0

  # One row takes --occurrence (Rule 8); the corrections payload is JSON, so
  # its predicate is one regex scoped to that value, key order free.
  - type: cli_called
    description: "The correction names its row (--group \"Invoice Header\" --occurrence 0), lists f-003 in --fields, and carries the corrected Total, on a version-pinned call"
    verb: "ixp labellings confirm"
    tool: "uip"
    positional: ["my_invoices-f1afa9ef-ixp", "doc-abc-123"]
    flags:
      group: "Invoice Header"
      occurrence: "0"
      fields: {contains: "f-003", aliases: ["f"]}
      corrections: {matches_regex: '(?=.*"field_id"\s*:\s*"f-003")(?=.*\$?12,?000\.00)', aliases: ["c"], flags: 16}
      model-version: {equals: "7", aliases: ["m"]}
    value_flags: [output, fields, f, corrections, c, group, occurrence, updates, model-version, m]
    weight: 2.0
    pass_threshold: 1.0

  # Without --group, a correction is written into every occurrence of the
  # field on the document.
  - type: cli_called
    description: "Agent did NOT pass --corrections without --group (Critical Rule 8)"
    verb: "ixp labellings confirm"
    tool: "uip"
    flags:
      corrections: {present: true, aliases: ["c"]}
      group: {absent: true}
    value_flags: [output, fields, f, corrections, c, group, occurrence, updates, model-version, m]
    min_count: 0
    max_count: 0
    weight: 1.5
    pass_threshold: 1.0

  # The plain call confirms the predicted value, so listing the corrected
  # field there would overwrite the correction.
  - type: cli_called
    description: "Agent did NOT list the corrected f-003 in a plain (no --group) --fields call"
    verb: "ixp labellings confirm"
    tool: "uip"
    flags:
      fields: {contains: "f-003", aliases: ["f"]}
      group: {absent: true}
    value_flags: [output, fields, f, corrections, c, group, occurrence, updates, model-version, m]
    min_count: 0
    max_count: 0
    weight: 1.5
    pass_threshold: 1.0
