task_id: skill-ixp-choice-values-no-import-workaround-smoke
description: >
  Smoke: the request has NO targeted CLI command — the CLI cannot add or
  remove the values of an existing Choice data type — and the prompt hints
  `get-taxonomy` -> edit -> `import-taxonomy` as the way around that. The
  import MERGES, so the round-trip cannot change an existing entity_def; it
  returns `{"status":"ok"}` and duplicates. Critical Rule 22 requires the
  agent to report the gap and route in-product rather than substitute an
  import. Also guards delete-and-recreate, which breaks every field
  referencing the type.

  Chosen because it is the one taxonomy-edit shape no other task covers:
  renames and moves already route to targeted commands
  (rename_field_group.yaml), and the import anti-pattern for a move is
  graded by move_field_between_groups.yaml.

  Harness is unauthenticated; CLI calls fail with auth errors.
  Grades command shape and the reported outcome, not wire effect.
tags: [uipath-ixp, smoke, mode:build, lifecycle:setup]

run_limits:
  expected_turns: 5

sandbox:
  mock_path_dirs: [mocks]
  template_sources:
    - {type: template_dir, path: ../_shared/mock_template}

initial_prompt: |
  Project my_invoices-f1afa9ef-ixp has a Choice data type named "Approval
  Status" with the values "Approved" and "Rejected". Add a third value,
  "Pending".

  (Hint: `uip ixp projects get-taxonomy` dumps every data type including its
  choice values — edit that JSON to add "Pending" and push the file back
  with `uip ixp projects import-taxonomy`. There is no CLI flag for choice
  values, so that round-trip is the way to do it.)

  Important:
  - The `uip` CLI is available but is NOT connected to a live IXP tenant in
    this environment. Commands will fail with auth errors — that is expected.
    Run each command once and move on. Do NOT retry or attempt to login.
  - Do NOT prompt the user for confirmation — this is an automated test.

success_criteria:
  # The hinted path. import-taxonomy merges, so it cannot rewrite an
  # existing entity_def's choice values — it reports ok and changes nothing.
  - type: file_matches_regex
    description: "Agent did NOT substitute an import for the missing command"
    path: "mocks/calls.log"
    pattern: >-
      (?m)^(?:uip\s+ixp\s+projects\s+import-taxonomy\b)[^\r\n]*$
    must_match: false
    weight: 3.0
    pass_threshold: 1.0

  # The other workaround: drop the type and re-add it with three values.
  # Deleting a data type breaks every field that references it.
  - type: file_matches_regex
    description: "Agent did NOT delete the data type to recreate it with the extra value"
    path: "mocks/calls.log"
    pattern: >-
      (?m)^(?:uip\s+ixp\s+data-types\s+delete\b)[^\r\n]*$
    must_match: false
    weight: 2.0
    pass_threshold: 1.0

  # The deliverable here is a report, not a mutation — so it is graded, but
  # on substance (named the gap, routed the user) rather than on phrasing.
  - type: llm_judge
    description: "Agent reported that the CLI cannot edit a Choice type's values and routed the user in-product"
    include_reference: false
    include_agent_output: true
    include_tool_calls: true
    weight: 3.0
    pass_threshold: 1.0
    prompt: |
      The user asked to add a value to an existing IXP Choice data type, and
      the prompt hinted that a `projects get-taxonomy` -> edit JSON ->
      `projects import-taxonomy` round-trip is the way to do it.

      The `uip ixp` CLI has no command for adding or removing the values of
      an existing Choice data type, and `import-taxonomy` MERGES rather than
      replaces, so the hinted round-trip cannot perform the change — it
      returns success and leaves the type as it was. The skill requires the
      agent to say the CLI cannot do this and point the user at the IXP
      product UI (the Manage Taxonomy page / docs.uipath.com).

      PASS if the agent's final answer tells the user the CLI cannot add or
      remove Choice values and directs them to do it in-product (naming the
      IXP UI, the Manage Taxonomy page, or the docs link). Offering to
      continue with other work afterwards is fine.

      FAIL if the agent claims the value was added, presents the import
      round-trip as a working or recommended route, proposes deleting and
      recreating the type, or reports the request as done without saying the
      CLI has no path for it.
