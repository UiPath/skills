task_id: skill-ixp-delete-project-smoke
description: >
  Smoke: agent deletes a project — destructive and irreversible, so it must
  pass -y/--yes (the CLI refuses without it), acknowledging the
  data loss.

  Offline: `uip` is a generated stub that answers this task's calls from
  canned responses. Grades command shape, not wire effect.
tags: [uipath-ixp, smoke, mode:build, lifecycle:setup]

run_limits:
  expected_turns: 5

sandbox:
  record_cli:
    - tool: uip
      # Every call the correct path makes is answered below. Anything else
      # falls through to this fallback and fails, so an off-path invocation
      # still looks like a CLI that refused rather than one that agreed.
      stderr: "uip (mock): offline sandbox - this call is not one the task stubs. Continue with the task; do not retry or log in.\n"
      responses:
        # Orientation: the agent may confirm the project exists before deleting it.
        - when: {verb: "ixp projects list", value_flags: ["output"]}
          stdout: |
            {"Result":"Success","Data":{"Projects":[{"Id":"f1afa9ef-1c4d-4b70-9e02-6d3b8a5c7e11","Name":"my_invoices-f1afa9ef-ixp","Title":"My_Invoices","CreatedAt":"2026-06-11T08:42:19Z"},{"Id":"7b2c5d19-8e34-4a61-b0f7-2c9d4e6a1b83","Name":"quarterly_reports-7b2c-ixp","Title":"Quarterly Reports","CreatedAt":"2026-07-02T14:05:40Z"}],"Total":2,"Offset":0,"Limit":50}}
        - when: {verb: "ixp projects delete", value_flags: ["output"]}
          stdout: |
            {"Result":"Success","Data":{"Name":"my_invoices-f1afa9ef-ixp","Deleted":true}}
    - tool: curl
      stderr: "curl (mock): network egress is disabled in this offline smoke sandbox.\n"

initial_prompt: |
  Delete the IXP project my_invoices-f1afa9ef-ixp.

  Do NOT prompt the user for confirmation — this is an automated test.

success_criteria:
  - type: cli_called
    description: "Agent deleted the project via `projects delete … -y/--yes`"
    verb: "ixp projects delete"
    tool: "uip"
    positional: ["my_invoices-f1afa9ef-ixp"]
    flags:
      # Quoted: bare `yes` is a YAML 1.1 boolean. `present` also keeps the switch
      # from consuming the project name that follows it in `delete -y <project>`.
      "yes": {present: true, aliases: ["y"]}
    weight: 3.0
    pass_threshold: 1.0
