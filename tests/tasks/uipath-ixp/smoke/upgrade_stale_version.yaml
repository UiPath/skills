task_id: skill-ixp-upgrade-stale-version-smoke
description: >
  Smoke: the user asks to move a deployment back to a model version that is no
  longer deployable. Agent checks `projects list-models` to establish that
  version 9 is gone, and neither substitutes another version nor falls back to
  `create`. Whether it pre-flights or attempts the move and reports the 404 is
  advisory — a rejected upgrade is a documented no-op.
  Trap: `upgrade` is not a rollback path — versions leave the deployable list as
  a project retrains, so a deployment can be serving a version it can no longer
  be moved back to. The service answers 404 ModelVersionNotFoundError.

  Harness is unauthenticated; CLI calls fail offline. Grades that the agent goes
  to `list-models` to establish deployability rather than firing a write it cannot
  justify — command shape, not wire effect.
tags: [uipath-ixp, smoke, mode:build, lifecycle:setup]

run_limits:
  expected_turns: 6

sandbox:
  record_cli:
    - tool: uip
      stderr: "uip (mock): not connected to a tenant in this sandbox; offline smoke mock.
"
    - tool: curl
      stderr: "curl (mock): network egress is disabled in this offline smoke sandbox.
"

initial_prompt: |
  Orchestrator folder `3f0a91c7-1111-2222-3333-444455556666` serves model
  version 13 of IXP project `my_invoices-f1afa9ef-ixp`. An older model, version
  9, handled one of the fields better. Move that folder's deployment back to
  version 9, and tell me the outcome.

  Important:
  - The `uip` CLI is available but is NOT connected to a live IXP tenant in
    this environment. Commands will fail with auth errors — that is expected.
    Run each command once and move on. Do NOT retry or attempt to login.
  - Do NOT prompt the user for confirmation — this is an automated test.

success_criteria:
  - type: cli_called
    description: "Checked which versions are still deployable with `projects list-models`"
    verb: "ixp projects list-models"
    tool: "uip"
    positional: ["my_invoices-f1afa9ef-ixp"]
    weight: 1.5
    pass_threshold: 1.0

  # Substituting a version the user did not ask for is unambiguously wrong: the
  # request named version 9, and no other version is an acceptable consolation.
  # `any_of` enumerates the deployable versions rather than negating 9, since a
  # FlagMatch takes exactly one predicate and "not equal" is not one of them —
  # and it is the deployable versions that are the tempting substitutes.
  # Positive control: the list-models line above.
  - type: cli_called
    description: "Did NOT silently move the deployment to some OTHER version as a substitute"
    verb: "ixp deployments upgrade"
    tool: "uip"
    flags:
      version: {any_of: ["13", "14"]}
    min_count: 0
    max_count: 0
    weight: 1.5
    pass_threshold: 1.0

  # Nor is a rollback a fresh deploy: `create` on a folder that already hosts the
  # deployment is a 409, and version 9 is unavailable either way.
  - type: cli_called
    description: "Did NOT fall back to `deployments create` for the unavailable version"
    verb: "ixp deployments create"
    tool: "uip"
    min_count: 0
    max_count: 0
    weight: 1.5
    pass_threshold: 1.0

  # ADVISORY (pass_threshold: 0) — records pre-flight convention without docking.
  # Pre-flighting `list-models` and stopping is the tidier path, but attempting
  # the move once and reporting the 404 [ModelVersionNotFoundError] reaches the
  # same outcome: a rejected upgrade is a documented no-op that leaves
  # ModelVersion and DeployedAt untouched, so the cost is one harmless call and
  # the agent gets a precise service error to report. Grading this as a hard fail
  # would encode a preference as a correctness bar — the 2026-08-19 CI run scored
  # 0.50 on exactly that, having checked list-models FIRST and then attempted the
  # move anyway.
  - type: cli_called
    description: "Advisory: pre-flighted the version check instead of attempting a doomed upgrade"
    verb: "ixp deployments upgrade"
    tool: "uip"
    flags:
      version: "9"
    min_count: 0
    max_count: 0
    weight: 1.0
    pass_threshold: 0
