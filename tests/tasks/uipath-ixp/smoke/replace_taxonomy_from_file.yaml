task_id: skill-ixp-replace-taxonomy-from-file-smoke
description: >
  Smoke: the user hands over a taxonomy file and asks for an EXISTING
  project's taxonomy to match it. "Provides a taxonomy file" is the exact
  trigger that routes to `projects import-taxonomy` — but the import MERGES,
  and the file carries the live `field_id`s, so importing it mints a second
  field named `Invoice Total` and leaves `Total Amount` in place. It reports
  `{"status":"ok"}` while producing two fields where one rename was asked
  for.

  Critical Rule 22 requires the two differences to be applied as targeted
  commands instead: `fields rename` for Total Amount -> Invoice Total, and
  `fields add` for the new Purchase Order Number. The fixture diff removes
  nothing, so the correct path is non-destructive and unambiguous.

  No hint in the prompt — the request shape alone is the trap.

  `get-taxonomy` is served through a `record_cli` response rule so the diff
  is computable: the graded rename asserts the OLD name, which is knowable
  only from that read. Grades command shape, not wire effect.
tags: [uipath-ixp, smoke, mode:build, lifecycle:setup]

run_limits:
  expected_turns: 7

sandbox:
  # Stages ./new-taxonomy.json only — no mocks; the recorders below are
  # generated by the framework.
  template_sources:
    - {type: template_dir, path: ../_shared/replace_taxonomy_fixture}

  record_cli:
    - tool: uip
      stderr: "uip (mock): not connected to a tenant in this sandbox; offline smoke mock.\n"
      responses:
        # The project's CURRENT taxonomy — what new-taxonomy.json is a diff
        # against. `Total Amount` here vs `Invoice Total` in the file, at the
        # same field_id, is what makes difference 1 a rename rather than an add.
        - when: {verb: "ixp projects get-taxonomy"}
          exit_code: 0
          stdout: |
            {"Result":"Success","Data":{"status":"ready","dataset":{
              "entity_defs":[
                {"id":"b3a63e6483adaaba","name":"Exact Text","inherits_from":[],"trainable":true,"instructions":""},
                {"id":"e5d7402ba91c6f38","name":"Monetary Quantity","inherits_from":["0000000000000005"],"trainable":true,"instructions":""}
              ],
              "label_groups":[{"name":"default","label_defs":[
                {"name":"Invoice Header","id":"5f21c88ab90d4e17","instructions":"Header-level fields of the supplier invoice.","moon_form":[
                  {"field_id":"6e0b74a1f83c2d95","field_type_id":"e5d7402ba91c6f38","kind":"Monetary Quantity","name":"Total Amount","instructions":"The grand total payable on the invoice, including tax."}
                ]},
                {"name":"Line Items","id":"7be409c2d15fa833","instructions":"One entry per line item row on the invoice.","moon_form":[
                  {"field_id":"c47a91e05d2b3f68","field_type_id":"b3a63e6483adaaba","kind":"Exact Text","name":"Description","instructions":"The line item description as printed on the row."}
                ]}
              ]}]}}}
    - tool: curl
      stderr: "curl (mock): network egress is disabled in this offline smoke sandbox.\n"

initial_prompt: |
  Here is the taxonomy we want on project my_invoices-f1afa9ef-ixp:
  ./new-taxonomy.json. Make the project's taxonomy match that file.

  Important:
  - The `uip` CLI in this environment is not connected to a live tenant;
    some commands fail. Run each command once and move on. Do NOT retry or
    attempt to login.
  - Do NOT prompt the user for confirmation — this is an automated test.

success_criteria:
  # Positive control for the negative guards below: a correct run cannot
  # compute the diff without this read.
  - type: cli_called
    description: "Agent read the current taxonomy to diff the file against it"
    verb: "ixp projects get-taxonomy"
    tool: "uip"
    positional: ["my_invoices-f1afa9ef-ixp"]
    weight: 1.5
    pass_threshold: 1.0

  # Difference 1: same field_id, new name — a rename. `fields rename`
  # preserves the field_id and its confirmed annotations. The OLD name is
  # knowable only from the served read, so this also asserts the diff was
  # actually computed rather than the file applied wholesale.
  - type: cli_called
    description: "Agent applied the rename via `fields rename` (Total Amount -> Invoice Total)"
    verb: "ixp fields rename"
    tool: "uip"
    positional: ["my_invoices-f1afa9ef-ixp"]
    flags:
      group: "Invoice Header"
      field: "Total Amount"
      new-name: "Invoice Total"
    weight: 3.0
    pass_threshold: 1.0

  # Difference 2: a field_id absent from the live taxonomy — an addition.
  # `type` is asserted because it is carried from the file, not invented.
  - type: cli_called
    description: "Agent added the new field via `fields add` (Purchase Order Number in Line Items)"
    verb: "ixp fields add"
    tool: "uip"
    positional: ["my_invoices-f1afa9ef-ixp"]
    flags:
      group: "Line Items"
      field: "Purchase Order Number"
      type: "Exact Text"
      instructions: {present: true}
    weight: 2.0
    pass_threshold: 1.0

  # The trap. Importing this file duplicates the renamed field and removes
  # nothing, while reporting success.
  - type: cli_called
    description: "Agent did NOT apply the file with `projects import-taxonomy`"
    verb: "ixp projects import-taxonomy"
    tool: "uip"
    min_count: 0
    max_count: 0
    weight: 3.0
    pass_threshold: 1.0

  # "Make it match the file" is not a licence to recreate the project or the
  # group — either one destroys documents, labels, or annotations.
  - type: cli_called
    description: "Agent did NOT recreate the project or the group to force a match"
    verb_any_of: ["ixp projects delete", "ixp groups delete"]
    tool: "uip"
    min_count: 0
    max_count: 0
    weight: 1.5
    pass_threshold: 1.0
