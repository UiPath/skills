task_id: skill-ixp-confirm-model-version-smoke
description: >
  Smoke: agent pins the reviewed model version on confirm. Per Critical Rule 19,
  the ModelVersion from get-predictions must be passed to
  `confirm -m/--model-version` so a mid-review retrain can't stamp drifted values
  as ground truth.

  Harness is unauthenticated; CLI calls fail with auth errors. Grades command
  shape, not wire effect.
tags: [uipath-ixp, smoke, lifecycle:execute]

run_limits:
  expected_turns: 5

sandbox:
  mock_path_dirs: [mocks]
  template_sources:
    - {type: template_dir, path: ../_shared/mock_template}

initial_prompt: |
  Confirm the IXP model's predictions for document `doc-abc-123` on project
  `my_invoices-f1afa9ef-ixp`. They have been reviewed and are all correct.

  get-predictions returned (ModelVersion 7):
  - Invoice Number (field id `f-001`): `INV-2025-0042`
  - Invoice Date (field id `f-002`): `2025-01-15`
  - Total Amount (field id `f-003`): `$12,000.00`

  Important:
  - The `uip` CLI is available but is NOT connected to a live IXP tenant in this
    environment. Commands will fail with auth errors — that is expected. Run each
    command once and move on. Do NOT retry or attempt to login.
  - Do NOT prompt the user for confirmation — this is an automated test.

success_criteria:
  - type: file_matches_regex
    description: "Agent invoked `uip ixp labellings confirm <project> <document>`"
    path: "mocks/calls.log"
    pattern: >-
      (?m)^(?:uip\s+ixp\s+labellings\s+confirm\s+["']?my_invoices-f1afa9ef-ixp["']?\s+["']?doc-abc-123["']?\b.*)[^\r\n]*$
    weight: 1.0
    pass_threshold: 1.0

  - type: file_matches_regex
    description: "confirm pins the reviewed model version (-m/--model-version 7) — Rule 19"
    path: "mocks/calls.log"
    pattern: >-
      (?m)^(?:uip\s+ixp\s+labellings\s+confirm\b(?=.*(?:-m|--model-version)\s+["']?7\b).*)[^\r\n]*$
    weight: 2.0
    pass_threshold: 1.0
