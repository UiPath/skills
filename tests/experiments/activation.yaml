experiment_id: skill-activation-default
description: >
  Default experiment for skill activation evals. Each row presents a single
  user prompt; the agent decides whether to invoke a Skill. We measure the
  classification (precision / recall / F1) per skill.

defaults:
  # Activation is a short recognition decision per prompt — task_timeout is
  # sized to the turn budget (3 turns x 120s turn_timeout), not to a work loop.
  run_limits:
    # Activation is a recognition decision, not a work loop. We give the agent a
    # small turn budget (3) rather than a hard 1-turn cap; early-stop is armed
    # per-criterion via `stop_early: {on_pass: stop}` blocks on the stacked
    # skill_triggered criteria (coder_eval >= 0.9.5, see the task file — no
    # run-level arming exists anymore). Each instance arms its own decidable
    # polarity: the row's positive criterion (skill_name == expected_skill) arms
    # pass, the distractors arm fail. A positive row pass-stops the moment the
    # expected skill is engaged — turn 1, with the exact verdict a max_turns:1
    # cap would have produced — while the extra headroom no longer truncates a
    # correct invocation the model emits after a brief reasoning turn. A
    # negative row fail-stops on its first engagement; on a positive row a
    # wrong-skill engagement alone does NOT stop it (fail-stop is deferred
    # while the row's positive criterion is undecided), so misfire-only and
    # no-engagement rows run to the cap — keep it small. Polarities an instance
    # cannot decide are inert by design, so the same block serves every row.
    # See coder_eval "early stop on criterion".
    #
    # Note: unarmed runs (`-D run_limits.stop_early=false`) are the
    # authoritative ones for precision — a pass-stop can hide a later
    # distractor misfire, so armed-run precision is optimistic by comparison
    # (recall.yes is unaffected; see tasks/activation/README.md).
    max_turns: 3
    # Scaled with max_turns: a row that legitimately uses all 3 turns (a true
    # negative, or any unarmed run) must have wall-clock room for them — a
    # task_timeout below max_turns x turn_timeout silently drops the row from
    # every criterion denominator instead of grading it.
    task_timeout: 360
    turn_timeout: 120

  agent:
    # No agent.type / agent.model here: the runner passes both as CLI flags, which outrank this file.
    permission_mode: acceptEdits
    # Skill must be allowed so the agent can invoke a skill when it decides
    # to. Read/Write/Bash included so the agent isn't starved of basic tools
    # when it decides NOT to use Skill — removing them would bias the
    # decision toward "don't invoke".
    allowed_tools: [Skill, Bash, Read, Write, Edit, Glob, Grep]
    plugins:
      - type: local
        path: $SKILLS_REPO_PATH
    ignore_patterns: []

  # Drop <sandbox>/{node_modules,.npm-prefix,.venv} so preserved artifacts stay slim
  # and Node module resolution can't leak across concurrent sandboxes
  # (mirrors coder_eval #253 / sandbox isolation in #250 — MST-9674). Also drop
  # .agents: non-Claude harnesses (codex) stage the whole skills catalog there
  # per task, so cleaning it after each row keeps the run dir from ballooning
  # across the ~480-row activation sweep (no-op for claude, which never stages it).
  post_run:
    - command: "python -c \"import os, shutil; [(dirs.remove(d), shutil.rmtree(os.path.join(root, d), ignore_errors=True)) for root, dirs, _ in os.walk('.') for d in [x for x in list(dirs) if x in ('node_modules', '.npm-prefix', '.venv', '.agents')]]\""
      timeout: 30

variants:
  - variant_id: default
