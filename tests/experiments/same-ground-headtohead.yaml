experiment_id: same-ground-headtohead
description: "Campaign-only same-ground harness overlay; nightly.yaml remains unchanged"

defaults:
  run_limits:
    max_turns: 200
    task_timeout: 1200
    turn_timeout: 900

  sandbox:
    driver: docker
    docker:
      image: skills-image:sg1
      network: bridge
      env_passthrough_extra:
        - FULLPATH_LIVE
        - API_BACKEND
        - AWS_BEARER_TOKEN_BEDROCK
        - AWS_REGION
        - BEDROCK_MODEL
        - ANTHROPIC_API_KEY
        - ANTHROPIC_MODEL
        - NODE_AUTH_TOKEN
        - FLOW_SDK_PKG_VERSION
        - SKILLS_REPO_PATH
        - TASK_PARALLELISM
        - UIPATH_CLI_ENABLE_ENV_AUTH
        - UIPATH_CLI_AUTH_TOKEN
        - UIPATH_CLI_ORGANIZATION_NAME
        - UIPATH_CLI_ORGANIZATION_ID
        - UIPATH_CLI_TENANT_NAME
        - UIPATH_CLI_TENANT_ID
        - E2E_PROCESS_KEY
        - E2E_LONG_PROCESS_KEY
        - CODEX_API_KEY
        - CODEX_BASE_URL
        - UIPATH_CLI_DISABLE_VERSION_SYNC
        - DISABLE_TYPED_CONNECTORS
      extra_mounts:
        - ~/.uipath:/home/tmatup/.uipath:rw

  agent:
    type: claude-code
    permission_mode: acceptEdits
    model: eu.anthropic.claude-sonnet-5
    allowed_tools: ["Skill", "Bash", "Read", "Write", "Edit", "Glob", "Grep"]
    system_prompt: |
      You are a coding agent. Do not access files in sibling runs/* directories. Everywhere else is permitted.
    claude_settings:
      outputStyle: Proactive
    plugins:
      - type: "local"
        path: "$SKILLS_REPO_PATH"
    ignore_patterns: []

  post_run:
    - command: "find . -maxdepth 5 -type d \\( -name node_modules -o -name .npm-prefix -o -name .venv \\) -prune -exec rm -rf {} +"
      timeout: 30

variants:
  - variant_id: default
