experiment_id: same-ground-headtohead
description: "Campaign-only same-ground harness overlay; nightly.yaml remains unchanged"

defaults:
  run_limits:
    max_turns: 200
    task_timeout: 1200
    turn_timeout: 900

  sandbox:
    driver: docker
    docker:
      image: skills-image:sg1
      network: bridge
      # Restrict the agent-visible environment to the model route plus the
      # task/plugin paths. UiPath authentication comes only from the mounted
      # campaign cache; package/build credentials are never forwarded.
      env_passthrough:
        - HOME
        - API_BACKEND
        - AWS_BEARER_TOKEN_BEDROCK
        - AWS_REGION
        - BEDROCK_MODEL
        - CLAUDE_CODE_USE_BEDROCK
        - ANTHROPIC_MODEL
      env_passthrough_extra:
        - FULLPATH_LIVE
        - SKILLS_REPO_PATH
        - UIPATH_CLI_DISABLE_VERSION_SYNC
      extra_mounts:
        # coder-eval forwards the host HOME into this image, so the destination
        # must match that path until UiPath/coder_eval#100 makes HOME portable.
        - ${SG_UIPATH_HOME}:/home/tmatup/.uipath:rw
        - ${SG_EMPTY_SKILLS}:/home/tmatup/.uipath/.skills:ro

  agent:
    type: claude-code
    permission_mode: acceptEdits
    model: eu.anthropic.claude-sonnet-5
    allowed_tools: ["Skill", "Bash", "Read", "Write", "Edit", "Glob", "Grep"]
    system_prompt: |
      You are a coding agent. Do not access files in sibling runs/* directories. Everywhere else is permitted.
    claude_settings:
      outputStyle: Proactive
    plugins:
      - type: "local"
        path: "$SKILLS_REPO_PATH"
    ignore_patterns: []

  post_run:
    - command: "python -c \"import os, shutil; [(dirs.remove(d), shutil.rmtree(os.path.join(root, d), ignore_errors=True)) for root, dirs, _ in os.walk('.') for d in [x for x in list(dirs) if x in ('node_modules', '.npm-prefix', '.venv')]]\""
      timeout: 30

variants:
  - variant_id: default
