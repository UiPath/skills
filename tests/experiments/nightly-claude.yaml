experiment_id: skill-tests-nightly-claude
description: "Nightly cron config for the claude-code arm — nightly.yaml with claude-sized run_limits"

# This file is nightly.yaml with ONE delta: the default run_limits. The
# claude-code harness streams the whole session as one turn, so turn_timeout is
# its effective wall budget — and the shared 900/1200 default is sized for the
# codex arm (#3376: five tasks in two days died at a cap the same agent clears
# with a bigger budget, e.g. skill-bpmn-ai-decision-review-brownfield
# at 1223s vs 900, skill-bpmn-multi-city-weather killed at 905s — the flow
# suite has same-named twins with their own pins). Everything else MUST stay identical to nightly.yaml;
# tests/scripts/test_nightly_claude_experiment_sync.py fails the build on any
# other divergence, so edit nightly.yaml and let the guard tell you what to
# mirror here.

defaults:
  run_limits:
    max_turns: 200
    task_timeout: 2400
    # The whole claude-code session is one streamed turn; this is the arm's
    # wall budget. task_timeout stays above it (it silently caps the turn) with
    # room for grading.
    turn_timeout: 1800

  sandbox:
    driver: docker
    docker:
      image: skills-image:latest
      env_passthrough_extra:
        - SKILLS_REPO_PATH
        - MAESTRO_FLOW_SDK_SETUP
        - BEDROCK_MODEL
        - TASK_PARALLELISM
        - UIPATH_CLI_ENABLE_ENV_AUTH
        - UIPATH_CLI_AUTH_TOKEN
        - UIPATH_CLI_ORGANIZATION_NAME
        - UIPATH_CLI_ORGANIZATION_ID
        - UIPATH_CLI_TENANT_NAME
        - UIPATH_CLI_TENANT_ID
        - E2E_PROCESS_KEY
        - E2E_LONG_PROCESS_KEY
        - CODEX_API_KEY
        - CODEX_BASE_URL
      extra_mounts:
        - ~/.uipath:/.uipath:rw

  agent:
    # No agent.type / agent.model here: the runner passes both as CLI flags, which outrank this file.
    permission_mode: acceptEdits
    allowed_tools: ["Skill", "Bash", "Read", "Write", "Edit", "Glob", "Grep"]
    system_prompt: |
      You are a coding agent. Do not access files in sibling runs/* directories. Everywhere else is permitted.
    plugins:
      - type: "local"
        path: "$SKILLS_REPO_PATH"
    ignore_patterns: []

  checker_context:
    api_route:
      route: litellm
      model: gpt-5.6-luna
      params:
        api_version: "2024-05-01"
        num_retries: 5
      env_params:
        api_base: CODEX_BASE_URL
        api_key: CODEX_API_KEY

  # Leading `:;` and single line are load-bearing. coder-eval runs this through
  # create_subprocess_shell, which is cmd.exe on the Windows split: cmd rejects
  # `if [ ... ]` (`"${MAESTRO_FLOW_SDK_SETUP:-0}" was unexpected at this time.`,
  # exit 1) and every task in the split ERRORs at setup. A line starting with `:`
  # is a label to cmd — ignored, exit 0 — and a no-op to sh, which then runs the
  # rest. Newlines would put the sh code back on cmd's first line, so keep it
  # one line and never reformat this into a block scalar.
  pre_run:
    - command: ':; if [ "${MAESTRO_FLOW_SDK_SETUP:-0}" = "1" ]; then bash "$SKILLS_REPO_PATH/tests/scripts/stage-preview-sdk-workspace.sh"; fi'
      timeout: 30

  # Sandbox cleanup between tasks. Tasks that upload Studio Web solutions
  # wire cleanup_solutions.py into their own post_run — that must run before
  # this step (still needs npm-installed CLIs).
  post_run:
    - command: "find . -maxdepth 5 -type d \\( -name node_modules -o -name .npm-prefix -o -name .venv \\) -prune -exec rm -rf {} +"
      timeout: 30

variants:
  - variant_id: default
