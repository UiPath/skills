experiment_id: autopilot-golden
description: >
  Autopilot GA golden scenarios: Autopilot through the Delegate SDK agent
  (coder_eval_uipath plugin) on GPT-5.6 Luna at xhigh reasoning effort, with
  8 replicates per task to match the release checklist's "6 of 8 runs" bar.
  Setup and run command: tests/README.md, Experiment Configs.

defaults:
  repeats: 8

  run_limits:
    # turn_timeout is the agent's whole budget on a single-iteration task, and xhigh effort
    # is slower than default.yaml's 900s allows; task_timeout leaves room for grading.
    turn_timeout: 1800
    task_timeout: 2400

  sandbox:
    driver: tempdir

  agent:
    type: delegate-sdk
    sdk_options:
      effort: xhigh
    plugins:
      - type: "local"
        path: "$SKILLS_REPO_PATH"

  checker_context:
    api_route:
      route: litellm
      model: gpt-5.6-luna
      params:
        api_version: "2024-05-01"
        num_retries: 5
      env_params:
        api_base: CODEX_BASE_URL
        api_key: CODEX_API_KEY

  post_run:
    - command: "find . -maxdepth 5 -type d \\( -name node_modules -o -name .npm-prefix -o -name .venv \\) -prune -exec rm -rf {} +"
      timeout: 30

variants:
  - variant_id: luna-xhigh
    description: "GPT-5.6 Luna, xhigh effort"
    agent:
      model: gpt-5-6-luna
