experiment_id: skill-tests-default
description: "Default config — tempdir, full lifecycle, devs locally / ad-hoc runs"

defaults:
  run_limits:
    max_turns: 200
    task_timeout: 1200
    # A single turn can chain several cold-runner `uip rpa` calls (each 30-90s);
    # per-turn budget tracks the slowest external call, not the suite's intent.
    turn_timeout: 900

  sandbox:
    driver: tempdir

  agent:
    # No agent.type / agent.model here: the runner passes both as CLI flags, which outrank this file.
    permission_mode: acceptEdits
    allowed_tools: ["Skill", "Bash", "Read", "Write", "Edit", "Glob", "Grep"]
    system_prompt: |
      You are a coding agent. Do not access files in sibling runs/* directories. Everywhere else is permitted.
    plugins:
      - type: "local"
        path: "$SKILLS_REPO_PATH"
    ignore_patterns: []

  checker_context:
    api_route:
      route: litellm
      model: gpt-5.6-luna
      params:
        api_version: "2024-05-01"
      env_params:
        api_base: CODEX_BASE_URL
        api_key: CODEX_API_KEY

  # Sandbox cleanup between tasks. Tasks that upload Studio Web solutions
  # wire cleanup_solutions.py into their own post_run — that must run before
  # this step (still needs npm-installed CLIs).
  post_run:
    - command: "find . -maxdepth 5 -type d \\( -name node_modules -o -name .npm-prefix -o -name .venv \\) -prune -exec rm -rf {} +"
      timeout: 30

variants:
  - variant_id: default
