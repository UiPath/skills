parameters:
  sonarServiceConnection: ''
  # Empty = Microsoft-hosted ubuntu-latest (ships Node, Python and JDK 21).
  poolName: ''
  # Advisory like the nightly FOSSA scan: a failed quality gate does not fail the run.
  blockOnQualityGate: false

# Kept out of ci.security.fossa.yml on purpose: release-gate.yml reuses that
# template, and a publish must not wait on Sonar.
stages:
  - stage: Quality_Sonar
    displayName: SonarCloud
    dependsOn: []
    jobs:
      - job: Coverage
        displayName: Tests with coverage + SonarCloud analysis
        pool:
          ${{ if eq(parameters.poolName, '') }}:
            vmImage: ubuntu-latest
          ${{ else }}:
            name: ${{ parameters.poolName }}
        steps:
          - checkout: self
            fetchDepth: 0  # Sonar's new-code detection reads SCM blame
          # sonar-project.properties reads the key from the environment. Secret
          # variables are not mapped to env, so it must be a plain variable.
          - bash: |
              if [ -z "${SONAR_PROJECT_KEY:-}" ]; then
                echo "##vso[task.logissue type=error]Pipeline variable SONAR_PROJECT_KEY is not set (or is marked secret). Add it under Pipelines > UiPath.skills > Edit > Variables."
                exit 1
              fi
            displayName: Check SONAR_PROJECT_KEY is set
          - task: UseNode@1
            displayName: Use Node 22.x
            inputs:
              version: '22.x'
          - task: UsePythonVersion@0
            displayName: Use Python 3.13
            inputs:
              versionSpec: '3.13'
          - script: python -m pip install --disable-pip-version-check coverage pytest pyyaml
            displayName: Install coverage, pytest, pyyaml
          - template: Sonar/prepare-sonar-coverage.yml@sonar
            parameters:
              configFile: sonar-project.properties
              serviceConnectionName: ${{ parameters.sonarServiceConnection }}
          # A failing suite still leaves both reports behind; keep going so the
          # analysis uploads what was measured.
          - script: node scripts/run-coverage.mjs
            displayName: Run tests with coverage
            continueOnError: true
            env:
              PYTHON: python
          - template: Sonar/analyze-sonar-coverage.yml@sonar
          - template: Sonar/publish-sonar-coverage.yml@sonar
            parameters:
              continueOnError: ${{ not(parameters.blockOnQualityGate) }}
