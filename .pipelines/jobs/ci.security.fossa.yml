parameters:
  azureServiceConnection: ''
  poolName: 'Security-Linux'
  blockOnIssue: false

stages:
  - stage: Security_FOSSA
    displayName: FOSSA
    dependsOn: []
    jobs:
      - job: Skills
        pool: ${{ parameters.poolName }}
        steps:
          - checkout: self
          # No Key Vault read here: from uipath.security.fossa.3.2.5 the template
          # signs in to FOSSA through the FOSSA-OIDC workload identity connection.
          # skipToggleKvStep keeps the job off the devopsprodauthtokenswekv vault.
          - template: Security/fossa.steps.yml@fossa
            parameters:
              OS: 'linux'
              azureSubscription: ${{ parameters.azureServiceConnection }}
              skipToggleKvStep: true
              blockOnIssue: ${{ parameters.blockOnIssue }}
              FOSSAFlags: '--branch "$(Build.SourceBranch)" --revision "$(Build.SourceVersion)-$(Build.BuildId)" --project "Skills" --config ".pipelines/jobs/fossa-skills.yml" --without-default-filters --debug'
              FOSSATestFlags: '--revision "$(Build.SourceVersion)-$(Build.BuildId)" --project "Skills"'
