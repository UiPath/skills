name: $(Date:yyMMdd)$(Rev:.r)-sec

trigger: none

pr: none

schedules:
  - cron: "0 2 * * *"
    displayName: Nightly security scan
    branches:
      include:
        - main
    always: true

parameters:
  - name: enableFossa
    displayName: Run FOSSA scan
    type: boolean
    default: true
  - name: azureServiceConnection
    displayName: Azure connection pointing to Internal-Production-EA
    type: string
    default: 'InternalProdEAServiceConnection'
  - name: poolName
    displayName: Agent pool
    type: string
    default: 'Security-Linux'
  - name: blockOnIssue
    displayName: Fail the run when FOSSA finds issues (release gate)
    type: boolean
    default: false
  - name: enableSonar
    displayName: Run SonarCloud analysis with test coverage
    type: boolean
    default: true
  - name: sonarServiceConnection
    displayName: SonarCloud service connection (ADO project skills)
    type: string
    default: 'SonarCloud-Skills'
  # A single space, trimmed below: an empty string default makes the queue
  # dialog demand a value.
  - name: sonarPoolName
    displayName: Agent pool for the Sonar job (blank = Microsoft-hosted ubuntu-latest)
    type: string
    default: ' '

resources:
  repositories:
    - repository: fossa
      type: github
      name: UiPath/AzurePipelinesTemplates
      ref: refs/tags/uipath.security.fossa.3.1.1
      endpoint: github.com_UiPath
    - repository: sonar
      type: github
      name: UiPath/AzurePipelinesTemplates
      ref: refs/tags/uipath.sonar-coverage.4.0.1
      endpoint: github.com_UiPath

stages:
  - ${{ if eq(parameters.enableFossa, true) }}:
      - template: jobs/ci.security.fossa.yml
        parameters:
          azureServiceConnection: ${{ parameters.azureServiceConnection }}
          poolName: ${{ parameters.poolName }}
          blockOnIssue: ${{ parameters.blockOnIssue }}
  - ${{ if eq(parameters.enableSonar, true) }}:
      - template: jobs/ci.quality.sonar.yml
        parameters:
          sonarServiceConnection: ${{ parameters.sonarServiceConnection }}
          poolName: ${{ trim(parameters.sonarPoolName) }}
